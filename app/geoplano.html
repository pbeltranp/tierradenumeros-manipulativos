<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Geoplano cuadrado · manipulativo virtual</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
       font-size:14px;color:#2b2f36;background:#fff;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #app{display:flex;height:100%;width:100%}

  #side{width:180px;flex:0 0 180px;background:#f4f5f7;border-right:1px solid #dfe2e7;
        overflow-y:auto;padding:10px 10px 24px}
  #side h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8a919c;margin:14px 0 7px;font-weight:600}
  #side h2:first-child{margin-top:2px}
  #swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
  .sw{width:100%;aspect-ratio:1;min-height:20px;border-radius:5px;border:1px solid rgba(0,0,0,.16);cursor:pointer;padding:0}
  .sw.on{outline:2px solid #2f62a8;outline-offset:1px}
  #custom{margin-top:7px;display:flex;align-items:center;gap:6px;font-size:11px;color:#6b7280}
  #custom input{width:26px;height:24px;padding:0;border:1px solid #d5d9e0;border-radius:5px;background:none;cursor:pointer}
  .act{display:block;width:100%;text-align:left;border:1px solid #e3e6eb;background:#fff;border-radius:7px;
       padding:6px 9px;margin-bottom:4px;font-size:12.5px;color:#3d4450;cursor:pointer}
  .act:hover:not(:disabled){background:#f0f2f5;border-color:#c8cdd6}
  .act:disabled{opacity:.42;cursor:default}
  .act kbd{float:right;font:inherit;font-size:10.5px;color:#9aa1ab}
  .cordbox{border:1px solid #d9e6d5;background:#f5faf3;border-radius:8px;padding:8px;margin-bottom:6px}
  .cordbox .fila{display:grid;grid-template-columns:30px 1fr 30px;gap:5px;align-items:center}
  .cordbox button{border:1px solid #cfe0ca;background:#fff;border-radius:6px;padding:5px 0;
                  font-size:13px;color:#2f6b34;cursor:pointer;width:100%}
  .cordbox button:hover{background:#eef6ec}
  .cordbox .val{text-align:center;font-size:14px;font-weight:700;color:#2f6b34}
  .cordbox .tit{font-size:10.5px;color:#6f8a6d;text-align:center;margin-bottom:5px}
  .cordbox .modo{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:7px}
  .cordbox .modo button{font-size:11px;padding:5px 0}
  .cordbox .modo button.on{background:#2f6b34;border-color:#2f6b34;color:#fff}
  #cordlong.oculto{display:none}
  #medidas{font-size:11.5px;color:#6b7280;line-height:1.65;margin-top:12px;border-top:1px solid #e3e6eb;padding-top:9px}
  #medidas b{color:#2b2f36}
  #medidas .g{color:#9aa1ab}
  .note{font-size:10.5px;line-height:1.45;color:#8a919c;margin-top:12px}

  main{flex:1;display:flex;flex-direction:column;min-width:0}
  #toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:7px 9px;
           border-bottom:1px solid #dfe2e7;background:#fafbfc}
  .btn{border:1px solid #d5d9e0;background:#fff;border-radius:7px;padding:5px 9px;font-size:12.5px;
       color:#3d4450;cursor:pointer;display:inline-flex;align-items:center;gap:5px;line-height:1.2}
  .btn:hover{background:#f0f2f5}
  .btn.on{background:#2f62a8;border-color:#2f62a8;color:#fff}
  .btn.on:hover{background:#2a589a}
  .sep{width:1px;height:20px;background:#dfe2e7;margin:0 3px}
  .chk{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#4a515c;cursor:pointer;padding:3px 6px;border-radius:6px}
  .chk:hover{background:#eff1f4}
  .chk input{margin:0;cursor:pointer}
  select{border:1px solid #d5d9e0;border-radius:7px;padding:5px 6px;font-size:12.5px;background:#fff;color:#3d4450}
  #avanzado{display:none;align-items:center;gap:5px}
  #avanzado.show{display:inline-flex}
  #stage{position:relative;flex:1;min-height:0;background:#fff}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #hint{position:absolute;left:10px;bottom:10px;background:rgba(28,32,38,.82);color:#fff;font-size:11.5px;
        padding:5px 10px;border-radius:14px;pointer-events:none;max-width:calc(100% - 20px)}
  #info{position:absolute;right:10px;top:10px;width:286px;background:#fff;border:1px solid #dfe2e7;
        border-radius:10px;padding:11px 13px;font-size:11.5px;line-height:1.55;color:#4a515c;
        box-shadow:0 6px 22px rgba(20,25,35,.12);display:none}
  #info.show{display:block}
  #info b{color:#2b2f36}
  #info a{color:#2f62a8}
  #info .lic{margin-top:11px;padding-top:8px;border-top:1px solid #eef0f3;font-size:10.5px;
             line-height:1.5;color:#8a919c}
  #drop{position:absolute;inset:0;background:rgba(47,98,168,.08);border:2px dashed #2f62a8;
        display:none;align-items:center;justify-content:center;font-size:15px;color:#2f62a8;font-weight:600}
  #drop.show{display:flex}
  @media (max-width:640px){
    #side{width:130px;flex:0 0 130px;padding:8px 6px}
    #swatches{grid-template-columns:repeat(4,1fr)}
    .btn{padding:5px 7px;font-size:12px}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <h2>Color</h2>
    <div id="swatches"></div>
    <div id="custom"><input type="color" id="cpick" value="#d23b30">otro</div>

    <h2>Cordel</h2>
    <div class="cordbox">
      <div class="modo">
        <button id="mlibre" class="on" title="El cordel da lo que haga falta; la figura se termina con doble clic en una clavija">libre</button>
        <button id="mfija" title="El cordel tiene una longitud fija que no se puede superar">longitud fija</button>
      </div>
      <div id="cordlong">
        <div class="tit">longitud del cordel</div>
        <div class="fila">
          <button id="lmenos" title="Acortar el cordel">−</button>
          <span class="val" id="lval">12</span>
          <button id="lmas" title="Alargar el cordel">+</button>
        </div>
      </div>
    </div>

    <h2>Figura seleccionada</h2>
    <button class="act" id="pintar" disabled>Pintar<kbd>P</kbd></button>
    <button class="act" id="duplicar" disabled>Duplicar<kbd>D</kbd></button>
    <button class="act" id="cerrar" disabled>Abrir / cerrar<kbd>C</kbd></button>
    <button class="act" id="borrar" disabled>Quitar<kbd>Supr</kbd></button>

    <div id="medidas"></div>
    <div class="note">La goma se estira lo que haga falta. El cordel, en modo de longitud fija, no.</div>
  </aside>

  <main>
    <div id="toolbar">
      <button class="btn on" data-tool="goma" title="Poner una goma elástica (1)">◯ Goma</button>
      <button class="btn" data-tool="cordel" title="Poner un cordel de longitud fija (2)">～ Cordel</button>
      <button class="btn" data-tool="move" title="Mover vértices y figuras (3)">✥ Mover</button>
      <button class="btn" data-tool="fill" title="Cambiar el color de una figura (4)">◍ Color</button>
      <button class="btn" data-tool="del" title="Quitar figuras (5)">✕ Quitar</button>
      <span class="sep"></span>
      <button class="btn" id="undo" title="Deshacer (Ctrl+Z)">↶</button>
      <label class="chk" title="Muestra las medidas de las figuras"><input type="checkbox" id="avz">Comprobaciones</label>
      <span id="avanzado">
        <label class="chk" title="Escribe el área y el perímetro junto a cada figura"><input type="checkbox" id="showmed">Medidas en el tablero</label>
        <label class="chk" title="Cuenta los puntos del borde y del interior, para el teorema de Pick"><input type="checkbox" id="showpick">Pick</label>
      </span>
      <span class="sep"></span>
      <button class="btn" id="zoomout">−</button>
      <button class="btn" id="zoomin">+</button>
      <button class="btn" id="fit">Ajustar</button>
      <span class="sep"></span>
      <button class="btn" id="save" title="Descargar en un archivo">⤓ Guardar</button>
      <button class="btn" id="open" title="Abrir un archivo guardado">⤒ Abrir</button>
      <button class="btn" id="add" title="Añadir el contenido de un archivo a lo que ya hay">＋</button>
      <button class="btn" id="png" title="Descargar imagen">⤓ PNG</button>
      <button class="btn" id="clear">Limpiar</button>
      <button class="btn" id="help">?</button>
      <input type="file" id="fileIn" accept=".json,application/json" style="display:none">
    </div>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="hint"></div>
      <div id="info"></div>
      <div id="drop">Suelta aquí el archivo del geoplano</div>
    </div>
  </main>
</div>

<script>
"use strict";
(function(){

/* =========================================================================
   1. ESTADO
   Una figura es una goma o un cordel tendido sobre los clavos del geoplano.
   Los clavos están en las coordenadas enteras 0..N-1.
   ========================================================================= */
var LIM=150;                    // el geoplano no es infinito, pero da de sobra
var PASO=46;                    // px entre clavos a zoom 1
var figuras=[], nid=1, sel=null;
var tool='goma', color='#d23b30', cordL=12, cordFijo=false;
var view={x:0,y:0,z:1};
var drag=null, borrador=null, undoStack=[], importMode='replace';
var opt={med:0, pick:0};

var COLORS=['#d23b30','#e8890c','#e3b90b','#4f9e3f','#2f8f86','#2f62a8',
            '#6c4bb6','#c2418c','#8d6e5a','#7c8794','#2b2f36','#ffffff'];

var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var stage=document.getElementById('stage');
var hintEl=document.getElementById('hint'), infoEl=document.getElementById('info');
var dropEl=document.getElementById('drop'), medEl=document.getElementById('medidas');
var flashMsg=null, flashT=0;

function byId(id){ for(var i=0;i<figuras.length;i++) if(figuras[i].id===id) return figuras[i]; return null; }
function pushUndo(){ undoStack.push(JSON.stringify({f:figuras,n:nid})); if(undoStack.length>80) undoStack.shift(); }
function doUndo(){ if(!undoStack.length){ flash('No hay nada que deshacer'); return; }
  var st=JSON.parse(undoStack.pop()); figuras=st.f; nid=st.n; sel=null; borrador=null; draw(); }
function flash(m){ flashMsg=m; flashT=Date.now(); draw(); setTimeout(draw,2200); }

/* =========================================================================
   2. MEDIDAS
   ========================================================================= */
function dist(a,b){ return Math.hypot(b.x-a.x, b.y-a.y); }
function mcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ var t=b; b=a%b; a=t; } return a; }

function longitud(f){                     // longitud de cuerda usada
  var s=0, p=f.pts;
  for(var i=0;i+1<p.length;i++) s+=dist(p[i],p[i+1]);
  if(f.cerrada && p.length>2) s+=dist(p[p.length-1],p[0]);
  return s;
}
function area(f){                          // fórmula del zapatero
  if(!f.cerrada || f.pts.length<3) return 0;
  var p=f.pts, s=0;
  for(var i=0;i<p.length;i++){ var q=p[(i+1)%p.length]; s += p[i].x*q.y - q.x*p[i].y; }
  return Math.abs(s)/2;
}
function puntosBorde(f){                   // clavos que pisa el contorno
  if(!f.cerrada || f.pts.length<3) return 0;
  var p=f.pts, s=0;
  for(var i=0;i<p.length;i++){ var q=p[(i+1)%p.length];
    s += mcd(q.x-p[i].x, q.y-p[i].y); }
  return s;
}
function enSegmento(pt,a,b){
  var cruz=(b.x-a.x)*(pt.y-a.y)-(b.y-a.y)*(pt.x-a.x);
  if(cruz!==0) return false;
  return pt.x>=Math.min(a.x,b.x) && pt.x<=Math.max(a.x,b.x) &&
         pt.y>=Math.min(a.y,b.y) && pt.y<=Math.max(a.y,b.y);
}
function enBorde(f,pt){
  var p=f.pts;
  for(var i=0;i<p.length;i++){ var q=p[(i+1)%p.length];
    if(i+1===p.length && !f.cerrada) break;
    if(enSegmento(pt,p[i],q)) return true; }
  return false;
}
function dentro(f,pt){                     // lanzamiento de rayo, sin contar el borde
  if(enBorde(f,pt)) return false;
  var p=f.pts, d=false;
  for(var i=0,j=p.length-1;i<p.length;j=i++){
    if(((p[i].y>pt.y)!==(p[j].y>pt.y)) &&
       (pt.x < (p[j].x-p[i].x)*(pt.y-p[i].y)/(p[j].y-p[i].y)+p[i].x)) d=!d;
  }
  return d;
}
function puntosInteriores(f){              // se cuentan de verdad, uno a uno
  if(!f.cerrada || f.pts.length<3) return 0;
  var xs=f.pts.map(function(p){return p.x;}), ys=f.pts.map(function(p){return p.y;});
  var x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs);
  var y0=Math.min.apply(null,ys), y1=Math.max.apply(null,ys);
  var n=0;
  for(var x=x0;x<=x1;x++) for(var y=y0;y<=y1;y++) if(dentro(f,{x:x,y:y})) n++;
  return n;
}
function num(v){                            // 3 -> "3" ; 3.1415 -> "3,14"
  var r=Math.round(v*100)/100;
  return (Math.abs(r-Math.round(r))<1e-9 ? String(Math.round(r)) : r.toFixed(2)).replace('.',',');
}

/* =========================================================================
   3. FIGURAS
   ========================================================================= */
function nueva(tipo,col,L){
  var f={id:nid++, tipo:tipo, pts:[], cerrada:false, col:col||color};
  if(tipo==='cordel' && L) f.L=L;           // sin L, el cordel es libre
  return f;
}
function limitado(f){ return f.tipo==='cordel' && typeof f.L==='number' && isFinite(f.L); }
function cabe(f,extra){                     // ¿el cordel da de sí para un tramo más?
  if(!limitado(f)) return true;
  return longitud(f)+extra <= f.L+1e-9;
}
function sobrante(f){ return limitado(f) ? f.L-longitud(f) : Infinity; }

function clavoEn(wp){
  var x=Math.round(wp.x/PASO), y=Math.round(wp.y/PASO);
  if(Math.abs(x)>LIM||Math.abs(y)>LIM) return null;
  var d=Math.hypot(wp.x-x*PASO, wp.y-y*PASO);
  return d<=PASO*0.42 ? {x:x,y:y} : null;
}
function figuraEn(wp){
  for(var i=figuras.length-1;i>=0;i--){
    var f=figuras[i], p=f.pts;
    for(var j=0;j<p.length;j++){
      var q=p[(j+1)%p.length];
      if(j+1===p.length && !f.cerrada) break;
      if(distSeg(wp,{x:p[j].x*PASO,y:p[j].y*PASO},{x:q.x*PASO,y:q.y*PASO})<=10) return f;
    }
  }
  return null;
}
function verticeEn(wp){
  for(var i=figuras.length-1;i>=0;i--){
    var f=figuras[i];
    for(var j=0;j<f.pts.length;j++){
      if(Math.hypot(wp.x-f.pts[j].x*PASO, wp.y-f.pts[j].y*PASO)<=13) return {f:f,i:j};
    }
  }
  return null;
}
function distSeg(p,a,b){
  var vx=b.x-a.x, vy=b.y-a.y, L=vx*vx+vy*vy;
  var t=L?((p.x-a.x)*vx+(p.y-a.y)*vy)/L:0; t=Math.max(0,Math.min(1,t));
  return Math.hypot(p.x-(a.x+t*vx), p.y-(a.y+t*vy));
}

/* =========================================================================
   4. DIBUJO
   ========================================================================= */
function w2s(p){ return {x:p.x*view.z+view.x, y:p.y*view.z+view.y}; }
function s2w(p){ return {x:(p.x-view.x)/view.z, y:(p.y-view.y)/view.z}; }
function resize(){
  var r=stage.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  cv.width=Math.max(1,Math.round(r.width*dpr)); cv.height=Math.max(1,Math.round(r.height*dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0); draw();
}
function conAlfa(hex,a){
  var h=(hex||'#d23b30').replace('#',''); if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return 'rgba('+parseInt(h.substr(0,2),16)+','+parseInt(h.substr(2,2),16)+','+parseInt(h.substr(4,2),16)+','+a+')';
}
/* Los clavos se pintan por toda la zona visible: al alejarse con el zoom siguen
   apareciendo. El geoplano tiene un límite amplio (±LIM), no es infinito. */
function rangoVisible(W,H){
  var a=s2w({x:0,y:0}), b=s2w({x:W,y:H});
  return {x0:Math.max(-LIM,Math.floor(a.x/PASO)-1), x1:Math.min(LIM,Math.ceil(b.x/PASO)+1),
          y0:Math.max(-LIM,Math.floor(a.y/PASO)-1), y1:Math.min(LIM,Math.ceil(b.y/PASO)+1)};
}
function drawTablero(c,r){
  var s=PASO*view.z; if(s<7) return;
  var rad=Math.min(4.2/view.z, PASO*0.13);
  c.save();
  for(var x=r.x0;x<=r.x1;x++) for(var y=r.y0;y<=r.y1;y++){
    var cx=x*PASO, cy=y*PASO;
    c.beginPath(); c.arc(cx,cy,rad,0,6.2832);
    c.fillStyle='#aab2be'; c.fill();
    if(s>18){ c.beginPath(); c.arc(cx-rad*0.28,cy-rad*0.28,rad*0.34,0,6.2832);
      c.fillStyle='#e2e6ec'; c.fill(); }
  }
  c.restore();
}
function cajaFiguras(){
  if(!figuras.length) return null;
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  figuras.forEach(function(f){ f.pts.forEach(function(p){
    x0=Math.min(x0,p.x); x1=Math.max(x1,p.x); y0=Math.min(y0,p.y); y1=Math.max(y1,p.y); }); });
  return {x0:x0,y0:y0,x1:x1,y1:y1};
}
function trazo(c,f){
  var p=f.pts; if(!p.length) return;
  c.beginPath();
  c.moveTo(p[0].x*PASO, p[0].y*PASO);
  for(var i=1;i<p.length;i++) c.lineTo(p[i].x*PASO, p[i].y*PASO);
  if(f.cerrada && p.length>2) c.closePath();
}
function drawFigura(c,f,seleccionada){
  var p=f.pts; if(!p.length) return;
  c.save();
  if(f.cerrada && p.length>2){ trazo(c,f); c.fillStyle=conAlfa(f.col,0.14); c.fill('evenodd'); }
  if(f.tipo==='goma'){
    trazo(c,f);
    c.lineWidth=7; c.lineJoin='round'; c.lineCap='round';
    c.strokeStyle=conAlfa(f.col,0.30); c.stroke();
    trazo(c,f);
    c.lineWidth=4.2; c.strokeStyle=f.col; c.stroke();
  } else {
    trazo(c,f);
    c.lineWidth=3.4; c.lineJoin='round'; c.lineCap='round';
    c.strokeStyle=f.col; c.stroke();
    trazo(c,f);
    c.lineWidth=1.2; c.strokeStyle='rgba(255,255,255,.55)'; c.setLineDash([4,4]); c.stroke();
    c.setLineDash([]);
    p.forEach(function(q){                       // nudos del cordel
      c.beginPath(); c.arc(q.x*PASO,q.y*PASO,3.4,0,6.2832);
      c.fillStyle=f.col; c.fill();
    });
  }
  if(seleccionada){
    p.forEach(function(q){
      c.beginPath(); c.arc(q.x*PASO,q.y*PASO,7,0,6.2832);
      c.lineWidth=2; c.strokeStyle='#2f62a8'; c.stroke();
    });
  }
  c.restore();
  if(opt.med && f.cerrada && p.length>2){
    var cx=0, cy=0;
    p.forEach(function(q){ cx+=q.x; cy+=q.y; });
    cx=cx/p.length*PASO; cy=cy/p.length*PASO;
    var txt='A '+num(area(f))+'  P '+num(longitud(f));
    c.save();
    c.font='700 13px -apple-system,Segoe UI,Roboto,sans-serif';
    c.textAlign='center'; c.textBaseline='middle';
    var w=c.measureText(txt).width+12;
    c.fillStyle='rgba(255,255,255,.9)';
    c.beginPath(); c.rect(cx-w/2,cy-11,w,22); c.fill();
    c.lineWidth=1; c.strokeStyle=conAlfa(f.col,0.5); c.stroke();
    c.fillStyle='#3a4048'; c.fillText(txt,cx,cy);
    c.restore();
  }
}
function drawPick(c){
  if(!opt.pick || sel==null) return;
  var f=byId(sel); if(!f || !f.cerrada || f.pts.length<3) return;
  var xs=f.pts.map(function(p){return p.x;}), ys=f.pts.map(function(p){return p.y;});
  var x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs);
  var y0=Math.min.apply(null,ys), y1=Math.max.apply(null,ys);
  c.save();
  for(var x=x0;x<=x1;x++) for(var y=y0;y<=y1;y++){
    var pt={x:x,y:y};
    if(enBorde(f,pt)){ c.beginPath(); c.arc(x*PASO,y*PASO,6,0,6.2832);
      c.fillStyle='#e8890c'; c.fill(); }
    else if(dentro(f,pt)){ c.beginPath(); c.arc(x*PASO,y*PASO,6,0,6.2832);
      c.fillStyle='#2f8f86'; c.fill(); }
  }
  c.restore();
}
function escena(c,W,H,paraExportar,rangoFijo){
  c.save();
  c.translate(view.x,view.y); c.scale(view.z,view.z);
  drawTablero(c, rangoFijo || rangoVisible(W,H));
  figuras.forEach(function(f){ drawFigura(c,f,!paraExportar && f.id===sel); });
  if(!paraExportar){
    drawPick(c);
    if(borrador && borrador.pts.length){
      drawFigura(c,borrador,false);
      if(borrador.prev){
        var u=borrador.pts[borrador.pts.length-1];
        c.save(); c.setLineDash([6,5]); c.lineWidth=2;
        c.strokeStyle=conAlfa(borrador.col,0.7);
        c.beginPath(); c.moveTo(u.x*PASO,u.y*PASO);
        c.lineTo(borrador.prev.x*PASO, borrador.prev.y*PASO); c.stroke(); c.restore();
      }
    }
  }
  c.restore();
}
function draw(){
  var W=cv.width/(window.devicePixelRatio||1), H=cv.height/(window.devicePixelRatio||1);
  ctx.clearRect(0,0,W,H); ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  escena(ctx,W,H,false);
  updateUI();
}

/* =========================================================================
   5. INTERACCIÓN
   ========================================================================= */
function evPos(e){ var r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }

function terminaBorrador(){
  if(borrador && borrador.pts.length>=2){ pushUndo(); delete borrador.prev; figuras.push(borrador); sel=borrador.id; }
  borrador=null;
}
function onDown(e){
  cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
  var sp=evPos(e), wp=s2w(sp), clavo=clavoEn(wp);

  if(tool==='goma'||tool==='cordel'){
    if(!clavo){ terminaBorrador(); draw(); return; }
    if(!borrador){ borrador=nueva(tool,color,(tool==='cordel'&&cordFijo)?cordL:0); borrador.pts.push(clavo); draw(); return; }
    var ult=borrador.pts[borrador.pts.length-1];
    var pri=borrador.pts[0];
    if(clavo.x===ult.x && clavo.y===ult.y){ terminaBorrador(); draw(); return; }
    if(borrador.pts.length>=3 && clavo.x===pri.x && clavo.y===pri.y){       // cerrar
      var cierre=dist(ult,pri);
      if(!cabe(borrador,cierre)){ flash('El cordel no llega para cerrar la figura'); draw(); return; }
      borrador.cerrada=true; terminaBorrador(); draw(); return;
    }
    var tramo=dist(ult,clavo);
    if(!cabe(borrador,tramo)){
      flash('El cordel no llega hasta ahí');
      draw(); return;
    }
    borrador.pts.push(clavo); draw(); return;
  }
  if(tool==='del'){
    var fd=figuraEn(wp);
    if(fd){ pushUndo(); figuras=figuras.filter(function(q){return q!==fd;}); if(sel===fd.id) sel=null; }
    draw(); return;
  }
  if(tool==='fill'){
    var ff=figuraEn(wp);
    if(ff){ sel=ff.id; pushUndo(); ff.col=color; }
    draw(); return;
  }
  // mover
  var v=verticeEn(wp);
  if(v){ sel=v.f.id;
    drag={mode:'vert', id:v.f.id, i:v.i, orig:{x:v.f.pts[v.i].x,y:v.f.pts[v.i].y}, movido:false};
    draw(); return; }
  var fm=figuraEn(wp);
  if(fm){ sel=fm.id;
    drag={mode:'fig', id:fm.id, from:clavo||{x:Math.round(wp.x/PASO),y:Math.round(wp.y/PASO)},
          base:fm.pts.map(function(q){ return {x:q.x,y:q.y}; }), movido:false};
    draw(); return; }
  sel=null;
  drag={mode:'pan', sp:sp, v0:{x:view.x,y:view.y}};
  draw();
}
function onMove(e){
  var sp=evPos(e), wp=s2w(sp);
  if(!drag){
    if(borrador && borrador.pts.length){ var cl=clavoEn(wp); borrador.prev=cl||null; draw(); }
    return;
  }
  if(drag.mode==='pan'){ view.x=drag.v0.x+(sp.x-drag.sp.x); view.y=drag.v0.y+(sp.y-drag.sp.y); draw(); return; }
  if(drag.mode==='vert'){
    var f=byId(drag.id); if(!f) return;
    var clavo=clavoEn(wp); if(!clavo) return;
    var antes={x:f.pts[drag.i].x, y:f.pts[drag.i].y};
    if(clavo.x===antes.x && clavo.y===antes.y) return;
    f.pts[drag.i]={x:clavo.x,y:clavo.y};
    if(limitado(f) && longitud(f)>f.L+1e-9){              // el cordel no se estira
      f.pts[drag.i]=antes; flash('El cordel no se estira: no llega hasta ahí'); draw(); return;
    }
    if(!drag.movido){ pushUndo(); drag.movido=true; }
    draw(); return;
  }
  if(drag.mode==='fig'){
    var g=byId(drag.id); if(!g) return;
    var cx=Math.round(wp.x/PASO), cy=Math.round(wp.y/PASO);
    var dx=cx-drag.from.x, dy=cy-drag.from.y;
    var cand=drag.base.map(function(q){ return {x:q.x+dx, y:q.y+dy}; });
    if(cand.some(function(q){ return Math.abs(q.x)>LIM||Math.abs(q.y)>LIM; })) return;
    if(!drag.movido && (dx||dy)){ pushUndo(); drag.movido=true; }
    g.pts=cand; draw(); return;
  }
}
function onUp(){ drag=null; draw(); }

stage.addEventListener('wheel',function(e){
  e.preventDefault();
  var sp=evPos(e), antes=s2w(sp);
  view.z=Math.max(0.25,Math.min(3.5,view.z*Math.exp(-e.deltaY*0.0015)));
  var desp=s2w(sp);
  view.x+=(desp.x-antes.x)*view.z; view.y+=(desp.y-antes.y)*view.z;
  draw();
},{passive:false});

window.addEventListener('pointermove',onMove);
window.addEventListener('pointerup',onUp);
window.addEventListener('pointercancel',onUp);

window.addEventListener('keydown',function(e){
  var t=(e.target&&e.target.tagName)||''; if(t==='INPUT'||t==='SELECT') return;
  var k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='z'){ doUndo(); e.preventDefault(); return; }
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(k==='escape'){ borrador=null; sel=null; draw(); }
  else if(e.key==='Delete'||e.key==='Backspace'){
    if(sel!=null){ pushUndo(); figuras=figuras.filter(function(f){return f.id!==sel;}); sel=null; draw(); e.preventDefault(); } }
  else if(k==='enter'){ if(borrador){ terminaBorrador(); draw(); } }
  else if(k==='p'){ if(sel!=null){ var f=byId(sel); if(f){ pushUndo(); f.col=color; draw(); } } }
  else if(k==='d'){ duplicar(); }
  else if(k==='c'){ cerrarAbrir(); }
  else if(k==='1') setTool('goma');
  else if(k==='2') setTool('cordel');
  else if(k==='3') setTool('move');
  else if(k==='4') setTool('fill');
  else if(k==='5') setTool('del');
});
function cerrarAbrir(){
  if(sel==null){ flash('Selecciona antes una figura'); return; }
  var f=byId(sel); if(!f || f.pts.length<3) return;
  if(!f.cerrada){
    var cierre=dist(f.pts[f.pts.length-1], f.pts[0]);
    if(!cabe(f,cierre)){ flash('El cordel no llega para cerrar la figura'); return; }
  }
  pushUndo(); f.cerrada=!f.cerrada; draw();
}

/* La longitud se puede cambiar en cualquier momento: afecta al cordel que estés
   tendiendo, o al que tengas seleccionado, y queda como valor para los siguientes. */
function setCordL(v){
  cordL=Math.max(1,Math.min(400,v));
  document.getElementById('lval').textContent=num(cordL);
  if(cordFijo){
    if(borrador && borrador.tipo==='cordel'){
      if(longitud(borrador)>cordL+1e-9) flash('El cordel que estás tendiendo ya usa más que eso');
      else borrador.L=cordL;
    } else if(sel!=null){
      var f=byId(sel);
      if(f && f.tipo==='cordel'){
        if(longitud(f)>cordL+1e-9) flash('Esa figura ya usa más cordel que eso');
        else { pushUndo(); f.L=cordL; }
      }
    }
  }
  draw();
}
document.getElementById('lmenos').addEventListener('click',function(){ setCordL(cordL-1); });
document.getElementById('lmas').addEventListener('click',function(){ setCordL(cordL+1); });
function setModoCordel(fijo){
  cordFijo=fijo;
  document.getElementById('mfija').classList.toggle('on',fijo);
  document.getElementById('mlibre').classList.toggle('on',!fijo);
  document.getElementById('cordlong').classList.toggle('oculto',!fijo);
  if(borrador && borrador.tipo==='cordel'){
    if(fijo){ if(longitud(borrador)<=cordL+1e-9) borrador.L=cordL; }
    else delete borrador.L;
  }
  draw();
}

function duplicar(){
  if(sel==null){ flash('Selecciona antes una figura'); return; }
  var f=byId(sel); if(!f) return;
  var b={y1:Math.max.apply(null,f.pts.map(function(p){return p.y;})),
         y0:Math.min.apply(null,f.pts.map(function(p){return p.y;}))};
  var d=(b.y1-b.y0)+2;
  if(f.pts.some(function(p){ return p.y+d>LIM; })) d=-d;
  pushUndo();
  var g={id:nid++, tipo:f.tipo, cerrada:f.cerrada, col:f.col,
         pts:f.pts.map(function(p){ return {x:p.x, y:p.y+d}; })};
  if(limitado(f)) g.L=f.L;
  figuras.push(g); sel=g.id; draw();
}

function zoomAt(fz){ var r=stage.getBoundingClientRect(), c={x:r.width/2,y:r.height/2};
  var b=s2w(c); view.z=Math.max(0.15,Math.min(3.5,view.z*fz)); var a=s2w(c);
  view.x+=(a.x-b.x)*view.z; view.y+=(a.y-b.y)*view.z; draw(); }
document.getElementById('fit').addEventListener('click',fitView);
function fitView(){
  var r=stage.getBoundingClientRect(), b=cajaFiguras(), m=54;
  if(!b) b={x0:0,y0:0,x1:10,y1:10};
  var an=(b.x1-b.x0)*PASO || PASO, al=(b.y1-b.y0)*PASO || PASO;
  var z=Math.min((r.width-2*m)/an, (r.height-2*m)/al);
  view.z=Math.max(0.2,Math.min(2.2,z));
  view.x=r.width/2-((b.x0+b.x1)/2*PASO)*view.z;
  view.y=r.height/2-((b.y0+b.y1)/2*PASO)*view.z;
  draw();
}
document.getElementById('clear').addEventListener('click',function(){

document.getElementById('png').addEventListener('click',function(){
  var b=cajaFiguras(); if(!b){ flash('No hay nada que exportar'); return; }
  var r={x0:b.x0-1, x1:b.x1+1, y0:b.y0-1, y1:b.y1+1};      // un clavo de margen
  var m=16, sc=2, W=(r.x1-r.x0)*PASO+2*m, H=(r.y1-r.y0)*PASO+2*m;
  var oc=document.createElement('canvas'); oc.width=W*sc; oc.height=H*sc;
  var o=oc.getContext('2d'); o.scale(sc,sc); o.fillStyle='#fff'; o.fillRect(0,0,W,H);
  var g={x:view.x,y:view.y,z:view.z};
  view.x=m-r.x0*PASO; view.y=m-r.y0*PASO; view.z=1;
  escena(o,W,H,true,r);
  view=g; draw();
  var a=document.createElement('a'); a.download='geoplano.png'; a.href=oc.toDataURL('image/png'); a.click();
});

function leer(f){
  var r=new FileReader();
  r.onload=function(){ try{ loadData(JSON.parse(r.result)); }catch(err){ flash('No he podido leer ese archivo'); } };
  r.readAsText(f);
}
function loadData(d){
  var lista=d && (d.figuras||d.figures);
  if(!lista || !lista.length){ flash('El archivo no contiene figuras'); return; }
  var nuevas=[];
  for(var i=0;i<lista.length;i++){
    var q=lista[i];
    var pts=(q.clavos||q.pts||[]).map(function(p){
      return Array.isArray(p) ? {x:p[0]|0, y:p[1]|0} : {x:p.x|0, y:p.y|0}; });
    if(pts.length<2) continue;
    var tipo=(q.tipo==='cordel')?'cordel':'goma';
    var f={id:nid++, tipo:tipo, pts:pts, cerrada:!!q.cerrada, col:q.color||q.col||color};
    var L=Number(q.longitud);
    if(tipo==='cordel' && isFinite(L) && L>0) f.L=L;      // sin longitud, cordel libre
    nuevas.push(f);
  }
  if(!nuevas.length){ flash('El archivo no contiene figuras'); return; }
  pushUndo();
  figuras = importMode==='replace' ? nuevas : figuras.concat(nuevas);
  sel=null; borrador=null; fitView();
  flash(nuevas.length+(nuevas.length===1?' figura cargada':' figuras cargadas'));
}

window.addEventListener('resize',resize);
if(window.ResizeObserver) new ResizeObserver(resize).observe(stage);
(function init(){ setModoCordel(false); setCordL(12); fitView(); resize(); })();

/* =========================================================================
   8. AUTOCOMPROBACIÓN  ·  añade #test al final de la URL
   ========================================================================= */
function runSelfTest(){
  var out=[], fails=0;
  function ok(n,c,extra){ out.push((c?'OK    ':'FALLO ')+n+(extra!==undefined?'   ['+extra+']':'')); if(!c) fails++; }
  function fig(tipo,pts,cerrada,L){
    var f={id:nid++, tipo:tipo, pts:pts.map(function(p){return {x:p[0],y:p[1]};}), cerrada:!!cerrada, col:'#d23b30'};
    if(tipo==='cordel' && L) f.L=L;          // sin longitud, cordel libre
    return f;
  }
  var R2=Math.SQRT2, R5=Math.sqrt(5);

  /* --- longitudes y áreas ------------------------------------------------ */
  var cuad=fig('goma',[[0,0],[1,0],[1,1],[0,1]],true);
  ok('el cuadrado unidad mide 4 de perímetro', Math.abs(longitud(cuad)-4)<1e-12, longitud(cuad));
  ok('y 1 de área', Math.abs(area(cuad)-1)<1e-12, area(cuad));
  var rect=fig('goma',[[0,0],[3,0],[3,2],[0,2]],true);
  ok('el rectángulo 3×2 mide 10 de perímetro', Math.abs(longitud(rect)-10)<1e-12);
  ok('y 6 de área', Math.abs(area(rect)-6)<1e-12);
  var tri=fig('goma',[[0,0],[2,0],[0,2]],true);
  ok('el triángulo (0,0)(2,0)(0,2) tiene área 2', Math.abs(area(tri)-2)<1e-12);
  ok('y perímetro 4 + 2√2', Math.abs(longitud(tri)-(4+2*R2))<1e-12, num(longitud(tri)));
  var diag=fig('goma',[[0,0],[1,2]],false);
  ok('un tramo (1,2) mide √5', Math.abs(longitud(diag)-R5)<1e-12);
  var abierta=fig('goma',[[0,0],[2,0],[2,1]],false);
  ok('una figura abierta no suma el tramo de cierre', Math.abs(longitud(abierta)-3)<1e-12);
  ok('y no tiene área', area(abierta)===0);

  /* --- teorema de Pick ---------------------------------------------------- */
  [[ [[0,0],[1,0],[1,1],[0,1]], 1, 4, 0],
   [[ [0,0],[3,0],[3,3],[0,3]], 9, 12, 4],
   [[ [0,0],[2,0],[0,2]],       2, 6, 0],
   [[ [0,0],[4,0],[4,2],[2,2],[2,4],[0,4]], 12, 16, 5],
   [[ [0,0],[3,1],[1,3]],       4, 4, 3]      /* área 4: |(3,1)×(1,3)|/2 = 8/2 */
  ].forEach(function(t){
    var f=fig('goma',t[0],true);
    var A=area(f), B=puntosBorde(f), I=puntosInteriores(f);
    ok('área de la figura de '+t[0].length+' vértices = '+t[1], Math.abs(A-t[1])<1e-9, A);
    ok('  clavos del borde = '+t[2], B===t[2], B);
    ok('  clavos interiores = '+t[3], I===t[3], I);
    ok('  y se cumple Pick: A = i + b/2 − 1', Math.abs(A-(I+B/2-1))<1e-9, num(I+B/2-1));
  });
  ok('los clavos del borde cuentan bien los tramos oblicuos',
     puntosBorde(fig('goma',[[0,0],[4,2],[0,4]],true))===8, puntosBorde(fig('goma',[[0,0],[4,2],[0,4]],true)));

  /* --- la diferencia entre goma y cordel ---------------------------------- */
  var goma=fig('goma',[[0,0],[5,0]],false);
  ok('la goma no tiene límite de longitud', cabe(goma,1000));
  var libre=fig('cordel',[[0,0],[5,0]],false,0);
  ok('el cordel libre no está limitado', !limitado(libre) && cabe(libre,1000));
  ok('y su sobrante es infinito', sobrante(libre)===Infinity);
  var cor=fig('cordel',[[0,0],[3,0]],false,12);
  ok('el cordel de longitud fija sí está limitado', limitado(cor));
  ok('el cordel de 12 lleva usadas 3 unidades', Math.abs(longitud(cor)-3)<1e-12);
  ok('y le sobran 9', Math.abs(sobrante(cor)-9)<1e-12);
  ok('un tramo de 9 todavía cabe', cabe(cor,9));
  ok('uno de 9,5 ya no cabe', !cabe(cor,9.5));
  var cor12=fig('cordel',[[0,0],[4,0],[4,2],[0,2]],true,12);
  ok('con 12 de cordel se hace justo el rectángulo 4×2', Math.abs(longitud(cor12)-12)<1e-12);
  ok('y no sobra nada', Math.abs(sobrante(cor12))<1e-12);
  ok('el rectángulo 4×2 encierra 8', Math.abs(area(cor12)-8)<1e-12);
  var cor9=fig('cordel',[[0,0],[3,0],[3,3],[0,3]],true,12);
  ok('el cuadrado 3×3 usa también los 12', Math.abs(longitud(cor9)-12)<1e-12);
  ok('pero encierra 9, más que el 4×2', area(cor9)>area(cor12), num(area(cor9))+' > '+num(area(cor12)));
  var casi44=fig('cordel',[[0,0],[4,0],[4,4],[0,4]],false,12);
  ok('con 12 de cordel se llega a hacer tres lados de un cuadrado 4×4', Math.abs(longitud(casi44)-12)<1e-12);
  ok('pero ya no queda cordel para cerrarlo', !cabe(casi44,4));
  ok('el cuadrado 4×4 necesita 16 de perímetro',
     Math.abs(longitud(fig('goma',[[0,0],[4,0],[4,4],[0,4]],true))-16)<1e-12);

  /* --- duplicar ----------------------------------------------------------- */
  figuras=[]; sel=null; nid=1;
  var orig=fig('cordel',[[0,0],[3,0],[3,2],[0,2]],true,12);
  figuras.push(orig); sel=orig.id;
  duplicar();
  ok('duplicar crea una figura más', figuras.length===2);
  var cop=figuras[1];
  ok('la copia conserva tipo, color y longitud del cordel',
     cop.tipo==='cordel' && cop.col===orig.col && cop.L===12);
  ok('la copia conserva la forma', Math.abs(longitud(cop)-longitud(orig))<1e-12 && Math.abs(area(cop)-area(orig))<1e-12);
  ok('y queda desplazada, no encima', cop.pts[0].y!==orig.pts[0].y);
  ok('la copia queda seleccionada', sel===cop.id);

  /* --- guardar y volver a abrir ------------------------------------------ */
  figuras=[]; sel=null; nid=1;
  figuras.push(fig('goma',[[0,0],[4,0],[4,3]],true));
  figuras.push(fig('cordel',[[5,5],[8,5],[8,8],[5,8]],true,12));
  figuras.push(fig('cordel',[[-3,-2],[-1,-2],[-1,0]],false,0));
  figuras[1].col='#2f62a8';
  var antes=figuras.map(function(f){
    return f.tipo+':'+f.col+':'+f.cerrada+':'+f.pts.map(function(p){return p.x+','+p.y;}).join(' ')+':'+(f.L||''); }).sort().join(' | ');
  var data={formato:'geoplano-cuadrado',version:1,
    figuras:figuras.map(function(f){
      var o={tipo:f.tipo,color:f.col,cerrada:f.cerrada,clavos:f.pts.map(function(p){return [p.x,p.y];})};
      if(limitado(f)) o.longitud=f.L; return o; })};
  importMode='replace'; loadData(JSON.parse(JSON.stringify(data)));
  ok('guardar y volver a abrir conserva las figuras',
     figuras.map(function(f){
       return f.tipo+':'+f.col+':'+f.cerrada+':'+f.pts.map(function(p){return p.x+','+p.y;}).join(' ')+':'+(f.L||''); }).sort().join(' | ')===antes);
  ok('se conserva qué es goma y qué es cordel',
     figuras.filter(function(f){return f.tipo==='cordel';}).length===2);
  ok('y la longitud del cordel limitado',
     figuras.filter(function(f){return limitado(f);}).length===1 &&
     figuras.filter(function(f){return limitado(f);})[0].L===12);
  ok('el cordel libre se recupera sin límite',
     figuras.filter(function(f){return f.tipo==='cordel' && !limitado(f);}).length===1);
  ok('se admiten coordenadas negativas', figuras.some(function(f){
     return f.pts.some(function(p){ return p.x<0||p.y<0; }); }));
  var nAntes=figuras.length;
  importMode='add'; loadData(JSON.parse(JSON.stringify(data)));
  ok('el botón ＋ añade sin borrar lo anterior', figuras.length===nAntes*2, figuras.length);
  importMode='replace';

  figuras=[]; sel=null; borrador=null; nid=1; undoStack=[]; fitView();

  /* --- informe ----------------------------------------------------------- */
  var texto=out.join('\n')+'\n\n'+(fails? fails+' PRUEBAS FALLIDAS de '+out.length : 'LAS '+out.length+' PRUEBAS CORRECTAS');
  var box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;background:#fff;z-index:99;overflow:auto;padding:18px 22px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
  box.innerHTML='<div style="font:600 15px/1.3 -apple-system,Segoe UI,Roboto,sans-serif;margin-bottom:4px">'+
      'Autocomprobación del Geoplano cuadrado</div>'+
    '<div style="font:13px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;color:'+(fails?'#c2410c':'#15803d')+';font-weight:600;margin-bottom:12px">'+
      (fails? fails+' pruebas fallidas de '+out.length : 'Las '+out.length+' pruebas correctas')+'</div>'+
    '<button id="cpTest" style="font:13px -apple-system,Segoe UI,Roboto,sans-serif;padding:6px 12px;margin-bottom:14px;'+
      'border:1px solid #d5d9e0;border-radius:7px;background:#fff;cursor:pointer">Copiar informe</button> '+
    '<button id="clTest" style="font:13px -apple-system,Segoe UI,Roboto,sans-serif;padding:6px 12px;margin-bottom:14px;'+
      'border:1px solid #d5d9e0;border-radius:7px;background:#fff;cursor:pointer">Cerrar y usar el manipulativo</button>'+
    '<pre style="white-space:pre-wrap;margin:0">'+
      out.map(function(l){ return l.indexOf('FALLO')===0
        ? '<span style="color:#c2410c;font-weight:700">'+l+'</span>' : l; }).join('\n')+'</pre>';
  document.body.appendChild(box);
  document.getElementById('cpTest').addEventListener('click',function(){
    var ta=document.createElement('textarea'); ta.value=texto; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); }catch(err){}
    document.body.removeChild(ta); this.textContent='Copiado ✓';
  });
  document.getElementById('clTest').addEventListener('click',function(){ box.remove(); });
}
var testLanzado=false;
function lanzarTest(){ if(testLanzado) return; testLanzado=true; runSelfTest(); }
if((location.hash||'').indexOf('test')>=0) setTimeout(lanzarTest,60);
window.addEventListener('hashchange',function(){
  if((location.hash||'').indexOf('test')>=0) lanzarTest();
});

window.__geoplano={
  test:runSelfTest, figuras:function(){return figuras;}, byId:byId,
  longitud:longitud, area:area, puntosBorde:puntosBorde, puntosInteriores:puntosInteriores,
  dentro:dentro, enBorde:enBorde, cabe:cabe, sobrante:sobrante, nueva:nueva,
  limitado:limitado, duplicar:duplicar, setCordL:setCordL, setModoCordel:setModoCordel,
  load:loadData, setMode:function(m){importMode=m;}, redraw:draw,
  reset:function(){ figuras=[]; sel=null; borrador=null; }
};

})();
</script>
</body>
