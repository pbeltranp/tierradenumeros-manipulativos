<!DOCTYPE html>

<head>

<style>
  *{box-sizing:border-box}

  body{font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       color:#2b2f36;background:#fff;display:flex;height:100%;overflow:hidden}
  #side{width:216px;flex:0 0 216px;border-right:1px solid #e6e8ec;padding:10px 10px;overflow:auto;
        background:#fafbfc}

           margin:0 0 6px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;

  /* acotado a la barra: si no, se lo come también a los h2 del panel lateral,
     que llevan la misma clase para separarse, y los deja en una raya de 1px */
  #toolbar .sep{width:1px;height:20px;background:#dfe2e7;margin:0 3px}
  .chk{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#4a515c;cursor:pointer;
       padding:3px 6px;border-radius:6px}

  .act{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;margin-top:5px;
       border:1px solid #d5d9e0;background:#fff;border-radius:7px;padding:6px 8px;font-size:12px;

  select,input[type=text],input[type=number]{font:12px inherit;border:1px solid #d5d9e0;border-radius:6px;
       padding:5px 6px;color:#2b2f36;background:#fff;width:100%}
  .fila{display:flex;gap:5px;align-items:stretch;margin-top:4px}

        color:#3d4450;cursor:pointer;flex:1;text-align:center}
  .mini:hover{background:#f0f2f5}
  .mini:disabled{opacity:.35;cursor:default}
  .cuenta{flex:1.4;display:flex;align-items:center;justify-content:center;gap:5px;
          font-weight:600;font-size:12.5px;color:#2b2f36}
  .cuenta svg{display:block;flex:0 0 auto}
  .lab{font-size:11px;color:#8a919c;margin-top:7px}
  .caja{margin-top:7px;font-size:11.5px;color:#4a515c;line-height:1.5;
        background:#fff;border:1px solid #e6e8ec;border-radius:8px;padding:7px 8px}
  .caja b{color:#2b2f36}
  .caja .gr{font-size:15px;font-weight:700;color:#31527d}
  .caja .mant{margin-top:6px;padding-top:6px;border-top:1px solid #eef0f3}
  .caja .mant:first-child{margin-top:0;padding-top:0;border-top:0}
  .nota{font-size:11px;color:#8a919c;line-height:1.5;margin-top:7px}
  #stage{position:relative;flex:1;min-height:0;background:#fbfbfa}
  canvas#cv{display:block;width:100%;height:100%;touch-action:none}
  #hint{position:absolute;left:10px;bottom:10px;background:rgba(28,32,38,.82);color:#fff;font-size:11.5px;
        padding:5px 10px;border-radius:14px;pointer-events:none;max-width:calc(100% - 20px)}
  #info{position:absolute;right:10px;top:10px;width:334px;background:#fff;border:1px solid #dfe2e7;
        border-radius:10px;padding:11px 13px;font-size:11.5px;line-height:1.55;color:#4a515c;
        box-shadow:0 6px 22px rgba(20,25,35,.12);display:none;max-height:calc(100% - 20px);overflow:auto}
  #info.show{display:block}
  #info b{color:#2b2f36}
  #info a{color:#2f62a8}
  #info .lic{margin-top:11px;padding-top:8px;border-top:1px solid #eef0f3;font-size:10.5px;
             line-height:1.5;color:#8a919c}
  #drop{position:absolute;inset:0;background:rgba(47,98,168,.08);border:2px dashed #2f62a8;
        display:none;align-items:center;justify-content:center;font-size:15px;color:#2f62a8;font-weight:600}
  #drop.show{display:flex}
  @media (max-width:640px){
    #side{width:160px;flex:0 0 160px;padding:8px 7px}
    .btn{padding:5px 7px;font-size:12px}
    #info{width:calc(100% - 20px)}
  }
</style>

<body>

  <aside id="side">
    <div class="brand">En busca de la <b>unidad perdida</b></div>
    <h2>El mantel</h2>
    <select id="nivel">
      <option value="0">Fácil</option>
      <option value="1" selected>Normal</option>
      <option value="2">Difícil</option>
    </select>
    <button class="act" id="nuevo">Nuevo mantel al azar</button>
    <input type="text" id="aMano" placeholder="5/6" style="margin-top:5px"
           title="Escribe cuánto quieres que mida el mantel con la unidad perdida">
    <button class="act" id="crear">Ese mantel</button>

    <h2 class="sep">Partir la pieza</h2>
    <div class="lab">En vertical, columnas</div>
    <div class="fila">

  <main>
    <div id="toolbar">
      <button class="btn" id="undo" title="Deshacer (Ctrl+Z)">↶</button>
      <button class="btn" id="vaciar" title="Quitar todo del tablero">Vaciar</button>
      <span class="sep"></span>
      <label class="chk" title="Al soltar, los bordes y las marcas se enganchan a los de las demás piezas"><input type="checkbox" id="iman" checked>Imán</label>

<script>
"use strict";
(function(){

/* =========================================================================
   1. LA IDEA
   Medir es comparar con una unidad. Aquí el problema va del revés: el mantel
   llega ya medido —lleva escrito «5/6 u»— y lo que se ha perdido es la
   unidad con la que se midió. Reconstruirla es deshacer la medida.

   La restricción que lo gobierna todo: si el mantel mide p/q de la unidad,
   la unidad es q/p del mantel. Como todo lo que se construye sale de partir
   el mantel y de repetir trozos, las áreas se llevan con fracciones exactas
   de enteros, nunca con decimales: dos áreas son iguales o no lo son, sin
   márgenes de tolerancia.

   Y lo que hace que esto funcione con superficies y no con longitudes: la
   unidad queda determinada por su ÁREA, no por su forma. Los mismos trozos
   puestos en fila, en bloque, en ele o en escalera son la misma unidad. Por
   eso el entorno no puede juzgar la forma de lo que construye el alumno; y
   por eso no juzga nada. Se limita a medir con lo que el alumno haya
   declarado que es su unidad y a decirle qué le sale.
   ========================================================================= */
var L=150;                 // el lado base, en píxeles
var MAXD=12;               // partes máximas en cada dirección

var CTROZO={f:'#f4ead6', b:'#c2ab7d', t:'#7a6634'};   // trozo suelto
var CUNI  ={f:'#dbe7f3', b:'#5b87bd', t:'#31527d'};   // trozo marcado como unidad
var PALETA=[
  {f:'#e07a5f', b:'#b1543a'},
  {f:'#6a8caf', b:'#446287'},
  {f:'#7fb069', b:'#548042'},
  {f:'#b07aa1', b:'#845278'},
  {f:'#4fa3a5', b:'#2d7274'},
  {f:'#d1495b', b:'#9c2c3c'},
  {f:'#8d6e63', b:'#5f463d'},
  {f:'#5c6bc0', b:'#39479a'}
];
function colorDe(s){
  if(s.tipo==='m') return PALETA[(s.c||0)%PALETA.length];
  return s.pat ? CUNI : CTROZO;
}

/* =========================================================================
   2. ESTADO
   ========================================================================= */
var piezas=[], sel=null, nid=1, letra=0, colorTurno=0;
var view={x:0,y:0,z:1};
var drag=null, undoStack=[], importMode='replace';
var opt={iman:1, etiq:0, mano:0, alfa:0, comp:0};

var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var stage=document.getElementById('stage');
var hintEl=document.getElementById('hint'), infoEl=document.getElementById('info');
var dropEl=document.getElementById('drop');
var flashMsg=null, flashT=0;

function w2s(p){ return {x:p.x*view.z+view.x, y:p.y*view.z+view.y}; }
function s2w(p){ return {x:(p.x-view.x)/view.z, y:(p.y-view.y)/view.z}; }
function flash(m){ flashMsg=m; flashT=Date.now(); draw(); setTimeout(draw,2400); }
function pushUndo(){
  undoStack.push(JSON.stringify({p:piezas, s:sel, n:nid, b:banco}));
  if(undoStack.length>90) undoStack.shift();
}
function doUndo(){
  if(!undoStack.length){ flash('No hay nada que deshacer'); return; }
  var d=JSON.parse(undoStack.pop());
  piezas=d.p; sel=d.s; nid=d.n||1; banco=d.b||null;
  draw();
}

/* =========================================================================
   3. FRACCIONES
   Todo el material se apoya en aritmética exacta de enteros. Un área es
   siempre un par p/q reducido; comparar dos áreas es multiplicar en cruz.
   ========================================================================= */
function mcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ var t=a%b; a=b; b=t; } return a; }
function reduce(p,q){ var d=mcd(p,q)||1; return {p:p/d, q:q/d}; }
function igualFrac(a,b){ return a.p*b.q===b.p*a.q; }
function sumaFrac(a,b){ return reduce(a.p*b.q+b.p*a.q, a.q*b.q); }
function divFrac(a,b){ return reduce(a.p*b.q, a.q*b.p); }
function textoFrac(f){ return f.q===1 ? (f.p+'') : (f.p+'/'+f.q); }
function leeFraccion(txt){
  if(txt===null || txt===undefined) return null;
  var s=String(txt).toLowerCase().replace(/\s+y\s+/g,' ').trim();
  if(!s) return null;
  var m;
  if((m=s.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/))){
    var e=+m[1], n=+m[2], d=+m[3];
    if(!d) return null;
    return reduce(e*d+n, d);
  }
  if((m=s.match(/^(\d+)\s*\/\s*(\d+)$/))){
    if(!+m[2] || !+m[1]) return null;
    return reduce(+m[1], +m[2]);
  }
  if((m=s.match(/^(\d+)$/))){ if(!+m[1]) return null; return {p:+m[1], q:1}; }
  return null;
}

/* =========================================================================
   4. LOS MANTELES QUE PROPONE EL ENTORNO
   Un mantel es un rectángulo que lleva escrita su medida, p/q, y nada más:
   de sus lados no se dice nada, porque no hay con qué compararlos. Se busca
   que ni el mantel ni la unidad que hay que reconstruir salgan de la
   pantalla, y que p se pueda repartir en columnas y filas con los dobleces
   que admite el material.
   ========================================================================= */
var NIVELES=[
  {n:'Fácil',   maxp:4,  maxq:3},
  {n:'Normal',  maxp:6,  maxq:5},
  {n:'Difícil', maxp:12, maxq:8}
];
/* formas de mantel agradables de mirar, en fracciones del lado base */
var FORMAS=[
  {wp:1,wq:1,hp:1,hq:1},
  {wp:3,wq:2,hp:1,hq:1},
  {wp:1,wq:1,hp:3,hq:2},
  {wp:5,wq:4,hp:1,hq:1},
  {wp:1,wq:1,hp:5,hq:4},
  {wp:3,wq:2,hp:5,hq:4},
  {wp:5,wq:4,hp:3,hq:2},
  {wp:7,wq:4,hp:1,hq:1},
  {wp:1,wq:1,hp:7,hq:4},
  {wp:4,wq:3,hp:5,hq:4},
  {wp:5,wq:4,hp:4,hq:3},
  {wp:3,wq:2,hp:4,hq:3}
];
function areaForma(F){ return (F.wp/F.wq)*(F.hp/F.hq); }
function formaValida(F,p,q){
  var ar=areaForma(F);
  if(ar<0.9 || ar>2.05) return false;
  var au=ar*q/p;                                  // lo que ocuparía la unidad
  return au>=0.7 && au<=3.2;
}
function fraccionValida(p,q){
  if(p===q) return false;                          // el mantel sería la unidad
  if(mcd(p,q)!==1) return false;                   // la fracción, ya irreducible
  if(p>MAXD) return false;                         // hay que poder partir en p
  var r=q/p;
  return r>=0.4 && r<=3;
}
function mantelConFraccion(p,q){
  var buenas=[];
  for(var i=0;i<FORMAS.length;i++) if(formaValida(FORMAS[i],p,q)) buenas.push(FORMAS[i]);
  if(!buenas.length) return null;
  var F=buenas[Math.floor(Math.random()*buenas.length)];
  return {wp:F.wp, wq:F.wq, hp:F.hp, hq:F.hq, fp:p, fq:q};
}
function mantelAlAzar(nv){
  var N=NIVELES[nv]||NIVELES[1];
  for(var i=0;i<3000;i++){
    var p=1+Math.floor(Math.random()*N.maxp);
    var q=1+Math.floor(Math.random()*N.maxq);
    if(!fraccionValida(p,q)) continue;
    var R=mantelConFraccion(p,q);
    if(R) return R;
  }
  return {wp:3, wq:2, hp:1, hq:1, fp:5, fq:6};
}

/* =========================================================================
   5. LAS PIEZAS
   Todas son rectángulos con ancho y alto guardados como fracciones del lado
   base, para que partir y repetir sea exacto. a y b son las partes en que
   está marcada la pieza; son solo marcas: no la rompen.
   ========================================================================= */
function ancho(s){ return L*s.wp/s.wq; }
function alto(s){ return L*s.hp/s.hq; }
function areaDe(s){ return reduce(s.wp*s.hp, s.wq*s.hq); }
function areaCelda(s){ return reduce(s.wp*s.hp, s.wq*s.hq*s.a*s.b); }
function centro(s){ return {x:s.x+ancho(s)/2, y:s.y+alto(s)/2}; }

function siguienteLetra(){
  var usadas={};
  piezas.forEach(function(s){ if(s.tipo==='m' && s.nombre) usadas[s.nombre]=1; });
  for(var i=0;i<26;i++){
    var C=String.fromCharCode(65+i);
    if(!usadas[C]) return C;
  }
  return String.fromCharCode(65+(letra++ %26));
}
function siguienteColor(){
  var usados={};
  piezas.forEach(function(s){ if(s.tipo==='m') usados[s.c||0]=1; });
  for(var i=0;i<PALETA.length;i++) if(!usados[i]) return i;
  return (colorTurno++)%PALETA.length;
}
function nuevoMantel(R,P){
  return {id:nid++, tipo:'m', wp:R.wp, wq:R.wq, hp:R.hp, hq:R.hq, a:1, b:1, pat:0,
          fp:R.fp, fq:R.fq, c:siguienteColor(), x:P.x, y:P.y, nombre:siguienteLetra()};
}
function nuevoTrozo(wf,hf,P,esPatron){
  return {id:nid++, tipo:'p', wp:wf.p, wq:wf.q, hp:hf.p, hq:hf.q, a:1, b:1,
          pat:esPatron?1:0, fp:0, fq:1, c:0, x:P.x, y:P.y, nombre:''};
}
function porId(id){
  for(var i=0;i<piezas.length;i++) if(piezas[i].id===id) return piezas[i];
  return null;
}
function seleccionada(){ return sel==null? null : porId(sel); }
function marcasX(s){
  var out=[];
  if(s.a<2) return out;
  for(var k=1;k<s.a;k++) out.push(s.x+ancho(s)*k/s.a);
  return out;
}
function marcasY(s){
  var out=[];
  if(s.b<2) return out;
  for(var k=1;k<s.b;k++) out.push(s.y+alto(s)*k/s.b);
  return out;
}
function puntosX(s){ return [s.x, s.x+ancho(s)].concat(marcasX(s)); }
function puntosY(s){ return [s.y, s.y+alto(s)].concat(marcasY(s)); }
function dentro(P,s){
  return P.x>=s.x && P.x<=s.x+ancho(s) && P.y>=s.y && P.y<=s.y+alto(s);
}
function caja(lista){
  if(!lista.length) return null;
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  lista.forEach(function(s){
    x0=Math.min(x0,s.x); x1=Math.max(x1,s.x+ancho(s));
    y0=Math.min(y0,s.y); y1=Math.max(y1,s.y+alto(s));
  });
  return {x0:x0,y0:y0,x1:x1,y1:y1};
}
/* la caja de todo lo que se ve, panel del banco incluido, para ajustar y para
   exportar la imagen */
function cajaTodo(){
  var b=caja(piezas);
  if(!banco) return b;
  if(!b) return {x0:banco.x, y0:banco.y, x1:banco.x+banco.w, y1:banco.y+banco.h};
  return {x0:Math.min(b.x0,banco.x), y0:Math.min(b.y0,banco.y),
          x1:Math.max(b.x1,banco.x+banco.w), y1:Math.max(b.y1,banco.y+banco.h)};
}
function sitioLibre(){
  var b=caja(piezas);
  return b? {x:b.x0, y:b.y1+L*0.3} : {x:-L*0.75, y:-L*0.5};
}

/* --- partir, sacar, separar, repetir ---------------------------------------
   Las cuatro acciones con las que se construye todo. Ninguna inventa
   medidas: parten de lo que ya hay en el tablero. */
function parte(s,a,b){
  if(!s) return false;
  a=Math.max(1, Math.min(MAXD, Math.round(a)));
  b=Math.max(1, Math.min(MAXD, Math.round(b)));
  if(a===s.a && b===s.b) return false;
  pushUndo();
  s.a=a; s.b=b;
  draw();
  return true;
}
function sacarTrozo(s){
  if(!s) return null;
  pushUndo();
  var wf=reduce(s.wp, s.wq*s.a), hf=reduce(s.hp, s.hq*s.b);
  var t=nuevoTrozo(wf, hf, {x:s.x+ancho(s)+L*0.22, y:s.y}, false);
  piezas.push(t); sel=t.id;
  draw();
  return t;
}
function separar(s){
  if(!s || s.tipo!=='p') return null;
  if(s.a*s.b<2) return null;
  pushUndo();
  var wf=reduce(s.wp, s.wq*s.a), hf=reduce(s.hp, s.hq*s.b);
  var an=L*wf.p/wf.q, al=L*hf.p/hf.q, hijos=[];
  for(var j=0;j<s.b;j++) for(var i=0;i<s.a;i++){
    var t=nuevoTrozo(wf, hf, {x:s.x+an*i, y:s.y+al*j}, false);
    hijos.push(t);
  }
  var k=piezas.indexOf(s);
  if(k>=0) piezas.splice.apply(piezas, [k,1].concat(hijos));
  else piezas=piezas.concat(hijos);
  sel=hijos[0].id;
  draw();
  return hijos;
}
/* --- unir en una sola pieza -------------------------------------------------
   Con la unidad repartida en trozos se puede contar, pero no se puede doblar:
   para medir de verdad hay que tenerla entera y sin marcas por dentro, y
   partirla entonces en las partes que hagan falta. Unir solo es posible si los
   trozos embaldosan un rectángulo, que es la forma que este material sabe
   partir en partes iguales; si no, hay que recolocarlos. */
function seSolapan(a,b){
  var e=1e-6;
  return a.x < b.x+ancho(b)-e && b.x < a.x+ancho(a)-e &&
         a.y < b.y+alto(b)-e  && b.y < a.y+alto(a)-e;
}
/* el lado del rectángulo, en fracción exacta, sumando la fila de arriba (o la
   columna de la izquierda) y exigiendo que vaya seguida y llegue al final */
function ladoExacto(lista,ejeX){
  var e=1e-6, b=caja(lista);
  var borde=lista.filter(function(s){
    return ejeX ? Math.abs(s.y-b.y0)<e : Math.abs(s.x-b.x0)<e; });
  borde.sort(function(p,q){ return ejeX ? p.x-q.x : p.y-q.y; });
  var cursor = ejeX ? b.x0 : b.y0, total={p:0,q:1};
  for(var i=0;i<borde.length;i++){
    var s=borde[i], ini = ejeX ? s.x : s.y;
    if(Math.abs(ini-cursor)>e) return null;
    cursor += ejeX ? ancho(s) : alto(s);
    total = sumaFrac(total, ejeX ? reduce(s.wp,s.wq) : reduce(s.hp,s.hq));
  }
  return Math.abs(cursor-(ejeX? b.x1 : b.y1))<e ? total : null;
}
function rectanguloDe(lista){
  if(!lista.length) return null;
  var i,j;
  for(i=0;i<lista.length;i++) for(j=i+1;j<lista.length;j++)
    if(seSolapan(lista[i],lista[j])) return null;
  var W=ladoExacto(lista,true), H=ladoExacto(lista,false);
  if(!W || !H) return null;
  /* que además lo llenen: sin esta comprobación, una ele o un rectángulo con
     un hueco en medio colarían, porque su fila de arriba y su columna de la
     izquierda pueden estar completas y el centro vacío */
  var suma={p:0,q:1};
  for(i=0;i<lista.length;i++) suma=sumaFrac(suma, areaDe(lista[i]));
  if(!igualFrac(suma, reduce(W.p*H.p, W.q*H.q))) return null;
  var b=caja(lista);
  return {w:W, h:H, x:b.x0, y:b.y0};
}
function unir(s){
  if(!s || s.tipo!=='p') return null;
  var g=grupoDe(s);
  if(g.length<2) return null;
  var R=rectanguloDe(g);
  if(!R) return null;
  pushUndo();
  var t=nuevoTrozo(R.w, R.h, {x:R.x, y:R.y}, false);
  piezas=piezas.filter(function(o){ return g.indexOf(o)<0; });
  piezas.push(t); sel=t.id;
  draw();
  return t;
}
function duplicaEn(s,dir){
  if(!s || s.tipo!=='p') return null;
  pushUndo();
  var dx = dir==='d' ? ancho(s) : 0;
  var dy = dir==='b' ? alto(s) : 0;
  var t={id:nid++, tipo:'p', wp:s.wp, wq:s.wq, hp:s.hp, hq:s.hq, a:s.a, b:s.b,
         pat:0, fp:0, fq:1, c:0, x:s.x+dx, y:s.y+dy, nombre:''};
  piezas.push(t); sel=t.id;
  draw();
  return t;
}

/* --- el imán --------------------------------------------------------------
   Ojo con el cero: un enganche perfecto vale 0, que es falso en JavaScript.
   La distancia se lleva aparte. */
function engancheEje(s,puntosDe){
  var lim=10/view.z, mios=puntosDe(s), mejor=null, dist=Infinity;
  piezas.forEach(function(o){
    if(o.id===s.id) return;
    puntosDe(o).forEach(function(b){
      mios.forEach(function(a){
        var d=b-a;
        if(Math.abs(d)<lim && Math.abs(d)<dist){ mejor=d; dist=Math.abs(d); }
      });
    });
  });
  return mejor;
}
function aplicaIman(s){
  if(!opt.iman || !s) return false;
  var dx=engancheEje(s,puntosX), dy=engancheEje(s,puntosY), algo=false;
  if(dx!==null){ s.x+=dx; algo=true; }
  if(dy!==null){ s.y+=dy; algo=true; }
  return algo;
}

/* =========================================================================
   6. EL BANCO DE PRUEBAS
   El tablero tiene dos sitios. A la izquierda se construye: se parte el
   mantel, se sacan trozos y se montan hasta dar con lo que uno cree que era
   la unidad. A la derecha se prueba, y para eso hace falta que la unidad
   deje de ser un montón y sea una pieza: «▶ Probar esta unidad» coge el
   grupo pegado, exige que forme un rectángulo y monta el banco con dos
   copias limpias, sin ninguna de las divisiones que se hayan hecho para
   construir: el mantel otra vez entero y la unidad fundida en una pieza.

   Con eso desaparece toda la contabilidad de antes. La unidad es UNA pieza,
   el patrón, y medir un mantel es lo de siempre: lo que tenga encima
   dividido por el patrón. Sin excepciones, así que poner el propio patrón
   encima cuenta como una unidad, que es lo que uno espera al medir.

   El entorno sigue sin corregir: dice la fracción que sale de lo que hay
   puesto, no si está bien. Que cubra sin huecos ni solapes lo mira el alumno.
   ========================================================================= */
var banco=null;                 // el rectángulo del panel, en coordenadas de mundo

function patron(){
  for(var i=0;i<piezas.length;i++) if(piezas[i].tipo==='p' && piezas[i].pat) return piezas[i];
  return null;
}
function areaUnidad(){ var P=patron(); return P? areaDe(P) : null; }
function dentroRect(P,r){
  return !!r && P.x>=r.x && P.x<=r.x+r.w && P.y>=r.y && P.y<=r.y+r.h;
}
function enBanco(s){ return dentroRect(centro(s), banco); }
function mantelBanco(){
  for(var i=0;i<piezas.length;i++)
    if(piezas[i].tipo==='m' && enBanco(piezas[i])) return piezas[i];
  return null;
}
/* el mantel del que se sacan las copias: el último que se haya tocado fuera
   del banco, que con un solo mantel en el tablero es el único que hay */
function mantelDeTrabajo(){
  for(var i=piezas.length-1;i>=0;i--)
    if(piezas[i].tipo==='m' && !enBanco(piezas[i])) return piezas[i];
  return null;
}
/* un trozo cuenta sobre el mantel si su centro cae dentro. El patrón también:
   iterar la unidad sobre lo que se mide es medir */
function trozosSobre(m){
  return piezas.filter(function(s){
    return s.tipo==='p' && dentro(centro(s), m);
  });
}
/* en cuántas partes iguales está doblado el patrón y cuánto mide cada una */
function parteUnidad(){
  var P=patron();
  return P? {area:areaCelda(P), N:P.a*P.b} : null;
}
function medidaDe(m){
  var P=patron();
  if(!P) return {estado:'sin-unidad'};
  if(!m) return {estado:'sin-mantel'};
  var T=trozosSobre(m);
  if(!T.length) return {estado:'sin-trozos'};
  var at={p:0,q:1};
  for(var i=0;i<T.length;i++) at=sumaFrac(at, areaDe(T[i]));
  var r={estado:'ok', n:T.length, frac:divFrac(at, areaDe(P))};
  /* si lo que ha puesto son partes de su unidad, la cuenta se da tal cual:
     arriba las que caben, abajo en las que ha doblado la unidad. Simplificarla
     escondería justo lo que se está midiendo */
  var Q=parteUnidad();
  if(Q){
    var todasParte=true;
    for(i=0;i<T.length;i++) if(!igualFrac(areaDe(T[i]), Q.area)) todasParte=false;
    if(todasParte) r.cuenta={n:T.length, N:Q.N};
  }
  return r;
}
/* cuánto vale un trozo con la unidad del alumno, para las etiquetas */
function valorCelda(s){
  var au=areaUnidad();
  return au? divFrac(areaCelda(s), au) : null;
}
/* --- el grupo pegado -------------------------------------------------------- */
function tocan(a,b){
  var e=0.6;
  return a.x < b.x+ancho(b)+e && b.x < a.x+ancho(a)+e &&
         a.y < b.y+alto(b)+e  && b.y < a.y+alto(a)+e;
}
function grupoDe(s){
  if(!s || s.tipo!=='p') return [];
  var dentroG={}, pila=[s], out=[];
  dentroG[s.id]=1;
  while(pila.length){
    var c=pila.pop(); out.push(c);
    piezas.forEach(function(o){
      if(o.tipo!=='p' || dentroG[o.id]) return;
      if(tocan(c,o)){ dentroG[o.id]=1; pila.push(o); }
    });
  }
  return out;
}
/* --- montar el banco --------------------------------------------------------
   Devuelve el motivo por el que no se ha podido, para poder decirlo. */
function probar(s){
  if(!s || s.tipo!=='p') return {ok:false, por:'sin-trozo'};
  var g=grupoDe(s);
  var R = g.length>1 ? rectanguloDe(g)
                     : {w:reduce(s.wp,s.wq), h:reduce(s.hp,s.hq)};
  if(!R) return {ok:false, por:'no-rectangulo', n:g.length};
  var M=mantelDeTrabajo();
  if(!M) return {ok:false, por:'sin-mantel'};
  pushUndo();
  /* fuera el banco anterior entero, con lo que hubiera dentro */
  piezas=piezas.filter(function(o){ return !enBanco(o); });
  var anM=L*M.wp/M.wq, alM=L*M.hp/M.hq;
  var anU=L*R.w.p/R.w.q, alU=L*R.h.p/R.h.q;
  var b=caja(piezas);
  var padX=L*0.34, padTop=L*0.62, padBot=L*0.5, hueco=L*0.5;
  var x0 = b? b.x1+L*0.85 : 0, y0 = b? b.y0-L*0.25 : 0;
  var cm=nuevoMantel({wp:M.wp,wq:M.wq,hp:M.hp,hq:M.hq,fp:M.fp,fq:M.fq},
                     {x:x0+padX, y:y0+padTop});
  cm.nombre=M.nombre; cm.c=M.c;                  // es el mismo mantel, otra vez limpio
  var cu=nuevoTrozo(R.w, R.h, {x:x0+padX+anM+hueco, y:y0+padTop}, true);
  banco={x:x0, y:y0,
         w:padX*2+anM+hueco+anU,
         h:padTop+Math.max(alM,alU)+padBot};
  piezas.push(cm); piezas.push(cu);
  sel=cu.id;
  draw();
  return {ok:true, mantel:cm, unidad:cu, n:g.length};
}

/* =========================================================================
   7. DIBUJO
   draw() repinta el tablero entero. Los manteles debajo, los trozos encima,
   y los carteles con la medida siempre lo último, en coordenadas de pantalla,
   para que ni el zoom ni un trozo puesto encima los tapen.
   ========================================================================= */
function rectRedondo(c,x,y,w,h,r){
  r=Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y);
  c.closePath();
}
function etiquetaCabe(c,txt,anchoCelda,altoCelda){
  if(!txt || altoCelda<13) return '';
  return (c.measureText(txt).width+6<anchoCelda) ? txt : '';
}
/* la etiqueta lleva la unidad detrás, «1/3 u», que si no parece un número
   suelto; si el trozo es estrecho se queda con la fracción y, si no cabe ni
   eso, no se escribe nada */
function etiquetaTrozo(c,v,anchoCelda,altoCelda){
  var f=textoFrac(v);
  return etiquetaCabe(c, f+' u', anchoCelda, altoCelda) ||
         etiquetaCabe(c, f, anchoCelda, altoCelda);
}
function drawPieza(c,s,marcada){
  var p=w2s({x:s.x, y:s.y});
  var w=ancho(s)*view.z, h=alto(s)*view.z;
  if(!isFinite(p.x)||!isFinite(p.y)||!isFinite(w)||!isFinite(h)) return;
  var C=colorDe(s);
  c.save();
  if(opt.alfa && s.tipo==='p') c.globalAlpha=0.55;
  c.save();
  c.shadowColor='rgba(20,25,35,.13)'; c.shadowBlur=6; c.shadowOffsetY=2;
  rectRedondo(c,p.x,p.y,w,h,3.5*view.z);
  c.fillStyle=C.f; c.fill();
  c.restore();

  if(s.a>1 || s.b>1){
    c.save();
    rectRedondo(c,p.x,p.y,w,h,3.5*view.z); c.clip();
    c.strokeStyle=C.b; c.lineWidth=Math.max(1.4, 1.8*view.z);
    var k;
    for(k=1;k<s.a;k++){
      var X=p.x+w*k/s.a;
      c.beginPath(); c.moveTo(X,p.y); c.lineTo(X,p.y+h); c.stroke();
    }
    for(k=1;k<s.b;k++){
      var Y=p.y+h*k/s.b;
      c.beginPath(); c.moveTo(p.x,Y); c.lineTo(p.x+w,Y); c.stroke();
    }
    c.restore();
  }
  /* las etiquetas dicen lo que vale cada celda CON LA UNIDAD DEL ALUMNO;
     el mantel nunca se etiqueta, que es lo que hay que averiguar */
  if(opt.etiq && s.tipo==='p'){
    var v=valorCelda(s);
    if(v){
      c.save();
      c.fillStyle=C.t;
      c.font=Math.max(8,Math.min(13,10*view.z))+'px -apple-system,Segoe UI,Roboto,sans-serif';
      c.textAlign='center'; c.textBaseline='middle';
      var txt=etiquetaTrozo(c, v, w/s.a, h/s.b);
      if(txt) for(var i=0;i<s.a;i++) for(var j=0;j<s.b;j++)
        c.fillText(txt, p.x+w*(i+0.5)/s.a, p.y+h*(j+0.5)/s.b);
      c.restore();
    }
  }

  rectRedondo(c,p.x,p.y,w,h,3.5*view.z);
  c.lineWidth=marcada? 2.6 : (s.pat? 2 : 1.3);
  c.strokeStyle=marcada? '#1f4e8c' : C.b;
  c.stroke();
  c.restore();
}
/* en el cartel va el nombre y la medida, y nada de los lados: no hay con qué
   compararlos, y decirlos sería resolver el problema */
function textoCartel(s){ return s.nombre+' · '+textoFrac({p:s.fp,q:s.fq})+' u'; }
/* la unidad del banco va rotulada con una u, que es de lo que se habla en los
   carteles de los manteles */
function textoCartelUnidad(){ return 'u'; }
/* el cartel se dibuja en coordenadas de pantalla y el último de todo, para que
   ni el zoom ni un trozo puesto encima lo tapen */
function drawCartel(c,s,txt){
  var p=w2s({x:s.x, y:s.y});
  c.save();
  c.font='600 12px -apple-system,Segoe UI,Roboto,sans-serif';
  var w=c.measureText(txt).width+15, h=21;
  var x=p.x, y=p.y-h-5;
  rectRedondo(c,x,y,w,h,7);
  c.fillStyle=colorDe(s).b; c.fill();
  c.fillStyle='#fff'; c.textAlign='left'; c.textBaseline='middle';
  c.fillText(txt, x+7.5, y+h/2+0.5);
  c.restore();
}
/* el banco: un panel rotulado que separa el sitio de construir del de probar */
function drawBanco(c){
  if(!banco) return;
  var p=w2s({x:banco.x, y:banco.y});
  var w=banco.w*view.z, h=banco.h*view.z;
  if(!isFinite(p.x)||!isFinite(w)) return;
  c.save();
  rectRedondo(c,p.x,p.y,w,h,12);
  c.fillStyle='#f3f5f8'; c.fill();
  c.setLineDash([6,5]); c.lineWidth=1.4; c.strokeStyle='#c8cfd9'; c.stroke();
  c.setLineDash([]);
  /* el rótulo va FUERA, encima de la esquina: dentro se lo comía el cartel del
     mantel, porque el hueco de arriba se encoge con el zoom y el cartel no */
  c.font='600 11.5px -apple-system,Segoe UI,Roboto,sans-serif';
  c.fillStyle='#8a919c'; c.textAlign='left'; c.textBaseline='bottom';
  c.fillText('PRUEBA TU UNIDAD', p.x+2, p.y-6);
  c.restore();
}
function drawTodo(c){
  drawBanco(c);
  piezas.forEach(function(s){ if(s.tipo==='m') drawPieza(c,s,s.id===sel); });
  piezas.forEach(function(s){ if(s.tipo==='p') drawPieza(c,s,s.id===sel); });
  piezas.forEach(function(s){ if(s.tipo==='m') drawCartel(c,s,textoCartel(s)); });
  piezas.forEach(function(s){ if(s.pat) drawCartel(c,s,textoCartelUnidad()); });
}
function draw(){
  var W=cv.width/(window.devicePixelRatio||1), H=cv.height/(window.devicePixelRatio||1);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#fbfbfa'; ctx.fillRect(0,0,W,H);
  drawTodo(ctx);
  updateUI();
}

/* =========================================================================
   8. INTERACCIÓN
   ========================================================================= */
function pos(e){
  var r=stage.getBoundingClientRect();
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}
function piezaEn(P){
  var i;
  for(i=piezas.length-1;i>=0;i--) if(piezas[i].tipo==='p' && dentro(P,piezas[i])) return piezas[i];
  for(i=piezas.length-1;i>=0;i--) if(piezas[i].tipo==='m' && dentro(P,piezas[i])) return piezas[i];
  return null;
}
cv.addEventListener('pointerdown',function(e){
  cv.setPointerCapture(e.pointerId);
  var s=pos(e), w=s2w(s);
  var t=piezaEn(w);
  if(t && !opt.mano && e.button!==1 && e.button!==2){
    sel=t.id;
    piezas=piezas.filter(function(q){ return q.id!==t.id; }).concat([t]);
    pushUndo();
    drag={modo:'mover', w0:w, s:t, x0:t.x, y0:t.y};
    draw(); return;
  }
  if(!t && !opt.mano && e.button===0) sel=null;
  drag={modo:'pan', s0:s, v0:{x:view.x, y:view.y}};
  draw();
});
cv.addEventListener('pointermove',function(e){
  if(!drag) return;
  var s=pos(e), w=s2w(s);
  if(drag.modo==='pan'){
    view.x=drag.v0.x+(s.x-drag.s0.x); view.y=drag.v0.y+(s.y-drag.s0.y);
    draw(); return;
  }
  drag.s.x=drag.x0+(w.x-drag.w0.x);
  drag.s.y=drag.y0+(w.y-drag.w0.y);
  draw();
});
function suelta(){
  if(!drag) return;
  if(drag.modo==='mover') aplicaIman(drag.s);
  drag=null;
  draw();
}
cv.addEventListener('pointerup',suelta);
cv.addEventListener('pointercancel',suelta);
cv.addEventListener('contextmenu',function(e){ e.preventDefault(); });
cv.addEventListener('wheel',function(e){
  e.preventDefault();
  var s=pos(e), w=s2w(s);
  var z=Math.max(0.2, Math.min(3, view.z*(e.deltaY<0?1.12:1/1.12)));
  view.z=z; view.x=s.x-w.x*z; view.y=s.y-w.y*z;
  draw();
},{passive:false});

/* --- crear manteles --------------------------------------------------------- */
function ponMantel(R){
  pushUndo();
  var t=nuevoMantel(R, sitioLibre());
  piezas.push(t); sel=t.id;
  fitView();
  return t;
}
document.getElementById('nuevo').addEventListener('click',function(){
  var nivel=+document.getElementById('nivel').value;
  var t=ponMantel(mantelAlAzar(nivel));
  flash('Mantel '+t.nombre+': mide '+textoFrac({p:t.fp,q:t.fq})+' de la unidad perdida');
});
document.getElementById('crear').addEventListener('click',function(){
  var caja0=document.getElementById('aMano');
  var f=leeFraccion(caja0.value);
  if(!f){ flash('Escribe cuánto mide el mantel, por ejemplo 5/6'); return; }
  if(f.p===f.q){ flash('Entonces el mantel sería la unidad, y no habría nada que buscar'); return; }
  if(f.p>MAXD){ flash('El numerador no puede pasar de '+MAXD+', que es en cuántas partes se puede partir'); return; }
  var R=mantelConFraccion(f.p,f.q);
  if(!R){ flash('Con esa medida el mantel o la unidad se salen de la pantalla'); return; }
  var t=ponMantel(R);
  caja0.value='';
  flash('Mantel '+t.nombre+': mide '+textoFrac(f)+' de la unidad perdida');
});

/* --- botones de la pieza ------------------------------------------------------ */
function conSel(f){
  return function(){ var s=seleccionada(); if(s) f(s); };
}
function conTrozo(f){
  return function(){ var s=seleccionada(); if(s && s.tipo==='p') f(s); };
}

    flash('Esos '+r.n+' trozos no forman un rectángulo, y así no se puede doblar la unidad');

document.getElementById('borrar').addEventListener('click',function(){

});

function zoomAt(k){
  var r=stage.getBoundingClientRect(), c={x:r.width/2, y:r.height/2}, w=s2w(c);
  view.z=Math.max(0.2, Math.min(3, view.z*k));
  view.x=c.x-w.x*view.z; view.y=c.y-w.y*view.z;
  draw();
}
document.getElementById('fit').addEventListener('click',fitView);
function fitView(){
  var r=stage.getBoundingClientRect(), m=62;   /* margen para carteles y rótulos */
  var b=cajaTodo();
  if(!b){ view={x:(r.width||600)/2, y:(r.height||400)/2, z:1}; draw(); return; }
  var z=Math.min((r.width-2*m)/((b.x1-b.x0)||1), (r.height-2*m)/((b.y1-b.y0)||1));
  view.z=Math.max(0.2, Math.min(1.6, z));
  view.x=r.width/2-((b.x0+b.x1)/2)*view.z;
  view.y=r.height/2-((b.y0+b.y1)/2)*view.z+14;
  draw();
}
document.addEventListener('keydown',function(e){
  if(e.target && /input|textarea|select/i.test(e.target.tagName)) return;
  var k=(e.key||'').toLowerCase();
  if((e.ctrlKey||e.metaKey) && k==='z'){ e.preventDefault(); doUndo(); return; }
  if(k==='d'){ document.getElementById('dupD').click(); }
  else if(k==='b'){ document.getElementById('dupB').click(); }
  else if(k==='p'){ document.getElementById('probar').click(); }
  else if(k==='s'){ document.getElementById('sacar').click(); }
  else if(k==='e'){ document.getElementById('separar').click(); }
  else if(k==='j'){ document.getElementById('unir').click(); }
  else if(e.key==='ArrowUp'){ document.getElementById('filMas').click(); e.preventDefault(); }
  else if(e.key==='ArrowDown'){ document.getElementById('filMenos').click(); e.preventDefault(); }
  else if(e.key==='ArrowRight'){ document.getElementById('colMas').click(); e.preventDefault(); }
  else if(e.key==='ArrowLeft'){ document.getElementById('colMenos').click(); e.preventDefault(); }
  else if(e.key==='Delete' || e.key==='Backspace'){ document.getElementById('borrar').click(); e.preventDefault(); }
  else if(e.key==='Escape'){ sel=null; draw(); }
});

function leer(f){
  var r=new FileReader();
  r.onload=function(){ try{ loadData(JSON.parse(r.result)); }catch(err){ flash('No he podido leer ese archivo'); } };
  r.readAsText(f);
}
function entero(v){ var n=Number(v); return isFinite(n) && Math.round(n)===n ? n : null; }
function limpiaPiezas(lista){
  if(!Array.isArray(lista)) return null;
  var out=[];
  for(var i=0;i<lista.length;i++){
    var s=lista[i];
    var tipo = s.tipo==='m' ? 'm' : s.tipo==='p' ? 'p' : null;
    if(!tipo) return null;
    var wp=entero(s.wp), wq=entero(s.wq), hp=entero(s.hp), hq=entero(s.hq);
    if(wp===null||wq===null||hp===null||hq===null) return null;
    if(!(wp>0 && wq>0 && hp>0 && hq>0)) return null;
    if(wq>1e6 || hq>1e6 || wp>1e6 || hp>1e6) return null;
    var x=Number(s.x), y=Number(s.y);
    if(!isFinite(x) || !isFinite(y)) return null;
    var a=Math.max(1, Math.min(MAXD, Math.round(Number(s.a)||1)));
    var b=Math.max(1, Math.min(MAXD, Math.round(Number(s.b)||1)));
    var fp=0, fq=1;
    if(tipo==='m'){
      fp=entero(s.fp); fq=entero(s.fq);
      if(fp===null||fq===null||fp<1||fq<1) return null;
    }
    var col=Math.round(Number(s.c)||0);
    if(!(col>=0 && col<PALETA.length)) col=0;
    var cuantos=out.filter(function(o){ return o.tipo==='m'; }).length;
    var yaHayPatron=out.some(function(o){ return o.pat; });
    out.push({id:nid++, tipo:tipo, wp:wp, wq:wq, hp:hp, hq:hq, a:a, b:b,
              pat: tipo==='p' && s.pat && !yaHayPatron ? 1 : 0,   /* patrón hay uno */
              fp:fp, fq:fq, c:col, x:x, y:y,
              nombre: tipo==='m'
                ? (String(s.nombre||'').slice(0,2) || String.fromCharCode(65+(cuantos%26)))
                : ''});
  }
  return out;
}
function limpiaBanco(b){
  if(!b) return null;
  var x=Number(b.x), y=Number(b.y), w=Number(b.w), h=Number(b.h);
  if(![x,y,w,h].every(isFinite) || !(w>0 && h>0)) return null;
  return {x:x, y:y, w:w, h:h};
}
function loadData(d){
  var nuevas=d && limpiaPiezas(d.piezas);
  if(!nuevas){ flash('Ese archivo no trae nada que yo entienda'); return; }
  pushUndo();
  if(importMode==='add'){
    /* al añadir no se trae el banco del archivo: el que manda es el de aquí,
       y dos patrones no pueden convivir */
    var yaHay=!!patron();
    nuevas.forEach(function(s){ if(s.pat){ if(yaHay) s.pat=0; else yaHay=true; } });
    piezas=piezas.concat(nuevas);
  } else {
    piezas=nuevas; banco=limpiaBanco(d.banco);
  }
  sel=null; fitView();
  flash(nuevas.length+(nuevas.length===1?' pieza cargada':' piezas cargadas'));
}

function iconoParte(a,b,lado,C){
  lado=lado||17; C=C||CTROZO;
  var s='<svg width="'+lado+'" height="'+lado+'" viewBox="0 0 '+lado+' '+lado+'">'+
    '<rect x="0.7" y="0.7" width="'+(lado-1.4)+'" height="'+(lado-1.4)+'" rx="2" fill="'+C.f+
    '" stroke="'+C.b+'" stroke-width="1"/>';
  var k;
  for(k=1;k<a;k++){
    var X=(0.7+(lado-1.4)*k/a).toFixed(2);
    s+='<line x1="'+X+'" y1="1" x2="'+X+'" y2="'+(lado-1)+'" stroke="'+C.b+'" stroke-width="1"/>';
  }
  for(k=1;k<b;k++){
    var Y=(0.7+(lado-1.4)*k/b).toFixed(2);
    s+='<line x1="1" y1="'+Y+'" x2="'+(lado-1)+'" y2="'+Y+'" stroke="'+C.b+'" stroke-width="1"/>';
  }
  return s+'</svg>';
}
function panelBancoHTML(){
  var P=patron(), M=mantelBanco();
  if(!P || !M)
    return '<div class="nota" style="margin-top:0">Cuando tengas montado lo que crees que era la '+
           'unidad, selecciónala y pulsa aquí: a la derecha aparecen el mantel otra vez entero y '+
           'tu unidad en una sola pieza, para que la pruebes.</div>';
  var n=P.a*P.b;
  return '<div>En el banco, el mantel <b>'+M.nombre+'</b> y tu unidad'+
         (n>1 ? ', doblada en <b>'+n+'</b> partes.' : ', sin doblar.')+'</div>'+
         '<div class="nota">'+(n>1
           ? 'Saca una parte con <b>✂</b> y ponte a medir el mantel con ella.'
           : 'Dóblala en columnas y filas y ya puedes medir con ella.')+'</div>';
}
function panelMedirHTML(){
  var P=patron(), M=mantelBanco();
  if(!P || !M)
    return '<div class="nota" style="margin-top:0">En cuanto montes el banco, aquí se irá contando '+
           'lo que pongas encima del mantel.</div>';
  var Q=parteUnidad(), h='';
  if(Q && Q.N>1)
    h+='<div class="mant">Tu unidad está doblada en '+Q.N+' partes iguales, así que cada una es '+
       '<b>1/'+Q.N+'</b> de ella.</div>';
  var r=medidaDe(M);
  var cab='<b>Mantel '+M.nombre+'</b>, que mide '+textoFrac({p:M.fp,q:M.fq})+' u: ';
  if(r.estado!=='ok')
    return h+'<div class="mant">'+cab+'<span style="color:#8a919c">todavía no has puesto nada '+
           'encima.</span></div>';
  var cifra, extra='';
  if(r.cuenta){
    /* sin doblar, «2/1» no se dice: se dice 2 */
    cifra = r.cuenta.N===1 ? String(r.cuenta.n) : r.cuenta.n+'/'+r.cuenta.N;
    if(!(r.cuenta.n===r.frac.p && r.cuenta.N===r.frac.q))
      extra=' <span style="color:#8a919c">(o sea '+textoFrac(r.frac)+')</span>';
  } else cifra=textoFrac(r.frac);
  return h+'<div class="mant">'+cab+'has puesto <b>'+r.n+'</b> '+(r.n===1?'trozo':'trozos')+
         ', que son <span class="gr">'+cifra+'</span> de tu unidad.'+extra+
         '<div class="nota">Si cubren el mantel sin huecos ni solapes, eso es lo que mide con tu unidad.</div></div>';
}
var cachePartes='', cacheUni='', cacheMedir='';
function updateUI(){
  var s=seleccionada();
  var esTrozo = !!s && s.tipo==='p';
  ['colMenos','colMas','filMenos','filMas','entera','sacar'].forEach(function(id){
    document.getElementById(id).disabled=!s; });
  document.getElementById('separar').disabled=!(esTrozo && s.a*s.b>1);
  document.getElementById('unir').disabled=!(esTrozo && grupoDe(s).length>1);
  document.getElementById('dupD').disabled=!esTrozo;
  document.getElementById('dupB').disabled=!esTrozo;
  document.getElementById('probar').disabled=!esTrozo;
  document.getElementById('borrar').disabled=!s;

  var C = esTrozo ? (s.pat?CUNI:CTROZO) : PALETA[(s?s.c||0:0)%PALETA.length];
  var claveP = (s? (s.a+'x'+s.b+':'+(s.tipo==='p'?(s.pat?'u':'p'):'m'+(s.c||0))) : '-');
  if(claveP!==cachePartes){
    cachePartes=claveP;
    document.getElementById('ncol').innerHTML = s? (iconoParte(s.a,1,15,C)+s.a) : '—';
    document.getElementById('nfil').innerHTML = s? (iconoParte(1,s.b,15,C)+s.b) : '—';
  }
  var P=patron(), MB=mantelBanco();
  var claveU=(P? P.id+':'+textoFrac(areaDe(P))+'#'+P.a+'x'+P.b : '-')+(MB? ':'+MB.nombre : '');
  if(claveU!==cacheUni){ cacheUni=claveU; document.getElementById('panelBanco').innerHTML=panelBancoHTML(); }
  /* la cuenta solo se enseña si se pide: el material no corrige por su cuenta */
  document.getElementById('h2Medir').style.display = opt.comp? '' : 'none';
  document.getElementById('panelMedir').style.display = opt.comp? '' : 'none';
  var rM = (opt.comp && MB)? medidaDe(MB) : {estado:'-'};
  var claveM=(opt.comp?'C':'-')+claveU+'||'+rM.estado+':'+(rM.n||0)+
             ':'+(rM.frac?textoFrac(rM.frac):'')+':'+(rM.cuenta? rM.cuenta.n+'/'+rM.cuenta.N : '');
  if(claveM!==cacheMedir){
    cacheMedir=claveM;
    if(opt.comp) document.getElementById('panelMedir').innerHTML=panelMedirHTML();
  }

  var t;
  if(flashMsg && Date.now()-flashT<2300) t=flashMsg;
  else if(!piezas.length) t='Pide un mantel: viene con su medida puesta, pero sin la unidad';
  else if(s && s.tipo==='m') t='Puedes partir el mantel en columnas y filas, y sacar una de las partes con S';
  else if(esTrozo && s.pat && s.a*s.b>1)
    t='Tu unidad, doblada en '+(s.a*s.b)+' · saca una parte con S y mide el mantel del banco';
  else if(esTrozo && s.pat) t='Tu unidad en el banco: dóblala en columnas y filas para medir con ella';
  else if(esTrozo) t='D y B duplican al lado · J une lo pegado · E separa · P lleva tu unidad al banco';
  else t='Arrastra para colocar · con la transparencia se ve el mantel bajo los trozos';
  hintEl.textContent=t;
}

/* =========================================================================
  11. AUTOCOMPROBACIÓN  ·  añade #test al final de la dirección
   ========================================================================= */
function runSelfTest(){
  var out=[], fails=0;
  function ok(n,c,extra){ out.push((c?'OK    ':'FALLO ')+n+(extra!==undefined?'   ['+extra+']':'')); if(!c) fails++; }
  function num(v){ return (Math.round(v*1000)/1000).toString().replace('.',','); }

  try{

  /* --- fracciones ------------------------------------------------------------ */
  ok('reducir simplifica', (function(){ var f=reduce(18,12); return f.p===3 && f.q===2; })());
  ok('5/6 y 10/12 son la misma fracción', igualFrac(reduce(5,6), reduce(10,12)));
  ok('sumar fracciones da el total reducido', (function(){
      var f=sumaFrac({p:1,q:6},{p:1,q:3}); return f.p===1 && f.q===2; })());
  ok('dividir fracciones compara dos áreas', (function(){
      var f=divFrac({p:3,q:2},{p:9,q:5}); return f.p===5 && f.q===6; })(),
     textoFrac(divFrac({p:3,q:2},{p:9,q:5})));
  ok('«5/6» se lee bien', (function(){ var f=leeFraccion('5/6'); return f && f.p===5 && f.q===6; })());
  ok('lo que no es una fracción se rechaza',
     leeFraccion('mantel')===null && leeFraccion('3/0')===null && leeFraccion('0/5')===null);

  /* --- guardo lo que hubiera en el tablero ------------------------------------ */
  var antesP=piezas, antesS=sel, antesV=view, antesI=opt.iman, antesE=opt.etiq,
      antesC=opt.comp, antesU=undoStack, antesB=banco;
  piezas=[]; sel=null; view={x:0,y:0,z:1}; opt.iman=1; opt.etiq=0; opt.comp=1;
  undoStack=[]; banco=null;

  /* --- lo que propone el entorno ------------------------------------------------ */
  ok('una fracción con el numerador igual al denominador no vale: el mantel sería la unidad',
     !fraccionValida(3,3));
  ok('ni una que se pueda simplificar, porque el corte que pide sería otro',
     !fraccionValida(4,6));
  ok('ni un numerador mayor que las partes en que se puede partir', !fraccionValida(13,7));
  ok('los tres niveles proponen manteles que se pueden reconstruir', (function(){
      var malos=[];
      [0,1,2].forEach(function(nv){
        var N=NIVELES[nv];
        for(var i=0;i<400;i++){
          var R=mantelAlAzar(nv);
          if(!fraccionValida(R.fp,R.fq)) malos.push('fracción '+R.fp+'/'+R.fq);
          else if(R.fp>N.maxp || R.fq>N.maxq) malos.push('se pasa del nivel '+nv);
          else if(!formaValida({wp:R.wp,wq:R.wq,hp:R.hp,hq:R.hq}, R.fp, R.fq))
            malos.push('forma fuera de pantalla');
        }
      });
      return malos.length===0; })());
  ok('el nivel fácil no pide juntar más de tres trozos', (function(){
      for(var i=0;i<300;i++) if(mantelAlAzar(0).fq>NIVELES[0].maxq) return false;
      return true; })());
  ok('pedir un mantel de 5/6 da un mantel de 5/6', (function(){
      var R=mantelConFraccion(5,6); return R && R.fp===5 && R.fq===6; })());
  ok('y pedir uno imposible de dibujar avisa en vez de inventárselo',
     mantelConFraccion(1,12)===null || formaValida(mantelConFraccion(1,12),1,12));

  /* --- las piezas ----------------------------------------------------------------- */
  var M=nuevoMantel({wp:3,wq:2,hp:1,hq:1,fp:5,fq:6},{x:0,y:0});
  piezas=[M];
  ok('el mantel mide de ancho lo que dice su fracción de lado',
     Math.abs(ancho(M)-L*1.5)<1e-9 && Math.abs(alto(M)-L)<1e-9);
  ok('y su área sale de multiplicar los lados', (function(){
      var A=areaDe(M); return A.p===3 && A.q===2; })(), textoFrac(areaDe(M)));
  ok('en el cartel solo va el nombre y la medida, nunca los lados',
     textoCartel(M)==='A · 5/6 u', textoCartel(M));
  ok('el mantel se llama con una letra', /^[A-Z]$/.test(M.nombre), M.nombre);

  /* --- partir ---------------------------------------------------------------------- */
  parte(M,5,1);
  ok('partido en 5 columnas hay 4 marcas verticales y ninguna horizontal',
     marcasX(M).length===4 && marcasY(M).length===0);
  ok('y las marcas caen donde toca', marcasX(M).every(function(x,k){
      return Math.abs(x-(M.x+ancho(M)*(k+1)/5))<1e-9; }));
  ok('cada parte del mantel partido en 5 es la quinta parte de su área',
     igualFrac(divFrac(areaCelda(M), areaDe(M)), {p:1,q:5}),
     textoFrac(divFrac(areaCelda(M), areaDe(M))));
  parte(M,99,99);
  ok('no se puede partir en más de '+MAXD, M.a===MAXD && M.b===MAXD);
  parte(M,0,0);
  ok('ni en menos de una parte', M.a===1 && M.b===1);
  parte(M,5,1);

  /* --- sacar un trozo ---------------------------------------------------------------- */
  var T=sacarTrozo(M);
  ok('el trozo sacado del mantel partido en 5 mide un quinto del mantel',
     igualFrac(divFrac(areaDe(T), areaDe(M)), {p:1,q:5}),
     textoFrac(divFrac(areaDe(T), areaDe(M))));
  ok('y sale sin partir, para poder volver a partirlo', T.a===1 && T.b===1);
  ok('el trozo sale a la derecha del mantel, sin taparlo', T.x>=M.x+ancho(M));
  ok('de una pieza sin partir se saca una copia entera', (function(){
      var g={id:0,tipo:'p',wp:2,wq:3,hp:1,hq:1,a:1,b:1,u:0,x:0,y:0};
      piezas.push(g);
      var c=sacarTrozo(g);
      var bien=igualFrac(areaDe(c), areaDe(g));
      piezas=piezas.filter(function(s){ return s.id!==c.id && s.id!==g.id; });
      return bien; })());
  ok('el mantel no se puede separar en trozos sueltos', separar(M)===null);
  ok('ni duplicar', duplicaEn(M,'d')===null);

  /* --- LA RECONSTRUCCIÓN --------------------------------------------------------------
     El mantel mide 5/6 de la unidad perdida: partido en 5, cada parte es 1/6 de
     la unidad, y con 6 de esas partes se rehace. Es la comprobación central. */
  var uni=[T];
  for(var i=1;i<6;i++) uni.push(duplicaEn(uni[i-1],'d'));
  ok('los seis van pegados en fila', uni.every(function(t,k){
      return k===0 || Math.abs(t.x-(uni[k-1].x+ancho(uni[k-1])))<1e-9; }));
  ok('los seis se reconocen como un solo grupo', grupoDe(T).length===6, grupoDe(T).length);
  var areaSeis=(function(){ var s={p:0,q:1};
    uni.forEach(function(t){ s=sumaFrac(s, areaDe(t)); }); return s; })();
  ok('esa unidad es 6/5 del mantel',
     igualFrac(divFrac(areaSeis, areaDe(M)), {p:6,q:5}),
     textoFrac(divFrac(areaSeis, areaDe(M))));
  ok('y entonces el mantel mide con ella justo lo que dice su cartel',
     igualFrac(divFrac(areaDe(M), areaSeis), {p:M.fp,q:M.fq}),
     textoFrac(divFrac(areaDe(M), areaSeis)));
  ok('con cinco trozos se quedaría corta y con siete se pasaría', (function(){
      var cinco={p:0,q:1}, siete={p:0,q:1};
      for(var k=0;k<5;k++) cinco=sumaFrac(cinco, areaDe(T));
      for(k=0;k<7;k++) siete=sumaFrac(siete, areaDe(T));
      var buena=areaSeis;
      return cinco.p*buena.q < buena.p*cinco.q && siete.p*buena.q > buena.p*siete.q; })());

  /* --- otra unidad, de otra forma, tiene la misma área -------------------------------------- */
  ok('12 trozos de partir el mantel en 5 por 2 dan la misma unidad, con otra forma',
     (function(){
      var guardaP=piezas, guardaS=sel;
      var M2=nuevoMantel({wp:3,wq:2,hp:1,hq:1,fp:5,fq:6},{x:0,y:0});
      piezas=[M2];
      parte(M2,5,2);
      var t0=sacarTrozo(M2);
      var suma=areaDe(t0);
      for(var k=1;k<12;k++) suma=sumaFrac(suma, areaDe(t0));
      var bien = igualFrac(divFrac(areaDe(M2), suma), {p:5,q:6}) &&
                 !igualFrac(areaDe(t0), areaDe(T));
      piezas=guardaP; sel=guardaS;
      return bien; })(),
     'trozos de otra forma y otro tamaño, misma unidad');

  /* --- el imán ------------------------------------------------------------------------------ */
  var anT=ancho(T), sobre=[];
  for(i=0;i<5;i++){
    var t=nuevoTrozo(reduce(T.wp,T.wq), reduce(T.hp,T.hq), {x:M.x+anT*i, y:M.y}, false);
    piezas.push(t); sobre.push(t);
  }
  ok('un trozo casi pegado a otro se engancha por el borde', (function(){
      var b1=sobre[0], b2=nuevoTrozo(reduce(T.wp,T.wq), reduce(T.hp,T.hq),
                                     {x:b1.x+anT+5, y:b1.y+4}, false);
      piezas.push(b2);
      aplicaIman(b2);
      var bien=Math.abs(b2.x-(b1.x+anT))<1e-9 && Math.abs(b2.y-b1.y)<1e-9;
      piezas=piezas.filter(function(s){ return s.id!==b2.id; });
      return bien; })());
  ok('y uno que está lejos se queda donde lo sueltes', (function(){
      var b3=nuevoTrozo({p:1,q:2},{p:1,q:2},{x:9*L, y:7*L}, false);
      piezas.push(b3);
      var x0=b3.x, y0=b3.y;
      aplicaIman(b3);
      var quieto=Math.abs(b3.x-x0)<1e-9 && Math.abs(b3.y-y0)<1e-9;
      piezas=piezas.filter(function(s){ return s.id!==b3.id; });
      return quieto; })());
  /* el trozo de prueba mide 1/3 a propósito: con 1/4 su borde derecho caía a
     1,5 px de la marca siguiente y el imán enganchaba por ahí, que es lo
     correcto, pero entonces la prueba no probaba lo que dice */
  ok('el imán engancha también con las marcas de partir el mantel', (function(){
      var b4=nuevoTrozo({p:1,q:3},{p:1,q:3},{x:M.x+ancho(M)*2/5+6, y:M.y-5}, false);
      piezas.push(b4);
      aplicaIman(b4);
      var bien=Math.abs(b4.x-(M.x+ancho(M)*2/5))<1e-9 && Math.abs(b4.y-M.y)<1e-9;
      piezas=piezas.filter(function(s){ return s.id!==b4.id; });
      return bien; })());

  /* --- separar y el grupo pegado ---------------------------------------------------------- */
  piezas=[]; sel=null;
  var g0=nuevoTrozo({p:1,q:1},{p:1,q:1},{x:0,y:0}, false);
  piezas=[g0];
  parte(g0,3,2);
  var hijos=separar(g0);
  ok('separar un trozo partido en 3 por 2 da seis trozos', hijos && hijos.length===6, hijos&&hijos.length);
  ok('y entre todos ocupan lo mismo que el trozo de partida', (function(){
      var s={p:0,q:1};
      hijos.forEach(function(h){ s=sumaFrac(s, areaDe(h)); });
      return s.p===1 && s.q===1; })());
  ok('los seis quedan embaldosando el sitio del original, sin huecos', (function(){
      var an=L/3, al=L/2, visto={};
      for(var k=0;k<hijos.length;k++){
        var ci=Math.round(hijos[k].x/an), cj=Math.round(hijos[k].y/al);
        if(Math.abs(hijos[k].x-ci*an)>1e-9 || Math.abs(hijos[k].y-cj*al)>1e-9) return false;
        if(ci<0||ci>2||cj<0||cj>1) return false;
        if(visto[ci+','+cj]) return false;
        visto[ci+','+cj]=1;
      }
      return Object.keys(visto).length===6; })());
  ok('el grupo pegado son los seis', grupoDe(hijos[0]).length===6, grupoDe(hijos[0]).length);
  ok('y uno apartado no entra en el grupo', (function(){
      var lejos=nuevoTrozo({p:1,q:1},{p:1,q:1},{x:5*L,y:5*L}, false);
      piezas.push(lejos);
      var n=grupoDe(hijos[0]).length;
      piezas=piezas.filter(function(s){ return s.id!==lejos.id; });
      return n===6; })());

  /* --- unir en una pieza ---------------------------------------------------------------------
     Unir solo vale si los trozos embaldosan un rectángulo. */
  piezas=[]; sel=null;
  function pon(w,h,x,y){
    var t=nuevoTrozo(w,h,{x:x,y:y},false); piezas.push(t); return t;
  }
  var f1={p:1,q:1};
  var c1=pon(f1,f1,0,0), c2=pon(f1,f1,L,0), c3=pon(f1,f1,0,L);
  ok('tres cuadrados en ele no se pueden unir: no forman un rectángulo',
     unir(c1)===null, 'la caja mide 2 por 2 y solo hay 3 de área');
  var c4=pon(f1,f1,L,L);
  var U4=unir(c1);
  ok('completando el cuadrado sí se unen', !!U4);
  ok('y sale una pieza de dos por dos, con el área de los cuatro',
     U4 && igualFrac(areaDe(U4), {p:4,q:1}), U4? textoFrac(areaDe(U4)) : '—');
  ok('la pieza unida no lleva marcas por dentro: está lista para partirla de nuevo',
     U4.a===1 && U4.b===1);
  ok('en el tablero queda una pieza donde había cuatro', piezas.length===1, piezas.length);
  piezas=[]; sel=null;
  ok('un rectángulo con un hueco en medio tampoco se une', (function(){
      var lista=[];
      for(var i=0;i<3;i++) for(var j=0;j<3;j++)
        if(!(i===1&&j===1)) lista.push(pon(f1,f1,L*i,L*j));
      var r=unir(lista[0]);
      piezas=[]; sel=null;
      return r===null; })(), 'la fila de arriba y la columna de la izquierda están enteras');
  ok('ni dos piezas pegadas de alturas distintas', (function(){
      var a=pon(f1,f1,0,0), b=pon(f1,{p:1,q:2},L,0);
      var r=unir(a);
      piezas=[]; sel=null;
      return r===null; })());
  ok('una pieza suelta no se une consigo misma', (function(){
      var a=pon(f1,f1,0,0);
      var r=unir(a);
      piezas=[]; sel=null;
      return r===null; })());

  /* --- EL RECORRIDO ENTERO: construir, llevar al banco y medir --------------------------------
     Es lo que se hace de verdad delante de la pantalla. El mantel mide 5/6 de
     la unidad perdida; una vez rehecha, se lleva al banco, se dobla y se mide
     con sus partes, que es medir de toda la vida. */
  piezas=[]; sel=null; banco=null;
  var Z=nuevoMantel({wp:3,wq:2,hp:1,hq:1,fp:5,fq:6},{x:0,y:0});
  piezas=[Z];
  parte(Z,5,1);
  var z0=sacarTrozo(Z);
  var prev=z0;
  for(i=1;i<6;i++) prev=duplicaEn(prev,'d');
  var res=probar(z0);
  ok('llevar los seis trozos al banco lo monta', res.ok===true, res.por||'ok');
  var UNI=patron(), ZB=mantelBanco();
  ok('en el banco hay una unidad y un mantel', !!UNI && !!ZB);
  ok('el mantel del banco es el mismo, con su letra y su medida',
     ZB.nombre===Z.nombre && ZB.fp===Z.fp && ZB.fq===Z.fq, textoCartel(ZB));
  ok('y llega limpio, sin las divisiones que se hicieron para construir',
     ZB.a===1 && ZB.b===1, 'el de construir sigue partido en '+Z.a);
  ok('la unidad del banco es una pieza lisa', UNI.a===1 && UNI.b===1);
  ok('la unidad del banco lleva su cartel con la u', textoCartelUnidad()==='u');
  ok('esa unidad mide 6/5 del mantel, como debía',
     igualFrac(divFrac(areaDe(UNI), areaDe(Z)), {p:6,q:5}),
     textoFrac(divFrac(areaDe(UNI), areaDe(Z))));
  ok('la zona de construir se queda como estaba: el mantel y los seis trozos',
     piezas.filter(function(s){ return !enBanco(s); }).length===7,
     piezas.filter(function(s){ return !enBanco(s); }).length);
  ok('el banco cae a la derecha de lo construido',
     banco.x > caja(piezas.filter(function(s){ return !enBanco(s); })).x1);
  ok('volver a probar rehace el banco en vez de acumular otro', (function(){
      var r2=probar(z0);
      return r2.ok && piezas.filter(function(s){ return s.pat; }).length===1 &&
             piezas.filter(function(s){ return s.tipo==='m'; }).length===2; })(),
     piezas.length+' piezas en total');
  UNI=patron(); ZB=mantelBanco();

  parte(UNI,6,1);
  ok('doblada en 6, cada parte de la unidad vale 1/6 de ella',
     textoFrac(valorCelda(UNI))==='1/6', textoFrac(valorCelda(UNI)));
  var zt=sacarTrozo(UNI);
  zt.x=ZB.x; zt.y=ZB.y;
  var cubren=[zt];
  for(i=1;i<5;i++) cubren.push(duplicaEn(cubren[i-1],'d'));
  ok('cinco de esas partes llegan justo al borde del mantel del banco',
     Math.abs((cubren[4].x+ancho(cubren[4]))-(ZB.x+ancho(ZB)))<1e-9 &&
     Math.abs(alto(zt)-alto(ZB))<1e-9);
  ok('y entre las cinco tienen el área del mantel', (function(){
      var s={p:0,q:1};
      cubren.forEach(function(t){ s=sumaFrac(s, areaDe(t)); });
      return igualFrac(s, areaDe(ZB)); })());
  var rz=medidaDe(ZB);
  ok('midiendo así, al mantel le sale lo que dice su cartel',
     rz.estado==='ok' && rz.n===5 && igualFrac(rz.frac, {p:ZB.fp,q:ZB.fq}),
     rz.frac? rz.n+' partes → '+textoFrac(rz.frac) : '—');
  ok('la cuenta se da sin simplificar: arriba las partes que caben, abajo en las que se dobló',
     rz.cuenta && rz.cuenta.n===5 && rz.cuenta.N===6,
     rz.cuenta? rz.cuenta.n+'/'+rz.cuenta.N : 'sin cuenta');
  ok('y una parte más se pasaría del mantel',
     Math.abs((cubren[4].x+2*ancho(zt))-(ZB.x+ancho(ZB)))>1e-6);
  ok('quitando una parte, la cuenta baja a 4/6 aunque la fracción sea 2/3', (function(){
      var guarda=cubren[4].x;
      cubren[4].x=ZB.x-3*ancho(ZB);
      var r2=medidaDe(ZB);
      cubren[4].x=guarda;
      return r2.cuenta && r2.cuenta.n===4 && r2.cuenta.N===6 &&
             r2.frac.p===2 && r2.frac.q===3; })());
  ok('y si lo que se pone no son partes de la unidad, no hay cuenta que dar', (function(){
      var raro=nuevoTrozo({p:1,q:7},{p:1,q:7},
                          {x:ZB.x+ancho(ZB)/2, y:ZB.y+alto(ZB)/2}, false);
      piezas.push(raro);
      var r3=medidaDe(ZB);
      piezas=piezas.filter(function(s){ return s.id!==raro.id; });
      return !r3.cuenta && !!r3.frac; })());

  /* --- LA UNIDAD ENTERA TAMBIÉN MIDE ----------------------------------------------------------
     Iterar la unidad sobre lo que se mide es medir: puesta encima del mantel
     tiene que contar como una, no quedarse muda. */
  ok('la unidad puesta encima del mantel cuenta como una unidad', (function(){
      var fuera=cubren.map(function(t){ return t.x; });
      cubren.forEach(function(t){ t.x=ZB.x-5*ancho(ZB); });
      var gx=UNI.x, gy=UNI.y;
      UNI.x=ZB.x+ancho(ZB)/2-ancho(UNI)/2; UNI.y=ZB.y+alto(ZB)/2-alto(UNI)/2;
      var r4=medidaDe(ZB);
      UNI.x=gx; UNI.y=gy;
      cubren.forEach(function(t,k){ t.x=fuera[k]; });
      return r4.estado==='ok' && r4.n===1 && r4.frac.p===1 && r4.frac.q===1; })(),
     'una unidad entera → 1');
  ok('y con la unidad sin doblar el panel dice «1», no «1/1»', (function(){
      var fuera=cubren.map(function(t){ return t.x; });
      cubren.forEach(function(t){ t.x=ZB.x-5*ancho(ZB); });
      var gx=UNI.x, gy=UNI.y, ga=UNI.a;
      UNI.a=1;
      UNI.x=ZB.x+ancho(ZB)/2-ancho(UNI)/2; UNI.y=ZB.y+alto(ZB)/2-alto(UNI)/2;
      cacheMedir=''; draw();
      var t=document.getElementById('panelMedir').textContent;
      UNI.x=gx; UNI.y=gy; UNI.a=ga;
      cubren.forEach(function(x,k){ cubren[k].x=fuera[k]; });
      cacheMedir=''; draw();
      return t.indexOf('son 1 de tu unidad')>=0 && t.indexOf('1/1')<0; })());
  ok('el mantel de construir ya no se mide: el que cuenta es el del banco',
     medidaDe(Z).estado==='sin-trozos' && medidaDe(ZB).estado==='ok');
  ok('sin unidad no hay medida', (function(){
      UNI.pat=0;
      var e=medidaDe(ZB).estado;
      UNI.pat=1;
      return e==='sin-unidad'; })());

  /* --- la cuenta solo sale si se pide ---------------------------------------------------------
     El material no corrige por su cuenta: el recuento vive detrás de la casilla
     de comprobaciones, y apagada no se enseña nada. */
  sel=null;
  opt.comp=0; cacheMedir=''; cacheUni=''; draw();
  ok('con las comprobaciones apagadas, el panel de la cuenta no se ve',
     document.getElementById('panelMedir').style.display==='none' &&
     document.getElementById('h2Medir').style.display==='none');
  ok('y el del banco sigue diciendo lo que hay, sin sacar cuentas',
     document.getElementById('panelBanco').textContent.indexOf('5/6')<0 &&
     document.getElementById('panelBanco').textContent.indexOf('1/6')<0,
     document.getElementById('panelBanco').textContent.slice(0,46));
  opt.comp=1; cacheMedir=''; draw();
  ok('encendidas, aparece con la fracción que ha medido el alumno',
     document.getElementById('panelMedir').style.display!=='none' &&
     document.getElementById('panelMedir').textContent.indexOf('5/6')>=0,
     document.getElementById('panelMedir').textContent.replace(/\s+/g,' ').slice(0,72));
  ok('la medida que se enseña sale de lo que ha puesto el alumno, no de la respuesta',
     (function(){
      piezas=piezas.filter(function(s){ return s.id!==cubren[4].id; });
      cacheMedir=''; draw();
      var t=document.getElementById('panelMedir').textContent;
      return t.indexOf('4/6')>=0 || t.indexOf('2/3')>=0; })(),
     document.getElementById('panelMedir').textContent.replace(/\s+/g,' ').slice(0,72));

  /* --- las etiquetas van con la unidad del alumno, y llevan la u -----------------------------  */
  piezas=[]; sel=null; banco=null;
  var e1=nuevoTrozo({p:1,q:1},{p:1,q:1},{x:0,y:0}, true);
  var e3=nuevoTrozo({p:1,q:2},{p:1,q:1},{x:0,y:L*1.4}, false);
  piezas=[e1,e3];
  ok('sin unidad no se etiqueta nada', (function(){
      e1.pat=0;
      var v=valorCelda(e3);
      e1.pat=1;
      return v===null; })());
  ok('con esa unidad, medio trozo vale 1/2',
     textoFrac(valorCelda(e3))==='1/2', textoFrac(valorCelda(e3)));
  parte(e3,3,1);
  ok('y si ese trozo se parte en 3, cada parte vale 1/6',
     textoFrac(valorCelda(e3))==='1/6', textoFrac(valorCelda(e3)));
  ok('la unidad entera vale 1', textoFrac(valorCelda(e1))==='1', textoFrac(valorCelda(e1)));
  ctx.save();
  ctx.font='10px -apple-system,Segoe UI,Roboto,sans-serif';
  var anLargo=ctx.measureText('1/6 u').width, anCorto=ctx.measureText('1/6').width;
  var etL=etiquetaTrozo(ctx,{p:1,q:6},anLargo+8,40);
  var etC=etiquetaTrozo(ctx,{p:1,q:6},anCorto+8,40);
  var etN=etiquetaTrozo(ctx,{p:1,q:6},anCorto,40);
  var etBaja=etiquetaTrozo(ctx,{p:1,q:6},anLargo+8,9);
  ctx.restore();
  ok('la etiqueta lleva la unidad detrás: 1/6 u', etL==='1/6 u', etL);
  ok('si el trozo es estrecho se queda con la fracción sola', etC==='1/6', etC);
  ok('si no cabe ni eso, no se escribe nada', etN==='', '«'+etN+'»');
  ok('y si el trozo es muy bajo, tampoco', etBaja==='', '«'+etBaja+'»');

  /* --- guardar y abrir ------------------------------------------------------------------------ */
  piezas=[]; sel=null;
  banco={x:-40, y:-15, w:3*L, h:2*L};
  var s1=nuevoTrozo({p:3,q:10},{p:1,q:1},{x:11,y:22}, true); s1.a=2; s1.b=3;
  var s2=nuevoMantel({wp:5,wq:4,hp:3,hq:2,fp:7,fq:4},{x:-30,y:80});
  piezas=[s1,s2];
  function firmaDe(){
    return piezas.map(function(s){
      return s.tipo+':'+s.wp+'/'+s.wq+'x'+s.hp+'/'+s.hq+':'+s.a+','+s.b+':u'+(s.pat||0)+
             ':'+(s.fp||0)+'/'+(s.fq||1)+':'+s.x.toFixed(2)+','+s.y.toFixed(2); }).join(' | ');
  }
  var firma=firmaDe();
  var data={formato:'unidad-perdida', version:2, banco:banco,
    piezas:piezas.map(function(s){
      return {tipo:s.tipo,wp:s.wp,wq:s.wq,hp:s.hp,hq:s.hq,a:s.a,b:s.b,pat:s.pat||0,
              fp:s.fp||0,fq:s.fq||1,c:s.c||0,x:s.x,y:s.y,nombre:s.nombre}; })};
  banco=null;
  importMode='replace'; loadData(JSON.parse(JSON.stringify(data)));
  ok('guardar y volver a abrir conserva las piezas, las divisiones y el patrón',
     firmaDe()===firma, firmaDe());
  ok('y también el banco', !!banco && Math.abs(banco.w-3*L)<1e-9, banco? banco.w : 'sin banco');
  var n0=piezas.length;
  importMode='add'; loadData(JSON.parse(JSON.stringify(data)));
  ok('el botón ＋ añade sin borrar lo que había', piezas.length===n0*2, piezas.length);
  ok('y al añadir no aparece un segundo patrón, que unidad hay una',
     piezas.filter(function(s){ return s.pat; }).length===1,
     piezas.filter(function(s){ return s.pat; }).length);
  importMode='replace';
  ok('un archivo con dos patrones deja solo el primero', (function(){
      var l=limpiaPiezas([{tipo:'p',wp:1,wq:1,hp:1,hq:1,a:1,b:1,pat:1,x:0,y:0},
                          {tipo:'p',wp:1,wq:1,hp:1,hq:1,a:1,b:1,pat:1,x:0,y:0}]);
      return l && l.filter(function(s){ return s.pat; }).length===1; })());
  ok('un archivo con un mantel sin medida se rechaza',
     limpiaPiezas([{tipo:'m',wp:1,wq:1,hp:1,hq:1,a:1,b:1,x:0,y:0}])===null);
  ok('y uno con lados de cero o negativos',
     limpiaPiezas([{tipo:'p',wp:0,wq:1,hp:1,hq:1,a:1,b:1,x:0,y:0}])===null &&
     limpiaPiezas([{tipo:'p',wp:1,wq:1,hp:-2,hq:1,a:1,b:1,x:0,y:0}])===null);
  ok('y uno con coordenadas que no son números',
     limpiaPiezas([{tipo:'p',wp:1,wq:1,hp:1,hq:1,a:1,b:1,x:'ahí',y:0}])===null);
  ok('y uno con una pieza de un tipo que no existe',
     limpiaPiezas([{tipo:'servilleta',wp:1,wq:1,hp:1,hq:1,a:1,b:1,x:0,y:0}])===null);

  /* --- deshacer ------------------------------------------------------------------------------- */
  piezas=[]; sel=null; undoStack=[]; banco=null;
  var z1=nuevoTrozo({p:1,q:1},{p:1,q:1},{x:0,y:0}, false); piezas=[z1]; sel=z1.id;
  parte(z1,4,1);
  ok('partir queda registrado', z1.a===4);
  doUndo();
  ok('y deshacer lo devuelve a como estaba', piezas[0].a===1, piezas[0].a);
  undoStack=[];
  var zm=nuevoMantel({wp:3,wq:2,hp:1,hq:1,fp:5,fq:6},{x:0,y:0});
  piezas=[zm, z1]; sel=z1.id;
  probar(z1);
  ok('montar el banco deja un patrón y dos manteles',
     !!patron() && piezas.filter(function(s){ return s.tipo==='m'; }).length===2);
  doUndo();
  ok('y deshacer se lo lleva entero, banco incluido',
     !patron() && !banco && piezas.length===2, piezas.length+' piezas');

  piezas=antesP; sel=antesS; view=antesV; opt.iman=antesI; opt.etiq=antesE;
  opt.comp=antesC; undoStack=antesU; banco=antesB;
  cachePartes=''; cacheUni=''; cacheMedir='';
  draw();

  }catch(errT){
    fails++;
    out.push('FALLO se ha cortado aquí: '+((errT&&errT.message)||errT));
    if(errT&&errT.stack) String(errT.stack).split('\n').slice(0,5).forEach(function(l){
      out.push('        '+l.trim()); });
    try{ draw(); }catch(e2){}
  }

  /* --- informe ------------------------------------------------------------------------------- */
  var texto=out.join('\n')+'\n\n'+(fails? fails+' PRUEBAS FALLIDAS de '+out.length
                                         : 'LAS '+out.length+' PRUEBAS CORRECTAS');
  var box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;background:#fff;z-index:99;overflow:auto;padding:18px 22px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
  box.innerHTML='<div style="font:600 15px/1.3 -apple-system,Segoe UI,Roboto,sans-serif;margin-bottom:4px">'+
      'Autocomprobación de En busca de la unidad perdida</div>'+
    '<div style="font:13px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;color:'+(fails?'#c2410c':'#15803d')+';font-weight:600;margin-bottom:12px">'+
      (fails? fails+' pruebas fallidas de '+out.length : 'Las '+out.length+' pruebas correctas')+'</div>'+
    '<button id="cpTest" style="font:13px -apple-system,Segoe UI,Roboto,sans-serif;padding:6px 12px;margin-bottom:14px;'+
      'border:1px solid #d5d9e0;border-radius:7px;background:#fff;cursor:pointer">Copiar informe</button> '+
    '<button id="clTest" style="font:13px -apple-system,Segoe UI,Roboto,sans-serif;padding:6px 12px;margin-bottom:14px;'+
      'border:1px solid #d5d9e0;border-radius:7px;background:#fff;cursor:pointer">Cerrar y usar el manipulativo</button>'+
    '<pre style="white-space:pre-wrap;margin:0">'+
      out.map(function(l){ return l.indexOf('FALLO')===0
        ? '<span style="color:#c2410c;font-weight:700">'+l+'</span>' : l; }).join('\n')+'</pre>';
  document.body.appendChild(box);
  document.getElementById('cpTest').addEventListener('click',function(){
    var ta=document.createElement('textarea'); ta.value=texto; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); }catch(err){}
    document.body.removeChild(ta); this.textContent='Copiado ✓';
  });
  document.getElementById('clTest').addEventListener('click',function(){ box.remove(); });
}
var testLanzado=false;
function lanzarTest(){ if(testLanzado) return; testLanzado=true; runSelfTest(); }
if((location.hash||'').indexOf('test')>=0) setTimeout(lanzarTest,60);
window.addEventListener('hashchange',function(){
  if((location.hash||'').indexOf('test')>=0) lanzarTest();
});

window.__unidadPerdida={
  test:runSelfTest, L:L, MAXD:MAXD, NIVELES:NIVELES, FORMAS:FORMAS, opt:opt,
  piezas:function(){ return piezas; }, sel:function(){ return sel; },
  ancho:ancho, alto:alto, areaDe:areaDe, areaCelda:areaCelda,
  marcasX:marcasX, marcasY:marcasY, parte:parte, sacarTrozo:sacarTrozo, separar:separar,
  duplicaEn:duplicaEn, grupoDe:grupoDe,
  unir:unir, rectanguloDe:rectanguloDe, textoFrac:textoFrac,
  probar:probar, patron:patron, mantelBanco:mantelBanco, enBanco:enBanco,
  banco:function(){ return banco; }, cajaTodo:cajaTodo,
  areaUnidad:areaUnidad, trozosSobre:trozosSobre,
  medidaDe:medidaDe, parteUnidad:parteUnidad, valorCelda:valorCelda, textoCartel:textoCartel,
  nuevoMantel:nuevoMantel, nuevoTrozo:nuevoTrozo, mantelAlAzar:mantelAlAzar,
  mantelConFraccion:mantelConFraccion, fraccionValida:fraccionValida,
  leeFraccion:leeFraccion, reduce:reduce, divFrac:divFrac, sumaFrac:sumaFrac,
  aplicaIman:aplicaIman, load:loadData, setMode:function(m){ importMode=m; },
  redraw:draw, fit:fitView
};

})();
</script>
