<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Geotiras · manipulativo virtual</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
       font-size:14px;color:#2b2f36;background:#fff;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #app{display:flex;height:100%;width:100%}

  /* ---------- paleta ---------- */
  #palette{width:158px;flex:0 0 158px;background:#f4f5f7;border-right:1px solid #dfe2e7;
           overflow-y:auto;padding:10px 10px 24px;}
  #palette h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8a919c;margin:14px 0 6px;font-weight:600}
  #palette h2:first-child{margin-top:2px}
  /* rótulo del material: sobrio, peso ligero y una línea fina debajo */
  #palette .brand{font-size:19px;font-weight:200;letter-spacing:.02em;color:#39404a;
                  padding:2px 2px 10px;border-bottom:1px solid #e3e6eb}
  #palette .brand b{font-weight:400;color:#2b2f36}
  #palette .brand + h2{margin-top:11px}
  .pitem{display:flex;align-items:center;gap:7px;padding:5px 6px;margin-bottom:3px;border-radius:7px;
         cursor:grab;background:#fff;border:1px solid #e3e6eb;touch-action:none}
  .pitem:hover{border-color:#b9c0ca;background:#fbfcfd}
  .pitem:active{cursor:grabbing}
  .pitem .lab{font-size:11px;font-weight:600;color:#5a626d;min-width:19px}
  .pitem .med{font-size:10px;color:#9aa1ab;margin-left:auto}
  .pitem svg{display:block;overflow:visible}
  .note{font-size:10.5px;line-height:1.45;color:#8a919c;margin-top:12px}

  /* ---------- zona principal ---------- */
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  #toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:7px 9px;
           border-bottom:1px solid #dfe2e7;background:#fafbfc}
  .btn{border:1px solid #d5d9e0;background:#fff;border-radius:7px;padding:5px 9px;font-size:12.5px;
       color:#3d4450;cursor:pointer;display:inline-flex;align-items:center;gap:5px;line-height:1.2}
  .btn:hover{background:#f0f2f5}
  .btn.on{background:#2f62a8;border-color:#2f62a8;color:#fff}
  .btn.on:hover{background:#2a589a}
  .sep{width:1px;height:20px;background:#dfe2e7;margin:0 3px}
  .chk{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#4a515c;cursor:pointer;
       padding:3px 6px;border-radius:6px}
  .chk:hover{background:#eff1f4}
  .chk input{margin:0;cursor:pointer}
  #cordcol{width:26px;height:24px;padding:0;border:1px solid #d5d9e0;border-radius:6px;background:none;cursor:pointer}
  #stage{position:relative;flex:1;min-height:0;background:#fff}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:default}
  #hint{position:absolute;left:10px;bottom:10px;background:rgba(28,32,38,.82);color:#fff;font-size:11.5px;
        padding:5px 10px;border-radius:14px;pointer-events:none;max-width:calc(100% - 20px)}
  #info{position:absolute;right:10px;top:10px;width:250px;background:#fff;border:1px solid #dfe2e7;
        border-radius:10px;padding:11px 13px;font-size:11.5px;line-height:1.55;color:#4a515c;
        box-shadow:0 6px 22px rgba(20,25,35,.12);display:none}
  #info.show{display:block}
  #drop{position:absolute;inset:0;background:rgba(47,98,168,.08);border:2px dashed #2f62a8;
        display:none;align-items:center;justify-content:center;font-size:15px;color:#2f62a8;font-weight:600}
  #drop.show{display:flex}
  #info b{color:#2b2f36}
  #info table{border-collapse:collapse;width:100%;margin-top:5px}
  #info td{padding:1px 0}
  #info td:last-child{text-align:right;color:#8a919c}
  #info a{color:#2f62a8}
  #info .lic{margin-top:11px;padding-top:8px;border-top:1px solid #eef0f3;font-size:10.5px;
             line-height:1.5;color:#8a919c}
  @media (max-width:640px){
    #palette{width:104px;flex:0 0 104px;padding:8px 6px}
    .pitem .med{display:none}
    .btn{padding:5px 7px;font-size:12px}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="palette"></aside>
  <main>
    <div id="toolbar">
      <button class="btn on" data-tool="move" title="Mover y girar (V)">✥ Mover</button>
      <button class="btn" data-tool="pin" title="Encuadernador (E)">◉ Encuadernador</button>
      <button class="btn" data-tool="nail" title="Clavo: fija un agujero al suelo (C)">⊕ Clavo</button>
      <button class="btn" data-tool="pulley" title="Polea: eje fijo que arrastra la tira montada en él (P)">◎ Polea</button>
      <button class="btn" data-tool="belt" title="Correa: hace que dos poleas giren a la vez (B)">⊃ Correa</button>
      <button class="btn" data-tool="cord" title="Goma (G)">～ Goma</button>
      <button class="btn" data-tool="pen" title="Rotulador (R)">✎ Rotulador</button>
      <button class="btn" data-tool="del" title="Borrar (D)">✕ Borrar</button>
      <span class="sep"></span>
      <label class="chk" title="Las tiras se atraen cuando dos agujeros están cerca"><input type="checkbox" id="magnet" checked>Imán</label>
      <label class="chk"><input type="checkbox" id="showang" checked>Ángulos</label>
      <label class="chk"><input type="checkbox" id="showlab" checked>Nombres</label>
      <label class="chk"><input type="checkbox" id="showgrid" checked>Rejilla</label>
      <input type="color" id="cordcol" value="#d0322f" title="Color de la goma y del rotulador">
      <span class="sep"></span>
      <button class="btn" id="undo" title="Deshacer (Ctrl+Z)">↶</button>
      <button class="btn" id="zoomout">−</button>
      <button class="btn" id="zoomin">+</button>
      <button class="btn" id="fit">Ajustar</button>
      <span class="sep"></span>
      <button class="btn" id="save" title="Descargar la construcción en un archivo">⤓ Guardar</button>
      <button class="btn" id="open" title="Abrir un archivo guardado">⤒ Abrir</button>
      <button class="btn" id="add" title="Añadir el contenido de un archivo a lo que ya hay">＋</button>
      <button class="btn" id="png" title="Descargar imagen">⤓ PNG</button>
      <button class="btn" id="clear">Limpiar</button>
      <button class="btn" id="help">?</button>
      <input type="file" id="fileIn" accept=".json,application/json" style="display:none">
    </div>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="hint"></div>
      <div id="info"></div>
      <div id="drop">Suelta aquí el archivo de geotiras</div>
    </div>
  </main>
</div>

<script>
"use strict";
(function(){

/* =========================================================================
   1. GEOMETRÍA DE LAS TIRAS  (Invicta Geo Strips, IP014159)
   u = longitud de R1.  p = u/2 = paso entre agujeros consecutivos de las rojas.
   R2 = 2·R1, R3 = 4·R1 · B1 = R1√2, B2 = R2√2 · Y1 = R1√3, Y2 = R2√3 · W1 = R1√5
   W2 = longitud especial: diagonal mayor del octógono de lado R1 = R1·√(4+2√2)
   Agujeros: R1 3, R2 3, R3 9 (equiespaciados a p) · B1 3, B2 5 · Y1 5, Y2 7 · W1 3, W2 5.
   En las amarillas, los dos agujeros contiguos al central dividen la tira en tres partes iguales.
   El fijador de ángulos tiene los agujeros a p del centro, para que encajen con las rojas.
   ========================================================================= */
var S2=Math.SQRT2, S3=Math.sqrt(3), S5=Math.sqrt(5), OC=Math.sqrt(4+2*Math.SQRT2);
var HP=0.5;  // paso entre agujeros de las tiras rojas (y radio del fijador)
var TYPES = {
  R1:{fam:'Rojas',   c:'#cf3a2e', dk:'#8e2018', len:1,    holes:[0,HP,1],                 med:'1 u · 3 agujeros'},
  R2:{fam:'Rojas',   c:'#cf3a2e', dk:'#8e2018', len:2,    holes:[0,1,2],                  med:'2 u · 3 agujeros'},
  R3:{fam:'Rojas',   c:'#cf3a2e', dk:'#8e2018', len:4,    holes:[0,.5,1,1.5,2,2.5,3,3.5,4], med:'4 u · 9 agujeros'},
  B1:{fam:'Azules',  c:'#2f62a8', dk:'#1b3d69', len:S2,   holes:[0,S2/2,S2],              med:'√2 u · 3 agujeros'},
  /* B2: central, extremos y dos a un paso p de cada extremo */
  B2:{fam:'Azules',  c:'#2f62a8', dk:'#1b3d69', len:2*S2, holes:[0,HP,S2,2*S2-HP,2*S2],   med:'2√2 u · 5 agujeros'},
  /* Y1: extremos, central y los dos que dividen la tira en tres partes iguales */
  Y1:{fam:'Amarillas',c:'#e8bb1e',dk:'#a37f00', len:S3,   holes:[0,S3/3,S3/2,2*S3/3,S3],  med:'√3 u · 5 agujeros'},
  /* Y2: extremos, dos a un paso p de ellos, central y los dos de los tercios */
  Y2:{fam:'Amarillas',c:'#e8bb1e',dk:'#a37f00', len:2*S3, holes:[0,HP,2*S3/3,S3,4*S3/3,2*S3-HP,2*S3], med:'2√3 u · 7 agujeros'},
  W1:{fam:'Blancas', c:'#f5f2ec', dk:'#a9a49a', len:S5,   holes:[0,S5/2,S5],              med:'√5 u · 3 agujeros'},
  /* W2: central, extremos y dos a un paso p de cada extremo */
  W2:{fam:'Blancas', c:'#f5f2ec', dk:'#a9a49a', len:OC,   holes:[0,HP,OC/2,OC-HP,OC],     med:'√(4+2√2) u · 5 agujeros'},
  /* Fijador de ángulos: semicírculo con agujeros cada 15° a un paso p del centro */
  P :{fam:'Herramientas', c:'#e9ecf0', dk:'#98a0ab', shape:'arc', R:HP, Rb:HP+0.19, lip:0.10, len:2*HP,
      med:'agujeros cada 15°, a un paso del centro', name:'Fijador de ángulos'}
};
/* posiciones de los agujeros en coordenadas locales (unidades) */
Object.keys(TYPES).forEach(function(k){ var T=TYPES[k];
  if(T.shape==='arc'){
    T.pts=[{x:0,y:0}];
    for(var d=0; d<=180; d+=15)
      T.pts.push({x:Math.cos(d*Math.PI/180)*T.R, y:-Math.sin(d*Math.PI/180)*T.R, deg:d});
    T.cen={x:0,y:-0.40*T.Rb}; T.inr=0.3*T.Rb*T.Rb;
  } else {
    T.pts=T.holes.map(function(h){return {x:h,y:0};});
    T.cen={x:T.len/2,y:0}; T.inr=T.len*T.len/12;
  }
});
var ORDER=['R1','R2','R3','B1','B2','Y1','Y2','W1','W2','P'];

/* medidas de dibujo (unidades de mundo, zoom 1) */
var U=56;               // px por unidad (longitud de R1)
var HW=0.105*U;         // media anchura de la tira
var HR=0.05*U;          // radio del agujero
var PINR=0.078*U;       // radio del encuadernador
var PR=0.42*U;          // radio de la polea (garganta de la correa)
var SNAP=15;            // px de pantalla para el efecto imán

/* =========================================================================
   2. ESTADO
   ========================================================================= */
/* pens: rotuladores enganchados a un agujero, {id, s, h, col}.
   trace: los trazos ya dibujados, {id, col, p:[{x,y}…]}, en coordenadas de mundo y
   con vida propia: si quitas el rotulador o la tira, la tinta se queda en el papel.
   Por eso son dos listas y no una. */
/* nails: clavos, {id, s, h, x, y}. Un clavo sujeta un agujero a un punto fijo del
   suelo. Con uno, la tira todavía gira alrededor de él; con dos ya no se mueve. Así
   es como se sujeta la barra fija de un mecanismo de cuatro barras, y también sirve
   para clavar los dos extremos de una cuerda y dejarlos quietos. */
/* pulleys: poleas, {id, x, y, a, m:[{s,h,off}]}. El eje está fijo al suelo; lo que
   gira es la polea. Una tira montada en el eje es solidaria con ella: gira lo que
   gire la polea, sin holgura. Por eso las tiras montadas no las mueve el solver,
   se colocan a partir del ángulo de la polea y ya.
   belts: correas, {id, a, b}. Poleas del mismo radio y correa abierta: las dos giran
   el mismo ángulo y en el mismo sentido, que es la condición que hace falta para que
   el ángulo entre las dos varillas del modelo de Puig Adam no cambie. Como el giro es
   idéntico, la correa no necesita guardar ninguna razón ni desfase. */
var strips=[], pins=[], cords=[], pens=[], trace=[], nails=[], pulleys=[], belts=[], nid=1;
var sel=new Set(), primary=null;
var tool='move', drag=null, cordDraft=null, snapMark=null, hoverHole=null, importMode='replace';
var beltDraft=null, hoverCross=null;
var view={x:0,y:0,z:1};
var undoStack=[];

var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var stage=document.getElementById('stage');
var hintEl=document.getElementById('hint'), infoEl=document.getElementById('info');
var opt={magnet:1,ang:1,lab:1,grid:1};
var cordColor='#d0322f';

function byId(id){for(var i=0;i<strips.length;i++) if(strips[i].id===id) return strips[i]; return null;}
function snapshot(){return JSON.stringify({s:strips,p:pins,c:cords,r:pens,tz:trace,k:nails,
                                           pl:pulleys,bl:belts,n:nid});}
function pushUndo(){undoStack.push(snapshot()); if(undoStack.length>60) undoStack.shift();}
function doUndo(){ if(!undoStack.length) return; var st=JSON.parse(undoStack.pop());
  strips=st.s; pins=st.p; cords=st.c; pens=st.r||[]; trace=st.tz||[]; nails=st.k||[];
  pulleys=st.pl||[]; belts=st.bl||[]; nid=st.n;
  sel.clear(); primary=null; cordDraft=null; draw(); }

/* =========================================================================
   3. GEOMETRÍA AUXILIAR
   ========================================================================= */
function holesOf(s){return TYPES[s.t].pts;}
function lenOf(s){return TYPES[s.t].len;}
function isArc(s){return TYPES[s.t].shape==='arc';}
function holeW(s,i){ var p=TYPES[s.t].pts[i], co=Math.cos(s.a), si=Math.sin(s.a);
  return {x:s.x+(p.x*co-p.y*si)*U, y:s.y+(p.x*si+p.y*co)*U}; }
function toLocal(s,p){ var co=Math.cos(-s.a), si=Math.sin(-s.a);
  var dx=(p.x-s.x)/U, dy=(p.y-s.y)/U;
  return {x:dx*co-dy*si, y:dx*si+dy*co}; }
function toWorld(s,l){ var co=Math.cos(s.a), si=Math.sin(s.a);
  return {x:s.x+(l.x*co-l.y*si)*U, y:s.y+(l.x*si+l.y*co)*U}; }
function endA(s){return {x:s.x,y:s.y};}
function endB(s){var d=lenOf(s)*U;return {x:s.x+d*Math.cos(s.a), y:s.y+d*Math.sin(s.a)};}
function pinPos(p){ var s=byId(p.m[0].s); return s?holeW(s,p.m[0].h):{x:p.x||0,y:p.y||0}; }
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function distSeg(p,a,b){ var vx=b.x-a.x, vy=b.y-a.y, L=vx*vx+vy*vy;
  var t = L? ((p.x-a.x)*vx+(p.y-a.y)*vy)/L : 0; t=Math.max(0,Math.min(1,t));
  return Math.hypot(p.x-(a.x+t*vx), p.y-(a.y+t*vy)); }
function rotPt(p,c,th){ var dx=p.x-c.x, dy=p.y-c.y, co=Math.cos(th), si=Math.sin(th);
  return {x:c.x+dx*co-dy*si, y:c.y+dx*si+dy*co}; }

function w2s(p){return {x:p.x*view.z+view.x, y:p.y*view.z+view.y};}
function s2w(p){return {x:(p.x-view.x)/view.z, y:(p.y-view.y)/view.z};}

/* conectividad: componente conexa de una tira a través de encuadernadores */
function component(ids){
  var seen=new Set(ids), q=Array.from(ids);
  while(q.length){ var id=q.pop();
    for(var i=0;i<pins.length;i++){ var p=pins[i];
      if(p.m.some(function(m){return m.s===id;}))
        p.m.forEach(function(m){ if(!seen.has(m.s)){seen.add(m.s); q.push(m.s);} });
    } }
  return seen;
}
function pinsOfStrip(id){ return pins.filter(function(p){return p.m.some(function(m){return m.s===id;});}); }

/* =========================================================================
   4. ACCIONES SOBRE EL MODELO
   ========================================================================= */
function addStrip(t,x,y,a){ var s={id:nid++,t:t,x:x,y:y,a:a||0}; strips.push(s); return s; }

function removeStrip(id){
  strips=strips.filter(function(s){return s.id!==id;});
  pins.forEach(function(p){ p.m=p.m.filter(function(m){return m.s!==id;}); });
  pins=pins.filter(function(p){return p.m.length>=2;});
  cords.forEach(function(c){ c.n=c.n.filter(function(n){return n.s!==id;}); });
  cords=cords.filter(function(c){return c.n.length>=2;});
  // el trazo ya hecho no se borra, pero los rotuladores que colgaban de la tira sí
  pens=pens.filter(function(r){
    return r.q ? (r.q[0]!==id && r.q[1]!==id) : r.s!==id; });
  nails=nails.filter(function(n){return n.s!==id;});
  unmount(id);
  sel.delete(id); if(primary===id) primary=null;
}

/* une los agujeros que coinciden en un punto */
function joinAt(pt,tol){
  tol=tol||8;
  var members=[];
  strips.forEach(function(s){ holesOf(s).forEach(function(_,i){
    if(dist(holeW(s,i),pt)<=tol) members.push({s:s.id,h:i});
  });});
  if(members.length<2) return null;
  // evita duplicar tira en un mismo encuadernador
  var seenS={}, mm=[];
  members.forEach(function(m){ if(!seenS[m.s]){seenS[m.s]=1; mm.push(m);} });
  if(mm.length<2) return null;
  // ¿ya existe un encuadernador ahí?
  for(var i=0;i<pins.length;i++){
    if(dist(pinPos(pins[i]),pt)<=tol){
      mm.forEach(function(m){ if(!pins[i].m.some(function(x){return x.s===m.s;})) pins[i].m.push(m); });
      return pins[i];
    }
  }
  var p={id:nid++,m:mm}; pins.push(p); return p;
}

function translate(ids,dx,dy){ ids.forEach(function(id){ var s=byId(id); if(s){s.x+=dx; s.y+=dy;} }); }

/* ---- poleas y correas -----------------------------------------------------
   El modelo de Puig Adam para el arco capaz: dos varillas que giran alrededor de
   dos puntos fijos, con un hilo arrollado a dos poleas iguales que obliga a las
   dos a girar el mismo ángulo. Si las dos varillas giran lo mismo, el ángulo que
   forman no cambia, y su intersección describe el arco.

   Una tira montada en una polea queda determinada por el ángulo de la polea: no
   hay nada que resolver, se coloca directamente. Por eso el solver la trata como
   suelo y nunca la empuja.                                                      */
function polById(id){ for(var i=0;i<pulleys.length;i++) if(pulleys[i].id===id) return pulleys[i]; return null; }
function pulleyAdd(x,y){ var p={id:nid++, x:x, y:y, a:0, m:[]}; pulleys.push(p); return p; }
function pulleyAt(p,extra){
  var tol=PR+(extra||0)/view.z;
  for(var i=pulleys.length-1;i>=0;i--)
    if(dist(p,{x:pulleys[i].x,y:pulleys[i].y})<=tol) return pulleys[i];
  return null;
}
function pulleyRemove(pl){
  pulleys=pulleys.filter(function(x){return x!==pl;});
  belts=belts.filter(function(b){return b.a!==pl.id && b.b!==pl.id;});
}
/* ¿en qué polea está montada esta tira? */
function mountOf(sid){
  for(var i=0;i<pulleys.length;i++){
    var mm=pulleys[i].m;
    for(var j=0;j<mm.length;j++) if(mm[j].s===sid) return {pol:pulleys[i], m:mm[j]};
  }
  return null;
}
function mountedSet(){
  var g=new Set();
  pulleys.forEach(function(p){ p.m.forEach(function(m){ g.add(m.s); }); });
  return g;
}
/* monta en la polea todas las tiras que tengan un agujero sobre su eje */
function mountAt(pt,tol){
  var pl=null, dm=Infinity;
  pulleys.forEach(function(p){ var d=dist(pt,{x:p.x,y:p.y}); if(d<=tol && d<dm){dm=d; pl=p;} });
  if(!pl) return null;
  var puestas=0;
  strips.forEach(function(s){
    if(isArc(s) || mountOf(s.id)) return;
    var mejor=-1, dh=Infinity;                      // el agujero más cercano al eje
    holesOf(s).forEach(function(_,i){
      var d=dist(holeW(s,i),{x:pl.x,y:pl.y});
      if(d<=tol && d<dh){ dh=d; mejor=i; }
    });
    if(mejor>=0){ pl.m.push({s:s.id, h:mejor, off:s.a-pl.a}); puestas++; }
  });
  if(!puestas) return null;
  placeMounted(pl);
  return pl;
}
function unmount(sid){
  pulleys.forEach(function(p){ p.m=p.m.filter(function(m){return m.s!==sid;}); });
}
/* coloca las tiras montadas a partir del ángulo de la polea (cinemática directa) */
function placeMounted(pl){
  pl.m.forEach(function(m){
    var s=byId(m.s); if(!s) return;
    s.a=pl.a+m.off;
    var p=TYPES[s.t].pts[m.h]; if(!p) return;
    var co=Math.cos(s.a), si=Math.sin(s.a);
    s.x=pl.x-(p.x*co-p.y*si)*U;
    s.y=pl.y-(p.x*si+p.y*co)*U;
  });
}
/* poleas unidas por correas: giran todas a la vez */
function pulleyGroup(pl){
  var seen=new Set([pl.id]), q=[pl.id];
  while(q.length){ var id=q.pop();
    belts.forEach(function(b){
      if(b.a===id && !seen.has(b.b)){ seen.add(b.b); q.push(b.b); }
      if(b.b===id && !seen.has(b.a)){ seen.add(b.a); q.push(b.a); }
    });
  }
  return pulleys.filter(function(p){ return seen.has(p.id); });
}
function beltAdd(pa,pb){
  if(!pa||!pb||pa===pb) return null;
  for(var i=0;i<belts.length;i++){
    var b=belts[i];
    if((b.a===pa.id&&b.b===pb.id)||(b.a===pb.id&&b.b===pa.id)) return null;
  }
  var b2={id:nid++, a:pa.id, b:pb.id}; belts.push(b2); return b2;
}
function beltAt(p){
  for(var i=belts.length-1;i>=0;i--){
    var A=polById(belts[i].a), B=polById(belts[i].b); if(!A||!B) continue;
    var dx=B.x-A.x, dy=B.y-A.y, L=Math.hypot(dx,dy); if(L<1e-6) continue;
    var nx=-dy/L, ny=dx/L, tol=5/view.z;
    var a1={x:A.x+nx*PR,y:A.y+ny*PR}, b1={x:B.x+nx*PR,y:B.y+ny*PR};
    var a2={x:A.x-nx*PR,y:A.y-ny*PR}, b2={x:B.x-nx*PR,y:B.y-ny*PR};
    if(distSeg(p,a1,b1)<=tol || distSeg(p,a2,b2)<=tol) return belts[i];
  }
  return null;
}
/* Gira el grupo de poleas y recoloca lo que arrastran. Devuelve false y lo deja
   como estaba si el resto del montaje no puede acompañar el giro. */
function turnPulleys(pl,dth){
  var before={}; strips.forEach(function(s){before[s.id]={x:s.x,y:s.y,a:s.a};});
  var angBefore=pulleys.map(function(p){return p.a;});
  var g=pulleyGroup(pl);
  g.forEach(function(p){ p.a+=dth; placeMounted(p); });
  relaxUntil(null,null,2400,1e-7);
  if(maxResidual()<=1.0) return true;
  strips.forEach(function(s){ var b=before[s.id]; if(b){s.x=b.x;s.y=b.y;s.a=b.a;} });
  pulleys.forEach(function(p,i){ p.a=angBefore[i]; });
  return false;
}
/* Gira una sola tira sobre su polea, cambiando su calaje. Es la operación de
   montaje: colocar cada varilla en el ángulo que se quiera antes de darle a la
   manivela. La polea no se mueve, ni la correa, ni las demás tiras. */
function turnMountedStrip(sid,dth){
  var mo=mountOf(sid); if(!mo) return false;
  var before={}; strips.forEach(function(s){before[s.id]={x:s.x,y:s.y,a:s.a};});
  var off0=mo.m.off;
  mo.m.off+=dth; placeMounted(mo.pol);
  relaxUntil(null,null,2400,1e-7);
  if(maxResidual()<=1.0) return true;
  mo.m.off=off0;
  strips.forEach(function(s){ var b=before[s.id]; if(b){s.x=b.x;s.y=b.y;s.a=b.a;} });
  return false;
}
/* mover la polea de sitio se lleva las tiras montadas */
function movePulley(pl,dx,dy){ pl.x+=dx; pl.y+=dy; placeMounted(pl); }

/* ---- el clavo -------------------------------------------------------------
   Fija un agujero a un punto del suelo. No conecta tiras entre sí: por eso no
   entra en component(), que sigue siendo la componente conexa por
   encuadernadores. Lo que sí hace es participar en el solver y en el residuo.  */
function nailAdd(sid,hi){
  var s=byId(sid); if(!s) return null;
  for(var i=0;i<nails.length;i++) if(nails[i].s===sid && nails[i].h===hi) return null;
  var q=holeW(s,hi);
  var n={id:nid++, s:sid, h:hi, x:q.x, y:q.y}; nails.push(n); return n;
}
function nailRemove(n){ nails=nails.filter(function(x){return x!==n;}); }
function nailAt(p){
  for(var i=nails.length-1;i>=0;i--){
    if(dist(p,{x:nails[i].x,y:nails[i].y})<=PINR*1.35+4/view.z) return nails[i]; }
  return null;
}
/* ¿hay algo anclado al suelo en el grupo unido a estas tiras —un clavo o una polea—?
   Si lo hay, arrastrar no puede ser una traslación en bloque: el grupo tiene que
   articularse. */
function compHasNail(ids){
  var comp=component(ids);
  if(nails.some(function(n){ return comp.has(n.s); })) return true;
  var mt=mountedSet(), hay=false;
  comp.forEach(function(id){ if(mt.has(id)) hay=true; });
  return hay;
}

/* ---- el rotulador ---------------------------------------------------------
   Va enganchado a un agujero y va dejando la posición de ese agujero mientras
   la construcción se mueve. Girando una tira alrededor de un encuadernador sale
   la circunferencia; con dos tiras unidas y una restricción sale otra cosa. Aquí
   no se decide nada de eso: solo se muestrea el punto.

   penDown() al empezar cualquier gesto que mueva tiras, penSample() después de
   cada actualización y penUp() al soltar. El umbral evita llenar el trazo de
   puntos repetidos cuando el ratón se mueve sin que la pieza llegue a girar.   */
var PENSTEP=1.0;          // distancia mínima en mundo entre dos puntos del trazo
var PENMAX=6000;          // tope de puntos por trazo, para no crecer sin fin
/* Cruce de los ejes de dos tiras. Es el punto B del modelo de Puig Adam: no es
   ningún agujero, es donde se cortan las dos varillas, y va deslizando por las dos
   mientras giran. Solo cuenta si cae dentro de los dos segmentos; si las tiras se
   quedan cortas, no hay punto y el trazo se interrumpe, que es la verdad. */
function crossOf(idA,idB){
  var s1=byId(idA), s2=byId(idB);
  if(!s1||!s2||isArc(s1)||isArc(s2)) return null;
  var a=endA(s1), b=endB(s1), c=endA(s2), d=endB(s2);
  var rx=b.x-a.x, ry=b.y-a.y, sx=d.x-c.x, sy=d.y-c.y;
  var den=rx*sy-ry*sx;
  if(Math.abs(den)<1e-9) return null;                       // paralelas
  var t=((c.x-a.x)*sy-(c.y-a.y)*sx)/den;
  var u=((c.x-a.x)*ry-(c.y-a.y)*rx)/den;
  if(t<0||t>1||u<0||u>1) return null;                       // se cortan fuera
  return {x:a.x+t*rx, y:a.y+t*ry};
}
function crossAt(p,tolPx){
  var tol=(tolPx||14)/view.z, best=null;
  for(var i=0;i<strips.length;i++) for(var j=i+1;j<strips.length;j++){
    var q=crossOf(strips[i].id,strips[j].id); if(!q) continue;
    var d=dist(p,q);
    if(d<tol && (!best||d<best.d)) best={a:strips[i].id, b:strips[j].id, p:q, d:d};
  }
  return best;
}
function penPos(r){
  if(r.q) return crossOf(r.q[0],r.q[1]);
  var s=byId(r.s); if(!s) return null;
  var hs=holesOf(s); if(r.h<0||r.h>=hs.length) return null;
  return holeW(s,r.h); }
function penAdd(sid,hi,col){
  for(var i=0;i<pens.length;i++) if(pens[i].s===sid && pens[i].h===hi) return null;
  var r={id:nid++, s:sid, h:hi, col:col||cordColor}; pens.push(r); return r;
}
function penAddCross(idA,idB,col){
  for(var i=0;i<pens.length;i++){ var q=pens[i].q;
    if(q && ((q[0]===idA&&q[1]===idB)||(q[0]===idB&&q[1]===idA))) return null; }
  if(!crossOf(idA,idB)) return null;
  var r={id:nid++, q:[idA,idB], col:col||cordColor}; pens.push(r); return r;
}
function penRemove(r){ pens=pens.filter(function(x){return x!==r;}); }
function penDown(){
  pens.forEach(function(r){
    var q=penPos(r); if(!q){ r.cur=null; return; }
    r.cur={id:nid++, col:r.col, p:[{x:q.x,y:q.y}]};
    trace.push(r.cur);
  });
}
function penSample(){
  pens.forEach(function(r){
    if(!r.cur) return;
    var q=penPos(r); if(!q||!isFinite(q.x)||!isFinite(q.y)) return;
    var last=r.cur.p[r.cur.p.length-1];
    if(dist(last,q)<PENSTEP) return;
    if(r.cur.p.length>=PENMAX) return;
    r.cur.p.push({x:q.x,y:q.y});
  });
}
function penUp(){
  // un trazo de un solo punto es un clic, no un dibujo: se tira
  trace=trace.filter(function(t){ return t.p.length>=2; });
  pens.forEach(function(r){ r.cur=null; });
}
function penAt(p){
  for(var i=pens.length-1;i>=0;i--){ var q=penPos(pens[i]);
    if(q && dist(p,q)<=PINR*1.25+4/view.z) return pens[i]; }
  return null;
}
function traceAt(p){
  var tol=6/view.z;
  for(var i=trace.length-1;i>=0;i--){ var t=trace[i];
    for(var j=0;j<t.p.length-1;j++) if(distSeg(p,t.p[j],t.p[j+1])<=tol) return t; }
  return null;
}

/* ---- solver de barras articuladas (PBD) -----------------------------------
   Permite que un cuadrilátero se deforme (cuadrado -> rombo) mientras que un
   triángulo se comporta como estructura rígida.                              */
function centerOf(s){ var g=TYPES[s.t].cen, co=Math.cos(s.a), si=Math.sin(s.a);
  return {x:s.x+(g.x*co-g.y*si)*U, y:s.y+(g.x*si+g.y*co)*U}; }
function inertiaOf(s){ return TYPES[s.t].inr*U*U+1; }
/* corrección sobre un punto cualquiera de la tira, no solo sobre un agujero:
   hace falta para arrastrar un mecanismo clavado agarrándolo por donde sea */
function applyCorrAt(s,hp,dx,dy){
  var mag=Math.hypot(dx,dy); if(mag<1e-9) return;
  var nx=dx/mag, ny=dy/mag;
  var c=centerOf(s);
  var rx=hp.x-c.x, ry=hp.y-c.y, I=inertiaOf(s);
  var rn=rx*ny-ry*nx;
  var lam=mag/(1+rn*rn/I);
  s.x+=lam*nx; s.y+=lam*ny;
  var dth=lam*rn/I;
  if(dth){ var c2=centerOf(s), np=rotPt({x:s.x,y:s.y},c2,dth); s.x=np.x; s.y=np.y; s.a+=dth; }
}
function applyCorr(s,hi,dx,dy){ applyCorrAt(s,holeW(s,hi),dx,dy); }

/* Una tira con dos clavos en agujeros distintos no puede moverse: es suelo. Hay
   que decírselo al solver, porque si no el encuadernador la empuja, el clavo la
   devuelve, y se pasa las iteraciones oscilando sin converger. */
function fullyNailed(sid){
  var h0=null;
  for(var i=0;i<nails.length;i++) if(nails[i].s===sid){
    if(h0===null) h0=nails[i].h; else if(nails[i].h!==h0) return true; }
  return false;
}
/* Inmóviles para el solver: las que tienen dos clavos y las montadas en una polea.
   Las montadas no es que estén quietas —giran con la polea— es que su posición no
   la decide el solver, sino placeMounted(). Si el solver pudiera empujarlas, la
   correa dejaría de significar nada. */
function groundSet(){
  var g=mountedSet();
  nails.forEach(function(n){ if(!g.has(n.s) && fullyNailed(n.s)) g.add(n.s); });
  return g;
}

function relax(pinned,anchor,iters){
  pinned=pinned||new Set();
  var suelo=groundSet();                       // inmóviles: tienen dos clavos
  var quieta=function(id){ return pinned.has(id) || suelo.has(id); };
  var clavadas=new Set(); nails.forEach(function(n){ clavadas.add(n.s); });
  for(var it=0;it<iters;it++){
    for(var i=0;i<pins.length;i++){
      var p=pins[i], pts=[], fixedPt=null;
      for(var j=0;j<p.m.length;j++){ var s=byId(p.m[j].s); if(!s) continue;
        var hp=holeW(s,p.m[j].h); pts.push(hp);
        /* manda la que menos se puede mover: primero la clavada de un clavo,
           y por encima de ella la que está inmóvil del todo */
        if(clavadas.has(p.m[j].s) && !fixedPt) fixedPt=hp;
        if(quieta(p.m[j].s)) fixedPt=hp; }
      if(pts.length<2 && !(anchor&&anchor.pin===p)) continue;
      var t;
      if(anchor && anchor.pin===p) t=anchor.t;
      else if(fixedPt) t=fixedPt;
      else { var sx=0,sy=0; pts.forEach(function(q){sx+=q.x;sy+=q.y;}); t={x:sx/pts.length,y:sy/pts.length}; }
      for(var k=0;k<p.m.length;k++){
        var m=p.m[k]; if(quieta(m.s)) continue;
        var st=byId(m.s); if(!st) continue;
        var q2=holeW(st,m.h); applyCorr(st,m.h,t.x-q2.x,t.y-q2.y);
      }
    }
    /* Los clavos van al final de cada iteración, a propósito: así son ellos los
       que tienen la última palabra sobre los encuadernadores. */
    for(var w=0;w<nails.length;w++){
      var n=nails[w]; if(quieta(n.s)) continue;
      var sn=byId(n.s); if(!sn) continue;
      var qn=holeW(sn,n.h); applyCorr(sn,n.h,n.x-qn.x,n.y-qn.y);
    }
  }
}
/* Relaja hasta cerrar, no un número fijo de veces. Cerca de una posición límite
   el mecanismo está mal condicionado y converge despacio: con 120 iteraciones se
   quedaba a medio camino y el error se iba acumulando barrido a barrido. Sale en
   cuanto cierra, así que en marcha normal cuesta un solo lote. */
function relaxUntil(pinned,anchor,budget,tol){
  var lote=40;
  for(var hechas=0; hechas<budget; hechas+=lote){
    relax(pinned,anchor,lote);
    if(maxResidual()<=tol) return true;
  }
  return false;
}
function maxResidual(){
  var r=0;
  pins.forEach(function(p){ var q=pinPos(p);
    p.m.forEach(function(m){ var s=byId(m.s); if(s) r=Math.max(r,dist(holeW(s,m.h),q)); }); });
  nails.forEach(function(n){ var s=byId(n.s);
    if(s) r=Math.max(r,dist(holeW(s,n.h),{x:n.x,y:n.y})); });
  return r;
}

/* rota rotIds alrededor de pivot; el resto de la estructura conectada
   se arrastra por traslación. Si la estructura es rígida (bucle), se anula. */
function rotateGroup(rotIds,pivot,dth){
  /* Girar una tira montada la desliza sobre su polea: cambia su calaje y no
     arrastra ni a la polea ni a la correa. Para mover el mecanismo entero hay
     que girar la polea. */
  var mo=null;
  rotIds.forEach(function(id){ if(!mo) mo=mountOf(id); });
  if(mo) return turnMountedStrip(mo.m.s,dth);

  var before={}; strips.forEach(function(s){before[s.id]={x:s.x,y:s.y,a:s.a};});
  var pinBefore=pins.map(function(p){return pinPos(p);});

  rotIds.forEach(function(id){ var s=byId(id); if(!s) return;
    var np=rotPt({x:s.x,y:s.y},pivot,dth); s.x=np.x; s.y=np.y; s.a+=dth; });

  // BFS de traslación hacia el resto
  var moved=new Set(rotIds);
  var queue=[];
  pins.forEach(function(p,i){
    var inR=p.m.filter(function(m){return rotIds.has(m.s);});
    var out=p.m.filter(function(m){return !rotIds.has(m.s);});
    if(inR.length && out.length){
      var np=holeW(byId(inR[0].s),inR[0].h), op=pinBefore[i];
      queue.push({pin:p,d:{x:np.x-op.x,y:np.y-op.y}});
    }
  });
  var guard=0;
  while(queue.length && guard++<500){
    var it=queue.shift();
    it.pin.m.forEach(function(m){
      if(moved.has(m.s)) return;
      var s=byId(m.s); if(!s) return;
      s.x+=it.d.x; s.y+=it.d.y; moved.add(m.s);
      pinsOfStrip(m.s).forEach(function(p2){ if(p2!==it.pin) queue.push({pin:p2,d:it.d}); });
    });
  }
  if(maxResidual()<=0.6) return true;

  /* La traslación no basta (hay un bucle cerrado). Se vuelve al estado previo,
     se aplica solo el giro y se deja que el mecanismo se acomode. Si aun así no
     cierra, la estructura es rígida (p. ej. un triángulo) y se anula el giro. */
  strips.forEach(function(s){ var b=before[s.id]; if(b){s.x=b.x;s.y=b.y;s.a=b.a;} });
  rotIds.forEach(function(id){ var s=byId(id); if(!s) return;
    var np=rotPt({x:s.x,y:s.y},pivot,dth); s.x=np.x; s.y=np.y; s.a+=dth; });
  relaxUntil(rotIds,null,2400,1e-7);
  if(maxResidual()<=1.0) return true;

  /* Último intento antes de rendirse: soltar también las tiras giradas y dejar
     que se acomode todo. Un mecanismo tiene posiciones límite y puntos donde el
     camino se bifurca; ahí el giro pedido no cabe entero, pero un trozo sí. Sin
     esto, al pasar por uno de esos puntos el mecanismo se quedaba tieso para
     siempre: cualquier giro posterior lo comparaba con un estado ya roto y lo
     rechazaba. Es preferible dar lo que se pueda a quedarse muerto. */
  relaxUntil(null,null,2400,1e-7);
  if(maxResidual()<=1.0) return true;

  strips.forEach(function(s){ var b=before[s.id]; if(b){s.x=b.x;s.y=b.y;s.a=b.a;} });
  return false;
}

function toFront(id){
  var i=-1; for(var k=0;k<strips.length;k++) if(strips[k].id===id){i=k;break;}
  if(i>=0) strips.push(strips.splice(i,1)[0]);
}

/* imán: busca el mejor emparejamiento entre agujeros móviles y fijos */
function findSnap(movingIds){
  var best=null, tol=SNAP/view.z;
  var mov=[], fix=[];
  strips.forEach(function(s){
    var arr = movingIds.has(s.id)? mov : fix;
    holesOf(s).forEach(function(_,i){ arr.push({s:s.id,h:i,p:holeW(s,i)}); });
  });
  // el eje de una polea también atrae, para poder montar la tira en ella
  pulleys.forEach(function(p){ fix.push({pol:p.id, p:{x:p.x,y:p.y}}); });
  mov.forEach(function(a){ fix.forEach(function(b){
    var d=dist(a.p,b.p);
    if(d<tol && (!best || d<best.d)) best={d:d,a:a,b:b,dx:b.p.x-a.p.x,dy:b.p.y-a.p.y};
  });});
  return best;
}

/* imán al girar: busca el giro extra que hace coincidir dos agujeros.
   Es lo que permite fijar el ángulo de una tira en el fijador de ángulos. */
function findSnapRot(movingIds,pivot){
  var tol=SNAP/view.z, best=null;
  var comp=component(movingIds);          // solo con piezas ya unidas al grupo
  var mov=[], fix=[];
  strips.forEach(function(s){
    if(movingIds.has(s.id)){ holesOf(s).forEach(function(_,i){ mov.push({p:holeW(s,i)}); }); }
    else if(comp.has(s.id)){ holesOf(s).forEach(function(_,i){ fix.push({p:holeW(s,i)}); }); }
  });
  if(!mov.length || !fix.length) return null;
  mov.forEach(function(a){
    var r1=dist(a.p,pivot); if(r1<HR) return;
    fix.forEach(function(b){
      var r2=dist(b.p,pivot);
      if(Math.abs(r1-r2)>tol*0.8) return;
      if(dist(b.p,pivot)<HR) return;
      if(dist(a.p,b.p)>tol) return;
      var da=Math.atan2(b.p.y-pivot.y,b.p.x-pivot.x)-Math.atan2(a.p.y-pivot.y,a.p.x-pivot.x);
      while(da>Math.PI) da-=2*Math.PI;
      while(da<-Math.PI) da+=2*Math.PI;
      var sc=Math.abs(da)*r1+Math.abs(r1-r2);
      if(!best || sc<best.sc) best={sc:sc,da:da,p:b.p};
    });
  });
  return best;
}

/* pivote y tirador de giro: el encuadernador con más brazo disponible */
function pivotOf(s){
  var pts=TYPES[s.t].pts;
  /* Si está montada en una polea, solo puede girar alrededor del eje */
  var mo=mountOf(s.id);
  if(mo) return {p:{x:mo.pol.x, y:mo.pol.y}, i:mo.m.h};
  /* Un clavo manda sobre un encuadernador: si la tira está clavada, solo puede
     girar alrededor del clavo, así que el tirador ⟳ tiene que pivotar ahí. */
  var cand=nails.filter(function(n){return n.s===s.id;}).map(function(n){return n.h;});
  if(!cand.length) cand=pinsOfStrip(s.id).map(function(p){
      var m=p.m.filter(function(x){return x.s===s.id;})[0]; return m?m.h:null; })
    .filter(function(h){return h!==null;});
  if(!cand.length) return {p:centerOf(s), i:-1};
  var bi=null, bestScore=-1;
  cand.forEach(function(h){
    var lp=pts[h], sc=0;
    pts.forEach(function(q){ sc=Math.max(sc,Math.hypot(q.x-lp.x,q.y-lp.y)); });
    if(sc>bestScore){bestScore=sc; bi=h;}
  });
  if(bi===null) return {p:centerOf(s), i:-1};
  return {p:holeW(s,bi), i:bi};
}
function handleOf(s){
  var pv=pivotOf(s), pts=TYPES[s.t].pts;
  var lp = pv.i>=0 ? pts[pv.i] : TYPES[s.t].cen;
  var bi=0, bd=-1;
  pts.forEach(function(q,i){ var d=Math.hypot(q.x-lp.x,q.y-lp.y); if(d>bd){bd=d;bi=i;} });
  var far=holeW(s,bi);
  var dx=far.x-pv.p.x, dy=far.y-pv.p.y, m=Math.hypot(dx,dy);
  if(m<1e-6){ dx=Math.cos(s.a); dy=Math.sin(s.a); m=1; }
  var k=26/view.z;
  return {p:{x:far.x+dx/m*k, y:far.y+dy/m*k}, pivot:pv.p};
}

/* =========================================================================
   5. DIBUJO
   ========================================================================= */
function resize(){
  var r=stage.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  cv.width=Math.max(1,Math.round(r.width*dpr)); cv.height=Math.max(1,Math.round(r.height*dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0); draw();
}
function rrect(c,x,y,w,h,r){ c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y); c.closePath(); }

function drawHole(c,x,y,dk){
  c.beginPath(); c.arc(x,y,HR,0,6.2832);
  c.fillStyle='#ffffff'; c.fill();
  c.lineWidth=1; c.strokeStyle=dk; c.globalAlpha=.7; c.stroke(); c.globalAlpha=1;
}

/* fijador de ángulos: semicírculo con agujeros cada 15° */
function drawProt(c,s,selected){
  var T=TYPES[s.t], Rb=T.Rb*U, R=T.R*U, lip=T.lip*U;
  c.save(); c.translate(s.x,s.y); c.rotate(s.a);
  c.beginPath();
  c.moveTo(-Rb,lip); c.lineTo(-Rb,0);
  c.arc(0,0,Rb,Math.PI,2*Math.PI,false);
  c.lineTo(Rb,lip); c.closePath();
  c.shadowColor='rgba(20,25,35,.18)'; c.shadowBlur=5; c.shadowOffsetY=2;
  c.fillStyle=T.c; c.fill();
  c.shadowColor='transparent'; c.shadowBlur=0; c.shadowOffsetY=0;
  c.lineWidth=1.2; c.strokeStyle=T.dk; c.globalAlpha=.8; c.stroke(); c.globalAlpha=1;
  // arco de referencia y marcas
  c.beginPath(); c.arc(0,0,R,Math.PI,2*Math.PI,false);
  c.lineWidth=1; c.strokeStyle='rgba(120,128,140,.45)'; c.stroke();
  c.beginPath(); c.moveTo(-Rb,0); c.lineTo(Rb,0);
  c.strokeStyle='rgba(120,128,140,.45)'; c.stroke();
  T.pts.forEach(function(p,i){
    if(i===0) return;
    var ux=p.x/T.R, uy=p.y/T.R, r0=R+HR+1.5, big=(p.deg%45===0);
    c.beginPath(); c.moveTo(ux*r0,uy*r0); c.lineTo(ux*(Rb-(big?1.5:3.5)),uy*(Rb-(big?1.5:3.5)));
    c.lineWidth=big?1.5:0.9; c.strokeStyle='rgba(110,118,130,'+(big?.75:.5)+')'; c.stroke();
  });
  // agujeros
  T.pts.forEach(function(p){ drawHole(c,p.x*U,p.y*U,T.dk); });
  c.restore();
  if(selected){
    c.save(); c.translate(s.x,s.y); c.rotate(s.a);
    c.beginPath();
    c.moveTo(-Rb-3,lip+3); c.lineTo(-Rb-3,0);
    c.arc(0,0,Rb+3,Math.PI,2*Math.PI,false);
    c.lineTo(Rb+3,lip+3); c.closePath();
    c.lineWidth=2/view.z; c.strokeStyle='#2f62a8'; c.setLineDash([5/view.z,4/view.z]);
    c.stroke(); c.setLineDash([]); c.restore();
  }
}

function drawStrip(c,s,selected){
  if(TYPES[s.t].shape==='arc') return drawProt(c,s,selected);
  var T=TYPES[s.t], L=T.len*U;
  c.save(); c.translate(s.x,s.y); c.rotate(s.a);
  c.shadowColor='rgba(20,25,35,.18)'; c.shadowBlur=5; c.shadowOffsetY=2;
  rrect(c,-HW,-HW,L+2*HW,2*HW,HW);
  c.fillStyle=T.c; c.fill();
  c.shadowColor='transparent'; c.shadowBlur=0; c.shadowOffsetY=0;
  c.lineWidth=1.2; c.strokeStyle=T.dk; c.globalAlpha=.55; c.stroke(); c.globalAlpha=1;
  // brillo superior
  rrect(c,-HW+2,-HW+2,L+2*HW-4,HW*0.75,HW*0.4);
  c.fillStyle='rgba(255,255,255,.22)'; c.fill();
  // agujeros
  T.holes.forEach(function(t){ drawHole(c,t*U,0,T.dk); });
  if(opt.lab){
    var flip = Math.cos(s.a)<0;
    c.save(); c.translate(L/2, 0); if(flip) c.rotate(Math.PI);
    c.translate(0,-HW-9);
    c.font='600 11px -apple-system,Segoe UI,Roboto,sans-serif';
    c.textAlign='center'; c.textBaseline='middle';
    c.fillStyle='rgba(60,66,76,.75)'; c.fillText(s.t,0,0); c.restore();
  }
  c.restore();
  if(selected){
    c.save(); c.translate(s.x,s.y); c.rotate(s.a);
    rrect(c,-HW-3,-HW-3,L+2*HW+6,2*HW+6,HW+3);
    c.lineWidth=2/view.z; c.strokeStyle='#2f62a8'; c.setLineDash([5/view.z,4/view.z]); c.stroke();
    c.setLineDash([]); c.restore();
  }
}

function drawPin(c,p){
  var q=pinPos(p);
  c.beginPath(); c.arc(q.x,q.y,PINR,0,6.2832);
  var g=c.createRadialGradient(q.x-2,q.y-2,1,q.x,q.y,PINR);
  g.addColorStop(0,'#ffe9a8'); g.addColorStop(1,'#b8891f');
  c.fillStyle=g; c.fill();
  c.lineWidth=1.1; c.strokeStyle='#7a5a10'; c.stroke();
  c.beginPath(); c.moveTo(q.x-PINR*0.55,q.y); c.lineTo(q.x+PINR*0.55,q.y);
  c.lineWidth=1; c.strokeStyle='rgba(90,66,10,.65)'; c.stroke();
}

function drawCord(c,cd,previewTo){
  var pts=cd.n.map(function(n){ var s=byId(n.s); return s?holeW(s,n.h):null; }).filter(Boolean);
  if(!pts.length) return;
  c.save();
  c.lineWidth=2.6; c.strokeStyle=cd.col||cordColor; c.lineJoin='round'; c.lineCap='round';
  c.beginPath(); c.moveTo(pts[0].x,pts[0].y);
  for(var i=1;i<pts.length;i++) c.lineTo(pts[i].x,pts[i].y);
  if(cd.closed && pts.length>2) c.closePath();
  if(previewTo){ c.lineTo(previewTo.x,previewTo.y); }
  c.stroke();
  pts.forEach(function(p){ c.beginPath(); c.arc(p.x,p.y,3.1,0,6.2832);
    c.fillStyle=cd.col||cordColor; c.fill(); });
  c.restore();
}

/* La correa, vista como lo que es: el contorno de las dos poleas tensado, o sea
   dos rectas paralelas al segmento de centros y dos semicírculos. Va debajo de las
   poleas, que le tapan la parte que las abraza. */
function drawBelt(c,bt){
  var A=polById(bt.a), B=polById(bt.b); if(!A||!B) return;
  var dx=B.x-A.x, dy=B.y-A.y, L=Math.hypot(dx,dy);
  if(L<1e-6 || !isFinite(L)) return;
  var ang=Math.atan2(dy,dx);
  c.save();
  c.beginPath();
  c.arc(A.x,A.y,PR, ang+Math.PI/2, ang-Math.PI/2, false);
  c.arc(B.x,B.y,PR, ang-Math.PI/2, ang+Math.PI/2, false);
  c.closePath();
  c.lineWidth=3.4; c.strokeStyle='#4a515c'; c.lineJoin='round'; c.stroke();
  c.lineWidth=1.4; c.strokeStyle='rgba(255,255,255,.35)'; c.stroke();
  c.restore();
}

/* La polea. Lo importante es que se vea girar: por eso lleva radios marcados y un
   punto índice. Sin eso, un disco que gira parece un disco quieto. */
function drawPulley(c,pl){
  c.save();
  // rayado de suelo bajo el eje: el eje está fijo, la que gira es la polea
  c.lineWidth=1; c.strokeStyle='rgba(91,99,111,.7)';
  c.beginPath(); c.moveTo(pl.x-PR*0.5,pl.y+PR+3); c.lineTo(pl.x+PR*0.5,pl.y+PR+3); c.stroke();
  for(var k=-1;k<=1;k++){
    c.beginPath(); c.moveTo(pl.x+k*PR*0.42,pl.y+PR+3);
    c.lineTo(pl.x+k*PR*0.42-PR*0.3,pl.y+PR+3+PR*0.4); c.stroke();
  }
  c.beginPath(); c.arc(pl.x,pl.y,PR,0,6.2832);
  var g=c.createRadialGradient(pl.x-PR*0.3,pl.y-PR*0.3,PR*0.1,pl.x,pl.y,PR);
  g.addColorStop(0,'#fdfdfe'); g.addColorStop(1,'#dfe3e9');
  c.fillStyle=g; c.fill();
  c.lineWidth=1.3; c.strokeStyle='#8d96a3'; c.stroke();
  c.beginPath(); c.arc(pl.x,pl.y,PR*0.78,0,6.2832);
  c.lineWidth=1; c.strokeStyle='rgba(141,150,163,.55)'; c.stroke();
  // radios e índice, que giran con la polea
  c.save(); c.translate(pl.x,pl.y); c.rotate(pl.a);
  c.lineWidth=1.2; c.strokeStyle='rgba(120,129,142,.75)';
  for(var d=0; d<360; d+=60){
    var t=d*Math.PI/180;
    c.beginPath(); c.moveTo(Math.cos(t)*PR*0.22, Math.sin(t)*PR*0.22);
    c.lineTo(Math.cos(t)*PR*0.74, Math.sin(t)*PR*0.74); c.stroke();
  }
  c.beginPath(); c.arc(PR*0.55,0,PR*0.13,0,6.2832);
  c.fillStyle='#e8752f'; c.fill();
  c.restore();
  // eje
  c.beginPath(); c.arc(pl.x,pl.y,PR*0.2,0,6.2832);
  c.fillStyle='#39404a'; c.fill();
  c.lineWidth=1; c.strokeStyle='#242a32'; c.stroke();
  c.restore();
}

/* el clavo: cabeza de acero y, debajo, el rayado de «esto está sujeto al suelo»,
   que es como se marca un apoyo fijo en un esquema de mecanismos */
function drawNail(c,n){
  var R=PINR*1.2;
  c.save();
  c.beginPath(); c.moveTo(n.x-R*1.5,n.y+R*1.15); c.lineTo(n.x+R*1.5,n.y+R*1.15);
  c.lineWidth=1.3; c.strokeStyle='#5b636f'; c.stroke();
  c.lineWidth=1; c.strokeStyle='rgba(91,99,111,.75)';
  for(var k=-2;k<=2;k++){
    var x0=n.x+k*R*0.6;
    c.beginPath(); c.moveTo(x0,n.y+R*1.15); c.lineTo(x0-R*0.55,n.y+R*1.9); c.stroke();
  }
  c.beginPath(); c.arc(n.x,n.y,R,0,6.2832);
  var g=c.createRadialGradient(n.x-2,n.y-2,1,n.x,n.y,R);
  g.addColorStop(0,'#9aa3b0'); g.addColorStop(1,'#39404a');
  c.fillStyle=g; c.fill();
  c.lineWidth=1.1; c.strokeStyle='#242a32'; c.stroke();
  c.beginPath(); c.arc(n.x-R*0.28,n.y-R*0.28,R*0.22,0,6.2832);
  c.fillStyle='rgba(255,255,255,.75)'; c.fill();
  c.restore();
}

/* el trazo, debajo de todo: es tinta sobre el papel, no una pieza */
function drawTrace(c){
  c.save(); c.lineJoin='round'; c.lineCap='round'; c.lineWidth=2.1;
  trace.forEach(function(t){
    if(t.p.length<2) return;
    c.strokeStyle=t.col||cordColor;
    c.beginPath(); c.moveTo(t.p[0].x,t.p[0].y);
    for(var i=1;i<t.p.length;i++) c.lineTo(t.p[i].x,t.p[i].y);
    c.stroke();
  });
  c.restore();
}
/* el rotulador: un casquillo del color de la tinta con la punta en el agujero.
   El que va en un cruce se dibuja hueco, para que se vea que no está sujeto a
   ninguna tira sino al punto donde se cortan las dos. */
function drawPen(c,r){
  var q=penPos(r); if(!q) return;
  var R=PINR*1.15;
  c.save();
  if(r.q){
    c.beginPath(); c.arc(q.x,q.y,R*1.1,0,6.2832);
    c.fillStyle='#fff'; c.fill();
    c.lineWidth=2.4; c.strokeStyle=r.col||cordColor; c.stroke();
    c.beginPath(); c.arc(q.x,q.y,R*0.3,0,6.2832);
    c.fillStyle=r.col||cordColor; c.fill();
  } else {
    c.beginPath(); c.arc(q.x,q.y,R,0,6.2832);
    c.fillStyle=r.col||cordColor; c.fill();
    c.lineWidth=1.2; c.strokeStyle='rgba(255,255,255,.85)'; c.stroke();
    c.beginPath(); c.arc(q.x,q.y,R*0.34,0,6.2832);
    c.fillStyle='rgba(255,255,255,.9)'; c.fill();
  }
  c.restore();
}

function armOf(s,hi){
  if(isArc(s)) return null;
  var L=lenOf(s)*U, t=TYPES[s.t].pts[hi].x*U;
  var dir = (t < L/2) ? 1 : -1;
  return {dir:dir, len:Math.max(t,L-t), ang: s.a + (dir>0?0:Math.PI)};
}
/* Rayo de una tira a partir de un punto cualquiera de su eje. Cuál de los dos
   lados se toma no es indiferente: en el modelo del arco capaz el ángulo que
   interesa es el que forman las varillas mirando hacia sus ejes, no el opuesto.
   Por eso, si la tira está sujeta por algún sitio —una polea o un clavo— el rayo
   apunta hacia ahí; y si no lo está, hacia el lado más largo, que es el mismo
   criterio que se usa en los encuadernadores. */
function rayFrom(s,q){
  if(isArc(s)) return null;
  var L=lenOf(s)*U, A=endA(s);
  var t=(q.x-A.x)*Math.cos(s.a)+(q.y-A.y)*Math.sin(s.a);   // parámetro sobre el eje
  var anc=null;
  var mo=mountOf(s.id);
  if(mo) anc=TYPES[s.t].pts[mo.m.h].x*U;
  else { for(var i=0;i<nails.length;i++) if(nails[i].s===s.id){ anc=TYPES[s.t].pts[nails[i].h].x*U; break; } }
  var dir;
  if(anc!==null && Math.abs(anc-t)>1e-6) dir = (anc>t) ? 1 : -1;
  else dir = (t < L/2) ? 1 : -1;
  var len = dir>0 ? Math.max(1,L-t) : Math.max(1,t);
  return {dir:dir, len:len, ang: s.a + (dir>0?0:Math.PI)};
}
/* ¿hay un encuadernador que una precisamente estas dos tiras en este punto? Si lo
   hay, el ángulo ya lo dibuja el encuadernador y no hay que repetirlo. */
function pinnedHere(idA,idB,q){
  for(var i=0;i<pins.length;i++){
    var p=pins[i];
    if(!p.m.some(function(m){return m.s===idA;})) continue;
    if(!p.m.some(function(m){return m.s===idB;})) continue;
    if(dist(pinPos(p),q)<=HR*2) return true;
  }
  return false;
}
/* Ángulos en los cruces: dos tiras superpuestas forman un ángulo aunque no haya
   nada que las una. Es el caso del arco capaz, donde el vértice va deslizando. */
function drawCrossAngles(c){
  for(var i=0;i<strips.length;i++) for(var j=i+1;j<strips.length;j++){
    var s1=strips[i], s2=strips[j];
    var q=crossOf(s1.id,s2.id); if(!q) continue;
    if(pinnedHere(s1.id,s2.id,q)) continue;
    var a1=rayFrom(s1,q), a2=rayFrom(s2,q);
    if(a1&&a2) drawAngleAt(c,q,a1,a2);
  }
}
function drawAngle(c,p){
  if(p.m.length!==2) return;
  var s1=byId(p.m[0].s), s2=byId(p.m[1].s); if(!s1||!s2) return;
  var a1=armOf(s1,p.m[0].h), a2=armOf(s2,p.m[1].h);
  if(!a1||!a2) return;
  drawAngleAt(c,pinPos(p),a1,a2);
}
function drawAngleAt(c,q,a1,a2){
  var d=((a2.ang-a1.ang)*180/Math.PI)%360; if(d<0)d+=360;
  var show = d>180 ? 360-d : d;
  var r=Math.min(30, Math.min(a1.len,a2.len)*0.55); if(r<12) r=12;
  var from=a1.ang, to=a2.ang, ccw = (d>180);
  c.save();
  c.beginPath(); c.arc(q.x,q.y,r,from,to,ccw);
  c.lineWidth=1.6; c.strokeStyle='rgba(47,98,168,.85)'; c.stroke();
  var mid = from + (ccw? -(360-d):d)*Math.PI/360;
  var lx=q.x+Math.cos(mid)*(r+15), ly=q.y+Math.sin(mid)*(r+15);
  var txt=show.toFixed(1).replace('.0','')+'°';
  c.font='600 12px -apple-system,Segoe UI,Roboto,sans-serif';
  c.textAlign='center'; c.textBaseline='middle';
  var w=c.measureText(txt).width+8;
  rrect(c,lx-w/2,ly-9,w,18,9); c.fillStyle='rgba(255,255,255,.92)'; c.fill();
  c.strokeStyle='rgba(47,98,168,.35)'; c.lineWidth=1; c.stroke();
  c.fillStyle='#25406b'; c.fillText(txt,lx,ly);
  c.restore();
}

/* Rejilla de referencia. Es solo visual: las tiras no se ajustan a ella, el imán
   funciona por proximidad entre agujeros. Los puntos van cada media unidad, que
   es el paso de los agujeros de las rojas y el radio del fijador de ángulos;
   los que caen en unidades enteras se marcan un poco más. */
function drawGrid(c,w,h){
  var paso=U*HP, step=paso*view.z;
  if(step<10) return;
  var i0=Math.floor((0-view.x)/view.z/paso), i1=Math.ceil((w-view.x)/view.z/paso);
  var j0=Math.floor((0-view.y)/view.z/paso), j1=Math.ceil((h-view.y)/view.z/paso);
  c.save();
  for(var i=i0;i<=i1;i++){
    var x=i*step+view.x, par=(i%2===0);
    for(var j=j0;j<=j1;j++){
      var y=j*step+view.y, entero=par&&(j%2===0);
      c.fillStyle = entero ? '#aeb6c3' : '#d2d7df';
      var r = entero ? 1.6 : 1.1;
      c.fillRect(x-r,y-r,2*r,2*r);
    }
  }
  c.restore();
}

function scene(c,W,H,forExport){
  c.save();
  if(opt.grid && !forExport) drawGrid(c,W,H);
  c.translate(view.x,view.y); c.scale(view.z,view.z);

  drawTrace(c);
  belts.forEach(function(b){ drawBelt(c,b); });
  pulleys.forEach(function(p){ drawPulley(c,p); });
  cords.forEach(function(cd){ drawCord(c,cd); });
  if(cordDraft) drawCord(c,cordDraft,cordDraft.preview);

  // el fijador va siempre por debajo de las tiras
  strips.forEach(function(s){ if(isArc(s)) drawStrip(c,s,sel.has(s.id)); });
  strips.forEach(function(s){ if(!isArc(s)) drawStrip(c,s,sel.has(s.id)); });
  pins.forEach(function(p){ drawPin(c,p); });
  nails.forEach(function(n){ drawNail(c,n); });
  pens.forEach(function(r){ drawPen(c,r); });
  if(opt.ang){ pins.forEach(function(p){ drawAngle(c,p); }); drawCrossAngles(c); }

  if(!forExport){
    // tirador de giro
    if(primary!=null && sel.has(primary)){
      var s=byId(primary);
      if(s){ var h=handleOf(s);
        c.save();
        c.setLineDash([3,3]); c.lineWidth=1.2; c.strokeStyle='rgba(47,98,168,.55)';
        c.beginPath(); c.moveTo(h.pivot.x,h.pivot.y); c.lineTo(h.p.x,h.p.y); c.stroke();
        c.setLineDash([]);
        c.beginPath(); c.arc(h.pivot.x,h.pivot.y,3.4,0,6.2832); c.fillStyle='#2f62a8'; c.fill();
        c.beginPath(); c.arc(h.p.x,h.p.y,9.5/view.z,0,6.2832);
        c.fillStyle='#fff'; c.fill(); c.lineWidth=2/view.z; c.strokeStyle='#2f62a8'; c.stroke();
        c.beginPath(); c.arc(h.p.x,h.p.y,4.6/view.z,0.6,5.1); c.lineWidth=1.7/view.z;
        c.strokeStyle='#2f62a8'; c.stroke();
        c.restore();
      }
    }
    if(snapMark){
      c.save(); c.beginPath(); c.arc(snapMark.x,snapMark.y,PINR*1.9,0,6.2832);
      c.lineWidth=2/view.z; c.strokeStyle='#19a06a'; c.stroke();
      c.restore();
    }
    if(beltDraft){                     // primera polea elegida para la correa
      c.save(); c.beginPath(); c.arc(beltDraft.x,beltDraft.y,PR+4/view.z,0,6.2832);
      c.lineWidth=2.5/view.z; c.strokeStyle='#4a515c'; c.setLineDash([6/view.z,4/view.z]);
      c.stroke(); c.setLineDash([]); c.restore();
    }
    if(hoverCross){
      c.save(); c.beginPath(); c.arc(hoverCross.p.x,hoverCross.p.y,PINR*1.7,0,6.2832);
      c.lineWidth=2/view.z; c.strokeStyle=cordColor; c.stroke(); c.restore();
    }
    if(hoverHole){
      c.save(); c.beginPath(); c.arc(hoverHole.p.x,hoverHole.p.y,HR*1.9,0,6.2832);
      c.lineWidth=2/view.z;
      c.strokeStyle= (tool==='cord'||tool==='pen')? cordColor : (tool==='nail'? '#39404a' : '#b8891f');
      c.stroke();
      c.restore();
    }
  }
  c.restore();
}

function draw(){
  var W=cv.width/(window.devicePixelRatio||1), H=cv.height/(window.devicePixelRatio||1);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,H);
  scene(ctx,W,H,false);
  updateHint();
}

/* =========================================================================
   6. HIT TESTS
   ========================================================================= */
function holeAt(p,tolPx){
  var tol=(tolPx||13)/view.z, best=null;
  for(var i=strips.length-1;i>=0;i--){ var s=strips[i];
    var hs=holesOf(s);
    for(var j=0;j<hs.length;j++){ var q=holeW(s,j), d=dist(p,q);
      if(d<tol && (!best||d<best.d)) best={s:s.id,h:j,p:q,d:d}; } }
  return best;
}
/* las tiras tienen prioridad sobre el fijador, igual que en el dibujo */
function stripAt(p){
  var i,s;
  for(i=strips.length-1;i>=0;i--){ s=strips[i];
    if(!isArc(s) && distSeg(p,endA(s),endB(s))<=HW+2) return s; }
  for(i=strips.length-1;i>=0;i--){ s=strips[i];
    if(isArc(s)){ var T=TYPES[s.t], l=toLocal(s,p), r=Math.hypot(l.x,l.y);
      if(l.y<=T.lip+0.03 && r<=T.Rb+0.03) return s; } }
  return null;
}
function pinAt(p){
  for(var i=pins.length-1;i>=0;i--){ if(dist(p,pinPos(pins[i]))<=PINR+4/view.z) return pins[i]; }
  return null;
}
function cordAt(p){
  for(var i=cords.length-1;i>=0;i--){ var cd=cords[i];
    var pts=cd.n.map(function(n){var s=byId(n.s);return s?holeW(s,n.h):null;}).filter(Boolean);
    var lim = cd.closed? pts.length : pts.length-1;
    for(var j=0;j<lim;j++){ var a=pts[j], b=pts[(j+1)%pts.length];
      if(distSeg(p,a,b)<=6/view.z) return cd; } }
  return null;
}

/* =========================================================================
   7. INTERACCIÓN
   ========================================================================= */
function evPos(e){ var r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }

function onDown(e){
  cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
  var sp=evPos(e), wp=s2w(sp);

  if(tool==='del'){
    var rt=penAt(wp); if(rt){ pushUndo(); penRemove(rt); draw(); return; }
    var nl=nailAt(wp); if(nl){ pushUndo(); nailRemove(nl); draw(); return; }
    var bl=beltAt(wp); if(bl){ pushUndo(); belts=belts.filter(function(x){return x!==bl;}); draw(); return; }
    var pn=pinAt(wp); if(pn){ pushUndo(); pins=pins.filter(function(x){return x!==pn;}); draw(); return; }
    var cd=cordAt(wp); if(cd){ pushUndo(); cords=cords.filter(function(x){return x!==cd;}); draw(); return; }
    var tz=traceAt(wp); if(tz){ pushUndo(); trace=trace.filter(function(x){return x!==tz;}); draw(); return; }
    var st=stripAt(wp); if(st){ pushUndo(); removeStrip(st.id); draw(); return; }
    var pl0=pulleyAt(wp); if(pl0){ pushUndo(); pulleyRemove(pl0); draw(); return; }
    return;
  }

  /* polea: clic en el tablero para ponerla, clic encima para quitarla. Con la
     herramienta activa se puede arrastrar para colocarla en su sitio. */
  if(tool==='pulley'){
    var pv0=pulleyAt(wp);
    if(pv0){ pushUndo();
      drag={mode:'polmove', pol:pv0, off:{x:wp.x-pv0.x, y:wp.y-pv0.y}};
      draw(); return; }
    pushUndo();
    var np=pulleyAdd(wp.x,wp.y);
    mountAt({x:np.x,y:np.y}, 12/view.z);
    draw(); return;
  }

  /* correa: clic en una polea y luego en otra */
  if(tool==='belt'){
    var pb=pulleyAt(wp,6);
    if(!pb){ var bd=beltAt(wp);
      if(bd){ pushUndo(); belts=belts.filter(function(x){return x!==bd;}); }
      else { beltDraft=null; flash('Haz clic en una polea y luego en otra'); }
      draw(); return; }
    if(!beltDraft){ beltDraft=pb; draw(); return; }
    if(beltDraft===pb){ beltDraft=null; draw(); return; }
    pushUndo();
    if(!beltAdd(beltDraft,pb)) flash('Esas dos poleas ya están unidas por una correa');
    beltDraft=null; draw(); return;
  }

  /* clavo: clic en un agujero para clavarlo al suelo donde esté, clic encima
     para arrancarlo. Con un clavo la tira todavía gira; con dos se queda quieta. */
  if(tool==='nail'){
    var n0=nailAt(wp);
    if(n0){ pushUndo(); nailRemove(n0); draw(); return; }
    var hn=holeAt(wp,15);
    if(hn){ pushUndo(); nailAdd(hn.s,hn.h); draw(); }
    else flash('Clava la tira por uno de sus agujeros');
    return;
  }

  /* rotulador: clic en un agujero para ponerlo, clic encima para quitarlo.
     El trazo que haya dejado se queda; se borra con la herramienta Borrar. */
  if(tool==='pen'){
    var r0=penAt(wp);
    if(r0){ pushUndo(); penRemove(r0); draw(); return; }
    var hp=holeAt(wp,15);
    if(hp){ pushUndo(); penAdd(hp.s,hp.h,cordColor); draw(); return; }
    /* si no hay agujero cerca pero sí un cruce de dos tiras, el rotulador se pone
       ahí y va siguiendo el punto de corte mientras las tiras se mueven */
    var cx=crossAt(wp,14);
    if(cx){ pushUndo(); penAddCross(cx.a,cx.b,cordColor); draw(); return; }
    flash('Pon el rotulador en un agujero, o donde se crucen dos tiras');
    return;
  }

  if(tool==='pin'){
    var h=holeAt(wp,15);
    if(h){
      pushUndo();
      /* si hay una polea debajo, el encuadernador monta la tira en su eje: queda
         solidaria con la polea, que es lo que hace falta para la correa */
      var mo=mountAt(h.p, 12/view.z);
      if(mo){ flash('Tira montada en la polea: ahora gira con ella'); draw(); return; }
      var made=joinAt(h.p, 10/view.z);
      if(!made) flash('Necesitas dos agujeros superpuestos para poner un encuadernador');
      draw(); }
    return;
  }

  if(tool==='cord'){
    var h2=holeAt(wp,15);
    if(!h2){ finishCord(); draw(); return; }
    if(!cordDraft){ cordDraft={id:nid++,n:[{s:h2.s,h:h2.h}],closed:false,col:cordColor}; draw(); return; }
    var first=cordDraft.n[0];
    if(cordDraft.n.length>2 && first.s===h2.s && first.h===h2.h){ cordDraft.closed=true; finishCord(); draw(); return; }
    var last=cordDraft.n[cordDraft.n.length-1];
    if(last.s===h2.s && last.h===h2.h){ finishCord(); draw(); return; }
    cordDraft.n.push({s:h2.s,h:h2.h}); draw(); return;
  }

  /* --- herramienta mover --- */
  // tirador de giro
  if(primary!=null && sel.has(primary)){
    var ps=byId(primary);
    if(ps){ var hh=handleOf(ps);
      if(dist(wp,hh.p) < 13/view.z){
        pushUndo(); penDown();
        var rotIds = sel.size>1 ? new Set(sel) : new Set([primary]);
        drag={mode:'rot', ids:rotIds, pivot:hh.pivot,
              a0:Math.atan2(wp.y-hh.pivot.y, wp.x-hh.pivot.x), acc:0};
        return;
      } }
  }
  // arrastrar un encuadernador deforma el mecanismo (cuadrado -> rombo)
  var pn0=pinAt(wp);
  if(pn0){ pushUndo(); penDown(); sel.clear(); primary=null; drag={mode:'joint',pin:pn0}; draw(); return; }

  var st2=stripAt(wp);
  if(st2){
    if(e.shiftKey){ if(sel.has(st2.id)) sel.delete(st2.id); else sel.add(st2.id); primary=st2.id; draw(); return; }
    if(!sel.has(st2.id)){ sel.clear(); sel.add(st2.id); }
    primary=st2.id; toFront(st2.id);
    // Alt = girar directamente
    if(e.altKey){
      pushUndo(); penDown(); var pv=pivotOf(st2);
      drag={mode:'rot', ids:new Set(sel.size>1?sel:[st2.id]), pivot:pv.p,
            a0:Math.atan2(wp.y-pv.p.y, wp.x-pv.p.x), acc:0};
      draw(); return;
    }
    /* Montada en una polea: arrastrarla la gira a ella sola, deslizándola sobre
       la polea. Sirve para calar cada varilla en su ángulo. Para mover el
       mecanismo entero se arrastra la polea. */
    var mo2=mountOf(st2.id);
    if(mo2){
      pushUndo(); penDown();
      drag={mode:'turn', pol:mo2.pol, sid:st2.id, base:mo2.m.off, want:0,
            a0:Math.atan2(wp.y-mo2.pol.y, wp.x-mo2.pol.x)};
      draw(); return;
    }
    pushUndo(); penDown();
    var comp=component(sel.size>1?sel:new Set([st2.id]));
    /* Si hay un clavo en el grupo, arrastrar no puede trasladarlo en bloque: lo
       que hay que hacer es tirar del punto agarrado y dejar que el mecanismo se
       articule. Es lo que convierte un cuadrilátero clavado en un cuatro barras. */
    if(compHasNail(comp)){
      if(fullyNailed(st2.id)) flash('Esta tira tiene dos clavos: hace de suelo y no se mueve');
      drag={mode:'drive', s:st2.id, l:toLocal(st2,wp)};
    }
    else drag={mode:'move', ids:comp, grab:wp, off:{x:0,y:0}};
    draw(); return;
  }
  /* Arrastrar la polea la hace girar, y con ella la correa, las poleas
     solidarias y todas las tiras montadas. Es la manivela del mecanismo.
     Para cambiarla de sitio, la herramienta ◎ Polea. */
  var plm=pulleyAt(wp);
  if(plm){ pushUndo(); penDown(); sel.clear(); primary=null;
    drag={mode:'turn', pol:plm, sid:null, base:plm.a, want:0,
          a0:Math.atan2(wp.y-plm.y, wp.x-plm.x)};
    draw(); return; }
  sel.clear(); primary=null;
  drag={mode:'pan', sp:sp, v0:{x:view.x,y:view.y}};
  draw();
}

function onMove(e){
  var sp=evPos(e), wp=s2w(sp);
  if(!drag){
    hoverHole = (tool==='pin'||tool==='cord'||tool==='pen'||tool==='nail') ? holeAt(wp,15) : null;
    hoverCross = (tool==='pen' && !hoverHole) ? crossAt(wp,14) : null;
    if(cordDraft){ cordDraft.preview=wp; }
    cv.style.cursor = (tool==='move' && (stripAt(wp)||pulleyAt(wp))) ? 'move'
                    : (tool==='move'?'default':'crosshair');
    draw(); return;
  }
  if(drag.mode==='pan'){ view.x=drag.v0.x+(sp.x-drag.sp.x); view.y=drag.v0.y+(sp.y-drag.sp.y); draw(); return; }

  if(drag.mode==='move'){
    var dx=wp.x-drag.grab.x-drag.off.x, dy=wp.y-drag.grab.y-drag.off.y;
    translate(Array.from(drag.ids),dx,dy);
    drag.off.x+=dx; drag.off.y+=dy;
    snapMark=null;
    if(opt.magnet){
      var sn=findSnap(drag.ids);
      if(sn){ translate(Array.from(drag.ids),sn.dx,sn.dy);
        drag.off.x+=sn.dx; drag.off.y+=sn.dy;
        snapMark=sn.b.p; drag.snap=sn; }
      else drag.snap=null;
    }
    penSample();
    draw(); return;
  }
  if(drag.mode==='joint'){
    relaxUntil(null,{pin:drag.pin,t:wp},800,1e-7);
    penSample();
    draw(); return;
  }
  /* Giro alrededor del eje de una polea. Si drag.sid está puesto se gira solo esa
     tira sobre la polea (calarla); si no, se gira la polea entera con su correa y
     todo lo montado. Se lleva aparte el ángulo total pedido con el ratón (want)
     para que Mayús pueda enganchar a múltiplos de 15° sin perder el resto del gesto. */
  if(drag.mode==='turn'){
    var aN=Math.atan2(wp.y-drag.pol.y, wp.x-drag.pol.x);
    var dth=aN-drag.a0;
    while(dth>Math.PI) dth-=2*Math.PI;
    while(dth<-Math.PI) dth+=2*Math.PI;
    drag.a0=aN; drag.want+=dth;
    var objetivo=drag.base+drag.want;
    if(e.shiftKey){ var pasoT=Math.PI/12; objetivo=Math.round(objetivo/pasoT)*pasoT; }
    var actual, aplicar, hecho;
    if(drag.sid!=null){
      var mo3=mountOf(drag.sid);
      if(!mo3){ draw(); return; }
      actual=mo3.m.off; aplicar=objetivo-actual;
      hecho = Math.abs(aplicar)<=1e-7 || turnMountedStrip(drag.sid,aplicar);
    } else {
      actual=drag.pol.a; aplicar=objetivo-actual;
      hecho = Math.abs(aplicar)<=1e-7 || turnPulleys(drag.pol,aplicar);
    }
    if(!hecho) flash('El montaje no puede acompañar ese giro');
    penSample();
    draw(); return;
  }
  /* llevarse la polea de sitio, con lo que tenga montado */
  if(drag.mode==='polmove'){
    movePulley(drag.pol, wp.x-drag.off.x-drag.pol.x, wp.y-drag.off.y-drag.pol.y);
    relaxUntil(null,null,600,1e-7);
    penSample();
    draw(); return;
  }
  /* arrastre de un mecanismo clavado: se tira del punto agarrado a medias y se
     deja relajar, varias veces. A medias, porque tirar del todo de una vez hace
     que el mecanismo se salte las restricciones y dé un tirón. */
  if(drag.mode==='drive'){
    var sd=byId(drag.s);
    /* si la tira agarrada tiene dos clavos es suelo: el solver no la toca, así
       que tirar de ella la despegaría de sus propios clavos. No se mueve y ya */
    if(sd && fullyNailed(sd.id)) sd=null;
    if(sd){ for(var it=0; it<8; it++){
        var g=toWorld(sd,drag.l);
        applyCorrAt(sd, g, (wp.x-g.x)*0.5, (wp.y-g.y)*0.5);
        relaxUntil(null,null,600,1e-7);
      } }
    penSample();
    draw(); return;
  }
  if(drag.mode==='rot'){
    var a=Math.atan2(wp.y-drag.pivot.y, wp.x-drag.pivot.x);
    var want=a-drag.a0;                                   // giro total pedido
    if(e.shiftKey){ var step=Math.PI/12; want=Math.round(want/step)*step; }
    var d=want-drag.acc;
    if(Math.abs(d)>1e-7){
      if(rotateGroup(drag.ids, drag.pivot, d)) drag.acc=want;
      else flash(compHasNail(drag.ids)
        ? 'El mecanismo no puede seguir por ahí: prueba en el otro sentido'
        : 'Esa estructura es rígida: no puede girar');
    }
    snapMark=null; drag.snap=null;
    if(opt.magnet && !e.shiftKey){
      var sn=findSnapRot(drag.ids, drag.pivot);
      if(sn){
        if(Math.abs(sn.da)<1e-9 || rotateGroup(drag.ids, drag.pivot, sn.da)){
          drag.acc+=sn.da; snapMark=sn.p; drag.snap={b:{p:sn.p}};
        }
      }
    }
    penSample();
    draw(); return;
  }
}

function onUp(e){
  if(drag && (drag.mode==='move'||drag.mode==='rot')){
    if(drag.snap && opt.magnet){
      // si lo que ha atraído era el eje de una polea, la tira se monta en ella
      if(drag.snap.b && drag.snap.b.pol) mountAt(drag.snap.b.p, 6/view.z);
      else joinAt(drag.snap.b.p, 6/view.z);
    }
  }
  if(drag && drag.mode!=='pan') penSample();
  penUp();
  drag=null; snapMark=null; draw();
}

function finishCord(){
  if(cordDraft && cordDraft.n.length>=2){ delete cordDraft.preview; pushUndo(); cords.push(cordDraft); }
  cordDraft=null;
}

/* --- rueda: zoom --- */
stage.addEventListener('wheel',function(e){
  e.preventDefault();
  var sp=evPos(e), before=s2w(sp);
  var f=Math.exp(-e.deltaY*0.0015);
  view.z=Math.max(0.3,Math.min(3.2,view.z*f));
  var after=s2w(sp);
  view.x+=(after.x-before.x)*view.z; view.y+=(after.y-before.y)*view.z;
  draw();
},{passive:false});

cv.addEventListener('pointerdown',onDown);
window.addEventListener('pointermove',function(e){
  if(!drag){ var r=cv.getBoundingClientRect();
    if(e.clientX<r.left||e.clientY<r.top||e.clientX>r.right||e.clientY>r.bottom) return; }
  onMove(e);
});
window.addEventListener('pointerup',onUp);
window.addEventListener('pointercancel',onUp);
cv.addEventListener('dblclick',function(){ if(cordDraft){finishCord(); draw();} });

window.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ cordDraft=null; sel.clear(); primary=null; draw(); }
  else if(e.key==='Delete'||e.key==='Backspace'){
    if(sel.size){ pushUndo(); Array.from(sel).forEach(removeStrip); draw(); e.preventDefault(); } }
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){ doUndo(); e.preventDefault(); }
  else if(e.key==='v'||e.key==='V') setTool('move');
  else if(e.key==='e'||e.key==='E') setTool('pin');
  else if(e.key==='g'||e.key==='G') setTool('cord');
  else if(e.key==='c'||e.key==='C') setTool('nail');
  else if(e.key==='p'||e.key==='P') setTool('pulley');
  else if(e.key==='b'||e.key==='B') setTool('belt');
  else if(e.key==='r'||e.key==='R') setTool('pen');
  else if(e.key==='d'||e.key==='D') setTool('del');
  else if((e.key==='ArrowLeft'||e.key==='ArrowRight') && primary!=null && sel.has(primary)){
    var s=byId(primary); if(!s) return;
    var st=(e.shiftKey?15:1)*Math.PI/180*(e.key==='ArrowRight'?1:-1);
    pushUndo(); penDown();
    rotateGroup(new Set(sel.size>1?sel:[primary]), pivotOf(s).p, st);
    penSample(); penUp(); draw(); e.preventDefault();
  }
});

function miniSVG(t){
  var T=TYPES[t];
  if(T.shape==='arc'){
    var R=13, s='<svg width="34" height="17" viewBox="0 0 34 17">';
    s+='<path d="M4 14 L4 13 A13 13 0 0 1 30 13 L30 14 Z" fill="'+T.c+'" stroke="'+T.dk+'" stroke-opacity=".7"/>';
    for(var d=0;d<=180;d+=30) s+='<circle cx="'+(17+Math.cos(d*Math.PI/180)*9.5).toFixed(1)+'" cy="'+(13-Math.sin(d*Math.PI/180)*9.5).toFixed(1)+'" r="1.4" fill="#fff" stroke="'+T.dk+'" stroke-width=".7" stroke-opacity=".7"/>';
    s+='<circle cx="17" cy="13" r="1.4" fill="#fff" stroke="'+T.dk+'" stroke-width=".7" stroke-opacity=".7"/>';
    return s+'</svg>';
  }
  var w=Math.min(T.len,4)*17+8, sc=Math.min(T.len,4)/T.len*17;
  var h=13, y=h/2;
  var s2='<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">';
  s2+='<rect x="1" y="'+(y-4.5)+'" width="'+(T.len*sc+6)+'" height="9" rx="4.5" fill="'+T.c+'" stroke="'+T.dk+'" stroke-opacity=".55"/>';
  T.holes.forEach(function(d){ s2+='<circle cx="'+(4+d*sc)+'" cy="'+y+'" r="1.9" fill="#fff" stroke="'+T.dk+'" stroke-opacity=".6" stroke-width=".8"/>'; });
  return s2+'</svg>';
}
(function buildPalette(){
  var pal=document.getElementById('palette'), fam=null, html='';
  html+='<div class="brand">Geo<b>Tiras</b></div>';
  ORDER.forEach(function(t){
    var T=TYPES[t];
    if(T.fam!==fam){ fam=T.fam; html+='<h2>'+fam+'</h2>'; }
    html+='<div class="pitem" data-t="'+t+'" title="'+T.med+'"><span class="lab">'+(T.shape==='arc'?'∠':t)+'</span>'+miniSVG(t)+'</div>';
  });
  html+='<div class="note">Arrastra una pieza al tablero. Las medidas y los agujeros, en el panel ?</div>';
  pal.innerHTML=html;
  pal.querySelectorAll('.pitem').forEach(function(el){
    el.addEventListener('pointerdown',function(e){
      e.preventDefault();
      var t=el.dataset.t;
      var sp=evPos(e), wp=s2w(sp);
      var inside = sp.x>0 && sp.y>0;
      if(!inside){ var r=stage.getBoundingClientRect(); wp=s2w({x:r.width/2,y:r.height/2}); }
      pushUndo();
      var g=TYPES[t].cen;
      var s=addStrip(t, wp.x-g.x*U, wp.y-g.y*U, 0);
      sel.clear(); sel.add(s.id); primary=s.id; setTool('move');
      drag={mode:'move', ids:new Set([s.id]), grab:{x:wp.x,y:wp.y}, off:{x:0,y:0}};
      draw();
    });
  });
})();

function setTool(t){
  if(t!=='cord'){ finishCord(); }
  if(t!=='belt') beltDraft=null;
  tool=t; hoverHole=null; hoverCross=null;
  document.querySelectorAll('[data-tool]').forEach(function(b){ b.classList.toggle('on', b.dataset.tool===t); });
  if(t!=='move'){ sel.clear(); primary=null; }
  draw();
}
document.querySelectorAll('[data-tool]').forEach(function(b){
  b.addEventListener('click',function(){ setTool(b.dataset.tool); });
});
['magnet','ang','lab','grid'].forEach(function(k,i){
  var ids=['magnet','showang','showlab','showgrid'];
  var el=document.getElementById(ids[i]);
  el.addEventListener('change',function(){ opt[k]=el.checked?1:0; draw(); });
});
document.getElementById('cordcol').addEventListener('input',function(e){ cordColor=e.target.value; if(cordDraft)cordDraft.col=cordColor; draw(); });
document.getElementById('undo').addEventListener('click',doUndo);
document.getElementById('clear').addEventListener('click',function(){
  if(!strips.length && !trace.length && !pulleys.length) return;
  pushUndo(); strips=[]; pins=[]; cords=[]; pens=[]; trace=[]; nails=[]; pulleys=[]; belts=[];
  sel.clear(); primary=null; cordDraft=null; beltDraft=null; draw(); });
document.getElementById('zoomin').addEventListener('click',function(){ zoomAt(1.2); });
document.getElementById('zoomout').addEventListener('click',function(){ zoomAt(1/1.2); });
function zoomAt(f){ var r=stage.getBoundingClientRect(), c={x:r.width/2,y:r.height/2};
  var b=s2w(c); view.z=Math.max(0.3,Math.min(3.2,view.z*f)); var a=s2w(c);
  view.x+=(a.x-b.x)*view.z; view.y+=(a.y-b.y)*view.z; draw(); }
document.getElementById('fit').addEventListener('click',fitView);
function bboxOf(arr){
  if(!arr || !arr.length) return null;
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  arr.forEach(function(s){ var T=TYPES[s.t];
    var m = T.shape==='arc' ? (T.Rb-T.R)*U+HW : HW;
    T.pts.forEach(function(_,i){ var p=holeW(s,i);
      x0=Math.min(x0,p.x-m); y0=Math.min(y0,p.y-m);
      x1=Math.max(x1,p.x+m); y1=Math.max(y1,p.y+m); }); });
  return {x0:x0,y0:y0,x1:x1,y1:y1};
}
function unionBB(a,b){ if(!a) return b; if(!b) return a;
  return {x0:Math.min(a.x0,b.x0), y0:Math.min(a.y0,b.y0),
          x1:Math.max(a.x1,b.x1), y1:Math.max(a.y1,b.y1)}; }
function traceBBoxOf(arr){
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9, hay=false;
  (arr||[]).forEach(function(t){ t.p.forEach(function(q){ hay=true;
    x0=Math.min(x0,q.x-3); y0=Math.min(y0,q.y-3);
    x1=Math.max(x1,q.x+3); y1=Math.max(y1,q.y+3); }); });
  return hay ? {x0:x0,y0:y0,x1:x1,y1:y1} : null;
}
function pulleyBBox(){
  if(!pulleys.length) return null;
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  pulleys.forEach(function(p){
    x0=Math.min(x0,p.x-PR-4); y0=Math.min(y0,p.y-PR-4);
    x1=Math.max(x1,p.x+PR+4); y1=Math.max(y1,p.y+PR+8); });
  return {x0:x0,y0:y0,x1:x1,y1:y1};
}
/* el trazo cuenta para ajustar y para el PNG: puede quedar dibujo sin tiras */
function bbox(){ return unionBB(unionBB(bboxOf(strips), traceBBoxOf(trace)), pulleyBBox()); }
function fitView(){
  var b=bbox(); var r=stage.getBoundingClientRect();
  if(!b){ view={x:r.width/2,y:r.height/2,z:1}; draw(); return; }
  var m=50, z=Math.min((r.width-2*m)/(b.x1-b.x0||1),(r.height-2*m)/(b.y1-b.y0||1));
  z=Math.max(0.3,Math.min(2.2,z)); view.z=z;
  view.x=r.width/2-((b.x0+b.x1)/2)*z; view.y=r.height/2-((b.y0+b.y1)/2)*z;
  draw();
}
