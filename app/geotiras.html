/* =========================================================================
   9 bis. GUARDAR Y ABRIR
   Las coordenadas se guardan en unidades (no en píxeles) y los encuadernadores
   y gomas apuntan a las tiras por su posición en la lista, para que el
   archivo siga valiendo aunque cambie la escala del dibujo.
   ========================================================================= */
function serializar(){
  var pos={}; strips.forEach(function(s,i){ pos[s.id]=i; });
  var ppos={}; pulleys.forEach(function(p,i){ ppos[p.id]=i; });
  function polIndex(id){ return ppos[id]; }
  return {
    formato:'geotiras', version:1,
    piezas: strips.map(function(s){
      return {t:s.t, x:+(s.x/U).toFixed(6), y:+(s.y/U).toFixed(6), a:+s.a.toFixed(8)}; }),
    encuadernadores: pins.map(function(p){
      return {m:p.m.map(function(m){ return [pos[m.s], m.h]; })}; }),
    gomas: cords.map(function(c){
      return {color:c.col, cerrado:!!c.closed, n:c.n.map(function(n){ return [pos[n.s], n.h]; })}; }),
    rotuladores: pens.map(function(r){
      return r.q ? {color:r.col, cruce:[pos[r.q[0]], pos[r.q[1]]]}
                 : {color:r.col, n:[pos[r.s], r.h]}; }),
    poleas: pulleys.map(function(p){
      return {x:+(p.x/U).toFixed(6), y:+(p.y/U).toFixed(6), a:+p.a.toFixed(8),
              m:p.m.map(function(m){ return [pos[m.s], m.h, +m.off.toFixed(8)]; })}; }),
    correas: belts.map(function(b){
      return [polIndex(b.a), polIndex(b.b)]; }),
    clavos: nails.map(function(k){
      return {n:[pos[k.s], k.h], x:+(k.x/U).toFixed(6), y:+(k.y/U).toFixed(6)}; }),
    trazos: trace.map(function(t){
      return {color:t.col, p:t.p.map(function(q){ return [+(q.x/U).toFixed(5), +(q.y/U).toFixed(5)]; })}; })
  };
}
function deserializar(d){
  var lista = d && (d.piezas||d.pieces);
  if(!lista || !lista.length) return null;
  var ns=[];
  for(var i=0;i<lista.length;i++){
    var q=lista[i], T=TYPES[q.t];
    if(!T) return null;                                   // tipo de tira desconocido
    var x=Number(q.x), y=Number(q.y), a=Number(q.a);
    if(!isFinite(x)||!isFinite(y)||!isFinite(a)) return null;
    ns.push({id:nid++, t:q.t, x:x*U, y:y*U, a:a});
  }
  function ref(par){                                      // [índice de tira, índice de agujero]
    if(!par || par.length<2) return null;
    var s=ns[par[0]|0]; if(!s) return null;
    var h=par[1]|0; if(h<0 || h>=TYPES[s.t].pts.length) return null;
    return {s:s.id, h:h};
  }
  var np=[];
  (d.encuadernadores||d.pins||[]).forEach(function(p){
    var ms=(p.m||[]).map(ref).filter(Boolean);
    var vistas={}, limpio=[];
    ms.forEach(function(m){ if(!vistas[m.s]){ vistas[m.s]=1; limpio.push(m); } });
    if(limpio.length>=2) np.push({id:nid++, m:limpio});
  });
  var nc=[];
  (d.gomas||d.cordeles||d.cords||[]).forEach(function(c){
    var nn=(c.n||[]).map(ref).filter(Boolean);
    if(nn.length>=2) nc.push({id:nid++, n:nn, closed:!!c.cerrado||!!c.closed, col:c.color||c.col||cordColor});
  });
  var nr=[];
  (d.rotuladores||[]).forEach(function(r){
    if(r.cruce){                                          // rotulador en un cruce
      var s1=ns[r.cruce[0]|0], s2=ns[r.cruce[1]|0];
      if(!s1||!s2||s1===s2) return;
      if(nr.some(function(x){ return x.q &&
          ((x.q[0]===s1.id&&x.q[1]===s2.id)||(x.q[0]===s2.id&&x.q[1]===s1.id)); })) return;
      nr.push({id:nid++, q:[s1.id,s2.id], col:r.color||cordColor});
      return;
    }
    var m=ref(r.n); if(!m) return;
    if(nr.some(function(x){return !x.q && x.s===m.s && x.h===m.h;})) return;
    nr.push({id:nid++, s:m.s, h:m.h, col:r.color||cordColor});
  });
  var npl=[], nbl=[];
  (d.poleas||[]).forEach(function(p){
    var x=Number(p.x), y=Number(p.y), a=Number(p.a);
    if(!isFinite(x)||!isFinite(y)) return;
    var pl={id:nid++, x:x*U, y:y*U, a:isFinite(a)?a:0, m:[]};
    (p.m||[]).forEach(function(mm){
      if(!mm||mm.length<2) return;
      var s=ns[mm[0]|0]; if(!s) return;
      var h=mm[1]|0; if(h<0||h>=TYPES[s.t].pts.length) return;
      if(npl.some(function(q){ return q.m.some(function(z){return z.s===s.id;}); })) return;
      if(pl.m.some(function(z){return z.s===s.id;})) return;
      var off=Number(mm[2]); if(!isFinite(off)) off=s.a-pl.a;
      pl.m.push({s:s.id, h:h, off:off});
    });
    npl.push(pl);
  });
  (d.correas||[]).forEach(function(b){
    if(!b||b.length<2) return;
    var A=npl[b[0]|0], B=npl[b[1]|0];
    if(!A||!B||A===B) return;
    if(nbl.some(function(x){ return (x.a===A.id&&x.b===B.id)||(x.a===B.id&&x.b===A.id); })) return;
    nbl.push({id:nid++, a:A.id, b:B.id});
  });
  var nk=[];
  (d.clavos||[]).forEach(function(k){
    var m=ref(k.n); if(!m) return;
    if(nk.some(function(x){return x.s===m.s && x.h===m.h;})) return;
    var s=ns[k.n[0]|0];
    /* si el archivo no trae coordenadas o vienen ilegibles, se clava donde esté
       el agujero, que es lo que había cuando se guardó */
    var x=Number(k.x), y=Number(k.y);
    var q = (isFinite(x)&&isFinite(y)) ? {x:x*U, y:y*U} : holeW(s,m.h);
    nk.push({id:nid++, s:m.s, h:m.h, x:q.x, y:q.y});
  });
  var nt=[];
  (d.trazos||[]).forEach(function(t){
    var pp=[];
    (t.p||[]).forEach(function(q){
      if(!q || q.length<2) return;
      var x=Number(q[0]), y=Number(q[1]);
      if(isFinite(x)&&isFinite(y)) pp.push({x:x*U, y:y*U});
    });
    if(pp.length>=2) nt.push({id:nid++, col:t.color||cordColor, p:pp});
  });
  return {strips:ns, pins:np, cords:nc, pens:nr, trace:nt, nails:nk, pulleys:npl, belts:nbl};
}
function loadData(d){
  var r=deserializar(d);
  if(!r){ flash('Ese archivo no tiene el formato de geotiras esperado'); return; }
  pushUndo();
  if(importMode==='replace'){
    strips=r.strips; pins=r.pins; cords=r.cords; pens=r.pens; trace=r.trace; nails=r.nails;
    pulleys=r.pulleys; belts=r.belts; }
  else {
    var b0=unionBB(bboxOf(strips),traceBBoxOf(trace));
    var b1=unionBB(bboxOf(r.strips),traceBBoxOf(r.trace));
    if(b0 && b1){ var dy=b0.y1-b1.y0+1.5*U;
      r.strips.forEach(function(s){ s.y+=dy; });
      r.trace.forEach(function(t){ t.p.forEach(function(q){ q.y+=dy; }); });
      r.nails.forEach(function(k){ k.y+=dy; });
      r.pulleys.forEach(function(p){ p.y+=dy; }); }
    strips=strips.concat(r.strips); pins=pins.concat(r.pins); cords=cords.concat(r.cords);
    pens=pens.concat(r.pens); trace=trace.concat(r.trace); nails=nails.concat(r.nails);
    pulleys=pulleys.concat(r.pulleys); belts=belts.concat(r.belts);
  }
  sel.clear(); primary=null; cordDraft=null; drag=null; fitView();
  flash(r.strips.length+(r.strips.length===1?' pieza cargada':' piezas cargadas')+
        (r.pins.length?' · '+r.pins.length+' encuadernadores':'')+
        (r.cords.length?' · '+r.cords.length+' gomas':'')+
        (r.nails.length?' · '+r.nails.length+' clavos':'')+
        (r.pulleys.length?' · '+r.pulleys.length+' poleas':'')+
        (r.belts.length?' · '+r.belts.length+' correas':'')+
        (r.pens.length?' · '+r.pens.length+' rotuladores':'')+
        (r.trace.length?' · '+r.trace.length+' trazos':''));
}

/* =========================================================================
   11. AUTOCOMPROBACIÓN  ·  abre el archivo añadiendo #test al final de la URL
   ========================================================================= */
function runSelfTest(){
  var out=[], fails=0;
  function ok(n,c,extra){ out.push((c?'OK    ':'FALLO ')+n+(extra!==undefined?'   ['+extra+']':'')); if(!c) fails++; }
  function reset(){ strips=[]; pins=[]; cords=[]; pens=[]; trace=[]; nails=[];
                    pulleys=[]; belts=[]; beltDraft=null; sel.clear(); primary=null; }
  function D(a,b){ return dist(a,b); }
  function gr(r){ return r*180/Math.PI; }
  var L=function(t){ return TYPES[t].len; };
  var HO=function(t){ return TYPES[t].holes; };

  /* --- proporciones del manual ------------------------------------------ */
  ok('R2 = 2·R1', Math.abs(L('R2')-2*L('R1'))<1e-12);
  ok('R3 = 4·R1', Math.abs(L('R3')-4*L('R1'))<1e-12);
  ok('B1 = R1·√2', Math.abs(L('B1')-L('R1')*Math.SQRT2)<1e-12);
  ok('B2 = R2·√2', Math.abs(L('B2')-L('R2')*Math.SQRT2)<1e-12);
  ok('Y1 = R1·√3', Math.abs(L('Y1')-L('R1')*Math.sqrt(3))<1e-12);
  ok('Y2 = R2·√3', Math.abs(L('Y2')-L('R2')*Math.sqrt(3))<1e-12);
  ok('W1 = R1·√5', Math.abs(L('W1')-L('R1')*Math.sqrt(5))<1e-12);
  ok('W2 = diagonal mayor del octógono de lado R1', Math.abs(L('W2')-Math.sqrt(4+2*Math.SQRT2))<1e-12);
  ok('W2 es más larga que W1', L('W2')>L('W1'));

  /* --- agujeros ---------------------------------------------------------- */
  ok('R1: 3 agujeros con paso u/2', HO('R1').length===3 && Math.abs(HO('R1')[1]-0.5)<1e-12);
  ok('R2: 3 agujeros, el de en medio a 1 u', HO('R2').length===3 && Math.abs(HO('R2')[1]-1)<1e-12);
  ok('R3: 9 agujeros equiespaciados a u/2',
     HO('R3').length===9 && HO('R3').every(function(x,i){return Math.abs(x-i/2)<1e-12;}));
  ok('B1: 3 agujeros con el central', HO('B1').length===3 && Math.abs(HO('B1')[1]-L('B1')/2)<1e-12);
  ok('B2: 5 agujeros con el central', HO('B2').length===5 && Math.abs(HO('B2')[2]-L('B2')/2)<1e-12);
  ok('W1: 3 agujeros con el central', HO('W1').length===3 && Math.abs(HO('W1')[1]-L('W1')/2)<1e-12);
  ok('W2: 5 agujeros con el central', HO('W2').length===5 && Math.abs(HO('W2')[2]-L('W2')/2)<1e-12);
  ok('Y1: 5 agujeros; los contiguos al central dividen la tira en tres partes iguales',
     HO('Y1').length===5 && Math.abs(HO('Y1')[1]-L('Y1')/3)<1e-12 &&
     Math.abs(HO('Y1')[2]-L('Y1')/2)<1e-12 && Math.abs(HO('Y1')[3]-2*L('Y1')/3)<1e-12);
  ok('Y2: 7 agujeros; los contiguos al central dividen la tira en tres partes iguales',
     HO('Y2').length===7 && Math.abs(HO('Y2')[2]-L('Y2')/3)<1e-12 &&
     Math.abs(HO('Y2')[3]-L('Y2')/2)<1e-12 && Math.abs(HO('Y2')[4]-2*L('Y2')/3)<1e-12);
  ok('B2, Y2 y W2: el segundo agujero está a u/2 del extremo',
     Math.abs(HO('B2')[1]-0.5)<1e-12 && Math.abs(HO('Y2')[1]-0.5)<1e-12 && Math.abs(HO('W2')[1]-0.5)<1e-12);
  ['R1','R2','R3','B1','B2','Y1','Y2','W1','W2'].forEach(function(t){
    var h=HO(t);
    ok(t+': agujeros en los dos extremos y en orden creciente',
       Math.abs(h[0])<1e-12 && Math.abs(h[h.length-1]-L(t))<1e-12 &&
       h.every(function(x,i){ return i===0 || x>h[i-1]; }));
  });

  /* --- fijador de ángulos ------------------------------------------------ */
  var P=TYPES.P;
  ok('fijador: 14 agujeros (centro + 13 marcas)', P.pts.length===14);
  ok('fijador: el primero es el del centro', Math.abs(P.pts[0].x)<1e-12 && Math.abs(P.pts[0].y)<1e-12);
  ok('fijador: las marcas están a u/2 del centro',
     P.pts.slice(1).every(function(p){ return Math.abs(Math.hypot(p.x,p.y)-0.5)<1e-12; }));
  ok('fijador: de 0° a 180° cada 15°',
     P.pts.slice(1).every(function(p,i){ return p.deg===i*15; }) && P.pts[13].deg===180);

  /* --- qué tiras se pueden fijar ----------------------------------------- */
  function pares(t){ var h=HO(t), r=[]; for(var i=0;i<h.length;i++) for(var j=i+1;j<h.length;j++) r.push(h[j]-h[i]); return r; }
  function cuerda(k){ return 2*0.5*Math.sin(k*7.5*Math.PI/180); }
  function porRadio(t){ return pares(t).some(function(d){return Math.abs(d-0.5)<1e-9;}); }
  function porCuerda(t){ return pares(t).some(function(d){
      for(var k=1;k<=12;k++) if(Math.abs(d-cuerda(k))<1e-9) return true; return false; }); }
  ['R1','R3','B2','Y2','W2'].forEach(function(t){ ok(t+' encaja en el fijador por el radio', porRadio(t)); });
  ['R2','B1','Y1','W1'].forEach(function(t){ ok(t+' no encaja por el radio', !porRadio(t)); });
  ok('R2 encaja entre las marcas de 0° y 180° (cuerda 1 u)', porCuerda('R2'));
  ok('B1 encaja entre dos marcas separadas 90°', pares('B1').some(function(d){return Math.abs(d-cuerda(6))<1e-9;}));
  ok('Y1 encaja entre dos marcas separadas 120°', pares('Y1').some(function(d){return Math.abs(d-cuerda(8))<1e-9;}));
  ok('W1 no encaja de ninguna forma: √5/2 supera el diámetro', !porCuerda('W1') && !porRadio('W1'));

  /* --- unir y girar ------------------------------------------------------ */
  reset();
  var a=addStrip('R3',0,0,0), b=addStrip('R3',4*U,0,0);
  var pin=joinAt(holeW(a,8),1);
  ok('encuadernador creado con dos tiras', !!pin && pin.m.length===2);
  var piv=pivotOf(b).p;
  ok('el pivote de la tira girada es el encuadernador', D(piv,holeW(a,8))<0.01);
  var a0=b.a;
  ok('el giro se admite', rotateGroup(new Set([b.id]),piv,Math.PI/3)===true);
  ok('la otra tira no se ha movido', a.x===0 && a.y===0 && a.a===0);
  ok('la tira ha girado 60°', Math.abs(gr(b.a-a0)-60)<1e-9);
  ok('la unión sigue cerrada', D(holeW(a,8),holeW(b,0))<1e-6);
  ok('la tira no ha cambiado de longitud', Math.abs(D(holeW(b,0),holeW(b,8))-4*U)<1e-9);

  reset();
  a=addStrip('R2',0,0,0); b=addStrip('R2',2*U,0,0); var c=addStrip('R2',4*U,0,0);
  joinAt(holeW(a,2),1); joinAt(holeW(b,2),1);
  var cA={x:c.x,y:c.y,a:c.a};
  ok('en una cadena, girar la tira de en medio se admite',
     rotateGroup(new Set([b.id]),holeW(b,0),Math.PI/2)===true);
  ok('la primera tira no se mueve', a.x===0 && a.y===0 && a.a===0);
  ok('la tercera se arrastra sin girar',
     D({x:c.x,y:c.y},cA)>1 && Math.abs(c.a-cA.a)<1e-12);
  ok('las uniones de la cadena siguen cerradas', maxResidual()<1e-6, maxResidual().toFixed(6));

  /* --- triángulo rígido -------------------------------------------------- */
  reset();
  var LL=2*U;
  a=addStrip('R2',0,0,0);
  b=addStrip('R2',LL,0,2*Math.PI/3);
  c=addStrip('R2',LL/2,LL*Math.sqrt(3)/2,4*Math.PI/3);
  ok('los tres vértices del triángulo coinciden',
     D(holeW(b,2),holeW(c,0))<1e-6 && D(holeW(c,2),holeW(a,0))<1e-6);
  joinAt(holeW(a,2),1); joinAt(holeW(b,2),1); joinAt(holeW(c,2),1);
  ok('tres encuadernadores', pins.length===3, pins.length);
  var V0=[holeW(a,0),holeW(b,0),holeW(c,0)], pv=holeW(a,0);
  ok('el triángulo se puede girar', rotateGroup(new Set([a.id]),pv,0.4)===true);
  ok('las uniones del triángulo siguen cerradas', maxResidual()<1.0, maxResidual().toFixed(5));
  var V1=[holeW(a,0),holeW(b,0),holeW(c,0)];
  ok('el triángulo sigue siendo congruente (es rígido)',
     [0,1,2].every(function(i){ return Math.abs(D(V1[i],V1[(i+1)%3])-D(V0[i],V0[(i+1)%3]))<1e-6; }));
  ok('el triángulo ha girado en bloque 0,4 rad', [0,1,2].every(function(i){
      var co=Math.cos(0.4), si=Math.sin(0.4), p0=V0[i];
      var ex={x:pv.x+(p0.x-pv.x)*co-(p0.y-pv.y)*si, y:pv.y+(p0.x-pv.x)*si+(p0.y-pv.y)*co};
      return D(V1[i],ex)<0.5; }));

  /* --- cuadrilátero deformable ------------------------------------------ */
  reset();
  a=addStrip('R2',0,0,0); b=addStrip('R2',LL,0,Math.PI/2);
  c=addStrip('R2',LL,LL,Math.PI); var d=addStrip('R2',0,LL,-Math.PI/2);
  joinAt(holeW(a,2),1); joinAt(holeW(b,2),1); joinAt(holeW(c,2),1); joinAt(holeW(d,2),1);
  ok('cuatro encuadernadores en el cuadrilátero', pins.length===4, pins.length);
  var diag0=D(holeW(a,0),holeW(c,0));
  ok('el cuadrilátero se puede girar (es articulado)', rotateGroup(new Set([a.id]),holeW(a,0),0.3)===true);
  ok('el cuadrilátero se ha deformado', Math.abs(D(holeW(a,0),holeW(c,0))-diag0)>1);
  ok('las uniones siguen cerradas tras deformarlo', maxResidual()<1.0, maxResidual().toFixed(5));
  [a,b,c,d].forEach(function(s,i){
    ok('el lado '+(i+1)+' conserva su longitud', Math.abs(D(holeW(s,0),holeW(s,2))-LL)<1e-6); });
  relax(null,{pin:pins[0],t:{x:holeW(a,2).x+34,y:holeW(a,2).y-21}},140);
  ok('arrastrar un vértice deja las uniones cerradas', maxResidual()<1.0, maxResidual().toFixed(5));
  ok('arrastrar un vértice no estira las barras',
     [a,b,c,d].every(function(s){ return Math.abs(D(holeW(s,0),holeW(s,2))-LL)<1e-6; }));

  /* --- rombo a partir de las diagonales ---------------------------------- */
  reset();
  var hh=addStrip('R3',0,0,0), vv=addStrip('R2',2*U,-U,Math.PI/2);
  ok('los centros de las dos diagonales coinciden', D(holeW(hh,4),holeW(vv,1))<1e-6);
  joinAt(holeW(hh,4),1);
  var vert=[holeW(hh,0),holeW(vv,0),holeW(hh,8),holeW(vv,2)];
  var lados=vert.map(function(q,i){ return D(q,vert[(i+1)%4]); });
  ok('los cuatro lados del rombo son iguales', Math.max.apply(null,lados)-Math.min.apply(null,lados)<1e-6);
  ok('y el lado del rombo mide √5 u, la longitud de W1',
     Math.abs(lados[0]/U-Math.sqrt(5))<1e-9, (lados[0]/U).toFixed(5));

  /* --- imán de giro sobre el fijador de ángulos -------------------------- */
  reset();
  var fij=addStrip('P',0,0,0);
  var tira=addStrip('R1',0,0,-0.30);            // -17,2°: cerca de la marca de 15°
  var pj=joinAt(holeW(fij,0),1);
  ok('la tira se une al centro del fijador', !!pj && pj.m.length===2);
  var pivF=holeW(fij,0);
  var sn=findSnapRot(new Set([tira.id]),pivF);
  ok('el imán encuentra una marca del fijador a la que saltar', !!sn);
  if(sn){
    rotateGroup(new Set([tira.id]),pivF,sn.da);
    var ang=gr(tira.a), m=Math.abs(ang/15-Math.round(ang/15));
    ok('tras el imán, la tira queda en un múltiplo exacto de 15°', m<1e-9, ang.toFixed(4)+'°');
    ok('y su agujero cae justo sobre la marca del fijador',
       P.pts.slice(1).some(function(p,i){ return D(holeW(tira,1),holeW(fij,i+1))<1e-6; }));
    ok('el imán ha elegido la marca de 15° y no la de 0°', Math.abs(Math.abs(ang)-15)<1e-9, ang.toFixed(2)+'°');
  }
  reset();
  var suelta=addStrip('R1',300,300,0.21), f2=addStrip('P',600,600,0);
  ok('sin unión previa, el imán de giro no actúa (se puede girar libremente)',
     findSnapRot(new Set([suelta.id]),holeW(suelta,0))===null);

  /* --- el clavo ----------------------------------------------------------
     Un clavo sujeta un agujero a un punto del suelo. Lo que hay que comprobar
     es que manda sobre los encuadernadores y que deja exactamente un grado de
     libertad: giro alrededor de él.                                          */
  reset();
  var cl=addStrip('R2',0,0,0);
  var k1=nailAdd(cl.id,0);
  ok('el clavo se pone donde está el agujero', !!k1 && D({x:k1.x,y:k1.y},holeW(cl,0))<1e-12);
  ok('no se pueden poner dos clavos en el mismo agujero',
     nailAdd(cl.id,0)===null && nails.length===1);
  ok('el pivote de una tira clavada es el clavo, no su centro', pivotOf(cl).i===0);
  ok('con un clavo la tira gira alrededor de él',
     rotateGroup(new Set([cl.id]),{x:k1.x,y:k1.y},0.7)===true);
  ok('y el clavo sigue en su sitio', maxResidual()<1e-9, maxResidual().toExponential(1));
  ok('la tira ha girado de verdad', Math.abs(gr(cl.a)-gr(0.7))<1e-9, gr(cl.a).toFixed(3)+'°');
  // por más que se tire de ella por otro punto, el clavo no se suelta
  rotateGroup(new Set([cl.id]),holeW(cl,2),0.4);
  ok('tirando de la tira por otro punto, el clavo no se suelta',
     maxResidual()<1e-6, maxResidual().toExponential(1));
  ok('y el agujero clavado sigue en el mismo punto del suelo',
     D(holeW(cl,0),{x:k1.x,y:k1.y})<1e-6);
  nailAdd(cl.id,2);
  var clA={x:cl.x,y:cl.y,a:cl.a};
  ok('con dos clavos la tira ya no puede girar',
     rotateGroup(new Set([cl.id]),holeW(cl,0),0.3)===false, nails.length+' clavos');
  ok('y se ha quedado exactamente donde estaba',
     cl.x===clA.x && cl.y===clA.y && cl.a===clA.a);

  // el clavo tira de la tira hasta devolverla a su sitio
  reset();
  var vu=addStrip('R2',0,0,0); nailAdd(vu.id,0);
  translate([vu.id],40,-25);
  ok('mover a la fuerza una tira clavada deja residuo', maxResidual()>40, maxResidual().toFixed(1));
  relax(null,null,80);
  ok('y el solver la devuelve al clavo', maxResidual()<1e-6, maxResidual().toExponential(1));

  // un clavo manda sobre el encuadernador
  reset();
  var fj=addStrip('R2',0,0,0), lb=addStrip('R2',2*U,0,0);
  var libre=addStrip('R1',600,600,0);
  joinAt(holeW(fj,2),1); nailAdd(fj.id,0); nailAdd(fj.id,2);
  var fjA={x:fj.x,y:fj.y,a:fj.a};
  ok('el grupo con clavo se reconoce como articulado, no trasladable',
     compHasNail(new Set([lb.id]))===true && compHasNail(new Set([libre.id]))===false);
  // se tira de la barra libre por su extremo: debe girar, no arrastrar a la clavada
  for(var dv=0; dv<8; dv++){
    var gp=holeW(lb,2);
    applyCorrAt(lb, gp, (2*U-gp.x)*0.5, (2.4*U-gp.y)*0.5);
    relax(null,null,14);
  }
  ok('al tirar de la barra libre, la clavada no se mueve',
     D({x:fj.x,y:fj.y},fjA)<1e-6 && Math.abs(fj.a-fjA.a)<1e-9,
     D({x:fj.x,y:fj.y},fjA).toExponential(1));
  ok('la barra libre gira alrededor del encuadernador sin estirarse',
     Math.abs(D(holeW(lb,0),holeW(lb,2))-2*U)<1e-6 && maxResidual()<1e-3,
     maxResidual().toExponential(1));
  ok('y se ha movido de verdad hacia donde se tiraba', holeW(lb,2).y>0.5*U, (holeW(lb,2).y/U).toFixed(2));
  ok('la tira de dos clavos se reconoce como suelo, y la de uno no',
     fullyNailed(fj.id)===true && fullyNailed(lb.id)===false && fullyNailed(libre.id)===false);

  /* --- mecanismo de cuatro barras ----------------------------------------
     Paralelogramo articulado: barra fija de 4 u clavada por los dos extremos,
     manivela y balancín de 2 u, y acoplador de 4 u. Mientras la manivela no se
     alinee con el suelo, el acoplador se traslada sin girar y sus agujeros
     describen circunferencias del radio de la manivela. Ese es el caso con
     respuesta exacta, y por eso sirve de prueba. El barrido va de -170° a -10°
     justamente para no tocar las dos posiciones alineadas, 0° y 180°, que son
     puntos muertos y se prueban aparte.                                       */
  reset();
  var th0=-170*Math.PI/180;
  var sue=addStrip('R3',0,0,0);                    // barra fija (suelo)
  var man=addStrip('R2',0,0,th0);                  // manivela
  var bal=addStrip('R2',4*U,0,th0);                // balancín
  var Pm={x:2*U*Math.cos(th0), y:2*U*Math.sin(th0)};
  var aco=addStrip('R3',Pm.x,Pm.y,0);              // acoplador
  ok('el paralelogramo arranca con los cuatro vértices cerrados',
     D(holeW(sue,0),holeW(man,0))<1e-9 && D(holeW(sue,8),holeW(bal,0))<1e-9 &&
     D(holeW(man,2),holeW(aco,0))<1e-9 && D(holeW(bal,2),holeW(aco,8))<1e-9);
  joinAt(holeW(sue,0),1); joinAt(holeW(sue,8),1);
  joinAt(holeW(man,2),1); joinAt(holeW(bal,2),1);
  ok('cuatro encuadernadores en el mecanismo', pins.length===4, pins.length);
  nailAdd(sue.id,0); nailAdd(sue.id,8);
  ok('la barra fija está clavada por los dos extremos', nails.length===2);
  ok('el solver la trata como suelo y no la mueve nadie', groundSet().has(sue.id));
  var sueA={x:sue.x,y:sue.y,a:sue.a};
  penAdd(aco.id,4,'#d0322f');                      // rotulador en el centro del acoplador
  var centroTeo={x:2*U, y:0};                      // centro de la circunferencia que debe salir
  penDown();
  for(var gg=0; gg<32; gg++){
    rotateGroup(new Set([man.id]), holeW(sue,0), 5*Math.PI/180);
    penSample();
  }
  penUp();
  ok('la barra clavada no se ha movido en todo el barrido',
     D({x:sue.x,y:sue.y},sueA)<1e-6 && Math.abs(sue.a-sueA.a)<1e-9,
     D({x:sue.x,y:sue.y},sueA).toExponential(1));
  ok('las cuatro uniones siguen cerradas', maxResidual()<1e-3, maxResidual().toExponential(1));
  ok('la manivela ha girado los 160° pedidos', Math.abs(gr(man.a-th0)-160)<1e-6,
     gr(man.a-th0).toFixed(4)+'°');
  [[man,2],[bal,2],[aco,8],[sue,8]].forEach(function(par,i){
    ok('la barra '+(i+1)+' conserva su longitud',
       Math.abs(D(holeW(par[0],0),holeW(par[0],par[1]))-lenOf(par[0])*U)<1e-6); });
  ok('el acoplador se traslada sin girar (es un paralelogramo)',
     Math.abs(Math.sin(aco.a))<1e-3, gr(aco.a).toExponential(1)+'°');
  ok('el balancín copia el giro de la manivela',
     Math.abs(Math.sin(bal.a-man.a))<1e-3, gr(bal.a-man.a).toExponential(1)+'°');
  var CU=trace.length?trace[0].p:[];
  ok('el rotulador del acoplador ha dejado un trazo', trace.length===1 && CU.length===33,
     trace.length+' / '+CU.length);
  ok('y ese trazo es una circunferencia de radio la manivela, 2 u',
     CU.length>0 && CU.every(function(q){ return Math.abs(D(q,centroTeo)/U-2)<1e-4; }),
     CU.length? Math.max.apply(null,CU.map(function(q){return Math.abs(D(q,centroTeo)/U-2);})).toExponential(1):'-');
  ok('y no es un trozo de circunferencia, sino los 160° del barrido',
     CU.length>2 && Math.abs(D(CU[0],CU[CU.length-1])/U-2*2*Math.sin(80*Math.PI/180))<1e-3,
     CU.length>2? (D(CU[0],CU[CU.length-1])/U).toFixed(4):'-');

  /* Punto muerto: con la manivela alineada con el suelo, el paralelogramo puede
     seguir como paralelogramo o cruzarse. Lo que no puede es quedarse tieso, que
     es lo que pasaba antes: una vez rebasado el punto muerto con residuo alto,
     cualquier giro posterior se comparaba con un estado ya roto y se rechazaba,
     y el mecanismo se moría. */
  var antesM=gr(man.a);
  var pasaron=0;
  for(var pm=0; pm<40; pm++) if(rotateGroup(new Set([man.id]), holeW(sue,0), 6*Math.PI/180)) pasaron++;
  ok('el mecanismo atraviesa el punto muerto y sigue girando', pasaron===40, pasaron+' de 40');
  ok('y después del punto muerto sigue vivo, no se queda tieso',
     Math.abs(gr(man.a)-antesM)>200, (gr(man.a)-antesM).toFixed(1)+'°');
  ok('las barras siguen midiendo lo mismo después del punto muerto',
     [[man,2],[bal,2],[aco,8]].every(function(par){
       return Math.abs(D(holeW(par[0],0),holeW(par[0],par[1]))-lenOf(par[0])*U)<1e-6; }));
  ok('y la barra clavada tampoco se ha movido ahí',
     D({x:sue.x,y:sue.y},sueA)<1e-6 && Math.abs(sue.a-sueA.a)<1e-9);

  /* --- poleas y correas --------------------------------------------------- */
  reset();
  var pA=pulleyAdd(0,0), pB=pulleyAdd(4*U,0);
  ok('la polea se pone donde se pide', pulleys.length===2 && pA.x===0 && pB.x===4*U);
  var vv=addStrip('R3',0,0,0.3);
  ok('la tira se monta en el eje de la polea', !!mountAt({x:0,y:0},1) && pA.m.length===1);
  ok('se monta por el agujero que está sobre el eje', pA.m[0].h===0 && pA.m[0].s===vv.id);
  ok('montar no la ha movido', Math.abs(vv.a-0.3)<1e-12 && D(holeW(vv,0),{x:0,y:0})<1e-9);
  ok('una tira montada la reconoce el solver como suelo suyo',
     mountedSet().has(vv.id) && groundSet().has(vv.id));
  ok('y su pivote es el eje de la polea', pivotOf(vv).i===0 &&
     D(pivotOf(vv).p,{x:0,y:0})<1e-9);
  ok('no se monta dos veces la misma tira', mountAt({x:0,y:0},1)===null && pA.m.length===1);
  turnPulleys(pA,0.5);
  ok('al girar la polea, la tira gira lo mismo', Math.abs(vv.a-0.8)<1e-9, gr(vv.a).toFixed(4)+'°');
  ok('y su agujero no se despega del eje', D(holeW(vv,0),{x:0,y:0})<1e-9);
  ok('la tira no se estira al girar', Math.abs(D(holeW(vv,0),holeW(vv,8))-4*U)<1e-9);
  var aB0=pB.a;
  ok('sin correa, la otra polea no se entera', Math.abs(pB.a-aB0)<1e-12 && pB.a===0);
  var corr=beltAdd(pA,pB);
  ok('la correa une las dos poleas', !!corr && belts.length===1);
  ok('no se pone dos veces la misma correa', beltAdd(pB,pA)===null && belts.length===1);
  ok('con correa, las dos poleas son un solo grupo', pulleyGroup(pA).length===2);
  var a1=pA.a, a2=pB.a;
  turnPulleys(pA,0.4);
  ok('la correa hace girar a las dos el mismo ángulo y en el mismo sentido',
     Math.abs((pA.a-a1)-0.4)<1e-12 && Math.abs((pB.a-a2)-0.4)<1e-12);

  /* girar la tira y girar la polea son dos cosas distintas */
  var aPol=pA.a, aTira=vv.a, aOtra=pB.a, offAntes=pA.m[0].off;
  ok('girar la tira montada no mueve su polea ni la solidaria',
     turnMountedStrip(vv.id,0.25)===true &&
     pA.a===aPol && pB.a===aOtra, gr(pA.a-aPol).toFixed(6)+'°');
  ok('pero la tira sí ha girado, y su calaje ha cambiado',
     Math.abs(vv.a-(aTira+0.25))<1e-12 && Math.abs(pA.m[0].off-(offAntes+0.25))<1e-12);
  ok('y sigue enganchada al eje', D(holeW(vv,0),{x:pA.x,y:pA.y})<1e-9);
  var vv2=addStrip('R2',pB.x,pB.y,0);
  mountAt({x:pB.x,y:pB.y},1);
  ok('hay una tira montada en cada polea', pA.m.length===1 && pB.m.length===1);
  var c1=vv.a, c2=vv2.a;
  turnPulleys(pA,0.3);
  ok('girar la polea sí arrastra las dos tiras, cada una en su polea',
     Math.abs((vv.a-c1)-0.3)<1e-12 && Math.abs((vv2.a-c2)-0.3)<1e-12);
  var d1=vv.a, d2=vv2.a;
  turnMountedStrip(vv.id,0.2);
  ok('y girar una de las tiras deja a la otra donde estaba',
     Math.abs((vv.a-d1)-0.2)<1e-12 && vv2.a===d2);
  ok('el ángulo entre las dos varillas solo lo cambia girar una de ellas',
     Math.abs(((vv.a-vv2.a)-(d1-d2))-0.2)<1e-12);
  removeStrip(vv2.id);
  var ejeAntes={x:pA.x,y:pA.y}, calaje=pA.m[0].off, angAntes=vv.a;
  movePulley(pA,30,-20);
  ok('mover la polea se lleva la tira montada, sin girarla',
     D(holeW(vv,0),{x:ejeAntes.x+30, y:ejeAntes.y-20})<1e-9 &&
     Math.abs(vv.a-angAntes)<1e-12 && Math.abs(vv.a-(pA.a+calaje))<1e-9);
  ok('quitar la polea se lleva sus correas y suelta la tira',
     (pulleyRemove(pA), pulleys.length===1 && belts.length===0 && mountOf(vv.id)===null));

  /* --- el cruce de dos tiras ---------------------------------------------- */
  reset();
  var x1=addStrip('R3',0,0,0), x2=addStrip('R3',2*U,-2*U,Math.PI/2);
  ok('el cruce de dos tiras perpendiculares sale donde debe',
     D(crossOf(x1.id,x2.id),{x:2*U,y:0})<1e-9);
  var x3=addStrip('R3',0,2*U,0);
  ok('dos tiras paralelas no tienen cruce', crossOf(x1.id,x3.id)===null);
  var x4=addStrip('R1',3.5*U,-3*U,Math.PI/2);
  ok('si se cortan fuera de las tiras, no hay cruce', crossOf(x1.id,x4.id)===null);
  ok('se localiza el cruce para poner ahí el rotulador',
     (view.z=1, !!crossAt({x:2*U+3,y:2},14)));
  ok('y no se coge un cruce que queda lejos', crossAt({x:2*U+120,y:90},14)===null);

  /* --- el ángulo en un cruce sin encuadernador ---------------------------- */
  reset();
  var g1a=addStrip('R3',0,0,0), g1b=addStrip('R3',2*U,-2*U,Math.PI/3);
  var qc=crossOf(g1a.id,g1b.id);
  ok('dos tiras cruzadas sin nada que las una tienen su punto de cruce', !!qc);
  function angCruce(sA,sB){
    var q2=crossOf(sA.id,sB.id); if(!q2) return null;
    var r1=rayFrom(sA,q2), r2=rayFrom(sB,q2);
    var dd=((r2.ang-r1.ang)*180/Math.PI)%360; if(dd<0)dd+=360;
    return dd>180?360-dd:dd;
  }
  ok('sueltas, el ángulo del cruce se mide por el lado largo de cada una',
     Math.abs(angCruce(g1a,g1b)-60)<1e-9, angCruce(g1a,g1b).toFixed(4)+'°');
  // con las tiras sujetas, el rayo mira hacia donde están sujetas
  reset();
  var hP=pulleyAdd(0,0), hQ=pulleyAdd(4*U,0);
  var hA=addStrip('R3',0,0,30*Math.PI/180), hB=addStrip('R3',4*U,0,120*Math.PI/180);
  mountAt({x:0,y:0},1); mountAt({x:4*U,y:0},1);
  ok('montadas en las poleas, el ángulo del cruce es el que se ve desde los ejes',
     Math.abs(angCruce(hA,hB)-90)<1e-9, angCruce(hA,hB).toFixed(6)+'°');
  /* El cruce pasa por el punto medio de una varilla; sin la regla del anclaje se
     saltaría al ángulo suplementario justo ahí, y el número daría un tumbo. */
  var vistos=[];
  beltAdd(hP,hQ);
  for(var ac=0; ac<40; ac++){ turnPulleys(hP,1*Math.PI/180); vistos.push(angCruce(hA,hB)); }
  ok('y no se cambia por el suplementario mientras el cruce recorre las tiras',
     vistos.every(function(g4){ return g4!==null && Math.abs(g4-90)<1e-6; }),
     Math.min.apply(null,vistos).toFixed(3)+'° … '+Math.max.apply(null,vistos).toFixed(3)+'°');
  ok('el cruce ha pasado de un lado al otro del centro de una varilla',
     (function(){
       var q3=crossOf(hA.id,hB.id);
       var t=(q3.x-hA.x)*Math.cos(hA.a)+(q3.y-hA.y)*Math.sin(hA.a);
       return t<2*U;                       // ha cruzado el punto medio de la R3
     })());
  // si están unidas por un encuadernador, el ángulo lo pone el encuadernador
  reset();
  var j1=addStrip('R2',0,0,0), j2=addStrip('R2',0,0,Math.PI/4);
  joinAt(holeW(j1,0),1);
  ok('donde hay encuadernador no se dibuja además el ángulo del cruce',
     pins.length===1 && pinnedHere(j1.id,j2.id,pinPos(pins[0]))===true);
  ok('y donde no lo hay, sí', pinnedHere(j1.id,j2.id,{x:5*U,y:5*U})===false);

  /* --- el modelo de Puig Adam para el arco capaz ---------------------------
     Dos varillas que giran alrededor de P y Q, con la correa obligando a las dos
     a girar lo mismo. El ángulo que forman no cambia, y su cruce describe el arco
     capaz de ese ángulo sobre PQ. Se monta con 90° porque entonces la respuesta
     es exacta y de las que se reconocen: el arco capaz de 90° sobre PQ es la
     circunferencia de diámetro PQ, que es el teorema de Tales.                */
  reset();
  var dPQ=4*U, f1=30*Math.PI/180, f2=120*Math.PI/180;   // f2-f1 = 90°
  var polP=pulleyAdd(0,0), polQ=pulleyAdd(dPQ,0);
  var vP=addStrip('R3',0,0,f1), vQ=addStrip('R3',dPQ,0,f2);
  mountAt({x:0,y:0},1); mountAt({x:dPQ,y:0},1);
  ok('cada varilla está montada en su polea',
     polP.m.length===1 && polP.m[0].s===vP.id && polQ.m.length===1 && polQ.m[0].s===vQ.id);
  beltAdd(polP,polQ);
  var Bini=crossOf(vP.id,vQ.id);
  ok('las dos varillas se cruzan dentro de las tiras', !!Bini);
  function angEnB(){
    var B=crossOf(vP.id,vQ.id); if(!B) return null;
    var u1=Math.atan2(-B.y, -B.x);                       // de B hacia P
    var u2=Math.atan2(-B.y, dPQ-B.x);                    // de B hacia Q
    var g2=Math.abs(gr(u2-u1))%360; if(g2>180) g2=360-g2;
    return g2;
  }
  ok('el ángulo en el cruce arranca valiendo 90°', Math.abs(angEnB()-90)<1e-9, angEnB().toFixed(6)+'°');
  penAddCross(vP.id,vQ.id,'#0a7d55');
  ok('el rotulador se pone en el cruce, no en un agujero',
     pens.length===1 && !!pens[0].q && pens[0].s===undefined);
  var centroT={x:dPQ/2, y:0}, radioT=dPQ/2;              // circunferencia de diámetro PQ
  var angulos=[];
  penDown();
  for(var pa=0; pa<40; pa++){ turnPulleys(polP, 1*Math.PI/180); penSample(); angulos.push(angEnB()); }
  penUp();
  ok('las dos poleas han girado lo mismo', Math.abs(polP.a-polQ.a)<1e-12,
     gr(polP.a).toFixed(3)+'° / '+gr(polQ.a).toFixed(3)+'°');
  ok('las dos varillas han girado lo mismo', Math.abs((vP.a-f1)-(vQ.a-f2))<1e-12);
  ok('y por eso el ángulo del cruce no ha cambiado en todo el recorrido',
     angulos.every(function(g2){ return g2!==null && Math.abs(g2-90)<1e-6; }),
     Math.max.apply(null,angulos.map(function(g2){return Math.abs(g2-90);})).toExponential(1)+'°');
  var AR=trace.length?trace[0].p:[];
  ok('el rotulador del cruce ha dejado un trazo', trace.length===1 && AR.length===41,
     trace.length+' / '+AR.length);
  ok('y el trazo es el arco capaz de 90°: la circunferencia de diámetro PQ',
     AR.length>0 && AR.every(function(q){ return Math.abs(D(q,centroT)-radioT)<1e-6; }),
     AR.length? Math.max.apply(null,AR.map(function(q){return Math.abs(D(q,centroT)-radioT);})).toExponential(1):'-');
  ok('el cruce ha recorrido de verdad un arco, no se ha quedado quieto',
     AR.length>2 && D(AR[0],AR[AR.length-1])>0.5*U, AR.length>2? (D(AR[0],AR[AR.length-1])/U).toFixed(3)+' u':'-');
  ok('el arco recorrido mide el doble que el giro, por el ángulo central',
     AR.length>2 && Math.abs(gr(2*Math.asin(D(AR[0],AR[AR.length-1])/(2*radioT)))-80)<1e-3,
     AR.length>2? gr(2*Math.asin(D(AR[0],AR[AR.length-1])/(2*radioT))).toFixed(4)+'°':'-');

  /* Sin correa se rompe el invariante: es la correa, y no las varillas, la que
     hace el arco capaz. Se monta otra vez desde el principio para partir de una
     posición cómoda, con el cruce bien dentro de las dos tiras. */
  reset();
  var qP=pulleyAdd(0,0), qQ=pulleyAdd(dPQ,0);
  var wP=addStrip('R3',0,0,f1), wQ=addStrip('R3',dPQ,0,f2);
  mountAt({x:0,y:0},1); mountAt({x:dPQ,y:0},1);
  function angSuelto(){
    var B=crossOf(wP.id,wQ.id); if(!B) return null;
    var u1=Math.atan2(-B.y,-B.x), u2=Math.atan2(-B.y,dPQ-B.x);
    var g3=Math.abs(gr(u2-u1))%360; if(g3>180) g3=360-g3;
    return g3;
  }
  ok('sin correa también se arranca con 90°', Math.abs(angSuelto()-90)<1e-9);
  ok('sin correa, girar una polea no mueve la otra',
     (turnPulleys(qP,15*Math.PI/180), Math.abs(qQ.a)<1e-12 && Math.abs(wQ.a-f2)<1e-12));
  ok('y entonces el ángulo del cruce ya no se conserva: la correa es lo que lo sujeta',
     angSuelto()!==null && Math.abs(angSuelto()-90)>10,
     angSuelto()===null? 'el cruce se ha salido de las tiras' : angSuelto().toFixed(3)+'°');

  /* --- el rotulador ------------------------------------------------------
     Lo que hay que comprobar es que la punta sigue exactamente al agujero:
     si eso se cumple, la curva que salga será la que tenga que salir.        */
  reset();
  var t1=addStrip('R3',0,0,0);
  ok('el rotulador se engancha a un agujero', !!penAdd(t1.id,8,'#0a7d55') && pens.length===1);
  ok('no se pueden poner dos rotuladores en el mismo agujero',
     penAdd(t1.id,8,'#0a7d55')===null && pens.length===1);
  ok('sí se puede poner otro en un agujero distinto',
     !!penAdd(t1.id,0,'#d0322f') && pens.length===2, pens.length);
  penRemove(pens[1]);
  ok('quitar un rotulador no toca a los demás', pens.length===1 && pens[0].h===8);

  // sin mover nada, no debe quedar trazo: un clic no es un dibujo
  penDown(); penSample(); penUp();
  ok('si no se mueve la construcción, el rotulador no deja trazo', trace.length===0, trace.length);

  // giro completo alrededor del extremo opuesto: la punta va a radio constante
  var pivR=holeW(t1,0), radio=4*U;
  penDown();
  for(var kk=0; kk<72; kk++){ rotateGroup(new Set([t1.id]), pivR, 5*Math.PI/180); penSample(); }
  penUp();
  ok('el giro deja un único trazo', trace.length===1, trace.length);
  var TR=trace[0]?trace[0].p:[];
  ok('el trazo tiene un punto por cada paso del giro', TR.length===73, TR.length);
  ok('todos los puntos del trazo están a la misma distancia del pivote',
     TR.every(function(q){ return Math.abs(D(q,pivR)-radio)<1e-6; }),
     TR.length? (Math.max.apply(null,TR.map(function(q){return Math.abs(D(q,pivR)-radio);}))).toExponential(1):'-');
  ok('y esa distancia es la longitud de la tira, 4 u',
     TR.length? Math.abs(D(TR[0],pivR)/U-4)<1e-9 : false, TR.length? (D(TR[0],pivR)/U).toFixed(6):'-');
  ok('tras la vuelta entera el trazo se cierra sobre sí mismo',
     TR.length>2 && D(TR[0],TR[TR.length-1])<1e-6, TR.length>2? D(TR[0],TR[TR.length-1]).toExponential(1):'-');
  ok('el trazo guarda el color del rotulador que lo hizo', trace[0].col==='#0a7d55', trace[0].col);
  ok('quitar el rotulador no borra lo ya trazado',
     (penRemove(pens[0]), pens.length===0 && trace.length===1));
  ok('quitar la tira tampoco borra el trazo',
     (removeStrip(t1.id), strips.length===0 && trace.length===1));
  reset();
  var qt=addStrip('R2',0,0,0); nailAdd(qt.id,0); penAdd(qt.id,2,'#d0322f');
  removeStrip(qt.id);
  ok('quitar una tira se lleva sus clavos y sus rotuladores',
     nails.length===0 && pens.length===0, nails.length+' / '+pens.length);

  // dos tiras unidas por el centro: la de fuera gira y la otra se queda quieta
  reset();
  var ej=addStrip('R3',0,0,0), gi=addStrip('R2',2*U,-U,Math.PI/2);
  var pc=joinAt(holeW(ej,4),1);
  ok('las dos tiras quedan unidas por sus centros', !!pc && pc.m.length===2);
  penAdd(gi.id,0,'#2f62a8');
  var pivC=pinPos(pc), ejA={x:ej.x,y:ej.y,a:ej.a};
  penDown();
  for(var mm=0; mm<36; mm++){ rotateGroup(new Set([gi.id]), pivC, 10*Math.PI/180); penSample(); }
  penUp();
  ok('la tira del eje no se ha movido',
     D({x:ej.x,y:ej.y},ejA)<1e-9 && Math.abs(ej.a-ejA.a)<1e-12,
     D({x:ej.x,y:ej.y},ejA).toExponential(1));
  ok('la punta del rotulador se mantiene a 1 u del encuadernador',
     trace.length===1 && trace[0].p.every(function(q){ return Math.abs(D(q,pivC)/U-1)<1e-6; }),
     trace.length? (D(trace[0].p[0],pivC)/U).toFixed(6):'-');
  ok('la unión sigue cerrada después de la vuelta', maxResidual()<1e-6, maxResidual().toExponential(1));

  // un rotulador en una tira que solo se traslada deja un segmento recto
  reset();
  var rec=addStrip('R2',0,0,0.7); penAdd(rec.id,1,'#d0322f');
  penDown();
  for(var nn=0; nn<20; nn++){ translate([rec.id],5,3); penSample(); }
  penUp();
  var SG=trace[0].p;
  ok('trasladar la tira deja un trazo recto',
     SG.every(function(q,i){ return i<2 || Math.abs(distSeg(q,SG[0],SG[SG.length-1]))<1e-9; }));
  ok('el trazo mide lo que se ha trasladado la tira',
     Math.abs(D(SG[0],SG[SG.length-1])-20*Math.hypot(5,3))<1e-9,
     D(SG[0],SG[SG.length-1]).toFixed(4));

  // localizar rotulador y trazo para poder borrarlos
  reset();
  var loc=addStrip('R2',0,0,0); penAdd(loc.id,0,'#d0322f');
  view.z=1;
  ok('se localiza el rotulador para quitarlo', penAt(holeW(loc,0))===pens[0]);
  ok('y no se coge por error uno que está lejos', penAt({x:400,y:400})===null);
  trace.push({id:nid++, col:'#d0322f', p:[{x:0,y:200},{x:200,y:200}]});
  ok('se localiza un trazo para borrarlo', traceAt({x:100,y:201})===trace[0]);
  ok('y no se coge un trazo que pasa lejos', traceAt({x:100,y:260})===null);

  /* --- guardar y volver a abrir ------------------------------------------ */
  reset();
  var g1=addStrip('R3',0,0,0), g2=addStrip('R2',2*U,-U,Math.PI/2), g3=addStrip('P',5*U,0,0.3);
  joinAt(holeW(g1,4),1);
  cords.push({id:nid++, closed:true, col:'#d0322f',
              n:[{s:g1.id,h:0},{s:g2.id,h:0},{s:g1.id,h:8},{s:g2.id,h:2}]});
  penAdd(g2.id,0,'#0a7d55');
  nailAdd(g1.id,0);
  var antesK=nails[0].x.toFixed(3)+','+nails[0].y.toFixed(3);
  trace.push({id:nid++, col:'#0a7d55',
              p:[{x:-U,y:-U},{x:0,y:-1.5*U},{x:U,y:-U}]});
  var antesT=trace[0].p.map(function(q){return q.x.toFixed(3)+','+q.y.toFixed(3);}).join(' ');
  var antesP=strips.map(function(s){ return s.t+'@'+s.x.toFixed(4)+','+s.y.toFixed(4)+','+s.a.toFixed(6); }).join(' | ');
  var antesV=[holeW(g1,0),holeW(g2,0),holeW(g1,8),holeW(g2,2)].map(function(p){return p.x.toFixed(3)+','+p.y.toFixed(3);}).join(' ');
  var json=JSON.parse(JSON.stringify(serializar()));
  ok('el archivo guarda las tres piezas, el encuadernador y la goma',
     json.piezas.length===3 && json.encuadernadores.length===1 && json.gomas.length===1);
  ok('el archivo guarda también el rotulador, el clavo y el trazo',
     json.rotuladores.length===1 && json.clavos.length===1 && json.trazos.length===1 &&
     json.trazos[0].p.length===3);
  ok('las coordenadas se guardan en unidades, no en píxeles', Math.abs(json.piezas[1].x-2)<1e-6, json.piezas[1].x);
  importMode='replace'; loadData(json);
  ok('abrir devuelve las mismas piezas en la misma posición',
     strips.map(function(s){ return s.t+'@'+s.x.toFixed(4)+','+s.y.toFixed(4)+','+s.a.toFixed(6); }).join(' | ')===antesP);
  ok('abrir devuelve el encuadernador y la goma',
     pins.length===1 && pins[0].m.length===2 && cords.length===1 && cords[0].n.length===4 && cords[0].closed===true);
  ok('la goma vuelve a pasar por los mismos vértices',
     [holeW(strips[0],0),holeW(strips[1],0),holeW(strips[0],8),holeW(strips[1],2)]
       .map(function(p){return p.x.toFixed(3)+','+p.y.toFixed(3);}).join(' ')===antesV);
  ok('el fijador también se recupera', strips.some(function(s){return s.t==='P';}));
  ok('el rotulador vuelve al mismo agujero de la misma tira',
     pens.length===1 && pens[0].s===strips[1].id && pens[0].h===0 && pens[0].col==='#0a7d55');
  ok('el clavo vuelve al mismo agujero y al mismo punto del suelo',
     nails.length===1 && nails[0].s===strips[0].id && nails[0].h===0 &&
     nails[0].x.toFixed(3)+','+nails[0].y.toFixed(3)===antesK);
  ok('el trazo vuelve con los mismos puntos y el mismo color',
     trace.length===1 && trace[0].col==='#0a7d55' &&
     trace[0].p.map(function(q){return q.x.toFixed(3)+','+q.y.toFixed(3);}).join(' ')===antesT);
  ok('la unión cargada está cerrada', maxResidual()<1e-6, maxResidual().toFixed(7));
  var nAntes=strips.length;
  importMode='add'; loadData(json);
  ok('el botón ＋ añade sin borrar lo anterior', strips.length===nAntes*2, strips.length);
  ok('lo añadido no se solapa con lo que ya había',
     bboxOf(strips.slice(nAntes)).y0 > bboxOf(strips.slice(0,nAntes)).y1 - 1);
  ok('los encuadernadores añadidos apuntan a las piezas nuevas', pins.length===2 && maxResidual()<1e-6);
  ok('el ＋ también duplica rotulador, clavo y trazo',
     pens.length===2 && nails.length===2 && trace.length===2,
     pens.length+' / '+nails.length+' / '+trace.length);
  ok('el clavo añadido baja con su tira y sigue sujetándola',
     nails[1].y>nails[0].y && D(holeW(byId(nails[1].s),nails[1].h),{x:nails[1].x,y:nails[1].y})<1e-6);
  ok('el trazo añadido baja con sus piezas, no se queda encima del anterior',
     traceBBoxOf([trace[1]]).y0 > traceBBoxOf([trace[0]]).y1 - 1);
  importMode='replace';
  ok('un archivo con una tira inexistente se rechaza', deserializar({piezas:[{t:'ZZ',x:0,y:0,a:0}]})===null);
  ok('un archivo vacío se rechaza', deserializar({piezas:[]})===null);
  var sucio=deserializar({piezas:[{t:'R2',x:0,y:0,a:0}],
    rotuladores:[{n:[0,99]},{n:[5,0]},{color:'#123456',n:[0,1]}],
    clavos:[{n:[0,7]}, {n:[9,0]}, {n:[0,2],x:'?',y:0}, {n:[0,0],x:1,y:1}],
    trazos:[{p:[[0,0]]}, {p:[['x',2],[3,4],[5,6]]}, {p:[[1,1],[2,2]]}]});
  ok('un rotulador que apunta a un agujero o una tira que no existen se descarta',
     sucio.pens.length===1 && sucio.pens[0].h===1, sucio.pens.length);
  ok('un clavo con agujero o tira inexistentes se descarta',
     sucio.nails.length===2, sucio.nails.length);
  ok('y si sus coordenadas vienen ilegibles se clava donde está el agujero',
     Math.abs(sucio.nails[0].x-2*U)<1e-9 && Math.abs(sucio.nails[0].y)<1e-9,
     (sucio.nails[0].x/U).toFixed(3)+','+(sucio.nails[0].y/U).toFixed(3));
  ok('un trazo de un solo punto se descarta, y de los demás se tiran los puntos ilegibles',
     sucio.trace.length===2 && sucio.trace[0].p.length===2 &&
     Math.abs(sucio.trace[0].p[0].x-3*U)<1e-9, sucio.trace.length);

  reset(); view.z=1; draw();

  /* --- informe ----------------------------------------------------------- */
  var texto=out.join('\n')+'\n\n'+(fails? fails+' PRUEBAS FALLIDAS de '+out.length : 'LAS '+out.length+' PRUEBAS CORRECTAS');
  var box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;background:#fff;z-index:99;overflow:auto;padding:18px 22px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
  box.innerHTML='<div style="font:600 15px/1.3 -apple-system,Segoe UI,Roboto,sans-serif;margin-bottom:4px">'+
      'Autocomprobación de Geotiras</div>'+
    '<div style="font:13px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;color:'+(fails?'#c2410c':'#15803d')+';font-weight:600;margin-bottom:12px">'+
      (fails? fails+' pruebas fallidas de '+out.length : 'Las '+out.length+' pruebas correctas')+'</div>'+
    '<button id="cpTest" style="font:13px -apple-system,Segoe UI,Roboto,sans-serif;padding:6px 12px;margin-bottom:14px;'+
      'border:1px solid #d5d9e0;border-radius:7px;background:#fff;cursor:pointer">Copiar informe</button> '+
    '<button id="clTest" style="font:13px -apple-system,Segoe UI,Roboto,sans-serif;padding:6px 12px;margin-bottom:14px;'+
      'border:1px solid #d5d9e0;border-radius:7px;background:#fff;cursor:pointer">Cerrar y usar el manipulativo</button>'+
    '<pre style="white-space:pre-wrap;margin:0">'+
      out.map(function(l){ return l.indexOf('FALLO')===0
        ? '<span style="color:#c2410c;font-weight:700">'+l+'</span>' : l; }).join('\n')+'</pre>';
  document.body.appendChild(box);
  document.getElementById('cpTest').addEventListener('click',function(){
    var ta=document.createElement('textarea'); ta.value=texto; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); }catch(err){}
    document.body.removeChild(ta); this.textContent='Copiado ✓';
  });
  document.getElementById('clTest').addEventListener('click',function(){ box.remove(); });
}
var testLanzado=false;
function lanzarTest(){ if(testLanzado) return; testLanzado=true; runSelfTest(); }
if((location.hash||'').indexOf('test')>=0) setTimeout(lanzarTest,60);
window.addEventListener('hashchange',function(){
  if((location.hash||'').indexOf('test')>=0) lanzarTest();
});

/* API mínima de depuración (útil para pruebas automáticas) */
window.__geotiras={
  test:runSelfTest,
  strips:function(){return strips;}, pins:function(){return pins;}, cords:function(){return cords;},
  pens:function(){return pens;}, trace:function(){return trace;}, nails:function(){return nails;},
  add:addStrip, join:joinAt, rotate:rotateGroup, translate:translate,
  penAdd:penAdd, penRemove:penRemove, penDown:penDown, penSample:penSample, penUp:penUp,
  nailAdd:nailAdd, nailRemove:nailRemove, applyCorrAt:applyCorrAt, toWorld:toWorld, toLocal:toLocal,
  pulleys:function(){return pulleys;}, belts:function(){return belts;},
  pulleyAdd:pulleyAdd, pulleyRemove:pulleyRemove, mountAt:mountAt, unmount:unmount,
  beltAdd:beltAdd, turnPulleys:turnPulleys, movePulley:movePulley, mountOf:mountOf,
  penAddCross:penAddCross, crossOf:crossOf, crossAt:crossAt,
  turnMountedStrip:turnMountedStrip, rayFrom:rayFrom,
  holeW:holeW, holesOf:holesOf, lenOf:lenOf, dist:dist, pivotOf:pivotOf, byId:byId,
  relax:relax, residual:maxResidual,
  U:function(){return U;}, redraw:draw,
  reset:function(){strips=[];pins=[];cords=[];pens=[];trace=[];nails=[];
                   pulleys=[];belts=[];beltDraft=null;sel.clear();primary=null;}
};

})();
</script>
