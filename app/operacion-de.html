<body>

    <input type="text" id="aMano" placeholder="2/3 de 5/4"

<script>
"use strict";
(function(){

/* =========================================================================
   1. LA IDEA
   «2/3 de 5/4 u» tiene dos fracciones que no hacen lo mismo. 5/4 u es una
   cantidad de magnitud: la unidad partida en 4 partes iguales, y 5 de esas
   partes. 2/3 es un operador: actúa sobre esa cantidad, partiéndola a ella
   —no a la unidad— en 3 partes iguales y quedándose con 2.

   Aquí no hay pasos. Hay un tablero con piezas rectangulares y cuatro
   herramientas: partir una pieza en partes iguales (son marcas), cortar por
   las marcas, duplicar una pieza o una sola de sus partes, y unir las que
   están pegadas. 5/4 u es la unidad con un cuarto duplicado encima, unidos.

   Las restricciones que lo condicionan todo:
   · Una subunidad es el trocito más pequeño que dejan las rayas de una
     pieza: los cortes de ahora y las marcas que le quedan de antes. Es lo
     que se selecciona, se resalta, se duplica y se corta suelto. Cortar la
     pieza entera, en cambio, va por los cortes de ahora: 5/4 u partido en 3
     se deshace en tres tercios, cada uno con sus marcas dentro.
   · Las piezas son rectángulos con lados racionales, en unidades, y todo va
     en aritmética entera. Cortar una subunidad de en medio deja la pieza en
     varios rectángulos; unir solo vale si lo pegado forma un rectángulo.
   · Cada pieza recuerda de dónde viene con una cadena de fracciones, la
     última delante: [[2,3],[5,4]] es «2/3 de 5/4 u», y [] es la unidad.
     Una parte de n lleva [1,n] delante de la cadena de su pieza. Al unir se
     suman las cabezas si lo demás coincide (1/3 de X y 1/3 de X son 2/3 de
     X), y una pieza entera X junto a un trozo k/n de X cuenta como n/n.
     Cuando dos cadenas no casan, la pieza se queda sin rótulo: el programa
     no se inventa de dónde viene.
   · Lo que dice la cadena es siempre lo que mide el rectángulo. Se
     comprueba al abrir un archivo.

   · Una pieza se puede dejar en solo el borde: sin relleno ni etiquetas,
     dibujada por encima de las demás y cogible solo por el borde. Es para
     poner la unidad encima de otra pieza sin taparla ni estorbar al pinchar.

   Y una norma de la casa: no se escribe el signo de multiplicar en ningún
   sitio. La operación se llama «de».
   ========================================================================= */
var U=150;                 // el lado de la unidad, en píxeles de mundo
var MAXD=12;               // en cuántas columnas o filas se puede partir una pieza
var MAXLADO=4;             // ninguna pieza pasa de 4 unidades de lado
var MAXCADENA=4;           // «de» seguidos, como mucho
var MAXVECES=3;            // el enunciado: ni la cantidad ni el operador mayores que 3
var PEGA=0.75;             // dos bordes a menos de esto, en píxeles de mundo, están pegados

var TINTA='#2b2f36';
var FONT='-apple-system,Segoe UI,Roboto,sans-serif';
/* un color por largo de la cadena: la unidad, la cantidad, lo que deja el
   operador, y los que vengan detrás. El gris es para la pieza sin rótulo. */
var COLORES=[
  {f:'#f4ead6', b:'#c2ab7d', t:'#7a6634'},
  {f:'#c9dcf2', b:'#2f62a8', t:'#234a80'},
  {f:'#b5e08a', b:'#3f8f2f', t:'#2c6a20'},
  {f:'#dccbf0', b:'#7a4fb0', t:'#5b3890'},
  {f:'#f7d6ad', b:'#c06a1a', t:'#8f4c10'}
];
var GRIS={f:'#e4e7ec', b:'#6f7783', t:'#4a515c'};
function colorDe(s){
  if(!s.expr) return GRIS;
  return COLORES[Math.min(s.expr.length, COLORES.length-1)];
}

var NIVELES=[
  {n:'Fácil',   dens:[2,3,4],         maxC:1, maxO:1},
  {n:'Normal',  dens:[2,3,4,5,6],     maxC:2, maxO:1},
  {n:'Difícil', dens:[2,3,4,5,6,7,8], maxC:2, maxO:2}
];

/* =========================================================================
   2. ESTADO
   ========================================================================= */
var piezas=[], sel=null, selK=null, nid=1;
var modo='pieza';                  // 'pieza', 'sub' o 'res': qué hace un pinchazo
var enun={p:2,q:3,a:5,b:4};
var view={x:0,y:0,z:1};
var drag=null, undoStack=[], importMode='replace';
var opt={iman:1, rot:1, etiq:0, res:0, mano:0, alfa:0};

var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var stage=document.getElementById('stage');
var hintEl=document.getElementById('hint'), infoEl=document.getElementById('info');
var dropEl=document.getElementById('drop');
var flashMsg=null, flashT=0;

function w2s(p){ return {x:p.x*view.z+view.x, y:p.y*view.z+view.y}; }
function s2w(p){ return {x:(p.x-view.x)/view.z, y:(p.y-view.y)/view.z}; }
function flash(m){ flashMsg=m; flashT=Date.now(); draw(); setTimeout(draw,2600); }
function foto(){ return JSON.stringify({p:piezas, s:sel, k:selK, n:nid, e:enun}); }
function pushUndo(){
  undoStack.push(foto());
  if(undoStack.length>90) undoStack.shift();
}
function doUndo(){
  if(!undoStack.length){ flash('No hay nada que deshacer'); return; }
  var d=JSON.parse(undoStack.pop());
  piezas=d.p; sel=d.s; selK=d.k; nid=d.n||1; enun=d.e;
  draw();
}

/* =========================================================================
   3. FRACCIONES Y CADENAS
   ========================================================================= */
function mcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ var t=a%b; a=b; b=t; } return a; }
function mcm(a,b){ return a/mcd(a,b)*b; }
function reduce(p,q){ var d=mcd(p,q)||1; return {p:p/d, q:q/d}; }
function mismaFraccion(a,b){ return a.p*b.q===b.p*a.q; }
function entero(v,lo,hi){ return typeof v==='number' && isFinite(v) && v===Math.floor(v) && v>=lo && v<=hi; }

/* «2/3 de 5/4», sin simplificar nada: si alguien escribe 2/4, quiere 2/4 */
function leeEnunciado(txt){
  var s=String(txt===null||txt===undefined?'':txt).toLowerCase().replace(/\s+/g,' ').trim();
  var m=s.match(/^(\d+)(?: ?\/ ?(\d+))? de (\d+)(?: ?\/ ?(\d+))?(?: ?u)?$/);
  if(!m) return null;
  var e={p:+m[1], q:m[2]===undefined?1:+m[2], a:+m[3], b:m[4]===undefined?1:+m[4]};
  return enunciadoValido(e)? e : null;
}
function enunciadoValido(e){
  if(!e) return false;
  if(!entero(e.p,1,999) || !entero(e.q,1,MAXD) || !entero(e.a,1,999) || !entero(e.b,1,MAXD)) return false;
  return e.p<=MAXVECES*e.q && e.a<=MAXVECES*e.b;
}
function fraccionAlAzar(dens,max){
  for(var i=0;i<400;i++){
    var d=dens[Math.floor(Math.random()*dens.length)];
    var n=1+Math.floor(Math.random()*(max*d));
    if(n===d || mcd(n,d)!==1) continue;
    return {n:n, d:d};
  }
  return {n:1, d:2};
}
function enunciadoAlAzar(nivel){
  var N=NIVELES[nivel]||NIVELES[1];
  for(var i=0;i<200;i++){
    var o=fraccionAlAzar(N.dens,N.maxO), c=fraccionAlAzar(N.dens,N.maxC);
    var e={p:o.n, q:o.d, a:c.n, b:c.d};
    if(enun && e.p===enun.p && e.q===enun.q && e.a===enun.a && e.b===enun.b) continue;
    return e;
  }
  return {p:2,q:3,a:5,b:4};
}

function copiaCadena(C){ return C? C.map(function(f){ return [f[0],f[1]]; }) : null; }
function mismaCadena(A,B){
  if(A.length!==B.length) return false;
  for(var i=0;i<A.length;i++) if(A[i][0]!==B[i][0] || A[i][1]!==B[i][1]) return false;
  return true;
}
/* la cadena de k partes de las n en que está partida una pieza de cadena C */
function cadenaParte(C,k,n){
  if(!C) return null;
  return [[k,n]].concat(copiaCadena(C));
}
/* la cadena de dos piezas unidas, o null si no casan (ver la cabecera) */
function uneCadenas(A,B){
  if(!A || !B) return null;
  if(A.length===B.length){
    if(!A.length) return [[2,1]];                               // dos unidades
    if(!mismaCadena(A.slice(1),B.slice(1))) return null;
    var L=mcm(A[0][1],B[0][1]);
    return [[A[0][0]*L/A[0][1]+B[0][0]*L/B[0][1], L]].concat(copiaCadena(A.slice(1)));
  }
  var larga=A.length>B.length? A : B, corta=A.length>B.length? B : A;
  if(larga.length!==corta.length+1 || !mismaCadena(larga.slice(1),corta)) return null;
  return [[larga[0][0]+larga[0][1], larga[0][1]]].concat(copiaCadena(corta));   // la entera cuenta n/n
}

/* =========================================================================
   4. LAS PIEZAS
   Una pieza mide wn/wd por hn/hd unidades. a y b son las columnas y filas en
   que está partida ahora, y res las partes que tiene resaltadas. expr es su
   cadena, o null. tx y ty son las marcas
   que le quedan de cortes y uniones anteriores, en unidades y medidas desde
   la esquina de abajo a la izquierda: se dibujan y enganchan, no cuentan.
   Las partes se numeran por columnas, y dentro de cada una de abajo arriba.
   ========================================================================= */
function ancho(s){ return U*s.wn/s.wd; }
function alto(s){ return U*s.hn/s.hd; }
function nuevaUnidad(P){
  return {id:nid++, x:P.x, y:P.y, wn:1, wd:1, hn:1, hd:1, a:1, b:1, res:[], expr:[], tx:[], ty:[]};
}
function porId(id){
  for(var i=0;i<piezas.length;i++) if(piezas[i].id===id) return piezas[i];
  return null;
}
function seleccionada(){ return sel==null? null : porId(sel); }
function esUnidad(s){ return !!s.expr && s.expr.length===0; }
function areaDe(s){ return reduce(s.wn*s.hn, s.wd*s.hd); }
/* lo que mide la pieza, en unidades: tal como sale de la cadena, sin
   simplificar, y si no tiene cadena, lo que mide el rectángulo */
function valor(s){
  if(!s.expr){ var A=areaDe(s); return {n:A.p, d:A.q}; }
  var n=1, d=1;
  s.expr.forEach(function(f){ n*=f[0]; d*=f[1]; });
  return {n:n, d:d};
}
function celda(s,k){ return {col:Math.floor(k/s.b), fil:k%s.b}; }
function rect(s){ return {x0:s.x, y0:s.y, x1:s.x+ancho(s), y1:s.y+alto(s)}; }
function cajaPieza(s){
  var r=rect(s);
  return {x0:r.x0-(esUnidad(s)? 24 : 0), y0:r.y0, x1:r.x1, y1:r.y1+(opt.rot? (esUnidad(s)? 0 : 52)+(s.res.length? 40 : 0) : 0)};
}
function caja(lista){
  if(!lista.length) return null;
  var b={x0:1e9,y0:1e9,x1:-1e9,y1:-1e9};
  lista.forEach(function(s){
    var c=cajaPieza(s);
    b.x0=Math.min(b.x0,c.x0); b.x1=Math.max(b.x1,c.x1);
    b.y0=Math.min(b.y0,c.y0); b.y1=Math.max(b.y1,c.y1);
  });
  return b;
}
function marcasX(s){                      // en mundo
  var out=[], w=ancho(s), k;
  for(k=1;k<s.a;k++) out.push(s.x+w*k/s.a);
  s.tx.forEach(function(t){ out.push(s.x+t*U); });
  return out;
}
function marcasY(s){
  var out=[], h=alto(s), k;
  for(k=1;k<s.b;k++) out.push(s.y+h-h*k/s.b);
  s.ty.forEach(function(t){ out.push(s.y+h-t*U); });
  return out;
}
function puntosX(s){ return [s.x, s.x+ancho(s)].concat(marcasX(s)); }
function puntosY(s){ return [s.y, s.y+alto(s)].concat(marcasY(s)); }
/* ordena unas marcas, quita las repetidas y las que caen en el borde */
function ordenaMarcas(L,largo){
  var out=[];
  L.slice().sort(function(p,q){ return p-q; }).forEach(function(t){
    if(t<1e-6 || t>largo-1e-6) return;
    if(out.length && Math.abs(out[out.length-1]-t)<1e-6) return;
    out.push(t);
  });
  return out;
}

/* --- el imán --------------------------------------------------------------- */
function engancheEje(s,puntosDe){
  var lim=10/view.z, mios=puntosDe(s), mejor=null, dist=Infinity;
  piezas.forEach(function(o){
    if(o.id===s.id) return;
    puntosDe(o).forEach(function(b){
      mios.forEach(function(a){
        var d=b-a;
        if(Math.abs(d)<lim && Math.abs(d)<dist){ mejor=d; dist=Math.abs(d); }
      });
    });
  });
  return mejor;
}
function aplicaIman(s){
  if(!opt.iman || !s) return false;
  var dx=engancheEje(s,puntosX), dy=engancheEje(s,puntosY), algo=false;
  if(dx!==null){ s.x+=dx; algo=true; }
  if(dy!==null){ s.y+=dy; algo=true; }
  return algo;
}

/* =========================================================================
   5. ACCIONES
   ========================================================================= */
function parte(s,a,b){
  if(!s) return false;
  a=Math.max(1, Math.min(MAXD, Math.round(a)));
  b=Math.max(1, Math.min(MAXD, Math.round(b)));
  if(a===s.a && b===s.b) return false;
  pushUndo();
  s.a=a; s.b=b; s.res=[]; selK=null;     // otras partes: ni la subunidad elegida ni lo resaltado existen ya
  draw();
  return true;
}
/* el trozo de s que va de la columna c0 a la c1 y de la fila f0 a la f1 (sin
   incluir c1 ni f1; las filas, de abajo arriba), como pieza nueva partida en
   a por b. No toca el tablero. */
function trozo(s,c0,c1,f0,f1,a,b){
  var w=reduce(s.wn*(c1-c0), s.wd*s.a), h=reduce(s.hn*(f1-f0), s.hd*s.b);
  var W=s.wn/s.wd, H=s.hn/s.hd, ux=W*c0/s.a, uy=H*f0/s.b;
  return {id:nid++, x:s.x+U*ux, y:s.y+alto(s)-U*H*f1/s.b,
          wn:w.p, wd:w.q, hn:h.p, hd:h.q, a:a, b:b, res:[],
          expr:cadenaParte(s.expr, (c1-c0)*(f1-f0), s.a*s.b),
          tx:ordenaMarcas(s.tx.map(function(t){ return t-ux; }), w.p/w.q),
          ty:ordenaMarcas(s.ty.map(function(t){ return t-uy; }), h.p/h.q)};
}
function cadenaLlena(s){
  if(s.expr && s.expr.length>=MAXCADENA){ flash('Ya son muchos «de» seguidos'); return true; }
  return false;
}
/* el rectángulo de s que va de x0 a x1 y de y0 a y1 (en unidades, desde abajo
   a la izquierda), como pieza nueva sin partir, con las rayas que le caigan
   dentro. No toca el tablero. null si sus lados no salen racionales. */
function todasLasRayas(s){
  var W=s.wn/s.wd, H=s.hn/s.hd, xs=s.tx.slice(), ys=s.ty.slice(), k;
  for(k=1;k<s.a;k++) xs.push(W*k/s.a);
  for(k=1;k<s.b;k++) ys.push(H*k/s.b);
  return {xs:ordenaMarcas(xs,W), ys:ordenaMarcas(ys,H), W:W, H:H};
}
function recorte(s,x0,x1,y0,y1){
  var w=fraccionDe(x1-x0), h=fraccionDe(y1-y0), R=todasLasRayas(s);
  if(!w || !h) return null;
  return {id:nid++, x:s.x+U*x0, y:s.y+alto(s)-U*y1, wn:w.n, wd:w.d, hn:h.n, hd:h.d, a:1, b:1, res:[],
          expr:cadenaRecorte(s,x0,x1,y0,y1),
          tx:ordenaMarcas(R.xs.map(function(t){ return t-x0; }), x1-x0),
          ty:ordenaMarcas(R.ys.map(function(t){ return t-y0; }), y1-y0)};
}
/* la cadena de un recorte: tantas subunidades de las que tiene la pieza, si
   son todas iguales; si no, la fracción de la pieza que ocupa */
function sonIguales(T){
  return T.every(function(q){ return q.txt && q.txt===T[0].txt; });
}
function cadenaRecorte(s,x0,x1,y0,y1){
  if(!s.expr) return null;
  var T=trocitos(s), dentro=0;
  T.forEach(function(q){
    var cx=(q.x0+q.x1)/2, cy=(q.y0+q.y1)/2;
    if(cx>x0 && cx<x1 && cy>y0 && cy<y1) dentro++;
  });
  if(sonIguales(T)) return cadenaParte(s.expr, dentro, T.length);
  var f=fraccionDe((x1-x0)*(y1-y0)/((s.wn/s.wd)*(s.hn/s.hd)));
  return f? cadenaParte(s.expr, f.n, f.d) : null;
}
function duplica(s,k){
  if(!s) return null;
  var t, T=trocitos(s);
  if(k===null || k===undefined || T.length<2){
    pushUndo();
    t=JSON.parse(JSON.stringify(s)); t.id=nid++;
  } else {
    if(cadenaLlena(s) || !T[k]) return null;
    t=recorte(s, T[k].x0, T[k].x1, T[k].y0, T[k].y1);
    if(!t) return null;
    pushUndo();
  }
  t.x+=18; t.y+=18;
  piezas.push(t); sel=t.id; selK=null;
  draw();
  return t;
}
/* Cortar. Con una subunidad elegida, la separa y deja lo demás en los
   rectángulos que queden: lo de su izquierda, lo de su derecha, y lo de debajo
   y lo de encima en su misma franja. Con la pieza entera, la deshace en las
   partes en que está partida ahora. Devuelve las piezas nuevas. */
function corta(s,k){
  if(!s) return null;
  var nuevas=[], i, j, t, entera=(k===null || k===undefined);
  if(entera){
    if(s.a*s.b<2){ flash('Se corta por las marcas: primero parte la pieza'); return null; }
    if(cadenaLlena(s)) return null;
    pushUndo();
    for(i=0;i<s.a;i++) for(j=0;j<s.b;j++){
      t=trozo(s,i,i+1,j,j+1,1,1);
      t.x+=i*10; t.y-=j*10;              // un poco separadas, para que se vea el corte
      nuevas.push(t);
    }
    sel=nuevas[0].id;
  } else {
    var T=trocitos(s), q=T[k], R=todasLasRayas(s);
    if(!q || T.length<2){ flash('Esa pieza no tiene subunidades que cortar'); return null; }
    if(cadenaLlena(s)) return null;
    var L=[[0,q.x0,0,R.H,0,0], [q.x1,R.W,0,R.H,20,0], [q.x0,q.x1,0,q.y0,0,0],
           [q.x0,q.x1,q.y1,R.H,10,-20], [q.x0,q.x1,q.y0,q.y1,10,-10]];
    for(i=0;i<L.length;i++){
      if(L[i][1]-L[i][0]<1e-9 || L[i][3]-L[i][2]<1e-9) continue;
      t=recorte(s,L[i][0],L[i][1],L[i][2],L[i][3]);
      if(!t){ flash('Por ahí no sé cortar'); return null; }
      t.x+=L[i][4]; t.y+=L[i][5];
      nuevas.push(t);
    }
    pushUndo();
    sel=nuevas[nuevas.length-1].id;
  }
  piezas=piezas.filter(function(o){ return o.id!==s.id; }).concat(nuevas);
  selK=null;
  draw();
  return nuevas;
}
/* --- unir -------------------------------------------------------------------- */
function seTocan(A,B){
  var solX=Math.min(A.x1,B.x1)-Math.max(A.x0,B.x0), solY=Math.min(A.y1,B.y1)-Math.max(A.y0,B.y0);
  var ladoV=(Math.abs(A.x1-B.x0)<PEGA || Math.abs(B.x1-A.x0)<PEGA) && solY>PEGA;
  var ladoH=(Math.abs(A.y1-B.y0)<PEGA || Math.abs(B.y1-A.y0)<PEGA) && solX>PEGA;
  return ladoV || ladoH;
}
function pegadasA(s){
  var grupo=[s], cola=[s];
  while(cola.length){
    var p=cola.pop();
    piezas.forEach(function(o){
      if(grupo.indexOf(o)>=0 || !seTocan(rect(p),rect(o))) return;
      grupo.push(o); cola.push(o);
    });
  }
  return grupo;
}
/* dos trozos se funden si comparten un lado entero; el resultado, o null */
function funde(A,B){
  var ancA=U*A.wn/A.wd, altA=U*A.hn/A.hd, ancB=U*B.wn/B.wd, altB=U*B.hn/B.hd, r, primero;
  if(A.wn*B.wd===B.wn*A.wd && Math.abs(A.x-B.x)<PEGA &&
     (Math.abs(A.y+altA-B.y)<PEGA || Math.abs(B.y+altB-A.y)<PEGA)){
    primero=A.y<B.y? A : B;
    r=reduce(A.hn*B.hd+B.hn*A.hd, A.hd*B.hd);
    return {x:primero.x, y:primero.y, wn:A.wn, wd:A.wd, hn:r.p, hd:r.q,
            expr:uneCadenas(A.expr,B.expr), mx:A.mx.concat(B.mx),
            my:A.my.concat(B.my).concat([primero.y+U*primero.hn/primero.hd])};
  }
  if(A.hn*B.hd===B.hn*A.hd && Math.abs(A.y-B.y)<PEGA &&
     (Math.abs(A.x+ancA-B.x)<PEGA || Math.abs(B.x+ancB-A.x)<PEGA)){
    primero=A.x<B.x? A : B;
    r=reduce(A.wn*B.wd+B.wn*A.wd, A.wd*B.wd);
    return {x:primero.x, y:primero.y, wn:r.p, wd:r.q, hn:A.hn, hd:A.hd,
            expr:uneCadenas(A.expr,B.expr), my:A.my.concat(B.my),
            mx:A.mx.concat(B.mx).concat([primero.x+U*primero.wn/primero.wd])};
  }
  return null;
}
function une(s){
  if(!s) return null;
  var grupo=pegadasA(s);
  if(grupo.length<2){ flash('No tiene ninguna pieza pegada: acércale otra hasta que el imán la enganche'); return null; }
  var L=grupo.map(function(o){
    return {x:o.x, y:o.y, wn:o.wn, wd:o.wd, hn:o.hn, hd:o.hd, expr:copiaCadena(o.expr),
            mx:marcasX(o), my:marcasY(o)};
  });
  /* la seleccionada, la primera: su cadena es la que manda al sumar */
  var hecho=true, i, j, F;
  while(L.length>1 && hecho){
    hecho=false;
    for(i=0;i<L.length && !hecho;i++) for(j=i+1;j<L.length && !hecho;j++){
      F=funde(L[i],L[j]);
      if(F){ L.splice(j,1); L[i]=F; hecho=true; }
    }
  }
  if(L.length>1){ flash('Esas piezas pegadas no forman un rectángulo'); return null; }
  F=L[0];
  if(F.wn/F.wd>MAXLADO || F.hn/F.hd>MAXLADO){ flash('Esa pieza sería enorme: no cabe en el tablero'); return null; }
  pushUndo();
  var H=U*F.hn/F.hd;
  var t={id:nid++, x:F.x, y:F.y, wn:F.wn, wd:F.wd, hn:F.hn, hd:F.hd, a:1, b:1, res:[], expr:F.expr,
         tx:ordenaMarcas(F.mx.map(function(m){ return (m-F.x)/U; }), F.wn/F.wd),
         ty:ordenaMarcas(F.my.map(function(m){ return (F.y+H-m)/U; }), F.hn/F.hd)};
  piezas=piezas.filter(function(o){ return grupo.indexOf(o)<0; }).concat([t]);
  sel=t.id; selK=null;
  draw();
  return t;
}
/* Resaltar no fabrica nada: señala, dentro de la pieza, unas partes de las
   que tiene. Con una subunidad elegida, la resalta o la deja de resaltar. */
function resalta(s,k){
  if(!s) return false;
  if(trocitos(s).length<2){ flash('Se resaltan subunidades: primero parte la pieza'); return false; }
  if(k===null || k===undefined){
    if(!s.res.length){ flash('Elige una subunidad con «Seleccionar subunidad» para resaltarla'); return false; }
    pushUndo(); s.res=[];                 // con la pieza entera, se quita todo lo resaltado
  } else {
    pushUndo();
    var i=s.res.indexOf(k);
    if(i>=0) s.res.splice(i,1); else{ s.res.push(k); s.res.sort(function(p,q){ return p-q; }); }
  }
  draw();
  return true;
}
/* En el modo de resaltar, pinchar en una subunidad la resalta o la deja de
   resaltar, y arrastrando se sigue haciendo lo mismo con las que se pisen.
   empiezaAResaltar devuelve lo que hay que ir haciendo (poner o quitar), o
   null si ahí no hay subunidad que resaltar. */
function ponResalte(s,k,poner){
  var i=s.res.indexOf(k);
  if(poner && i<0){ s.res.push(k); s.res.sort(function(p,q){ return p-q; }); return true; }
  if(!poner && i>=0){ s.res.splice(i,1); return true; }
  return false;
}
function empiezaAResaltar(P){
  var t=piezaEn(P);
  if(!t || t.hueca) return null;
  sel=t.id; selK=null;
  if(trocitos(t).length<2){ flash('Se resaltan subunidades: primero parte la pieza'); return null; }
  var k=parteEn(t,P);
  if(k<0) return null;
  pushUndo();
  var poner=t.res.indexOf(k)<0;
  ponResalte(t,k,poner);
  return {s:t, poner:poner};
}
function sigueResaltando(R,P){
  var k=parteEn(R.s,P);
  return k>=0 && ponResalte(R.s,k,R.poner);
}
function ahueca(s){
  if(!s) return false;
  pushUndo();
  s.hueca=s.hueca? 0 : 1;
  if(s.hueca) selK=null;
  draw();
  return true;
}
/* las de solo el borde, las últimas: se dibujan encima y se pinchan antes */
function enOrden(){
  return piezas.filter(function(o){ return !o.hueca; }).concat(piezas.filter(function(o){ return !!o.hueca; }));
}
function quita(s){
  if(!s) return false;
  pushUndo();
  piezas=piezas.filter(function(q){ return q.id!==s.id; });
  sel=null; selK=null; draw();
  return true;
}
function otraUnidad(){
  pushUndo();
  var b=caja(piezas);
  var t=nuevaUnidad(b? {x:b.x0+24, y:b.y1+40} : {x:0, y:0});
  piezas.push(t); sel=t.id; selK=null;
  if(!enPantalla(t)) fitView(); else draw();
  return t;
}
function tableroNuevo(){
  piezas=[nuevaUnidad({x:0,y:0})]; sel=piezas[0].id; selK=null;
}
function ponEnunciado(e){
  pushUndo();
  enun=e; tableroNuevo();
  fitView();
}
function ponModo(m){
  modo = (m==='sub' || m==='res')? m : 'pieza';
  if(modo!=='sub') selK=null;
  draw();
}

/* =========================================================================
   6. DIBUJO
   ========================================================================= */
/* --- las expresiones: fracciones apiladas, la palabra «de» y la u ----------- */
function toksPieza(s){
  var T=[], v;
  if(!s.expr){                         // sin rótulo: solo se dice lo que mide, y solo si se pide
    if(!opt.res) return T;
    v=valor(s);
    return [{n:v.n, d:v.d, col:TINTA}, {t:'u'}];
  }
  return toksCadena(s.expr, opt.res);
}
function toksCadena(C,conResultado){
  var T=[], n=C.length, vn=1, vd=1;
  C.forEach(function(f,i){
    if(i) T.push({t:'de'});
    T.push({n:f[0], d:f[1], col:COLORES[Math.min(n-i, COLORES.length-1)].b});
    vn*=f[0]; vd*=f[1];
  });
  T.push({t:'u'});
  /* lo que mide solo se escribe si se pide, y solo donde no está ya dicho */
  if(conResultado && n>1) T=T.concat([{t:'='}, {n:vn, d:vd, col:TINTA}, {t:'u'}]);
  return T;
}
/* El rótulo de lo resaltado. Si son partes enteras de las de ahora, tantas
   partes de las que tiene la pieza (2/3); si no, tantas subunidades de las
   que tiene, cuando son todas iguales (7/15); y si tampoco, la fracción de la
   pieza que ocupan. */
function toksResaltado(s){
  if(!s.res.length || !s.expr || s.expr.length>=MAXCADENA) return [];
  var T=trocitos(s), n=s.a*s.b, W=s.wn/s.wd, H=s.hn/s.hd, i, area=0;
  if(n>1){
    var hay=[], total=[], llenas=0, enteras=true;
    for(i=0;i<n;i++){ hay.push(0); total.push(0); }
    T.forEach(function(q,k){
      var col=Math.min(s.a-1, Math.floor((q.x0+q.x1)/2/(W/s.a)));
      var fil=Math.min(s.b-1, Math.floor((q.y0+q.y1)/2/(H/s.b)));
      total[col*s.b+fil]++;
      if(s.res.indexOf(k)>=0) hay[col*s.b+fil]++;
    });
    for(i=0;i<n;i++){
      if(hay[i]===total[i]) llenas++;
      else if(hay[i]>0) enteras=false;
    }
    if(enteras) return toksCadena(cadenaParte(s.expr, llenas, n), opt.res);
  }
  if(sonIguales(T)) return toksCadena(cadenaParte(s.expr, s.res.length, T.length), opt.res);
  s.res.forEach(function(k){ if(T[k]) area+=(T[k].x1-T[k].x0)*(T[k].y1-T[k].y0); });
  var f=fraccionDe(area/(W*H));
  return f? toksCadena(cadenaParte(s.expr, f.n, f.d), opt.res) : [];
}
/* Las etiquetas miden con la unidad. Todas las rayas de la pieza —los cortes
   de ahora y las marcas que le quedan de antes— la dejan en trocitos, y en
   cada uno se escribe lo que mide en unidades. Las marcas van en decimales,
   así que la fracción se recupera buscando el denominador más pequeño. */
function fraccionDe(v){
  for(var d=1;d<=5000;d++){
    var n=v*d;
    if(n>0.5 && Math.abs(n-Math.round(n))<1e-6*d) return {n:Math.round(n), d:d};
  }
  return null;
}
function trocitos(s){
  var W=s.wn/s.wd, H=s.hn/s.hd, xs=s.tx.slice(), ys=s.ty.slice(), k, i, j, out=[];
  for(k=1;k<s.a;k++) xs.push(W*k/s.a);
  for(k=1;k<s.b;k++) ys.push(H*k/s.b);
  xs=[0].concat(ordenaMarcas(xs,W)).concat([W]);
  ys=[0].concat(ordenaMarcas(ys,H)).concat([H]);
  for(i=0;i+1<xs.length;i++) for(j=0;j+1<ys.length;j++){
    var f=fraccionDe((xs[i+1]-xs[i])*(ys[j+1]-ys[j]));
    out.push({x0:xs[i], x1:xs[i+1], y0:ys[j], y1:ys[j+1],
              txt: f? (f.d===1? ''+f.n : f.n+'/'+f.d) : ''});
  }
  return out;
}
function colorResalte(s){
  return COLORES[Math.min((s.expr? s.expr.length : 1)+1, COLORES.length-1)];
}
function rayado(c,r,col){
  c.save();
  c.beginPath(); c.rect(r.x,r.y,r.w,r.h); c.clip();
  c.strokeStyle=col; c.globalAlpha=0.3; c.lineWidth=Math.max(1,1.2*view.z);
  var paso=Math.max(5,9*view.z), d;
  for(d=-r.h;d<r.w+r.h;d+=paso){
    linea(c, r.x+d, r.y, r.x+d+r.h, r.y+r.h);
    linea(c, r.x+d+r.h, r.y, r.x+d, r.y+r.h);
  }
  c.restore();
}
function toksEnunciado(){
  return [{n:enun.p, d:enun.q, col:COLORES[2].b}, {t:'de'}, {n:enun.a, d:enun.b, col:COLORES[1].b}, {t:'u'}];
}
function textoDe(T){
  return T.map(function(t){ return t.t!==undefined? t.t : (t.d===1? ''+t.n : t.n+'/'+t.d); }).join(' ');
}
function fuente(px,estilo){ return (estilo? estilo+' ' : '')+px+'px '+FONT; }
function anchoTok(c,t,px){
  if(t.t!==undefined){ c.font=fuente(px, t.t==='u'?'italic 600':''); return c.measureText(t.t).width; }
  if(t.d===1){ c.font=fuente(px,'600'); return c.measureText(''+t.n).width; }
  c.font=fuente(px*0.84,'600');
  return Math.max(c.measureText(''+t.n).width, c.measureText(''+t.d).width)+px*0.34;
}
function exprAncho(c,T,px){
  var w=0;
  for(var i=0;i<T.length;i++) w+=anchoTok(c,T[i],px)+(i? px*0.34 : 0);
  return w;
}
function dibExpr(c,T,x,y,px){
  c.save();
  c.textBaseline='middle';
  for(var i=0;i<T.length;i++){
    var t=T[i], w=anchoTok(c,t,px);
    if(i) x+=px*0.34;
    if(t.t!==undefined || t.d===1){
      c.textAlign='left';
      c.fillStyle=t.col||(t.t==='de'||t.t==='='? '#5a626e' : TINTA);
      c.fillText(t.t!==undefined? t.t : ''+t.n, x, y);
    } else {
      c.fillStyle=t.col||TINTA;
      c.textAlign='center';
      c.fillText(''+t.n, x+w/2, y-px*0.5);
      c.fillText(''+t.d, x+w/2, y+px*0.56);
      c.fillRect(x, y-Math.max(0.6,px*0.04), w, Math.max(1.2,px*0.08));
    }
    x+=w;
  }
  c.restore();
}
function linea(c,x0,y0,x1,y1){ c.beginPath(); c.moveTo(x0,y0); c.lineTo(x1,y1); c.stroke(); }
function ponEtiq(c,r,largo,corto,col){
  var px=Math.max(8, Math.min(13, 10.5*view.z));
  if(r.h<px+3) return;
  c.save();
  c.font=fuente(px); c.fillStyle=col; c.textAlign='center'; c.textBaseline='middle';

   En una raya, gana la de más arriba y más a la derecha. */
function parteEn(s,P){
  var w=ancho(s), h=alto(s);
  if(P.x<s.x || P.y<s.y || P.x>s.x+w || P.y>s.y+h) return -1;
  var ux=(P.x-s.x)/U, uy=(s.y+h-P.y)/U, T=trocitos(s), e=1e-9, k=-1;
  T.forEach(function(q,i){
    if(ux>=q.x0-e && ux<=q.x1+e && uy>=q.y0-e && uy<=q.y1+e) k=i;
  });
  return k;
}
function tocaBorde(s,P){
  var m=9/view.z, r=rect(s);
  if(P.x<r.x0-m || P.x>r.x1+m || P.y<r.y0-m || P.y>r.y1+m) return false;
  return P.x<r.x0+m || P.x>r.x1-m || P.y<r.y0+m || P.y>r.y1-m;

              a:s.a, b:s.b, res:s.res, hueca:s.hueca?1:0, expr:s.expr, tx:s.tx, ty:s.ty}; })};

function limpiaMarcas(L,largo){
  if(!Array.isArray(L) || L.length>300) return null;
  for(var i=0;i<L.length;i++)
    if(typeof L[i]!=='number' || !isFinite(L[i]) || L[i]<=0 || L[i]>=largo) return null;
  return L.slice();
}
/* no se fía del archivo: o cuadra todo, o no se abre */
function limpiaPiezas(lista){
  if(!Array.isArray(lista)) return null;
  var out=[];
  for(var i=0;i<lista.length;i++){
    var s=lista[i];
    if(!s || typeof s.x!=='number' || typeof s.y!=='number' || !isFinite(s.x) || !isFinite(s.y)) return null;
    if(!entero(s.wn,1,1e6) || !entero(s.wd,1,1e6) || !entero(s.hn,1,1e6) || !entero(s.hd,1,1e6)) return null;
    if(s.wn/s.wd>MAXLADO || s.hn/s.hd>MAXLADO) return null;
    if(!entero(s.a,1,MAXD) || !entero(s.b,1,MAXD)) return null;
    var expr=null, j;
    if(s.expr!==null && s.expr!==undefined){
      if(!Array.isArray(s.expr) || s.expr.length>MAXCADENA) return null;
      var n=1, d=1;
      for(j=0;j<s.expr.length;j++){
        var f=s.expr[j];
        if(!Array.isArray(f) || f.length!==2 || !entero(f[0],1,1e5) || !entero(f[1],1,1e5)) return null;
        n*=f[0]; d*=f[1];
      }
      /* lo que dice la cadena tiene que ser lo que mide el rectángulo */
      if(n*s.wd*s.hd!==d*s.wn*s.hn) return null;
      if(!s.expr.length && !(s.wn===1 && s.wd===1 && s.hn===1 && s.hd===1)) return null;
      expr=copiaCadena(s.expr);
    }
    var tx=limpiaMarcas(s.tx, s.wn/s.wd), ty=limpiaMarcas(s.ty, s.hn/s.hd);
    if(!tx || !ty) return null;
    var res=[], lr=s.res===undefined? [] : s.res;
    var nt=trocitos({wn:s.wn, wd:s.wd, hn:s.hn, hd:s.hd, a:s.a, b:s.b, tx:tx, ty:ty}).length;
    if(!Array.isArray(lr)) return null;
    for(j=0;j<lr.length;j++){
      if(!entero(lr[j],0,nt-1) || res.indexOf(lr[j])>=0) return null;
      res.push(lr[j]);
    }
    res.sort(function(p,q){ return p-q; });
    out.push({id:nid++, x:s.x, y:s.y, wn:s.wn, wd:s.wd, hn:s.hn, hd:s.hd, a:s.a, b:s.b, res:res,
              hueca:s.hueca?1:0, expr:expr, tx:tx, ty:ty});
  }
  return out;
}

function textoAyudaBarra(){

  if(!s) return 'Pincha en una pieza para seleccionarla — arrastra para moverla';
  var n=s.a*s.b, nt=trocitos(s).length;
  if(s.hueca) return 'Pieza en solo el borde — se coge por el borde, y lo de debajo se pincha a través';
  if(selK!==null && nt>1) return 'Una subunidad seleccionada, de las '+nt+' de la pieza — se puede cortar o duplicar';
  if(modo==='sub' && nt>1) return 'Pieza con '+nt+' subunidades — pincha en una para seleccionarla';
  if(n===1) return (esUnidad(s)? 'La unidad' : 'Una pieza')+' sin partir — se puede partir, duplicar o unir a las que tenga pegadas';
  return 'Pieza partida en '+n+' partes iguales — cortar la deshace en sus partes';
}

      'border:1px solid #d5d9e0;border-radius:7px;background:#fff;cursor:pointer">Cerrar y usar el manipulativo</button>'+
    '<pre style="white-space:pre-wrap;margin:0">'+
      out.map(function(l){ return l.indexOf('FALLO')===0
        ? '<span style="color:#c2410c;font-weight:700">'+l+'</span>' : l; }).join('\n')+'</pre>';
  document.body.appendChild(box);
  document.getElementById('cpTest').addEventListener('click',function(){
    var ta=document.createElement('textarea'); ta.value=texto; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); }catch(err){}
    document.body.removeChild(ta); this.textContent='Copiado ✓';
  });
  document.getElementById('clTest').addEventListener('click',function(){ box.remove(); });
}
var testLanzado=false;
function lanzarTest(){ if(testLanzado) return; testLanzado=true; runSelfTest(); }
if((location.hash||'').indexOf('test')>=0) setTimeout(lanzarTest,60);
window.addEventListener('hashchange',function(){
  if((location.hash||'').indexOf('test')>=0) lanzarTest();
});

  test:runSelfTest, U:U, MAXD:MAXD, NIVELES:NIVELES, opt:opt,

  parteEn:parteEn, valor:valor, areaDe:areaDe, uneCadenas:uneCadenas, marcasX:marcasX, marcasY:marcasY,
