<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manteles a medida</title>
<style>
  /* Los tamaños de letra están pensados para proyectar en clase: lo que en un
     portátil se lee de cerca, en la pantalla del aula hay que leerlo desde la
     última fila. Es la misma escala de «Tiras de papel». */
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       color:#2b2f36;background:#fff;display:flex;height:100%;overflow:hidden}
  #side{width:256px;flex:0 0 256px;border-right:1px solid #e6e8ec;padding:11px 11px;overflow:auto;
        background:#fafbfc}
  #side h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:#7b828d;
           margin:0 0 6px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;
           text-overflow:ellipsis;clear:both}
  #side h2.sep{margin-top:11px}
  /* rótulo del material: sobrio, peso ligero y una línea fina debajo */
  #side .brand{font-size:24px;font-weight:200;letter-spacing:.02em;color:#39404a;line-height:1.25;
               padding:1px 2px 9px;margin-bottom:11px;border-bottom:1px solid #e3e6eb}
  #side .brand b{font-weight:400;color:#2b2f36}
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  #toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 9px;
           border-bottom:1px solid #e6e8ec;background:#fafbfc}
  .btn{border:1px solid #d5d9e0;background:#fff;border-radius:7px;padding:6px 10px;font-size:15px;
       color:#3d4450;cursor:pointer;display:inline-flex;align-items:center;gap:5px;line-height:1.2}
  .btn:hover:not(:disabled){background:#f0f2f5}
  .btn.on,.btn.on:hover:not(:disabled){background:#2f62a8;border-color:#2f62a8;color:#fff}
  /* acotado a la barra: si no, se lo come también a los h2 del panel lateral,
     que llevan la misma clase para separarse, y los deja en una raya de 1px */
  #toolbar .sep{width:1px;height:22px;background:#dfe2e7;margin:0 3px}
  .chk{display:inline-flex;align-items:center;gap:5px;font-size:15px;color:#4a515c;cursor:pointer;
       padding:4px 6px;border-radius:6px}
  .chk:hover{background:#eff1f4}
  .chk input{margin:0;cursor:pointer;width:16px;height:16px}
  .act{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;margin-top:5px;
       border:1px solid #d5d9e0;background:#fff;border-radius:7px;padding:7px 9px;font-size:15px;
       color:#3d4450;cursor:pointer;text-align:left;line-height:1.3}
  .act:hover:not(:disabled){background:#f0f2f5}
  .act:disabled{opacity:.4;cursor:default}
  .act kbd{font:12.5px ui-monospace,Menlo,Consolas,monospace;color:#9aa1ab;flex:0 0 auto}
  .act.on,.act.on:hover:not(:disabled){background:#2f62a8;border-color:#2f62a8;color:#fff}
  .act.on kbd{color:#cfdcf0}
  /* un botón que espera el segundo pinchazo para hacer lo que dice */
  .act.seguro,.btn.seguro,.act.seguro:hover:not(:disabled),.btn.seguro:hover:not(:disabled){
       border-color:#c2410c;color:#c2410c;background:#fff7f2;font-weight:600}
  .fila .act{margin-top:0;flex:1;padding:7px 7px}
  select,input[type=text],input[type=number]{font:15px inherit;border:1px solid #d5d9e0;border-radius:6px;
       padding:6px 7px;color:#2b2f36;background:#fff;width:100%}
  .fila{display:flex;gap:5px;align-items:stretch;margin-top:5px}
  .fila > *{min-width:0}
  .fila select{padding:6px 3px;font-size:14.5px}
  .mini{border:1px solid #d5d9e0;background:#fff;border-radius:6px;padding:5px 0;font-size:16px;
        color:#3d4450;cursor:pointer;flex:1;text-align:center}
  .mini:hover:not(:disabled){background:#f0f2f5}
  .mini:disabled{opacity:.35;cursor:default}
  #entera{font-size:14.5px}
  /* columnas y filas, lado a lado: cada mitad lleva su rótulo y sus dos botones */
  .mitad{flex:1}
  .mitad .fila{margin-top:3px;gap:3px}
  .mitad .mini{flex:0 0 28px}
  /* tres en una fila, para que el panel no se alargue */
  .fila .act.tres{font-size:14px;padding:7px 3px;justify-content:center;white-space:nowrap}
  .cuenta{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;
          font-weight:600;font-size:15.5px;color:#2b2f36}
  .cuenta svg{display:block;flex:0 0 auto}
  .lab{font-size:13.5px;color:#7b828d;margin-top:0}
  .caja{margin-top:7px;font-size:14px;color:#4a515c;line-height:1.45;
        background:#fff;border:1px solid #e6e8ec;border-radius:8px;padding:8px 9px}
  .caja b{color:#2b2f36}
  .caja .gr{font-size:18.5px;font-weight:700;color:#31527d}
  .caja .mant{margin-top:6px;padding-top:6px;border-top:1px solid #eef0f3}
  .caja .mant:first-child{margin-top:0;padding-top:0;border-top:0}
  .nota{font-size:13.5px;color:#7b828d;line-height:1.45;margin-top:7px}
  #stage{position:relative;flex:1;min-height:0;background:#fbfbfa}
  canvas#cv{display:block;width:100%;height:100%;touch-action:none}
  #hint{position:absolute;left:10px;bottom:10px;background:rgba(28,32,38,.82);color:#fff;font-size:14.5px;
        padding:6px 12px;border-radius:16px;pointer-events:none;max-width:calc(100% - 20px)}
  #info{position:absolute;right:10px;top:10px;width:400px;background:#fff;border:1px solid #dfe2e7;
        border-radius:10px;padding:12px 15px;font-size:14px;line-height:1.55;color:#4a515c;
        box-shadow:0 6px 22px rgba(20,25,35,.12);display:none;max-height:calc(100% - 20px);overflow:auto;
        max-width:calc(100% - 20px)}
  #info.show{display:block}
  #info b{color:#2b2f36}
  #info a{color:#2f62a8}
  #info .lic{margin-top:11px;padding-top:8px;border-top:1px solid #eef0f3;font-size:12.5px;
             line-height:1.5;color:#8a919c}
  #drop{position:absolute;inset:0;background:rgba(47,98,168,.08);border:2px dashed #2f62a8;
        display:none;align-items:center;justify-content:center;font-size:18px;color:#2f62a8;font-weight:600}
  #drop.show{display:flex}
  @media (max-width:640px){
    #side{width:176px;flex:0 0 176px;padding:8px 7px}
    .btn{padding:5px 7px;font-size:13.5px}
    .act,.chk,select,input[type=text]{font-size:13.5px}
  }
</style>
</head>
<body>

  <aside id="side">
    <div class="brand">Manteles a <b>medida</b></div>
    <h2>El encargo</h2>
    <div class="caja" id="panelEncargo" style="margin-top:0"></div>
    <div class="fila" style="margin-top:7px">
      <select id="modo" style="flex:2" title="De qué se parte: de la unidad, o de otro mantel del que se sabe la medida">
        <option value="1" selected>Desde la unidad</option>
        <option value="2">Desde otro mantel</option>
      </select>
      <select id="nivel" style="flex:1" title="De qué denominadores se sortea el encargo">
        <option value="0">Fácil</option>
        <option value="1" selected>Normal</option>
        <option value="2">Difícil</option>
      </select>
    </div>
    <button class="act" id="nuevo">Nuevo encargo al azar</button>
    <div class="fila">
      <input type="text" id="aMano" placeholder="5/6" style="flex:1.6"
             title="Escribe cuánto tiene que medir el mantel encargado">
      <button class="act" id="crear" style="justify-content:center" title="Poner el encargo que has escrito">Crear</button>
    </div>

    <h2 class="sep">Partir la pieza</h2>
    <div class="fila" style="gap:9px">
      <div class="mitad" title="Partir en vertical: columnas">
        <div class="lab">Columnas</div>
        <div class="fila">
          <button class="mini" id="colMenos" disabled title="Una columna menos">−</button>
          <div class="cuenta" id="ncol">—</div>
          <button class="mini" id="colMas" disabled title="Una columna más">+</button>
        </div>
      </div>
      <div class="mitad" title="Partir en horizontal: filas">
        <div class="lab">Filas</div>
        <div class="fila">
          <button class="mini" id="filMenos" disabled title="Una fila menos">−</button>
          <div class="cuenta" id="nfil">—</div>
          <button class="mini" id="filMas" disabled title="Una fila más">+</button>
        </div>
      </div>
    </div>
    <div class="fila">
      <button class="mini" id="entera" disabled title="Quitar las marcas">sin partir</button>
    </div>

    <h2 class="sep">Al pinchar, seleccionar</h2>
    <div class="fila">
      <button class="act on" id="modoP" title="Al pinchar se selecciona la pieza entera (tecla 1)">Pieza<kbd>1</kbd></button>
      <button class="act" id="modoS" title="Al pinchar en una pieza partida se selecciona solo la parte en la que se pincha (tecla 2)">Subunidad<kbd>2</kbd></button>
    </div>
    <div class="fila" style="margin-top:9px">
      <button class="act tres" id="cortar" disabled style="flex:1" title="Separa de uno de tus trozos la subunidad seleccionada; con el trozo entero, lo corta por todas sus marcas (tecla C)">✂ Cortar</button>
      <button class="act tres" id="unir" disabled style="flex:.85" title="Funde en una sola pieza la seleccionada y las que tenga pegadas, si entre todas forman un rectángulo. Vale también con la referencia (tecla J)">⬒ Unir</button>
      <button class="act tres" id="borrar" disabled style="flex:.85" title="Quita la pieza seleccionada (tecla Supr)">Quitar</button>
    </div>
    <div class="fila">
      <button class="act" id="duplicar" disabled title="Saca una copia suelta de la subunidad seleccionada; con uno de tus trozos entero, pone otra copia pegada a su derecha; con la referencia entera, saca otra igual (tecla D)">⧉ Duplicar</button>
      <button class="act" id="dupB" disabled title="Pone otra copia del trozo seleccionado pegada debajo (tecla B)">⧉ Debajo</button>
    </div>
    <button class="act" id="otraRef" disabled title="Saca al tablero otra referencia igual, entera y sin partir (tecla U)">＋ Otra unidad<kbd>U</kbd></button>

    <h2 class="sep">Probar</h2>
    <button class="act" id="probar" disabled style="margin-top:0">▶ Llevar al banco<kbd>P</kbd></button>
    <div class="caja" id="panelBanco"></div>

    <h2 class="sep" id="h2Medir">Comprobaciones</h2>
    <div class="caja" id="panelMedir" style="margin-top:0"></div>
  </aside>

  <main>
    <div id="toolbar">
      <button class="btn" id="undo" title="Deshacer (Ctrl+Z)">↶</button>
      <button class="btn" id="vaciar" title="Volver a empezar este mismo encargo">Reiniciar</button>
      <span class="sep"></span>
      <label class="chk" title="Al soltar, los bordes y las marcas se enganchan a los de las demás piezas"><input type="checkbox" id="iman" checked>Imán</label>
      <label class="chk" title="Escribe en cada trozo cuánto vale con la unidad"><input type="checkbox" id="etiq">Etiquetas</label>
      <label class="chk" title="El programa lleva la cuenta de lo que pongas encima de tu mantel"><input type="checkbox" id="comp">Comprobaciones</label>
      <button class="btn" id="transp" title="Los trozos se vuelven translúcidos y se ve lo que hay debajo">◑ Transparencia</button>
      <span class="sep"></span>
      <button class="btn" id="mano" title="Mover el tablero en vez de las piezas">✋</button>
      <button class="btn" id="zoomout">−</button>
      <button class="btn" id="zoomin">+</button>
      <button class="btn" id="fit">Ajustar</button>
      <span class="sep"></span>
      <button class="btn" id="save" title="Descargar el tablero">⤓ Guardar</button>
      <button class="btn" id="open" title="Abrir un archivo guardado">⤒ Abrir</button>
      <button class="btn" id="add" title="Añadir lo de un archivo a lo que ya hay">＋</button>
      <button class="btn" id="png" title="Descargar imagen">⤓ PNG</button>
      <button class="btn" id="help">?</button>
      <input type="file" id="fileIn" accept=".json,application/json" style="display:none">
    </div>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="hint"></div>
      <div id="info"></div>
      <div id="drop">Suelta aquí el archivo</div>
    </div>
  </main>

<script>
"use strict";
(function(){

/* =========================================================================
   1. LA IDEA
   Medir es comparar con una unidad. En «Manteles y servilletas» se daba la
   unidad y se buscaba la medida; en «En busca de la unidad perdida» se daba
   la medida y se buscaba la unidad. Aquí se dan las dos cosas y lo que falta
   es el mantel: hay que FABRICARLO para que mida lo que dice el encargo.

   Dos modos, que son dos problemas distintos:

     · Desde la unidad. Está la unidad en el tablero. Un mantel de p/q u sale
       de doblar la unidad en q partes y juntar p de ellas.

     · Desde otro mantel. La unidad no aparece por ningún lado: lo que hay es
       un mantel A del que se sabe la medida, r/s u. Ahora la unidad es un
       intermediario que hay que rehacer, o que se puede saltar yendo directo:
       si el encargo es p/q u, el mantel pedido mide (p·s)/(q·r) de A.

   La restricción que lo gobierna todo: todas las piezas salen de partir la
   referencia y de repetir trozos, así que las áreas se llevan con fracciones
   exactas de enteros, nunca con decimales. Dos áreas son iguales o no lo son,
   sin márgenes de tolerancia.

   Y lo que hace que esto funcione con superficies: el mantel encargado queda
   determinado por su ÁREA, no por su forma. Por eso el entorno no puede
   juzgar lo que construye el alumno; y por eso no juzga nada. Se limita a
   medir con la referencia y a decir qué sale.
   ========================================================================= */
var L=150;                 // el lado base, en píxeles
var MAXD=12;               // partes máximas en cada dirección
var HUECO=12;              // lo que se separa de su pieza un trozo sacado de ella

var CTROZO ={f:'#f4ead6', b:'#c2ab7d', t:'#7a6634'};   // trozo suelto
var CUNI   ={f:'#dbe7f3', b:'#5b87bd', t:'#31527d'};   // la unidad
var CREF   ={f:'#dfeadb', b:'#6f9a5f', t:'#3f5c35'};   // el mantel de referencia
var CMANTEL={f:'#efdfea', b:'#a2649a', t:'#6b3d64'};   // tu mantel, en el banco

/* =========================================================================
   2. ESTADO
   ========================================================================= */
var piezas=[], sel=null, nid=1;
var selK=null;             // la subunidad seleccionada dentro de la pieza sel, o null si es la pieza entera
var modoSel='pieza';       // 'pieza' o 'sub': qué selecciona un pinchazo
var encargo=null;          // {modo, p,q, rp,rq, wp,wq,hp,hq}
var banco=null;            // el rectángulo del panel de pruebas, en mundo
var view={x:0,y:0,z:1};
var drag=null, undoStack=[], importMode='replace';
var opt={iman:1, etiq:0, mano:0, alfa:0, comp:0};

var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var stage=document.getElementById('stage');
var hintEl=document.getElementById('hint'), infoEl=document.getElementById('info');
var dropEl=document.getElementById('drop');
var flashMsg=null, flashT=0;

function w2s(p){ return {x:p.x*view.z+view.x, y:p.y*view.z+view.y}; }
function s2w(p){ return {x:(p.x-view.x)/view.z, y:(p.y-view.y)/view.z}; }
function flash(m){ flashMsg=m; flashT=Date.now(); draw(); setTimeout(draw,2400); }
function fuente(px,peso){ return (peso? peso+' ' : '')+px+'px -apple-system,Segoe UI,Roboto,sans-serif'; }
function foto(){ return JSON.stringify({p:piezas, s:sel, k:selK, n:nid, b:banco, e:encargo}); }
function pushUndo(){
  undoStack.push(foto());
  if(undoStack.length>90) undoStack.shift();
}
function doUndo(){
  if(!undoStack.length){ flash('No hay nada que deshacer'); return; }
  var d=JSON.parse(undoStack.pop());
  piezas=d.p; sel=d.s; nid=d.n||1; banco=d.b||null; encargo=d.e||null;
  selK=(d.k===null || d.k===undefined)? null : d.k;
  cacheEnc='';
  draw();
}

/* =========================================================================
   3. FRACCIONES
   Aritmética exacta de enteros. Un área es siempre un par p/q reducido;
   comparar dos áreas es multiplicar en cruz.
   ========================================================================= */
function mcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ var t=a%b; a=b; b=t; } return a; }
function reduce(p,q){ var d=mcd(p,q)||1; return {p:p/d, q:q/d}; }
function igualFrac(a,b){ return a.p*b.q===b.p*a.q; }
function sumaFrac(a,b){ return reduce(a.p*b.q+b.p*a.q, a.q*b.q); }
function divFrac(a,b){ return reduce(a.p*b.q, a.q*b.p); }
function multFrac(a,b){ return reduce(a.p*b.p, a.q*b.q); }
function textoFrac(f){ return f.q===1 ? (f.p+'') : (f.p+'/'+f.q); }
function leeFraccion(txt){
  if(txt===null || txt===undefined) return null;
  var s=String(txt).toLowerCase().replace(/\s+y\s+/g,' ').trim();
  if(!s) return null;
  var m;
  if((m=s.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/))){
    var e=+m[1], n=+m[2], d=+m[3];
    if(!d) return null;
    return reduce(e*d+n, d);
  }
  if((m=s.match(/^(\d+)\s*\/\s*(\d+)$/))){
    if(!+m[2] || !+m[1]) return null;
    return reduce(+m[1], +m[2]);
  }
  if((m=s.match(/^(\d+)$/))){ if(!+m[1]) return null; return {p:+m[1], q:1}; }
  return null;
}
/* «5/6» o «5/6 desde 3/4»: la segunda fracción es la medida del mantel de
   referencia, para poder preparar una sesión con un caso concreto */
function leeEncargoTexto(txt){
  if(txt===null || txt===undefined) return null;
  var s=String(txt).toLowerCase().trim();
  if(!s) return null;
  var partes=s.split(/\s+(?:desde|con|a\s+partir\s+de|de\s+un\s+mantel\s+de)\s+/);
  var obj=leeFraccion(partes[0]);
  if(!obj) return null;
  if(partes.length===1) return {obj:obj, ref:null};
  if(partes.length>2) return null;
  var ref=leeFraccion(partes[1]);
  if(!ref) return null;
  return {obj:obj, ref:ref};
}

/* =========================================================================
   4. LOS ENCARGOS QUE PROPONE EL ENTORNO
   Un encargo son dos fracciones: lo que tiene que medir el mantel (p/q de la
   unidad) y lo que mide la referencia que se da (r/s de la unidad; en el modo
   «desde la unidad» eso es 1/1, la propia unidad).

   Se busca que el mantel pedido, la referencia y la unidad —que el alumno
   puede querer rehacer por el camino— quepan todos en la pantalla, y que al
   material le quede alguna manera de llegar.

   Hay dos maneras, y de cuál esté disponible depende buena parte de lo que
   cuesta el encargo:

     · la RUTA DIRECTA, doblar la referencia de una vez en las n partes que
       pide (p·s)/(q·r) reducido, y juntar m. Solo existe si n no pasa de las
       partes en que se puede doblar una pieza.

     · la RUTA POR LA UNIDAD, doblar la referencia en r partes —cada una es
       entonces 1/s de unidad—, juntar s para rehacer la unidad y volver a
       empezar desde ella. Existe siempre que r y q quepan en un doblez y la
       unidad no pida demasiadas copias.

   CÓMO SE REGULA LA DIFICULTAD. No con topes, sino con suelos: un nivel no
   es «hasta cuánto puede llegar» sino «de qué denominadores se sortea». Si
   solo se ponen máximos, el nivel difícil sigue sacando 3/2 tan a menudo como
   el fácil, porque un tope no impide que salga un número pequeño.

     · qs   los denominadores del encargo que ese nivel sortea. En difícil son
            siete, nueve y once: primos o casi, que no se dejan doblar por
            mitades y obligan a contar de verdad.
     · rutaDirecta   si el nivel exige que la ruta directa exista (fácil y
            normal, con n acotado) o que NO exista (difícil), que es lo que
            obliga a construir por etapas en el modo desde otro mantel.
   ========================================================================= */
var MAXCOPIAS=9;           // copias como mucho para rehacer la unidad
var NIVELES=[
  {n:'Fácil',   qs:[2,3,4],     maxp:6,  maxm:8,  maxn:4,  rutaDirecta:1, maxs:4},
  {n:'Normal',  qs:[3,4,5,6,8], maxp:9,  maxm:12, maxn:9,  rutaDirecta:1, maxs:6},
  {n:'Difícil', qs:[7,9,11],    maxp:14, maxm:16, maxn:12, rutaDirecta:0, maxs:6}
];
/* formas de mantel agradables de mirar, en fracciones del lado base */
var FORMAS=[
  {wp:1,wq:1,hp:1,hq:1},
  {wp:3,wq:2,hp:1,hq:1},
  {wp:1,wq:1,hp:3,hq:2},
  {wp:5,wq:4,hp:1,hq:1},
  {wp:1,wq:1,hp:5,hq:4},
  {wp:3,wq:2,hp:5,hq:4},
  {wp:5,wq:4,hp:3,hq:2},
  {wp:7,wq:4,hp:1,hq:1},
  {wp:1,wq:1,hp:7,hq:4},
  {wp:4,wq:3,hp:5,hq:4},
  {wp:5,wq:4,hp:4,hq:3},
  {wp:3,wq:2,hp:4,hq:3}
];
var CUADRADO={wp:1,wq:1,hp:1,hq:1};
function areaForma(F){ return (F.wp/F.wq)*(F.hp/F.hq); }
/* el paso directo: el mantel pedido mide (p·s)/(q·r) de la referencia */
function pasoDirecto(p,q,r,s){ return reduce(p*s, q*r); }
function hayRutaDirecta(p,q,r,s){
  var m=pasoDirecto(p,q,r,s);
  return m.q<=MAXD && m.p<=20;
}
function hayRutaPorLaUnidad(p,q,r,s){ return r<=MAXD && q<=MAXD && s<=MAXCOPIAS; }
/* un encargo vale si al menos una de las dos rutas está al alcance, y si la
   referencia y el mantel pedido no miden lo mismo */
function alcanzable(p,q,r,s){
  if(pasoDirecto(p,q,r,s).p===pasoDirecto(p,q,r,s).q) return false;
  return hayRutaDirecta(p,q,r,s) || hayRutaPorLaUnidad(p,q,r,s);
}
function objetivoValido(p,q){
  if(p===q) return false;                 // el encargo sería la propia unidad
  if(mcd(p,q)!==1) return false;          // la fracción, ya irreducible
  if(q>MAXD) return false;                // hay que poder doblar la unidad en q
  var a=p/q;
  return a>=0.3 && a<=2.6;
}
function referenciaValida(r,s){
  if(r===s) return false;                 // entonces la referencia sería la unidad
  if(mcd(r,s)!==1) return false;
  if(r>MAXD) return false;                // doblarla en r partes da 1/s de unidad
  if(s>MAXCOPIAS) return false;           // y hacen falta s de esas para la unidad
  var a=r/s;
  return a>=0.3 && a<=2.6;
}
/* que quepan en pantalla el mantel de referencia, la unidad y el pedido */
function formaValida(F,p,q,r,s){
  var ar=areaForma(F);
  if(ar<0.85 || ar>2.05) return false;
  var au=ar*s/r;                          // lo que ocuparía la unidad
  if(au<0.45 || au>3.2) return false;
  var ab=au*p/q;                          // lo que ocupa el mantel encargado
  return ab>=0.3 && ab<=3.0;
}
function formasBuenas(p,q,r,s){
  var out=[];
  for(var k=0;k<FORMAS.length;k++) if(formaValida(FORMAS[k],p,q,r,s)) out.push(FORMAS[k]);
  return out;
}
function referenciasPosibles(){
  var out=[];
  for(var r=1;r<=MAXD;r++) for(var s=1;s<=MAXCOPIAS;s++)
    if(referenciaValida(r,s)) out.push({p:r,q:s});
  return out;
}
function elige(lista){ return lista[Math.floor(Math.random()*lista.length)]; }
/* la referencia cumple lo que pide el nivel: en fácil y normal, que la ruta
   directa exista y quepa en n dobleces; en difícil, que NO exista, y que
   quede sin embargo la de rehacer la unidad */
function referenciaDelNivel(p,q,r,s,N){
  if(!referenciaValida(r,s)) return false;
  var m=pasoDirecto(p,q,r,s);
  if(m.p===m.q) return false;                     // medirían lo mismo, no hay nada que hacer
  if(N.rutaDirecta) return m.q<=Math.min(MAXD,N.maxn) && m.p<=N.maxm;
  /* que el atajo no exista de verdad, no que salga largo: se exige que el
     doblez que pediría no quepa en una pieza, no que pida muchos trozos */
  return m.q>MAXD && hayRutaPorLaUnidad(p,q,r,s) && s<=N.maxs;
}

function encargoAlAzar(modo,nv){
  var N=NIVELES[nv]||NIVELES[1];
  for(var i=0;i<8000;i++){
    /* el denominador se SORTEA de los del nivel, no se acota: es lo único que
       impide que difícil siga sacando mitades y tercios */
    var q=elige(N.qs), p=1+Math.floor(Math.random()*N.maxp);
    if(!objetivoValido(p,q)) continue;
    if(modo===1) return {modo:1, p:p,q:q, rp:1,rq:1,
                         wp:CUADRADO.wp,wq:CUADRADO.wq,hp:CUADRADO.hp,hq:CUADRADO.hq};
    var r=1+Math.floor(Math.random()*MAXD), s=1+Math.floor(Math.random()*MAXCOPIAS);
    if(!referenciaDelNivel(p,q,r,s,N)) continue;
    var buenas=formasBuenas(p,q,r,s);
    if(!buenas.length) continue;
    var F=elige(buenas);
    return {modo:2, p:p,q:q, rp:r,rq:s, wp:F.wp,wq:F.wq,hp:F.hp,hq:F.hq};
  }
  return modo===2 ? {modo:2, p:5,q:6, rp:3,rq:4, wp:3,wq:2,hp:1,hq:1}
                  : {modo:1, p:5,q:6, rp:1,rq:1, wp:1,wq:1,hp:1,hq:1};
}
/* el encargo que se pide a mano; devuelve null y el motivo si no se puede */
function encargoConcreto(modo,obj,ref){
  if(!obj) return null;
  var f=reduce(obj.p,obj.q), p=f.p, q=f.q;
  if(!objetivoValido(p,q)) return null;
  if(modo===1) return {modo:1, p:p,q:q, rp:1,rq:1,
                       wp:CUADRADO.wp,wq:CUADRADO.wq,hp:CUADRADO.hp,hq:CUADRADO.hq};
  var lista = ref ? [reduce(ref.p,ref.q)] : referenciasPosibles();
  var cands=[];
  for(var i=0;i<lista.length;i++){
    var R=lista[i];
    if(!referenciaValida(R.p,R.q)) continue;
    if(!alcanzable(p,q,R.p,R.q)) continue;
    var buenas=formasBuenas(p,q,R.p,R.q);
    for(var k=0;k<buenas.length;k++) cands.push({R:R, F:buenas[k]});
  }
  if(!cands.length) return null;
  var c=elige(cands);
  return {modo:2, p:p,q:q, rp:c.R.p,rq:c.R.q, wp:c.F.wp,wq:c.F.wq,hp:c.F.hp,hq:c.F.hq};
}

/* =========================================================================
   5. LAS PIEZAS
   Todas son rectángulos con ancho y alto guardados como fracciones del lado
   base, para que partir y repetir sea exacto. a y b son las partes en que
   está marcada la pieza; son solo marcas: no la rompen.

   Tres clases de pieza:
     'r'  la referencia, lo único que llega con la medida sabida. En el modo
          desde la unidad es la propia unidad (1/1); en el otro, el mantel A.
          Hay la de trabajo, a la izquierda, y la copia limpia del banco, que
          es la que hace de patrón para medir.
     'p'  un trozo suelto, de los que se corta y se repite.
     't'  tu mantel, ya montado y llevado al banco. Es lo que se mide, y por
          eso nunca lleva escrito cuánto vale.
   ========================================================================= */
function ancho(s){ return L*s.wp/s.wq; }
function alto(s){ return L*s.hp/s.hq; }
function areaDe(s){ return reduce(s.wp*s.hp, s.wq*s.hq); }
function areaCelda(s){ return reduce(s.wp*s.hp, s.wq*s.hq*s.a*s.b); }
function centro(s){ return {x:s.x+ancho(s)/2, y:s.y+alto(s)/2}; }

function nuevaRef(E,P,esPatron){
  return {id:nid++, tipo:'r', wp:E.wp, wq:E.wq, hp:E.hp, hq:E.hq, a:1, b:1,
          pat:esPatron?1:0, fp:E.rp, fq:E.rq, x:P.x, y:P.y,
          nombre: E.rp===E.rq ? 'u' : 'A'};
}
function nuevoTrozo(wf,hf,P){
  return {id:nid++, tipo:'p', wp:wf.p, wq:wf.q, hp:hf.p, hq:hf.q, a:1, b:1,
          pat:0, fp:0, fq:1, x:P.x, y:P.y, nombre:''};
}
function nuevoTuMantel(wf,hf,P){
  return {id:nid++, tipo:'t', wp:wf.p, wq:wf.q, hp:hf.p, hq:hf.q, a:1, b:1,
          pat:0, fp:0, fq:1, x:P.x, y:P.y, nombre:''};
}
function porId(id){
  for(var i=0;i<piezas.length;i++) if(piezas[i].id===id) return piezas[i];
  return null;
}
function seleccionada(){ return sel==null? null : porId(sel); }
function marcasX(s){
  var out=[];
  if(s.a<2) return out;
  for(var k=1;k<s.a;k++) out.push(s.x+ancho(s)*k/s.a);
  return out;
}
function marcasY(s){
  var out=[];
  if(s.b<2) return out;
  for(var k=1;k<s.b;k++) out.push(s.y+alto(s)*k/s.b);
  return out;
}
function puntosX(s){ return [s.x, s.x+ancho(s)].concat(marcasX(s)); }
function puntosY(s){ return [s.y, s.y+alto(s)].concat(marcasY(s)); }
function dentro(P,s){
  return P.x>=s.x && P.x<=s.x+ancho(s) && P.y>=s.y && P.y<=s.y+alto(s);
}
/* La subunidad es cada una de las partes en que está partida una pieza. Es lo
   que se selecciona, se duplica y se corta, igual que en «Manteles y
   servilletas» y en las tiras. Se numeran por filas, de arriba abajo y de
   izquierda a derecha. */
function partes(s){ return s.a*s.b; }
function celdaW(s){ return reduce(s.wp, s.wq*s.a); }
function celdaH(s){ return reduce(s.hp, s.hq*s.b); }
function rectParte(s,k){
  var i=k%s.a, j=Math.floor(k/s.a);
  return {i:i, j:j, x:s.x+ancho(s)*i/s.a, y:s.y+alto(s)*j/s.b, w:ancho(s)/s.a, h:alto(s)/s.b};
}
/* en qué subunidad de la pieza cae un punto del mundo; -1 si cae fuera */
function parteEn(s,P){
  if(!dentro(P,s)) return -1;
  var i=Math.max(0, Math.min(s.a-1, Math.floor((P.x-s.x)/ancho(s)*s.a)));
  var j=Math.max(0, Math.min(s.b-1, Math.floor((P.y-s.y)/alto(s)*s.b)));
  return j*s.a+i;
}
function caja(lista){
  if(!lista.length) return null;
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  lista.forEach(function(s){
    x0=Math.min(x0,s.x); x1=Math.max(x1,s.x+ancho(s));
    y0=Math.min(y0,s.y); y1=Math.max(y1,s.y+alto(s));
  });
  return {x0:x0,y0:y0,x1:x1,y1:y1};
}
/* la caja de todo lo que se ve, panel del banco incluido, para ajustar y para
   exportar la imagen */
function cajaTodo(){
  var b=caja(piezas);
  if(!banco) return b;
  if(!b) return {x0:banco.x, y0:banco.y, x1:banco.x+banco.w, y1:banco.y+banco.h};
  return {x0:Math.min(b.x0,banco.x), y0:Math.min(b.y0,banco.y),
          x1:Math.max(b.x1,banco.x+banco.w), y1:Math.max(b.y1,banco.y+banco.h)};
}

/* --- partir, duplicar, cortar ------------------------------------------------
   Las acciones con las que se construye todo. Ninguna inventa medidas: parten
   de lo que ya hay en el tablero.

   Duplicar y cortar van como en «Manteles y servilletas», con un modo de
   pinchar que elige la pieza entera o una de sus subunidades:
     · Duplicar una subunidad saca una copia suelta, con su misma forma, justo
       debajo de la pieza y en la vertical de su columna. Vale para cualquier
       pieza, también la referencia y el patrón: es la manera de sacar de ellas
       una parte sin tocarlas.
     · Duplicar uno de tus trozos entero pone otra copia pegada a su derecha, o
       debajo con el otro botón, que es como se repite un trozo. La referencia
       entera se copia debajo, con sus marcas, como un trozo más.
     · Cortar es solo para tus trozos: la referencia ni se rompe ni se une. Con
       una subunidad elegida, esa cae debajo de la pieza y lo demás se queda en
       su sitio, en los rectángulos que queden —lo de su izquierda y lo de su
       derecha, a toda la altura, y lo de encima y lo de debajo en su misma
       columna—; con el trozo entero, lo deshace en todas sus partes, que
       quedan embaldosando el sitio donde estaba. */
function parte(s,a,b){
  if(!s) return false;
  a=Math.max(1, Math.min(MAXD, Math.round(a)));
  b=Math.max(1, Math.min(MAXD, Math.round(b)));
  if(a===s.a && b===s.b) return false;
  pushUndo();
  s.a=a; s.b=b; selK=null;          // otras partes: la subunidad elegida ya no existe
  draw();
  return true;
}
/* una copia suelta de la parte k de la pieza (sin k, de la primera) */
function sacarTrozo(s,k){
  if(!s) return null;
  if(k===null || k===undefined) k=0;
  if(!(k>=0 && k<partes(s))) return null;
  pushUndo();
  var t=nuevoTrozo(celdaW(s), celdaH(s), {x:rectParte(s,k).x, y:s.y+alto(s)+HUECO});
  piezas.push(t); sel=t.id; selK=null;
  draw();
  return t;
}
/* una copia entera, con sus marcas, de una pieza que no es un trozo */
function copiaEntera(s){
  if(!s) return null;
  pushUndo();
  var P={x:s.x, y:s.y+alto(s)+HUECO};
  /* la copia de una referencia es otra referencia, con su cartel; la de tu
     mantel, un trozo */
  var t = s.tipo==='r'
    ? nuevaRef({wp:s.wp, wq:s.wq, hp:s.hp, hq:s.hq, rp:s.fp, rq:s.fq}, P, false)
    : nuevoTrozo(reduce(s.wp,s.wq), reduce(s.hp,s.hq), P);
  t.a=s.a; t.b=s.b;
  piezas.push(t); sel=t.id; selK=null;
  draw();
  return t;
}
function separar(s){
  if(!s || s.tipo!=='p') return null;
  if(s.a*s.b<2) return null;
  pushUndo();
  var wf=celdaW(s), hf=celdaH(s);
  var an=L*wf.p/wf.q, al=L*hf.p/hf.q, hijos=[];
  for(var j=0;j<s.b;j++) for(var i=0;i<s.a;i++){
    var t=nuevoTrozo(wf, hf, {x:s.x+an*i, y:s.y+al*j});
    hijos.push(t);
  }
  var k=piezas.indexOf(s);
  if(k>=0) piezas.splice.apply(piezas, [k,1].concat(hijos));
  else piezas=piezas.concat(hijos);
  sel=hijos[0].id; selK=null;
  draw();
  return hijos;
}
function duplica(s,k,dir){
  if(!s) return null;
  if(k!==null && k!==undefined && partes(s)>1) return sacarTrozo(s,k);
  if(s.tipo==='p') return duplicaEn(s, dir||'d');
  return copiaEntera(s);
}
function corta(s,k){
  if(!s || s.tipo!=='p') return null;
  if(partes(s)<2) return null;
  if(k===null || k===undefined) return separar(s);
  if(!(k>=0 && k<partes(s))) return null;
  pushUndo();
  var R=rectParte(s,k), i=R.i, j=R.j, cw=celdaW(s), ch=celdaH(s), nuevas=[];
  /* un trozo de ci columnas y cj filas de subunidades, con sus marcas */
  function trozo(ci,cj,P){
    var t=nuevoTrozo(reduce(cw.p*ci, cw.q), reduce(ch.p*cj, ch.q), P);
    t.a=ci; t.b=cj;
    return t;
  }
  if(i>0)     nuevas.push(trozo(i, s.b, {x:s.x, y:s.y}));
  if(i<s.a-1) nuevas.push(trozo(s.a-1-i, s.b, {x:R.x+R.w, y:s.y}));
  if(j>0)     nuevas.push(trozo(1, j, {x:R.x, y:s.y}));
  if(j<s.b-1) nuevas.push(trozo(1, s.b-1-j, {x:R.x, y:R.y+R.h}));
  var c=trozo(1, 1, {x:R.x, y:s.y+alto(s)+HUECO});
  nuevas.push(c);
  var n=piezas.indexOf(s);
  if(n>=0) piezas.splice.apply(piezas, [n,1].concat(nuevas));
  else piezas=piezas.concat(nuevas);
  sel=c.id; selK=null;
  draw();
  return nuevas;
}
function ponModoSel(m){
  modoSel = m==='sub'? 'sub' : 'pieza';
  if(modoSel!=='sub') selK=null;
  draw();
}
/* --- unir en una sola pieza -------------------------------------------------
   Un mantel repartido en trozos se puede contar, pero no es todavía un
   mantel. Unir solo es posible si los trozos embaldosan un rectángulo, que es
   la forma que este material sabe partir en partes iguales; si no, hay que
   recolocarlos. */
function seSolapan(a,b){
  var e=1e-6;
  return a.x < b.x+ancho(b)-e && b.x < a.x+ancho(a)-e &&
         a.y < b.y+alto(b)-e  && b.y < a.y+alto(a)-e;
}
/* el lado del rectángulo, en fracción exacta, sumando la fila de arriba (o la
   columna de la izquierda) y exigiendo que vaya seguida y llegue al final */
function ladoExacto(lista,ejeX){
  var e=1e-6, b=caja(lista);
  var borde=lista.filter(function(s){
    return ejeX ? Math.abs(s.y-b.y0)<e : Math.abs(s.x-b.x0)<e; });
  borde.sort(function(p,q){ return ejeX ? p.x-q.x : p.y-q.y; });
  var cursor = ejeX ? b.x0 : b.y0, total={p:0,q:1};
  for(var i=0;i<borde.length;i++){
    var s=borde[i], ini = ejeX ? s.x : s.y;
    if(Math.abs(ini-cursor)>e) return null;
    cursor += ejeX ? ancho(s) : alto(s);
    total = sumaFrac(total, ejeX ? reduce(s.wp,s.wq) : reduce(s.hp,s.hq));
  }
  return Math.abs(cursor-(ejeX? b.x1 : b.y1))<e ? total : null;
}
function rectanguloDe(lista){
  if(!lista.length) return null;
  var i,j;
  for(i=0;i<lista.length;i++) for(j=i+1;j<lista.length;j++)
    if(seSolapan(lista[i],lista[j])) return null;
  var W=ladoExacto(lista,true), H=ladoExacto(lista,false);
  if(!W || !H) return null;
  /* que además lo llenen: sin esta comprobación, una ele o un rectángulo con
     un hueco en medio colarían, porque su fila de arriba y su columna de la
     izquierda pueden estar completas y el centro vacío */
  var suma={p:0,q:1};
  for(i=0;i<lista.length;i++) suma=sumaFrac(suma, areaDe(lista[i]));
  if(!igualFrac(suma, reduce(W.p*H.p, W.q*H.q))) return null;
  var b=caja(lista);
  return {w:W, h:H, x:b.x0, y:b.y0};
}
function unir(s){
  var g=grupoUnir(s);
  if(g.length<2) return null;
  var R=rectanguloDe(g);
  if(!R) return null;
  pushUndo();
  var t=nuevoTrozo(R.w, R.h, {x:R.x, y:R.y});
  piezas=piezas.filter(function(o){ return g.indexOf(o)<0; });
  piezas.push(t); sel=t.id; selK=null;
  draw();
  return t;
}
function duplicaEn(s,dir){
  if(!s || s.tipo!=='p') return null;
  pushUndo();
  var dx = dir==='d' ? ancho(s) : 0;
  var dy = dir==='b' ? alto(s) : 0;
  var t={id:nid++, tipo:'p', wp:s.wp, wq:s.wq, hp:s.hp, hq:s.hq, a:s.a, b:s.b,
         pat:0, fp:0, fq:1, x:s.x+dx, y:s.y+dy, nombre:''};
  piezas.push(t); sel=t.id; selK=null;
  draw();
  return t;
}

/* --- el imán --------------------------------------------------------------
   Ojo con el cero: un enganche perfecto vale 0, que es falso en JavaScript.
   La distancia se lleva aparte. */
function engancheEje(s,puntosDe){
  var lim=10/view.z, mios=puntosDe(s), mejor=null, dist=Infinity;
  piezas.forEach(function(o){
    if(o.id===s.id) return;
    puntosDe(o).forEach(function(b){
      mios.forEach(function(a){
        var d=b-a;
        if(Math.abs(d)<lim && Math.abs(d)<dist){ mejor=d; dist=Math.abs(d); }
      });
    });
  });
  return mejor;
}
function aplicaIman(s){
  if(!opt.iman || !s) return false;
  var dx=engancheEje(s,puntosX), dy=engancheEje(s,puntosY), algo=false;
  if(dx!==null){ s.x+=dx; algo=true; }
  if(dy!==null){ s.y+=dy; algo=true; }
  return algo;
}
/* --- el grupo pegado -------------------------------------------------------- */
function tocan(a,b){
  var e=0.6;
  return a.x < b.x+ancho(b)+e && b.x < a.x+ancho(a)+e &&
         a.y < b.y+alto(b)+e  && b.y < a.y+alto(a)+e;
}
/* para unir entran también las referencias de trabajo; para llevar al banco,
   no: allí va solo lo que se ha construido */
function esDeUnir(o){ return !!o && (o.tipo==='p' || (o.tipo==='r' && !o.pat)); }
function grupoUnir(s){
  if(!esDeUnir(s)) return [];
  var dentroG={}, pila=[s], out=[];
  dentroG[s.id]=1;
  while(pila.length){
    var c=pila.pop(); out.push(c);
    piezas.forEach(function(o){
      if(!esDeUnir(o) || dentroG[o.id]) return;
      if(tocan(c,o)){ dentroG[o.id]=1; pila.push(o); }
    });
  }
  return out;
}
function grupoDe(s){
  if(!s || s.tipo!=='p') return [];
  var dentroG={}, pila=[s], out=[];
  dentroG[s.id]=1;
  while(pila.length){
    var c=pila.pop(); out.push(c);
    piezas.forEach(function(o){
      if(o.tipo!=='p' || dentroG[o.id]) return;
      if(tocan(c,o)){ dentroG[o.id]=1; pila.push(o); }
    });
  }
  return out;
}

/* =========================================================================
   6. EL BANCO DE PRUEBAS
   El tablero tiene dos sitios. A la izquierda se construye: se dobla la
   referencia, se sacan trozos y se juntan hasta tener lo que uno cree que es
   el mantel encargado. A la derecha se prueba, y para eso el mantel tiene que
   dejar de ser un montón de trozos y ser una pieza: «▶ Llevar al banco» coge
   el grupo pegado, exige que forme un rectángulo —un mantel lo es— y monta el
   banco con dos copias limpias, sin ninguna de las divisiones que se hayan
   hecho para construir: tu mantel fundido en una pieza y la referencia otra
   vez entera, que ahí hace de patrón.

   Medir es entonces lo de siempre: doblar el patrón, sacar una parte y cubrir
   con ella. Como del patrón se sabe cuánto mide en unidades, la cuenta se
   puede dar en unidades, que es como está escrito el encargo.

   El entorno sigue sin corregir: dice la fracción que sale de lo que hay
   puesto, no si está acertado. Que cubra sin huecos ni solapes lo mira el
   alumno.
   ========================================================================= */
function patron(){
  for(var i=0;i<piezas.length;i++) if(piezas[i].tipo==='r' && piezas[i].pat) return piezas[i];
  return null;
}
/* la referencia de trabajo: la que está fuera del banco, con la que se
   construye */
function refTrabajo(){
  for(var i=piezas.length-1;i>=0;i--)
    if(piezas[i].tipo==='r' && !piezas[i].pat) return piezas[i];
  return null;
}
/* --- más referencias, y unirlas ------------------------------------------------
   La referencia se puede sacar las veces que haga falta, con su cartel y su
   color, y se puede unir a los trozos propios: una unidad con un sexto pegado
   es un mantel —o una tira— de 7/6 u, y construirlo así es tan legítimo como
   juntar siete sextos. Al unirla deja de ser referencia y pasa a ser un trozo.
   Por eso nada de lo que mide puede depender de que quede una en el tablero:
   de qué referencia se trata se sabe siempre, por las que haya o, si no queda
   ninguna, por el encargo. */
function refCualquiera(){ return refTrabajo() || patron(); }
function refsTrabajo(){ return piezas.filter(function(o){ return o.tipo==='r' && !o.pat; }); }
function datosRef(){
  var R=refCualquiera();
  if(R) return {wp:R.wp, wq:R.wq, hp:R.hp, hq:R.hq, rp:R.fp, rq:R.fq};
  if(encargo) return {wp:encargo.wp, wq:encargo.wq, hp:encargo.hp, hq:encargo.hq, rp:encargo.rp, rq:encargo.rq};
  return null;
}
/* otra referencia entera, debajo de lo que haya construido */
function otraRef(){
  var E=datosRef();
  if(!E) return null;
  pushUndo();
  var b=caja(piezas.filter(function(o){ return !enBanco(o); }));
  var t=nuevaRef(E, b? {x:b.x0, y:b.y1+HUECO*2} : {x:0,y:0}, false);
  piezas.push(t); sel=t.id; selK=null;
  draw();
  return t;
}
function tuMantel(){
  for(var i=0;i<piezas.length;i++) if(piezas[i].tipo==='t') return piezas[i];
  return null;
}
function dentroRect(P,r){
  return !!r && P.x>=r.x && P.x<=r.x+r.w && P.y>=r.y && P.y<=r.y+r.h;
}
function enBanco(s){ return dentroRect(centro(s), banco); }
/* cuánto vale un área en unidades, sabiendo lo que mide la referencia */
function enU(area){
  var E=datosRef();
  if(!E) return null;
  return multFrac(divFrac(area, reduce(E.wp*E.hp, E.wq*E.hq)), reduce(E.rp,E.rq));
}
function valorCelda(s){ return enU(areaCelda(s)); }
/* un trozo cuenta sobre tu mantel si su centro cae dentro. El patrón también:
   iterar la referencia sobre lo que se mide es medir */
function trozosSobre(m){
  return piezas.filter(function(s){
    return (s.tipo==='p' || s.tipo==='r') && s.id!==m.id && dentro(centro(s), m);
  });
}
/* en cuántas partes está doblado el patrón y cuánto vale cada una en unidades */
function partePatron(){
  var P=patron();
  if(!P) return null;
  var mu=multFrac(divFrac(areaCelda(P), areaDe(P)), reduce(P.fp,P.fq));
  return {area:areaCelda(P), N:P.a*P.b, mu:mu};
}
function medidaDe(m){
  var P=patron();
  if(!P) return {estado:'sin-patron'};
  if(!m) return {estado:'sin-mantel'};
  var T=trozosSobre(m);
  if(!T.length) return {estado:'sin-trozos'};
  var at={p:0,q:1};
  for(var i=0;i<T.length;i++) at=sumaFrac(at, areaDe(T[i]));
  var enPat=divFrac(at, areaDe(P));
  var r={estado:'ok', n:T.length, pat:enPat, frac:multFrac(enPat, reduce(P.fp,P.fq))};
  /* si lo que ha puesto son trozos todos iguales, la cuenta se da tal cual:
     tantos trozos de los que valen cada uno lo suyo. Se mira que sean iguales
     ENTRE SÍ, no que sean celdas del patrón: cuando el patrón no se deja
     doblar de una vez en lo que hace falta, se mide con partes de algo
     construido por el camino, y esa cuenta vale igual.
     El total va SIN reducir: arriba las partes que caben, abajo en las que se
     partió la unidad. */
  var iguales=true;
  for(i=1;i<T.length;i++) if(!igualFrac(areaDe(T[i]), areaDe(T[0]))) iguales=false;
  if(iguales){
    var mu=enU(areaDe(T[0]));
    var Q=partePatron();
    if(mu) r.cuenta={n:T.length, mu:mu, total:{p:T.length*mu.p, q:mu.q},
                     delPatron: !!(Q && igualFrac(areaDe(T[0]), Q.area))};
  }
  return r;
}
/* --- montar el banco --------------------------------------------------------
   Devuelve el motivo por el que no se ha podido, para poder decirlo. */
function probar(s){
  if(!s || s.tipo!=='p') return {ok:false, por:'sin-trozo'};
  var g=grupoDe(s);
  var R = g.length>1 ? rectanguloDe(g)
                     : {w:reduce(s.wp,s.wq), h:reduce(s.hp,s.hq)};
  if(!R) return {ok:false, por:'no-rectangulo', n:g.length};
  var E=datosRef();
  if(!E) return {ok:false, por:'sin-referencia'};
  pushUndo();
  /* fuera el banco anterior entero, con lo que hubiera dentro */
  piezas=piezas.filter(function(o){ return !enBanco(o); });
  var anT=L*R.w.p/R.w.q, alT=L*R.h.p/R.h.q;
  var anP=L*E.wp/E.wq, alP=L*E.hp/E.hq;
  var b=caja(piezas);
  /* el hueco entre tu mantel y el patrón va holgado: los dos llevan cartel, y
     el cartel se dibuja en pantalla mientras que el hueco se encoge con el
     zoom, así que con manteles pequeños se pisarían */
  var padX=L*0.34, padTop=L*0.62, padBot=L*0.5, hueco=L*0.8;
  var x0 = b? b.x1+L*0.85 : 0, y0 = b? b.y0-L*0.25 : 0;
  var tm=nuevoTuMantel(R.w, R.h, {x:x0+padX, y:y0+padTop});
  var cp=nuevaRef(E, {x:x0+padX+anT+hueco, y:y0+padTop}, true);
  banco={x:x0, y:y0,
         w:padX*2+anT+hueco+anP,
         h:padTop+Math.max(alT,alP)+padBot};
  piezas.push(tm); piezas.push(cp);
  sel=cp.id; selK=null;
  draw();
  return {ok:true, mantel:tm, patron:cp, n:g.length};
}

/* --- poner un encargo en el tablero ------------------------------------------ */
function ponEncargo(E){
  if(!E) return null;
  pushUndo();
  encargo=E; banco=null;
  var R=nuevaRef(E, {x:-L*E.wp/E.wq/2, y:-L*E.hp/E.hq/2}, false);
  piezas=[R]; sel=R.id; selK=null; cacheEnc='';
  fitView();
  return R;
}
function reinicia(){
  if(!encargo) return;
  pushUndo();
  banco=null;
  var R=nuevaRef(encargo, {x:-L*encargo.wp/encargo.wq/2, y:-L*encargo.hp/encargo.hq/2}, false);
  piezas=[R]; sel=R.id; selK=null;
  fitView();
}

/* =========================================================================
   7. DIBUJO
   draw() repinta el tablero entero. Tu mantel debajo del todo, que es sobre
   lo que se pone; encima la referencia y los trozos; y los carteles siempre
   lo último, en coordenadas de pantalla, para que ni el zoom ni un trozo
   puesto encima los tapen.
   ========================================================================= */
function colorDe(s){
  if(s.tipo==='r') return (s.fp===s.fq) ? CUNI : CREF;
  if(s.tipo==='t') return CMANTEL;
  return CTROZO;
}
function rectRedondo(c,x,y,w,h,r){
  r=Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y);
  c.closePath();
}
function etiquetaCabe(c,txt,anchoCelda,altoCelda){
  if(!txt || altoCelda<13) return '';
  return (c.measureText(txt).width+6<anchoCelda) ? txt : '';
}
/* la etiqueta lleva la unidad detrás, «1/3 u», que si no parece un número
   suelto; si el trozo es estrecho se queda con la fracción y, si no cabe ni
   eso, no se escribe nada */
function etiquetaTrozo(c,v,anchoCelda,altoCelda){
  var f=textoFrac(v);
  return etiquetaCabe(c, f+' u', anchoCelda, altoCelda) ||
         etiquetaCabe(c, f, anchoCelda, altoCelda);
}
/* La letra de las etiquetas crece con el zoom y es grande de entrada, que esto
   se proyecta. A cambio, en las partes estrechas no cabe: antes de quitarle la
   unidad a la etiqueta se prueba con letra más pequeña, hasta 3/4 de la ideal;
   después se prueba la fracción sola, hasta un mínimo que aún se lea, y solo
   si tampoco cabe se deja la parte sin rotular. Deja puesta en el contexto la
   tipografía con la que cabe. */
var PX_ETIQ=15, PX_MIN=9;
function pxEtiqueta(){ return Math.max(10, Math.min(34, PX_ETIQ*view.z)); }
function ajustaEtiqueta(c,v,anchoCelda,altoCelda,px){
  var p, t, suelo=Math.max(PX_MIN, px*0.75);
  for(p=px; p>=suelo-1e-9; p-=1){
    c.font=fuente(p);
    t=etiquetaTrozo(c,v,anchoCelda,altoCelda);
    if(t.indexOf('u')>=0) return {t:t, px:p};
  }
  for(p=px; p>=PX_MIN-1e-9; p-=1){
    c.font=fuente(p);
    t=etiquetaTrozo(c,v,anchoCelda,altoCelda);
    if(t) return {t:t, px:p};
  }
  return {t:'', px:0};
}
/* kSel es la subunidad que hay que marcar como seleccionada, o null */
function drawPieza(c,s,marcada,kSel){
  var p=w2s({x:s.x, y:s.y});
  var w=ancho(s)*view.z, h=alto(s)*view.z;
  if(!isFinite(p.x)||!isFinite(p.y)||!isFinite(w)||!isFinite(h)) return;
  var C=colorDe(s);
  var conSub = marcada && kSel!==null && kSel!==undefined && partes(s)>1;
  var iS=conSub? kSel%s.a : 0, jS=conSub? Math.floor(kSel/s.a) : 0;
  c.save();
  if(opt.alfa && s.tipo==='p') c.globalAlpha=0.55;
  c.save();
  c.shadowColor='rgba(20,25,35,.13)'; c.shadowBlur=6; c.shadowOffsetY=2;
  rectRedondo(c,p.x,p.y,w,h,3.5*view.z);
  c.fillStyle=C.f; c.fill();
  c.restore();

  if(s.a>1 || s.b>1){
    c.save();
    rectRedondo(c,p.x,p.y,w,h,3.5*view.z); c.clip();
    if(conSub){
      c.fillStyle='rgba(47,98,168,.22)';
      c.fillRect(p.x+w*iS/s.a, p.y+h*jS/s.b, w/s.a, h/s.b);
    }
    c.strokeStyle=C.b; c.lineWidth=Math.max(1.4, 1.8*view.z);
    var k;
    for(k=1;k<s.a;k++){
      var X=p.x+w*k/s.a;
      c.beginPath(); c.moveTo(X,p.y); c.lineTo(X,p.y+h); c.stroke();
    }
    for(k=1;k<s.b;k++){
      var Y=p.y+h*k/s.b;
      c.beginPath(); c.moveTo(p.x,Y); c.lineTo(p.x+w,Y); c.stroke();
    }
    c.restore();
  }
  /* las etiquetas dicen lo que vale cada celda EN UNIDADES. Tu mantel no se
     etiqueta nunca: cuánto mide es justo lo que está en juego */
  if(opt.etiq && s.tipo!=='t'){
    var v=valorCelda(s);
    if(v){
      c.save();
      c.fillStyle=C.t;
      c.textAlign='center'; c.textBaseline='middle';
      var E=ajustaEtiqueta(c, v, w/s.a, h/s.b, pxEtiqueta());
      if(E.t) for(var i=0;i<s.a;i++) for(var j=0;j<s.b;j++)
        c.fillText(E.t, p.x+w*(i+0.5)/s.a, p.y+h*(j+0.5)/s.b);
      c.restore();
    }
  }

  rectRedondo(c,p.x,p.y,w,h,3.5*view.z);
  c.lineWidth=(marcada && !conSub)? 2.6 : (s.pat? 2 : 1.3);
  c.strokeStyle=(marcada && !conSub)? '#1f4e8c' : C.b;
  c.stroke();
  if(conSub){
    c.lineWidth=2.6; c.strokeStyle='#1f4e8c';
    c.strokeRect(p.x+w*iS/s.a, p.y+h*jS/s.b, w/s.a, h/s.b);
  }
  c.restore();
}
/* en el cartel de la referencia va lo que mide, que es el dato del problema;
   en el de tu mantel no va ningún número, que es lo que se busca */
function textoCartel(s){
  if(s.tipo==='t') return 'tu mantel';
  if(s.tipo!=='r') return '';
  return s.fp===s.fq ? 'u' : s.nombre+' · '+textoFrac(reduce(s.fp,s.fq))+' u';
}
/* el cartel se dibuja en coordenadas de pantalla y el último de todo, para que
   ni el zoom ni un trozo puesto encima lo tapen */
var ALTO_CARTEL=26;
function drawCartel(c,s,txt){
  if(!txt) return;
  var p=w2s({x:s.x, y:s.y});
  c.save();
  c.font=fuente(15,'600');
  var w=c.measureText(txt).width+18, h=ALTO_CARTEL;
  var x=p.x, y=p.y-h-5;
  rectRedondo(c,x,y,w,h,8);
  c.fillStyle=colorDe(s).b; c.fill();
  c.fillStyle='#fff'; c.textAlign='left'; c.textBaseline='middle';
  c.fillText(txt, x+9, y+h/2+0.5);
  c.restore();
}
/* el banco: un panel rotulado que separa el sitio de construir del de probar */
function rotuloBanco(){
  return encargo ? 'PRUEBA TU MANTEL · TE PEDÍAN '+textoFrac({p:encargo.p,q:encargo.q})+' U'
                 : 'PRUEBA TU MANTEL';
}
function drawBanco(c){
  if(!banco) return;
  var p=w2s({x:banco.x, y:banco.y});
  var w=banco.w*view.z, h=banco.h*view.z;
  if(!isFinite(p.x)||!isFinite(w)) return;
  c.save();
  rectRedondo(c,p.x,p.y,w,h,12);
  c.fillStyle='#f3f5f8'; c.fill();
  c.setLineDash([6,5]); c.lineWidth=1.4; c.strokeStyle='#c8cfd9'; c.stroke();
  c.setLineDash([]);
  /* el rótulo va FUERA, encima de la esquina: dentro se lo comen los carteles,
     porque el hueco de arriba se encoge con el zoom y el cartel no */
  c.font=fuente(14,'600');
  c.fillStyle='#7b828d'; c.textAlign='left'; c.textBaseline='bottom';
  c.fillText(rotuloBanco(), p.x+2, p.y-6);
  c.restore();
}
function drawTodo(c){
  drawBanco(c);
  ['t','r','p'].forEach(function(tipo){
    piezas.forEach(function(s){ if(s.tipo===tipo) drawPieza(c,s,s.id===sel,s.id===sel? selK : null); });
  });
  piezas.forEach(function(s){ if(s.tipo==='t' || s.tipo==='r') drawCartel(c,s,textoCartel(s)); });
}
function draw(){
  var W=cv.width/(window.devicePixelRatio||1), H=cv.height/(window.devicePixelRatio||1);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#fbfbfa'; ctx.fillRect(0,0,W,H);
  drawTodo(ctx);
  updateUI();
}

/* =========================================================================
   8. INTERACCIÓN
   ========================================================================= */
function pos(e){
  var r=stage.getBoundingClientRect();
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}
function piezaEn(P){
  var i;
  for(i=piezas.length-1;i>=0;i--) if(piezas[i].tipo==='p' && dentro(P,piezas[i])) return piezas[i];
  for(i=piezas.length-1;i>=0;i--) if(piezas[i].tipo==='r' && dentro(P,piezas[i])) return piezas[i];
  for(i=piezas.length-1;i>=0;i--) if(piezas[i].tipo==='t' && dentro(P,piezas[i])) return piezas[i];
  return null;
}
/* seleccionar lo que hay en un punto: la pieza, o una de sus partes si el modo
   es el de subunidades y la pieza está partida */
function seleccionaEn(P){
  var t=piezaEn(P);
  if(!t){ sel=null; selK=null; return null; }
  sel=t.id;
  selK = (modoSel==='sub' && partes(t)>1)? parteEn(t,P) : null;
  piezas=piezas.filter(function(q){ return q.id!==t.id; }).concat([t]);
  return t;
}
cv.addEventListener('pointerdown',function(e){
  cv.setPointerCapture(e.pointerId);
  var s=pos(e), w=s2w(s);
  if(!opt.mano && e.button!==1 && e.button!==2){
    var antes=foto(), t=seleccionaEn(w);
    if(t){
      drag={modo:'mover', w0:w, s0:s, s:t, x0:t.x, y0:t.y, movido:false, antes:antes};
      draw(); return;
    }
  }
  drag={modo:'pan', s0:s, v0:{x:view.x, y:view.y}};
  draw();
});
cv.addEventListener('pointermove',function(e){
  if(!drag) return;
  var s=pos(e), w=s2w(s);
  if(drag.modo==='pan'){
    view.x=drag.v0.x+(s.x-drag.s0.x); view.y=drag.v0.y+(s.y-drag.s0.y);
    draw(); return;
  }
  /* un pinchazo sin arrastre es solo seleccionar: ni mueve la pieza ni gasta
     un deshacer */
  if(!drag.movido && Math.abs(s.x-drag.s0.x)+Math.abs(s.y-drag.s0.y)<4) return;
  drag.movido=true;
  drag.s.x=drag.x0+(w.x-drag.w0.x);
  drag.s.y=drag.y0+(w.y-drag.w0.y);
  draw();
});
function suelta(){
  if(!drag) return;
  var d=drag; drag=null;
  if(d.modo==='mover' && d.movido){
    undoStack.push(d.antes); if(undoStack.length>90) undoStack.shift();
    aplicaIman(d.s);
  }
  draw();
}
cv.addEventListener('pointerup',suelta);
cv.addEventListener('pointercancel',suelta);
cv.addEventListener('contextmenu',function(e){ e.preventDefault(); });
cv.addEventListener('wheel',function(e){
  e.preventDefault();
  var s=pos(e), w=s2w(s);
  var z=Math.max(0.2, Math.min(3, view.z*(e.deltaY<0?1.12:1/1.12)));
  view.z=z; view.x=s.x-w.x*z; view.y=s.y-w.y*z;
  draw();
},{passive:false});

/* --- pedir encargos --------------------------------------------------------- */
function avisoEncargo(E){
  if(E.modo===1)
    return 'Encargo: un mantel de '+textoFrac({p:E.p,q:E.q})+' u, y ahí tienes la unidad';
  return 'Encargo: un mantel de '+textoFrac({p:E.p,q:E.q})+' u, con un mantel A que mide '+
         textoFrac(reduce(E.rp,E.rq))+' u';
}
function modoActual(){ return +document.getElementById('modo').value===2 ? 2 : 1; }
document.getElementById('modo').addEventListener('change',function(){
  document.getElementById('aMano').placeholder = modoActual()===2 ? '5/6 desde 3/4' : '5/6';
});
document.getElementById('nuevo').addEventListener('click',function(){
  var E=encargoAlAzar(modoActual(), +document.getElementById('nivel').value);
  ponEncargo(E);
  flash(avisoEncargo(E));
});
document.getElementById('crear').addEventListener('click',function(){
  var caja0=document.getElementById('aMano');
  var lectura=leeEncargoTexto(caja0.value);
  if(!lectura){ flash('Escribe cuánto tiene que medir el mantel, por ejemplo 5/6'); return; }
  var modo=modoActual();
  if(lectura.ref && modo===1){ flash('Para dar un mantel de referencia, cambia antes el modo'); return; }
  var f=reduce(lectura.obj.p, lectura.obj.q);
  if(f.p===f.q){ flash('Entonces el mantel sería la propia unidad, y no habría nada que fabricar'); return; }
  if(f.q>MAXD){ flash('El denominador no puede pasar de '+MAXD+', que es en cuántas partes se puede doblar'); return; }
  var E=encargoConcreto(modo, f, lectura.ref);
  if(!E){
    flash(modo===2 && lectura.ref
      ? 'Desde ese mantel no se llega a ese encargo con los dobleces que hay'
      : 'Con esa medida el mantel o la unidad se salen de la pantalla');
    return;
  }
  ponEncargo(E); caja0.value='';
  flash(avisoEncargo(E));

/* si lo que acaba de salir cae fuera de lo que se ve —debajo del borde, o

/* --- confirmar sin diálogos --------------------------------------------------
   Nada de diálogos del navegador: dentro de un marco con sandbox —el Moodle de
   un centro— y en más de un visor incrustado, el navegador no enseña el diálogo
   y contesta que no, así que el botón parece muerto. La confirmación va en el
   propio botón: el primer pinchazo lo arma («¿Seguro?») y avisa en la barra de
   abajo; el segundo, si llega antes de cuatro segundos, hace la acción. */
function dosPasos(b, aviso, accion, puede){
  var t=null, antes=null;
  function desarma(){
    if(t){ clearTimeout(t); t=null; }
    if(antes!==null){ b.innerHTML=antes; antes=null; }
    b.classList.remove('seguro');
  }
  b.addEventListener('click',function(){
    if(t){ desarma(); flashMsg=null; accion(); draw(); return; }
    if(puede && !puede()) return;
    antes=b.innerHTML; b.textContent='¿Seguro?'; b.classList.add('seguro');
    flash(aviso);
    t=setTimeout(desarma, 4000);
  });
}

function entero(v){ var n=Number(v); return isFinite(n) && Math.round(n)===n ? n : null; }
function limpiaPiezas(lista){
  if(!Array.isArray(lista)) return null;
  var out=[];
  for(var i=0;i<lista.length;i++){
    var s=lista[i];
    if(!s || typeof s!=='object') return null;
    var tipo = s.tipo==='r' ? 'r' : s.tipo==='p' ? 'p' : s.tipo==='t' ? 't' : null;
    if(!tipo) return null;
    var wp=entero(s.wp), wq=entero(s.wq), hp=entero(s.hp), hq=entero(s.hq);
    if(wp===null||wq===null||hp===null||hq===null) return null;
    if(!(wp>0 && wq>0 && hp>0 && hq>0)) return null;
    if(wq>1e6 || hq>1e6 || wp>1e6 || hp>1e6) return null;
    var x=Number(s.x), y=Number(s.y);
    if(!isFinite(x) || !isFinite(y)) return null;
    var a=Math.max(1, Math.min(MAXD, Math.round(Number(s.a)||1)));
    var b=Math.max(1, Math.min(MAXD, Math.round(Number(s.b)||1)));
    var fp=0, fq=1;
    if(tipo==='r'){
      fp=entero(s.fp); fq=entero(s.fq);
      if(fp===null||fq===null||fp<1||fq<1) return null;   // la referencia trae su medida
    }
    var yaHayPatron=out.some(function(o){ return o.pat; });
    var yaHayMantel=out.some(function(o){ return o.tipo==='t'; });
    if(tipo==='t' && yaHayMantel) return null;            // tu mantel es uno
    out.push({id:nid++, tipo:tipo, wp:wp, wq:wq, hp:hp, hq:hq, a:a, b:b,
              pat: tipo==='r' && s.pat && !yaHayPatron ? 1 : 0,   /* patrón hay uno */
              fp:fp, fq:fq, x:x, y:y,
              nombre: tipo==='r' ? (fp===fq ? 'u' : 'A') : ''});
  }
  return out;
}
function limpiaBanco(b){
  if(!b) return null;
  var x=Number(b.x), y=Number(b.y), w=Number(b.w), h=Number(b.h);
  if(![x,y,w,h].every(isFinite) || !(w>0 && h>0)) return null;
  return {x:x, y:y, w:w, h:h};
}
function limpiaEncargo(e){
  if(!e) return null;
  var v=[entero(e.p),entero(e.q),entero(e.rp),entero(e.rq),
         entero(e.wp),entero(e.wq),entero(e.hp),entero(e.hq)];
  for(var i=0;i<v.length;i++) if(v[i]===null || v[i]<1) return null;
  return {modo: Number(e.modo)===2?2:1, p:v[0],q:v[1], rp:v[2],rq:v[3],
          wp:v[4],wq:v[5],hp:v[6],hq:v[7]};
}
function loadData(d){
  var nuevas=d && limpiaPiezas(d.piezas);
  if(!nuevas){ flash('Ese archivo no trae nada que yo entienda'); return; }
  pushUndo();
  if(importMode==='add'){
    /* al añadir no se trae ni el banco ni el encargo del archivo: el que manda
       es el de aquí, y ni dos patrones ni dos manteles pueden convivir */
    var yaP=!!patron(), yaT=!!tuMantel(), sobran=[];
    nuevas.forEach(function(s){
      if(s.pat){ if(yaP) s.pat=0; else yaP=true; }
      if(s.tipo==='t'){ if(yaT) sobran.push(s.id); else yaT=true; }
    });
    nuevas=nuevas.filter(function(s){ return sobran.indexOf(s.id)<0; });
    piezas=piezas.concat(nuevas);
  } else {
    piezas=nuevas; banco=limpiaBanco(d.banco); encargo=limpiaEncargo(d.encargo);
  }
  sel=null; selK=null; cacheEnc=''; fitView();
  flash(nuevas.length+(nuevas.length===1?' pieza cargada':' piezas cargadas'));
}

    return 'El patrón, partido · selecciona una subunidad (2) y duplícala (D) para cubrir tu mantel';

      var f=sumaFrac({p:1,q:6},{p:1,q:3}); return f.p===1 && f.q===2; })());
  ok('dividir fracciones compara dos áreas', (function(){
      var f=divFrac({p:3,q:2},{p:9,q:5}); return f.p===5 && f.q===6; })(),
     textoFrac(divFrac({p:3,q:2},{p:9,q:5})));

      var f=multFrac({p:10,q:9},{p:3,q:4}); return f.p===5 && f.q===6; })(),
     textoFrac(multFrac({p:10,q:9},{p:3,q:4})));

  ok('lo que no es una fracción se rechaza',
     leeFraccion('mantel')===null && leeFraccion('3/0')===null && leeFraccion('0/5')===null);
  ok('«5/6 desde 3/4» da las dos fracciones del encargo', (function(){
      var e=leeEncargoTexto('5/6 desde 3/4');
      return e && e.obj.p===5 && e.obj.q===6 && e.ref.p===3 && e.ref.q===4; })());
  ok('«5/6» a secas deja la referencia sin decidir', (function(){

  /* --- guardo lo que hubiera en el tablero ------------------------------------ */

      antesC=opt.comp, antesU=undoStack, antesB=banco, antesEnc=encargo;

  ok('el paso directo de A al mantel pedido es (p·s)/(q·r)', (function(){
      var m=pasoDirecto(5,6,3,4); return m.p===10 && m.q===9; })(), textoFrac(pasoDirecto(5,6,3,4)));

      var malos=[];

          if(E.modo!==2) malos.push('modo '+E.modo);
          else if(!objetivoValido(E.p,E.q)) malos.push('objetivo '+E.p+'/'+E.q);

  ok('y un encargo imposible avisa en vez de inventárselo',

  ok('si cabe, la etiqueta va con su unidad y a su tamaño', eA.t==='1/12 u' && eA.px===15, eA.t+' a '+eA.px+' px');
  ok('si no cabe, antes de quitarle la unidad se achica la letra', eB.t==='1/12 u' && eB.px<15 && eB.px>=11,
     eB.t+' a '+eB.px+' px');
  ok('más estrecha todavía, se queda la fracción sola', eC.t==='1/12' && eC.px>=9, eC.t+' a '+eC.px+' px');
  ok('y si no cabe ni con la letra mínima, no se escribe nada', eD.t==='', '«'+eD.t+'»');

  /* --- lo que se ve ---------------------------------------------------------------------------- */
  (function(){
    var oc=document.createElement('canvas'); oc.width=L+40; oc.height=L+40;
    var o=oc.getContext('2d'), v0=view, a0=opt.alfa, e0=opt.etiq, p0=piezas;
    view={x:20,y:20,z:1}; opt.alfa=0;
    var R=nuevaRef(EU,{x:0,y:0},false); R.a=2; R.b=2;
    var tr=nuevoTrozo({p:1,q:2},{p:1,q:2},{x:0,y:0});
    var tr4=nuevoTrozo({p:1,q:1},{p:1,q:1},{x:0,y:0}); tr4.a=2; tr4.b=2;
    var tt=nuevoTuMantel({p:1,q:1},{p:1,q:1},{x:0,y:0}); tt.a=2; tt.b=2;
    piezas=[R,tr,tr4];
    function pinta(s,marcada,k){
      o.setTransform(1,0,0,1,0,0); o.fillStyle='#fff'; o.fillRect(0,0,oc.width,oc.height);
      drawPieza(o,s,marcada,k);
    }
    function azules(x0,y0,x1,y1){
      var d=o.getImageData(0,0,oc.width,oc.height).data, n=0, x, y, i;
      for(y=Math.round(y0);y<Math.round(y1);y++) for(x=Math.round(x0);x<Math.round(x1);x++){
        i=(y*oc.width+x)*4; if(d[i+2]-d[i]>100) n++; }
      return n;
    }
    function oscuros(){
      var d=o.getImageData(0,0,oc.width,oc.height).data, n=0, i;
      /* más oscuro que cualquier relleno, borde o marca: solo queda la letra */
      for(i=0;i<d.length;i+=4) if(d[i]<160 && d[i+1]<140 && d[i+2]<100) n++;
      return n;
    }
    var W=oc.width, H=oc.height, m=20, h=L/2;
    opt.etiq=0;
    /* se mira en un trozo, que es de color hueso: la unidad es azulada y su
       propio borde contaría como azul */
    pinta(tr4,false,null); var nada=azules(0,0,W,H), sinE=oscuros();
    pinta(tr4,true,null);  var entera=azules(0,0,W,H);
    pinta(tr4,true,3);
    var dentro3=azules(m+h-4, m+h-4, W, H);
    var fuera3 =azules(0, 0, m+h-6, H) + azules(m+h-6, 0, W, m+h-6);
    ok('sin seleccionar, el trozo no lleva nada de azul', nada===0, nada);
    ok('seleccionado entero, el azul lo rodea', entera>300, entera+' píxeles');
    ok('con una subunidad seleccionada, el azul rodea solo esa parte', dentro3>150 && fuera3===0,
       dentro3+' dentro y '+fuera3+' fuera');
    opt.etiq=1;
    pinta(tr4,false,null); var conE=oscuros();
    pinta(tr,false,null);  var trE=oscuros();
    pinta(tt,false,null);  var ttE=oscuros();
    opt.etiq=0; pinta(tr,false,null); var trS=oscuros();
    ok('las etiquetas se escriben al encenderlas, y no antes', conE>sinE+60, sinE+' → '+conE+' píxeles de tinta');
    ok('un trozo partido en cuatro lleva unas cuatro veces la tinta de un cuarto suelto',
       (conE-sinE)>2.8*(trE-trS) && (conE-sinE)<5.2*(trE-trS),
       (Math.round(10*(conE-sinE)/(trE-trS))/10)+' veces');
    ok('tu mantel no lleva etiqueta ni con las etiquetas encendidas', ttE===0, ttE);
    view=v0; opt.alfa=a0; opt.etiq=e0; piezas=p0;
  })();

  ok('una pieza que cae fuera de lo que se ve se detecta, y una que está a la vista no', (function(){
      var v0=view; view={x:300,y:200,z:1};
      var dentroV=nuevoTrozo({p:1,q:2},{p:1,q:2},{x:0,y:0}), fuera=nuevoTrozo({p:1,q:2},{p:1,q:2},{x:0,y:5000});
      var r=enPantalla(dentroV) && !enPantalla(fuera);
      view=v0; return r; })());

  /* --- la interfaz ------------------------------------------------------------------------------- */
  ok('el panel de ayuda cuenta cómo funciona y no hace preguntas', ayuda().indexOf('¿')<0 && ayuda().indexOf('Para pensar')<0);
  ok('y explica las herramientas de subunidad', ayuda().indexOf('Duplicar')>0 && ayuda().indexOf('Cortar')>0 &&
     ayuda().indexOf('Subunidad')>0 && ayuda().indexOf('Sacar un trozo')<0);
  ok('ningún botón depende de un diálogo del navegador, que en un marco incrustado no sale', (function(){
      var codigo=document.querySelector('script').textContent;
      return ['con'+'firm(', 'al'+'ert(', 'pro'+'mpt('].every(function(p){ return codigo.indexOf(p)<0; }); })());
  ok('un botón de dos pasos no hace nada al primer pinchazo, y avisa', (function(){
      var b=document.createElement('button'), veces=0; b.innerHTML='Hacer<kbd>X</kbd>';
      dosPasos(b,'aviso de prueba',function(){ veces++; });
      b.click();
      var armado = veces===0 && b.textContent==='¿Seguro?' && b.classList.contains('seguro') && flashMsg==='aviso de prueba';
      b.click();
      return armado && veces===1 && b.innerHTML==='Hacer<kbd>X</kbd>' && !b.classList.contains('seguro'); })());
  ok('«Reiniciar» deja la referencia sola al segundo pinchazo, y se puede deshacer', (function(){
      piezas=[]; sel=null; banco=null; undoStack=[];
      var A=ponEncargo(EU); parte(A,2,2); duplica(A,1);
      var b=document.getElementById('vaciar');
      b.click(); var uno=piezas.length;
      b.click(); var dos=piezas.length;
      doUndo(); var tres=piezas.length;
      return uno===2 && dos===1 && tres===2; })());
  flashMsg=null;
  ok('la barra de abajo distingue lo seleccionado, y nunca dice cuántas partes hay', (function(){
      piezas=[]; sel=null; banco=null;
      var A=ponEncargo(EU);
      var t1=nuevoTrozo({p:1,q:3},{p:1,q:2},{x:0,y:300}), t3=nuevoTrozo({p:1,q:1},{p:1,q:2},{x:0,y:500}); t3.a=3;
      piezas.push(t1); piezas.push(t3);
      var T=[];
      A.a=1; A.b=1;
      [[null,null,'pieza'],[null,null,'sub'],[A.id,null,'pieza']].forEach(function(q){
        sel=q[0]; selK=q[1]; modoSel=q[2]; T.push(textoAyudaBarra()); });
      A.a=3; A.b=2;
      [[A.id,null,'pieza'],[A.id,2,'sub'],[t1.id,null,'pieza'],[t3.id,null,'sub'],[t3.id,1,'sub']].forEach(function(q){
        sel=q[0]; selK=q[1]; modoSel=q[2]; T.push(textoAyudaBarra()); });
      sel=null; selK=null; modoSel='pieza';
      var distintos={}; T.forEach(function(t){ distintos[t]=1; });
      return Object.keys(distintos).length===8 && T[4].indexOf('C la corta')<0 && T[7].indexOf('C la corta')>0 &&
             !/1\/6|6 partes|de las 6|en 6/.test(T.join(' ')); })());
  ok('cortar solo se enciende con uno de tus trozos partido; duplicar, con cualquier pieza', (function(){
      var A=refTrabajo(), t3=piezas[piezas.length-1], bc=document.getElementById('cortar'),
          bd=document.getElementById('duplicar'), r=[];
      sel=null; updateUI(); r.push(bc.disabled, bd.disabled);
      sel=A.id; updateUI(); r.push(bc.disabled, bd.disabled);
      sel=t3.id; updateUI(); r.push(bc.disabled, bd.disabled);
      t3.a=1; updateUI(); r.push(bc.disabled, bd.disabled);
      sel=null; updateUI();
      return r.join()==='true,true,true,false,false,false,true,false'; })());
  ok('el panel empieza por el rótulo del material', (function(){
      var b=document.querySelector('#side .brand');
      return !!b && b.textContent==='Manteles a medida' && document.getElementById('side').firstElementChild===b; })());
  if(document.getElementById('side').offsetWidth>0 && window.innerWidth>640){
    ok('la letra es la de proyectar: 16 px de base', parseFloat(getComputedStyle(document.body).fontSize)>=16,
       getComputedStyle(document.body).fontSize);
    ok('y el rótulo es lo más grande del panel', (function(){
        var b=parseFloat(getComputedStyle(document.querySelector('#side .brand')).fontSize);
        var h=parseFloat(getComputedStyle(document.querySelector('#side h2')).fontSize);
        return b>=22 && b>h; })(), getComputedStyle(document.querySelector('#side .brand')).fontSize);
    ok('los títulos del panel se ven enteros: ni en una raya ni cortados', (function(){
        var hs=document.querySelectorAll('#side h2'), i;
        for(i=0;i<hs.length;i++){
          if(hs[i].offsetParent===null) continue;            // el de comprobaciones, si está apagado
          if(hs[i].offsetWidth<80 || hs[i].offsetHeight<12) return false;
          if(hs[i].scrollWidth>hs[i].clientWidth+1) return false;
        }
        return hs.length>=5; })(), document.querySelectorAll('#side h2').length+' títulos');
    ok('ningún botón del panel se queda con el texto cortado', (function(){
        var bs=document.querySelectorAll('#side button, #side .cuenta'), i, malos=[];
        for(i=0;i<bs.length;i++) if(bs[i].scrollWidth>bs[i].clientWidth+1) malos.push(bs[i].id);
        return malos.length===0; })());
  } else {
    out.push('--    la ventana no tiene tamaño de escritorio: no se miden la letra ni los títulos del panel');
  }

  /* --- reiniciar y deshacer ------------------------------------------------------------------- */
  piezas=[]; sel=null; undoStack=[]; banco=null;
  var A4=ponEncargo(E1);
  parte(A4,4,1);
  var t4=sacarTrozo(A4);
  duplicaEn(t4,'d');
  ok('en el tablero hay ya la unidad y dos trozos', piezas.length===3, piezas.length);
  reinicia();
  ok('reiniciar deja el mismo encargo con la referencia sola',
     piezas.length===1 && piezas[0].tipo==='r' && piezas[0].a===1 &&
     encargo.p===5 && encargo.q===6, piezas.length+' pieza(s)');
  doUndo();
  ok('y deshacer devuelve lo que había', piezas.length===3, piezas.length);
  undoStack=[];
  piezas=[]; sel=null; banco=null;
  var A5=ponEncargo(E1);
  parte(A5,2,1);
  var t5=sacarTrozo(A5);
  probar(t5);
  ok('llevar al banco deja un patrón y un mantel tuyo',
     !!patron() && !!tuMantel() && !!banco);
  doUndo();
  ok('y deshacer se lo lleva entero, banco incluido',
     !patron() && !tuMantel() && !banco, piezas.length+' piezas');

  piezas=antesP; sel=antesS; view=antesV; opt.iman=antesI; opt.etiq=antesE;
  opt.comp=antesC; undoStack=antesU; banco=antesB; encargo=antesEnc;
  selK=antesK; modoSel=antesM; opt.alfa=antesA; flashMsg=null;
  cachePartes=''; cacheBanco=''; cacheMedir=''; cacheEnc='';
  draw();

  }catch(errT){
    fails++;
    out.push('FALLO se ha cortado aquí: '+((errT&&errT.message)||errT));
    if(errT&&errT.stack) String(errT.stack).split('\n').slice(0,5).forEach(function(l){
      out.push('        '+l.trim()); });
    try{ draw(); }catch(e2){}
  }

  /* --- informe ------------------------------------------------------------------------------- */
  var texto=out.join('\n')+'\n\n'+(fails? fails+' PRUEBAS FALLIDAS de '+out.length
                                         : 'LAS '+out.length+' PRUEBAS CORRECTAS');
  var box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;background:#fff;z-index:99;overflow:auto;padding:18px 22px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
  box.innerHTML='<div style="font:600 15px/1.3 -apple-system,Segoe UI,Roboto,sans-serif;margin-bottom:4px">'+
      'Autocomprobación de Manteles a medida</div>'+
    '<div style="font:13px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;color:'+(fails?'#c2410c':'#15803d')+';font-weight:600;margin-bottom:12px">'+
      (fails? fails+' pruebas fallidas de '+out.length : 'Las '+out.length+' pruebas correctas')+'</div>'+
    '<button id="cpTest" style="font:13px -apple-system,Segoe UI,Roboto,sans-serif;padding:6px 12px;margin-bottom:14px;'+
      'border:1px solid #d5d9e0;border-radius:7px;background:#fff;cursor:pointer">Copiar informe</button> '+
    '<button id="clTest" style="font:13px -apple-system,Segoe UI,Roboto,sans-serif;padding:6px 12px;margin-bottom:14px;'+
      'border:1px solid #d5d9e0;border-radius:7px;background:#fff;cursor:pointer">Cerrar y usar el manipulativo</button>'+
    '<pre style="white-space:pre-wrap;margin:0">'+
      out.map(function(l){ return l.indexOf('FALLO')===0
        ? '<span style="color:#c2410c;font-weight:700">'+l+'</span>' : l; }).join('\n')+'</pre>';
  document.body.appendChild(box);
  document.getElementById('cpTest').addEventListener('click',function(){
    var ta=document.createElement('textarea'); ta.value=texto; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); }catch(err){}
    document.body.removeChild(ta); this.textContent='Copiado ✓';
  });
  document.getElementById('clTest').addEventListener('click',function(){ box.remove(); });
}
var testLanzado=false;
function lanzarTest(){ if(testLanzado) return; testLanzado=true; runSelfTest(); }
if((location.hash||'').indexOf('test')>=0) setTimeout(lanzarTest,60);
window.addEventListener('hashchange',function(){
  if((location.hash||'').indexOf('test')>=0) lanzarTest();
});

window.__mantelesAMedida={
  test:runSelfTest, L:L, MAXD:MAXD, NIVELES:NIVELES, FORMAS:FORMAS, opt:opt,
  piezas:function(){ return piezas; }, sel:function(){ return sel; },
  encargo:function(){ return encargo; }, banco:function(){ return banco; },
  ancho:ancho, alto:alto, areaDe:areaDe, areaCelda:areaCelda,
  marcasX:marcasX, marcasY:marcasY, parte:parte, sacarTrozo:sacarTrozo, separar:separar,
  duplica:duplica, corta:corta, copiaEntera:copiaEntera, partes:partes, parteEn:parteEn, rectParte:rectParte,
  selK:function(){ return selK; }, modoSel:function(){ return modoSel; }, ponModoSel:ponModoSel,
  seleccionaEn:seleccionaEn, nuevoTrozo:nuevoTrozo, ajustaEtiqueta:ajustaEtiqueta, pxEtiqueta:pxEtiqueta,
  undo:doUndo,
  duplicaEn:duplicaEn, grupoDe:grupoDe, unir:unir, rectanguloDe:rectanguloDe,
  probar:probar, patron:patron, tuMantel:tuMantel, refTrabajo:refTrabajo, enBanco:enBanco,
  enU:enU, valorCelda:valorCelda, medidaDe:medidaDe, partePatron:partePatron,
  trozosSobre:trozosSobre, textoCartel:textoCartel, textoFrac:textoFrac,
  ponEncargo:ponEncargo, reinicia:reinicia, cajaTodo:cajaTodo,
  encargoAlAzar:encargoAlAzar, encargoConcreto:encargoConcreto,
  objetivoValido:objetivoValido, referenciaValida:referenciaValida, pasoDirecto:pasoDirecto,
  hayRutaDirecta:hayRutaDirecta, hayRutaPorLaUnidad:hayRutaPorLaUnidad, alcanzable:alcanzable,
  leeFraccion:leeFraccion, leeEncargoTexto:leeEncargoTexto,
  reduce:reduce, divFrac:divFrac, sumaFrac:sumaFrac, multFrac:multFrac,
  aplicaIman:aplicaIman, load:loadData, setMode:function(m){ importMode=m; },

};

})();
