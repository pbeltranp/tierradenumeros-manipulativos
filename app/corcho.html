<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Corcho geométrico · manipulativo virtual</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
       font-size:14px;color:#2b2f36;background:#fff;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #app{display:flex;height:100%;width:100%}

  #side{width:180px;flex:0 0 180px;background:#f4f5f7;border-right:1px solid #dfe2e7;
        overflow-y:auto;padding:10px 10px 24px}
  #side h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8a919c;margin:14px 0 7px;font-weight:600}
  #side h2:first-child{margin-top:2px}
  #swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
  .sw{width:100%;aspect-ratio:1;min-height:20px;border-radius:5px;border:1px solid rgba(0,0,0,.16);cursor:pointer;padding:0}
  .sw.on{outline:2px solid #2f62a8;outline-offset:1px}
  #custom{margin-top:7px;display:flex;align-items:center;gap:6px;font-size:11px;color:#6b7280}
  #custom input{width:26px;height:24px;padding:0;border:1px solid #d5d9e0;border-radius:5px;background:none;cursor:pointer}
  .act{display:block;width:100%;text-align:left;border:1px solid #e3e6eb;background:#fff;border-radius:7px;
       padding:6px 9px;margin-bottom:4px;font-size:12.5px;color:#3d4450;cursor:pointer}
  .act:hover:not(:disabled){background:#f0f2f5;border-color:#c8cdd6}
  .act:disabled{opacity:.42;cursor:default}
  .act kbd{float:right;font:inherit;font-size:10.5px;color:#9aa1ab}
  #medidas{font-size:11.5px;color:#6b7280;line-height:1.65;margin-top:12px;border-top:1px solid #e3e6eb;padding-top:9px}
  #medidas b{color:#2b2f36}
  #medidas .g{color:#9aa1ab}
  .note{font-size:10.5px;line-height:1.45;color:#8a919c;margin-top:12px}

  main{flex:1;display:flex;flex-direction:column;min-width:0}
  #toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:7px 9px;
           border-bottom:1px solid #dfe2e7;background:#fafbfc}
  .btn{border:1px solid #d5d9e0;background:#fff;border-radius:7px;padding:5px 9px;font-size:12.5px;
       color:#3d4450;cursor:pointer;display:inline-flex;align-items:center;gap:5px;line-height:1.2}
  .btn:hover{background:#f0f2f5}
  .btn.on{background:#2f62a8;border-color:#2f62a8;color:#fff}
  .btn.on:hover{background:#2a589a}
  #toolbar .sep{width:1px;height:20px;background:#dfe2e7;margin:0 3px}
  .chk{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#4a515c;cursor:pointer;padding:3px 6px;border-radius:6px}
  .chk:hover{background:#eff1f4}
  .chk input{margin:0;cursor:pointer}
  #avanzado{display:none;align-items:center;gap:5px}
  #avanzado.show{display:inline-flex}
  #stage{position:relative;flex:1;min-height:0;background:#fff}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #hint{position:absolute;left:10px;bottom:10px;background:rgba(28,32,38,.82);color:#fff;font-size:11.5px;
        padding:5px 10px;border-radius:14px;pointer-events:none;max-width:calc(100% - 20px)}
  #info{position:absolute;right:10px;top:10px;width:292px;background:#fff;border:1px solid #dfe2e7;
        border-radius:10px;padding:11px 13px;font-size:11.5px;line-height:1.55;color:#4a515c;
        box-shadow:0 6px 22px rgba(20,25,35,.12);display:none}
  #info.show{display:block}
  #info b{color:#2b2f36}
  #info a{color:#2f62a8}
  #info .lic{margin-top:11px;padding-top:8px;border-top:1px solid #eef0f3;font-size:10.5px;
             line-height:1.5;color:#8a919c}
  #drop{position:absolute;inset:0;background:rgba(47,98,168,.08);border:2px dashed #2f62a8;
        display:none;align-items:center;justify-content:center;font-size:15px;color:#2f62a8;font-weight:600}
  #drop.show{display:flex}
  @media (max-width:640px){
    #side{width:130px;flex:0 0 130px;padding:8px 6px}
    #swatches{grid-template-columns:repeat(4,1fr)}
    .btn{padding:5px 7px;font-size:12px}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <h2>Color</h2>
    <div id="swatches"></div>
    <div id="custom"><input type="color" id="cpick" value="#d23b30">otro</div>

    <h2>Seleccionado</h2>
    <button class="act" id="pintar" disabled>Pintar<kbd>P</kbd></button>
    <button class="act" id="cerrar" disabled>Abrir / cerrar<kbd>C</kbd></button>
    <button class="act" id="nudos" disabled title="Anudado, cada tramo se queda con su trozo de cuerda; sin nudos, la cuerda corre por las chinchetas">Anudar<kbd>N</kbd></button>
    <button class="act" id="tapar" disabled title="Tapado, el rotulador se mueve sin pintar">Tapar<kbd>T</kbd></button>
    <button class="act" id="voltear" disabled title="Le da la vuelta a la pieza de plástico, como al darle la vuelta sobre el corcho">Dar la vuelta<kbd>V</kbd></button>
    <button class="act" id="borrar" disabled>Quitar<kbd>Supr</kbd></button>

    <div id="medidas"></div>
    <div class="note">Aquí no hay retícula: las chinchetas van donde quieras y las figuras se deforman al moverlas.</div>
  </aside>

  <main>
    <div id="toolbar">
      <button class="btn on" data-tool="pin" title="Poner chinchetas (1)">📌 Chincheta</button>
      <button class="btn" data-tool="goma" title="Poner una goma (2)">◯ Goma</button>
      <button class="btn" data-tool="cordel" title="Poner un cordel (3)">～ Cordel</button>
      <button class="btn" data-tool="plastico" title="Poner una pieza de plástico duro, que no se deforma (4)">▰ Plástico</button>
      <button class="btn" data-tool="rot" title="Poner un rotulador en el corcho (5)">✎ Rotulador</button>
      <button class="btn" data-tool="move" title="Mover chinchetas y figuras (6)">✥ Mover</button>
      <button class="btn" data-tool="del" title="Quitar (7)">✕ Quitar</button>
      <button class="btn" id="varias" title="Seleccionar varias, sin teclado: cada toque añade o quita una chincheta o un rotulador, arrastrar en el vacío hace una caja y arrastrar una seleccionada las mueve todas (como con Mayús) (S)">⬚ Varias</button>
      <span class="sep"></span>
      <button class="btn" id="undo" title="Deshacer (Ctrl+Z)">↶</button>
      <label class="chk" title="Muestra el recuento de vértices y lados y las medidas"><input type="checkbox" id="avz">Comprobaciones</label>
      <span id="avanzado">
        <label class="chk" title="Escribe cuántos vértices y lados tiene cada figura"><input type="checkbox" id="showcta">Vértices y lados</label>
        <label class="chk" title="Muestra el perímetro y el área"><input type="checkbox" id="showmed">Medidas</label>
      </span>
      <button class="btn" id="fondo" title="Fondo blanco o de corcho">▨ Corcho</button>
      <span class="sep"></span>
      <button class="btn" id="zoomout">−</button>
      <button class="btn" id="zoomin">+</button>
      <button class="btn" id="fit">Ajustar</button>
      <span class="sep"></span>
      <button class="btn" id="save" title="Descargar en un archivo">⤓ Guardar</button>
      <button class="btn" id="open" title="Abrir un archivo guardado">⤒ Abrir</button>
      <button class="btn" id="add" title="Añadir el contenido de un archivo">＋</button>
      <button class="btn" id="png" title="Descargar imagen">⤓ PNG</button>
      <button class="btn" id="limpiaTinta" title="Borrar solo lo dibujado con el rotulador">Borrar tinta</button>
      <button class="btn" id="clear">Limpiar</button>
      <button class="btn" id="help">?</button>
      <input type="file" id="fileIn" accept=".json,application/json" style="display:none">
    </div>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="hint"></div>
      <div id="info"></div>
      <div id="drop">Suelta aquí el archivo del corcho</div>
    </div>
  </main>
</div>

<script>
"use strict";
(function(){

/* =========================================================================
   1. ESTADO
   Un corcho sin retícula: las chinchetas van donde se quiera. Las figuras no
   guardan coordenadas, sino a qué chinchetas están atadas, así que al mover
   una chincheta la figura se deforma sola. Los rotuladores son chinchetas
   con rot:true, y `sel` puede ser una figura o un rotulador.
   ========================================================================= */
var chinchetas=[], figuras=[], trazos=[], nid=1, sel=null;
var tool='pin', color='#d23b30';
var view={x:0,y:0,z:1};
var drag=null, borrador=null, undoStack=[], importMode='replace';
var multi=[];                               // chinchetas y rotuladores seleccionados a la vez
var modoVarias=false;                       // el botón ⬚ Varias: como tener Mayús pulsada
var opt={cta:0, med:0, fondo:0};

var COLORS=['#d23b30','#e8890c','#e3b90b','#4f9e3f','#2f8f86','#2f62a8',
            '#6c4bb6','#c2418c','#8d6e5a','#7c8794','#2b2f36','#ffffff'];

var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var stage=document.getElementById('stage');
var hintEl=document.getElementById('hint'), infoEl=document.getElementById('info');
var dropEl=document.getElementById('drop'), medEl=document.getElementById('medidas');
var flashMsg=null, flashT=0;

function pin(id){ for(var i=0;i<chinchetas.length;i++) if(chinchetas[i].id===id) return chinchetas[i]; return null; }
function fig(id){ for(var i=0;i<figuras.length;i++) if(figuras[i].id===id) return figuras[i]; return null; }
function pts(f){ return f.pins.map(pin).filter(Boolean); }
function pushUndo(){ undoStack.push(JSON.stringify({c:chinchetas,f:figuras,t:trazos,n:nid}));
  if(undoStack.length>80) undoStack.shift(); }
function doUndo(){ if(!undoStack.length){ flash('No hay nada que deshacer'); return; }
  var st=JSON.parse(undoStack.pop());
  chinchetas=st.c; figuras=st.f; trazos=st.t; nid=st.n; sel=null; borrador=null;
  multi=multi.filter(function(id){ return !!pin(id); }); draw(); }
function flash(m){ flashMsg=m; flashT=Date.now(); draw(); setTimeout(draw,2200); }

/* =========================================================================
   2. MEDIDAS
   ========================================================================= */
function dist(a,b){ return Math.hypot(b.x-a.x, b.y-a.y); }
function longitud(f){
  var p=pts(f), s=0;
  for(var i=0;i+1<p.length;i++) s+=dist(p[i],p[i+1]);
  if(f.cerrada && p.length>2) s+=dist(p[p.length-1],p[0]);
  return s;
}
function area(f){
  if(!f.cerrada) return 0;
  var p=pts(f); if(p.length<3) return 0;
  var s=0;
  for(var i=0;i<p.length;i++){ var q=p[(i+1)%p.length]; s += p[i].x*q.y - q.x*p[i].y; }
  return Math.abs(s)/2;
}
/* EL CORDEL
   Es una sola cuerda de longitud fija, atada por los dos extremos, que CORRE
   por las chinchetas de en medio, como un cordel de verdad enrollado en ellas:
   lo que se conserva es la longitud total, no la de cada tramo. Es lo que hace
   falta para el trazado del jardinero, con el rotulador en medio del cordel.
   Si se anuda en cada chincheta, cada tramo pasa a ser un trozo de cuerda con
   su propia longitud (f.nudos y f.Ls).
   Una «pieza» es un trozo de cuerda entre dos nudos, {segs, L, j0}: la suma de
   sus tramos no puede pasar de L. La goma, en cambio, se estira sin límite. */
function tramos(f){
  var p=pts(f), s=[];
  for(var i=0;i+1<p.length;i++) s.push([p[i],p[i+1]]);
  if(f.cerrada && p.length>2) s.push([p[p.length-1],p[0]]);
  return s;
}
function largoSegs(ss){ var s=0; for(var i=0;i<ss.length;i++) s+=dist(ss[i][0],ss[i][1]); return s; }
function piezas(f){
  if(f.tipo!=='cordel') return [];
  var ts=tramos(f);
  if(!ts.length) return [];
  if(f.nudos && f.Ls && f.Ls.length===ts.length)
    return ts.map(function(s,j){ return {segs:[s], L:f.Ls[j], j0:j}; });
  return [{segs:ts, L:(isFinite(f.L)?f.L:largoSegs(ts)), j0:0}];
}
function fijaLongitud(f){                  // se ata tenso, con lo que mide ahora
  if(f.tipo!=='cordel') return f;
  var ts=tramos(f);
  f.L=largoSegs(ts);
  if(f.nudos) f.Ls=ts.map(function(s){ return dist(s[0],s[1]); }); else delete f.Ls;
  return f;
}
/* Cuánta cuerda hay en cada tramo. Lo que sobra en una pieza se reparte entre
   sus tramos en proporción a lo que miden: es lo que se dibuja como panza. */
function arcos(f){
  var ts=tramos(f), out=ts.map(function(s){ return dist(s[0],s[1]); });
  piezas(f).forEach(function(pz){
    var ds=pz.segs.map(function(s){ return dist(s[0],s[1]); }), sd=0, k;
    for(k=0;k<ds.length;k++) sd+=ds[k];
    var sob=pz.L-sd; if(!(sob>0)) return;
    for(k=0;k<ds.length;k++) out[pz.j0+k]=ds[k]+(sd>1e-9 ? sob*ds[k]/sd : sob/ds.length);
  });
  return out;
}
function largoCordel(f){ var a=arcos(f), s=0; for(var i=0;i<a.length;i++) s+=a[i]; return s; }
function cordelEstirado(){
  for(var i=0;i<figuras.length;i++){
    var ps=piezas(figuras[i]);
    for(var j=0;j<ps.length;j++) if(largoSegs(ps[j].segs) > ps[j].L+1e-6) return figuras[i];
  }
  return null;
}
function holgura(f){                       // cuerda que sobra, sumando piezas
  var s=0;
  piezas(f).forEach(function(pz){ s+=Math.max(0, pz.L-largoSegs(pz.segs)); });
  return s;
}
/* Anudar reparte la cuerda entre los tramos tal y como está ahora; desanudar
   la junta otra vez en una sola. En ningún caso cambia la longitud total. */
function anudar(f,si){
  if(f.tipo!=='cordel' || !!f.nudos===!!si) return;
  var a=arcos(f);
  if(si){ f.Ls=a; f.nudos=true; }
  else { var s=0; a.forEach(function(v){ s+=v; }); f.L=s; f.nudos=false; delete f.Ls; }
}
/* Lleva el estado hasta donde el cordel dé de sí. `aplicar(t)` coloca el
   movimiento completo cuando t=1 y el punto de partida cuando t=0; si al
   final se pasa, se busca por bisección el instante justo en que el cordel
   queda tenso, para que se pueda alcanzar de verdad y no quede holgura. */
var topeT=1;                               // hasta dónde llegó el último hastaElTope
function hastaElTope(aplicar){
  aplicar(1); topeT=1;
  if(!estadoRoto()) return true;
  var lo=0, hi=1;
  for(var i=0;i<34;i++){
    var m=(lo+hi)/2;
    aplicar(m);
    if(estadoRoto()) hi=m; else lo=m;
  }
  aplicar(lo); topeT=lo;
  return false;
}

/* EL PLÁSTICO DURO
   Cada lado es una tira rígida: no cambia de longitud ni se dobla (f.D, la
   longitud de cada tramo). Las chinchetas hacen de bisagra y de clavo a la vez.
   Al tirar de una chincheta (moverPieza):
   · si solo le llega un lado de plástico (un extremo), ese lado gira alrededor
     de la chincheta vecina, que hace de clavo, y lo demás no se mueve;
   · si le llegan dos o más (una intermedia, o un vértice de una figura
     cerrada), no puede moverse sin desclavar las otras: la pieza se traslada
     entera, con las de plástico que compartan chincheta con ella.
   Así las figuras cerradas no cambian nunca de forma. Por el borde se
   traslada, y con el asa gira. Es cinemática directa: no hace falta solver. */
function fijaForma(f){
  if(f.tipo!=='plastico') return f;
  f.D=tramos(f).map(function(s){ return dist(s[0],s[1]); });
  return f;
}
function rigidoRoto(){
  for(var a=0;a<figuras.length;a++){
    var f=figuras[a];
    if(f.tipo!=='plastico' || !f.D) continue;
    var ts=tramos(f);
    if(f.D.length!==ts.length) continue;
    for(var j=0;j<ts.length;j++) if(Math.abs(dist(ts[j][0],ts[j][1])-f.D[j])>1e-4) return f;
  }
  return null;
}
/* las chinchetas unidas a esta por un lado de plástico */
function vecinosPlastico(id){
  var v=[];
  figuras.forEach(function(f){
    if(f.tipo!=='plastico') return;
    tramos(f).forEach(function(s){
      var o=(s[0].id===id)?s[1]:(s[1].id===id)?s[0]:null;
      if(o && v.indexOf(o)<0) v.push(o);
    });
  });
  return v;
}
function estadoRoto(){ return cordelEstirado() || rigidoRoto(); }
function enPlastico(id){
  return figuras.some(function(f){ return f.tipo==='plastico' && f.pins.indexOf(id)>=0; });
}
/* las chinchetas que van con estas: las de las piezas de plástico que las tocan */
function componente(ids){
  var set={}, cambio=true;
  ids.forEach(function(i){ set[i]=1; });
  while(cambio){
    cambio=false;
    figuras.forEach(function(f){
      if(f.tipo!=='plastico') return;
      if(f.pins.some(function(k){ return set[k]; }))
        f.pins.forEach(function(k){ if(!set[k]){ set[k]=1; cambio=true; } });
    });
  }
  return Object.keys(set).map(Number);
}
function giro(base,cx,cy,th){
  return function(t){
    var c=Math.cos(th*t), s=Math.sin(th*t);
    base.forEach(function(b){ var dx=b.x-cx, dy=b.y-cy; b.q.x=cx+c*dx-s*dy; b.q.y=cy+s*dx+c*dy; });
  };
}
function baseDe(ids){ return ids.map(pin).filter(Boolean).map(function(q){ return {q:q, x:q.x, y:q.y}; }); }
/* Devuelve si la chincheta ha llegado adonde se tira. Girando alrededor de la
   vecina no llega salvo que se tire justo sobre la circunferencia: se queda en
   la dirección del ratón, como un compás. */
function moverPieza(p,x,y){
  var v=vecinosPlastico(p.id);
  if(v.length===1){                               // un extremo: gira sobre su vecina
    var N=v[0];
    if(dist(p,N)<1e-9 || Math.hypot(x-N.x,y-N.y)<1e-9) return false;
    var th=Math.atan2(y-N.y,x-N.x)-Math.atan2(p.y-N.y,p.x-N.x);
    while(th>Math.PI) th-=2*Math.PI;
    while(th<=-Math.PI) th+=2*Math.PI;
    hastaElTope(giro([{q:p, x:p.x, y:p.y}],N.x,N.y,th));
    return Math.hypot(p.x-x,p.y-y)<1e-9;
  }
  var base=baseDe(componente([p.id])), dx=x-p.x, dy=y-p.y;   // se desclava y va entera
  return hastaElTope(function(t){ base.forEach(function(b){ b.q.x=b.x+dx*t; b.q.y=b.y+dy*t; }); });
}
function centro(f){
  var p=pts(f), cx=0, cy=0;
  p.forEach(function(q){ cx+=q.x; cy+=q.y; });
  return {x:cx/p.length, y:cy/p.length};
}
/* Trozos de cuerda que sujetan a la chincheta `id`. */
function restricciones(id){
  var rs=[];
  figuras.forEach(function(f){
    if(f.tipo!=='cordel' || f.pins.indexOf(id)<0) return;
    piezas(f).forEach(function(pz){
      for(var k=0;k<pz.segs.length;k++)
        if(pz.segs[k][0].id===id || pz.segs[k][1].id===id){ rs.push(pz); return; }
    });
  });
  return rs;
}
function pasada(rs){
  for(var i=0;i<rs.length;i++) if(largoSegs(rs[i].segs) > rs[i].L+1e-6) return true;
  return false;
}
/* Lleva la chincheta p, que está en el sitio al que se tira, al borde de cada
   trozo de cuerda que se pase. Cada trozo deja a p en una región convexa (la
   suma de distancias es convexa), así que proyectar por turnos converge, y el
   paso de Newton a lo largo del gradiente nunca se mete dentro: la función
   convexa queda por encima de su tangente. */
function aLaCuerda(p,rs){
  for(var vuelta=0;vuelta<200;vuelta++){
    var quieto=true;
    for(var k=0;k<rs.length;k++){
      var r=rs[k];
      for(var it=0;it<60;it++){
        var e=largoSegs(r.segs)-r.L;
        if(e<=1e-9) break;
        if(e>1e-7) quieto=false;
        var gx=0, gy=0;
        for(var j=0;j<r.segs.length;j++){
          var s=r.segs[j], q=(s[0]===p)?s[1]:(s[1]===p)?s[0]:null;
          if(!q) continue;
          var dx=p.x-q.x, dy=p.y-q.y, d=Math.hypot(dx,dy);
          if(d<1e-12) continue;
          gx+=dx/d; gy+=dy/d;
        }
        var g2=gx*gx+gy*gy;
        if(g2<1e-12) break;
        p.x-=e*gx/g2; p.y-=e*gy/g2;
      }
    }
    if(quieto) break;
  }
}
/* Mueve una chincheta hacia (x,y). Si el cordel no llega, la deja en el punto
   permitido más cercano: con el cordel tenso, la chincheta RESBALA por donde
   el cordel le deja en vez de quedarse clavada. Devuelve si ha llegado. */
function moverChincheta(id,x,y){
  var p=pin(id); if(!p) return false;
  if(enPlastico(id)) return moverPieza(p,x,y);
  var ax=p.x, ay=p.y, rs=restricciones(id);
  p.x=x; p.y=y;
  if(!rs.length || !pasada(rs)) return true;
  aLaCuerda(p,rs);
  if(pasada(rs)){                      // red de seguridad: hasta donde dé la recta
    var bx=p.x, by=p.y, lo=0, hi=1;
    for(var i=0;i<40;i++){
      var m=(lo+hi)/2; p.x=ax+(bx-ax)*m; p.y=ay+(by-ay)*m;
      if(pasada(rs)) hi=m; else lo=m;
    }
    p.x=ax+(bx-ax)*lo; p.y=ay+(by-ay)*lo;
  }
  return false;
}

/* convexa: todos los giros del contorno en el mismo sentido */
function convexa(f){
  if(!f.cerrada) return false;
  var p=pts(f); if(p.length<3) return false;
  var signo=0;
  for(var i=0;i<p.length;i++){
    var a=p[i], b=p[(i+1)%p.length], c=p[(i+2)%p.length];
    var cr=(b.x-a.x)*(c.y-b.y)-(b.y-a.y)*(c.x-b.x);
    if(Math.abs(cr)<1e-9) continue;
    var s=cr>0?1:-1;
    if(signo===0) signo=s; else if(s!==signo) return false;
  }
  return signo!==0;
}
function num(v){
  var r=Math.round(v*10)/10;
  return (Math.abs(r-Math.round(r))<1e-9 ? String(Math.round(r)) : r.toFixed(1)).replace('.',',');
}

/* =========================================================================
   3. EL ROTULADOR
   Es una pieza más del corcho: se clava como una chincheta ({rot:true, col,
   tapado}), se le atan cordeles y gomas como a cualquier chincheta, y al
   arrastrarlo va dejando tinta. Lo único que lo guía es el cordel: si va
   tenso, el rotulador resbala por donde el cordel le deja (moverChincheta).
   Tapado, se mueve sin pintar. La tinta se queda en el corcho.
   ========================================================================= */
function sumaDist(fs,M){
  var s=0;
  for(var i=0;i<fs.length;i++) s+=Math.hypot(M.x-fs[i].x, M.y-fs[i].y);
  return s;
}
function esRot(p){ return !!(p && p.rot); }
function rotSel(){ var p=(sel!=null)?pin(sel):null; return esRot(p)?p:null; }
function colorValido(c){ return (typeof c==='string' && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(c)) ? c : null; }

/* =========================================================================
   4. DIBUJO
   ========================================================================= */
function w2s(p){ return {x:p.x*view.z+view.x, y:p.y*view.z+view.y}; }
function s2w(p){ return {x:(p.x-view.x)/view.z, y:(p.y-view.y)/view.z}; }
function resize(){
  var r=stage.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  cv.width=Math.max(1,Math.round(r.width*dpr)); cv.height=Math.max(1,Math.round(r.height*dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0); draw();
}
function conAlfa(hex,al){
  var h=(hex||'#d23b30').replace('#',''); if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return 'rgba('+parseInt(h.substr(0,2),16)+','+parseInt(h.substr(2,2),16)+','+parseInt(h.substr(4,2),16)+','+al+')';
}
function azar(x){ var v=Math.sin(x)*43758.5453; return v-Math.floor(v); }
/* Fondo del tablero. En blanco por defecto: las figuras se ven mejor. El corcho
   es un tono cálido con un veteado muy suave, anclado al tablero y no a la
   pantalla, para que no repte al desplazar la vista. */
function drawCorcho(c,W,H,paraExportar){
  if(!opt.fondo) return;
  c.save();
  c.fillStyle='#f4ebdb'; c.fillRect(0,0,W,H);
  var G=90;                                   // separación del veteado, en el tablero
  if(G*view.z>16){
    var i0=Math.floor((0-view.x)/view.z/G)-1, i1=Math.ceil((W-view.x)/view.z/G)+1;
    var j0=Math.floor((0-view.y)/view.z/G)-1, j1=Math.ceil((H-view.y)/view.z/G)+1;
    for(var i=i0;i<=i1;i++) for(var j=j0;j<=j1;j++){
      var r1=azar(i*127.1+j*311.7), r2=azar(i*269.5+j*183.3), r3=azar(i*419.2+j*371.9);
      var q=w2s({x:(i+r1)*G, y:(j+r2)*G});
      var rad=(7+r3*13)*view.z;
      if(q.x<-rad||q.y<-rad||q.x>W+rad||q.y>H+rad) continue;
      c.beginPath();
      if(c.ellipse) c.ellipse(q.x,q.y,rad,rad*(0.45+r1*0.4),r2*3.1416,0,6.2832);
      else c.arc(q.x,q.y,rad,0,6.2832);
      c.fillStyle = r3>0.5 ? 'rgba(157,124,78,.055)' : 'rgba(255,252,246,.45)';
      c.fill();
    }
  }
  c.restore();
}
function drawChincheta(c,p,resaltada,esFoco){
  var q=w2s(p);
  c.save();
  c.beginPath(); c.arc(q.x,q.y+1.5,6.5,0,6.2832);
  c.fillStyle='rgba(60,45,25,.22)'; c.fill();
  var g=c.createRadialGradient(q.x-2,q.y-2.5,1,q.x,q.y,7.5);
  g.addColorStop(0,'#f5f7fa'); g.addColorStop(0.45,'#c3ccd8'); g.addColorStop(1,'#7d8896');
  c.beginPath(); c.arc(q.x,q.y,7,0,6.2832); c.fillStyle=g; c.fill();
  c.lineWidth=1; c.strokeStyle='#5b6470'; c.stroke();
  if(esFoco){
    c.beginPath(); c.arc(q.x,q.y,11,0,6.2832);
    c.lineWidth=2.4; c.strokeStyle='#6c4bb6'; c.stroke();
  }
  if(resaltada){
    c.beginPath(); c.arc(q.x,q.y,13,0,6.2832);
    c.lineWidth=2; c.strokeStyle='#2f62a8'; c.setLineDash([4,3]); c.stroke(); c.setLineDash([]);
  }
  c.restore();
}
/* El rotulador visto desde arriba: el cuerpo del color de la tinta y, si está
   destapado, la punta en el centro con un aro blanco alrededor. Tapado, el
   capuchón entero, con un brillo. */
function drawRotulador(c,p,seleccionado){
  var q=w2s(p), col=p.col||'#d23b30';
  c.save();
  c.beginPath(); c.arc(q.x,q.y+2,9.5,0,6.2832);
  c.fillStyle='rgba(60,45,25,.25)'; c.fill();
  c.beginPath(); c.arc(q.x,q.y,9.5,0,6.2832);
  c.fillStyle=col; c.fill();
  c.lineWidth=1.3; c.strokeStyle='rgba(30,34,40,.55)'; c.stroke();
  if(p.tapado){
    c.beginPath(); c.arc(q.x-2.6,q.y-2.8,3.2,0,6.2832);
    c.fillStyle='rgba(255,255,255,.55)'; c.fill();
    c.beginPath(); c.arc(q.x,q.y,6,0,6.2832);
    c.lineWidth=1; c.strokeStyle='rgba(30,34,40,.35)'; c.stroke();
  } else {
    c.beginPath(); c.arc(q.x,q.y,5.4,0,6.2832);
    c.fillStyle='#fff'; c.fill();
    c.beginPath(); c.arc(q.x,q.y,3,0,6.2832);
    c.fillStyle=col; c.fill();
    c.lineWidth=0.8; c.strokeStyle='rgba(30,34,40,.6)'; c.stroke();
  }
  if(seleccionado){
    c.beginPath(); c.arc(q.x,q.y,14.5,0,6.2832);
    c.lineWidth=2; c.strokeStyle='#2f62a8'; c.setLineDash([4,3]); c.stroke(); c.setLineDash([]);
  }
  c.restore();
}
/* Semiángulo del arco circular que tiene esa cuerda y esa longitud de arco:
   se resuelve θ/senθ = arco/cuerda por bisección. Sin tope, para que al juntar
   las chinchetas la cuerda sobrante siga estando toda ahí: en el límite forma
   un lazo de la longitud del cordel. */
function anguloArco(cuerda,arco){
  if(cuerda<1e-9) return Math.PI;
  var r=arco/cuerda;
  if(r<=1.00001) return 0;
  var lo=1e-7, hi=Math.PI-1e-7;
  for(var i=0;i<70;i++){
    var m=(lo+hi)/2;
    if(m/Math.sin(m) < r) lo=m; else hi=m;
  }
  return (lo+hi)/2;
}
function flechaArco(cuerda,arco){                // altura de la panza
  if(cuerda<1e-9) return arco/Math.PI;           // lazo: el diámetro
  var th=anguloArco(cuerda,arco);
  if(th<=0) return 0;
  var R=cuerda/(2*Math.sin(th));
  return R*(1-Math.cos(th));
}
/* Añade al camino el tramo A→B como arco de circunferencia de longitud `arco`,
   combado hacia (nx,ny). */
function tramoArco(c,A,B,arco,nx,ny){
  var d=dist(A,B), qb=w2s(B), qa=w2s(A);
  if(d<1e-7){                                    // las dos chinchetas, juntas
    var R0=arco/(2*Math.PI), C0=w2s({x:A.x+nx*R0, y:A.y+ny*R0});
    var b0=Math.atan2(qa.y-C0.y, qa.x-C0.x);
    c.arc(C0.x,C0.y,R0*view.z,b0,b0+2*Math.PI,false);
    return;
  }
  var th=anguloArco(d,arco);
  if(th<0.02){ c.lineTo(qb.x,qb.y); return; }    // tenso o casi: recto
  var R=d/(2*Math.sin(th));
  var mx=(A.x+B.x)/2, my=(A.y+B.y)/2, co=Math.cos(th);
  var Cs=w2s({x:mx-nx*R*co, y:my-ny*R*co}), Rs=R*view.z;
  var a0=Math.atan2(qa.y-Cs.y, qa.x-Cs.x), a1=Math.atan2(qb.y-Cs.y, qb.x-Cs.x);
  var dd=a1-a0;
  while(dd<=-Math.PI) dd+=2*Math.PI;
  while(dd>Math.PI) dd-=2*Math.PI;
  var corto=Math.abs(dd), largo=2*Math.PI-corto;
  var usarLargo=Math.abs(largo-2*th)<Math.abs(corto-2*th);
  c.arc(Cs.x,Cs.y,Rs,a0,a1, usarLargo ? (dd>0) : (dd<0));
}
/* Camino del cordel con la cuerda que le sobra repartida entre los tramos.
   Devuelve false si está tenso, y entonces se dibuja recto. */
function caminoCordel(c,f){
  if(f.tipo!=='cordel') return false;
  var p=pts(f); if(p.length<2) return false;
  var segs=tramos(f), ar=arcos(f), j, hay=false;
  for(j=0;j<segs.length;j++)
    if(ar[j] - dist(segs[j][0],segs[j][1]) > 0.6){ hay=true; break; }
  if(!hay) return false;                          // todos los tramos tensos
  var cx=0, cy=0;
  p.forEach(function(q){ cx+=q.x; cy+=q.y; }); cx/=p.length; cy/=p.length;
  var q0=w2s(segs[0][0]);
  c.beginPath(); c.moveTo(q0.x,q0.y);
  segs.forEach(function(s,k){
    var a=s[0], b=s[1], d=dist(a,b);
    var arco=Math.max(d, ar[k]||d);                // cada tramo, con SU sobrante
    var nx, ny;
    if(d<1e-7){ nx=0; ny=-1; }                     // chinchetas juntas: lazo hacia arriba
    else {
      nx=-(b.y-a.y)/d; ny=(b.x-a.x)/d;
      var mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
      if((mx-cx)*nx+(my-cy)*ny < 0){ nx=-nx; ny=-ny; }   // la panza, hacia fuera
    }
    tramoArco(c,a,b,arco,nx,ny);
  });
  if(f.cerrada && p.length>2) c.closePath();
  return true;
}
function rutaFigura(c,f){ if(!caminoCordel(c,f)) trazo(c,f); }
function trazo(c,f,lista){
  var p=lista||pts(f); if(!p.length) return;
  var q=w2s(p[0]);
  c.beginPath(); c.moveTo(q.x,q.y);
  for(var i=1;i<p.length;i++){ var r=w2s(p[i]); c.lineTo(r.x,r.y); }
  if(f && f.cerrada && p.length>2) c.closePath();
}
function drawFigura(c,f,seleccionada){
  var p=pts(f); if(p.length<2) return;
  c.save();
  if(f.cerrada && p.length>2){ rutaFigura(c,f); c.fillStyle=conAlfa(f.col,f.tipo==='plastico'?0.3:0.15); c.fill('evenodd'); }
  if(f.tipo==='plastico'){                       // una tira ancha y translúcida, con el canto marcado
    trazo(c,f); c.lineWidth=11; c.lineJoin='round'; c.lineCap='round';
    c.strokeStyle=conAlfa(f.col,0.45); c.stroke();
    trazo(c,f); c.lineWidth=1.5; c.strokeStyle=f.col; c.stroke();
  } else if(f.tipo==='goma'){
    trazo(c,f); c.lineWidth=7; c.lineJoin='round'; c.lineCap='round';
    c.strokeStyle=conAlfa(f.col,0.30); c.stroke();
    trazo(c,f); c.lineWidth=4.2; c.strokeStyle=f.col; c.stroke();
  } else {
    rutaFigura(c,f); c.lineWidth=3.4; c.lineJoin='round'; c.lineCap='round';
    c.strokeStyle=f.col; c.stroke();
    rutaFigura(c,f); c.lineWidth=1.2; c.strokeStyle='rgba(255,255,255,.55)';
    c.setLineDash([4,4]); c.stroke(); c.setLineDash([]);
  }
  c.restore();
  if(seleccionada){
    c.save(); rutaFigura(c,f);
    c.lineWidth=2; c.strokeStyle='#2f62a8'; c.setLineDash([6,4]); c.stroke();
    c.setLineDash([]); c.restore();
  }
  if(opt.cta && f.cerrada && p.length>2){
    var cx=0, cy=0;
    p.forEach(function(t){ cx+=t.x; cy+=t.y; });
    var cen=w2s({x:cx/p.length, y:cy/p.length});
    var txt=p.length+' vértices · '+p.length+' lados';
    c.save();
    c.font='700 12px -apple-system,Segoe UI,Roboto,sans-serif';
    c.textAlign='center'; c.textBaseline='middle';
    var w=c.measureText(txt).width+12;
    c.fillStyle='rgba(255,255,255,.92)';
    c.beginPath(); c.rect(cen.x-w/2,cen.y-10,w,20); c.fill();
    c.lineWidth=1; c.strokeStyle=conAlfa(f.col,0.5); c.stroke();
    c.fillStyle='#3a4048'; c.fillText(txt,cen.x,cen.y);
    c.restore();
  }
}
function drawTinta(c,t){
  if(t.pts.length<2) return;
  c.save();
  var q=w2s(t.pts[0]);
  c.beginPath(); c.moveTo(q.x,q.y);
  for(var i=1;i<t.pts.length;i++){ var r=w2s(t.pts[i]); c.lineTo(r.x,r.y); }
  c.lineWidth=2.6; c.lineJoin='round'; c.lineCap='round'; c.strokeStyle=t.col; c.stroke();
  c.restore();
}
function escena(c,W,H,paraExportar){
  drawCorcho(c,W,H,paraExportar);
  trazos.forEach(function(t){ drawTinta(c,t); });
  if(drag && drag.tintas) for(var k in drag.tintas) drawTinta(c,drag.tintas[k]);
  figuras.forEach(function(f){ drawFigura(c,f,!paraExportar && f.id===sel); });
  var fp=plasticoSel();
  if(!paraExportar && fp && tool==='move' && pts(fp).length){   // el asa para girar
    var a=asaDe(fp);
    c.save();
    c.beginPath(); c.moveTo(a.x,a.y+10); c.lineTo(a.x,a.y+30);
    c.lineWidth=1.5; c.strokeStyle='rgba(47,98,168,.6)'; c.setLineDash([3,3]); c.stroke(); c.setLineDash([]);
    c.beginPath(); c.arc(a.x,a.y,10,0,6.2832);
    c.fillStyle='#fff'; c.fill(); c.lineWidth=1.6; c.strokeStyle='#2f62a8'; c.stroke();
    c.beginPath(); c.arc(a.x,a.y,5,-2.6,1.9);
    c.lineWidth=1.6; c.stroke();
    var ex=a.x+5*Math.cos(1.9), ey=a.y+5*Math.sin(1.9);
    c.beginPath(); c.moveTo(ex-3.2,ey-0.6); c.lineTo(ex,ey); c.lineTo(ex+0.6,ey-3.4); c.stroke();
    c.restore();
  }
  if(borrador && borrador.pins.length){
    drawFigura(c,borrador,false);
    if(borrador.prev){
      var u=w2s(pin(borrador.pins[borrador.pins.length-1])), v=w2s(borrador.prev);
      c.save(); c.setLineDash([6,5]); c.lineWidth=2; c.strokeStyle=conAlfa(borrador.col,0.7);
      c.beginPath(); c.moveTo(u.x,u.y); c.lineTo(v.x,v.y); c.stroke(); c.restore();
    }
  }
  chinchetas.forEach(function(p){
    if(!esRot(p)) drawChincheta(c,p, !paraExportar && ((drag && drag.mode==='pin' && drag.id===p.id) ||
                                                      multi.indexOf(p.id)>=0), false);
  });
  chinchetas.forEach(function(p){           // los rotuladores, por encima
    if(esRot(p)) drawRotulador(c,p, !paraExportar && (sel===p.id || multi.indexOf(p.id)>=0));
  });
  if(!paraExportar && drag && drag.mode==='caja'){
    var ca=w2s(drag.a), cb=w2s(drag.b);
    c.save();
    c.fillStyle='rgba(47,98,168,.07)'; c.fillRect(Math.min(ca.x,cb.x),Math.min(ca.y,cb.y),Math.abs(cb.x-ca.x),Math.abs(cb.y-ca.y));
    c.setLineDash([5,4]); c.lineWidth=1.3; c.strokeStyle='#2f62a8';
    c.strokeRect(Math.min(ca.x,cb.x)+0.5,Math.min(ca.y,cb.y)+0.5,Math.abs(cb.x-ca.x),Math.abs(cb.y-ca.y));
    c.restore();
  }
}
function draw(){
  var W=cv.width/(window.devicePixelRatio||1), H=cv.height/(window.devicePixelRatio||1);
  ctx.clearRect(0,0,W,H); ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  escena(ctx,W,H,false);
  updateUI();
}

/* =========================================================================
   5. INTERACCIÓN
   ========================================================================= */
function evPos(e){ var r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
function chinchetaEn(wp){
  for(var i=chinchetas.length-1;i>=0;i--)
    if(dist(wp,chinchetas[i])<=13/view.z) return chinchetas[i];
  return null;
}
function distSeg(p,a,b){
  var vx=b.x-a.x, vy=b.y-a.y, L=vx*vx+vy*vy;
  var t=L?((p.x-a.x)*vx+(p.y-a.y)*vy)/L:0; t=Math.max(0,Math.min(1,t));
  return Math.hypot(p.x-(a.x+t*vx), p.y-(a.y+t*vy));
}
function figuraEn(wp){
  for(var i=figuras.length-1;i>=0;i--){
    var f=figuras[i], p=pts(f);
    for(var j=0;j<p.length;j++){
      if(j+1===p.length && !f.cerrada) break;
      if(distSeg(wp,p[j],p[(j+1)%p.length])<=9/view.z) return f;
    }
    if(f.tipo==='plastico' && f.cerrada && p.length>2 && dentroPoli(wp,p)) return f;  // es macizo
  }
  return null;
}
function dentroPoli(q,p){
  var d=false;
  for(var i=0,j=p.length-1;i<p.length;j=i++)
    if(((p[i].y>q.y)!==(p[j].y>q.y)) && q.x < (p[j].x-p[i].x)*(q.y-p[i].y)/(p[j].y-p[i].y)+p[i].x) d=!d;
  return d;
}
function tintaEn(wp){
  for(var i=trazos.length-1;i>=0;i--){
    var t=trazos[i];
    for(var j=0;j+1<t.pts.length;j++)
      if(distSeg(wp,t.pts[j],t.pts[j+1])<=8/view.z) return t;
  }
  return null;
}
function terminaBorrador(){
  if(borrador && borrador.pins.length>=2){
    pushUndo(); delete borrador.prev;
    figuras.push(fijaForma(fijaLongitud(borrador)));  // el cordel queda de esta medida y el plástico, de esta forma
    sel=borrador.id;
  }
  borrador=null;
}
/* Arrastrar una chincheta o un rotulador. Se guarda el desfase entre el
   puntero y el centro para que no pegue un salto al cogerlo. Cada rotulador
   destapado que se mueva durante el arrastre (el que se arrastra o los que
   lleva pegados una pieza de plástico) deja un trazo. Se recorre en pasitos el
   camino del puntero entre dos eventos, para que con el cordel tenso la tinta
   siga la curva y no corte por la cuerda cuando el ratón va rápido. */
function empiezaTinta(){
  var t={};
  chinchetas.forEach(function(p){
    if(esRot(p) && !p.tapado) t[p.id]={id:nid++, col:p.col||color, pts:[{x:p.x, y:p.y}]};
  });
  return t;
}
function hayTinta(){ if(drag && drag.tintas) for(var k in drag.tintas) return true; return false; }
function anota(t,p){
  var u=t.pts[t.pts.length-1];
  if(Math.hypot(p.x-u.x, p.y-u.y) > 0.6/view.z) t.pts.push({x:p.x, y:p.y});
}
function anotaTodos(){
  if(!drag || !drag.tintas) return;
  for(var k in drag.tintas){ var p=pin(+k); if(p) anota(drag.tintas[k],p); }
}
function empiezaArrastre(ch,wp){
  sel=esRot(ch)?ch.id:null;
  drag={mode:'pin', id:ch.id, movido:false, off:{x:ch.x-wp.x, y:ch.y-wp.y}, ultimo:{x:ch.x, y:ch.y},
        tintas:empiezaTinta()};
}
function pasoArrastre(T){                  // T: adonde se tira, en el tablero
  var p=pin(drag.id); if(!p) return;
  if(!drag.movido){ pushUndo(); drag.movido=true; }
  if(hayTinta()){
    var a=drag.ultimo, paso=1.5/view.z;
    var n=Math.max(1, Math.min(600, Math.ceil(dist(a,T)/paso)));
    for(var k=1;k<=n;k++){
      moverChincheta(p.id, a.x+(T.x-a.x)*k/n, a.y+(T.y-a.y)*k/n);
      anotaTodos();
    }
  } else moverChincheta(p.id, T.x, T.y);
  drag.ultimo={x:T.x, y:T.y};
}
function sueltaArrastre(){
  if(drag && drag.tintas && drag.movido)
    for(var k in drag.tintas) if(drag.tintas[k].pts.length>=2) trazos.push(drag.tintas[k]);
  drag=null;
}
/* Girar una pieza de plástico con el asa: alrededor de su centro, con todo lo
   que lleva pegado, en pasitos para que la tinta siga el arco. */
function asaDe(f){
  var p=pts(f).map(w2s), cx=0, top=1e9;
  p.forEach(function(q){ cx+=q.x; top=Math.min(top,q.y); });
  return {x:cx/p.length, y:top-34};
}
function plasticoSel(){ var f=(sel!=null)?fig(sel):null; return (f && f.tipo==='plastico')?f:null; }
function empiezaGiro(f,wp){
  var C=centro(f);
  drag={mode:'girar', id:f.id, C:C, a0:Math.atan2(wp.y-C.y,wp.x-C.x), th:0, movido:false,
        base:baseDe(componente(f.pins)), tintas:empiezaTinta()};
}
function pasoGiro(wp){
  var C=drag.C, th1=Math.atan2(wp.y-C.y,wp.x-C.x)-drag.a0;
  while(th1-drag.th>Math.PI) th1-=2*Math.PI;
  while(th1-drag.th<-Math.PI) th1+=2*Math.PI;
  if(!drag.movido){ pushUndo(); drag.movido=true; }
  var R=0; drag.base.forEach(function(b){ R=Math.max(R,Math.hypot(b.x-C.x,b.y-C.y)); });
  var n=Math.max(1, Math.min(600, Math.ceil(Math.abs(th1-drag.th)*R*view.z/1.5)));
  var th0=drag.th;
  for(var k=1;k<=n;k++){
    var thk=th0+(th1-th0)*k/n, desde=drag.th;
    var ok2=hastaElTope(function(t){ giro(drag.base,C.x,C.y,desde+(thk-desde)*t)(1); });
    drag.th=desde+(thk-desde)*topeT;
    anotaTodos();
    if(!ok2){
      if(!drag.aviso){ drag.aviso=true; flash('Hay algo que no deja girarlo: un cordel tenso u otra pieza'); }
      break;
    }
  }
}
function voltearSel(){
  var f=plasticoSel();
  if(!f){ flash('Selecciona antes una pieza de plástico'); return; }
  var C=centro(f), base=baseDe(componente(f.pins));
  pushUndo();
  base.forEach(function(b){ b.q.x=2*C.x-b.x; });
  if(estadoRoto()){
    base.forEach(function(b){ b.q.x=b.x; });
    undoStack.pop();
    flash('No se le puede dar la vuelta: hay algo que no deja');
  }
  draw();
}
function onDown(e){
  try{ if(cv.setPointerCapture && e.pointerId!==undefined) cv.setPointerCapture(e.pointerId); }catch(er){}
  var sp=evPos(e), wp=s2w(sp), ch=chinchetaEn(wp);

  var fp=plasticoSel();
  if(tool==='move' && fp && dist(sp,asaDe(fp))<=13){ empiezaGiro(fp,wp); draw(); return; }
  /* con el rotulador, pinchar una chincheta la convierte en rotulador, y
     conserva lo que tuviera atado */
  if(tool==='rot' && ch && !esRot(ch)){
    pushUndo(); ch.rot=true; ch.col=color; ch.tapado=false;
    flash('La chincheta ahora es un rotulador'); return;
  }
  /* Selección de varias, con Mayús (o Ctrl) o con el botón ⬚ Varias, que hace
     lo mismo sin teclado, para las pizarras táctiles. Tocar una que no está la
     añade; tocar una que ya está la quita, pero solo si no se arrastra, porque
     arrastrarla mueve todas. Arrastrar en el vacío hace una caja. */
  var suma=!!(e.shiftKey||e.ctrlKey||e.metaKey||modoVarias);
  if(tool==='move' && suma){
    if(ch){
      var ya=multi.indexOf(ch.id)>=0;
      if(!ya) multi.push(ch.id);
      if(multi.length>1)
        drag={mode:'fig', id:null, from:wp, movido:false, base:baseDe(componente(multi)), tintas:empiezaTinta()};
      else empiezaArrastre(ch,wp);
      sel=null; drag.quitarSiClic=ya?ch.id:null;
      draw(); return;
    }
    sel=null;
    drag={mode:'caja', a:wp, b:wp, previo:multi.slice()}; draw(); return;
  }
  if(ch && multi.length>1 && multi.indexOf(ch.id)>=0 && (tool==='pin' || tool==='rot' || tool==='move')){
    sel=null;                                   // se mueven todas las seleccionadas a la vez
    drag={mode:'fig', id:null, from:wp, movido:false, base:baseDe(componente(multi)), tintas:empiezaTinta()};
    draw(); return;
  }
  if(ch && (tool==='pin' || tool==='rot' || tool==='move')){
    multi=[]; empiezaArrastre(ch,wp); draw(); return;
  }
  multi=[];
  if(tool==='pin'){
    pushUndo();
    chinchetas.push({id:nid++, x:wp.x, y:wp.y});
    draw(); return;
  }
  if(tool==='rot'){
    pushUndo();
    /* no se selecciona: si no, al elegir color para lo siguiente se lo cambiaría */
    var r={id:nid++, x:wp.x, y:wp.y, rot:true, col:color, tapado:false};
    chinchetas.push(r); sel=null;
    draw(); return;
  }
  if(tool==='goma'||tool==='cordel'||tool==='plastico'){
    if(!ch){ terminaBorrador(); draw(); return; }
    if(!borrador){ borrador={id:nid++, tipo:tool, pins:[ch.id], cerrada:false, col:color}; draw(); return; }
    var ult=borrador.pins[borrador.pins.length-1];
    if(ch.id===ult){ terminaBorrador(); draw(); return; }
    if(borrador.pins.length>=3 && ch.id===borrador.pins[0]){
      borrador.cerrada=true; terminaBorrador(); draw(); return; }
    if(borrador.pins.indexOf(ch.id)>=0){ flash('Esa chincheta ya está en la figura'); draw(); return; }
    borrador.pins.push(ch.id); draw(); return;
  }
  if(tool==='del'){
    if(ch){ pushUndo(); quitaChincheta(ch.id); if(sel===ch.id) sel=null; draw(); return; }
    var ft=figuraEn(wp);
    if(ft){ pushUndo(); figuras=figuras.filter(function(q){return q!==ft;}); if(sel===ft.id) sel=null; draw(); return; }
    var tt=tintaEn(wp);
    if(tt){ pushUndo(); trazos=trazos.filter(function(q){return q!==tt;}); draw(); return; }
    return;
  }
  /* mover */
  var fm=figuraEn(wp);
  if(fm){ sel=fm.id;                          // con ella van las piezas de plástico que toque
    drag={mode:'fig', id:fm.id, from:wp, movido:false, base:baseDe(componente(fm.pins)), tintas:empiezaTinta()};
    draw(); return; }
  sel=null;
  drag={mode:'pan', sp:sp, v0:{x:view.x,y:view.y}};
  draw();
}
/* Al quitar una chincheta, el cordel se suelta de ella como uno de verdad:
   si estaba en medio, la cuerda sigue entera y ahora va directa entre las
   vecinas (y le sobra); si era un extremo, ese tramo se va con ella. Anudado,
   los dos tramos que llegaban a la chincheta se juntan en uno. */
function sueltaDeCordel(f,id){
  var n=f.pins.length, k=f.pins.indexOf(id);
  var ar=arcos(f), ts=tramos(f), largo={}, j;
  for(j=0;j<ts.length;j++) largo[ts[j][0].id+'>'+ts[j][1].id]=ar[j];
  var esExtremo=!(f.cerrada && n>2) && (k===0 || k===n-1);
  var total=largoCordel(f);
  if(esExtremo) total-=ar[k===0?0:n-2];
  f.pins.splice(k,1);
  if(f.pins.length<3) f.cerrada=false;
  if(f.nudos){
    f.Ls=tramos(f).map(function(s){
      var a=s[0].id, b=s[1].id;
      if(largo[a+'>'+b]!==undefined) return largo[a+'>'+b];
      if(largo[a+'>'+id]!==undefined && largo[id+'>'+b]!==undefined) return largo[a+'>'+id]+largo[id+'>'+b];
      return dist(s[0],s[1]);
    });
  } else {
    f.L=Math.max(total, largoSegs(tramos(f)));
  }
}
function quitaChincheta(id){
  figuras.forEach(function(f){
    if(f.pins.indexOf(id)<0) return;
    if(f.tipo==='cordel') sueltaDeCordel(f,id);
    else { f.pins=f.pins.filter(function(k){return k!==id;}); if(f.pins.length<3) f.cerrada=false; fijaForma(f); }
  });
  chinchetas=chinchetas.filter(function(p){return p.id!==id;});
  figuras=figuras.filter(function(f){return f.pins.length>=2;});
  if(borrador){ borrador.pins=borrador.pins.filter(function(k){return k!==id;}); }
  multi=multi.filter(function(k){ return k!==id; });
}
function onMove(e){
  var sp=evPos(e), wp=s2w(sp);
  if(!drag){
    if(borrador && borrador.pins.length){ borrador.prev=wp; draw(); }
    return;
  }
  if(drag.mode==='pan'){ view.x=drag.v0.x+(sp.x-drag.sp.x); view.y=drag.v0.y+(sp.y-drag.sp.y); draw(); return; }
  if(drag.mode==='pin'){
    if(!drag.movido && Math.hypot(wp.x+drag.off.x-drag.ultimo.x, wp.y+drag.off.y-drag.ultimo.y)*view.z<2) return;
    pasoArrastre({x:wp.x+drag.off.x, y:wp.y+drag.off.y});
    draw(); return;
  }
  if(drag.mode==='fig'){
    if(!drag.movido){
      if(Math.hypot(wp.x-drag.from.x, wp.y-drag.from.y)*view.z<2) return;   // un toque no es arrastrar
      pushUndo(); drag.movido=true;
    }
    var dx=wp.x-drag.from.x, dy=wp.y-drag.from.y;
    var ok2=hastaElTope(function(t){
      drag.base.forEach(function(b){ b.q.x=b.x+dx*t; b.q.y=b.y+dy*t; });
    });
    anotaTodos();
    if(!ok2 && !drag.aviso){ drag.aviso=true; flash('Hay algo que no deja: un cordel tenso u otra pieza'); }
    draw(); return;
  }
  if(drag.mode==='girar'){ pasoGiro(wp); draw(); return; }
  if(drag.mode==='caja'){ drag.b=wp; draw(); return; }
}
function enCaja(a,b){
  var x0=Math.min(a.x,b.x), x1=Math.max(a.x,b.x), y0=Math.min(a.y,b.y), y1=Math.max(a.y,b.y);
  return chinchetas.filter(function(p){ return p.x>=x0 && p.x<=x1 && p.y>=y0 && p.y<=y1; })
                   .map(function(p){ return p.id; });
}
function onUp(){
  if(!drag) return;
  if(drag.mode==='caja'){
    var nuevas=enCaja(drag.a,drag.b);
    multi=drag.previo.slice();
    nuevas.forEach(function(id){ if(multi.indexOf(id)<0) multi.push(id); });
    drag=null; draw(); return;
  }
  if(drag.quitarSiClic!=null && !drag.movido) multi=multi.filter(function(id){ return id!==drag.quitarSiClic; });
  sueltaArrastre(); draw();
}
stage.addEventListener('wheel',function(e){
  e.preventDefault();
  var sp=evPos(e), antes=s2w(sp);
  view.z=Math.max(0.2,Math.min(4,view.z*Math.exp(-e.deltaY*0.0015)));
  var desp=s2w(sp);
  view.x+=(desp.x-antes.x)*view.z; view.y+=(desp.y-antes.y)*view.z;
  draw();
},{passive:false});
cv.addEventListener('pointerdown',onDown);
window.addEventListener('pointermove',onMove);
window.addEventListener('pointerup',onUp);
window.addEventListener('pointercancel',onUp);
cv.addEventListener('dblclick',function(){ if(borrador){ terminaBorrador(); draw(); } });

window.addEventListener('keydown',function(e){
  var t=(e.target&&e.target.tagName)||''; if(t==='INPUT') return;
  var k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='z'){ doUndo(); e.preventDefault(); return; }
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(k==='escape'){ borrador=null; sel=null; multi=[]; draw(); }
  else if(e.key==='Delete'||e.key==='Backspace'){
    if(sel!=null || multi.length){ quitaSel(); e.preventDefault(); } }
  else if(k==='enter'){ if(borrador){ terminaBorrador(); draw(); } }
  else if(k==='p'){ pintaSel(); }
  else if(k==='c'){ cerrarAbrir(); }
  else if(k==='n'){ nudosSel(); }
  else if(k==='t'){ taparSel(); }
  else if(k==='v'){ voltearSel(); }
  else if(k==='s'){ alternaVarias(); }
  else if(k==='1') setTool('pin');
  else if(k==='2') setTool('goma');
  else if(k==='3') setTool('cordel');
  else if(k==='4') setTool('plastico');
  else if(k==='5') setTool('rot');
  else if(k==='6') setTool('move');
  else if(k==='7') setTool('del');
});
function cerrarAbrir(){
  var f=(sel!=null)?fig(sel):null;
  if(!f){ flash('Selecciona antes una figura'); return; }
  if(f.pins.length<3) return;
  pushUndo();
  if(f.tipo==='cordel'){
    /* se añade o se quita cuerda solo para el tramo de cierre: lo demás sigue igual */
    var p=pts(f), cierre=dist(p[p.length-1],p[0]);
    if(!f.cerrada){
      if(f.nudos && f.Ls) f.Ls.push(cierre); else f.L=largoCordel(f)+cierre;
    } else {                       // la cuerda que sobre se queda en el cordel abierto
      if(f.nudos && f.Ls) f.Ls.pop(); else f.L=Math.max(largoCordel(f)-cierre, largoSegs(tramos(f).slice(0,-1)));
    }
  }
  f.cerrada=!f.cerrada;
  fijaForma(f);                                  // el plástico gana o pierde el lado de cierre
  draw();
}
function pintaSel(){
  var f=(sel!=null)?fig(sel):null, r=rotSel();
  if(!f && !r) return;
  pushUndo();
  if(f) f.col=color; else r.col=color;
  draw();
}
function quitaSel(){
  if(multi.length){
    pushUndo();
    multi.forEach(function(id){ if(pin(id)) quitaChincheta(id); });
    multi=[]; sel=null; draw(); return;
  }
  if(sel==null) return;
  var r=rotSel();
  pushUndo();
  if(r) quitaChincheta(r.id);
  else figuras=figuras.filter(function(f){return f.id!==sel;});
  sel=null; draw();
}
function nudosSel(){
  var f=(sel!=null)?fig(sel):null;
  if(!f || f.tipo!=='cordel'){ flash('Selecciona antes un cordel'); return; }
  pushUndo(); anudar(f,!f.nudos);
  flash(f.nudos ? 'Anudado: cada tramo se queda con su cuerda' : 'Sin nudos: la cuerda corre por las chinchetas');
}
function taparSel(){
  var r=rotSel();
  if(!r){ flash('Selecciona antes un rotulador'); return; }
  pushUndo(); r.tapado=!r.tapado; draw();
}

/* Elegir un color con un rotulador seleccionado se lo cambia en el acto. El
   selector de color manda muchos cambios seguidos al arrastrar por él: se
   juntan en un solo deshacer si llegan al mismo rotulador en poco tiempo. */
var ultimoTinte=null;
function setColor(col){
  color=col;
  document.querySelectorAll('.sw').forEach(function(b){ b.classList.toggle('on', b.dataset.c===col); });
  document.getElementById('cpick').value=/^#[0-9a-f]{6}$/i.test(col)?col:'#d23b30';
  if(borrador) borrador.col=col;
  var r=rotSel();
  if(r && r.col!==col){
    var ahora=Date.now();
    if(!ultimoTinte || ultimoTinte.id!==r.id || ahora-ultimoTinte.t>1500) pushUndo();
    ultimoTinte={id:r.id, t:ahora};
    r.col=col;
  }
  draw();
}
document.getElementById('cpick').addEventListener('input',function(e){ setColor(e.target.value); });
function setTool(t){
  if(t!=='goma' && t!=='cordel' && t!=='plastico') terminaBorrador();
  else if(borrador && borrador.tipo!==t) terminaBorrador();
  if(rotSel()) sel=null;                     // al cambiar de herramienta, se suelta el rotulador
  if(t!=='move'){ multi=[]; modoVarias=false; }  // y la selección de varias, que es cosa de ✥ Mover
  document.getElementById('varias').classList.toggle('on', modoVarias);
  tool=t;
  document.querySelectorAll('[data-tool]').forEach(function(b){ b.classList.toggle('on', b.dataset.tool===t); });
  cv.style.cursor=(t==='move')?'default':'crosshair';
  draw();
}
document.querySelectorAll('[data-tool]').forEach(function(b){
  b.addEventListener('click',function(){ setTool(b.dataset.tool); });
});

document.getElementById('nudos').addEventListener('click',nudosSel);
document.getElementById('tapar').addEventListener('click',taparSel);

function alternaVarias(){
  var activar=!modoVarias;
  if(activar && tool!=='move') setTool('move');
  modoVarias=activar;
  if(!activar) multi=[];
  document.getElementById('varias').classList.toggle('on', modoVarias);
  draw();
}
document.getElementById('varias').addEventListener('click',alternaVarias);

document.getElementById('avz').addEventListener('change',function(e){

document.getElementById('showmed').addEventListener('change',function(e){ opt.med=e.target.checked?1:0; draw(); });

document.getElementById('zoomin').addEventListener('click',function(){ zoomAt(1.2); });
document.getElementById('zoomout').addEventListener('click',function(){ zoomAt(1/1.2); });
function zoomAt(fz){ var r=stage.getBoundingClientRect(), c={x:r.width/2,y:r.height/2};
  var b=s2w(c); view.z=Math.max(0.2,Math.min(4,view.z*fz)); var a=s2w(c);
  view.x+=(a.x-b.x)*view.z; view.y+=(a.y-b.y)*view.z; draw(); }
function caja(){
  var todo=chinchetas.slice();
  trazos.forEach(function(t){ todo=todo.concat(t.pts); });
  if(!todo.length) return null;
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  todo.forEach(function(p){ x0=Math.min(x0,p.x); x1=Math.max(x1,p.x);
                            y0=Math.min(y0,p.y); y1=Math.max(y1,p.y); });
  return {x0:x0,y0:y0,x1:x1,y1:y1};
}
document.getElementById('fit').addEventListener('click',fitView);
function fitView(){
  var r=stage.getBoundingClientRect(), b=caja(), m=60;
  if(!b){ view={x:r.width/2, y:r.height/2, z:1}; draw(); return; }
  var an=(b.x1-b.x0)||200, al=(b.y1-b.y0)||200;
  var z=Math.min((r.width-2*m)/an, (r.height-2*m)/al);
  view.z=Math.max(0.2,Math.min(2.5,z));
  view.x=r.width/2-((b.x0+b.x1)/2)*view.z; view.y=r.height/2-((b.y0+b.y1)/2)*view.z;
  draw();
}
document.getElementById('limpiaTinta').addEventListener('click',function(){
  if(!trazos.length){ flash('No hay nada dibujado'); return; }
  pushUndo(); trazos=[]; draw(); });
document.getElementById('clear').addEventListener('click',function(){
  if(!chinchetas.length && !trazos.length) return;
  pushUndo(); chinchetas=[]; figuras=[]; trazos=[]; sel=null; borrador=null; multi=[]; draw(); });
document.getElementById('png').addEventListener('click',function(){
  var b=caja(); if(!b){ flash('No hay nada que exportar'); return; }
  var m=40, sc=2, W=(b.x1-b.x0)+2*m, H=(b.y1-b.y0)+2*m;
  var oc=document.createElement('canvas'); oc.width=W*sc; oc.height=H*sc;
  var o=oc.getContext('2d'); o.scale(sc,sc); o.fillStyle='#fff'; o.fillRect(0,0,W,H);
  var g={x:view.x,y:view.y,z:view.z};
  view.x=m-b.x0; view.y=m-b.y0; view.z=1;
  escena(o,W,H,true);
  view=g; draw();
  var a=document.createElement('a'); a.download='corcho.png'; a.href=oc.toDataURL('image/png'); a.click();
});

/* --- guardar y abrir ----------------------------------------------------- */
/* Versión 2: los rotuladores van como objeto {x, y, rotulador:color, tapado}
   entre las chinchetas, y el cordel guarda su longitud total y, si está
   anudado, la de cada tramo. Las longitudes se redondean hacia arriba, para
   que al abrir no quede ningún tramo estirado. */
function arriba(v){ return Math.ceil(v*100-1e-6)/100; }
function datos(){
  var pos={}; chinchetas.forEach(function(p,i){ pos[p.id]=i; });
  return {formato:'corcho-geometrico', version:2,
    chinchetas: chinchetas.map(function(p){
      var x=Math.round(p.x*100)/100, y=Math.round(p.y*100)/100;
      return esRot(p) ? {x:x, y:y, rotulador:p.col, tapado:!!p.tapado} : [x,y]; }),
    figuras: figuras.map(function(f){
      var o={tipo:f.tipo, color:f.col, cerrada:!!f.cerrada,
             chinchetas:f.pins.map(function(k){ return pos[k]; }).filter(function(v){ return v!==undefined; })};
      if(f.tipo==='cordel'){
        o.longitud=arriba(largoCordel(f));
        if(f.nudos && f.Ls){ o.nudos=true; o.longitudes=f.Ls.map(arriba); }
      }
      return o; }),
    tinta: trazos.map(function(t){
      return {color:t.col, puntos:t.pts.map(function(p){ return [Math.round(p.x*10)/10, Math.round(p.y*10)/10]; })}; })
  };
}

function loadData(d){
  var lc=d && (d.chinchetas||d.pins);
  if(!lc || !lc.length){ flash('El archivo no contiene chinchetas'); return; }
  pushUndo();
  var nuevas=lc.map(function(p){
    if(Array.isArray(p)) return {id:nid++, x:+p[0]||0, y:+p[1]||0};
    var c={id:nid++, x:+(p&&p.x)||0, y:+(p&&p.y)||0};
    if(p && p.rotulador){ c.rot=true; c.col=colorValido(p.rotulador)||color; c.tapado=!!p.tapado; }
    return c;
  });
  var nf=(d.figuras||[]).map(function(q){
    if(!q) return null;
    var ids=(q.chinchetas||q.pins||[]).map(function(i){ var c=nuevas[i|0]; return c?c.id:null; }).filter(Boolean);
    if(ids.length<2) return null;
    var g={id:nid++, tipo:(q.tipo==='cordel'||q.tipo==='plastico'?q.tipo:'goma'), pins:ids,
           cerrada:!!q.cerrada && ids.length>2, col:colorValido(q.color||q.col)||color};
    if(g.tipo==='cordel') g.cuerda=q;            // se ata más abajo, ya con las chinchetas puestas
    return g;
  }).filter(Boolean);
  var nt=(d.tinta||[]).map(function(q){
    if(!q) return null;
    var ps=(q.puntos||q.pts||[]).map(function(p){
      return Array.isArray(p) ? {x:+p[0]||0, y:+p[1]||0} : {x:+(p&&p.x)||0, y:+(p&&p.y)||0}; });
    return ps.length>=2 ? {id:nid++, col:colorValido(q.color||q.col)||color, pts:ps} : null;
  }).filter(Boolean);
  if(importMode==='replace'){ chinchetas=nuevas; figuras=nf; trazos=nt; }
  else {
    var b=caja(), dy=0;
    if(b){ var b2={y0:1e9,y1:-1e9};
      nuevas.forEach(function(p){ b2.y0=Math.min(b2.y0,p.y); });
      dy=b.y1-b2.y0+80;
      nuevas.forEach(function(p){ p.y+=dy; });
      nt.forEach(function(t){ t.pts.forEach(function(p){ p.y+=dy; }); });
    }
    chinchetas=chinchetas.concat(nuevas); figuras=figuras.concat(nf); trazos=trazos.concat(nt);
  }
  /* Cordeles. Con longitudes por tramo y sin longitud total, es un archivo de
     la versión 1, en la que el cordel iba siempre anudado: se respeta. Nunca
     se acepta una longitud más corta que lo que ya mide el cordel. */
  nf.forEach(function(g){
    if(g.tipo==='plastico'){ fijaForma(g); return; }      // la forma es la de las chinchetas guardadas
    if(g.tipo!=='cordel') return;
    var q=g.cuerda; delete g.cuerda;
    var ts=tramos(g), Ls=Array.isArray(q.longitudes) ? q.longitudes.map(Number) : null;
    var porTramo=Ls && Ls.length===ts.length && Ls.every(function(v){ return isFinite(v); });
    if(porTramo && (q.nudos || q.longitud===undefined)){
      g.nudos=true; g.Ls=ts.map(function(s,j){ return Math.max(Ls[j], dist(s[0],s[1])); });
    } else {
      g.nudos=false; fijaLongitud(g);
      var L=+q.longitud; if(isFinite(L) && L>g.L) g.L=L;
    }
  });
  sel=null; borrador=null; multi=[]; fitView();
  flash(nuevas.length+' chinchetas cargadas');
}

function runSelfTest(){
  var out=[], fails=0;
  function ok(n,c,extra){ out.push((c?'OK    ':'FALLO ')+n+(extra!==undefined?'   ['+extra+']':'')); if(!c) fails++; }
  var guardado=JSON.stringify({c:chinchetas,f:figuras,t:trazos,n:nid,u:undoStack,v:view});
  function limpia(){ chinchetas=[]; figuras=[]; trazos=[]; sel=null; borrador=null; drag=null; multi=[]; modoVarias=false; nid=1; }
  function clava(x,y){ var p={id:nid++, x:x, y:y}; chinchetas.push(p); return p; }
  function pon(x,y){ var p={id:nid++, x:x, y:y, rot:true, col:'#d23b30', tapado:false}; chinchetas.push(p); return p; }
  function figura(tipo,ps,cerrada,nudos){
    var f={id:nid++, tipo:tipo, pins:ps.map(function(p){return p.id;}), cerrada:!!cerrada, col:'#d23b30'};
    if(tipo==='cordel') f.nudos=!!nudos;
    figuras.push(fijaForma(fijaLongitud(f))); return f;
  }
  try{

  /* --- las figuras van atadas a las chinchetas ---------------------------- */
  limpia();
  var A=clava(0,0), B=clava(100,0), C=clava(100,100), D=clava(0,100);
  var cuad=figura('goma',[A,B,C,D],true);
  ok('cuatro chinchetas dan una figura de cuatro vértices', pts(cuad).length===4);
  ok('el cuadrado de lado 100 tiene perímetro 400', Math.abs(longitud(cuad)-400)<1e-9);
  ok('y área 10000', Math.abs(area(cuad)-10000)<1e-9);
  ok('es convexa', convexa(cuad));
  B.x=160; B.y=-40;                              // se deforma una esquina
  ok('al mover una chincheta sigue teniendo cuatro vértices', pts(cuad).length===4);
  ok('pero cambia el perímetro', Math.abs(longitud(cuad)-400)>1);
  ok('y el área', Math.abs(area(cuad)-10000)>1);
  ok('sigue siendo un cuadrilátero cerrado', cuad.cerrada && cuad.pins.length===4);
  C.x=40; C.y=40;                                // se mete hacia dentro
  ok('metiendo un vértice hacia dentro deja de ser convexa', !convexa(cuad));
  ok('y aun así sigue teniendo cuatro vértices', pts(cuad).length===4);
  limpia();
  var E=clava(0,0), F=clava(100,0), G=clava(50,80);
  var tri=figura('goma',[E,F,G],true);
  ok('tres chinchetas dan un triángulo', pts(tri).length===3);
  ok('todo triángulo es convexo', convexa(tri));
  ok('el área del triángulo es base por altura entre dos', Math.abs(area(tri)-4000)<1e-9, area(tri));
  var abierta=figura('cordel',[E,F,G],false);
  ok('una figura abierta de tres chinchetas tiene dos lados', pts(abierta).length-1===2);
  ok('y no tiene área', area(abierta)===0);

  /* --- el cordel: una sola cuerda que corre por las chinchetas ------------ */
  limpia();
  var K1=clava(0,0), K2=clava(100,0), K3=clava(100,100);
  var cor=figura('cordel',[K1,K2,K3],false);
  ok('el cordel guarda su longitud total', Math.abs(cor.L-200)<1e-9 && !cor.nudos && !cor.Ls, num(cor.L));
  ok('la goma no guarda longitudes', figura('goma',[K1,K2],false).L===undefined);
  figuras.pop();
  ok('acercar una chincheta siempre se puede', moverChincheta(K3.id,100,50) && K3.x===100 && K3.y===50);
  ok('y entonces sobra cuerda', Math.abs(holgura(cor)-50)<1e-9, num(holgura(cor)));
  ok('llevarla muy lejos no se puede del todo', !moverChincheta(K3.id,4000,4000));
  ok('pero no se queda a medio camino: el cordel acaba tenso',
     holgura(cor)<1e-5 && !cordelEstirado(), num(dist(K2,K3)));
  ok('y la chincheta queda en la dirección en la que se tira', (function(){
     var ux=K3.x-K2.x, uy=K3.y-K2.y, vx=4000-K2.x, vy=4000-K2.y;
     return Math.abs(ux*vy-uy*vx)/Math.hypot(vx,vy)<1e-4 && ux*vx+uy*vy>0; })());
  ok('tirando más allá del tope, la chincheta resbala por donde el cordel le deja', (function(){
     var peor=0;
     for(var a=0;a<12;a++){
       var an=a*Math.PI/6+0.1;
       moverChincheta(K3.id, K2.x+500*Math.cos(an), K2.y+500*Math.sin(an));
       peor=Math.max(peor, Math.abs(dist(K2,K3)-100),
                     Math.abs((K3.x-K2.x)/100-Math.cos(an))+Math.abs((K3.y-K2.y)/100-Math.sin(an)));
     }
     return peor<1e-5; })());
  moverChincheta(K3.id,100,100);
  moverChincheta(K1.id,50,0);                    // el tramo de la izquierda se acorta
  moverChincheta(K3.id,100,4000);
  ok('lo que sobra en un tramo pasa al otro: la cuerda corre por la chincheta del medio',
     Math.abs(dist(K2,K3)-150)<1e-5, num(dist(K2,K3)));
  ok('la longitud total no cambia al correr', Math.abs(largoCordel(cor)-200)<1e-9);
  limpia();
  K1=clava(0,0); K2=clava(100,0); K3=clava(100,100);
  var anu=figura('cordel',[K1,K2,K3],false,true);
  moverChincheta(K1.id,50,0); moverChincheta(K3.id,100,4000);
  ok('anudado, en cambio, cada tramo va por su cuenta', Math.abs(dist(K2,K3)-100)<1e-5, num(dist(K2,K3)));
  anudar(anu,false);
  ok('al quitar los nudos la longitud total no cambia', Math.abs(anu.L-200)<1e-9 && !anu.Ls, num(anu.L));
  moverChincheta(K3.id,100,4000);
  ok('y ya puede correr la cuerda que sobraba', Math.abs(dist(K2,K3)-150)<1e-5, num(dist(K2,K3)));
  moverChincheta(K3.id,100,40);
  anudar(anu,true);
  ok('al anudar, la cuerda se reparte entre los tramos sin perder nada',
     anu.Ls.length===2 && Math.abs(anu.Ls[0]+anu.Ls[1]-200)<1e-9 &&
     anu.Ls[0]>=dist(K1,K2)-1e-9 && anu.Ls[1]>=dist(K2,K3)-1e-9, anu.Ls.map(num).join(' + '));

  /* --- la panza ----------------------------------------------------------- */
  ok('un tramo tenso no hace panza', flechaArco(100,100)===0);
  ok('cuanta más cuerda sobra, más panza', flechaArco(100,160)>flechaArco(100,120));
  ok('la panza de un arco semicircular es el radio',
     Math.abs(flechaArco(100,Math.PI*50)-50)<0.5, num(flechaArco(100,Math.PI*50)));
  /* Al juntar las chinchetas la panza no se encoge con ellas: tiende al lazo,
     una circunferencia de la longitud del cordel, cuyo diámetro es arco/π. */
  ok('juntando las chinchetas la panza se mantiene, no se encoge',

  /* moverlo entero, girarlo con el asa y darle la vuelta */
  limpia(); undoStack=[];
  PA=clava(0,0); PB=clava(120,0); PC=clava(40,90);
  pl=figura('plastico',[PA,PB,PC],true);
  var cen0=centro(pl), area0=area(pl);
  sel=pl.id; empiezaGiro(pl,{x:cen0.x+100,y:cen0.y});
  pasoGiro({x:cen0.x, y:cen0.y+100}); sueltaArrastre();
  var cen1=centro(pl);
  ok('el asa lo gira alrededor de su centro sin deformarlo',
     !rigidoRoto() && dist(cen0,cen1)<1e-9 && Math.abs(area(pl)-area0)<1e-6);
  ok('un cuarto de vuelta, si se tira un cuarto de vuelta',
     Math.abs(Math.atan2(PB.y-cen1.y,PB.x-cen1.x)-Math.atan2(0-cen0.y,120-cen0.x)-Math.PI/2)<1e-9);
  ok('girar se deshace de una vez', undoStack.length===1);
  var orient=function(){ return (PB.x-PA.x)*(PC.y-PA.y)-(PB.y-PA.y)*(PC.x-PA.x); };
  var o0=orient();
  voltearSel();
  ok('dar la vuelta lo voltea: el mismo plástico, del revés', !rigidoRoto() && orient()*o0<0 &&
     Math.abs(area(pl)-area0)<1e-6 && dist(centro(pl),cen1)<1e-9);
  limpia();
  PA=clava(0,0); PB=clava(120,0); PC=clava(40,90);
  pl=figura('plastico',[PA,PB,PC],true);
  var Q4=clava(300,0), go2=figura('goma',[PC,Q4],false);
  setTool('move');
  (function(){
    var r=cv.getBoundingClientRect();
    var s0=w2s({x:40,y:30}), s1=w2s({x:240,y:-70});
    onDown({clientX:r.left+s0.x, clientY:r.top+s0.y});
    onMove({clientX:r.left+s1.x, clientY:r.top+s1.y}); onUp();
  })();
  ok('con ✥ Mover, cogiéndolo por dentro se mueve entero, con sus chinchetas',
     Math.abs(PA.x-200)<1e-6 && Math.abs(PA.y+100)<1e-6 && Math.abs(PC.x-240)<1e-6 && !rigidoRoto() && Q4.x===300);
  ok('figuraEn coge el plástico cerrado por dentro, pero no una goma', figuraEn({x:240,y:-70})===pl &&
     (function(){ var g=figura('goma',[clava(500,0),clava(600,0),clava(550,90)],true);
                  return figuraEn({x:550,y:30})===null; })());
  setTool(toolAntes);
  limpia();
  PA=clava(0,0); PB=clava(100,0); PC=clava(200,0);
  var p1=figura('plastico',[PA,PB],false), p2=figura('plastico',[PB,PC],false);
  ok('dos plásticos que comparten chincheta van juntos', componente([PA.id]).length===3);
  limpia();
  PA=clava(0,0); PB=clava(120,0); PC=clava(40,90);
  pl=figura('plastico',[PA,PB,PC],true);
  quitaChincheta(PC.id);
  ok('quitando una chincheta, el plástico se queda con las demás', figuras.length===1 && pl.pins.length===2 &&
     !pl.cerrada && pl.D.length===1);
  (function(){
    limpia();
    var a=clava(0,0), b=clava(120,0), c=clava(40,90), d=clava(300,0), r=pon(360,-30);
    var f=figura('plastico',[a,b,c],true); f.col='#e8890c';
    figura('plastico',[d,r],false);
    importMode='replace'; loadData(JSON.parse(JSON.stringify(datos())));
    var ps=figuras.filter(function(g){ return g.tipo==='plastico'; });
    ok('guardar y abrir conserva el plástico, con su color y su forma', ps.length===2 &&
       ps[0].col==='#e8890c' && ps[0].D.length===3 && Math.abs(ps[0].D[0]-120)<1e-9 && !rigidoRoto());
    var rr=chinchetas.filter(esRot)[0], aa=chinchetas[3];
    moverChincheta(rr.id,500,500);
    ok('y al abrirlo sigue siendo rígido', Math.abs(dist(aa,rr)-Math.hypot(60,30))<1e-6 && aa.x===300 && aa.y===0);
  })();

  /* --- el dibujo del plástico -------------------------------------------- */
  limpia();
  PA=clava(0,0); PB=clava(100,0); PC=clava(50,80);
  pl=figura('plastico',[PA,PB,PC],true); pl.col='#4f9e3f';
  (function(){
    var oc=document.createElement('canvas'); oc.width=240; oc.height=200;
    var o=oc.getContext('2d'), g={x:view.x,y:view.y,z:view.z};
    o.fillStyle='#fff'; o.fillRect(0,0,240,200);
    view={x:70,y:60,z:1};
    escena(o,240,200,true);
    view=g;
    var dd=o.getImageData(0,0,240,200).data, verde=0;
    for(var j=0;j<dd.length;j+=4) if(dd[j+1]-dd[j]>15 && dd[j+1]-dd[j+2]>15) verde++;
    ok('el plástico se dibuja macizo', verde>3500, verde+' px verdes');
  })();

  /* --- convertir una chincheta en rotulador ------------------------------- */
  limpia(); undoStack=[];
  var toolAntes2=tool, colAntes2=color;
  var evW=function(x,y,extra){
    var r=cv.getBoundingClientRect(), s=w2s({x:x,y:y}), e={clientX:r.left+s.x, clientY:r.top+s.y};
    if(extra) for(var k in extra) e[k]=extra[k];
    return e;
  };
  var K0=clava(0,0), KR=clava(120,0);
  var cz=figura('cordel',[K0,KR],false);
  setTool('rot'); setColor('#6c4bb6');
  onDown(evW(120,0)); onUp();
  ok('con ✎ Rotulador, pinchar una chincheta la convierte en rotulador del color elegido',
     esRot(KR) && KR.col==='#6c4bb6' && !KR.tapado && chinchetas.length===2);
  ok('sin moverla y sin soltar el cordel que tenía atado',
     KR.x===120 && KR.y===0 && figuras.length===1 && cz.pins.indexOf(KR.id)>=0);
  ok('convertirla se deshace', undoStack.length===1);
  doUndo();
  ok('y deshacer la deja otra vez en chincheta', !esRot(pin(KR.id)));
  KR=pin(KR.id);
  onDown(evW(120,0)); onUp();
  onDown(evW(120,0)); onMove(evW(120,300)); onUp();
  ok('ya convertida, arrastrarla pinta por donde el cordel le deja',
     esRot(KR) && trazos.length===1 && Math.abs(Math.hypot(KR.x,KR.y)-120)<1e-6);

  /* --- varias a la vez ---------------------------------------------------- */
  limpia(); undoStack=[];
  setTool('move');
  var M1=clava(0,0), M2=clava(100,0), M3=clava(300,0), MR=pon(50,80);
  onDown(evW(0,0,{shiftKey:true})); onUp(); onDown(evW(100,0,{shiftKey:true})); onUp();
  ok('con ✥ Mover, Mayús + clic va añadiendo a la selección',
     multi.length===2 && multi.indexOf(M1.id)>=0 && multi.indexOf(M2.id)>=0);
  onDown(evW(100,0,{shiftKey:true})); onUp();
  ok('y otra vez Mayús + clic la quita', multi.length===1 && multi[0]===M1.id);
  onDown(evW(100,0,{ctrlKey:true})); onUp();
  ok('Ctrl + clic hace lo mismo', multi.length===2);
  onDown(evW(-20,-20,{shiftKey:true})); onMove(evW(70,100)); onUp();
  ok('Mayús + arrastrar en el vacío añade lo que queda dentro de la caja',
     multi.length===3 && multi.indexOf(MR.id)>=0 && multi.indexOf(M3.id)<0, multi.length);
  ok('seleccionar no gasta deshaceres', undoStack.length===0);
  onDown(evW(100,0)); onMove(evW(150,40)); onUp();
  ok('arrastrando una de las seleccionadas se mueven todas a la vez, lo mismo',
     Math.abs(M1.x-50)<1e-6 && Math.abs(M1.y-40)<1e-6 && Math.abs(M2.x-150)<1e-6 &&
     Math.abs(MR.x-100)<1e-6 && Math.abs(MR.y-120)<1e-6);
  ok('y lo que no está seleccionado se queda donde estaba', M3.x===300 && M3.y===0);
  ok('el rotulador del conjunto pinta su recorrido', trazos.length===1);
  ok('mover el conjunto se deshace de una vez, y la selección sigue puesta',
     undoStack.length===1 && multi.length===3);
  limpia();
  var N1=clava(0,0), N2=clava(100,0), N3=clava(0,200);
  figura('plastico',[N1,N2],false);
  multi=[N1.id,N3.id];
  onDown(evW(0,0)); onMove(evW(30,30)); onUp();
  ok('si una seleccionada lleva plástico, la pieza va con ella sin deformarse',
     Math.abs(N2.x-130)<1e-6 && Math.abs(N3.y-230)<1e-6 && !rigidoRoto());
  limpia();
  var O1=clava(0,0), O2=clava(50,0), O3=clava(200,0);
  figura('cordel',[O3,O2],false);
  multi=[O1.id,O2.id];
  onDown(evW(0,0)); onMove(evW(-200,0)); onUp();
  ok('si se tensa un cordel atado a algo de fuera, el conjunto se para ahí',
     !cordelEstirado() && Math.abs(O1.x)<1e-3 && Math.abs(dist(O2,O3)-150)<1e-4, num(O1.x));
  undoStack=[];
  quitaSel();
  ok('Supr quita todas las seleccionadas de una vez', chinchetas.length===1 && multi.length===0 &&
     undoStack.length===1 && figuras.length===0);
  multi=[O3.id];
  onDown(evW(500,500)); onUp();
  ok('un clic en el vacío suelta la selección', multi.length===0);
  multi=[O3.id]; setTool('goma');
  ok('y cambiar a otra herramienta también', multi.length===0);
  setTool(toolAntes2); setColor(colAntes2);

  /* --- el botón ⬚ Varias, para seleccionar sin teclado ------------------- */
  limpia(); undoStack=[];
  setTool('pin');
  var W1=clava(0,0), W2=clava(100,0), W3=clava(300,0);
  document.getElementById('varias').click();
  ok('⬚ Varias pasa a ✥ Mover y se queda encendido', modoVarias && tool==='move' &&
     document.getElementById('varias').classList.contains('on'));
  onDown(evW(0,0)); onUp(); onDown(evW(100,0)); onUp();
  ok('con el botón, cada toque añade a la selección sin Mayús', multi.length===2);
  onDown(evW(100,0)); onUp();
  ok('y tocar una que ya está la quita', multi.length===1 && multi[0]===W1.id);
  onDown(evW(100,0)); onUp();
  onDown(evW(250,-30)); onMove(evW(350,30)); onUp();
  ok('arrastrar en el vacío hace la caja, sin Mayús', multi.length===3);
  onDown(evW(0,0)); onMove(evW(20,50)); onUp();
  ok('arrastrar una seleccionada mueve todas, y no la quita de la selección',
     Math.abs(W1.y-50)<1e-6 && Math.abs(W3.x-320)<1e-6 && multi.length===3);
  onDown(evW(20,50)); onMove(evW(20.5,50)); onUp();
  ok('un toque que tiembla un poco sigue siendo un toque: la quita sin mover nada',
     multi.length===2 && Math.abs(W1.x-20)<1e-6);
  document.getElementById('varias').click();
  ok('al apagarlo se suelta la selección', !modoVarias && multi.length===0);
  document.getElementById('varias').click(); setTool('goma');
  ok('cambiar de herramienta lo apaga', !modoVarias && !document.getElementById('varias').classList.contains('on'));
  setTool(toolAntes2);

  /* --- guardar y volver a abrir ------------------------------------------ */
  limpia();
  var Q1=clava(10,20), Q2=clava(90,20), Q3=clava(50,95), QR=pon(50,-40);
  QR.col='#6c4bb6'; QR.tapado=true;
  var fg=figura('goma',[Q1,Q2,Q3],true); fg.col='#2f62a8';
  var fc=figura('cordel',[Q1,QR,Q2],false);
  var fn=figura('cordel',[Q2,Q3],false,true);
  moverChincheta(QR.id,50,0);                       // los dos cordeles, flojos
  moverChincheta(Q3.id,70,60);
  var Lfc=largoCordel(fc), Lfn=fn.Ls[0];
  trazos.push({id:nid++, col:'#4f9e3f', pts:[{x:0,y:0},{x:10,y:5},{x:20,y:0}]});
  var antesC=chinchetas.map(function(p){return p.x+','+p.y;}).join(' | ');
  var antesF=figuras.map(function(f){return f.tipo+':'+f.col+':'+f.cerrada+':'+pts(f).length;}).sort().join(' | ');
  var data=datos();
  importMode='replace'; loadData(JSON.parse(JSON.stringify(data)));
  ok('guardar y volver a abrir conserva las chinchetas',
     chinchetas.map(function(p){return p.x+','+p.y;}).join(' | ')===antesC);
  ok('y el rotulador, con su color y tapado', (function(){
     var r=chinchetas.filter(esRot); return r.length===1 && r[0].col==='#6c4bb6' && r[0].tapado===true; })());
  ok('y las figuras, con su tipo y su color',
     figuras.map(function(f){return f.tipo+':'+f.col+':'+f.cerrada+':'+pts(f).length;}).sort().join(' | ')===antesF);
  ok('las figuras siguen atadas a las chinchetas correctas',
     figuras.every(function(f){ return f.pins.every(function(k){ return !!pin(k); }); }));
  var cs=figuras.filter(function(f){return f.tipo==='cordel';});
  var c1=cs.filter(function(f){return !f.nudos;})[0], c2=cs.filter(function(f){return f.nudos;})[0];
  ok('el cordel flojo recupera su longitud, no la que tenía tenso',
     !!c1 && Math.abs(largoCordel(c1)-Lfc)<0.02 && holgura(c1)>1, c1?num(largoCordel(c1))+' = '+num(Lfc):'');
  ok('y el anudado, sus nudos y la cuerda de cada tramo',
     !!c2 && c2.Ls.length===1 && Math.abs(c2.Ls[0]-Lfn)<0.02);
  ok('al abrirlo no queda ningún cordel estirado', !cordelEstirado());
  ok('y se conserva la tinta', trazos.length===1 && trazos[0].pts.length===3);
  var nAntes=chinchetas.length;
  importMode='add'; loadData(JSON.parse(JSON.stringify(data)));
  ok('el botón ＋ añade sin borrar lo anterior', chinchetas.length===nAntes*2, chinchetas.length);
  ok('y lo añadido no se solapa con lo anterior', (function(){
      var ys=chinchetas.map(function(p){return p.y;});
      return Math.max.apply(null,ys)-Math.min.apply(null,ys) > 100; })());
  importMode='replace';
  loadData({formato:'corcho-geometrico', version:1, chinchetas:[[0,0],[100,0],[100,100]],
            figuras:[{tipo:'cordel', color:'#2f62a8', cerrada:false, chinchetas:[0,1,2], longitudes:[100,150]}]});
  ok('un archivo antiguo, con el cordel por tramos, se abre anudado como era',
     figuras.length===1 && figuras[0].nudos && figuras[0].Ls[1]===150);
  loadData({chinchetas:[[0,0],{x:5,y:5,rotulador:'url(javascript:1)'}],
            figuras:[{tipo:'goma', color:'"><b>', chinchetas:[0,1]}], tinta:[{color:'rojo', puntos:[[0,0],[1,1]]}]});
  ok('un color que no es un color se descarta al abrir', colorValido(figuras[0].col)===figuras[0].col &&
     colorValido(chinchetas[1].col)===chinchetas[1].col && colorValido(trazos[0].col)===trazos[0].col);
  importMode='replace';

  /* --- lo que no debe haber ---------------------------------------------- */
  var src=Array.prototype.map.call(document.scripts,function(s){ return s.textContent; }).join('\n');
  ok('ningún confirm, que en el panel no sale', src.indexOf('con'+'firm(')<0);
  ok('la raya .sep va acotada a la barra', (function(){
     var css=Array.prototype.map.call(document.querySelectorAll('style'),function(s){ return s.textContent; }).join('\n');
     return !/(^|[};])\s*\.sep\s*\{/m.test(css) && /#toolbar \.sep\{/.test(css); })());

  }catch(errT){
    fails++;
    out.push('FALLO se ha cortado aquí: '+((errT&&errT.message)||errT));
    if(errT&&errT.stack) String(errT.stack).split('\n').slice(0,5).forEach(function(l){
      out.push('        '+l.trim()); });
  }
  /* el tablero, como estaba */
  var gd=JSON.parse(guardado);
  chinchetas=gd.c; figuras=gd.f; trazos=gd.t; nid=gd.n; undoStack=gd.u; view=gd.v;
  sel=null; borrador=null; drag=null; multi=[]; modoVarias=false;
  document.getElementById('varias').classList.remove('on'); importMode='replace'; draw();

  /* --- informe ----------------------------------------------------------- */
  var texto=out.join('\n')+'\n\n'+(fails? fails+' PRUEBAS FALLIDAS de '+out.length : 'LAS '+out.length+' PRUEBAS CORRECTAS');
  var box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;background:#fff;z-index:99;overflow:auto;padding:18px 22px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
  box.innerHTML='<div style="font:600 15px/1.3 -apple-system,Segoe UI,Roboto,sans-serif;margin-bottom:4px">'+
      'Autocomprobación del Corcho geométrico</div>'+
    '<div style="font:13px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;color:'+(fails?'#c2410c':'#15803d')+';font-weight:600;margin-bottom:12px">'+
      (fails? fails+' pruebas fallidas de '+out.length : 'Las '+out.length+' pruebas correctas')+'</div>'+
    '<button id="cpTest" style="font:13px -apple-system,Segoe UI,Roboto,sans-serif;padding:6px 12px;margin-bottom:14px;'+
      'border:1px solid #d5d9e0;border-radius:7px;background:#fff;cursor:pointer">Copiar informe</button> '+
    '<button id="clTest" style="font:13px -apple-system,Segoe UI,Roboto,sans-serif;padding:6px 12px;margin-bottom:14px;'+
      'border:1px solid #d5d9e0;border-radius:7px;background:#fff;cursor:pointer">Cerrar y usar el manipulativo</button>'+
    '<pre style="white-space:pre-wrap;margin:0">'+
      out.map(function(l){ return l.indexOf('FALLO')===0
        ? '<span style="color:#c2410c;font-weight:700">'+l+'</span>' : l; }).join('\n')+'</pre>';
  document.body.appendChild(box);
  document.getElementById('cpTest').addEventListener('click',function(){
    var ta=document.createElement('textarea'); ta.value=texto; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); }catch(err){}
    document.body.removeChild(ta); this.textContent='Copiado ✓';
  });
  document.getElementById('clTest').addEventListener('click',function(){ box.remove(); });
}
var testLanzado=false;
function lanzarTest(){ if(testLanzado) return; testLanzado=true; runSelfTest(); }
if((location.hash||'').indexOf('test')>=0) setTimeout(lanzarTest,60);
window.addEventListener('hashchange',function(){
  if((location.hash||'').indexOf('test')>=0) lanzarTest();
});

window.__corcho={
  test:runSelfTest, chinchetas:function(){return chinchetas;}, figuras:function(){return figuras;},
  trazos:function(){return trazos;}, pin:pin, fig:fig, pts:pts,
  longitud:longitud, area:area, convexa:convexa, sumaDist:sumaDist,
  moverChincheta:moverChincheta, cordelEstirado:cordelEstirado, fijaLongitud:fijaLongitud,
  flechaArco:flechaArco, anguloArco:anguloArco, hastaElTope:hastaElTope,
  tramos:tramos, holgura:holgura, piezas:piezas, arcos:arcos, anudar:anudar, largoCordel:largoCordel,
  fijaForma:fijaForma, rigidoRoto:rigidoRoto, componente:componente, centro:centro,
  quitaChincheta:quitaChincheta, load:loadData, datos:datos, setMode:function(m){importMode=m;},
  view:function(){ return view; }, w2s:w2s,
  redraw:draw, reset:function(){ chinchetas=[]; figuras=[]; trazos=[]; sel=null; }
};

})();
</script>
