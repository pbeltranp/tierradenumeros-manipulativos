<style>

<body>

  <aside id="side">

    <input type="text" id="aMano" placeholder="2/3 x 5/4"

    <button class="act" id="prisma" title="Con un rectángulo y una longitud que salga de una de sus esquinas, en ángulo recto con él, construye el prisma que tiene ese rectángulo por base y esa longitud por arista">◫ Prisma<kbd>P</kbd></button>

  <main>

      <label class="chk" title="Escribe lo que mide, en unidades cúbicas, cada trocito que dejan las marcas de un prisma, en las caras que se le ven"><input type="checkbox" id="etiqV">Etiquetas u³</label>
      <label class="chk" title="Añade al rótulo de cada rectángulo lo que mide en unidades cuadradas, y al de cada prisma lo que mide en unidades cúbicas"><input type="checkbox" id="res">Resultado</label>
      <button class="btn" id="transp" title="Los rectángulos y los prismas se vuelven translúcidos y se ve lo que hay dentro y detrás">◑ Transparencia</button>

      <span class="sep"></span>
      <button class="btn" id="mano" title="Mover el tablero en vez de las piezas">✋</button>
      <button class="btn" id="zoomout">−</button>

      <button class="btn" id="fit">Ajustar</button>

      <button class="btn" id="open" title="Abrir un archivo guardado">⤒ Abrir</button>

      <button class="btn" id="png" title="Descargar imagen">⤓ PNG</button>

      <canvas id="cv"></canvas>
      <div id="hint"></div>
      <div id="vista">
        <button class="btn" id="vizq" title="Girar la vista un cuarto de vuelta a la izquierda (Q)">⟲ vista</button>
        <button class="btn" id="vder" title="Girar la vista un cuarto de vuelta a la derecha (W)">⟳ vista</button>
      </div>
      <div id="info"></div>
      <div id="drop">Suelta aquí el archivo</div>
    </div>
  </main>

<script>
"use strict";
(function(){

/* =========================================================================
   1. LA IDEA
   En «2/3 u × 5/4 u²» la primera fracción es una cantidad de longitud y la
   segunda una cantidad de área, y lo que sale no es ni una cosa ni la otra:
   es un volumen. Por eso el tablero es el suelo de un espacio de tres
   dimensiones, visto en perspectiva isométrica, y se empieza, igual que en
   «Longitud × Longitud», por la unidad de longitud: un segmento de 1 u.

   No hay pasos. Hay tres clases de piezas y unas pocas herramientas que
   valen para las tres:
   · Longitudes: segmentos. 5/4 u es la unidad con un cuarto duplicado a
     continuación, unidos.
   · Rectángulos: salen de dos longitudes pegadas por un extremo en ángulo
     recto. La unidad de área es el cuadrado de 1 u de lado.
   · Prismas: salen de un rectángulo y de una longitud que arranca de una de
     sus esquinas, en ángulo recto con él. La unidad de volumen es el cubo de
     1 u de arista.
   Las unidades de área y de volumen se reconocen cuando se construyen, y
   también se pueden sacar ya hechas, para tenerlas de referencia.

   Las restricciones que lo condicionan todo:
   · Las tres clases son la misma cosa: una caja de lados paralelos a los
     ejes que tiene extensión en uno, dos o tres de ellos. Así partir,
     cortar, duplicar, unir, girar y enganchar se escriben una sola vez, eje
     por eje, y construir un rectángulo o un prisma es la misma operación:
     juntar las extensiones de dos piezas que no comparten ningún eje y se
     tocan por una esquina.
   · Una subunidad es el trocito más pequeño que dejan todas las marcas de
     una pieza: las de los cortes de ahora y las que le quedan de antes.
   · Todas las medidas son racionales y van en aritmética entera. Las
     fracciones se guardan tal como salen, sin simplificar: un prisma de
     2/3 u por un rectángulo de 1 u por 5/4 u mide 10/12 u³.
   · Un rectángulo y un prisma nacen lisos: no heredan las marcas de las
     piezas con que se construyen.
   · Las piezas se atraviesan: un prisma se mete dentro de la unidad de
     volumen para compararlos, igual que en el plano un rectángulo se pone
     sobre otro. Ordenar las piezas de lejos a cerca no basta para dibujar
     dos cajas que se cruzan. Por eso el relleno se pinta por celdas —los
     planos de todas las caras trocean el espacio en una rejilla, y sus
     celdas sí tienen un orden de lejos a cerca— y las líneas se dibujan
     después, calculando exactamente qué tramo de cada una queda a la vista.
     Donde dos prismas ocupan el mismo sitio manda el que se tocó el último.
   · La vista gira de cuarto en cuarto de vuelta, y siempre se mira desde
     arriba: de cada caja se ven tres caras.
   · Las longitudes se dibujan y se pinchan por encima de todo lo demás,
     porque suelen quedar justo en una arista.
   · Lo que queda tapado se dibuja de puntos, como en un dibujo técnico: las
     tres aristas de atrás de cada prisma, el trozo de arista que tapa otra
     pieza y el trozo de longitud que queda detrás de algo.
   · Lo que mide un rectángulo en u² o un prisma en u³ no se dice si no se
     pide (Resultado y las etiquetas empiezan apagadas). La excepción son
     las unidades: su rótulo lo dice siempre.

   El rótulo de un rectángulo dice sus dos lados, y el de un prisma, su
   altura y, entre paréntesis, los lados de su base. Al girar o volcar la
   pieza, se cambian de sitio.
   ========================================================================= */
var U=120;                 // la unidad de longitud, en píxeles de mundo
var MAXD=12;               // en cuántas partes se puede partir una pieza en cada dirección
var MAXLADO=4;             // ninguna pieza pasa de 4 u de lado
var MAXVECES=3;            // el enunciado: ni una longitud mayor que 3 u ni un área mayor que 3 u²
var MAXDEN=1000;           // ni trozos con lados de menos de una milésima de unidad
var PEGA=0.75;             // dos bordes a menos de esto, en píxeles de mundo, están pegados
var CX=Math.cos(Math.PI/6), CY=0.5;      // la perspectiva isométrica

var TINTA='#2b2f36', AZUL='#2f62a8', ROJO='#c8372d', SELEC='#1f4e8c';
var FONT='-apple-system,Segoe UI,Roboto,sans-serif';
/* las unidades de área y de volumen, en verde; lo demás, en arena; lo resaltado, en naranja */
var VERDE={f:'#b5e08a', b:'#3f8f2f', t:'#2c6a20'};
var ARENA={f:'#f4ead6', b:'#4a4436', t:'#6b5d36'};
var NARANJA={f:'#f9d3a4', b:'#c06a1a', t:'#8f4c10'};

var NIVELES=[
  {dens:[2,3,4],         max:[1,1]},
  {dens:[2,3,4,5,6],     max:[1,2]},
  {dens:[2,3,4,5,6,7,8], max:[2,2]}
];

/* =========================================================================
   2. ESTADO
   ========================================================================= */
var piezas=[], sel=null, selK=null, nid=1;
var modo='pieza';                  // 'pieza', 'sub' o 'res': qué hace un pinchazo
var enun={p:2,q:3,a:5,b:4};        // p/q u × a/b u²
var view={x:0,y:0,z:1}, giro=0;    // giro: cuartos de vuelta de la vista
var drag=null, undoStack=[], importMode='replace';
var opt={iman:1, rot:1, etiqL:0, etiqA:0, etiqV:0, res:0, mano:0, alfa:0, sube:0};

var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var stage=document.getElementById('stage');
var hintEl=document.getElementById('hint'), infoEl=document.getElementById('info');
var dropEl=document.getElementById('drop');
var flashMsg=null, flashT=0;

function w2s(p){ return {x:p.x*view.z+view.x, y:p.y*view.z+view.y}; }
function s2w(p){ return {x:(p.x-view.x)/view.z, y:(p.y-view.y)/view.z}; }
function flash(m){ flashMsg=m; flashT=Date.now(); draw(); setTimeout(draw,2600); }
function foto(){ return JSON.stringify({p:piezas, s:sel, k:selK, n:nid, e:enun}); }
function pushUndo(){
  undoStack.push(foto());
  if(undoStack.length>90) undoStack.shift();
}
function doUndo(){
  if(!undoStack.length){ flash('No hay nada que deshacer'); return; }
  var d=JSON.parse(undoStack.pop());
  piezas=d.p; sel=d.s; selK=d.k; nid=d.n||1; enun=d.e;
  draw();
}

/* =========================================================================
   3. FRACCIONES
   ========================================================================= */
function mcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ var t=a%b; a=b; b=t; } return a; }
function mcm(a,b){ return a/mcd(a,b)*b; }
function reduce(p,q){ var d=mcd(p,q)||1; return {p:p/d, q:q/d}; }
function mismaFraccion(a,b){ return a.p*b.q===b.p*a.q; }
function entero(v,lo,hi){ return typeof v==='number' && isFinite(v) && v===Math.floor(v) && v>=lo && v<=hi; }
function txtFr(n,d){ return d===1? ''+n : n+'/'+d; }

/* k partes de las a en que se parte n/d, tal como sale: un cuarto de 1 es
   1/4, un tercio de 5/4 es 5/12, la mitad de 2/4 es 1/4 y no 2/8 */
function parteFr(n,d,k,a){ return (n*k)%a===0? [n*k/a, d] : [n*k, d*a]; }
/* la suma de dos, con el denominador común más pequeño y sin simplificar */
function sumaFr(A,B){ var L=mcm(A[1],B[1]); return [A[0]*L/A[1]+B[0]*L/B[1], L]; }
/* Las marcas van en decimales, así que la fracción se recupera buscando el
   denominador más pequeño. */
function fraccionDe(v){
  for(var d=1;d<=6000;d++){
    var n=v*d;
    if(n>0.5 && Math.abs(n-Math.round(n))<1e-6*d) return {n:Math.round(n), d:d};
  }
  return null;
}
/* ordena unas marcas, quita las repetidas y las que caen en el borde */
function ordenaMarcas(L,largo){
  var out=[];
  L.slice().sort(function(p,q){ return p-q; }).forEach(function(t){
    if(t<1e-6 || t>largo-1e-6) return;
    if(out.length && Math.abs(out[out.length-1]-t)<1e-6) return;
    out.push(t);
  });
  return out;
}
/* Lo que mide el tramo de p0 a p1 de un lado que mide n/d y que sus marcas
   dejan cortado en «cortes» (de 0 al final). Si los trocitos son todos
   iguales, tantos de los que hay; si no, la fracción que salga. */
function frTramo(n,d,cortes,p0,p1){
  var T=cortes.length-1, paso=cortes[T]/T, iguales=true, m=0, i, c;
  for(i=0;i<T;i++){
    if(Math.abs(cortes[i+1]-cortes[i]-paso)>1e-9) iguales=false;
    c=(cortes[i]+cortes[i+1])/2;
    if(c>p0 && c<p1) m++;
  }
  if(iguales) return parteFr(n,d,m,T);
  var f=fraccionDe(p1-p0);
  return f? [f.n,f.d] : null;
}

/* «2/3 x 5/4»: primero la longitud y luego el área, sin simplificar nada */
function leeEnunciado(txt){
  var s=String(txt===null||txt===undefined?'':txt).toLowerCase().replace(/\s+/g,' ').trim();
  var m=s.match(/^(\d+)(?: ?\/ ?(\d+))?(?: ?[um])? ?(?:x|×|\*|·|por) ?(\d+)(?: ?\/ ?(\d+))?(?: ?[um](?:²|2|\^2)?)?$/);
  if(!m) return null;
  var e={p:+m[1], q:m[2]===undefined?1:+m[2], a:+m[3], b:m[4]===undefined?1:+m[4]};
  return enunciadoValido(e)? e : null;
}
function enunciadoValido(e){
  if(!e) return false;
  if(!entero(e.p,1,999) || !entero(e.q,1,MAXD) || !entero(e.a,1,999) || !entero(e.b,1,MAXD)) return false;
  return e.p<=MAXVECES*e.q && e.a<=MAXVECES*e.b;
}
function fraccionAlAzar(dens,max){
  for(var i=0;i<400;i++){
    var d=dens[Math.floor(Math.random()*dens.length)];
    var n=1+Math.floor(Math.random()*(max*d));
    if(n===d || mcd(n,d)!==1) continue;
    return {n:n, d:d};
  }
  return {n:1, d:2};
}

    var g=Math.random()<0.5;
    var x=fraccionAlAzar(N.dens,N.max[g?0:1]), y=fraccionAlAzar(N.dens,N.max[g?1:0]);
    var e={p:x.n, q:x.d, a:y.n, b:y.d};

    return e;

/* =========================================================================
   4. LAS PIEZAS
   Una pieza es una caja. p es su esquina de coordenadas más pequeñas, en
   píxeles de mundo: el eje 0 es el largo, el 1 el ancho y el 2 el alto, y el
   suelo es la altura 0. e dice lo que se extiende por cada eje: nada (null),
   o n/d unidades, partidas ahora en a partes y con las marcas t que le quedan
   de cortes y uniones anteriores, en unidades desde p.

   Con un eje es una longitud; con dos, un rectángulo; con tres, un prisma.
   res son las subunidades que tiene resaltadas. Las subunidades se numeran
   recorriendo el largo, dentro de él el ancho, y dentro el alto.
   ========================================================================= */
function ext(n,d){ return {n:n, d:d, a:1, t:[]}; }
function nuevaPieza(P,e){ return {id:nid++, p:[P[0],P[1],P[2]], e:e, res:[], hueca:0}; }
function nuevaUnidad(P){ return nuevaPieza(P,[ext(1,1),null,null]); }
function nuevaUnidadA(P){ return nuevaPieza(P,[ext(1,1),ext(1,1),null]); }
function nuevaUnidadV(P){ return nuevaPieza(P,[ext(1,1),ext(1,1),ext(1,1)]); }
function dimDe(s){ return (s.e[0]?1:0)+(s.e[1]?1:0)+(s.e[2]?1:0); }
function esL(s){ return dimDe(s)===1; }
function ejesDe(s){ var o=[], m; for(m=0;m<3;m++) if(s.e[m]) o.push(m); return o; }
function lado(s,m){ return s.e[m]? s.e[m].n/s.e[m].d : 0; }
function tam(s,m){ return U*lado(s,m); }
function finDe(s){ return [s.p[0]+tam(s,0), s.p[1]+tam(s,1), s.p[2]+tam(s,2)]; }
function largoL(s){ return lado(s,ejesDe(s)[0]); }
function nombreDe(s){ var D=dimDe(s); return D===1? 'longitud' : (D===2? 'rectángulo' : 'prisma'); }
function porId(id){
  for(var i=0;i<piezas.length;i++) if(piezas[i].id===id) return piezas[i];
  return null;
}
function seleccionada(){ return sel==null? null : porId(sel); }
function esUnidad(s){ return ejesDe(s).every(function(m){ return s.e[m].n===s.e[m].d; }); }
function colorDe(s){ return esUnidad(s)? VERDE : ARENA; }
/* lo que mide la pieza, en sus unidades, tal como sale */
function valor(s){
  var n=1, d=1;
  ejesDe(s).forEach(function(m){ n*=s.e[m].n; d*=s.e[m].d; });
  return {n:n, d:d};
}
function medidaDe(s){ var v=valor(s); return reduce(v.n,v.d); }
/* en cuántas partes está partida ahora */
function partes(s){ var n=1; ejesDe(s).forEach(function(m){ n*=s.e[m].a; }); return n; }
/* las marcas de un eje, las de ahora y las de antes, en unidades desde p */
function marcasEje(s,m){
  var E=s.e[m], out=E.t.slice(), Lg=E.n/E.d, k;
  for(k=1;k<E.a;k++) out.push(Lg*k/E.a);

}
function cortesEje(s,m){ return s.e[m]? [0].concat(marcasEje(s,m)).concat([lado(s,m)]) : [0,0]; }
function nSub(s){
  var n=1;
  ejesDe(s).forEach(function(m){ n*=marcasEje(s,m).length+1; });
  return n;
}
/* Las subunidades: los trocitos que dejan todas las marcas de la pieza, cada
   uno de lo[] a hi[] en unidades desde p. */
function trocitos(s){
  var C=[cortesEje(s,0), cortesEje(s,1), cortesEje(s,2)], out=[], i, j, k;
  for(i=0;i+1<C[0].length;i++) for(j=0;j+1<C[1].length;j++) for(k=0;k+1<C[2].length;k++)
    out.push({lo:[C[0][i],C[1][j],C[2][k]], hi:[C[0][i+1],C[1][j+1],C[2][k+1]]});

}
/* lo que mide una subunidad, en unidades de las de su pieza */
function medidaTro(s,q){

}
var cacheFr={};
function txtTro(s,q){
  var v=medidaTro(s,q), c=v.toFixed(10);

  return cacheFr[c];
}
function sonIguales(s,T){

}
/* en qué subunidad cae un punto, dado en unidades desde p; en una raya gana la de más allá */
function subEn(s,l){
  var idx=0, m, C, i, k;
  for(m=0;m<3;m++){
    C=cortesEje(s,m); k=s.e[m]? -1 : 0;
    if(s.e[m]) for(i=0;i+1<C.length;i++) if(l[m]>=C[i]-1e-9 && l[m]<=C[i+1]+1e-9) k=i;
    if(k<0) return -1;
    idx=idx*(C.length-1)+k;
  }
  return idx;
}

/* --- el imán -----------------------------------------------------------------
   Eje por eje: los extremos y las marcas de la pieza contra los de las demás.
   En altura, además, el suelo. */
function puntosEje(s,m){
  var out=[s.p[m]];
  if(s.e[m]){
    out.push(s.p[m]+tam(s,m));
    marcasEje(s,m).forEach(function(t){ out.push(s.p[m]+t*U); });
  }
  return out;
}
function engancheEje(s,m){
  var lim=10/view.z, mios=puntosEje(s,m), mejor=null, dist=Infinity;
  piezas.forEach(function(o){
    if(o.id===s.id) return;
    puntosEje(o,m).forEach(function(b){
      mios.forEach(function(a){
        var d=b-a;
        if(Math.abs(d)<lim && Math.abs(d)<dist){ mejor=d; dist=Math.abs(d); }
      });
    });
  });
  if(m===2 && Math.abs(s.p[2])<lim && Math.abs(s.p[2])<dist) mejor=-s.p[2];
  return mejor;
}
function aplicaIman(s){
  if(!opt.iman || !s) return false;
  var algo=false, m, d;
  for(m=0;m<3;m++){
    d=engancheEje(s,m);
    if(d!==null){ s.p[m]+=d; algo=true; }
  }
  if(s.p[2]<0) s.p[2]=0;
  return algo;
}

/* =========================================================================
   5. ACCIONES
   ========================================================================= */
function parte(s,m,a){
  if(!s || !s.e[m]) return false;
  a=Math.max(1, Math.min(MAXD, Math.round(a)));
  if(a===s.e[m].a) return false;
  pushUndo();
  s.e[m].a=a; s.res=[]; selK=null;       // otras partes: ni la subunidad elegida ni lo resaltado existen ya
  draw();
  return true;
}
/* El trozo de s que va, en cada eje, de la parte c0 a la c1 de las de ahora
   (sin incluir c1), como pieza nueva sin partir y con las marcas que le
   caigan dentro. No toca el tablero. */
function trozo(s,c0,c1){
  var t=nuevaPieza(s.p,[null,null,null]), m;
  for(m=0;m<3;m++){
    if(!s.e[m]) continue;
    var E=s.e[m], Lg=E.n/E.d, u0=Lg*c0[m]/E.a, fr=parteFr(E.n,E.d,c1[m]-c0[m],E.a);
    t.p[m]=s.p[m]+U*u0;
    t.e[m]={n:fr[0], d:fr[1], a:1, t:ordenaMarcas(desplaza(E.t,u0), fr[0]/fr[1])};
  }
  return t;
}
function desplaza(L,u0){ return L.map(function(v){ return v-u0; }); }
/* La caja de s que va de lo[] a hi[] (en unidades desde p), como pieza nueva
   sin partir, con las rayas que le caigan dentro. null si algún lado no sale
   racional. */
function recorte(s,lo,hi){
  var t=nuevaPieza(s.p,[null,null,null]), m, fr;
  for(m=0;m<3;m++){
    if(!s.e[m]) continue;
    fr=frTramo(s.e[m].n,s.e[m].d,cortesEje(s,m),lo[m],hi[m]);
    if(!fr) return null;
    t.p[m]=s.p[m]+U*lo[m];
    t.e[m]={n:fr[0], d:fr[1], a:1, t:ordenaMarcas(desplaza(marcasEje(s,m),lo[m]), hi[m]-lo[m])};
  }
  return t;
}
function demasiado(L){
  var mal=L.some(function(t){ return ejesDe(t).some(function(m){ return t.e[m].d>MAXDEN; }); });
  if(mal) flash('Esos trozos serían demasiado pequeños');
  return mal;
}
function duplica(s,k){
  if(!s) return null;
  var t, T=trocitos(s);
  if(k===null || k===undefined || T.length<2){
    pushUndo();
    t=JSON.parse(JSON.stringify(s)); t.id=nid++;
  } else {
    if(!T[k]) return null;
    t=recorte(s,T[k].lo,T[k].hi);
    if(!t){ flash('Por ahí no sé cortar'); return null; }
    if(demasiado([t])) return null;
    pushUndo();
  }
  t.p[0]+=18; t.p[1]+=18;
  piezas.push(t); sel=t.id; selK=null;
  draw();
  return t;
}
/* Cortar. Con la pieza entera, la deshace en las partes en que está partida
   ahora. Con una subunidad elegida, la separa y deja lo demás en los trozos
   que queden: por el primer eje, lo de antes y lo de después; en su misma
   rebanada, lo de antes y lo de después por el segundo eje; y así. Devuelve
   las piezas nuevas, la subunidad la última. */
function corta(s,k){
  if(!s) return null;
  var nuevas=[], ax=ejesDe(s), entera=(k===null || k===undefined), t;
  if(entera){
    if(partes(s)<2){ flash('Se corta por las marcas: primero parte la pieza'); return null; }
    var A=[0,1,2].map(function(m){ return s.e[m]? s.e[m].a : 1; }), i, j, l;
    for(i=0;i<A[0];i++) for(j=0;j<A[1];j++) for(l=0;l<A[2];l++){
      t=trozo(s,[i,j,l],[i+1,j+1,l+1]);
      t.p[0]+=i*10; t.p[1]+=j*10; t.p[2]+=l*10;       // un poco separadas, para que se vea el corte
      nuevas.push(t);
    }
    if(demasiado(nuevas)) return null;
    pushUndo();
    sel=nuevas[0].id;
  } else {
    var T=trocitos(s), q=T[k];
    if(!q || T.length<2){ flash('Esa pieza no tiene subunidades que cortar'); return null; }
    var lo=[0,0,0], hi=[lado(s,0),lado(s,1),lado(s,2)], des=[0,0,0], bien=true;
    var saca=function(l0,h0,d0){

      r.p[0]+=d0[0]; r.p[1]+=d0[1]; r.p[2]+=d0[2];

    ax.forEach(function(m){

      if(q.lo[m]>1e-9){ h0[m]=q.lo[m]; saca(l0,h0,d0); }
      if(hi[m]-q.hi[m]>1e-9){ l0=lo.slice(); h0=hi.slice(); l0[m]=q.hi[m]; d0[m]+=20; saca(l0,h0,d0); }
      lo[m]=q.lo[m]; hi[m]=q.hi[m]; des[m]+=10;
    });
    if(ax.length===1) des[ax[0]===0? 1 : 0]+=14;       // el tramo de una longitud, además, un poco a un lado
    saca(lo,hi,des);
    if(!bien){ flash('Por ahí no sé cortar'); return null; }
    if(demasiado(nuevas)) return null;
    pushUndo();
    sel=nuevas[nuevas.length-1].id;
  }
  piezas=piezas.filter(function(o){ return o.id!==s.id; }).concat(nuevas);
  selK=null;
  draw();
  return nuevas;
}
/* --- unir ----------------------------------------------------------------------
   Se unen piezas de la misma clase y con la misma postura: longitudes sobre
   la misma recta, rectángulos en el mismo plano, prismas. Dos se tocan si
   están pegadas por uno de los ejes en que se extienden y se solapan en los
   demás; y se funden si además coinciden del todo en los demás. */
function mismaPostura(A,B){
  for(var m=0;m<3;m++) if(!A.e[m]!==!B.e[m]) return false;
  return true;
}
function seTocan(A,B){
  var m, a, toca=false;
  if(!mismaPostura(A,B)) return false;
  for(m=0;m<3;m++) if(!A.e[m] && Math.abs(A.p[m]-B.p[m])>=PEGA) return false;
  for(m=0;m<3 && !toca;m++){
    if(!A.e[m]) continue;
    if(Math.abs(A.p[m]+tam(A,m)-B.p[m])>=PEGA && Math.abs(B.p[m]+tam(B,m)-A.p[m])>=PEGA) continue;
    toca=true;
    for(a=0;a<3;a++){
      if(a===m || !A.e[a]) continue;
      if(Math.min(A.p[a]+tam(A,a),B.p[a]+tam(B,a))-Math.max(A.p[a],B.p[a])<=PEGA) toca=false;
    }
  }
  return toca;
}
function pegadas(s){
  var grupo=[s], cola=[s];
  while(cola.length){
    var p=cola.pop();
    piezas.forEach(function(o){
      if(grupo.indexOf(o)>=0 || !seTocan(p,o)) return;
      grupo.push(o); cola.push(o);
    });
  }
  return grupo;
}
/* A y B son descripciones: p, las fracciones fr de cada eje y las marcas mk
   en coordenadas de mundo. Devuelve la fundida, o null. */
function funde(A,B){
  var m, a, vale, primero, r, F;
  for(m=0;m<3;m++){
    if(!A.fr[m]) continue;
    vale=true;
    for(a=0;a<3;a++){
      if(a===m) continue;
      if(Math.abs(A.p[a]-B.p[a])>=PEGA) vale=false;
      if(A.fr[a] && A.fr[a][0]*B.fr[a][1]!==B.fr[a][0]*A.fr[a][1]) vale=false;
    }
    if(!vale) continue;
    var finA=A.p[m]+U*A.fr[m][0]/A.fr[m][1], finB=B.p[m]+U*B.fr[m][0]/B.fr[m][1];
    if(Math.abs(finA-B.p[m])>=PEGA && Math.abs(finB-A.p[m])>=PEGA) continue;
    primero=A.p[m]<B.p[m]? A : B;
    r=sumaFr(A.fr[m],B.fr[m]);
    F={p:primero.p.slice(), fr:A.fr.slice(), mk:[A.mk[0].concat(B.mk[0]), A.mk[1].concat(B.mk[1]), A.mk[2].concat(B.mk[2])]};
    F.fr[m]=r;
    F.mk[m].push(primero===A? finA : finB);
    return F;
  }

}
function une(s){
  if(!s) return null;
  var D=dimDe(s), grupo=pegadas(s), hecho=true, i, j, F, m;
  if(grupo.length<2){
    flash(D===1? 'No tiene ninguna longitud pegada a continuación: acércale otra hasta que el imán la enganche'
        : (D===2? 'No tiene ningún rectángulo pegado: acércale otro hasta que el imán lo enganche'
                : 'No tiene ningún prisma pegado: acércale otro hasta que el imán lo enganche'));
    return null;
  }
  var L=grupo.map(function(o){
    return {p:o.p.slice(),
            fr:o.e.map(function(E){ return E? [E.n,E.d] : null; }),
            mk:[0,1,2].map(function(a){ return o.e[a]? marcasEje(o,a).map(function(t){ return o.p[a]+t*U; }) : []; })};
  });
  while(L.length>1 && hecho){
    hecho=false;
    for(i=0;i<L.length && !hecho;i++) for(j=i+1;j<L.length && !hecho;j++){
      F=funde(L[i],L[j]);
      if(F){ L.splice(j,1); L[i]=F; hecho=true; }
    }
  }
  if(L.length>1){
    flash(D===1? 'Esas longitudes se pisan: no forman una sola'
        : (D===2? 'Esas piezas pegadas no forman un rectángulo' : 'Esas piezas pegadas no forman un prisma'));
    return null;
  }
  F=L[0];
  for(m=0;m<3;m++) if(F.fr[m] && (F.fr[m][0]/F.fr[m][1]>MAXLADO || F.fr[m][1]>1e5)){
    flash('Esa pieza sería enorme: no cabe en el tablero'); return null;
  }
  pushUndo();
  var t=nuevaPieza(F.p,[null,null,null]);
  for(m=0;m<3;m++) if(F.fr[m])
    t.e[m]={n:F.fr[m][0], d:F.fr[m][1], a:1,
            t:ordenaMarcas(F.mk[m].map(function(v){ return (v-F.p[m])/U; }), F.fr[m][0]/F.fr[m][1])};
  piezas=piezas.filter(function(o){ return grupo.indexOf(o)<0; }).concat([t]);
  sel=t.id; selK=null;
  draw();
  return t;
}
/* --- girar y volcar ----------------------------------------------------------------
   Un cuarto de vuelta alrededor de un eje. Si los otros dos son p y q, por
   ese orden, el punto (p,q) va a (Q−q, p), siendo Q lo que medía la pieza
   por q: lo que se extendía por q pasa a p, con las marcas contadas desde
   el otro lado, y lo que se extendía por p pasa a q tal cual.
   Girar es alrededor de la vertical. Volcar es alrededor del largo, salvo
   para las piezas a las que eso no les cambiaría la postura o no las dejaría
   volver a ella: una longitud tendida a lo largo o de pie, y un rectángulo
   de pie que mira hacia el largo, se vuelcan alrededor del ancho. La pieza
   se queda centrada donde estaba y a la misma altura. */
function gira(s,eje){
  if(!s) return false;
  if(eje===undefined) eje=2;
  pushUndo();
  var p=(eje+1)%3, q=(eje+2)%3, Q=lado(s,q);
  var cp=s.p[p]+tam(s,p)/2, cq=s.p[q]+tam(s,q)/2, z0=s.p[2];
  var T0=trocitos(s);
  var centros=s.res.map(function(k){
    var t=T0[k], c=[0,0,0];
    c[eje]=(t.lo[eje]+t.hi[eje])/2; c[p]=Q-(t.lo[q]+t.hi[q])/2; c[q]=(t.lo[p]+t.hi[p])/2;
    return c;
  });
  var Ep=s.e[p], Eq=s.e[q];
  s.e[p]=Eq? {n:Eq.n, d:Eq.d, a:Eq.a, t:ordenaMarcas(Eq.t.map(function(t){ return Q-t; }), Q)} : null;
  s.e[q]=Ep;
  s.p[p]=cp-tam(s,p)/2; s.p[q]=cq-tam(s,q)/2;
  if(eje!==2) s.p[2]=z0;
  s.res=[];
  centros.forEach(function(c){ var k=subEn(s,c); if(k>=0 && s.res.indexOf(k)<0) s.res.push(k); });
  s.res.sort(function(a,b){ return a-b; });
  selK=null;
  draw();
  return true;
}
function vuelca(s){
  if(!s) return false;
  return gira(s, ((esL(s) && !s.e[1]) || (!s.e[0] && s.e[1] && s.e[2]))? 1 : 0);
}
/* --- construir: el rectángulo y el prisma ---------------------------------------------
   Dos piezas que no comparten ningún eje y se tocan por una esquina dan la
   pieza que tiene las extensiones de las dos: dos longitudes, un rectángulo;
   un rectángulo y una longitud, un prisma. Nace lisa, y las dos piezas se
   quedan donde estaban. Si hay más de una candidata, vale la que se haya
   tocado la última, que es la que está más arriba en la lista. */
function companera(s,dim){
  var mejor=null;
  piezas.forEach(function(o){
    if(o.id===s.id || dimDe(s)+dimDe(o)!==dim) return;
    for(var m=0;m<3;m++){
      if(s.e[m] && o.e[m]) return;
      if(s.e[m]){ if(Math.abs(o.p[m]-s.p[m])>=2*PEGA && Math.abs(o.p[m]-s.p[m]-tam(s,m))>=2*PEGA) return; }
      else if(o.e[m]){ if(Math.abs(s.p[m]-o.p[m])>=2*PEGA && Math.abs(s.p[m]-o.p[m]-tam(o,m))>=2*PEGA) return; }
      else if(Math.abs(s.p[m]-o.p[m])>=2*PEGA) return;
    }
    mejor=o;
  });
  return mejor;
}
function construye(s,dim){
  var o=companera(s,dim), m, de;
  if(!o) return null;
  pushUndo();
  var t=nuevaPieza(s.p,[null,null,null]);
  for(m=0;m<3;m++){
    de=s.e[m]? s : (o.e[m]? o : null);
    if(!de) continue;
    t.p[m]=de.p[m];
    t.e[m]=ext(de.e[m].n, de.e[m].d);
  }
  piezas.push(t); sel=t.id; selK=null;
  draw();
  return t;
}
function rectangulo(s){
  if(!s || !esL(s)) return null;
  var t=construye(s,2);
  if(!t) flash('Hace falta otra longitud en ángulo recto con esta, pegada por un extremo');
  return t;
}
function prisma(s){
  if(!s || dimDe(s)>2) return null;
  var t=construye(s,3);
  if(!t) flash('Hace falta un rectángulo y una longitud que salga de una de sus esquinas, en ángulo recto con él');
  return t;
}
/* --- resaltar --------------------------------------------------------------------
   Resaltar no fabrica nada: señala, dentro de un rectángulo o de un prisma,
   unas subunidades de las que tiene. */
function resalta(s,k){
  if(!s || esL(s)) return false;
  if(nSub(s)<2){ flash('Se resaltan subunidades: primero parte la pieza'); return false; }
  if(k===null || k===undefined){
    if(!s.res.length){ flash('Elige una subunidad con «Seleccionar subunidad» para resaltarla'); return false; }
    pushUndo(); s.res=[];                 // con la pieza entera, se quita todo lo resaltado
  } else {
    pushUndo();
    var i=s.res.indexOf(k);
    if(i>=0) s.res.splice(i,1); else{ s.res.push(k); s.res.sort(function(p,q){ return p-q; }); }
  }
  draw();
  return true;
}
function ponResalte(s,k,poner){
  var i=s.res.indexOf(k);
  if(poner && i<0){ s.res.push(k); s.res.sort(function(p,q){ return p-q; }); return true; }
  if(!poner && i>=0){ s.res.splice(i,1); return true; }
  return false;
}
/* En el modo de resaltar, pinchar en una subunidad la resalta o la deja de
   resaltar, y arrastrando se sigue haciendo lo mismo con las que se pisen.
   Los puntos son de pantalla. */
function empiezaAResaltar(sp){
  var t=apunta(sp);
  if(!t || t.s.hueca) return null;
  sel=t.s.id; selK=null;
  if(esL(t.s)){ flash('Se resaltan subunidades de un rectángulo o de un prisma'); return null; }
  if(nSub(t.s)<2){ flash('Se resaltan subunidades: primero parte la pieza'); return null; }
  if(t.k<0) return null;
  pushUndo();
  var poner=t.s.res.indexOf(t.k)<0;
  ponResalte(t.s,t.k,poner);
  return {s:t.s, poner:poner};
}
function sigueResaltando(R,sp){
  var d=mira(), h=golpe(R.s,rayo(sp),d);
  if(!h) return false;
  var k=subDeGolpe(R.s,h,d);
  return k>=0 && ponResalte(R.s,k,R.poner);
}
function ahueca(s){
  if(!s || esL(s)) return false;
  pushUndo();
  s.hueca=s.hueca? 0 : 1;
  if(s.hueca) selK=null;
  draw();
  return true;
}
function quita(s){
  if(!s) return false;
  pushUndo();
  piezas=piezas.filter(function(q){ return q.id!==s.id; });
  sel=null; selK=null; draw();
  return true;
}
/* dónde sacar una pieza nueva: en el suelo, delante de todo lo que hay */
function sitioLibre(){
  if(!piezas.length) return [0,0,0];
  var x=Infinity, y=-Infinity;
  piezas.forEach(function(s){ x=Math.min(x,s.p[0]); y=Math.max(y,s.p[1]+tam(s,1)); });
  return [x, y+0.4*U, 0];
}
function saca(t){
  pushUndo();
  piezas.push(t); sel=t.id; selK=null;
  if(!enPantalla(t)) fitView(); else draw();
  return t;
}
function otraUnidad(){ return saca(nuevaUnidad(sitioLibre())); }
/* las unidades de área y de volumen, ya hechas: para tenerlas de referencia sin construirlas */
function otraUnidadA(){ return saca(nuevaUnidadA(sitioLibre())); }
function otraUnidadV(){ return saca(nuevaUnidadV(sitioLibre())); }
function tableroNuevo(){
  piezas=[nuevaUnidad([0,0,0])]; sel=piezas[0].id; selK=null;
}
function ponEnunciado(e){
  pushUndo();
  enun=e; tableroNuevo();
  fitView();
}
function ponModo(m){
  modo = (m==='sub' || m==='res')? m : 'pieza';
  if(modo!=='sub') selK=null;
  draw();
}

/* =========================================================================
   6. LA PERSPECTIVA
   La vista gira de cuarto en cuarto de vuelta alrededor de la vertical: se
   giran las coordenadas antes de proyectar. mira() dice desde qué lado se ve
   cada eje, que es lo que decide qué tres caras de una caja se ven y en qué
   orden hay que pintar.
   ========================================================================= */
function proy(x,y,z){
  var t, i;
  for(i=0;i<giro;i++){ t=x; x=y; y=-t; }
  return {x:(x-y)*CX, y:(x+y)*CY-z};
}
function P3(x,y,z){ return w2s(proy(x,y,z)); }
function mira(){
  var a=proy(1,0,0), b=proy(0,1,0);
  return [a.y>0? 1 : -1, b.y>0? 1 : -1, 1];
}
/* punto de pantalla -> punto del plano de altura h */
function sueloEn(sp,h){
  var w=s2w(sp), a=w.x/CX, b=(w.y+(h||0))/CY, x=(b+a)/2, y=(b-a)/2, t, i;
  for(i=0;i<giro;i++){ t=x; x=-y; y=t; }
  return {x:x, y:y};
}
/* la recta de los puntos que se ven en ese punto de la pantalla */
function rayo(sp){
  var B=sueloEn(sp,0);
  return {b:[B.x,B.y,0], d:mira()};
}
/* las caras que se ven: las tres de un prisma, la única de un rectángulo */
function carasFrente(s){
  if(dimDe(s)===3) return [0,1,2];
  for(var m=0;m<3;m++) if(!s.e[m]) return [m];
  return [];
}
function coordCara(s,m,d){ return (s.e[m] && d[m]>0)? s.p[m]+tam(s,m) : s.p[m]; }
/* si la subunidad q da a la cara m, que es de las que se ven */
function tocaCara(s,q,m,d){
  if(!s.e[m]) return true;
  return d[m]>0? Math.abs(q.hi[m]-lado(s,m))<1e-9 : q.lo[m]<1e-9;
}
/* dónde da el rayo en la pieza: la cara, el punto y lo cerca que queda (t) */
function golpe(s,R){
  var C=carasFrente(s), best=null, i, m, a, t, q, co, bien;
  for(i=0;i<C.length;i++){
    m=C[i]; co=coordCara(s,m,R.d); t=(co-R.b[m])/R.d[m];
    q=[R.b[0]+t*R.d[0], R.b[1]+t*R.d[1], R.b[2]+t*R.d[2]]; q[m]=co;
    bien=true;
    for(a=0;a<3;a++){
      if(a===m) continue;
      if(q[a]<s.p[a]-1e-7 || q[a]>s.p[a]+tam(s,a)+1e-7) bien=false;
    }
    if(bien && (!best || t>best.t)) best={t:t, m:m, q:q};
  }
  return best;
}
function subDeGolpe(s,h,d){
  var l=[0,0,0], a;
  for(a=0;a<3;a++) l[a]=Math.max(0, Math.min(lado(s,a), (h.q[a]-s.p[a])/U));
  if(s.e[h.m]) l[h.m]=d[h.m]>0? lado(s,h.m)-1e-6 : 1e-6;
  return subEn(s,l);
}
/* las aristas de una caja: 1, 4 o 12. Las tres de atrás de un prisma no se ven. */
function aristas(s,d){
  var out=[], e, o1, o2, i, j, q;
  for(e=0;e<3;e++){
    if(!s.e[e]) continue;
    o1=(e+1)%3; o2=(e+2)%3;
    for(i=0;i<(s.e[o1]?2:1);i++) for(j=0;j<(s.e[o2]?2:1);j++){
      q=s.p.slice(); q[o1]+=i*tam(s,o1); q[o2]+=j*tam(s,o2);
      out.push({e:e, q:q, t0:s.p[e], t1:s.p[e]+tam(s,e),
                atras:dimDe(s)===3 && i===(d[o1]>0? 0 : 1) && j===(d[o2]>0? 0 : 1)});
    }
  }
  return out;
}
function extremosArista(A){
  var a=A.q.slice(), b=A.q.slice();
  a[A.e]=A.t0; b[A.e]=A.t1;
  return [P3(a[0],a[1],a[2]), P3(b[0],b[1],b[2])];
}
function dSeg(p,a,b){
  var vx=b.x-a.x, vy=b.y-a.y, L2=vx*vx+vy*vy, t=L2? ((p.x-a.x)*vx+(p.y-a.y)*vy)/L2 : 0;
  t=Math.max(0, Math.min(1,t));
  var dx=p.x-(a.x+t*vx), dy=p.y-(a.y+t*vy);
  return {d:Math.sqrt(dx*dx+dy*dy), t:t};
}
/* una longitud no tiene grosor: se le da un margen a cada lado para poder acertarle */
function tocaL(s,sp){
  var m=ejesDe(s)[0], E=extremosArista(aristas(s,[1,1,1])[0]), g=dSeg(sp,E[0],E[1]);
  if(g.d>8) return null;
  var u=g.t*lado(s,m), C=cortesEje(s,m), k=-1, i;
  for(i=0;i+1<C.length;i++) if(u>=C[i]-1e-9 && u<=C[i+1]+1e-9) k=i;
  return {k:k};
}
function tocaBorde(s,sp,d){
  return aristas(s,d).some(function(A){ var E=extremosArista(A); return dSeg(sp,E[0],E[1]).d<=7; });
}
/* Qué hay en un punto de la pantalla: la pieza y la subunidad. Primero las
   longitudes, y de las que se pisan —dos que salen de la misma esquina—, la
   más corta: a la larga siempre le queda un trozo libre. Luego las piezas en
   solo el borde, que se cogen por el borde. Y de las demás, la que queda más
   cerca; a igualdad, un rectángulo antes que un prisma, y la tocada la última. */
function apunta(sp){
  var i, s, h, mejor=null, R=rayo(sp), dim;
  for(i=piezas.length-1;i>=0;i--){
    s=piezas[i];
    if(!esL(s)) continue;
    h=tocaL(s,sp);
    if(h && (!mejor || largoL(s)<largoL(mejor.s)-1e-9)) mejor={s:s, k:h.k};
  }
  if(mejor) return mejor;
  for(i=piezas.length-1;i>=0;i--){
    s=piezas[i];
    if(!esL(s) && s.hueca && tocaBorde(s,sp,R.d)) return {s:s, k:-1};
  }
  for(dim=3;dim>=2;dim--) for(i=0;i<piezas.length;i++){
    s=piezas[i];
    if(dimDe(s)!==dim || s.hueca) continue;
    h=golpe(s,R);
    if(h && (!mejor || h.t>=mejor.h.t-1e-6)) mejor={s:s, h:h};
  }
  if(!mejor) return null;
  mejor.k=subDeGolpe(mejor.s,mejor.h,R.d);
  return mejor;
}
function piezaEn(sp){ var t=apunta(sp); return t? t.s : null; }

/* --- lo que tapa a lo demás -----------------------------------------------------
   Un punto queda tapado por una caja si, yendo desde él hacia quien mira, se
   entra en ella. Para un segmento paralelo a un eje, los puntos tapados por
   una caja forman un solo tramo, y se calcula sin tantear: así se sabe
   exactamente qué parte de cada línea se ve.
   Los rectángulos tapan como cajas muy finas. De dos rectángulos en el mismo
   plano, tapa el que se tocó el último; y de dos prismas con caras en el
   mismo plano, lo mismo: por eso la caja del que va detrás en la lista se
   agranda un pelo hacia quien mira. */
var FINO=0.02, DENTRO=0.06;
var LINEA={lin:true};            // quien pregunta es una longitud: lo que está en el plano de un rectángulo queda encima de él
function tapadores(){
  var out=[];
  piezas.forEach(function(s,i){
    if(dimDe(s)<2 || s.hueca) return;
    var pl=-1, m;
    for(m=0;m<3;m++) if(!s.e[m]) pl=m;
    out.push({s:s, i:i, pl:pl, lo:s.p.slice(), hi:finDe(s)});
  });
  return out;
}
function tapadorDe(s,OC){
  for(var i=0;i<OC.length;i++) if(OC[i].s===s) return OC[i];
  return null;
}
function cajaTapa(o,du,d){
  var lo=o.lo.slice(), hi=o.hi.slice(), m;
  if(o.pl>=0){
    if(du && du.lin){ if(d[o.pl]>0) lo[o.pl]-=FINO; else hi[o.pl]+=FINO; return {lo:lo, hi:hi}; }
    if(du && du.pl===o.pl && Math.abs(du.lo[o.pl]-o.lo[o.pl])<0.5 && o.i<du.i) return null;
    lo[o.pl]-=FINO; hi[o.pl]+=FINO;
  } else if(du && du.pl<0 && o.i>du.i){
    for(m=0;m<3;m++){ if(d[m]>0) hi[m]+=FINO; else lo[m]-=FINO; }
  }
  return {lo:lo, hi:hi};
}
function quitaTramo(V,a,b){
  var out=[], i;
  for(i=0;i<V.length;i++){
    if(b<=V[i][0] || a>=V[i][1]){ out.push(V[i]); continue; }
    if(a>V[i][0]) out.push([V[i][0],a]);
    if(b<V[i][1]) out.push([b,V[i][1]]);
  }
  return out;
}
/* los tramos que se ven del segmento que va de t0 a t1 por el eje e, pasando por q */
function loQueSeVe(e,t0,t1,q,du,OC,d){
  var V=[[t0,t1]], i, o, B, s0, s1, m, a0, a1, g;
  for(i=0;i<OC.length && V.length;i++){
    o=OC[i];
    if(du && o.s===du.s) continue;
    B=cajaTapa(o,du,d);
    if(!B) continue;
    s0=0; s1=Infinity;
    for(m=0;m<3;m++){
      if(m===e) continue;
      a0=(B.lo[m]-q[m])/d[m]; a1=(B.hi[m]-q[m])/d[m];
      if(a0>a1){ g=a0; a0=a1; a1=g; }
      if(a0>s0) s0=a0;
      if(a1<s1) s1=a1;
    }
    if(s1-s0<1e-4) continue;
    if(d[e]>0) V=quitaTramo(V, B.lo[e]-s1, B.hi[e]-s0);
    else V=quitaTramo(V, B.lo[e]+s0, B.hi[e]+s1);
  }
  return V;
}
/* junta tramos que se pisan, y da los que faltan para llenar de t0 a t1 */
function juntaTramos(V){
  var out=[];
  V.slice().sort(function(a,b){ return a[0]-b[0]; }).forEach(function(I){
    if(out.length && I[0]<=out[out.length-1][1]+1e-9) out[out.length-1][1]=Math.max(out[out.length-1][1],I[1]);
    else out.push([I[0],I[1]]);
  });
  return out;
}
function losDemas(V,t0,t1){
  var out=[], t=t0;
  V.forEach(function(I){ if(I[0]>t) out.push([t,I[0]]); t=Math.max(t,I[1]); });
  if(t1>t) out.push([t,t1]);
  return out;
}
/* Los tramos que se ven de una arista. Una arista es el borde de una o dos
   caras de las que se ven; se mira como borde de cada una, un pelo hacia
   dentro de ella, y se ve lo que se vea de alguna de las dos maneras. Las
   tres aristas de atrás de un prisma no son borde de ninguna: no se ven. */
function vistoArista(A,s,du,OC,d){
  if(A.atras) return [];
  if(!OC) return [[A.t0,A.t1]];
  var o=[(A.e+1)%3,(A.e+2)%3], V=[], j, cara, otro, q;
  for(j=0;j<2;j++){
    cara=o[j]; otro=o[1-j];
    if(dimDe(s)===3? Math.abs(A.q[cara]-coordCara(s,cara,d))>1e-9 : !!s.e[cara]) continue;
    q=A.q.slice();
    q[otro]+=(A.q[otro]<=s.p[otro]+1e-9)? DENTRO : -DENTRO;
    V=V.concat(loQueSeVe(A.e,A.t0,A.t1,q,du,OC,d));
  }
  return juntaTramos(V);
}
/* lo mismo para un punto: no se ve si, yendo hacia quien mira, se entra en alguna caja.
   Un punto que está justo en el borde de lo que tapa una caja se ve. */
function puntoVisto(q,du,OC,d){
  var i, o, B, s0, s1, m, a0, a1, g;
  for(i=0;i<OC.length;i++){
    o=OC[i];
    if(du && o.s===du.s) continue;
    B=cajaTapa(o,du,d);
    if(!B) continue;
    s0=0; s1=Infinity;
    for(m=0;m<3;m++){
      a0=(B.lo[m]-q[m])/d[m]; a1=(B.hi[m]-q[m])/d[m];
      if(a0>a1){ g=a0; a0=a1; a1=g; }
      if(a0>s0) s0=a0;
      if(a1<s1) s1=a1;
    }
    if(s1-s0>=1e-4) return false;
  }
  return true;
}

/* =========================================================================
   7. DIBUJO
   ========================================================================= */
/* --- las expresiones: fracciones apiladas, el signo y las unidades ---------- */
function tokFr(E,col){ return {n:E.n, d:E.d, col:col}; }
function toksL(s){ return [tokFr(s.e[ejesDe(s)[0]],AZUL), {t:'u', col:AZUL}]; }
/* El rótulo de un rectángulo: sus dos lados, delante el del eje más alto. El
   de un prisma: su altura y, entre paréntesis, los lados de su base. Lo que
   mide solo se escribe si se pide, salvo en las unidades. */
function toksPieza(s){
  var ax=ejesDe(s), D=ax.length, un=D===2? 'u²' : 'u³', v=valor(s), T;
  if(D===2) T=[tokFr(s.e[ax[1]],AZUL), {t:'u'}, {t:'×'}, tokFr(s.e[ax[0]],AZUL), {t:'u'}];
  else T=[tokFr(s.e[2],AZUL), {t:'u'}, {t:'×'}, {t:'('}, tokFr(s.e[1],AZUL), {t:'u'}, {t:'×'},
          tokFr(s.e[0],AZUL), {t:'u'}, {t:')'}];
  if(esUnidad(s)) return T.concat([{t:'='}, {n:1, d:1, col:VERDE.t}, {t:un, col:VERDE.t}]);
  if(opt.res) T=T.concat([{t:'='}, {n:v.n, d:v.d, col:TINTA}, {t:un}]);
  return T;
}
/* El rótulo de lo resaltado dice lo que mide, y por eso solo sale con
   Resultado: tantas subunidades de las que tiene la pieza, cuando son todas
   iguales; si no, la fracción que sumen. */
function toksResaltado(s){
  if(esL(s) || !opt.res || !s.res.length) return [];
  var T=trocitos(s), v=valor(s), suma=0, f, un=dimDe(s)===2? 'u²' : 'u³';
  if(sonIguales(s,T)) f=parteFr(v.n, v.d, s.res.length, T.length);
  else {
    s.res.forEach(function(k){ if(T[k]) suma+=medidaTro(s,T[k]); });
    var g=fraccionDe(suma);
    if(!g) return [];
    f=[g.n,g.d];
  }
  return [{n:f[0], d:f[1], col:NARANJA.t}, {t:un, col:NARANJA.t}];
}
function toksEnunciado(){
  return [{n:enun.p, d:enun.q, col:AZUL}, {t:'u'}, {t:'×'}, {n:enun.a, d:enun.b, col:AZUL}, {t:'u²'}];
}
function sinHueco(T,i){ return i===0 || T[i].t===')' || T[i-1].t==='('; }
function textoDe(T){
  return T.map(function(t,i){ return (sinHueco(T,i)? '' : ' ')+(t.t!==undefined? t.t : txtFr(t.n,t.d)); }).join('');
}
function fuente(px,estilo){ return (estilo? estilo+' ' : '')+px+'px '+FONT; }
function esUnidadTxt(t){ return t==='u' || t==='u²' || t==='u³'; }
function anchoTok(c,t,px){
  if(t.t!==undefined){ c.font=fuente(px, esUnidadTxt(t.t)?'italic 600':''); return c.measureText(t.t).width; }
  if(t.d===1){ c.font=fuente(px,'600'); return c.measureText(''+t.n).width; }
  c.font=fuente(px*0.84,'600');
  return Math.max(c.measureText(''+t.n).width, c.measureText(''+t.d).width)+px*0.34;
}
function exprAncho(c,T,px){
  var w=0;
  for(var i=0;i<T.length;i++) w+=anchoTok(c,T[i],px)+(sinHueco(T,i)? (i? px*0.08 : 0) : px*0.34);
  return w;
}
function dibExpr(c,T,x,y,px){
  c.save();
  c.textBaseline='middle';
  for(var i=0;i<T.length;i++){
    var t=T[i], w=anchoTok(c,t,px);
    if(i) x+=sinHueco(T,i)? px*0.08 : px*0.34;
    if(t.t!==undefined || t.d===1){
      c.textAlign='left';
      c.fillStyle=t.col||(esUnidadTxt(t.t) || t.t===undefined? TINTA : '#5a626e');
      c.fillText(t.t!==undefined? t.t : ''+t.n, x, y);
    } else {
      c.fillStyle=t.col||TINTA;
      c.textAlign='center';
      c.fillText(''+t.n, x+w/2, y-px*0.5);
      c.fillText(''+t.d, x+w/2, y+px*0.56);
      c.fillRect(x, y-Math.max(0.6,px*0.04), w, Math.max(1.2,px*0.08));
    }
    x+=w;
  }
  c.restore();
}
function linea(c,x0,y0,x1,y1){ c.beginPath(); c.moveTo(x0,y0); c.lineTo(x1,y1); c.stroke(); }
/* una punta de flecha en (x,y) que mira hacia (ux,uy) */
function flecha(c,x,y,ux,uy,m){
  c.beginPath();
  c.moveTo(x-ux*m-uy*m*0.6, y-uy*m+ux*m*0.6);
  c.lineTo(x,y);
  c.lineTo(x-ux*m+uy*m*0.6, y-uy*m-ux*m*0.6);
  c.stroke();
}
function sombrea(hex,f){
  var r=parseInt(hex.substr(1,2),16), g=parseInt(hex.substr(3,2),16), b=parseInt(hex.substr(5,2),16);
  r=Math.round(r+(f>0? (255-r)*f : r*f)); g=Math.round(g+(f>0? (255-g)*f : g*f)); b=Math.round(b+(f>0? (255-b)*f : b*f));
  return 'rgb('+r+','+g+','+b+')';
}
/* la cara de arriba, con su color; la que queda a la derecha, algo más oscura; la de la izquierda, más */
function tono(hex,m){
  if(m===2) return hex;
  return sombrea(hex, ((m===0)===(giro%2===0))? -0.08 : -0.17);
}
/* las cuatro esquinas, en pantalla, del trozo de la cara m (a la altura co de su eje) que va de lo a hi */
function esquinas(m,co,lo,hi){
  var ua=(m+1)%3, va=(m+2)%3, a=[0,0,0], out=[], k, uv=[[0,0],[1,0],[1,1],[0,1]];
  a[m]=co;
  for(k=0;k<4;k++){
    a[ua]=uv[k][0]? hi[ua] : lo[ua]; a[va]=uv[k][1]? hi[va] : lo[va];
    out.push(P3(a[0],a[1],a[2]));
  }
  return out;
}
function camino(c,pts){
  c.beginPath(); c.moveTo(pts[0].x,pts[0].y);
  for(var i=1;i<pts.length;i++) c.lineTo(pts[i].x,pts[i].y);
  c.closePath();
}
/* El rayado de lo resaltado. Las rayas van por diagonales fijas del mundo, y
   de cada una se dibuja solo el trozo que cae dentro: así casan de un
   fragmento de cara al de al lado sin necesidad de recortar. */
function rayadoCara(c,m,co,lo,hi,col,alfa){
  var ua=(m+1)%3, va=(m+2)%3, paso=9, k, a, b, q=[0,0,0], A, B;
  function pt(u,v){ q[m]=co; q[ua]=u; q[va]=v; return P3(q[0],q[1],q[2]); }
  c.save();
  c.strokeStyle=col; c.globalAlpha=0.3*alfa; c.lineWidth=Math.max(1,1.2*view.z);
  for(k=Math.ceil((lo[ua]+lo[va])/paso); k*paso<hi[ua]+hi[va]; k++){
    a=Math.max(lo[ua], k*paso-hi[va]); b=Math.min(hi[ua], k*paso-lo[va]);
    if(b-a>1e-6){ A=pt(a,k*paso-a); B=pt(b,k*paso-b); linea(c,A.x,A.y,B.x,B.y); }
  }
  for(k=Math.ceil((lo[ua]-hi[va])/paso); k*paso<hi[ua]-lo[va]; k++){
    a=Math.max(lo[ua], k*paso+lo[va]); b=Math.min(hi[ua], k*paso+hi[va]);
    if(b-a>1e-6){ A=pt(a,a-k*paso); B=pt(b,b-k*paso); linea(c,A.x,A.y,B.x,B.y); }
  }
  c.restore();
}
/* lo que va pintado encima de cada cara que se ve de la pieza: lo resaltado y la subunidad seleccionada */
function capasDe(s,marca,d){
  var out=[[],[],[]], T=null;
  function mete(k,tipo){
    T=T||trocitos(s);
    var q=T[k];
    if(!q) return;
    carasFrente(s).forEach(function(m){
      if(!tocaCara(s,q,m,d)) return;
      out[m].push({lo:[s.p[0]+U*q.lo[0], s.p[1]+U*q.lo[1], s.p[2]+U*q.lo[2]],
                   hi:[s.p[0]+U*q.hi[0], s.p[1]+U*q.hi[1], s.p[2]+U*q.hi[2]], tipo:tipo});
    });
  }
  s.res.forEach(function(k){ mete(k,'res'); });
  if(marca && marca.sel===s.id && marca.k!==null && marca.k!==undefined && nSub(s)>1) mete(marca.k,'sel');
  return out;
}
/* un trozo de la cara m de la pieza: su relleno y lo que lleve pintado encima */
function fragmento(c,s,m,co,lo,hi,capas,alfa){
  var C=colorDe(s), ua=(m+1)%3, va=(m+2)%3, L=capas[m], i, r, l2, h2;
  c.globalAlpha=alfa;
  camino(c,esquinas(m,co,lo,hi));
  c.fillStyle=tono(C.f,m); c.fill();
  if(alfa===1){ c.strokeStyle=c.fillStyle; c.lineWidth=0.8; c.stroke(); }     // para que no se vea la junta con el trozo de al lado
  for(i=0;i<L.length;i++){
    r=L[i]; l2=lo.slice(); h2=hi.slice();
    l2[ua]=Math.max(lo[ua],r.lo[ua]); h2[ua]=Math.min(hi[ua],r.hi[ua]);
    l2[va]=Math.max(lo[va],r.lo[va]); h2[va]=Math.min(hi[va],r.hi[va]);
    if(h2[ua]-l2[ua]<1e-6 || h2[va]-l2[va]<1e-6) continue;
    camino(c,esquinas(m,co,l2,h2));
    if(r.tipo==='res'){
      c.globalAlpha=alfa;
      c.fillStyle=tono(NARANJA.f,m); c.fill();
      if(alfa===1){ c.strokeStyle=c.fillStyle; c.lineWidth=0.8; c.stroke(); }
      rayadoCara(c,m,co,l2,h2,NARANJA.b,alfa);
    } else {
      c.globalAlpha=1;
      c.fillStyle='rgba(31,78,140,.2)'; c.fill();
    }
  }
}
/* --- el relleno, por celdas -------------------------------------------------------
   Los planos de las caras de todas las piezas trocean el espacio en una
   rejilla. Sus celdas se recorren de lejos a cerca; de cada celda ocupada
   por un prisma se pintan las caras que dan a una celda sin prisma, y los
   rectángulos se pintan cuando toca la celda que tienen justo delante, si
   está libre. Lo que haya más cerca se pinta después y lo tapa. */
function pintaOpaco(c,G,marca,d){
  if(!G.length) return;
  var X=[[],[],[]], n=[0,0,0], capas={}, celdas={}, claves=[], m;
  G.forEach(function(s){
    for(var a=0;a<3;a++){ X[a].push(s.p[a]); if(s.e[a]) X[a].push(s.p[a]+tam(s,a)); }
  });
  for(m=0;m<3;m++){
    X[m].sort(function(p,q){ return p-q; });
    var u=[X[m][0]-1];
    X[m].forEach(function(v){ if(v-u[u.length-1]>1e-4) u.push(v); });
    u.push(u[u.length-1]+1);
    X[m]=u; n[m]=u.length-1;
  }
  if(n[0]*n[1]*n[2]>3e6){ pintaSueltas(c,G,marca,d,1); return; }
  function ind(a,v){
    var lo=0, hi=X[a].length-1, mid;
    while(lo<hi){ mid=(lo+hi)>>1; if(X[a][mid]<v-1e-4) lo=mid+1; else hi=mid; }
    return lo;
  }
  function clave(i,j,k){ return ((d[0]>0? i : n[0]-1-i)*n[1]+(d[1]>0? j : n[1]-1-j))*n[2]+k; }
  function celda(i,j,k){
    var K=clave(i,j,k);
    if(!celdas[K]){ celdas[K]={i:i, j:j, k:k, o:null, f:[]}; claves.push(K); }
    return celdas[K];
  }
  function capasDeS(s){ return capas[s.id] || (capas[s.id]=capasDe(s,marca,d)); }
  G.forEach(function(s){
    var a=[0,0,0], b=[0,0,0], pl=-1, t, i, j, k;
    for(t=0;t<3;t++){
      a[t]=ind(t,s.p[t]);
      if(s.e[t]) b[t]=ind(t,s.p[t]+tam(s,t));
      else { pl=t; if(d[t]<0) a[t]--; b[t]=a[t]+1; }      // un rectángulo: la celda que tiene delante
    }
    for(i=a[0];i<b[0];i++) for(j=a[1];j<b[1];j++) for(k=a[2];k<b[2];k++){
      if(pl<0) celda(i,j,k).o=s; else celda(i,j,k).f.push(s);
    }
  });
  claves.sort(function(p,q){ return p-q; });
  c.save();
  claves.forEach(function(K){
    var ce=celdas[K], lo=[X[0][ce.i],X[1][ce.j],X[2][ce.k]], hi=[X[0][ce.i+1],X[1][ce.j+1],X[2][ce.k+1]], a, v, ve;
    if(!ce.o){
      ce.f.forEach(function(s){ var pl=carasFrente(s)[0]; fragmento(c,s,pl,s.p[pl],lo,hi,capasDeS(s),1); });
      return;
    }
    for(a=0;a<3;a++){
      v=[ce.i,ce.j,ce.k]; v[a]+=d[a];
      ve=celdas[clave(v[0],v[1],v[2])];
      if(ve && ve.o) continue;
      fragmento(c,ce.o,a,d[a]>0? hi[a] : lo[a],lo,hi,capasDeS(ce.o),1);
    }
  });
  c.restore();
}
/* Con transparencia no hay nada que tapar: cada pieza se pinta entera, de
   lejos a cerca, y se ve lo que tiene dentro y detrás. Las subunidades
   resaltadas de dentro de un prisma, que opacas no se verían, también. */
function pintaSueltas(c,G,marca,d,alfa){
  function hondo(s){ return d[0]*(s.p[0]+tam(s,0)/2)+d[1]*(s.p[1]+tam(s,1)/2)+s.p[2]+tam(s,2)/2; }
  c.save();
  G.slice().sort(function(a,b){ return hondo(a)-hondo(b); }).forEach(function(s){
    var capas=capasDe(s,marca,d), hi=finDe(s);
    carasFrente(s).forEach(function(m){ fragmento(c,s,m,coordCara(s,m,d),s.p,hi,capas,alfa); });
    if(alfa===1 || dimDe(s)<3 || !s.res.length) return;
    var T=trocitos(s);
    s.res.forEach(function(k){
      var q=T[k], lo, h2, m;
      if(!q) return;
      lo=[s.p[0]+U*q.lo[0], s.p[1]+U*q.lo[1], s.p[2]+U*q.lo[2]];
      h2=[s.p[0]+U*q.hi[0], s.p[1]+U*q.hi[1], s.p[2]+U*q.hi[2]];
      for(m=0;m<3;m++){
        if(tocaCara(s,q,m,d)) continue;
        c.globalAlpha=alfa;
        camino(c,esquinas(m,d[m]>0? h2[m] : lo[m],lo,h2));
        c.fillStyle=tono(NARANJA.f,m); c.fill();
        rayadoCara(c,m,d[m]>0? h2[m] : lo[m],lo,h2,NARANJA.b,alfa);
      }
    });
  });
  c.restore();
}
/* --- las líneas: los bordes y las marcas, solo lo que se ve ------------------------- */
function dePuntos(c,si){ if(c.setLineDash) c.setLineDash(si? [5*view.z,4*view.z] : []); }
function trazo(c,e,t0,t1,q,du,OC,d,dentro){
  var V=[[t0,t1]], a=[q[0],q[1],q[2]], i, A, B;
  if(OC) V=loQueSeVe(e,t0,t1,dentro? [q[0]+dentro[0],q[1]+dentro[1],q[2]+dentro[2]] : q,du,OC,d);
  for(i=0;i<V.length;i++){
    if(V[i][1]-V[i][0]<0.05) continue;
    a[e]=V[i][0]; A=P3(a[0],a[1],a[2]);
    a[e]=V[i][1]; B=P3(a[0],a[1],a[2]);
    linea(c,A.x,A.y,B.x,B.y);
  }
}
function trazosPieza(c,s,marca,OC,d){
  var z=view.z, C=colorDe(s), du=OC? tapadorDe(s,OC) : null, lo=s.p, hi=finDe(s);
  var sele=!!marca && marca.sel===s.id;
  var entera=sele && (marca.k===null || marca.k===undefined || nSub(s)<2);
  carasFrente(s).forEach(function(m){
    var co=coordCara(s,m,d), par=[(m+1)%3,(m+2)%3];
    /* las marcas que le quedan de antes, finas, y los cortes de ahora, más gruesos */
    par.forEach(function(ax,j){
      var ot=par[1-j], E=s.e[ax], Lg=E.n/E.d, q=[0,0,0], k;
      q[m]=co;
      c.strokeStyle=C.b;
      c.globalAlpha=0.55; c.lineWidth=Math.max(1,1.1*z);
      E.t.forEach(function(t){ q[ax]=lo[ax]+t*U; trazo(c,ot,lo[ot],hi[ot],q,du,OC,d,null); });
      c.globalAlpha=1; c.lineWidth=Math.max(1.4,2*z);
      for(k=1;k<E.a;k++){ q[ax]=lo[ax]+U*Lg*k/E.a; trazo(c,ot,lo[ot],hi[ot],q,du,OC,d,null); }
    });
  });
  /* las aristas: lo que se ve, de trazo continuo; lo que queda tapado, por la propia pieza o por otra, de puntos */
  var AR=aristas(s,d).map(function(A){ return {A:A, V:vistoArista(A,s,du,OC,d)}; });
  var tramo=function(A,a,b){
    if(b-a<0.05) return;
    var q=A.q.slice(), P, Q2;
    q[A.e]=a; P=P3(q[0],q[1],q[2]);
    q[A.e]=b; Q2=P3(q[0],q[1],q[2]);
    linea(c,P.x,P.y,Q2.x,Q2.y);
  };
  c.strokeStyle=entera? SELEC : C.b;
  c.globalAlpha=0.6; c.lineWidth=Math.max(1,1.3*z); c.lineCap='butt'; dePuntos(c,true);
  AR.forEach(function(o){ losDemas(o.V,o.A.t0,o.A.t1).forEach(function(I){ tramo(o.A,I[0],I[1]); }); });
  dePuntos(c,false); c.lineCap='round';
  c.globalAlpha=1; c.lineWidth=entera? Math.max(2.6,3.4*z) : Math.max(1.6,2.2*z);
  AR.forEach(function(o){ o.V.forEach(function(I){ tramo(o.A,I[0],I[1]); }); });
  if(sele && !entera){
    var t=trocitos(s)[marca.k];
    if(!t) return;
    c.strokeStyle=SELEC; c.lineWidth=Math.max(2.6,3.2*z);
    carasFrente(s).forEach(function(m){
      if(!tocaCara(s,t,m,d)) return;
      var co=coordCara(s,m,d), par=[(m+1)%3,(m+2)%3];
      par.forEach(function(ax,j){
        var ot=par[1-j], q=[0,0,0], a0=lo[ot]+U*t.lo[ot], a1=lo[ot]+U*t.hi[ot];
        q[m]=co;
        q[ax]=lo[ax]+U*t.lo[ax]; trazo(c,ot,a0,a1,q,du,OC,d,null);
        q[ax]=lo[ax]+U*t.hi[ax]; trazo(c,ot,a0,a1,q,du,OC,d,null);
      });
    });
  }
}
/* Una pieza en solo el borde: sus aristas, las de atrás de puntos, y sus
   marcas en las caras que se verían. Va siempre por encima de las demás. */
function drawHueca(c,s,marca,d){
  var z=view.z, C=colorDe(s), sele=!!marca && marca.sel===s.id, lo=s.p, hi=finDe(s);
  c.save();
  c.lineCap='round';
  carasFrente(s).forEach(function(m){
    var co=coordCara(s,m,d), par=[(m+1)%3,(m+2)%3];
    par.forEach(function(ax,j){
      var ot=par[1-j], E=s.e[ax], Lg=E.n/E.d, q=[0,0,0], k;
      q[m]=co;
      c.strokeStyle=C.b;
      c.globalAlpha=0.55; c.lineWidth=Math.max(1,1.1*z);
      E.t.forEach(function(t){ q[ax]=lo[ax]+t*U; trazo(c,ot,lo[ot],hi[ot],q,null,null,d,null); });
      c.globalAlpha=1; c.lineWidth=Math.max(1.4,2*z);
      for(k=1;k<E.a;k++){ q[ax]=lo[ax]+U*Lg*k/E.a; trazo(c,ot,lo[ot],hi[ot],q,null,null,d,null); }
    });
  });
  c.strokeStyle=sele? SELEC : C.b;
  aristas(s,d).forEach(function(A){
    var E=extremosArista(A);
    c.globalAlpha=A.atras? 0.6 : 1;
    c.lineWidth=A.atras? Math.max(1,1.3*z) : Math.max(2.6,3.4*z);
    c.lineCap=A.atras? 'butt' : 'round';
    dePuntos(c,A.atras);
    linea(c,E[0].x,E[0].y,E[1].x,E[1].y);
  });
  c.restore();
}
/* --- las etiquetas de las subunidades, tumbadas sobre su cara ------------------------- */
function direccion(m){ var v=[0,0,0]; v[m]=1; return proy(v[0],v[1],v[2]); }
function textoEnCara(c,m,cen,tams,largoT,corto,col){
  var z=view.z, px=Math.max(8, Math.min(13, 10.5*z)), a, b, ax, bx, wa, wb, g, P, t;
  if(m===2){
    ax=tams[1]>tams[0]+1e-9? 1 : 0; bx=1-ax;
    a=direccion(ax); b=direccion(bx);
    if(a.x<0){ a={x:-a.x, y:-a.y}; }
    if(a.x*b.y-a.y*b.x<0){ b={x:-b.x, y:-b.y}; }
  } else {
    ax=m===0? 1 : 0; bx=2;
    a=direccion(ax); b={x:0, y:1};
    if(a.x<0){ a={x:-a.x, y:-a.y}; }
  }
  wa=tams[ax]*z; wb=tams[bx]*z;
  if(wb<px+3) return;
  c.save();
  c.font=fuente(px);
  t=c.measureText(largoT).width+7<wa? largoT : (c.measureText(corto).width+5<wa? corto : '');
  if(t){
    P=P3(cen[0],cen[1],cen[2]);
    c.translate(P.x,P.y); c.transform(a.x,a.y,b.x,b.y,0,0);
    c.fillStyle=col; c.textAlign='center'; c.textBaseline='middle';
    c.fillText(t,0,0);
  }
  c.restore();
}
function etiquetasCaras(c,G,OC,d){
  G.forEach(function(s){
    var D=dimDe(s);
    if(D===2? !opt.etiqA : !opt.etiqV) return;
    var T=trocitos(s), C=colorDe(s), du=OC? tapadorDe(s,OC) : null, un=D===2? ' u²' : ' u³';
    carasFrente(s).forEach(function(m){
      var co=coordCara(s,m,d);
      T.forEach(function(q,i){
        if(!tocaCara(s,q,m,d)) return;
        var txt=txtTro(s,q);
        if(!txt) return;
        var cen=[s.p[0]+U*(q.lo[0]+q.hi[0])/2, s.p[1]+U*(q.lo[1]+q.hi[1])/2, s.p[2]+U*(q.lo[2]+q.hi[2])/2];
        cen[m]=co;
        if(OC && !puntoVisto(cen,du,OC,d)) return;
        textoEnCara(c,m,cen,[U*(q.hi[0]-q.lo[0]),U*(q.hi[1]-q.lo[1]),U*(q.hi[2]-q.lo[2])],
                    txt+un, txt, s.res.indexOf(i)>=0? NARANJA.t : C.t);
      });
    });
  });
}
/* --- una longitud: la línea, sus topes, sus marcas, y al lado lo que mide -------------
   Dos longitudes sobre la misma recta que se pisan —1 u y 5/4 u saliendo de
   la misma esquina— tendrían las etiquetas y la cota en el mismo sitio. Cada
   una las lleva un escalón más lejos por cada longitud más corta que pisa. */
function nivelCota(s){
  var n=0, m=ejesDe(s)[0], Ls=lado(s,m), a=(m+1)%3, b=(m+2)%3;
  piezas.forEach(function(o){
    if(!esL(o) || o.id===s.id || !o.e[m]) return;
    if(Math.abs(o.p[a]-s.p[a])>6 || Math.abs(o.p[b]-s.p[b])>6) return;
    if(Math.min(o.p[m]+tam(o,m), s.p[m]+tam(s,m))-Math.max(o.p[m],s.p[m])<PEGA) return;
    var Lo=lado(o,m);
    if(Lo<Ls-1e-9 || (Math.abs(Lo-Ls)<=1e-9 && o.id<s.id)) n++;
  });
  return n;
}
function pasoCota(s){ return s.e[2]? (opt.etiqL? 88 : 46) : (opt.etiqL? 58 : 38); }
function sobrePieza(sp){
  var R=rayo(sp);
  return piezas.some(function(o){ return dimDe(o)>1 && !!golpe(o,R); });
}
/* Hacia qué lado de la longitud van sus etiquetas y su cota: hacia abajo, o
   a la izquierda si está de pie. Pero si ahí caen encima de un rectángulo o
   de un prisma y al otro lado no, van al otro lado. */
function ladoCota(s){
  var z=view.z, m=ejesDe(s)[0], f=finDe(s), A=P3(s.p[0],s.p[1],s.p[2]), B=P3(f[0],f[1],f[2]);
  var ux=B.x-A.x, uy=B.y-A.y, L=Math.sqrt(ux*ux+uy*uy)||1, nx=-uy/L, ny=ux/L;
  if(m===2? nx>0 : ny<0){ nx=-nx; ny=-ny; }
  if(opt.rot || opt.etiqL){
    var D=((opt.rot? (m===2? (opt.etiqL? 70 : 30) : (opt.etiqL? 54 : 34)) : 20)+nivelCota(s)*pasoCota(s))*z;
    var mx=(A.x+B.x)/2, my=(A.y+B.y)/2;
    if(sobrePieza({x:mx+nx*D, y:my+ny*D}) && !sobrePieza({x:mx-nx*D, y:my-ny*D})){ nx=-nx; ny=-ny; }
  }
  return {x:nx, y:ny};
}
function drawL(c,s,marcada,kMarcada,OC,d){
  var z=view.z, m=ejesDe(s)[0], E=s.e[m], Lg=E.n/E.d, C=cortesEje(s,m), k;
  function pt(t){ var a=s.p.slice(); a[m]+=t*U; return P3(a[0],a[1],a[2]); }
  /* lo que queda detrás de otra pieza va de puntos, y más claro */
  function alfa(t){ var a=s.p.slice(); a[m]+=t*U; return (!OC || puntoVisto(a,LINEA,OC,d))? 1 : 0.28; }
  var A=pt(0), B=pt(Lg), ux=B.x-A.x, uy=B.y-A.y, Lpx=Math.sqrt(ux*ux+uy*uy)||1;
  ux/=Lpx; uy/=Lpx;
  var N=ladoCota(s), nx=N.x, ny=N.y;
  function raya(t,h){ var p=pt(t); c.globalAlpha=alfa(t); linea(c,p.x-nx*h,p.y-ny*h,p.x+nx*h,p.y+ny*h); c.globalAlpha=1; }
  var mas=(opt.rot || opt.etiqL)? nivelCota(s)*pasoCota(s) : 0;

/* --- los rótulos de los rectángulos y los prismas ------------------------------------

   estorbarían comparten una pila, por encima de todas ellas: un renglón por
   pieza, con un cuadradito de su color delante, y lo que mide lo resaltado en

   corte, comparten renglón. Se dibujan al final, por encima de todo. */

  var H=piezas.filter(function(o){ return !esL(o); }).map(function(o){
    var r=cajaProy(o), F={s:o, T:toksPieza(o), R:toksResaltado(o)}, w=anchoFila(ctx,F,15,false), cx=(r.x0+r.x1)/2;
    return {s:o, F:F, r:r, x0:Math.min(r.x0,cx-w/2)-4, x1:Math.max(r.x1,cx+w/2)+4, y0:r.y0-ALTOFILA-8, y1:r.y1+4, g:0};
  });
  var grupos=[];

function limpiaMarcas(L,largo0){
  if(!Array.isArray(L) || L.length>300) return null;
  for(var i=0;i<L.length;i++)
    if(typeof L[i]!=='number' || !isFinite(L[i]) || L[i]<=0 || L[i]>=largo0) return null;
  return L.slice();

function limpiaPiezas(lista){
  if(!Array.isArray(lista)) return null;
  var out=[];
  for(var i=0;i<lista.length;i++){
    var s=lista[i], m, j, e=[null,null,null], n=0;
    if(!s || typeof s.x!=='number' || typeof s.y!=='number' || typeof s.z!=='number') return null;
    if(!isFinite(s.x) || !isFinite(s.y) || !isFinite(s.z) || s.z<-PEGA) return null;
    if(!Array.isArray(s.e) || s.e.length!==3) return null;
    for(m=0;m<3;m++){
      var E=s.e[m];
      if(E===null) continue;
      if(!E || !entero(E.n,1,1e6) || !entero(E.d,1,1e6) || E.n/E.d>MAXLADO || !entero(E.a,1,MAXD)) return null;
      var t=limpiaMarcas(E.t, E.n/E.d);
      if(!t) return null;
      e[m]={n:E.n, d:E.d, a:E.a, t:t}; n++;
    }
    if(!n) return null;
    var res=[], lr=s.res===undefined? [] : s.res, nt=nSub({e:e});
    if(!Array.isArray(lr) || (n===1 && (lr.length || s.hueca))) return null;
    for(j=0;j<lr.length;j++){
      if(!entero(lr[j],0,nt-1) || res.indexOf(lr[j])>=0) return null;
      res.push(lr[j]);
    }
    res.sort(function(p,q){ return p-q; });
    out.push({id:nid++, p:[s.x,s.y,Math.max(0,s.z)], e:e, res:res, hueca:s.hueca?1:0});
  }
  return out;
}

function textoAyudaBarra(){
  var s=seleccionada();
  if(!piezas.length) return 'El tablero está vacío — saca una unidad de longitud';
  if(modo==='res') return 'Pincha en una subunidad de un rectángulo o de un prisma para resaltarla, y otra vez para quitarlo — arrastrando se resaltan varias seguidas';
  if(!s) return opt.sube? 'Pincha en una pieza para seleccionarla — arrastra para subirla o bajarla'
                        : 'Pincha en una pieza para seleccionarla — arrastra para moverla por el suelo, o con Mayús para subirla y bajarla';
  var nt=nSub(s), D=dimDe(s), np=partes(s);
  var Un=D===1? 'Longitud' : (D===2? 'Rectángulo' : 'Prisma');
  var unidad=esUnidad(s)? (D===1? 'unidad de longitud' : (D===2? 'unidad de área' : 'unidad de volumen')) : '';
  if(s.hueca) return Un+' en solo el borde — se coge por el borde, y lo de detrás se pincha a través';
  if(selK!==null && nt>1) return 'Una subunidad seleccionada, de las '+nt+' de la pieza — se puede cortar o duplicar';
  if(modo==='sub' && nt>1) return 'Pieza con '+nt+' subunidades — pincha en una para seleccionarla';
  if(D===1){
    if(companera(s,3)) return 'Longitud que sale de la esquina de un rectángulo, en ángulo recto con él — con los dos se puede construir un prisma';
    if(companera(s,2)) return 'Longitud con otra pegada por un extremo, en ángulo recto — con las dos se puede construir un rectángulo';
    if(np===1) return (unidad? 'La '+unidad : 'Una longitud')+' sin partir — se puede partir, duplicar, girar, volcar o unir a las que tenga a continuación';
    return (unidad? 'La '+unidad+', partida' : 'Longitud partida')+' en '+np+' partes iguales — cortar la deshace en sus partes';
  }
  if(D===2 && companera(s,3)) return 'Rectángulo con una longitud que sale de una de sus esquinas, en ángulo recto con él — con los dos se puede construir un prisma';
  if(np===1) return (unidad? 'La '+unidad : (D===2? 'Un rectángulo' : 'Un prisma'))+
                    ' sin partir — se puede partir, duplicar, girar, volcar o unir a los que tenga pegados';

       L.length===2 && L.every(function(q){ return q.y1<=techo; }) && L[1].y1<=L[0].y0, L.map(function(q){ return num(q.y0)+'…'+num(q.y1); }).join(' | '));
    ok('el de la unidad lleva en el mismo renglón lo que mide lo resaltado',
       L[0].txt==='1 u × (1 u × 1 u) = 1 u³ ▨ 2/12 u³' && L[1].txt==='2/3 u × (1 u × 5/4 u) = 10/12 u³', L[0].txt+' | '+L[1].txt);
    opt.res=0;
    ok('con Resultado apagado, los renglones no dicen lo que mide el prisma ni lo resaltado',
       renglones().map(function(q){ return q.txt; }).join(' | ')==='1 u × (1 u × 1 u) = 1 u³ | 2/3 u × (1 u × 5/4 u)');
    opt.res=1;
    ok('y empiezan los dos a la misma altura por la izquierda, como una leyenda', Math.abs(L[0].x0-L[1].x0)<1e-9 && L[0].x0<L[0].x1);
    ok('la imagen que se exporta deja sitio para la pila entera', (function(){
        var b=caja(piezas); return b.y0<=L[1].y0 && b.x0<=Math.min(L[0].x0,L[1].x0) && b.x1>=Math.max(L[0].x1,L[1].x1); })());
    var lejos=cubo([10*U,0,0]);
    GG=gruposR();
    ok('una pieza que está lejos lleva su rótulo aparte, centrado encima de ella y sin cuadradito', (function(){
        var r=cajaProy(lejos);
        return GG.length===2 && GG[1].miembros[0]===lejos && !GG[1].varias && cerca(GG[1].cx,(r.x0+r.x1)/2) && cerca(GG[1].top,r.y0); })());
    piezas=[lejos]; opt.res=0; enun=null;
    var conRot=cuenta(azul);
    opt.rot=0;
    ok('y ese rótulo se dibuja: con Rótulos hay tinta azul, y sin Rótulos no', conRot>25 && cuenta(azul)<5, conRot+' y '+cuenta(azul));
    opt.rot=1;
    parte(lejos,0,4); parte(lejos,2,3);
    var doce=corta(lejos,null);
    GG=gruposR();
    ok('los 12 trozos iguales de un corte comparten un solo renglón', doce.length===12 && GG.length===1 && GG[0].filas.length===1 &&
       GG[0].miembros.length===12 && textoFila(GG[0].filas[0])==='1/3 u × (1 u × 1/4 u)', GG.length+' grupo, '+GG[0].filas.length+' renglón');
    enun=enunAntes; opt.res=0;
  })();
  opt.etiqL=0; opt.etiqA=0; opt.etiqV=0; opt.res=0; opt.rot=1; selK=null;

  /* --- guardar y abrir -------------------------------------------------------------------------- */
  B=base(); Q=B.Q; R=B.R; V=dosTercios([0,0,0]); Pr=prisma(V); parte(Pr,0,5); parte(Pr,2,2); Pr.res=[0,3];
  C=cubo([0,0,0]); parte(C,0,4); C.hueca=1;
  M=cuadrado([3*U,0,U/2]); M.e[1].t=[0.3];
  giro=3;
  var firmaDe=function(){
    return JSON.stringify(enun)+'g'+giro+piezas.map(function(s){
      return s.e.map(function(E){ return E? [E.n,E.d,E.a,lista(E.t)].join(',') : '-'; }).join(';')+'|'+s.res.join('+')+'|'+(s.hueca?1:0)+'|'+
             s.p.map(function(v){ return v.toFixed(2); }).join(','); }).join('#');
  };
  var firma=firmaDe(), guardado=JSON.parse(JSON.stringify(datos()));
  n0=piezas.length;
  piezas=[]; enun=null; giro=0;
  importMode='replace';
  ok('guardar y volver a abrir conserva las longitudes, los rectángulos y los prismas, su sitio y su altura, sus cortes, sus marcas, lo resaltado, lo que está en solo el borde, el enunciado y la vista',
     loadData(JSON.parse(JSON.stringify(guardado))) && firmaDe()===firma, piezas.length+' piezas');
  importMode='add'; loadData(JSON.parse(JSON.stringify(guardado)));
  ok('el botón ＋ añade sin borrar lo que había', piezas.length===n0*2, piezas.length);
  importMode='replace'; giro=0;
  var malo=function(f){ var d=JSON.parse(JSON.stringify(guardado)); f(d); return limpiaPiezas(d.piezas)===null; };
  var deDim=function(d,k){ return d.piezas.filter(function(s){ return s.e.filter(function(E){ return !!E; }).length===k; })[0]; };
  var ejeDe=function(s){ return s.e.filter(function(E){ return !!E; })[0]; };
  ok('el archivo tal cual se acepta', limpiaPiezas(JSON.parse(JSON.stringify(guardado)).piezas)!==null);
  ok('se rechaza una pieza que no se extiende por ninguna dirección', malo(function(d){ d.piezas[0].e=[null,null,null]; }));
  ok('y una que dice extenderse por cuatro', malo(function(d){ d.piezas[0].e.push(null); }));
  ok('y una longitud partida en cero partes', malo(function(d){ ejeDe(deDim(d,1)).a=0; }));
  ok('y una de denominador cero', malo(function(d){ ejeDe(deDim(d,1)).d=0; }));
  ok('y una más larga de lo que cabe', malo(function(d){ ejeDe(deDim(d,1)).n=99; }));
  ok('y una con marcas fuera de ella', malo(function(d){ ejeDe(deDim(d,1)).t=[7]; }));
  ok('y una longitud con subunidades resaltadas, que no las tiene', malo(function(d){ deDim(d,1).res=[0]; }));
  ok('y un rectángulo con coordenadas que no son números', malo(function(d){ deDim(d,2).x='ahí'; }));
  ok('y uno hundido en el suelo', malo(function(d){ deDim(d,2).z=-50; }));
  ok('y un prisma con una subunidad resaltada que no tiene', malo(function(d){ deDim(d,3).res=[99]; }));
  ok('y uno con una arista que no es una fracción', malo(function(d){ deDim(d,3).e[0].n=1.5; }));
  ok('abrir un archivo de otro manipulativo deja el tablero como estaba', (function(){
      var f=firmaDe(); var r=loadData({formato:'longitud-x-longitud', piezas:[]});
      return r===false && firmaDe()===f; })());
  flashMsg=null;

  /* --- deshacer ------------------------------------------------------------------------------------ */
  u=limpio();
  parte(u,0,4); c4=duplica(u,3); aCont(c4,u); une(u);
  ok('unir se deshace: vuelven la unidad y su cuarto', (function(){ doUndo(); return piezas.length===2 && piezas.some(function(s){ return esL(s) && esUnidad(s); }); })());
  ok('y duplicar, y partir', (function(){ doUndo(); var n=piezas.length; doUndo(); return n===1 && piezas[0].e[0].a===1; })());
  parte(piezas[0],0,3); corta(piezas[0],null);
  ok('y cortar', (function(){ var n=piezas.length; doUndo(); return n===3 && piezas.length===1 && piezas[0].e[0].a===3; })());
  ok('y girar, volcar, y construir un rectángulo y un prisma', (function(){
      var a=limpio(), b=duplica(a,null); gira(b); b.p=[4,3,0]; aplicaIman(b);
      var c=duplica(a,null); vuelca(c); c.p=[3,4,0]; aplicaIman(c);
      var n=undoStack.length;
      alFinal(b); var r=rectangulo(a); var p=prisma(r);
      var con=piezas.length; doUndo(); doUndo(); var sin=piezas.length;
      return !!r && !!p && med(p)==='1 1 1' && con===5 && sin===3 && undoStack.length===n; })());
  ok('una acción que no cambia nada no gasta un deshacer', (function(){
      var s=limpio(), n=undoStack.length;
      parte(s,0,s.e[0].a); rectangulo(s); prisma(s); une(s); corta(s,null);
      return undoStack.length===n; })());

  }catch(errT){
    fails++;
    out.push('FALLO se ha cortado aquí: '+((errT&&errT.message)||errT));
    if(errT&&errT.stack) String(errT.stack).split('\n').slice(0,5).forEach(function(l){
      out.push('        '+l.trim()); });
  }
  /* el tablero, como estaba */
  piezas=antes.p; sel=antes.s; selK=antes.k; nid=Math.max(nid,antes.n); enun=antes.e; view=antes.view; giro=antes.giro; undoStack=antes.undo;
  (function(){ var o=JSON.parse(antes.opt); Object.keys(o).forEach(function(k){ opt[k]=o[k]; }); })();
  modo=antes.modo; importMode='replace'; flashMsg=null;
  try{ draw(); }catch(e2){}

  /* --- informe ------------------------------------------------------------------------------ */
  var texto=out.join('\n')+'\n\n'+(fails? fails+' PRUEBAS FALLIDAS de '+out.length
                                         : 'LAS '+out.length+' PRUEBAS CORRECTAS');
  var box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;background:#fff;z-index:99;overflow:auto;padding:18px 22px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
  box.innerHTML='<div style="font:600 15px/1.3 -apple-system,Segoe UI,Roboto,sans-serif;margin-bottom:4px">'+
      'Autocomprobación de Longitud × Área</div>'+
    '<div style="font:13px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;color:'+(fails?'#c2410c':'#15803d')+';font-weight:600;margin-bottom:12px">'+
      (fails? fails+' pruebas fallidas de '+out.length : 'Las '+out.length+' pruebas correctas')+'</div>'+
    '<button id="cpTest" style="font:13px -apple-system,Segoe UI,Roboto,sans-serif;padding:6px 12px;margin-bottom:14px;'+
      'border:1px solid #d5d9e0;border-radius:7px;background:#fff;cursor:pointer">Copiar informe</button> '+
    '<button id="clTest" style="font:13px -apple-system,Segoe UI,Roboto,sans-serif;padding:6px 12px;margin-bottom:14px;'+
      'border:1px solid #d5d9e0;border-radius:7px;background:#fff;cursor:pointer">Cerrar y usar el manipulativo</button>'+
    '<pre style="white-space:pre-wrap;margin:0">'+
      out.map(function(l){ return l.indexOf('FALLO')===0
        ? '<span style="color:#c2410c;font-weight:700">'+l+'</span>' : l; }).join('\n')+'</pre>';
  document.body.appendChild(box);
  document.getElementById('cpTest').addEventListener('click',function(){
    var ta=document.createElement('textarea'); ta.value=texto; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); }catch(err){}
    document.body.removeChild(ta); this.textContent='Copiado ✓';
  });
  document.getElementById('clTest').addEventListener('click',function(){ box.remove(); });
  return texto;
}
var testLanzado=false;
function lanzarTest(){ if(testLanzado) return; testLanzado=true; runSelfTest(); }
if((location.hash||'').indexOf('test')>=0) setTimeout(lanzarTest,60);
window.addEventListener('hashchange',function(){
  if((location.hash||'').indexOf('test')>=0) lanzarTest();
});

window.__lxa={
  test:function(){ return runSelfTest(); }, U:U, MAXD:MAXD, NIVELES:NIVELES, opt:opt,
  piezas:function(){ return piezas; }, sel:function(){ return sel; }, selK:function(){ return selK; },
  enun:function(){ return enun; }, modo:function(){ return modo; }, ponModo:ponModo, view:function(){ return view; },
  giro:function(){ return giro; }, giraVista:giraVista,
  selecciona:function(id,k){ sel=id; selK=(k===undefined? null : k); draw(); }, seleccionaEn:seleccionaEn,
  nuevaUnidad:nuevaUnidad, nuevaUnidadA:nuevaUnidadA, nuevaUnidadV:nuevaUnidadV,
  otraUnidad:otraUnidad, otraUnidadA:otraUnidadA, otraUnidadV:otraUnidadV,
  parte:parte, corta:corta, duplica:duplica, une:une, gira:gira, vuelca:vuelca,
  rectangulo:rectangulo, prisma:prisma, companera:companera, quita:quita, resalta:resalta,
  empiezaAResaltar:empiezaAResaltar, sigueResaltando:sigueResaltando, ahueca:ahueca,
  apunta:apunta, piezaEn:piezaEn, trocitos:trocitos, nSub:nSub, valor:valor, medidaDe:medidaDe,
  parteFr:parteFr, sumaFr:sumaFr, aplicaIman:aplicaIman, ponEnunciado:ponEnunciado, leeEnunciado:leeEnunciado,
  enunciadoAlAzar:enunciadoAlAzar, lienzoAparte:lienzoAparte, datos:datos, limpiaPiezas:limpiaPiezas, load:loadData,
  w2s:w2s, P3:P3, proy:proy, mira:mira, loQueSeVe:loQueSeVe, tapadores:tapadores, ladoCota:ladoCota,
  setMode:function(m){ importMode=m; }, redraw:draw, fit:fitView
};
