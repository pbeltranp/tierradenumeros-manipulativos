<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manteles y servilletas</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       color:#2b2f36;background:#fff;display:flex;height:100%;overflow:hidden}
  #side{width:212px;flex:0 0 212px;border-right:1px solid #e6e8ec;padding:10px 10px;overflow:auto;
        background:#fafbfc}
  #side h2{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#8a919c;
           margin:0 0 6px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;
           text-overflow:ellipsis;clear:both}
  #side h2.sep{margin-top:16px}
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  #toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:7px 9px;
           border-bottom:1px solid #e6e8ec;background:#fafbfc}
  .btn{border:1px solid #d5d9e0;background:#fff;border-radius:7px;padding:5px 9px;font-size:12.5px;
       color:#3d4450;cursor:pointer;display:inline-flex;align-items:center;gap:5px;line-height:1.2}
  .btn:hover{background:#f0f2f5}
  .btn.on{background:#2f62a8;border-color:#2f62a8;color:#fff}
  .sep{width:1px;height:20px;background:#dfe2e7;margin:0 3px}
  .chk{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#4a515c;cursor:pointer;
       padding:3px 6px;border-radius:6px}
  .chk:hover{background:#eff1f4}
  .chk input{margin:0;cursor:pointer}
  .act{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;margin-top:5px;
       border:1px solid #d5d9e0;background:#fff;border-radius:7px;padding:6px 8px;font-size:12px;
       color:#3d4450;cursor:pointer;text-align:left;line-height:1.3}
  .act:hover{background:#f0f2f5}
  .act:disabled{opacity:.4;cursor:default}
  .act kbd{font:11px ui-monospace,Menlo,Consolas,monospace;color:#9aa1ab;flex:0 0 auto}
  #servi{width:100%;height:82px;border:1px dashed #d5d9e0;border-radius:9px;background:#fff;
         cursor:grab;display:block;touch-action:none}
  #servi:hover{border-color:#c7ccd4;background:#f7f8fa}
  select,input[type=text],input[type=number]{font:12px inherit;border:1px solid #d5d9e0;border-radius:6px;
       padding:5px 6px;color:#2b2f36;background:#fff;width:100%}
  .fila{display:flex;gap:5px;align-items:stretch;margin-top:4px}
  .fila > *{min-width:0}
  .mini{border:1px solid #d5d9e0;background:#fff;border-radius:6px;padding:4px 0;font-size:12.5px;
        color:#3d4450;cursor:pointer;flex:1;text-align:center}
  .mini:hover{background:#f0f2f5}
  .mini:disabled{opacity:.35;cursor:default}
  .cuenta{flex:1.4;display:flex;align-items:center;justify-content:center;gap:5px;
          font-weight:600;font-size:12.5px;color:#2b2f36}
  .cuenta svg{display:block;flex:0 0 auto}
  .lab{font-size:11px;color:#8a919c;margin-top:7px}
  #partes{margin-top:7px;font-size:11.5px;color:#4a515c;line-height:1.45;text-align:center;
          background:#fff;border:1px solid #e6e8ec;border-radius:8px;padding:6px 7px}
  #partes b{color:#2b2f36}
  .nota{font-size:11px;color:#8a919c;line-height:1.5;margin-top:7px}
  #cajamedir .resp{display:flex;gap:4px;align-items:center;margin-top:5px}
  #cajamedir input{text-align:center;padding:5px 2px}
  #veredicto{margin-top:6px;font-size:12px;line-height:1.4;min-height:16px}
  #veredicto.si{color:#15803d;font-weight:600}
  #veredicto.no{color:#c2410c}
  #colores{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
  #colores .sw{width:23px;height:23px;border-radius:6px;border:2px solid #fff;
               box-shadow:0 0 0 1px #d5d9e0;cursor:pointer;padding:0}
  #colores .sw:hover{box-shadow:0 0 0 1px #9aa1ab}
  #colores .sw.on{box-shadow:0 0 0 2px #2f62a8}
  #stage{position:relative;flex:1;min-height:0;background:#fbfbfa}
  canvas#cv{display:block;width:100%;height:100%;touch-action:none}
  #hint{position:absolute;left:10px;bottom:10px;background:rgba(28,32,38,.82);color:#fff;font-size:11.5px;
        padding:5px 10px;border-radius:14px;pointer-events:none;max-width:calc(100% - 20px)}
  #info{position:absolute;right:10px;top:10px;width:320px;background:#fff;border:1px solid #dfe2e7;
        border-radius:10px;padding:11px 13px;font-size:11.5px;line-height:1.55;color:#4a515c;
        box-shadow:0 6px 22px rgba(20,25,35,.12);display:none;max-height:calc(100% - 20px);overflow:auto}
  #info.show{display:block}
  #info b{color:#2b2f36}
  #info a{color:#2f62a8}
  #info .lic{margin-top:11px;padding-top:8px;border-top:1px solid #eef0f3;font-size:10.5px;
             line-height:1.5;color:#8a919c}
  #drop{position:absolute;inset:0;background:rgba(47,98,168,.08);border:2px dashed #2f62a8;
        display:none;align-items:center;justify-content:center;font-size:15px;color:#2f62a8;font-weight:600}
  #drop.show{display:flex}
  @media (max-width:640px){
    #side{width:156px;flex:0 0 156px;padding:8px 7px}
    .btn{padding:5px 7px;font-size:12px}
    #info{width:calc(100% - 20px)}
  }
</style>
</head>
<body>

  <aside id="side">
    <h2>Servilleta (unidad)</h2>
    <canvas id="servi" title="Arrástrala al tablero"></canvas>
    <div class="nota">Arrástrala. Todas son iguales y cuadradas; saca las que necesites.</div>

    <h2 class="sep">Doblar la servilleta</h2>
    <div class="lab">En vertical, columnas</div>
    <div class="fila">
      <button class="mini" id="colMenos" disabled>−</button>
      <div class="cuenta" id="ncol">—</div>
      <button class="mini" id="colMas" disabled>+</button>
    </div>
    <div class="lab">En horizontal, filas</div>
    <div class="fila">
      <button class="mini" id="filMenos" disabled>−</button>
      <div class="cuenta" id="nfil">—</div>
      <button class="mini" id="filMas" disabled>+</button>
    </div>
    <div class="fila">
      <button class="mini" id="lisa" disabled>desdoblar</button>
    </div>
    <div id="partes"></div>

    <h2 class="sep">Mantel</h2>
    <select id="nivel">
      <option value="0">Fácil (mitades)</option>
      <option value="1" selected>Normal (hasta cuartos)</option>
      <option value="2">Difícil (hasta sextos y octavos)</option>
    </select>
    <button class="act" id="nuevo">Nuevo mantel al azar</button>
    <input type="text" id="aMano" placeholder="3/2 x 5/4, o 15/8" style="margin-top:5px"
           title="Escribe las medidas del mantel, o directamente el área que quieres que tenga">
    <button class="act" id="crear">Crear ese mantel</button>

    <h2 class="sep">Comprobar</h2>
    <div id="cajamedir"></div>
    <div id="veredicto"></div>

    <h2 class="sep">Color del mantel</h2>
    <div id="colores"></div>

    <h2 class="sep">Selección</h2>
    <button class="act" id="duplicar" disabled>Duplicar<kbd>D</kbd></button>
    <button class="act" id="borrar" disabled>Quitar<kbd>Supr</kbd></button>
  </aside>

  <main>
    <div id="toolbar">
      <button class="btn" id="undo" title="Deshacer (Ctrl+Z)">↶</button>
      <button class="btn" id="vaciar" title="Quitar todo del tablero">Vaciar</button>
      <span class="sep"></span>
      <label class="chk" title="Al soltar, los bordes y las marcas se enganchan a los de los demás"><input type="checkbox" id="iman" checked>Imán</label>
      <label class="chk" title="Escribe 1/n dentro de cada parte de las servilletas dobladas"><input type="checkbox" id="etiq">Etiquetas</label>
      <button class="btn" id="transp" title="Las servilletas se vuelven translúcidas y se ve el mantel por debajo">◑ Transparencia</button>
      <span class="sep"></span>
      <button class="btn" id="mano" title="Mover el tablero en vez de las piezas">✋</button>
      <button class="btn" id="zoomout">−</button>
      <button class="btn" id="zoomin">+</button>
      <button class="btn" id="fit">Ajustar</button>
      <span class="sep"></span>
      <button class="btn" id="save" title="Descargar el tablero">⤓ Guardar</button>
      <button class="btn" id="open" title="Abrir un archivo guardado">⤒ Abrir</button>
      <button class="btn" id="add" title="Añadir lo de un archivo a lo que ya hay">＋</button>
      <button class="btn" id="png" title="Descargar imagen">⤓ PNG</button>
      <button class="btn" id="help">?</button>
      <input type="file" id="fileIn" accept=".json,application/json" style="display:none">
    </div>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="hint"></div>
      <div id="info"></div>
      <div id="drop">Suelta aquí el archivo</div>
    </div>
  </main>

<script>
"use strict";
(function(){

/* =========================================================================
   1. LA IDEA
   Igual que con las tiras, pero midiendo superficies: la unidad es una
   servilleta cuadrada y hay que medir manteles rectangulares. Con el área
   aparece algo que con la longitud no pasaba: «un cuarto de servilleta» no
   es una sola cosa. Puede ser una tira vertical, una tira horizontal o un
   cuadradito, las tres de la misma área, y solo algunas de esas formas
   embaldosan el mantel. Por eso la servilleta se dobla en columnas y en
   filas por separado: la forma de la parte importa tanto como su tamaño.
   ========================================================================= */
var U=150;                 // el lado de la servilleta, en píxeles
var MAXD=8;                // dobleces máximos en cada dirección

var COLU={f:'#f4ead6', b:'#c2ab7d', t:'#7a6634'};     // la servilleta, color fijo
var PALETA=[
  {f:'#e07a5f', b:'#b1543a'},
  {f:'#6a8caf', b:'#446287'},
  {f:'#7fb069', b:'#548042'},
  {f:'#b07aa1', b:'#845278'},
  {f:'#4fa3a5', b:'#2d7274'},
  {f:'#d1495b', b:'#9c2c3c'},
  {f:'#8d6e63', b:'#5f463d'},
  {f:'#5c6bc0', b:'#39479a'}
];
function colorDe(s){ return s.tipo==='u' ? COLU : PALETA[(s.c||0)%PALETA.length]; }

/* =========================================================================
   2. ESTADO
   ========================================================================= */
var piezas=[], sel=null, nid=1, letra=0, colorTurno=0;
var view={x:0,y:0,z:1};
var drag=null, undoStack=[], importMode='replace';
var opt={iman:1, etiq:0, mano:0, alfa:0};

var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var stage=document.getElementById('stage');
var hintEl=document.getElementById('hint'), infoEl=document.getElementById('info');
var dropEl=document.getElementById('drop');
var flashMsg=null, flashT=0;

function w2s(p){ return {x:p.x*view.z+view.x, y:p.y*view.z+view.y}; }
function s2w(p){ return {x:(p.x-view.x)/view.z, y:(p.y-view.y)/view.z}; }
function flash(m){ flashMsg=m; flashT=Date.now(); draw(); setTimeout(draw,2400); }
function pushUndo(){
  undoStack.push(JSON.stringify({p:piezas, s:sel, n:nid}));
  if(undoStack.length>90) undoStack.shift();
}
function doUndo(){
  if(!undoStack.length){ flash('No hay nada que deshacer'); return; }
  var d=JSON.parse(undoStack.pop());
  piezas=d.p; sel=d.s; nid=d.n||1;
  ponVeredicto(''); draw();
}

/* =========================================================================
   3. FRACCIONES
   ========================================================================= */
function mcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ var t=a%b; a=b; b=t; } return a; }
function reduce(p,q){ var d=mcd(p,q)||1; return {p:p/d, q:q/d}; }
function mismaFraccion(a,b){ return a.p*b.q===b.p*a.q; }
function leeFraccion(txt){
  if(txt===null || txt===undefined) return null;
  var s=String(txt).toLowerCase().replace(/\s+y\s+/g,' ').trim();
  if(!s) return null;
  var m;
  if((m=s.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/))){
    var e=+m[1], n=+m[2], d=+m[3];
    if(!d) return null;
    return reduce(e*d+n, d);
  }
  if((m=s.match(/^(\d+)\s*\/\s*(\d+)$/))){
    if(!+m[2]) return null;
    return reduce(+m[1], +m[2]);
  }
  if((m=s.match(/^(\d+)$/))) return {p:+m[1], q:1};
  return null;
}
function textoFrac(f){ return f.q===1 ? (f.p+'') : (f.p+'/'+f.q); }

/* =========================================================================
   4. LOS MANTELES QUE PROPONE EL ENTORNO
   Un mantel es un rectángulo de lados A/c y B/d servilletas. Los que mandan
   son c y d: para embaldosarlo hay que doblar la servilleta en un múltiplo
   de c columnas y de d filas. Se piden las fracciones de los lados ya
   irreducibles, porque si no el doblez que hace falta sería otro.
   ========================================================================= */
var NIVELES=[
  {n:'Fácil',   dens:[1,2],             maxq:4,  maxlado:3},
  {n:'Normal',  dens:[1,2,3,4],         maxq:16, maxlado:3},
  {n:'Difícil', dens:[1,2,3,4,5,6,8],   maxq:32, maxlado:3}
];
function areaDe(s){ return reduce(s.wp*s.hp, s.wq*s.hq); }
function ladoOK(A,c,maxlado){
  if(mcd(A,c)!==1) return false;
  var v=A/c;
  return v>=0.5 && v<=maxlado;
}
function mantelAlAzar(nivel){
  var N=NIVELES[nivel]||NIVELES[1];
  for(var intento=0;intento<600;intento++){
    var c=N.dens[Math.floor(Math.random()*N.dens.length)];
    var d=N.dens[Math.floor(Math.random()*N.dens.length)];
    var A=1+Math.floor(Math.random()*(N.maxlado*c));
    var B=1+Math.floor(Math.random()*(N.maxlado*d));
    if(!ladoOK(A,c,N.maxlado) || !ladoOK(B,d,N.maxlado)) continue;
    var area=reduce(A*B, c*d);
    if(area.q===1) continue;                    // que no sea un número entero de servilletas
    if(area.q>N.maxq) continue;
    var s=(A/c)*(B/d);
    if(s<0.5 || s>4.5) continue;
    return {wp:A, wq:c, hp:B, hq:d};
  }
  return {wp:3, wq:2, hp:5, hq:4};
}
/* Si se pide un área suelta, hay que inventarse un rectángulo que la tenga.
   Se busca el más cuadrado posible y con los dobleces más sencillos. */
function rectDeArea(p,q){
  var mejor=null;
  for(var c=1;c<=MAXD;c++) for(var d=1;d<=MAXD;d++){
    for(var A=1;A<=3*c;A++){
      if(mcd(A,c)!==1) continue;
      var w=A/c;
      if(w<0.5 || w>3) continue;
      /* B tiene que cumplir A*B*q = p*c*d */
      var arriba=p*c*d, abajo=A*q;
      if(arriba%abajo!==0) continue;
      var B=arriba/abajo;
      if(B<1 || mcd(B,d)!==1) continue;
      var h=B/d;
      if(h<0.5 || h>3) continue;
      var puntos=Math.abs(w/h-1)+(c+d)/50;
      if(!mejor || puntos<mejor.puntos) mejor={wp:A,wq:c,hp:B,hq:d,puntos:puntos};
    }
  }
  return mejor;
}

/* =========================================================================
   5. LAS PIEZAS
   ========================================================================= */
function ancho(s){ return U*s.wp/s.wq; }
function alto(s){ return U*s.hp/s.hq; }
function nuevaServilleta(P){
  return {id:nid++, tipo:'u', wp:1, wq:1, hp:1, hq:1, a:1, b:1, c:0,
          x:P.x, y:P.y, nombre:''};
}
function siguienteLetra(){
  var usadas={};
  piezas.forEach(function(s){ if(s.tipo==='m' && s.nombre) usadas[s.nombre]=1; });
  for(var i=0;i<26;i++){
    var L=String.fromCharCode(65+i);
    if(!usadas[L]) return L;
  }
  return String.fromCharCode(65+(letra++ %26));
}
function siguienteColor(){
  var usados={};
  piezas.forEach(function(s){ if(s.tipo==='m') usados[s.c||0]=1; });
  for(var i=0;i<PALETA.length;i++) if(!usados[i]) return i;
  return (colorTurno++)%PALETA.length;
}
function nuevoMantel(R,P){
  return {id:nid++, tipo:'m', wp:R.wp, wq:R.wq, hp:R.hp, hq:R.hq, a:1, b:1,
          c:siguienteColor(), x:P.x, y:P.y, nombre:siguienteLetra()};
}
function porId(id){
  for(var i=0;i<piezas.length;i++) if(piezas[i].id===id) return piezas[i];
  return null;
}
function seleccionada(){ return sel==null? null : porId(sel); }
function marcasX(s){
  var out=[];
  if(s.tipo!=='u' || s.a<2) return out;
  for(var k=1;k<s.a;k++) out.push(s.x+ancho(s)*k/s.a);
  return out;
}
function marcasY(s){
  var out=[];
  if(s.tipo!=='u' || s.b<2) return out;
  for(var k=1;k<s.b;k++) out.push(s.y+alto(s)*k/s.b);
  return out;
}
function puntosX(s){ return [s.x, s.x+ancho(s)].concat(marcasX(s)); }
function puntosY(s){ return [s.y, s.y+alto(s)].concat(marcasY(s)); }
function dentro(P,s){
  return P.x>=s.x && P.x<=s.x+ancho(s) && P.y>=s.y && P.y<=s.y+alto(s);
}
function caja(lista){
  if(!lista.length) return null;
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  lista.forEach(function(s){
    x0=Math.min(x0,s.x); x1=Math.max(x1,s.x+ancho(s));
    y0=Math.min(y0,s.y); y1=Math.max(y1,s.y+alto(s));
  });
  return {x0:x0,y0:y0,x1:x1,y1:y1};
}
function sitioLibre(){
  var b=caja(piezas);
  return b? {x:b.x0, y:b.y1+U*0.25} : {x:-U*0.75, y:-U*0.75};
}

/* --- ¿embaldosa? -----------------------------------------------------------
   Una servilleta partida en a columnas y b filas da trozos de (1/a)x(1/b).
   Esos trozos cubren el mantel sin cortar ninguno si a·ancho y b·alto son
   números enteros de trozos. Es justo la condición que hay que descubrir. */
function encaja(mantel,a,b){
  var nx=a*mantel.wp/mantel.wq, ny=b*mantel.hp/mantel.hq;
  return Math.abs(nx-Math.round(nx))<1e-9 && Math.abs(ny-Math.round(ny))<1e-9;
}
function trozosQueCubren(mantel,a,b){
  if(!encaja(mantel,a,b)) return null;
  return Math.round(a*mantel.wp/mantel.wq)*Math.round(b*mantel.hp/mantel.hq);
}

/* --- el imán --------------------------------------------------------------- */
function engancheEje(s,puntosDe,coord){
  var lim=10/view.z, mios=puntosDe(s), mejor=null, dist=Infinity;
  piezas.forEach(function(o){
    if(o.id===s.id) return;
    puntosDe(o).forEach(function(b){
      mios.forEach(function(a){
        var d=b-a;
        if(Math.abs(d)<lim && Math.abs(d)<dist){ mejor=d; dist=Math.abs(d); }
      });
    });
  });
  return mejor;
}
function aplicaIman(s){
  if(!opt.iman || !s) return false;
  var dx=engancheEje(s,puntosX,'x'), dy=engancheEje(s,puntosY,'y'), algo=false;
  if(dx!==null){ s.x+=dx; algo=true; }
  if(dy!==null){ s.y+=dy; algo=true; }
  return algo;
}

/* --- doblar ----------------------------------------------------------------- */
function dobla(s,a,b){
  if(!s || s.tipo!=='u') return false;
  a=Math.max(1, Math.min(MAXD, Math.round(a)));
  b=Math.max(1, Math.min(MAXD, Math.round(b)));
  if(a===s.a && b===s.b) return false;
  pushUndo();
  s.a=a; s.b=b;
  draw();
  return true;
}

/* =========================================================================
   6. DIBUJO
   ========================================================================= */
function rectRedondo(c,x,y,w,h,r){
  r=Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y);
  c.closePath();
}
function etiquetaParte(c,anchoCelda,altoCelda,n){
  if(altoCelda<13) return '';
  var largoT='1/'+n+' s';
  if(c.measureText(largoT).width+7<anchoCelda) return largoT;
  var cortoT='1/'+n;
  if(c.measureText(cortoT).width+5<anchoCelda) return cortoT;
  return '';
}
function drawPieza(c,s,marcada){
  var p=w2s({x:s.x, y:s.y});
  var w=ancho(s)*view.z, h=alto(s)*view.z;
  var C=colorDe(s);
  c.save();
  if(opt.alfa) c.globalAlpha=0.55;
  c.save();
  c.shadowColor='rgba(20,25,35,.13)'; c.shadowBlur=6; c.shadowOffsetY=2;
  rectRedondo(c,p.x,p.y,w,h,3.5*view.z);
  c.fillStyle=C.f; c.fill();
  c.restore();

  if(s.tipo==='u' && (s.a>1 || s.b>1)){
    c.save();
    rectRedondo(c,p.x,p.y,w,h,3.5*view.z); c.clip();
    c.strokeStyle=C.b; c.lineWidth=Math.max(1.5, 1.9*view.z);
    var k;
    for(k=1;k<s.a;k++){
      var X=p.x+w*k/s.a;
      c.beginPath(); c.moveTo(X,p.y); c.lineTo(X,p.y+h); c.stroke();
    }
    for(k=1;k<s.b;k++){
      var Y=p.y+h*k/s.b;
      c.beginPath(); c.moveTo(p.x,Y); c.lineTo(p.x+w,Y); c.stroke();
    }
    if(opt.etiq){
      c.fillStyle=C.t;
      c.font=Math.max(8,Math.min(13,10*view.z))+'px -apple-system,Segoe UI,Roboto,sans-serif';
      c.textAlign='center'; c.textBaseline='middle';
      var txt=etiquetaParte(c, w/s.a, h/s.b, s.a*s.b);
      if(txt) for(var i=0;i<s.a;i++) for(var j=0;j<s.b;j++)
        c.fillText(txt, p.x+w*(i+0.5)/s.a, p.y+h*(j+0.5)/s.b);
    }
    c.restore();
  } else if(s.tipo==='u' && opt.etiq){
    c.save();
    c.fillStyle=C.t;
    c.font=Math.max(9,Math.min(14,11*view.z))+'px -apple-system,Segoe UI,Roboto,sans-serif';
    c.textAlign='center'; c.textBaseline='middle';
    if(c.measureText('1 s').width+8<w && h>15) c.fillText('1 s', p.x+w/2, p.y+h/2);
    c.restore();
  }

  rectRedondo(c,p.x,p.y,w,h,3.5*view.z);
  c.lineWidth=marcada? 2.6 : 1.3;
  c.strokeStyle=marcada? '#1f4e8c' : C.b;
  c.stroke();
  c.restore();

  if(s.tipo==='m'){
    c.save();
    c.fillStyle='#8a919c';
    c.font='600 '+Math.max(9,Math.min(15,12*view.z))+'px -apple-system,Segoe UI,Roboto,sans-serif';
    c.textAlign='right'; c.textBaseline='top';
    c.fillText(s.nombre, p.x-6, p.y);
    c.restore();
  }
}
function draw(){
  var W=cv.width/(window.devicePixelRatio||1), H=cv.height/(window.devicePixelRatio||1);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#fbfbfa'; ctx.fillRect(0,0,W,H);
  /* los manteles debajo y las servilletas encima: la herramienta de medir
     tiene que verse siempre */
  piezas.forEach(function(s){ if(s.tipo==='m') drawPieza(ctx,s,s.id===sel); });
  piezas.forEach(function(s){ if(s.tipo==='u') drawPieza(ctx,s,s.id===sel); });
  updateUI();
}

function compruebaMedida(){
  var s=seleccionada();
  if(!s || s.tipo!=='m') return;
  var n=document.getElementById('rNum').value.trim();
  var d=document.getElementById('rDen').value.trim();
  if(n==='' || d===''){
    ponVeredicto('Escribe cuántos trozos caben y en cuántos trozos has partido la servilleta.','no');
    return;
  }
  var num=parseInt(n,10), den=parseInt(d,10);
  if(!isFinite(num)||!isFinite(den)||den<1||num<0){
    ponVeredicto('Esos números no me valen.','no'); return;
  }
  var f=reduce(num,den), mia=areaDe(s);
  if(mismaFraccion(f,mia)){
    var extra = (num===mia.p && den===mia.q) ? ''
      : ' Es la misma área que '+textoFrac(mia)+', que ya no se puede simplificar más.';
    ponVeredicto('¡Eso es! El mantel '+s.nombre+' mide '+num+'/'+den+' de servilleta.'+extra,'si');
  } else {
    var mayor = f.p*mia.q > mia.p*f.q;
    ponVeredicto('Todavía no. '+num+'/'+den+' es un poco '+(mayor?'más grande':'más pequeño')+
                 ' que el mantel '+s.nombre+'.','no');
  }
}

function limpiaPiezas(lista){
  if(!Array.isArray(lista)) return null;
  var out=[];
  for(var i=0;i<lista.length;i++){
    var s=lista[i];
    var tipo = s.tipo==='m' ? 'm' : s.tipo==='u' ? 'u' : null;
    if(!tipo) return null;
    var wp=Number(s.wp), wq=Number(s.wq), hp=Number(s.hp), hq=Number(s.hq);
    var x=Number(s.x), y=Number(s.y);
    if([wp,wq,hp,hq,x,y].some(function(v){ return !isFinite(v); })) return null;
    if(!(wp>0 && wq>0 && hp>0 && hq>0)) return null;
    if(wq>MAXD || hq>MAXD) return null;
    if(tipo==='u' && !(wp===1 && wq===1 && hp===1 && hq===1)) return null;
    var a=Math.max(1, Math.min(MAXD, Math.round(Number(s.a)||1)));
    var b=Math.max(1, Math.min(MAXD, Math.round(Number(s.b)||1)));
    if(tipo==='m'){ a=1; b=1; }
    var col=Math.round(Number(s.c)||0);
    if(!(col>=0 && col<PALETA.length)) col=0;
    var cuantos=out.filter(function(o){ return o.tipo==='m'; }).length;
    out.push({id:nid++, tipo:tipo, wp:wp, wq:wq, hp:hp, hq:hq, a:a, b:b, c:col, x:x, y:y,
              nombre: tipo==='m'
                ? (String(s.nombre||'').slice(0,2) || String.fromCharCode(65+(cuantos%26)))
                : ''});
  }
  return out;
}
function loadData(d){
  var nuevas=d && limpiaPiezas(d.piezas);
  if(!nuevas){ flash('Ese archivo no trae nada que yo entienda'); return; }
  pushUndo();
  piezas = (importMode==='add') ? piezas.concat(nuevas) : nuevas;
  sel=null; ponVeredicto(''); fitView();
  flash(nuevas.length+(nuevas.length===1?' pieza cargada':' piezas cargadas'));
}

function iconoDoblado(a,b,lado){
  lado=lado||17;
  var s='<svg width="'+lado+'" height="'+lado+'" viewBox="0 0 '+lado+' '+lado+'">'+
    '<rect x="0.7" y="0.7" width="'+(lado-1.4)+'" height="'+(lado-1.4)+'" rx="2" fill="'+COLU.f+
    '" stroke="'+COLU.b+'" stroke-width="1"/>';
  var k;
  for(k=1;k<a;k++){
    var X=(0.7+(lado-1.4)*k/a).toFixed(2);
    s+='<line x1="'+X+'" y1="1" x2="'+X+'" y2="'+(lado-1)+'" stroke="'+COLU.b+'" stroke-width="1"/>';
  }
  for(k=1;k<b;k++){
    var Y=(0.7+(lado-1.4)*k/b).toFixed(2);
    s+='<line x1="1" y1="'+Y+'" x2="'+(lado-1)+'" y2="'+Y+'" stroke="'+COLU.b+'" stroke-width="1"/>';
  }
  return s+'</svg>';
}
var cacheMedir='', cachePartes='';
function updateUI(){
  var s=seleccionada();
  var esU = !!s && s.tipo==='u';
  ['colMenos','colMas','filMenos','filMas','lisa'].forEach(function(id){
    document.getElementById(id).disabled=!esU; });
  document.getElementById('duplicar').disabled=!s;
  document.getElementById('borrar').disabled=!s;

  /* el resumen del doblado cuenta en cuántos trozos ha quedado la servilleta,
     que es parte de lo que hay que averiguar: solo sale con las etiquetas */
  var claveP = (esU? (s.a+'x'+s.b) : '-')+(opt.etiq?'E':'');
  if(claveP!==cachePartes){
    cachePartes=claveP;
    document.getElementById('ncol').innerHTML = esU? (iconoDoblado(s.a,1,15)+s.a) : '—';
    document.getElementById('nfil').innerHTML = esU? (iconoDoblado(1,s.b,15)+s.b) : '—';
    var caja0=document.getElementById('partes');
    if(!opt.etiq || !esU) caja0.style.display='none';
    else{
      caja0.style.display='block';
      caja0.innerHTML = (s.a===1 && s.b===1)
        ? iconoDoblado(1,1,26)+'<br>Servilleta entera: <b>1 s</b>'
        : iconoDoblado(s.a,s.b,26)+'<br><b>'+(s.a*s.b)+' trozos</b> de <b>1/'+(s.a*s.b)+' s</b>';
    }
  }
  var clave = s? (s.id+':'+s.tipo) : '-';
  if(clave!==cacheMedir){ cacheMedir=clave; cajaMedirUI(); }
  var claveC = s? (s.id+':'+s.tipo+':'+(s.c||0)) : '-';
  if(claveC!==cacheColor){ cacheColor=claveC; coloresUI(); }

  var t;
  if(flashMsg && Date.now()-flashT<2300) t=flashMsg;
  else if(!piezas.length) t='Pide un mantel y saca servilletas de la izquierda';
  else if(esU && s.a*s.b>1) t='Los trozos son de 1/'+(s.a*s.b)+' · si no encajan, prueba a repartir '+
                              'los dobleces de otra manera';
  else if(esU) t='Dobla la servilleta en columnas y en filas para hacer trozos iguales';
  else if(s) t='Cubre el mantel con servilletas y mira lo que sobra';
  else t='Arrastra para colocar · con la transparencia se ve el mantel bajo las servilletas';
  hintEl.textContent=t;
}

/* =========================================================================
  10. AUTOCOMPROBACIÓN  ·  añade #test al final de la URL
   ========================================================================= */
function runSelfTest(){
  var out=[], fails=0;
  function ok(n,c,extra){ out.push((c?'OK    ':'FALLO ')+n+(extra!==undefined?'   ['+extra+']':'')); if(!c) fails++; }
  function num(v){ return (Math.round(v*1000)/1000).toString().replace('.',','); }

  try{

  /* --- fracciones ------------------------------------------------------------ */
  ok('reducir simplifica', (function(){ var f=reduce(6,8); return f.p===3 && f.q===4; })());
  ok('«3/2» se lee bien', (function(){ var f=leeFraccion('3/2'); return f && f.p===3 && f.q===2; })());
  ok('15/8 y 30/16 son la misma área', mismaFraccion({p:15,q:8},{p:30,q:16}));
  ok('lo que no es una fracción se rechaza',
     leeFraccion('mantel')===null && leeFraccion('3/0')===null);

  /* --- guardo lo que hubiera en el tablero ------------------------------------ */
  var antesP=piezas, antesS=sel, antesV=view, antesI=opt.iman;
  piezas=[]; sel=null; view={x:0,y:0,z:1}; opt.iman=1;

  /* --- las piezas -------------------------------------------------------------- */
  var sv=nuevaServilleta({x:0,y:0});
  piezas=[sv];
  ok('la servilleta es un cuadrado de lado uno',
     Math.abs(ancho(sv)-U)<1e-9 && Math.abs(alto(sv)-U)<1e-9);
  ok('y su área es una servilleta', (function(){
      var A=areaDe(sv); return A.p===1 && A.q===1; })());
  var M=nuevoMantel({wp:3,wq:2,hp:5,hq:4},{x:0,y:-U*2});
  piezas.push(M);
  ok('un mantel de 3/2 por 5/4 mide 15/8 de servilleta', (function(){
      var A=areaDe(M); return A.p===15 && A.q===8; })(), textoFrac(areaDe(M)));
  ok('el mantel no lleva su medida escrita: solo una letra',
     M.nombre.length===1 && /[A-Z]/.test(M.nombre), M.nombre);
  ok('sus lados salen del tamaño que toca',
     Math.abs(ancho(M)-U*1.5)<1e-9 && Math.abs(alto(M)-U*1.25)<1e-9);

  /* --- el doblado ---------------------------------------------------------------- */
  sv.a=2; sv.b=4;
  ok('doblada en 2 columnas y 4 filas hay 8 trozos', sv.a*sv.b===8);
  ok('y salen una marca vertical y tres horizontales',
     marcasX(sv).length===1 && marcasY(sv).length===3);
  ok('las marcas están donde tienen que estar', (function(){
      var mx=marcasX(sv), my=marcasY(sv);
      if(Math.abs(mx[0]-(sv.x+U/2))>1e-9) return false;
      return my.every(function(y,k){ return Math.abs(y-(sv.y+U*(k+1)/4))<1e-9; }); })());
  sv.a=1; sv.b=1;

  /* --- LA CLAVE: la forma del trozo importa, no solo cuántos hay ------------------
     El mantel de 3/2 x 5/4 se cubre con octavos, pero solo si los octavos son
     de media servilleta de ancho por un cuarto de alto. Con los mismos ocho
     trozos puestos al revés, no encaja. */
  ok('el mantel de 3/2 x 5/4 se embaldosa con la servilleta en 2 columnas y 4 filas',
     encaja(M,2,4));
  ok('y hacen falta justo 15 trozos, que es lo que dice la fracción',
     trozosQueCubren(M,2,4)===15, trozosQueCubren(M,2,4)+' trozos de 1/8');
  ok('la cuenta de trozos coincide con el área del mantel', (function(){
      var f=reduce(trozosQueCubren(M,2,4), 2*4), A=areaDe(M);
      return f.p===A.p && f.q===A.q; })());
  ok('con los mismos ocho trozos pero tumbados (4 columnas y 2 filas) NO encaja',
     !encaja(M,4,2), '4·3/2 = 6 trozos justos, pero 2·5/4 = 2,5 no es entero');
  ok('ni partiéndola en ocho tiras verticales', !encaja(M,8,1));
  ok('ni en ocho tiras horizontales', !encaja(M,1,8));
  ok('doblar más de la cuenta sí vale, si se dobla en la dirección buena',
     encaja(M,4,4) && trozosQueCubren(M,4,4)===30, '30 trozos de 1/16, que también son 15/8');
  ok('y esa medida es la misma fracción, sin simplificar', (function(){
      var f=reduce(trozosQueCubren(M,4,4), 16), A=areaDe(M);
      return mismaFraccion(f,A); })());
  ok('un mantel de lados enteros se cubre con servilletas sin doblar', (function(){
      var E={tipo:'m', wp:2, wq:1, hp:3, hq:1};
      return encaja(E,1,1) && trozosQueCubren(E,1,1)===6; })());

  /* --- los manteles que propone el entorno ---------------------------------------- */
  ok('los tres niveles proponen manteles medibles', (function(){
      var malos=[];
      [0,1,2].forEach(function(nv){
        var N=NIVELES[nv];
        for(var i=0;i<300;i++){
          var R=mantelAlAzar(nv);
          if(N.dens.indexOf(R.wq)<0 || N.dens.indexOf(R.hq)<0) malos.push('denominador raro');
          else if(mcd(R.wp,R.wq)!==1 || mcd(R.hp,R.hq)!==1) malos.push('lado sin simplificar');
          else if(R.wq>MAXD || R.hq>MAXD) malos.push('no se puede doblar tanto');
          else{
            var A=reduce(R.wp*R.hp, R.wq*R.hq);
            if(A.q===1) malos.push('área entera');
            else if(A.q>N.maxq) malos.push('área con denominador '+A.q+' en nivel '+nv);
            else if(!encaja({wp:R.wp,wq:R.wq,hp:R.hp,hq:R.hq}, R.wq, R.hq))
              malos.push('no encaja ni con su propio doblez');
          }
        }
      });
      return malos.length===0; })());
  ok('el nivel fácil solo pide mitades', (function(){
      for(var i=0;i<200;i++){
        var R=mantelAlAzar(0);
        if(R.wq>2 || R.hq>2) return false;
      }
      return true; })());
  ok('y el difícil no pasa de octavos en los lados', (function(){
      for(var i=0;i<300;i++){
        var R=mantelAlAzar(2);
        if(R.wq>MAXD || R.hq>MAXD) return false;
      }
      return true; })());
  ok('escribiendo un área suelta, se inventa un rectángulo que la tiene', (function(){
      var R=rectDeArea(15,8);
      if(!R) return false;
      var A=reduce(R.wp*R.hp, R.wq*R.hq);
      return A.p===15 && A.q===8 && encaja(R,R.wq,R.hq); })(),
     (function(){ var R=rectDeArea(15,8);
       return R? R.wp+'/'+R.wq+' × '+R.hp+'/'+R.hq : 'nada'; })());
  ok('y con un área imposible de montar, avisa en vez de inventarse algo',
     rectDeArea(1,31)===null || (function(){
       var R=rectDeArea(1,31);
       return R.wq<=MAXD && R.hq<=MAXD; })());

  /* --- el imán ---------------------------------------------------------------------- */
  piezas=[]; sel=null;
  var a1=nuevaServilleta({x:0,y:0}), a2=nuevaServilleta({x:U+5, y:4});
  piezas=[a1,a2];
  ok('una servilleta casi pegada a otra se engancha por el borde', (function(){
      aplicaIman(a2);
      return Math.abs(a2.x-(a1.x+U))<1e-9 && Math.abs(a2.y-a1.y)<1e-9; })());
  ok('y una que está lejos se queda donde la sueltes', (function(){
      var a3=nuevaServilleta({x:6*U, y:3*U});
      piezas.push(a3);
      var x0=a3.x, y0=a3.y;
      aplicaIman(a3);
      var quieta=Math.abs(a3.x-x0)<1e-9 && Math.abs(a3.y-y0)<1e-9;
      piezas=piezas.filter(function(s){ return s.id!==a3.id; });
      return quieta; })());
  ok('el imán engancha también por las marcas de los dobleces', (function(){
      a1.a=4; a1.b=2;
      var a4=nuevaServilleta({x:U*0.25+6, y:U*0.5-5});
      piezas.push(a4);
      aplicaIman(a4);
      var bien=Math.abs(a4.x-U*0.25)<1e-9 && Math.abs(a4.y-U*0.5)<1e-9;
      piezas=piezas.filter(function(s){ return s.id!==a4.id; });
      a1.a=1; a1.b=1;
      return bien; })());

  /* --- medir de verdad ---------------------------------------------------------------
     Se pone el mantel, se le echa una servilleta encima por la esquina y se
     comprueba que con el doblez bueno los trozos caen justo en el borde. */
  piezas=[]; sel=null;
  var man=nuevoMantel({wp:3,wq:2,hp:5,hq:4},{x:0,y:0});
  var ser=nuevaServilleta({x:-7, y:5});
  piezas=[man,ser];
  aplicaIman(ser);
  ok('la servilleta se engancha en la esquina del mantel',
     Math.abs(ser.x-man.x)<1e-9 && Math.abs(ser.y-man.y)<1e-9);
  ok('con una servilleta no se cubre y con dos tampoco, porque sobra por los lados',
     ancho(man)>U && alto(man)>U);
  /* la segunda servilleta, pegada a la primera, es la que llega al borde
     derecho del mantel; doblada en dos columnas, su marca cae justo ahí */
  var ser2=nuevaServilleta({x:ser.x+U+6, y:ser.y+3});
  piezas.push(ser2);
  aplicaIman(ser2);
  ok('la segunda servilleta se pone justo al lado de la primera',
     Math.abs(ser2.x-(ser.x+U))<1e-9 && Math.abs(ser2.y-ser.y)<1e-9);
  ser2.a=2; ser2.b=4;
  ok('doblada en 2 columnas, su primera marca cae justo en el borde derecho del mantel',
     marcasX(ser2).some(function(x){ return Math.abs(x-(man.x+ancho(man)))<1e-9; }),
     'el mantel mide 1,5 servilletas de ancho');
  ok('pero doblada en 3 columnas, ninguna marca cae ahí', (function(){
      ser2.a=3;
      var pega=marcasX(ser2).some(function(x){ return Math.abs(x-(man.x+ancho(man)))<1e-6; });
      ser2.a=2;
      return !pega; })());
  /* y la tercera, debajo de la primera, llega al borde de abajo */
  var ser3=nuevaServilleta({x:ser.x+5, y:ser.y+U-4});
  piezas.push(ser3);
  aplicaIman(ser3);
  ser3.a=2; ser3.b=4;
  ok('la servilleta de abajo, doblada en 4 filas, llega justo al borde inferior',
     marcasY(ser3).some(function(y){ return Math.abs(y-(man.y+alto(man)))<1e-9; }),
     'el mantel mide 1,25 servilletas de alto');
  ok('con 2 filas, en cambio, se pasa', (function(){
      ser3.b=2;
      var pega=marcasY(ser3).some(function(y){ return Math.abs(y-(man.y+alto(man)))<1e-6; });
      ser3.b=4;
      return !pega; })());

  /* --- la comprobación ------------------------------------------------------------- */
  ok('15/8 se da por bueno para el mantel de 3/2 x 5/4',
     mismaFraccion(reduce(15,8), areaDe(man)));
  ok('30/16, también, que es la misma área', mismaFraccion(reduce(30,16), areaDe(man)));
  ok('14/8 no cuela', !mismaFraccion(reduce(14,8), areaDe(man)));
  ok('y se sabe si la respuesta se queda corta o se pasa', (function(){
      var corta=reduce(14,8), larga=reduce(16,8), mia=areaDe(man);
      return (corta.p*mia.q < mia.p*corta.q) && (larga.p*mia.q > mia.p*larga.q); })());

  /* --- colores y nombres ------------------------------------------------------------ */
  ok('la servilleta tiene color fijo, que no está en la paleta de los manteles',
     PALETA.every(function(P){ return P.f.toLowerCase()!==COLU.f.toLowerCase(); }), COLU.f);
  ok('mientras quede color libre, cada mantel nuevo sale de uno distinto', (function(){
      piezas=[];
      var vistos={}, malas=0;
      for(var i=0;i<PALETA.length;i++){
        var t=nuevoMantel({wp:3,wq:2,hp:5,hq:4},{x:0,y:0});
        piezas.push(t);
        if(vistos[t.c]) malas++;
        vistos[t.c]=1;
      }
      var n=Object.keys(vistos).length;
      piezas=[];
      return malas===0 && n===PALETA.length; })());
  ok('los manteles se empiezan a nombrar por la A', (function(){
      piezas=[];
      var t1=nuevoMantel({wp:3,wq:2,hp:5,hq:4},{x:0,y:0}); piezas.push(t1);
      var t2=nuevoMantel({wp:1,wq:2,hp:3,hq:2},{x:0,y:0}); piezas.push(t2);
      var bien=t1.nombre==='A' && t2.nombre==='B';
      piezas=[];
      return bien; })());
  ok('las servilletas no llevan letra', nuevaServilleta({x:0,y:0}).nombre==='');

  /* --- etiquetas ---------------------------------------------------------------------- */
  ctx.save();
  ctx.font='10px -apple-system,Segoe UI,Roboto,sans-serif';
  var anLargo=ctx.measureText('1/8 s').width, anCorto=ctx.measureText('1/8').width;
  var etL=etiquetaParte(ctx, anLargo+8, 40, 8);
  var etC=etiquetaParte(ctx, anCorto+6, 40, 8);
  var etN=etiquetaParte(ctx, anCorto, 40, 8);
  var etBaja=etiquetaParte(ctx, anLargo+8, 9, 8);
  ctx.restore();
  ok('la etiqueta de cada trozo lleva la unidad: 1/8 s', etL==='1/8 s', etL);
  ok('si el trozo es estrecho se queda solo con la fracción', etC==='1/8', etC);
  ok('si no cabe ni eso, no se escribe nada', etN==='', '«'+etN+'»');
  ok('y si el trozo es muy bajo, tampoco', etBaja==='', '«'+etBaja+'»');

  /* --- doblar con los botones ---------------------------------------------------------- */
  piezas=[]; sel=null;
  var d1=nuevaServilleta({x:0,y:0}); piezas=[d1]; sel=d1.id;
  dobla(d1,3,2);
  ok('doblar cambia columnas y filas', d1.a===3 && d1.b===2);
  dobla(d1,d1.b,d1.a);
  ok('y 3 por 2 no es lo mismo que 2 por 3: son trozos de la misma área con otra forma',
     d1.a===2 && d1.b===3);
  dobla(d1,99,99);
  ok('no se pasa de '+MAXD+' en cada dirección', d1.a===MAXD && d1.b===MAXD);
  dobla(d1,0,0);
  ok('ni baja de una', d1.a===1 && d1.b===1);
  var m1=nuevoMantel({wp:3,wq:2,hp:5,hq:4},{x:0,y:0}); piezas.push(m1); sel=m1.id;
  dobla(m1,2,2);
  ok('el mantel no se puede doblar', m1.a===1 && m1.b===1);

  /* --- guardar y abrir ------------------------------------------------------------------ */
  piezas=[]; sel=null;
  var g1=nuevaServilleta({x:11,y:22}); g1.a=3; g1.b=5;
  var g2=nuevoMantel({wp:7,wq:3,hp:1,hq:2},{x:-30,y:80}); g2.c=4;
  piezas=[g1,g2];
  function firmaDe(){
    return piezas.map(function(s){
      return s.tipo+':'+s.wp+'/'+s.wq+'x'+s.hp+'/'+s.hq+':'+s.a+','+s.b+':'+(s.c||0)+':'+
             s.x.toFixed(2)+','+s.y.toFixed(2); }).join(' | ');
  }
  var firma=firmaDe();
  var data={formato:'manteles-y-servilletas', version:1,
    piezas:piezas.map(function(s){
      return {tipo:s.tipo,wp:s.wp,wq:s.wq,hp:s.hp,hq:s.hq,a:s.a,b:s.b,c:s.c,
              x:s.x,y:s.y,nombre:s.nombre}; })};
  importMode='replace'; loadData(JSON.parse(JSON.stringify(data)));
  ok('guardar y volver a abrir conserva las piezas, los dobleces y el color',
     firmaDe()===firma, firmaDe());
  var n0=piezas.length;
  importMode='add'; loadData(JSON.parse(JSON.stringify(data)));
  ok('el botón ＋ añade sin borrar lo que había', piezas.length===n0*2, piezas.length);
  importMode='replace';
  ok('un archivo con una servilleta estirada se rechaza',
     limpiaPiezas([{tipo:'u',wp:3,wq:2,hp:1,hq:1,a:1,b:1,x:0,y:0}])===null);
  ok('y uno con un denominador que no se puede doblar, también',
     limpiaPiezas([{tipo:'m',wp:1,wq:9,hp:1,hq:1,a:1,b:1,x:0,y:0}])===null);
  ok('y uno con coordenadas que no son números',
     limpiaPiezas([{tipo:'u',wp:1,wq:1,hp:1,hq:1,a:1,b:1,x:'ahí',y:0}])===null);

  /* --- deshacer --------------------------------------------------------------------------- */
  piezas=[]; sel=null; undoStack=[];
  var z1=nuevaServilleta({x:0,y:0}); piezas=[z1]; sel=z1.id;
  pushUndo();
  z1.x=300;
  ok('mover cambia la posición', Math.abs(piezas[0].x-300)<1e-9);
  doUndo();
  ok('y deshacer la devuelve', Math.abs(piezas[0].x)<1e-9, num(piezas[0].x));

  piezas=antesP; sel=antesS; view=antesV; opt.iman=antesI; undoStack=[];
  ponVeredicto(''); draw();

  }catch(errT){
    fails++;
    out.push('FALLO se ha cortado aquí: '+((errT&&errT.message)||errT));
    if(errT&&errT.stack) String(errT.stack).split('\n').slice(0,5).forEach(function(l){
      out.push('        '+l.trim()); });
    try{ draw(); }catch(e2){}
  }

  /* --- informe ------------------------------------------------------------------------------ */
  var texto=out.join('\n')+'\n\n'+(fails? fails+' PRUEBAS FALLIDAS de '+out.length
                                         : 'LAS '+out.length+' PRUEBAS CORRECTAS');
  var box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;background:#fff;z-index:99;overflow:auto;padding:18px 22px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
  box.innerHTML='<div style="font:600 15px/1.3 -apple-system,Segoe UI,Roboto,sans-serif;margin-bottom:4px">'+
      'Autocomprobación de manteles y servilletas</div>'+
    '<div style="font:13px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;color:'+(fails?'#c2410c':'#15803d')+';font-weight:600;margin-bottom:12px">'+
      (fails? fails+' pruebas fallidas de '+out.length : 'Las '+out.length+' pruebas correctas')+'</div>'+
    '<button id="cpTest" style="font:13px -apple-system,Segoe UI,Roboto,sans-serif;padding:6px 12px;margin-bottom:14px;'+
      'border:1px solid #d5d9e0;border-radius:7px;background:#fff;cursor:pointer">Copiar informe</button> '+
    '<button id="clTest" style="font:13px -apple-system,Segoe UI,Roboto,sans-serif;padding:6px 12px;margin-bottom:14px;'+
      'border:1px solid #d5d9e0;border-radius:7px;background:#fff;cursor:pointer">Cerrar y usar el manipulativo</button>'+
    '<pre style="white-space:pre-wrap;margin:0">'+
      out.map(function(l){ return l.indexOf('FALLO')===0
        ? '<span style="color:#c2410c;font-weight:700">'+l+'</span>' : l; }).join('\n')+'</pre>';
  document.body.appendChild(box);
  document.getElementById('cpTest').addEventListener('click',function(){
    var ta=document.createElement('textarea'); ta.value=texto; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); }catch(err){}
    document.body.removeChild(ta); this.textContent='Copiado ✓';
  });
  document.getElementById('clTest').addEventListener('click',function(){ box.remove(); });
}
var testLanzado=false;
function lanzarTest(){ if(testLanzado) return; testLanzado=true; runSelfTest(); }
if((location.hash||'').indexOf('test')>=0) setTimeout(lanzarTest,60);
window.addEventListener('hashchange',function(){
  if((location.hash||'').indexOf('test')>=0) lanzarTest();
});

window.__manteles={
  test:runSelfTest, U:U, MAXD:MAXD, COLU:COLU, PALETA:PALETA, NIVELES:NIVELES, opt:opt,
  piezas:function(){ return piezas; }, sel:function(){ return sel; },
  ancho:ancho, alto:alto, areaDe:areaDe, marcasX:marcasX, marcasY:marcasY,
  encaja:encaja, trozosQueCubren:trozosQueCubren,
  nuevaServilleta:nuevaServilleta, nuevoMantel:nuevoMantel, dobla:dobla,
  aplicaIman:aplicaIman, mantelAlAzar:mantelAlAzar, rectDeArea:rectDeArea,
  leeFraccion:leeFraccion, reduce:reduce, mcd:mcd, etiquetaParte:etiquetaParte,
  load:loadData, setMode:function(m){ importMode=m; }, redraw:draw, fit:fitView
};

})();
