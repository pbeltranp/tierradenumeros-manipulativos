<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manteles y servilletas</title>
<style>
  /* Los tamaños de letra están pensados para proyectar en clase: lo que en un
     portátil se lee de cerca, en la pantalla del aula hay que leerlo desde la
     última fila. Es la misma escala de «Tiras de papel». */
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       color:#2b2f36;background:#fff;display:flex;height:100%;overflow:hidden}
  #side{width:256px;flex:0 0 256px;border-right:1px solid #e6e8ec;padding:11px 11px;overflow:auto;
        background:#fafbfc}
  #side h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:#7b828d;
           margin:0 0 6px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;
           text-overflow:ellipsis;clear:both}
  #side h2.sep{margin-top:13px}
  /* rótulo del material: sobrio, peso ligero y una línea fina debajo. Este
     nombre es largo y va un punto más pequeño que en las tiras, para que quepa
     en una línea */
  #side .brand{font-size:22.5px;font-weight:200;letter-spacing:.01em;color:#39404a;line-height:1.25;
               padding:1px 0 9px;margin-bottom:11px;border-bottom:1px solid #e3e6eb;white-space:nowrap}
  #side .brand b{font-weight:400;color:#2b2f36}
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  #toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 9px;
           border-bottom:1px solid #e6e8ec;background:#fafbfc}
  .btn{border:1px solid #d5d9e0;background:#fff;border-radius:7px;padding:6px 10px;font-size:15px;
       color:#3d4450;cursor:pointer;display:inline-flex;align-items:center;gap:5px;line-height:1.2}
  .btn:hover:not(:disabled){background:#f0f2f5}
  .btn.on,.btn.on:hover:not(:disabled){background:#2f62a8;border-color:#2f62a8;color:#fff}
  /* solo en la barra: la misma clase separa las secciones del panel, y sin
     acotarla sus títulos se quedaban en una raya de 1 px */
  #toolbar .sep{width:1px;height:22px;background:#dfe2e7;margin:0 3px}
  .chk{display:inline-flex;align-items:center;gap:5px;font-size:15px;color:#4a515c;cursor:pointer;
       padding:4px 6px;border-radius:6px}
  .chk:hover{background:#eff1f4}
  .chk input{margin:0;cursor:pointer;width:16px;height:16px}
  .act{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;margin-top:5px;
       border:1px solid #d5d9e0;background:#fff;border-radius:7px;padding:7px 9px;font-size:15px;
       color:#3d4450;cursor:pointer;text-align:left;line-height:1.3}
  .act:hover:not(:disabled){background:#f0f2f5}
  .act:disabled{opacity:.4;cursor:default}
  .act kbd{font:12.5px ui-monospace,Menlo,Consolas,monospace;color:#9aa1ab;flex:0 0 auto}
  /* un botón que espera el segundo pinchazo para hacer lo que dice */
  .act.seguro,.btn.seguro,.act.seguro:hover:not(:disabled),.btn.seguro:hover:not(:disabled){
       border-color:#c2410c;color:#c2410c;background:#fff7f2;font-weight:600}
  .act.on,.act.on:hover:not(:disabled){background:#2f62a8;border-color:#2f62a8;color:#fff}
  .act.on kbd{color:#cfdcf0}
  .fila .act{margin-top:0;flex:1;padding:7px 7px}
  /* tres en una fila, para que «Comprobar» no se salga de los 700 px del marco */
  .fila .act.tres{font-size:14px;padding:7px 3px;justify-content:center;white-space:nowrap}
  #servi{width:100%;height:74px;border:1px dashed #d5d9e0;border-radius:9px;background:#fff;
         cursor:grab;display:block;touch-action:none}
  #servi:hover{border-color:#c7ccd4;background:#f7f8fa}
  select,input[type=text],input[type=number]{font:15px inherit;border:1px solid #d5d9e0;border-radius:6px;
       padding:6px 7px;color:#2b2f36;background:#fff;width:100%}
  .fila{display:flex;gap:5px;align-items:stretch;margin-top:5px}
  .fila > *{min-width:0}
  .mini{border:1px solid #d5d9e0;background:#fff;border-radius:6px;padding:5px 0;font-size:16px;
        color:#3d4450;cursor:pointer;flex:1;text-align:center}
  .mini:hover:not(:disabled){background:#f0f2f5}
  .mini:disabled{opacity:.35;cursor:default}
  #lisa{font-size:14.5px}
  /* columnas y filas, lado a lado: cada mitad lleva su rótulo y sus dos botones */
  .mitad{flex:1}
  .mitad .fila{margin-top:3px;gap:3px}
  .mitad .mini{flex:0 0 28px}
  .cuenta{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;
          font-weight:600;font-size:15.5px;color:#2b2f36}
  .cuenta svg{display:block;flex:0 0 auto}
  .lab{font-size:13.5px;color:#7b828d;margin-top:0}
  #partes{margin-top:7px;font-size:14px;color:#4a515c;line-height:1.45;text-align:center;
          background:#fff;border:1px solid #e6e8ec;border-radius:8px;padding:7px 8px}
  #partes b{color:#2b2f36}
  .nota{font-size:13.5px;color:#7b828d;line-height:1.45;margin-top:7px}
  #cajamedir .resp{display:flex;gap:5px;align-items:center;margin-top:5px}
  #cajamedir input{text-align:center;padding:6px 2px;font-size:17px}
  #cajamedir .barra{font-size:21px;color:#8a919c}
  #cajamedir .uni{font-size:18px;font-weight:600;color:#4a515c;padding:0 3px 0 1px}
  #veredicto{margin-top:6px;font-size:15px;line-height:1.4;min-height:16px}
  #veredicto.si{color:#15803d;font-weight:600}
  #veredicto.no{color:#c2410c}
  #colores{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  #colores .sw{width:26px;height:26px;border-radius:6px;border:2px solid #fff;
               box-shadow:0 0 0 1px #d5d9e0;cursor:pointer;padding:0}
  #colores .sw:hover{box-shadow:0 0 0 1px #9aa1ab}
  #colores .sw.on{box-shadow:0 0 0 2px #2f62a8}
  #stage{position:relative;flex:1;min-height:0;background:#fbfbfa}
  canvas#cv{display:block;width:100%;height:100%;touch-action:none}
  #hint{position:absolute;left:10px;bottom:10px;background:rgba(28,32,38,.82);color:#fff;font-size:14.5px;
        padding:6px 12px;border-radius:16px;pointer-events:none;max-width:calc(100% - 20px)}
  #info{position:absolute;right:10px;top:10px;width:390px;background:#fff;border:1px solid #dfe2e7;
        border-radius:10px;padding:12px 15px;font-size:14px;line-height:1.55;color:#4a515c;
        box-shadow:0 6px 22px rgba(20,25,35,.12);display:none;max-height:calc(100% - 20px);overflow:auto;
        max-width:calc(100% - 20px)}
  #info.show{display:block}
  #info b{color:#2b2f36}
  #info a{color:#2f62a8}
  #info .lic{margin-top:11px;padding-top:8px;border-top:1px solid #eef0f3;font-size:12.5px;
             line-height:1.5;color:#8a919c}
  #drop{position:absolute;inset:0;background:rgba(47,98,168,.08);border:2px dashed #2f62a8;
        display:none;align-items:center;justify-content:center;font-size:18px;color:#2f62a8;font-weight:600}
  #drop.show{display:flex}
  @media (max-width:640px){
    #side{width:176px;flex:0 0 176px;padding:8px 7px}
    #side .brand{white-space:normal;font-size:20px}
    .btn{padding:5px 7px;font-size:13.5px}
    .act,.chk,select,input[type=text]{font-size:13.5px}
  }
</style>
</head>
<body>

  <aside id="side">
    <div class="brand">Manteles y <b>servilletas</b></div>
    <h2>Servilleta (unidad)</h2>
    <canvas id="servi" title="Arrástrala al tablero. Todas son iguales y cuadradas; saca las que necesites"></canvas>

    <h2 class="sep">Doblar la servilleta</h2>
    <div class="fila" style="gap:9px">
      <div class="mitad" title="Dobleces en vertical: columnas">
        <div class="lab">Columnas</div>
        <div class="fila">
          <button class="mini" id="colMenos" disabled title="Una columna menos">−</button>
          <div class="cuenta" id="ncol">—</div>
          <button class="mini" id="colMas" disabled title="Una columna más">+</button>
        </div>
      </div>
      <div class="mitad" title="Dobleces en horizontal: filas">
        <div class="lab">Filas</div>
        <div class="fila">
          <button class="mini" id="filMenos" disabled title="Una fila menos">−</button>
          <div class="cuenta" id="nfil">—</div>
          <button class="mini" id="filMas" disabled title="Una fila más">+</button>
        </div>
      </div>
    </div>
    <div class="fila">
      <button class="mini" id="lisa" disabled title="Quitar todos los dobleces">desdoblar</button>
    </div>
    <div id="partes"></div>

    <h2 class="sep">Al pinchar, seleccionar</h2>
    <div class="fila">
      <button class="act on" id="modoP" title="Al pinchar se selecciona la pieza entera (tecla 1)">Pieza<kbd>1</kbd></button>
      <button class="act" id="modoS" title="Al pinchar en una servilleta doblada se selecciona solo el trozo en el que se pincha (tecla 2)">Subunidad<kbd>2</kbd></button>
    </div>
    <div class="fila" style="margin-top:9px">
      <button class="act tres" id="cortar" disabled style="flex:1" title="Separa la subunidad seleccionada del resto de la servilleta; con la servilleta entera, la corta por todas sus marcas (tecla C)">✂ Cortar</button>
      <button class="act tres" id="duplicar" disabled style="flex:1.25" title="Saca una copia de la pieza o de la subunidad seleccionada (tecla D)">⧉ Duplicar</button>
      <button class="act tres" id="borrar" disabled style="flex:.85" title="Quita la pieza seleccionada (tecla Supr)">Quitar</button>
    </div>

    <h2 class="sep">Mantel</h2>
    <select id="nivel">
      <option value="0">Fácil (mitades)</option>
      <option value="1" selected>Normal (hasta cuartos)</option>
      <option value="2">Difícil (hasta sextos y octavos)</option>
    </select>
    <button class="act" id="nuevo">Nuevo mantel al azar</button>
    <div class="fila">
      <input type="text" id="aMano" placeholder="3/2 x 5/4, o 15/8" style="flex:1.9"
             title="Escribe las medidas del mantel, o directamente el área que quieres que tenga">
      <button class="act" id="crear" style="justify-content:center" title="Crear un mantel con esas medidas">Crear</button>
    </div>

    <h2 class="sep">Comprobar</h2>
    <div id="cajamedir"></div>
    <div id="veredicto"></div>

    <h2 class="sep">Color del mantel</h2>
    <div id="colores"></div>
  </aside>

  <main>
    <div id="toolbar">
      <button class="btn" id="undo" title="Deshacer (Ctrl+Z)">↶</button>
      <button class="btn" id="vaciar" title="Quitar todo del tablero">Vaciar</button>
      <span class="sep"></span>
      <label class="chk" title="Al soltar, los bordes y las marcas se enganchan a los de los demás"><input type="checkbox" id="iman" checked>Imán</label>
      <label class="chk" title="Escribe dentro de cada parte de las servilletas cuánto mide, en unidades"><input type="checkbox" id="etiq">Etiquetas</label>
      <button class="btn" id="transp" title="Las servilletas se vuelven translúcidas y se ve el mantel por debajo">◑ Transparencia</button>
      <span class="sep"></span>
      <button class="btn" id="mano" title="Mover el tablero en vez de las piezas">✋</button>
      <button class="btn" id="zoomout">−</button>
      <button class="btn" id="zoomin">+</button>
      <button class="btn" id="fit">Ajustar</button>
      <span class="sep"></span>
      <button class="btn" id="save" title="Descargar el tablero">⤓ Guardar</button>
      <button class="btn" id="open" title="Abrir un archivo guardado">⤒ Abrir</button>
      <button class="btn" id="add" title="Añadir lo de un archivo a lo que ya hay">＋</button>
      <button class="btn" id="png" title="Descargar imagen">⤓ PNG</button>
      <button class="btn" id="help">?</button>
      <input type="file" id="fileIn" accept=".json,application/json" style="display:none">
    </div>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="hint"></div>
      <div id="info"></div>
      <div id="drop">Suelta aquí el archivo</div>
    </div>
  </main>

<script>
"use strict";
(function(){

/* =========================================================================
   1. LA IDEA
   Igual que con las tiras, pero midiendo superficies: la unidad es una
   servilleta cuadrada y hay que medir manteles rectangulares. Con el área
   aparece algo que con la longitud no pasaba: «un cuarto de servilleta» no
   es una sola cosa. Puede ser una tira vertical, una tira horizontal o un
   cuadradito, las tres de la misma área, y solo algunas de esas formas
   embaldosan el mantel. Por eso la servilleta se dobla en columnas y en
   filas por separado: la forma de la parte importa tanto como su tamaño.

   Hay tres clases de pieza:
   · 'u', la servilleta entera: 1 por 1, doblada en a columnas y b filas.
   · 't', un trozo de servilleta, que sale de cortar o de duplicar una
     subunidad: wp columnas de las wq en que estaba doblada la servilleta y hp
     filas de las hq, sin simplificar (dos cuartos seguidos son dos cuartos,
     con su marca en medio). Es papel de la servilleta, va de su color, y ya
     no se dobla más.
   · 'm', el mantel: sin marcas y sin medida escrita.
   La subunidad es cada uno de los trozos de una 'u' o de una 't': siempre
   mide 1/(columnas·filas) de unidad, y es lo que se selecciona, se duplica y
   se corta, igual que en «Tiras de papel».
   ========================================================================= */
var U=150;                 // el lado de la servilleta, en píxeles
var MAXD=8;                // dobleces máximos en cada dirección
var HUECO=12;              // lo que se separa de su pieza un trozo sacado de ella

var COLU={f:'#f4ead6', b:'#c2ab7d', t:'#7a6634'};     // la servilleta, color fijo
var PALETA=[
  {f:'#e07a5f', b:'#b1543a'},
  {f:'#6a8caf', b:'#446287'},
  {f:'#7fb069', b:'#548042'},
  {f:'#b07aa1', b:'#845278'},
  {f:'#4fa3a5', b:'#2d7274'},
  {f:'#d1495b', b:'#9c2c3c'},
  {f:'#8d6e63', b:'#5f463d'},
  {f:'#5c6bc0', b:'#39479a'}
];
function colorDe(s){ return s.tipo==='m' ? PALETA[(s.c||0)%PALETA.length] : COLU; }

/* =========================================================================
   2. ESTADO
   ========================================================================= */
var piezas=[], sel=null, nid=1, letra=0, colorTurno=0;
var selK=null;                     // la subunidad seleccionada dentro de la pieza sel, o null si es la pieza entera
var modoSel='pieza';               // 'pieza' o 'sub': qué selecciona un pinchazo
var view={x:0,y:0,z:1};
var drag=null, undoStack=[], importMode='replace';
var opt={iman:1, etiq:0, mano:0, alfa:0};

var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var stage=document.getElementById('stage');
var hintEl=document.getElementById('hint'), infoEl=document.getElementById('info');
var dropEl=document.getElementById('drop');
var flashMsg=null, flashT=0;

function w2s(p){ return {x:p.x*view.z+view.x, y:p.y*view.z+view.y}; }
function s2w(p){ return {x:(p.x-view.x)/view.z, y:(p.y-view.y)/view.z}; }
function flash(m){ flashMsg=m; flashT=Date.now(); draw(); setTimeout(draw,2400); }
function fuente(px,peso){ return (peso? peso+' ' : '')+px+'px -apple-system,Segoe UI,Roboto,sans-serif'; }
function foto(){ return JSON.stringify({p:piezas, s:sel, k:selK, n:nid}); }
function pushUndo(){
  undoStack.push(foto());
  if(undoStack.length>90) undoStack.shift();
}
function doUndo(){
  if(!undoStack.length){ flash('No hay nada que deshacer'); return; }
  var d=JSON.parse(undoStack.pop());
  piezas=d.p; sel=d.s; nid=d.n||1;
  selK=(d.k===null || d.k===undefined)? null : d.k;
  ponVeredicto(''); draw();
}

/* =========================================================================
   3. FRACCIONES
   ========================================================================= */
function mcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ var t=a%b; a=b; b=t; } return a; }
function reduce(p,q){ var d=mcd(p,q)||1; return {p:p/d, q:q/d}; }
function mismaFraccion(a,b){ return a.p*b.q===b.p*a.q; }
function leeFraccion(txt){
  if(txt===null || txt===undefined) return null;
  var s=String(txt).toLowerCase().replace(/\s+y\s+/g,' ').trim();
  if(!s) return null;
  var m;
  if((m=s.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/))){
    var e=+m[1], n=+m[2], d=+m[3];
    if(!d) return null;
    return reduce(e*d+n, d);
  }
  if((m=s.match(/^(\d+)\s*\/\s*(\d+)$/))){
    if(!+m[2]) return null;
    return reduce(+m[1], +m[2]);
  }
  if((m=s.match(/^(\d+)$/))) return {p:+m[1], q:1};
  return null;
}
function textoFrac(f){ return f.q===1 ? (f.p+'') : (f.p+'/'+f.q); }

/* =========================================================================
   4. LOS MANTELES QUE PROPONE EL ENTORNO
   Un mantel es un rectángulo de lados A/c y B/d servilletas. Los que mandan
   son c y d: para embaldosarlo hay que doblar la servilleta en un múltiplo
   de c columnas y de d filas. Se piden las fracciones de los lados ya
   irreducibles, porque si no el doblez que hace falta sería otro.
   ========================================================================= */
var NIVELES=[
  {n:'Fácil',   dens:[1,2],             maxq:4,  maxlado:3},
  {n:'Normal',  dens:[1,2,3,4],         maxq:16, maxlado:3},
  {n:'Difícil', dens:[1,2,3,4,5,6,8],   maxq:32, maxlado:3}
];
function areaDe(s){ return reduce(s.wp*s.hp, s.wq*s.hq); }
function ladoOK(A,c,maxlado){
  if(mcd(A,c)!==1) return false;
  var v=A/c;
  return v>=0.5 && v<=maxlado;
}
function mantelAlAzar(nivel){
  var N=NIVELES[nivel]||NIVELES[1];
  for(var intento=0;intento<600;intento++){
    var c=N.dens[Math.floor(Math.random()*N.dens.length)];
    var d=N.dens[Math.floor(Math.random()*N.dens.length)];
    var A=1+Math.floor(Math.random()*(N.maxlado*c));
    var B=1+Math.floor(Math.random()*(N.maxlado*d));
    if(!ladoOK(A,c,N.maxlado) || !ladoOK(B,d,N.maxlado)) continue;
    var area=reduce(A*B, c*d);
    if(area.q===1) continue;                    // que no sea un número entero de servilletas
    if(area.q>N.maxq) continue;
    var s=(A/c)*(B/d);
    if(s<0.5 || s>4.5) continue;
    return {wp:A, wq:c, hp:B, hq:d};
  }
  return {wp:3, wq:2, hp:5, hq:4};
}
/* Si se pide un área suelta, hay que inventarse un rectángulo que la tenga.
   Se busca el más cuadrado posible y con los dobleces más sencillos. */
function rectDeArea(p,q){
  var mejor=null;
  for(var c=1;c<=MAXD;c++) for(var d=1;d<=MAXD;d++){
    for(var A=1;A<=3*c;A++){
      if(mcd(A,c)!==1) continue;
      var w=A/c;
      if(w<0.5 || w>3) continue;
      /* B tiene que cumplir A*B*q = p*c*d */
      var arriba=p*c*d, abajo=A*q;
      if(arriba%abajo!==0) continue;
      var B=arriba/abajo;
      if(B<1 || mcd(B,d)!==1) continue;
      var h=B/d;
      if(h<0.5 || h>3) continue;
      var puntos=Math.abs(w/h-1)+(c+d)/50;
      if(!mejor || puntos<mejor.puntos) mejor={wp:A,wq:c,hp:B,hq:d,puntos:puntos};
    }
  }
  return mejor;
}

/* =========================================================================
   5. LAS PIEZAS
   ========================================================================= */
function ancho(s){ return U*s.wp/s.wq; }
function alto(s){ return U*s.hp/s.hq; }
function nuevaServilleta(P){
  return {id:nid++, tipo:'u', wp:1, wq:1, hp:1, hq:1, a:1, b:1, c:0,
          x:P.x, y:P.y, nombre:''};
}
function siguienteLetra(){
  var usadas={};
  piezas.forEach(function(s){ if(s.tipo==='m' && s.nombre) usadas[s.nombre]=1; });
  for(var i=0;i<26;i++){
    var L=String.fromCharCode(65+i);
    if(!usadas[L]) return L;
  }
  return String.fromCharCode(65+(letra++ %26));
}
function siguienteColor(){
  var usados={};
  piezas.forEach(function(s){ if(s.tipo==='m') usados[s.c||0]=1; });
  for(var i=0;i<PALETA.length;i++) if(!usados[i]) return i;
  return (colorTurno++)%PALETA.length;
}
function nuevoMantel(R,P){
  return {id:nid++, tipo:'m', wp:R.wp, wq:R.wq, hp:R.hp, hq:R.hq, a:1, b:1,
          c:siguienteColor(), x:P.x, y:P.y, nombre:siguienteLetra()};
}
function porId(id){
  for(var i=0;i<piezas.length;i++) if(piezas[i].id===id) return piezas[i];
  return null;
}
function seleccionada(){ return sel==null? null : porId(sel); }
/* --- las subunidades ---------------------------------------------------------
   Una servilleta o un trozo tienen a columnas y b filas de subunidades. Cada
   una mide 1/denCol de ancho y 1/denFil de alto, que son los dobleces de la
   servilleta de la que sale; en la servilleta entera, sus propias a y b. */
function partes(s){ return s.tipo==='m'? 1 : s.a*s.b; }
function denCol(s){ return Math.round(s.wq*s.a/s.wp); }
function denFil(s){ return Math.round(s.hq*s.b/s.hp); }
function celdaDen(s){ return denCol(s)*denFil(s); }
/* un trozo de ci columnas y cj filas de subunidades de 1/A por 1/B */
function nuevoTrozo(ci,cj,A,B,P){
  return {id:nid++, tipo:'t', wp:ci, wq:A, hp:cj, hq:B, a:ci, b:cj, c:0,
          x:P.x, y:P.y, nombre:''};
}
/* las subunidades se numeran por filas, de arriba abajo y de izquierda a derecha */
function rectParte(s,k){
  var i=k%s.a, j=Math.floor(k/s.a);
  return {i:i, j:j, x:s.x+ancho(s)*i/s.a, y:s.y+alto(s)*j/s.b, w:ancho(s)/s.a, h:alto(s)/s.b};
}
function marcasX(s){
  var out=[];
  if(s.tipo==='m' || s.a<2) return out;
  for(var k=1;k<s.a;k++) out.push(s.x+ancho(s)*k/s.a);
  return out;
}
function marcasY(s){
  var out=[];
  if(s.tipo==='m' || s.b<2) return out;
  for(var k=1;k<s.b;k++) out.push(s.y+alto(s)*k/s.b);
  return out;
}
function puntosX(s){ return [s.x, s.x+ancho(s)].concat(marcasX(s)); }
function puntosY(s){ return [s.y, s.y+alto(s)].concat(marcasY(s)); }
function dentro(P,s){
  return P.x>=s.x && P.x<=s.x+ancho(s) && P.y>=s.y && P.y<=s.y+alto(s);
}
/* en qué subunidad de la pieza cae un punto del mundo; -1 si cae fuera */
function parteEn(s,P){
  if(!dentro(P,s)) return -1;
  var i=Math.max(0, Math.min(s.a-1, Math.floor((P.x-s.x)/ancho(s)*s.a)));
  var j=Math.max(0, Math.min(s.b-1, Math.floor((P.y-s.y)/alto(s)*s.b)));
  return j*s.a+i;
}
function caja(lista){
  if(!lista.length) return null;
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  lista.forEach(function(s){
    x0=Math.min(x0,s.x); x1=Math.max(x1,s.x+ancho(s));
    y0=Math.min(y0,s.y); y1=Math.max(y1,s.y+alto(s));
  });
  return {x0:x0,y0:y0,x1:x1,y1:y1};
}
function sitioLibre(){
  var b=caja(piezas);
  return b? {x:b.x0, y:b.y1+U*0.25} : {x:-U*0.75, y:-U*0.75};
}

/* --- ¿embaldosa? -----------------------------------------------------------
   Una servilleta partida en a columnas y b filas da trozos de (1/a)x(1/b).
   Esos trozos cubren el mantel sin cortar ninguno si a·ancho y b·alto son
   números enteros de trozos. Es justo la condición que hay que descubrir. */
function encaja(mantel,a,b){
  var nx=a*mantel.wp/mantel.wq, ny=b*mantel.hp/mantel.hq;
  return Math.abs(nx-Math.round(nx))<1e-9 && Math.abs(ny-Math.round(ny))<1e-9;
}
function trozosQueCubren(mantel,a,b){
  if(!encaja(mantel,a,b)) return null;
  return Math.round(a*mantel.wp/mantel.wq)*Math.round(b*mantel.hp/mantel.hq);
}

/* --- el imán --------------------------------------------------------------- */
function engancheEje(s,puntosDe,coord){
  var lim=10/view.z, mios=puntosDe(s), mejor=null, dist=Infinity;
  piezas.forEach(function(o){
    if(o.id===s.id) return;
    puntosDe(o).forEach(function(b){
      mios.forEach(function(a){
        var d=b-a;
        if(Math.abs(d)<lim && Math.abs(d)<dist){ mejor=d; dist=Math.abs(d); }
      });
    });
  });
  return mejor;
}
function aplicaIman(s){
  if(!opt.iman || !s) return false;
  var dx=engancheEje(s,puntosX,'x'), dy=engancheEje(s,puntosY,'y'), algo=false;
  if(dx!==null){ s.x+=dx; algo=true; }
  if(dy!==null){ s.y+=dy; algo=true; }
  return algo;
}

/* --- doblar ----------------------------------------------------------------- */
function dobla(s,a,b){
  if(!s || s.tipo!=='u') return false;
  a=Math.max(1, Math.min(MAXD, Math.round(a)));
  b=Math.max(1, Math.min(MAXD, Math.round(b)));
  if(a===s.a && b===s.b) return false;
  pushUndo();
  s.a=a; s.b=b; selK=null;          // otros trozos: la subunidad elegida ya no existe
  draw();
  return true;
}

/* --- duplicar y cortar -------------------------------------------------------
   Como en «Tiras de papel», en dos dimensiones.
   Duplicar saca una copia: de la pieza entera, o de la subunidad elegida, que
   sale suelta justo debajo de la pieza, en la vertical de su columna.
   Cortar separa: con una subunidad elegida, esa cae debajo de la pieza y lo
   demás se queda en su sitio, en los rectángulos que queden —lo de su
   izquierda y lo de su derecha, a toda la altura, y lo de encima y lo de debajo
   en su misma columna—; con la pieza entera, la deshace en todas sus
   subunidades, un poco separadas para que se vea el corte. El mantel no se
   corta, igual que no se dobla. */
function duplica(s,k){
  if(!s) return null;
  var t;
  if(k===null || k===undefined || partes(s)<2){
    pushUndo();
    t={id:nid++, tipo:s.tipo, wp:s.wp, wq:s.wq, hp:s.hp, hq:s.hq, a:s.a, b:s.b, c:s.c||0,
       x:s.x+U*0.2, y:s.y+U*0.2, nombre:s.tipo==='m'? siguienteLetra() : ''};
  } else {
    if(!(k>=0 && k<partes(s))) return null;
    pushUndo();
    t=nuevoTrozo(1, 1, denCol(s), denFil(s), {x:rectParte(s,k).x, y:s.y+alto(s)+HUECO});
  }
  piezas.push(t); sel=t.id; selK=null; ponVeredicto(''); draw();
  return t;
}
function corta(s,k){
  if(!s) return null;
  if(s.tipo==='m'){ flash('El mantel no se corta: se mide con la servilleta'); return null; }
  var N=partes(s), A=denCol(s), B=denFil(s), nuevas=[], i, j, R;
  if(N<2){ flash('Se corta por las marcas: primero dobla la servilleta'); return null; }
  if(k===null || k===undefined){
    pushUndo();
    for(j=0;j<s.b;j++) for(i=0;i<s.a;i++){
      R=rectParte(s, j*s.a+i);
      nuevas.push(nuevoTrozo(1, 1, A, B, {x:R.x+i*8, y:R.y+j*8}));
    }
    sel=nuevas[0].id;
  } else {
    if(!(k>=0 && k<N)) return null;
    pushUndo();
    R=rectParte(s,k); i=R.i; j=R.j;
    if(i>0)     nuevas.push(nuevoTrozo(i, s.b, A, B, {x:s.x, y:s.y}));
    if(i<s.a-1) nuevas.push(nuevoTrozo(s.a-1-i, s.b, A, B, {x:R.x+R.w, y:s.y}));
    if(j>0)     nuevas.push(nuevoTrozo(1, j, A, B, {x:R.x, y:s.y}));
    if(j<s.b-1) nuevas.push(nuevoTrozo(1, s.b-1-j, A, B, {x:R.x, y:R.y+R.h}));
    nuevas.push(nuevoTrozo(1, 1, A, B, {x:R.x, y:s.y+alto(s)+HUECO}));
    sel=nuevas[nuevas.length-1].id;
  }
  piezas=piezas.filter(function(o){ return o.id!==s.id; }).concat(nuevas);
  selK=null; ponVeredicto(''); draw();
  return nuevas;
}
function ponModoSel(m){
  modoSel = m==='sub'? 'sub' : 'pieza';
  if(modoSel!=='sub') selK=null;
  draw();
}

/* =========================================================================
   6. DIBUJO
   ========================================================================= */
function rectRedondo(c,x,y,w,h,r){
  r=Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y);
  c.closePath();
}
/* La unidad se escribe «u», como en el resto de los materiales de medida: la
   servilleta es la unidad de área, y cada trozo mide 1/n u. */
function etiquetaParte(c,anchoCelda,altoCelda,n){
  if(altoCelda<13) return '';
  var largoT='1/'+n+' u';
  if(c.measureText(largoT).width+7<anchoCelda) return largoT;
  var cortoT='1/'+n;
  if(c.measureText(cortoT).width+5<anchoCelda) return cortoT;
  return '';
}
/* La letra de las etiquetas crece con el zoom y es grande de entrada, que esto
   se proyecta. A cambio, en los trozos estrechos no cabe: antes de quitarle la
   unidad a la etiqueta se prueba con letra más pequeña, hasta 3/4 de la ideal;
   después se prueba la fracción sola, hasta un mínimo que aún se lea, y solo
   si tampoco cabe se deja el trozo sin rotular. Deja puesta en el contexto la
   tipografía con la que cabe. */
var PX_ETIQ=15, PX_MIN=9;
function pxEtiqueta(){ return Math.max(10, Math.min(34, PX_ETIQ*view.z)); }
function ajustaEtiqueta(c,anchoCelda,altoCelda,n,px){
  var p, t, suelo=Math.max(PX_MIN, px*0.75);
  for(p=px; p>=suelo-1e-9; p-=1){
    c.font=fuente(p);
    t=etiquetaParte(c,anchoCelda,altoCelda,n);
    if(t.indexOf('u')>=0) return {t:t, px:p};
  }
  for(p=px; p>=PX_MIN-1e-9; p-=1){
    c.font=fuente(p);
    t=etiquetaParte(c,anchoCelda,altoCelda,n);
    if(t) return {t:t, px:p};
  }
  return {t:'', px:0};
}
/* kSel es la subunidad que hay que marcar como seleccionada, o null */
function drawPieza(c,s,marcada,kSel){
  var p=w2s({x:s.x, y:s.y});
  var w=ancho(s)*view.z, h=alto(s)*view.z;
  var C=colorDe(s), N=partes(s);
  var conSub = marcada && kSel!==null && kSel!==undefined && N>1;
  var iS=conSub? kSel%s.a : 0, jS=conSub? Math.floor(kSel/s.a) : 0;
  c.save();
  if(opt.alfa) c.globalAlpha=0.55;
  c.save();
  c.shadowColor='rgba(20,25,35,.13)'; c.shadowBlur=6; c.shadowOffsetY=2;
  rectRedondo(c,p.x,p.y,w,h,3.5*view.z);
  c.fillStyle=C.f; c.fill();
  c.restore();

  if(s.tipo!=='m' && N>1){
    c.save();
    rectRedondo(c,p.x,p.y,w,h,3.5*view.z); c.clip();
    if(conSub){
      c.fillStyle='rgba(47,98,168,.22)';
      c.fillRect(p.x+w*iS/s.a, p.y+h*jS/s.b, w/s.a, h/s.b);
    }
    c.strokeStyle=C.b; c.lineWidth=Math.max(1.5, 1.9*view.z);
    var k;
    for(k=1;k<s.a;k++){
      var X=p.x+w*k/s.a;
      c.beginPath(); c.moveTo(X,p.y); c.lineTo(X,p.y+h); c.stroke();
    }
    for(k=1;k<s.b;k++){
      var Y=p.y+h*k/s.b;
      c.beginPath(); c.moveTo(p.x,Y); c.lineTo(p.x+w,Y); c.stroke();
    }
    c.restore();
  }
  if(s.tipo!=='m' && opt.etiq){
    c.save();
    rectRedondo(c,p.x,p.y,w,h,3.5*view.z); c.clip();
    c.fillStyle=C.t;
    c.textAlign='center'; c.textBaseline='middle';
    if(s.tipo==='u' && N===1){
      c.font=fuente(pxEtiqueta());
      if(c.measureText('1 u').width+8<w && h>15) c.fillText('1 u', p.x+w/2, p.y+h/2);
    } else {
      var E=ajustaEtiqueta(c, w/s.a, h/s.b, celdaDen(s), pxEtiqueta());
      if(E.t) for(var i=0;i<s.a;i++) for(var j=0;j<s.b;j++)
        c.fillText(E.t, p.x+w*(i+0.5)/s.a, p.y+h*(j+0.5)/s.b);
    }
    c.restore();
  }

  rectRedondo(c,p.x,p.y,w,h,3.5*view.z);
  c.lineWidth=(marcada && !conSub)? 2.6 : 1.3;
  c.strokeStyle=(marcada && !conSub)? '#1f4e8c' : C.b;
  c.stroke();
  if(conSub){
    c.lineWidth=2.6; c.strokeStyle='#1f4e8c';
    c.strokeRect(p.x+w*iS/s.a, p.y+h*jS/s.b, w/s.a, h/s.b);
  }
  c.restore();

  if(s.tipo==='m'){
    c.save();
    c.fillStyle='#6b7280';
    c.font=fuente(Math.max(11,Math.min(34,16*view.z)),'600');
    c.textAlign='right'; c.textBaseline='top';
    c.fillText(s.nombre, p.x-8, p.y);
    c.restore();
  }
}
function draw(){
  var W=cv.width/(window.devicePixelRatio||1), H=cv.height/(window.devicePixelRatio||1);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#fbfbfa'; ctx.fillRect(0,0,W,H);
  /* los manteles debajo y las servilletas encima: la herramienta de medir
     tiene que verse siempre */
  piezas.forEach(function(s){ if(s.tipo==='m') drawPieza(ctx,s,s.id===sel,null); });
  piezas.forEach(function(s){ if(s.tipo!=='m') drawPieza(ctx,s,s.id===sel,s.id===sel? selK : null); });
  updateUI();
}

/* =========================================================================
   7. INTERACCIÓN
   ========================================================================= */
function pos(e){
  var r=stage.getBoundingClientRect();
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}
function piezaEn(P){
  /* primero las servilletas, que son las que están encima */
  var i;
  for(i=piezas.length-1;i>=0;i--) if(piezas[i].tipo!=='m' && dentro(P,piezas[i])) return piezas[i];
  for(i=piezas.length-1;i>=0;i--) if(piezas[i].tipo==='m' && dentro(P,piezas[i])) return piezas[i];
  return null;
}
/* seleccionar lo que hay en un punto: la pieza, o una de sus subunidades si el
   modo es el de subunidades y la pieza está doblada */
function seleccionaEn(P){
  var t=piezaEn(P);
  if(!t){ sel=null; selK=null; return null; }
  var k = (modoSel==='sub' && partes(t)>1)? parteEn(t,P) : null;
  if(sel!==t.id) ponVeredicto('');
  sel=t.id; selK=k;
  piezas=piezas.filter(function(q){ return q.id!==t.id; }).concat([t]);
  return t;
}
cv.addEventListener('pointerdown',function(e){
  cv.setPointerCapture(e.pointerId);
  var s=pos(e), w=s2w(s);
  var t=piezaEn(w);
  if(t && !opt.mano && e.button!==1 && e.button!==2){
    var antes=foto();
    seleccionaEn(w);
    drag={modo:'mover', w0:w, s0:s, s:t, x0:t.x, y0:t.y, movido:false, antes:antes};
    draw(); return;
  }
  if(!t && !opt.mano && e.button===0){ sel=null; selK=null; ponVeredicto(''); }
  drag={modo:'pan', s0:s, v0:{x:view.x, y:view.y}};
  draw();
});
cv.addEventListener('pointermove',function(e){
  if(!drag) return;
  var s=pos(e), w=s2w(s);
  if(drag.modo==='pan'){
    view.x=drag.v0.x+(s.x-drag.s0.x); view.y=drag.v0.y+(s.y-drag.s0.y);
    draw(); return;
  }
  /* un pinchazo sin arrastre es solo seleccionar: ni mueve la pieza ni gasta
     un deshacer */
  if(!drag.movido && Math.abs(s.x-drag.s0.x)+Math.abs(s.y-drag.s0.y)<4) return;
  drag.movido=true;
  drag.s.x=drag.x0+(w.x-drag.w0.x);
  drag.s.y=drag.y0+(w.y-drag.w0.y);
  draw();
});
function suelta(){
  if(!drag) return;
  var d=drag; drag=null;
  if(d.modo==='mover' && d.movido){
    if(d.antes){ undoStack.push(d.antes); if(undoStack.length>90) undoStack.shift(); }
    aplicaIman(d.s);
  }
  draw();
}
cv.addEventListener('pointerup',suelta);
cv.addEventListener('pointercancel',suelta);
cv.addEventListener('contextmenu',function(e){ e.preventDefault(); });
cv.addEventListener('wheel',function(e){
  e.preventDefault();
  var s=pos(e), w=s2w(s);
  var z=Math.max(0.2, Math.min(3, view.z*(e.deltaY<0?1.12:1/1.12)));
  view.z=z; view.x=s.x-w.x*z; view.y=s.y-w.y*z;
  draw();
},{passive:false});

/* --- sacar servilletas del menú -------------------------------------------- */
function pintaServi(){
  var c=document.getElementById('servi'), r=c.getBoundingClientRect();
  var an=Math.max(120, r.width||170), al=74;
  c.width=an*2; c.height=al*2;
  var o=c.getContext('2d'); o.scale(2,2);
  o.clearRect(0,0,an,al);
  var lado=54, x=(an-lado)/2, y=(al-lado)/2;
  o.save();
  o.shadowColor='rgba(20,25,35,.13)'; o.shadowBlur=5; o.shadowOffsetY=2;
  rectRedondo(o,x,y,lado,lado,3);
  o.fillStyle=COLU.f; o.fill();
  o.restore();
  rectRedondo(o,x,y,lado,lado,3);
  o.lineWidth=1.3; o.strokeStyle=COLU.b; o.stroke();
  o.fillStyle=COLU.t; o.font=fuente(15);
  o.textAlign='center'; o.textBaseline='middle';
  o.fillText('1 u', an/2, al/2);
}
function sueltaPaleta(){
  window.removeEventListener('pointermove', muevePaleta);
  window.removeEventListener('pointerup', sueltaPaleta);
  suelta();
}
function muevePaleta(e){
  if(!drag) return;
  var w=s2w(pos(e));
  drag.movido=true;
  drag.s.x=drag.x0+(w.x-drag.w0.x);
  drag.s.y=drag.y0+(w.y-drag.w0.y);
  draw();
}
document.getElementById('servi').addEventListener('pointerdown',function(e){
  e.preventDefault();
  pushUndo();
  var w=s2w(pos(e));
  var t=nuevaServilleta({x:w.x-U/2, y:w.y-U/2});
  piezas.push(t); sel=t.id; selK=null; ponVeredicto('');
  drag={modo:'mover', w0:w, s0:pos(e), s:t, x0:t.x, y0:t.y, movido:true, antes:null};
  window.addEventListener('pointermove', muevePaleta);
  window.addEventListener('pointerup', sueltaPaleta);
  draw();
});

/* --- crear manteles --------------------------------------------------------- */
function ponMantel(R){
  pushUndo();
  var t=nuevoMantel(R, sitioLibre());
  piezas.push(t); sel=t.id; selK=null;
  ponVeredicto('');
  fitView();
  return t;
}
document.getElementById('nuevo').addEventListener('click',function(){
  var nivel=+document.getElementById('nivel').value;
  var t=ponMantel(mantelAlAzar(nivel));
  flash('Ahí tienes el mantel '+t.nombre+'. ¿Cuánto mide?');
});
document.getElementById('crear').addEventListener('click',function(){
  var caja0=document.getElementById('aMano');
  var txt=String(caja0.value||'').trim();
  var partes=txt.split(/\s*[x×*]\s*/i);
  var R=null;
  if(partes.length===2){
    var f1=leeFraccion(partes[0]), f2=leeFraccion(partes[1]);
    if(!f1 || !f2){ flash('No entiendo esas medidas. Prueba con 3/2 x 5/4'); return; }
    if(f1.q>MAXD || f2.q>MAXD){
      flash('Los lados tienen que tener denominador '+MAXD+' como mucho, que es hasta donde se dobla la servilleta');
      return;
    }
    if(f1.p/f1.q>3 || f2.p/f2.q>3){ flash('Ese mantel sería enorme. Menos de 3 servilletas de lado'); return; }
    R={wp:f1.p, wq:f1.q, hp:f2.p, hq:f2.q};
  } else {
    var f=leeFraccion(txt);
    if(!f){ flash('Escribe 3/2 x 5/4 para dar los lados, o 15/8 para dar el área'); return; }
    R=rectDeArea(f.p, f.q);
    if(!R){ flash('No sé hacer un mantel con esa área usando dobleces hasta '+MAXD); return; }
  }
  var t=ponMantel(R);
  caja0.value='';
  flash('Ahí tienes el mantel '+t.nombre+'. En pantalla no pone cuánto mide');
});

/* --- comprobar --------------------------------------------------------------- */
function ponVeredicto(txt,clase){
  var v=document.getElementById('veredicto');
  v.textContent=txt||'';
  v.className=clase||'';
  /* con la letra grande el panel puede necesitar barra: que el veredicto no se
     quede escondido debajo */
  if(txt && v.scrollIntoView){ try{ v.scrollIntoView({block:'nearest'}); }catch(err){} }
}
/* Los dos textos de la comprobación. La medida se escribe siempre con su
   unidad, «15/8 u», que es como se lee en las etiquetas de los trozos. No hay
   manera de pedirle la medida al programa: comprobar dice si la respuesta se
   queda corta o se pasa, y nada más. */
/* Si la respuesta se puede simplificar, se dice la irreducible y se propone
   volver a medir con esa subunidad mayor. Es una pregunta de verdad: aquí las
   subunidades salen de doblar y son rectángulos, así que la forma manda. Un
   mantel de 3/2 por 4/3 mide 12/6 u, que son 2 u, y dos servilletas sin doblar
   no caben en él tal como están.
   El veredicto solo pregunta. Ni calcula si en este mantel se puede, ni avisa
   de que a veces no se podrá: eso es lo que hay que descubrir midiendo. */
function textoAcierto(nombre,num,den,mia){
  var extra = '';
  if(!(num===mia.p && den===mia.q)){
    extra = ' Es la misma área que '+textoFrac(mia)+' u, que ya no se puede simplificar más. '+
            (mia.q===1 ? 'Intenta medirla con servilletas sin doblar, ¿puedes?'
                       : 'Intenta medirla en 1/'+mia.q+' u, ¿puedes?');
  }
  return '¡Eso es! El mantel '+nombre+' mide '+num+'/'+den+' u.'+extra;
}
function textoFallo(nombre,num,den,mayor){
  return 'Todavía no. '+num+'/'+den+' u es '+(mayor?'más grande':'más pequeño')+' que el mantel '+nombre+'.';
}

function compruebaMedida(){
  var s=seleccionada();
  if(!s || s.tipo!=='m') return;
  var n=document.getElementById('rNum').value.trim();
  var d=document.getElementById('rDen').value.trim();
  if(n==='' || d===''){
    ponVeredicto('Escribe cuántos trozos lo cubren y en cuántos trozos has partido la servilleta.','no');
    return;
  }
  var num=parseInt(n,10), den=parseInt(d,10);
  if(!isFinite(num)||!isFinite(den)||den<1||num<0){
    ponVeredicto('Esos números no me valen.','no'); return;
  }
  var f=reduce(num,den), mia=areaDe(s);
  if(mismaFraccion(f,mia)) ponVeredicto(textoAcierto(s.nombre,num,den,mia),'si');
  else ponVeredicto(textoFallo(s.nombre,num,den, f.p*mia.q > mia.p*f.q),'no');
}

function limpiaPiezas(lista){
  if(!Array.isArray(lista)) return null;
  var out=[];
  for(var i=0;i<lista.length;i++){
    var s=lista[i];
    if(!s || typeof s!=='object') return null;
    var tipo = s.tipo==='m' ? 'm' : s.tipo==='u' ? 'u' : s.tipo==='t' ? 't' : null;
    if(!tipo) return null;
    var wp=Number(s.wp), wq=Number(s.wq), hp=Number(s.hp), hq=Number(s.hq);
    var x=Number(s.x), y=Number(s.y);
    if([wp,wq,hp,hq,x,y].some(function(v){ return !isFinite(v); })) return null;
    if(!(wp>0 && wq>0 && hp>0 && hq>0)) return null;
    if(wq>MAXD || hq>MAXD) return null;
    if(tipo==='u' && !(wp===1 && wq===1 && hp===1 && hq===1)) return null;
    var a=Math.max(1, Math.min(MAXD, Math.round(Number(s.a)||1)));
    var b=Math.max(1, Math.min(MAXD, Math.round(Number(s.b)||1)));
    if(tipo==='m'){ a=1; b=1; }
    /* un trozo son columnas y filas enteras de las de la servilleta, sin llegar
       a ser la servilleta entera, y tiene tantas marcas como subunidades */
    if(tipo==='t'){
      if([wp,wq,hp,hq].some(function(v){ return v!==Math.round(v); })) return null;
      if(wp>wq || hp>hq || (wp===wq && hp===hq)) return null;
      a=wp; b=hp;
    }
    var col=Math.round(Number(s.c)||0);
    if(!(col>=0 && col<PALETA.length)) col=0;
    var cuantos=out.filter(function(o){ return o.tipo==='m'; }).length;
    out.push({id:nid++, tipo:tipo, wp:wp, wq:wq, hp:hp, hq:hq, a:a, b:b, c:col, x:x, y:y,
              nombre: tipo==='m'
                ? (String(s.nombre||'').slice(0,2) || String.fromCharCode(65+(cuantos%26)))
                : ''});
  }
  return out;
}
function loadData(d){

}

  if(selK!==null && partes(s)>1) return 'Una subunidad seleccionada — se puede cortar o duplicar';

  if(s.tipo==='t') return partes(s)>1
    ? 'Un trozo de servilleta con marcas — se puede cortar por ellas o duplicar'
    : 'Una subunidad suelta — se puede duplicar y cubrir el mantel con las copias';
  if(s.a*s.b>1) return 'Servilleta doblada en '+s.a+' columnas y '+s.b+' filas · si los trozos no encajan, '+
                       'prueba a repartir los dobleces de otra manera';
  return 'Dobla la servilleta en columnas y en filas para hacer trozos iguales';
}

  var n0=piezas.length;
  importMode='add'; loadData(JSON.parse(JSON.stringify(data)));
  ok('el botón ＋ añade sin borrar lo que había', piezas.length===n0*2, piezas.length);
  importMode='replace';
  ok('un archivo con una servilleta estirada se rechaza',
     limpiaPiezas([{tipo:'u',wp:3,wq:2,hp:1,hq:1,a:1,b:1,x:0,y:0}])===null);
  ok('y uno con un denominador que no se puede doblar, también',
     limpiaPiezas([{tipo:'m',wp:1,wq:9,hp:1,hq:1,a:1,b:1,x:0,y:0}])===null);
  ok('y uno con coordenadas que no son números',
     limpiaPiezas([{tipo:'u',wp:1,wq:1,hp:1,hq:1,a:1,b:1,x:'ahí',y:0}])===null);

  /* --- deshacer --------------------------------------------------------------------------- */
  piezas=[]; sel=null; undoStack=[];
  var z1=nuevaServilleta({x:0,y:0}); piezas=[z1]; sel=z1.id;
  pushUndo();
  z1.x=300;
  ok('mover cambia la posición', Math.abs(piezas[0].x-300)<1e-9);
  doUndo();
  ok('y deshacer la devuelve', Math.abs(piezas[0].x)<1e-9, num(piezas[0].x));

  piezas=antesP; sel=antesS; view=antesV; opt.iman=antesI; opt.etiq=antesE; opt.alfa=antesA; undoStack=[];
  flashMsg=null; cachePartes=''; cacheMedir=''; cacheColor=''; selK=antesK; modoSel=antesM;
  ponVeredicto(''); draw();

  }catch(errT){
    fails++;
    out.push('FALLO se ha cortado aquí: '+((errT&&errT.message)||errT));
    if(errT&&errT.stack) String(errT.stack).split('\n').slice(0,5).forEach(function(l){
      out.push('        '+l.trim()); });
    try{ draw(); }catch(e2){}
  }

  /* --- informe ------------------------------------------------------------------------------ */
  var texto=out.join('\n')+'\n\n'+(fails? fails+' PRUEBAS FALLIDAS de '+out.length
                                         : 'LAS '+out.length+' PRUEBAS CORRECTAS');
  var box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;background:#fff;z-index:99;overflow:auto;padding:18px 22px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
  box.innerHTML='<div style="font:600 15px/1.3 -apple-system,Segoe UI,Roboto,sans-serif;margin-bottom:4px">'+
      'Autocomprobación de manteles y servilletas</div>'+
    '<div style="font:13px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;color:'+(fails?'#c2410c':'#15803d')+';font-weight:600;margin-bottom:12px">'+
      (fails? fails+' pruebas fallidas de '+out.length : 'Las '+out.length+' pruebas correctas')+'</div>'+
    '<button id="cpTest" style="font:13px -apple-system,Segoe UI,Roboto,sans-serif;padding:6px 12px;margin-bottom:14px;'+
      'border:1px solid #d5d9e0;border-radius:7px;background:#fff;cursor:pointer">Copiar informe</button> '+
    '<button id="clTest" style="font:13px -apple-system,Segoe UI,Roboto,sans-serif;padding:6px 12px;margin-bottom:14px;'+
      'border:1px solid #d5d9e0;border-radius:7px;background:#fff;cursor:pointer">Cerrar y usar el manipulativo</button>'+
    '<pre style="white-space:pre-wrap;margin:0">'+
      out.map(function(l){ return l.indexOf('FALLO')===0
        ? '<span style="color:#c2410c;font-weight:700">'+l+'</span>' : l; }).join('\n')+'</pre>';
  document.body.appendChild(box);
  document.getElementById('cpTest').addEventListener('click',function(){
    var ta=document.createElement('textarea'); ta.value=texto; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); }catch(err){}
    document.body.removeChild(ta); this.textContent='Copiado ✓';
  });
  document.getElementById('clTest').addEventListener('click',function(){ box.remove(); });
}
var testLanzado=false;
function lanzarTest(){ if(testLanzado) return; testLanzado=true; runSelfTest(); }
if((location.hash||'').indexOf('test')>=0) setTimeout(lanzarTest,60);
window.addEventListener('hashchange',function(){
  if((location.hash||'').indexOf('test')>=0) lanzarTest();
});

window.__manteles={
  test:runSelfTest, U:U, MAXD:MAXD, COLU:COLU, PALETA:PALETA, NIVELES:NIVELES, opt:opt,
  piezas:function(){ return piezas; }, sel:function(){ return sel; },
  ancho:ancho, alto:alto, areaDe:areaDe, marcasX:marcasX, marcasY:marcasY,
  encaja:encaja, trozosQueCubren:trozosQueCubren,
  nuevaServilleta:nuevaServilleta, nuevoMantel:nuevoMantel, dobla:dobla,
  aplicaIman:aplicaIman, mantelAlAzar:mantelAlAzar, rectDeArea:rectDeArea,
  leeFraccion:leeFraccion, reduce:reduce, mcd:mcd, etiquetaParte:etiquetaParte,
  load:loadData, setMode:function(m){ importMode=m; }, redraw:draw, fit:fitView,
  nuevoTrozo:nuevoTrozo, partes:partes, celdaDen:celdaDen, parteEn:parteEn, rectParte:rectParte,
  duplica:duplica, corta:corta, seleccionaEn:seleccionaEn, ponModoSel:ponModoSel,
  selK:function(){ return selK; }, modoSel:function(){ return modoSel; },
  ajustaEtiqueta:ajustaEtiqueta, pxEtiqueta:pxEtiqueta,
  view:function(){ return view; }, w2s:w2s, s2w:s2w, undo:doUndo
};

})();
