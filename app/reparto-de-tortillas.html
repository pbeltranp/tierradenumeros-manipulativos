<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reparto de tortillas</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       color:#2b2f36;background:#fff;display:flex;height:100%;overflow:hidden}
  #side{width:224px;flex:0 0 224px;border-right:1px solid #e6e8ec;padding:10px 10px;overflow:auto;
        background:#fafbfc}
  #side h2{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#8a919c;
           margin:0 0 6px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;
           text-overflow:ellipsis;clear:both}
  #side h2.sep{margin-top:16px}
  /* rótulo del material: sobrio, peso ligero y una línea fina debajo */
  #side .brand{font-size:19px;font-weight:200;letter-spacing:.02em;color:#39404a;line-height:1.25;
               padding:2px 2px 10px;margin-bottom:11px;border-bottom:1px solid #e3e6eb}
  #side .brand b{font-weight:400;color:#2b2f36}
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  #toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:7px 9px;
           border-bottom:1px solid #e6e8ec;background:#fafbfc}
  .btn{border:1px solid #d5d9e0;background:#fff;border-radius:7px;padding:5px 9px;font-size:12.5px;
       color:#3d4450;cursor:pointer;display:inline-flex;align-items:center;gap:5px;line-height:1.2}
  .btn:hover{background:#f0f2f5}
  .btn.on{background:#2f62a8;border-color:#2f62a8;color:#fff}
  /* acotado a la barra: si no, se lo come también a los h2 del panel lateral,
     que llevan la misma clase para separarse, y los deja en una raya de 1px */
  #toolbar .sep{width:1px;height:20px;background:#dfe2e7;margin:0 3px}
  .chk{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#4a515c;cursor:pointer;
       padding:3px 6px;border-radius:6px}
  .chk:hover{background:#eff1f4}
  .chk input{margin:0;cursor:pointer}
  .act{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;margin-top:5px;
       border:1px solid #d5d9e0;background:#fff;border-radius:7px;padding:6px 8px;font-size:12px;
       color:#3d4450;cursor:pointer;text-align:left;line-height:1.3}
  .act:hover{background:#f0f2f5}
  .act:disabled{opacity:.4;cursor:default}
  .act kbd{font:11px ui-monospace,Menlo,Consolas,monospace;color:#9aa1ab;flex:0 0 auto}
  select,input[type=text],input[type=number]{font:12px inherit;border:1px solid #d5d9e0;border-radius:6px;
       padding:5px 6px;color:#2b2f36;background:#fff;width:100%}
  .fila{display:flex;gap:5px;align-items:stretch;margin-top:4px}
  .fila > *{min-width:0}
  .fila label{flex:0 0 82px;display:flex;align-items:center;font-size:11.5px;color:#6b727d}
  .modo{display:flex;gap:0;margin-top:2px;border:1px solid #d5d9e0;border-radius:7px;overflow:hidden}
  .modo button{flex:1;border:0;background:#fff;padding:6px 4px;font:12px inherit;color:#4a515c;cursor:pointer}
  .modo button.on{background:#2f62a8;color:#fff}
  .lab{font-size:11px;color:#8a919c;margin-top:7px}
  .cja{margin-top:7px;font-size:11.5px;color:#4a515c;line-height:1.5;
       background:#fff;border:1px solid #e6e8ec;border-radius:8px;padding:7px 8px}
  .cja b{color:#2b2f36}
  .nota{font-size:11px;color:#8a919c;line-height:1.5;margin-top:7px}
  #stage{position:relative;flex:1;min-height:140px;background:#fbfbfa}
  canvas#cv{display:block;width:100%;height:100%;touch-action:none}
  #hint{position:absolute;left:10px;bottom:10px;background:rgba(28,32,38,.82);color:#fff;font-size:11.5px;
        padding:5px 10px;border-radius:14px;pointer-events:none;max-width:calc(100% - 20px)}
  #info{position:absolute;right:10px;top:10px;width:346px;background:#fff;border:1px solid #dfe2e7;
        border-radius:10px;padding:11px 13px;font-size:11.5px;line-height:1.55;color:#4a515c;
        box-shadow:0 6px 22px rgba(20,25,35,.12);display:none;max-height:calc(100% - 20px);overflow:auto}
  #info.show{display:block}
  #info b{color:#2b2f36}
  #info a{color:#2f62a8}
  #info .lic{margin-top:11px;padding-top:8px;border-top:1px solid #eef0f3;font-size:10.5px;
             line-height:1.5;color:#8a919c}
  #drop{position:absolute;inset:0;background:rgba(47,98,168,.08);border:2px dashed #2f62a8;
        display:none;align-items:center;justify-content:center;font-size:15px;color:#2f62a8;font-weight:600}
  #drop.show{display:flex}

  /* --- los papeles: resultado, tabla y caja ------------------------------------- */
  #docs{flex:0 0 auto;max-height:56%;overflow:auto;border-top:1px solid #e6e8ec;background:#fff;
        padding:9px 12px 14px}
  #resu{font-size:13px;line-height:1.9;color:#3d4450}
  #resu .et{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#8a919c;
            margin-right:6px}
  #resu .gr{font-size:15.5px;color:#1f2a38}
  /* el arco del período: una cifra por span, y los bordes contiguos hacen la raya
     seguida. Tiene que valer igual en el resultado y en el cociente de la caja */
  .arc{border-top:1px solid #2b2f36}
  #papeles{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;margin-top:8px}
  .papel{flex:0 1 auto;min-width:280px}
  .papel h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#8a919c;
            margin:6px 0 5px;font-weight:600;display:flex;align-items:center;gap:8px}
  .papel h3 button{border:1px solid #d5d9e0;background:#fff;border-radius:6px;padding:2px 7px;
            font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#4a515c;
            cursor:pointer;text-transform:none;letter-spacing:0;font-weight:400}
  .papel h3 button:hover{background:#f0f2f5}
  table.tab{border-collapse:collapse;font-size:12.5px}
  table.tab th{font-size:10.5px;font-weight:600;color:#6b727d;text-align:center;padding:3px 7px;
               border-bottom:1px solid #d5d9e0;line-height:1.25}
  table.tab td{padding:2px 7px;text-align:center;border-bottom:1px solid #eef0f3;white-space:nowrap}
  table.tab td.fs{color:#8a919c;font-size:11.5px;text-align:right}
  table.tab td.tam{color:#3d4450;font-size:12px;background:#fafbfc;border-right:1px solid #e6e8ec}
  table.tab tr.hl td{background:#eaf1fb}
  /* El número y su tamaño van en dos cajas de ancho fijo —el mayor de la tabla—
     para que todas las filas caigan a plomo. Si no, «2[1]» y «60[1/10²]» miden
     distinto y cada fila se centra en otro sitio. */
  table.tab .n{display:inline-block;width:var(--nw,2.5ch);text-align:right}
  table.tab .u{display:inline-block;width:var(--uw,5.5ch);text-align:left;
               color:#98a0ab;font-size:11px;padding-left:3px}
  table.tab input{width:3.4em;text-align:center;padding:2px 3px;font:12.5px inherit;
                  border:1px solid #cdd3db;border-radius:5px;background:#fffdf6}
  table.tab input:focus{outline:2px solid #9dbde6;outline-offset:-1px}
  table.tab td.rep{background:#fdf3e3}
  .avisos{font-size:11.5px;color:#8a6d3b;line-height:1.5;margin-top:6px;max-width:420px}
  .avisos div{margin-top:2px}
  /* la caja: rejilla de celdas de un carácter, que es la única manera de que las
     restas queden justo debajo de lo que les toca */
  .cajabox{display:flex;align-items:flex-start;
           font:13.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .cajagr{display:grid;justify-content:end}
  .cajagr span{text-align:right;padding:0 1px}
  .cajagr span.bar{border-bottom:1px solid #6b727d}
  .cajagr span.hl,.cajader span.hl{background:#eaf1fb;border-radius:2px}
  .cajader{border-left:1px solid #6b727d;padding-left:7px;margin-left:2px}
  .cajader .dvs{border-bottom:1px solid #6b727d;padding-right:12px;white-space:nowrap}
  .cajader .coc{padding-right:12px;white-space:nowrap}
  @media (max-width:640px){
    #side{width:170px;flex:0 0 170px;padding:8px 7px}
    .btn{padding:5px 7px;font-size:12px}
    #info{width:calc(100% - 20px)}
  }
</style>
</head>
<body>

  <aside id="side">
    <div class="brand">Reparto de <b>tortillas</b></div>

    <h2>Las condiciones iniciales</h2>
    <div class="fila"><label>Tortillas</label><input type="number" id="inA" min="0" max="999" value="3"></div>
    <div class="fila"><label>Personas</label><input type="number" id="inB" min="0" max="999" value="4"></div>
    <button class="act" id="poner">Poner la mesa</button>

    <h2 class="sep">La técnica de reparto</h2>
    <div class="modo">
      <button id="mLibre">Libre</button>
      <button id="mFases">Fases iguales</button>
    </div>
    <div class="fila"><label id="labBase">Partir en</label><input type="number" id="inBase" min="2" max="100" value="10"></div>
    <div class="nota" id="notaModo"></div>

    <h2 class="sep">Acciones</h2>
    <button class="act" id="darUno">→ Dar uno a cada persona<kbd>D</kbd></button>
    <button class="act" id="darTodo">⇉ Dar todo lo que se pueda<kbd>A</kbd></button>
    <button class="act" id="partir">✂ Partir lo que sobra<kbd>P</kbd></button>
    <button class="act" id="fase1">▶ Una fase entera<kbd>F</kbd></button>
    <button class="act" id="hastaFin">▶▶ Seguir hasta que pare<kbd>G</kbd></button>
    <button class="act" id="atras">↶ Quitar la última fase</button>

    <h2 class="sep" id="h2Cuentas">Cuentas</h2>
    <div class="cja" id="panelCuentas"></div>
  </aside>

  <main>
    <div id="toolbar">
      <button class="btn" id="undo" title="Deshacer (Ctrl+Z)">↶</button>
      <button class="btn" id="reiniciar" title="Volver a empezar el reparto">Reiniciar</button>
      <span class="sep"></span>
      <label class="chk" title="La tabla de las cuatro columnas"><input type="checkbox" id="cTabla" checked>Tabla</label>
      <label class="chk" title="El tamaño de los trozos, en una columna aparte"><input type="checkbox" id="cTam">Columna de tamaño</label>
      <label class="chk" title="El algoritmo de la división, colocado en caja"><input type="checkbox" id="cCaja" checked>División en caja</label>
      <span class="sep"></span>
      <button class="btn" id="forma" title="Tortilla redonda o cuadrada">◐ Redonda</button>
      <label class="chk" title="Cuando los trozos son ya muy pequeños, los mira de cerca"><input type="checkbox" id="cLupa" checked>Lupa</label>
      <label class="chk" title="El programa lleva la cuenta de lo repartido"><input type="checkbox" id="cCuentas">Cuentas</label>
      <span class="sep"></span>
      <button class="btn" id="zoomout">−</button>
      <button class="btn" id="zoomin">+</button>
      <button class="btn" id="fit">Ajustar</button>
      <span class="sep"></span>
      <button class="btn" id="save" title="Descargar el reparto">⤓ Guardar</button>
      <button class="btn" id="open" title="Abrir un archivo guardado">⤒ Abrir</button>
      <button class="btn" id="png" title="Descargar imagen">⤓ PNG</button>
      <button class="btn" id="help">?</button>
      <input type="file" id="fileIn" accept=".json,application/json" style="display:none">
    </div>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="hint"></div>
      <div id="info"></div>
      <div id="drop">Suelta aquí el archivo</div>
    </div>
    <div id="docs">
      <div id="resu"></div>
      <div id="papeles">
        <div class="papel" id="wrapTabla">
          <h3>La tabla del reparto
            <button id="copiaTabla" title="Copiarla para pegarla en un documento">⧉ Copiar</button></h3>
          <div id="tabla"></div>
          <div class="avisos" id="avisos"></div></div>
        <div class="papel" id="wrapCaja">
          <h3>La división en caja
            <button id="copiaCaja" title="Copiarla para pegarla en un documento">⧉ Copiar</button></h3>
          <div id="caja"></div>
          <div class="avisos" id="avisoCaja"></div></div>
      </div>
    </div>
  </main>

<script>
"use strict";
(function(){

/* =========================================================================
   1. LA IDEA
   Repartir a tortillas entre b personas, en partes iguales, SIEMPRE POR
   FASES. En cada fase se da a cada persona el mismo número de trozos y lo que
   sobra se parte en partes iguales para seguir. Lo único que cambia de una
   técnica a otra es en cuántas partes se parte:

     · si en cada fase se parte en lo que uno quiera —medios, luego tercios de
       esos medios— sale el reparto de siempre: 1 + 1/2 + 1/6 de tortilla;
     · si se parte SIEMPRE en el mismo número β, sale la Representación
       Polinómica: a0[1] + a1[1/β] + a2[1/β²] + …

   O sea, que no hay dos materiales: hay uno con las fases libres y el otro es
   el caso particular de fases iguales. El motor es el mismo.

   La restricción que gobierna todo, y de la que sale hasta cómo se dibuja:

        tengo(k+1) = sobra(k) · β(k+1)          den(k+1) = den(k) · β(k+1)

   donde den(k) es en cuántos trozos ha quedado partida UNA tortilla al llegar
   a la fase k. Los trozos de la fase siguiente son β veces menores, y por eso
   hay β veces más. Escrito en la caja de la división, eso es «bajar un cero»
   —en base β, literalmente un cero—.

   Consecuencia para el dibujo, que es lo que hace que β=100 se pueda ver: en
   la fase k lo que hay sobre la mesa son tengo(k) trozos de tamaño 1/den(k),
   o sea tengo(k)/den(k) TORTILLAS. Se dibujan siempre tortillas enteras
   partidas en den(k) trozos —nunca más de a tortillas, sea cual sea la
   fase—, y solo cuando los trozos bajan de dos píxeles se pasa a mirarlos de
   cerca con la lupa. Partir dos veces seguidas sin repartir nada tiene que
   dejar las mismas tortillas partidas en 100, no diez veces más tortillas.

   Y la cota de las cifras, que es lo que se descubre dando de menos a
   propósito: si en todas las fases se da lo máximo, tengo(k) = β·sobra(k-1) ≤
   β(b-1) < β·b, luego la cifra floor(tengo/b) es menor que β. Solo si en
   alguna fase se da menos aparece una cifra que no cabe en la base.
   ========================================================================= */
var MAXF=40;               /* fases como mucho, para que nada se dispare     */
var MAXDISC=24;            /* tortillas que se pintan antes de resumir       */
var MAXPLATO=24;           /* platos que se pintan antes de resumir          */
var MINCEL=2.0;            /* píxeles mínimos de un trozo para dibujarlo     */

var CTOR={f:'#f4cf72', b:'#c99a2b'};        /* tortilla                      */
var CDADA={f:'#eceae4', b:'#d3cfc4'};       /* trozo ya entregado            */
var CVACIO={f:'#fbfbfa', b:'#e6e4de'};      /* hueco: trozo que ya no está   */
var CPLATO={f:'#ffffff', b:'#c8ccd3'};      /* el plato                      */

/* =========================================================================
   2. ESTADO
   fases[k] = {tengo, doy, base, den}
     tengo  trozos que hay al empezar la fase, contados en trozos de esa fase
     doy    trozos que recibe CADA persona en la fase (la cifra)
     base   en cuántas partes se partió lo que sobraba de la fase anterior
     den    en cuántos trozos ha quedado partida una tortilla (producto de las
            bases); el tamaño de un trozo de la fase es 1/den
   ========================================================================= */
var A=3, B=4, BASE=10;
var modo='fases';                 /* 'libre' | 'fases'                       */
var forma='redonda';              /* 'redonda' | 'cuadrada'                  */
var fases=[];
var view={x:0,y:0,z:1};
var opt={tabla:1, tam:0, caja:1, cuentas:0, lupa:1};
var undoStack=[], drag=null, faseHL=null;

var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var stage=document.getElementById('stage');
var hintEl=document.getElementById('hint'), infoEl=document.getElementById('info');
var dropEl=document.getElementById('drop');
var flashMsg=null, flashT=0;

function s2w(p){ return {x:(p.x-view.x)/view.z, y:(p.y-view.y)/view.z}; }
function flash(m){ flashMsg=m; flashT=Date.now(); pinta(); setTimeout(pinta,2600); }
function pushUndo(){
  undoStack.push(JSON.stringify({A:A,B:B,BASE:BASE,modo:modo,fases:fases}));
  if(undoStack.length>90) undoStack.shift();
}
function doUndo(){
  if(!undoStack.length){ flash('No hay nada que deshacer'); return; }
  var d=JSON.parse(undoStack.pop());
  A=d.A; B=d.B; BASE=d.BASE; modo=d.modo; fases=d.fases;
  sincronizaEntradas(); pinta();
}

/* =========================================================================
   3. ARITMÉTICA Y ESCRITURA EN BASE β
   Todo son enteros. La única sutileza es cómo se escribe una cifra cuando la
   base pasa de 10: hasta 36 valen las letras; por encima no hay símbolos, así
   que las cifras se escriben en decimal separadas por un punto volado, que es
   lo que se hace de verdad con las bases grandes.
   ========================================================================= */
function mcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ var t=a%b; a=b; b=t; } return a; }
/* la base con la que se escribe: la común a todas las fases hechas, y si
   todavía no hay ninguna, la que está puesta en el panel */
function baseUnif(){
  var i, u=null;
  for(i=1;i<fases.length;i++){
    if(u===null) u=fases[i].base;
    else if(fases[i].base!==u) return null;
  }
  return u===null ? BASE : u;
}
function bt(){ return baseUnif() || BASE; }
function enBase(n,e){
  e=e||bt();
  var d=[];
  if(n===0) return [0];
  while(n>0){ d.unshift(n%e); n=Math.floor(n/e); }
  return d;
}
function cifra(v,e){
  e=e||bt();
  if(e<=10) return String(v);
  if(e<=36) return v<10 ? String(v) : String.fromCharCode(55+v);
  return String(v);
}
function junta(arr,e){ return arr.join((e||bt())<=36 ? '' : '·'); }
function textoBase(n,e){ e=e||bt(); return junta(enBase(n,e).map(function(v){ return cifra(v,e); }),e); }
var SUP='⁰¹²³⁴⁵⁶⁷⁸⁹';
function sup(k){ var t=String(k), r='', i; for(i=0;i<t.length;i++) r+=SUP.charAt(+t.charAt(i)); return r; }
/* El tamaño de los trozos de la fase k, tal y como se escribe entre corchetes.
   Con fases iguales se escribe como potencia —1/10², que es la notación de la
   R.P.D.—; con fases libres, con el denominador a secas, porque partir en dos
   y luego en tres da sextos, no «medios al cuadrado». */
function expo(k){ return modo==='fases' && baseUnif(); }
function uni(k){
  if(k===0) return '1';
  var u=expo(k);
  if(u) return '1/'+u+(k>1?sup(k):'');
  return isFinite(fases[k].den) ? '1/'+fases[k].den : '1/…';
}
function uniHTML(k){
  if(k===0) return '1';
  var u=expo(k);
  if(u) return '1/'+u+(k>1?'<sup>'+k+'</sup>':'');
  return isFinite(fases[k].den) ? '1/'+fases[k].den : '1/…';
}

/* =========================================================================
   4. EL MOTOR DEL REPARTO
   fases[k] guarda solo lo que hay y lo que se decide dar; lo que se da en
   total y lo que sobra son cuentas, y se calculan.
   ========================================================================= */
function nuevoReparto(){ fases=[{tengo:A, doy:0, base:1, den:1}]; }
function totalDe(k){ return fases[k].doy*B; }
function sobraDe(k){ return fases[k].tengo - fases[k].doy*B; }
function maxDoy(k){ return B>0 ? Math.floor(fases[k].tengo/B) : 0; }
function ultima(){ return fases.length-1; }
function hayReparto(){ return B>0 && fases.length>0; }
function terminado(){ return hayReparto() && sobraDe(ultima())===0; }

function darUno(){
  if(B<1){ flash('Entre 0 personas no se puede empezar el reparto'); return; }
  var k=ultima();
  if(sobraDe(k)<B){
    flash('Quedan '+sobraDe(k)+' trozos y hay '+B+' personas: no llega a uno para cada una');
    return;
  }
  pushUndo(); fases[k].doy++; pinta();
}
function darTodo(){
  if(B<1){ flash('Entre 0 personas no se puede empezar el reparto'); return; }
  var k=ultima();
  if(fases[k].doy===maxDoy(k)){ flash('Ya has dado todo lo que se podía en esta fase'); return; }
  pushUndo(); fases[k].doy=maxDoy(k); pinta();
}
/* partir lo que sobra en n partes iguales: es la que abre la fase siguiente */
function nuevaFase(n){
  if(B<1) return;
  n=n||BASE;
  var k=ultima();
  if(sobraDe(k)===0){ flash('No sobra nada: el reparto se ha terminado'); return; }
  if(fases.length>=MAXF){ flash('Ya van '+MAXF+' fases; con eso hay de sobra para ver lo que pasa'); return; }
  pushUndo();
  empuja(n);
  pinta();
}
function empuja(n){
  var k=ultima(), d=fases[k].den*n;
  if(!isFinite(d) || d>1e15) d=Infinity;
  fases.push({tengo:sobraDe(k)*n, doy:0, base:n, den:d});
}
function faseEntera(){
  if(B<1) return;
  var k=ultima();
  if(fases[k].doy<maxDoy(k)) darTodo(); else { nuevaFase(BASE); darTodo(); }
}
function quitaFase(){
  if(fases.length<2){ flash('Solo queda la primera fase'); return; }
  pushUndo(); fases.pop(); pinta();
}
function hastaElFinal(){
  if(B<1){ flash('Entre 0 personas no se puede empezar el reparto'); return; }
  pushUndo();
  var n=0;
  while(n++<MAXF){
    fases[ultima()].doy=maxDoy(ultima());
    if(sobraDe(ultima())===0) break;
    if(repeticion()) break;
    if(fases.length>=MAXF) break;
    empuja(BASE);
  }
  pinta();
}
function ponDoy(k,d){
  if(k<0 || k>=fases.length) return;
  var m=maxDoy(k);
  if(d>m){
    flash('En esa fase tienes '+fases[k].tengo+' trozos para '+B+' personas: no dan para '+d+
          ' a cada una');
    d=m;
  }
  if(d<0) d=0;
  pushUndo();
  fases.length=k+1;
  fases[k].doy=d;
  pinta();
}
/* ¿vuelve a salir un sobrante ya visto? Es lo que hace que el reparto no
   termine nunca. Se comparan los recuentos enteros: si sobra lo mismo y se
   parte en lo mismo, lo que viene detrás es lo que ya vino. */
function repeticion(){
  if(!baseUnif()) return null;
  var i,j;
  for(i=1;i<fases.length;i++){
    if(sobraDe(i)<=0) continue;
    for(j=0;j<i;j++) if(sobraDe(j)===sobraDe(i)) return {j:j, k:i};
  }
  return null;
}
function todoMaximo(){
  var i;
  for(i=0;i<fases.length;i++) if(fases[i].doy!==maxDoy(i)) return false;
  return true;
}
function cifraGrande(){   /* alguna cifra de fase ≥1 que no cabe en la base */
  var i, u=baseUnif();
  if(!u) return -1;
  for(i=1;i<fases.length;i++) if(fases[i].doy>=u) return i;
  return -1;
}
/* lo que lleva recibido cada persona, exacto */
function recibidoFrac(){
  var num=0, den=1, i;
  for(i=0;i<fases.length;i++){
    var d=fases[i].den;
    if(!isFinite(d)) return null;
    var g=mcd(den,d), l=den/g*d;
    num=num*(l/den)+fases[i].doy*(l/d);
    den=l;
    var g2=mcd(num,den)||1; num/=g2; den/=g2;
  }
  return {p:num, q:den};
}
function recibidoNum(){       /* lo mismo, aproximado, para dibujar */
  var s=0,i;
  for(i=0;i<fases.length;i++) if(isFinite(fases[i].den)) s+=fases[i].doy/fases[i].den;
  return s;
}
function textoFrac(f){ return !f ? '…' : (f.q===1 ? String(f.p) : (f.p+'/'+f.q)); }

/* =========================================================================
   5. DIBUJO
   Lo que hay sobre la mesa son tengo/den tortillas. Se dibujan tortillas
   enteras partidas en den trozos, con los ya entregados en gris y los huecos
   de los que ya no están en blanco. Cuando un trozo baja de dos píxeles ya no
   se puede dibujar así, y entonces —solo entonces— entra la lupa: se miran de
   cerca los trozos de la fase anterior, cada uno partido en los de esta.
   ========================================================================= */
function rejilla(n){
  var r=Math.floor(Math.sqrt(n));
  while(r>1 && n%r) r--;
  if(r<1) r=1;
  return {f:r, c:n/r};
}
/* Cuántas columnas para n cosas. Hasta ocho, en fila: la pantalla es ancha y
   así no queda una última fila con un solo plato suelto, que se lee fatal. */
function columnas(n){ return n<=8 ? Math.max(1,n) : Math.min(8, Math.ceil(n/3)); }
function radioPara(n){
  if(n<=2) return 92;
  if(n<=4) return 76;
  if(n<=9) return 58;
  if(n<=16) return 44;
  return 34;
}
/* tamaño en píxeles del trozo más pequeño, para saber si se puede dibujar */
function celdaPx(rad,cel){
  if(cel<=1) return rad;
  if(forma==='redonda') return 2*Math.PI*rad/cel;
  var g=rejilla(cel), L=rad*1.7;
  return Math.min(L/g.c, L/g.f);
}
/* La lupa mira un trozo de la fase anterior, aumentado y partido en los de
   esta. Un trozo NO es una tortilla, y dibujarlo redondo entero es justo lo que
   lo hace parecer una: si el trozo vino de partir en β' partes, su forma es un
   sector de 360/β', y eso es lo que hay que dibujar —una porción partida en β
   tajadas—. Cuando el sector de verdad es tan fino que sus tajadas no se verían
   (partir en 100, pongamos), se abre hasta que se vean: el rótulo dice de qué
   tamaño es el trozo, así que abrir el ángulo no engaña sobre el tamaño; solo
   deja ver los cortes, que es para lo que está la lupa. */
function cuantosLupa(nref,cel){
  return Math.max(1, Math.min(nref, MAXDISC, Math.floor(400/Math.max(1,cel))||1));
}
function geoLupa(k,n,cel,tengo,total){
  var rad=Math.max(110, Math.min(210, 560/Math.max(1,Math.ceil(Math.sqrt(n)))));
  var g={vista:'lupa', n:n, total:(total===undefined?n:total), cel:cel, rad:rad,
         k:k, tengo:tengo};
  if(forma==='cuadrada'){ g.minPx=celdaPx(rad,cel); return g; }
  var base1=(k>=2) ? fases[k-1].base : 1;
  var angTrue=(base1>1) ? 2*Math.PI/base1 : 2*Math.PI;
  g.ang=Math.min(2*Math.PI, Math.max(angTrue, cel*2.6/rad));
  g.abierto=(g.ang>angTrue+1e-9);
  g.minPx=g.ang*rad/cel;
  return g;
}
/* la tajada j de cel, dentro de una porción de ángulo ang con el vértice en (cx,cy) */
function caminoPorcion(c,cx,cy,rad,ang,j,cel){
  var a0=-ang/2+ang*j/cel, a1=-ang/2+ang*(j+1)/cel;
  c.beginPath();
  if(ang>=2*Math.PI-1e-9 && cel===1){ c.arc(cx,cy,rad,0,2*Math.PI); return; }
  c.moveTo(cx,cy); c.arc(cx,cy,rad,a0,a1); c.closePath();
}
/* lo que ocupa una porción de radio rad y ángulo ang, con el vértice en (0,0) */
function cajaPorcion(rad,ang){
  if(ang>Math.PI) return {x0:-rad, y0:-rad, x1:rad, y1:rad};
  var s=rad*Math.sin(ang/2);
  return {x0:0, y0:-s, x1:rad, y1:s};
}
function geoMesa(){
  var k=ultima();
  if(!hayReparto()) return null;
  var den=fases[k].den, tengo=fases[k].tengo, rad;
  var nd=isFinite(den) ? Math.ceil(tengo/den) : 0;      /* tortillas que ocupa */
  var nref=(k===0) ? A : sobraDe(k-1);                  /* trozos de la fase anterior */
  var partes=(k===0) ? 1 : fases[k].base;
  /* 1. lo natural: las tortillas enteras partidas en los trozos de esta fase */
  if(nd>=1){
    rad=radioPara(Math.min(nd,MAXDISC));
    if(!opt.lupa || celdaPx(rad,den)>=MINCEL)
      return {vista:'tortilla', n:Math.min(nd,MAXDISC), total:nd, cel:den, rad:rad, k:k,
              tengo:tengo, minPx:celdaPx(rad,den)};
  }
  /* 2. si los trozos ya no se ven ahí, y quedan pocos, se miran de cerca.
        Cuantas más partes, menos trozos se dibujan: la lupa está para ver cómo
        es UN trozo partido, y si se pintan doce a la vez las tajadas vuelven a
        quedarse en un píxel. Cuántos hay lo dice la tabla. */
  if(opt.lupa && nref<=12 && nref>=1)
    return geoLupa(k, cuantosLupa(nref,partes), partes, tengo, nref);
  /* 3. y si son muchos, más vale la tortilla entera aunque las divisiones ya
        no se dibujen: al menos se ve cuánta tortilla queda */
  if(nd>=1){
    rad=radioPara(Math.min(nd,MAXDISC));
    return {vista:'tortilla', n:Math.min(nd,MAXDISC), total:nd, cel:den, rad:rad, k:k,
            tengo:tengo, minPx:celdaPx(rad,den)};
  }
  return geoLupa(k, cuantosLupa(nref,partes), partes, tengo, nref);
}
function pintaCelda(c,cx,cy,rad,cel,i,C){
  c.fillStyle=C.f; c.strokeStyle=C.b;
  c.lineWidth=cel>60?0.4:(cel>16?0.7:1.1);
  c.beginPath();
  if(forma==='redonda'){
    if(cel<=1){ c.arc(cx,cy,rad,0,2*Math.PI); }
    else { c.moveTo(cx,cy); c.arc(cx,cy,rad,2*Math.PI*i/cel,2*Math.PI*(i+1)/cel); c.closePath(); }
  } else {
    var g=rejilla(cel), L=rad*1.7, w=L/g.c, h=L/g.f;
    c.rect(cx-L/2+(i%g.c)*w, cy-L/2+Math.floor(i/g.c)*h, w, h);
  }
  c.fill();
  if(celdaPx(rad,cel)>=2.6) c.stroke();
}
function contorno(c,cx,cy,rad){
  c.strokeStyle='#c9c5bb'; c.lineWidth=1.2;
  c.beginPath();
  if(forma==='redonda') c.arc(cx,cy,rad,0,2*Math.PI);
  else { var L=rad*1.7; c.rect(cx-L/2,cy-L/2,L,L); }
  c.stroke();
  marca(cx-rad,cy-rad,cx+rad,cy+rad);
}
/* El encuadre se lleva midiendo lo que de verdad se pinta, rótulos incluidos.
   Un rótulo largo —una R.P.D. de veinte sumandos— es más ancho que el dibujo,
   y si no se mide, «Ajustar» lo deja fuera de la pantalla. */
var bbox=null;
function marca(x0,y0,x1,y1){
  if(!bbox) bbox={x0:x0,y0:y0,x1:x1,y1:y1};
  else{
    if(x0<bbox.x0) bbox.x0=x0; if(y0<bbox.y0) bbox.y0=y0;
    if(x1>bbox.x1) bbox.x1=x1; if(y1>bbox.y1) bbox.y1=y1;
  }
}
function rotulo(c,txt,x,y,tam,col,al){
  tam=tam||12;
  c.fillStyle=col||'#6b727d';
  c.font=tam+'px -apple-system,Segoe UI,Roboto,sans-serif';
  c.textAlign=al||'left'; c.textBaseline='alphabetic';
  c.fillText(txt,x,y);
  var w=c.measureText(txt).width;
  var x0=(al==='center')? x-w/2 : x;
  marca(x0, y-tam, x0+w, y+tam*0.28);
}
/* lo que lleva cada persona, en una línea que quepa */
function resumenCorto(){
  var f=recibidoFrac(), t=f?textoFrac(f):null;
  if(t && t.length<=15) return t+' de tortilla';
  var u=baseUnif();
  if(u){
    var n=notacionHTML().replace(/<[^>]*>/g,'');
    if(n.length<=24) return n+' de tortilla';
  }
  return rpdTexto();
}
function pintaPlato(c,cx,cy,rad,n){
  c.fillStyle=CPLATO.f; c.strokeStyle=CPLATO.b; c.lineWidth=1.4;
  c.beginPath(); c.arc(cx,cy,rad,0,2*Math.PI); c.fill(); c.stroke();
  c.strokeStyle='#e7e9ed'; c.lineWidth=1;
  c.beginPath(); c.arc(cx,cy,rad*0.8,0,2*Math.PI); c.stroke();
  marca(cx-rad,cy-rad,cx+rad,cy+rad+16);
  if(n!==undefined){
    c.fillStyle='#a6acb6'; c.font='10.5px -apple-system,Segoe UI,Roboto,sans-serif';
    c.textAlign='center'; c.textBaseline='top';
    c.fillText(n, cx, cy+rad+4);
  }
}
/* lo que lleva una persona: tortillitas llenas hasta la cantidad recibida */
function pintaRecibido(c,cx,cy,rp,cant){
  if(cant<=0) return;
  var nt=Math.min(3, Math.max(1, Math.ceil(cant-1e-9)));
  var rr=Math.min(rp*0.52, rp*1.25/nt), i;
  for(i=0;i<nt;i++){
    var x=cx+((i)-(nt-1)/2)*(rr*2.15);
    var lleno=Math.max(0, Math.min(1, cant-i));
    contorno(c,x,cy,rr);
    if(lleno<=0) continue;
    c.fillStyle=CTOR.f; c.strokeStyle=CTOR.b; c.lineWidth=1;
    c.beginPath();
    if(forma==='redonda'){
      if(lleno>=1) c.arc(x,cy,rr,0,2*Math.PI);
      else { c.moveTo(x,cy); c.arc(x,cy,rr,-Math.PI/2,-Math.PI/2+2*Math.PI*lleno); c.closePath(); }
    } else {
      var L=rr*1.7;
      c.rect(x-L/2, cy+L/2-L*lleno, L, L*lleno);
    }
    c.fill(); c.stroke();
  }
  if(cant>3){
    c.fillStyle='#6b727d'; c.font='10px -apple-system,Segoe UI,Roboto,sans-serif';
    c.textAlign='center'; c.textBaseline='top';
    c.fillText('de '+(Math.round(cant*100)/100).toString().replace('.',','), cx, cy+rp*0.62);
  }
}
function dibujaTodo(c){
  bbox=null;
  if(B<1){
    rotulo(c,'Repartir '+A+(A===1?' tortilla':' tortillas')+' entre 0 personas',0,0,15,'#3d4450');
    rotulo(c,'El proceso no se puede ni empezar: no hay entre quiénes repartir,',0,24,12.5,'#8a6d3b');
    rotulo(c,'así que el reparto no tiene resultado.',0,42,12.5,'#8a6d3b');
    return;
  }
  var g=geoMesa(), k=g.k, i, j, gi;
  var dadas=fases[k].doy*B;
  var porciones=(g.vista==='lupa' && forma==='redonda' && g.ang<2*Math.PI-1e-9);
  var col=porciones ? Math.min(6,columnas(g.n)) : columnas(g.n);

  /* rótulo de la fase */
  var enc=(k+1)+'ª fase';
  if(k>0) enc+=' · trozos de '+uni(k)+' de tortilla';
  else enc+=' · tortillas enteras';
  rotulo(c,enc,0,-16,13.5,'#3d4450');
  if(g.vista==='lupa')
    rotulo(c,'con lupa: '+(g.n===1?'este es un trozo':'cada uno de estos es un trozo')+' de '+
           uni(k-1)+', partido en '+g.cel+(g.abierto?' · el trozo va abierto para que se vean los cortes':''),
           0,-1,11.5,'#8a919c');

  /* la mesa */
  var y0=g.vista==='lupa'?16:6, filas, yFin;
  if(porciones){
    /* porciones: el trozo con su forma de tajada, no un círculo entero */
    var bb=cajaPorcion(g.rad,g.ang);
    var pasoX=(bb.x1-bb.x0)+22, pasoY=(bb.y1-bb.y0)+22;
    for(i=0;i<g.n;i++){
      var px=(i%col)*pasoX-bb.x0, py=y0+Math.floor(i/col)*pasoY-bb.y0;
      for(j=0;j<g.cel;j++){
        gi=i*g.cel+j;
        if(gi>=g.tengo) continue;
        var C=(gi<dadas)?CDADA:CTOR;
        caminoPorcion(c,px,py,g.rad,g.ang,j,g.cel);
        c.fillStyle=C.f; c.strokeStyle=C.b; c.lineWidth=g.minPx>6?1:0.6;
        c.fill(); if(g.minPx>=2.6) c.stroke();
      }
      caminoPorcion(c,px,py,g.rad,g.ang,0,1);
      c.strokeStyle='#c9c5bb'; c.lineWidth=1.3; c.stroke();
      marca(px+bb.x0,py+bb.y0,px+bb.x1,py+bb.y1);
    }
    filas=Math.ceil(g.n/col); yFin=y0+filas*pasoY;
  } else {
    /* el paso va con el ancho real: la cuadrada mide 1,7·r de lado, no 2·r */
    var paso=(forma==='redonda'?2*g.rad:1.7*g.rad)+Math.max(12, g.rad*0.28);
    for(i=0;i<g.n;i++){
      var cx=(i%col)*paso+g.rad, cy=y0+Math.floor(i/col)*paso+g.rad;
      contorno(c,cx,cy,g.rad);
      if(g.minPx<1.2 && g.cel>1){
        /* los trozos ya no se ven: se pinta lo que queda, sin las divisiones */
        var q=Math.max(0, Math.min(1, (g.tengo-dadas-i*g.cel)/g.cel));
        if(q>0){
          c.fillStyle=CTOR.f; c.strokeStyle=CTOR.b; c.lineWidth=1;
          c.beginPath();
          if(forma==='redonda'){
            if(q>=1) c.arc(cx,cy,g.rad,0,2*Math.PI);
            else { c.moveTo(cx,cy); c.arc(cx,cy,g.rad,-Math.PI/2,-Math.PI/2+2*Math.PI*q); c.closePath(); }
          } else { var L=g.rad*1.7; c.rect(cx-L/2, cy+L/2-L*q, L, L*q); }
          c.fill(); c.stroke();
        }
        continue;
      }
      for(j=0;j<g.cel;j++){
        gi=i*g.cel+j;
        if(gi>=g.tengo) continue;                     /* trozo que ya no está */
        pintaCelda(c,cx,cy,g.rad,g.cel,j, gi<dadas?CDADA:CTOR);
      }
    }
    filas=Math.ceil(g.n/col); yFin=y0+filas*paso;
  }
  if(g.total>g.n){
    rotulo(c,'… y '+(g.total-g.n)+' más como '+(g.vista==='lupa'?'estos':'estas'),0,yFin+13,11.5,'#8a919c');
    yFin+=16;
  }
  var res='Tengo '+fases[k].tengo+' trozos de '+uni(k)+' · doy '+fases[k].doy+
          ' a cada una de las '+B+' personas · sobran '+sobraDe(k);
  rotulo(c,res,0,yFin+16,12.5,'#6b727d');

  /* los platos */
  var yP=yFin+38, rp=46;
  var np=Math.min(B,MAXPLATO), colp=columnas(np);
  var pasoP=2*rp+22, cant=recibidoNum();
  for(i=0;i<np;i++){
    var px=(i%colp)*pasoP+rp, py=yP+Math.floor(i/colp)*(pasoP+16)+rp;
    pintaPlato(c,px,py,rp,String(i+1));
    pintaRecibido(c,px,py,rp,cant);
  }
  var filasP=Math.ceil(np/colp), yy=yP+filasP*(pasoP+16);
  if(B>np){ rotulo(c,'… y '+(B-np)+' personas más, cada una con lo mismo',0,yy+2,11.5,'#8a919c'); yy+=16; }
  rotulo(c,'Cada persona lleva ya '+resumenCorto(),0,yy+8,12.5,'#3d4450');
}
function pinta(){
  var r=stage.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  /* El lienzo se ajusta aquí y no solo al redimensionar la ventana: la tabla
     cambia de alto al añadir fases, el tablero se encoge, y si el mapa de bits
     se queda con el tamaño viejo, la franja de abajo conserva pintado el
     fotograma anterior —clearRect solo llega hasta el alto nuevo—. */
  var W=Math.max(1,Math.round(r.width*dpr)), H=Math.max(1,Math.round(r.height*dpr));
  if(cv.width!==W || cv.height!==H){ cv.width=W; cv.height=H; }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,r.width,r.height);
  ctx.save();
  ctx.translate(view.x,view.y); ctx.scale(view.z,view.z);
  dibujaTodo(ctx);
  ctx.restore();
  actualizaUI();
}
/* lo que ocupa de verdad el último dibujo, medido mientras se pintaba */
function cajaTodo(){
  if(!bbox) return {x0:-10,y0:-34,x1:420,y1:120};
  return {x0:bbox.x0-8, y0:bbox.y0-8, x1:bbox.x1+8, y1:bbox.y1+8};
}
function fitView(){
  var r=stage.getBoundingClientRect(), m=18;
  pinta();                                   /* primero se pinta, para medir */
  var b=cajaTodo();
  var z=Math.min((r.width-2*m)/Math.max(1,b.x1-b.x0), (r.height-2*m)/Math.max(1,b.y1-b.y0));
  view.z=Math.max(0.12,Math.min(1.4,z));
  view.x=r.width/2-((b.x0+b.x1)/2)*view.z;
  view.y=r.height/2-((b.y0+b.y1)/2)*view.z;
  pinta();
}

/* =========================================================================
   6. INTERACCIÓN
   No hay piezas que arrastrar: las acciones son las de la técnica de reparto
   —dar y partir—, y el ratón solo mueve el tablero.
   ========================================================================= */
function pos(e){ var r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
cv.addEventListener('pointerdown',function(e){
  drag={x:e.clientX, y:e.clientY, vx:view.x, vy:view.y};
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
});
cv.addEventListener('pointermove',function(e){
  if(!drag) return;
  view.x=drag.vx+(e.clientX-drag.x); view.y=drag.vy+(e.clientY-drag.y);
  pinta();
});
cv.addEventListener('pointerup',function(){ drag=null; });
cv.addEventListener('pointercancel',function(){ drag=null; });
cv.addEventListener('wheel',function(e){
  e.preventDefault();
  var P=pos(e), w=s2w(P);
  view.z=Math.max(0.12,Math.min(3.5,view.z*(e.deltaY<0?1.11:1/1.11)));
  view.x=P.x-w.x*view.z; view.y=P.y-w.y*view.z;
  pinta();
},{passive:false});
function zoomAt(k){
  var r=stage.getBoundingClientRect(), c={x:r.width/2,y:r.height/2}, w=s2w(c);
  view.z=Math.max(0.12,Math.min(3.5,view.z*k));
  view.x=c.x-w.x*view.z; view.y=c.y-w.y*view.z;
  pinta();
}
document.getElementById('fit').addEventListener('click',fitView);
document.getElementById('zoomin').addEventListener('click',function(){ zoomAt(1.18); });
document.getElementById('zoomout').addEventListener('click',function(){ zoomAt(1/1.18); });
document.getElementById('undo').addEventListener('click',doUndo);
document.addEventListener('keydown',function(e){
  if(e.target && /input|textarea|select/i.test(e.target.tagName)) return;
  var k=(e.key||'').toLowerCase();
  if((e.ctrlKey||e.metaKey) && k==='z'){ e.preventDefault(); doUndo(); return; }
  if(k==='d') darUno();
  else if(k==='a') darTodo();
  else if(k==='p') nuevaFase(BASE);
  else if(k==='f') faseEntera();
  else if(k==='g') hastaElFinal();
});

/* =========================================================================
   7. LOS PAPELES: LA R.P.D., LA TABLA Y LA CAJA
   La tabla no es un adorno: se escribe en ella. Cambiar «lo que doy a cada
   uno» de una fase rehace el reparto desde ahí, porque todo lo que viene
   después dependía de esa decisión.
   ========================================================================= */
function rpdTexto(){
  if(!hayReparto()) return '—';
  var s='', i;
  for(i=0;i<fases.length;i++) s+=(i?' + ':'')+fases[i].doy+'['+uni(i)+']';
  if(!terminado()) s+=' + …';
  return s;
}
function rpdHTML(){
  if(!hayReparto()) return '—';
  var s='', i;
  for(i=0;i<fases.length;i++) s+=(i?' + ':'')+fases[i].doy+'['+uniHTML(i)+']';
  if(!terminado()) s+=' + …';
  return s;
}
/* la notación posicional pide que todas las fases partan en lo mismo: es lo
   que hace que las cifras se puedan poner una detrás de otra */
function notacionHTML(){
  if(!hayReparto()) return '—';
  var u=baseUnif();
  if(!u) return '<span style="color:#8a919c">las fases no parten todas en el mismo número, '+
                'así que las cifras no se pueden escribir seguidas</span>';
  var rep=repeticion(), maxi=todoMaximo(), i;
  var s=textoBase(fases[0].doy,u)+',';
  var decs=[];
  for(i=1;i<fases.length;i++) decs.push(fases[i].doy<u ? cifra(fases[i].doy,u) : '⟨'+fases[i].doy+'⟩');
  var jj=(rep&&maxi)?rep.j:-1, kk=(rep&&maxi)?rep.k:-1, out='';
  for(i=0;i<decs.length;i++){
    var f=i+1, d=decs[i]+(u>36 && i<decs.length-1 ? '·' : '');
    if(jj>=0 && f>=jj+1 && f<=kk) out+='<span class="arc">'+d+'</span>';
    else out+=d;
  }
  if(!decs.length) out='0';
  s+=out;
  if(!terminado() && !(rep&&maxi)) s+='…';
  return s;
}
function fraccionHTML(){
  if(B<1) return '<span style="color:#8a6d3b">no existe: no se puede repartir entre 0 personas</span>';
  var g=mcd(A,B)||1, s=A+'/'+B;
  if(g>1) s+=' <span style="color:#8a919c">= '+(A/g)+'/'+(B/g)+'</span>';
  return s;
}

/* --- la caja ------------------------------------------------------------------
   Se monta como una rejilla de celdas de un carácter, que es la única forma de
   que cada resta quede debajo de lo que le toca. La columna 0 se reserva para
   el signo menos. Cada celda lleva su fase, y por eso se puede encender a la
   vez la fila de la tabla y los números de la caja que salen de ella.       */
function construyeCaja(){
  if(!hayReparto()) return null;
  var u=baseUnif();
  if(!u) return {sinBase:1};
  var C={cel:[], filas:1, cols:1, coc:[], nota:'', base:u};
  var dig=enBase(A,u), n=dig.length, i;
  function pon(f,c,t,tipo,fase,bar){
    if(c<0) return;
    C.cel.push({f:f,c:c,t:t,tipo:tipo,fase:fase,bar:bar?1:0});
    if(f+1>C.filas) C.filas=f+1;
    if(c+1>C.cols) C.cols=c+1;
  }
  function ponNum(f,cf,val,tipo,fase,signo){
    var d=enBase(val,u), j;
    for(j=0;j<d.length;j++) pon(f, cf-d.length+1+j, cifra(d[j],u), tipo, fase, tipo==='prod');
    if(signo) pon(f, cf-d.length, '−', 'sig', fase, true);
  }
  for(i=0;i<n;i++) pon(0, i+1, cifra(dig[i],u), 'dvd', 0, false);

  var fila=0, r=0, cocInt=[];
  if(fases[0].doy!==maxDoy(0)){
    /* si no se dan todas las tortillas enteras que se podría, la caja no puede
       ir cifra a cifra: la primera fase se escribe de un tirón */
    var q0=fases[0].doy;
    cocInt=[textoBase(q0,u)];
    if(q0>0){ ponNum(1,n,q0*B,'prod',0,true); ponNum(2,n,A-q0*B,'rest',0,false); fila=2; }
    r=A-q0*B;
    C.nota='En la primera fase no se reparten todas las tortillas enteras que se podría, '+
           'así que la caja no puede ir cifra a cifra: esa fase se escribe entera.';
  } else {
    var empez=false;
    for(i=0;i<n;i++){
      if(fila>0) pon(fila, i+1, cifra(dig[i],u), 'baja', 0, false);
      var v=r*u+dig[i], q=Math.floor(v/B);
      if(!empez && q===0){ r=v; continue; }
      empez=true;
      cocInt.push(cifra(q,u));
      if(q===0){ r=v; continue; }
      ponNum(fila+1, i+1, q*B, 'prod', 0, true);
      r=v-q*B;
      ponNum(fila+2, i+1, r, 'rest', 0, false);
      fila+=2;
    }
    if(!cocInt.length) cocInt=['0'];
  }
  var col=n+1, k;
  for(k=1;k<fases.length;k++){
    pon(fila, col, '0', 'cero', k, false);
    var vv=fases[k].tengo, qq=fases[k].doy;
    C.coc.push({t:(qq<u?cifra(qq,u):'⟨'+qq+'⟩'), fase:k});
    if(qq!==0){
      ponNum(fila+1, col, qq*B, 'prod', k, true);
      ponNum(fila+2, col, vv-qq*B, 'rest', k, false);
      fila+=2;
    }
    col++;
  }
  C.cocInt=junta(cocInt,u);
  C.divisor=textoBase(B,u);
  return C;
}
function pintaCaja(){
  var e=document.getElementById('caja'), av=document.getElementById('avisoCaja');
  var C=construyeCaja();
  if(!C){ e.innerHTML='<div class="nota">Sin personas entre las que repartir no hay división que hacer.</div>';
          av.innerHTML=''; return; }
  if(C.sinBase){
    e.innerHTML='<div class="nota">La división en caja va con una base fija: cada paso baja un cero, '+
                'que es partir en esa misma cantidad. Si cada fase parte en un número distinto, '+
                'el reparto es igual de bueno pero no se puede colocar en caja.</div>';
    av.innerHTML=''; return;
  }
  var rep=repeticion(), maxi=todoMaximo(), i;
  /* Con base mayor que 36 no hay símbolo para cada cifra y hay que escribirlas
     en decimal: «6» y «88» seguidas se leerían 688, así que las columnas se
     ensanchan y se rayan para que se vea dónde acaba cada cifra. */
  var anch=(C.base>36) ? String(C.base-1).length : 1;
  var ancho=(anch*0.62+0.26).toFixed(2)+'em';
  var rayas=(anch>1)
    ? ';background:repeating-linear-gradient(to left,transparent 0,transparent calc('+ancho+
      ' - 1px),#e4e7ec calc('+ancho+' - 1px),#e4e7ec '+ancho+')'
    : '';
  var h='<div class="cajabox"><div class="cajagr" style="grid-template-columns:repeat('+C.cols+
        ','+ancho+');grid-auto-rows:1.55em'+rayas+'">';
  for(i=0;i<C.cel.length;i++){
    var q=C.cel[i];
    h+='<span style="grid-row:'+(q.f+1)+';grid-column:'+(q.c+1)+'" data-fase="'+q.fase+'"'+
       (q.bar?' class="bar"':'')+'>'+q.t+'</span>';
  }
  h+='</div><div class="cajader"><div class="dvs">'+C.divisor+'</div><div class="coc">'+
     '<span data-fase="0">'+C.cocInt+'</span>';
  if(C.coc.length) h+='<span>,</span>';
  var jj=(rep&&maxi)?rep.j:-1, kk=(rep&&maxi)?rep.k:-1;
  for(i=0;i<C.coc.length;i++){
    var f=C.coc[i].fase, per=(jj>=0 && f>=jj+1 && f<=kk);
    h+='<span data-fase="'+f+'"'+(per?' class="arc"':'')+'>'+C.coc[i].t+
       (C.base>36&&i<C.coc.length-1?'·':'')+'</span>';
  }
  h+='</div></div></div>';
  e.innerHTML=h;
  var a='';
  if(C.nota) a+='<div>'+C.nota+'</div>';
  if(C.base!==10) a+='<div>Los números están escritos en base '+C.base+
                     ', y por eso «bajar un cero» sigue siendo bajar un cero.</div>';
  av.innerHTML=a;
}
/* --- copiar los papeles para pegarlos en un documento -------------------------
   Se copia una SELECCIÓN DE DOM, no una cadena: copiando así, el navegador pone
   en el portapapeles la versión HTML y la de texto a la vez, y Word recibe una
   tabla de verdad con sus celdas en vez de un párrafo con tabuladores. Y
   funciona con el archivo abierto desde un USB, sin servidor ni permisos, que
   es donde acaban estas cosas.
   La caja va también en una tabla, pero sin bordes salvo los que se ven: la
   raya de cada resta y la de la caja. Es la única manera de que las restas
   sigan cayendo debajo de lo que les toca cuando el documento cambia de letra. */
function copiaHTML(html){
  var div=document.createElement('div');
  div.setAttribute('style','position:fixed;left:-10000px;top:0');
  div.innerHTML=html;
  document.body.appendChild(div);
  var sel=window.getSelection(), ran=document.createRange(), ok=false;
  ran.selectNodeContents(div);
  sel.removeAllRanges(); sel.addRange(ran);
  try{ ok=document.execCommand('copy'); }catch(err){ ok=false; }
  sel.removeAllRanges();
  document.body.removeChild(div);
  return ok;
}

function cocienteHTML(C){

function cajaParaPegar(){
  var C=construyeCaja();
  if(!C || C.sinBase) return null;
  var m={}, i, f, c;
  for(i=0;i<C.cel.length;i++) m[C.cel[i].f+','+C.cel[i].c]=C.cel[i];
  var filas=Math.max(C.filas,2);
  var mono='font-family:Consolas,\'Courier New\',monospace;font-size:11pt';
  var der='border-left:1px solid #000;padding:0 8px;text-align:left;';
  var h='<table style="border-collapse:collapse;'+mono+'">';
  for(f=0;f<filas;f++){
    h+='<tr>';
    for(c=0;c<C.cols;c++){
      var q=m[f+','+c];
      h+='<td style="padding:0 3px;text-align:right;'+
         (q&&q.bar?'border-bottom:1px solid #000;':'')+'">'+(q?q.t:'&nbsp;')+'</td>';

    if(f===0) h+='<td style="'+der+'border-bottom:1px solid #000">'+C.divisor+'</td>';
    else if(f===1) h+='<td style="'+der+'">'+cocienteHTML(C)+'</td>';
    else h+='<td style="'+der+'">&nbsp;</td>';
    h+='</tr>';
  }
  return h+'</table>';
}

/* resaltado cruzado: al pasar por una fila de la tabla se encienden los
   números de la caja que salen de ella, y al revés */
function resalta(f){
  faseHL=f;
  var todos=document.querySelectorAll('#docs [data-fase]'), i;
  for(i=0;i<todos.length;i++){
    var el=todos[i], on=(f!==null && +el.getAttribute('data-fase')===f);
    if(el.tagName==='TR'){ el.className=on?'hl':''; continue; }
    var cls=el.className.replace(/\bhl\b/g,'').replace(/\s+/g,' ').replace(/^ | $/g,'');
    el.className=cls+(on?(cls?' ':'')+'hl':'');
  }
}
var docsEl=document.getElementById('docs');
docsEl.addEventListener('mouseover',function(e){
  var el=e.target, f=null;
  while(el && el!==this){
    if(el.getAttribute && el.getAttribute('data-fase')!==null){ f=+el.getAttribute('data-fase'); break; }
    el=el.parentNode;
  }
  if(f!==faseHL) resalta(f);
});
docsEl.addEventListener('mouseleave',function(){ resalta(null); });
docsEl.addEventListener('change',function(e){
  if(e.target && e.target.tagName==='INPUT' && e.target.getAttribute('data-fase')!==null){
    var k=+e.target.getAttribute('data-fase'), v=Math.round(Number(e.target.value));
    if(!isFinite(v)) v=0;
    ponDoy(k,v);
  }
});

  r.readAsText(f);

function entero(v){ var n=Number(v); return isFinite(n)&&Math.round(n)===n ? n : null; }
function limpiaFases(lista,b,a){
  if(!Array.isArray(lista) || !lista.length || lista.length>MAXF) return null;
  var out=[], i, esperado=a, den=1;
  for(i=0;i<lista.length;i++){
    var t=entero(lista[i].tengo), d=entero(lista[i].doy), n=entero(lista[i].base);
    if(t===null||d===null||n===null||t<0||d<0) return null;
    if(i===0 ? n!==1 : (n<2||n>100)) return null;
    if(t!==esperado) return null;                 /* la cadena tiene que encajar */
    if(b>0 && d*b>t) return null;                 /* no se puede dar lo que no hay */
    if(i>0){ den=den*n; if(!isFinite(den)||den>1e15) den=Infinity; }
    out.push({tengo:t, doy:d, base:n, den:den});
    if(i<lista.length-1){
      var sig=entero(lista[i+1].base);
      if(sig===null||sig<2||sig>100) return null;
      esperado=(t-d*b)*sig;
      if(esperado<=0) return null;
    }
  }
  return out;
}
function cargar(d){
  if(!d || d.formato!=='reparto-de-tortillas'){ flash('Ese archivo no es de este manipulativo'); return; }
  var a=entero(d.a), b=entero(d.b), base=entero(d.base);
  if(a===null||b===null||base===null||a<0||a>999||b<0||b>999||base<2||base>100){
    flash('Ese archivo trae condiciones iniciales que no valen'); return; }
  var nf=limpiaFases(d.fases,b,a);
  if(!nf){ flash('Ese archivo trae un reparto que no se sostiene'); return; }
  pushUndo();
  A=a; B=b; BASE=base; fases=nf;
  modo=(d.modo==='libre')?'libre':'fases';
  forma=(d.forma==='cuadrada')?'cuadrada':'redonda';
  sincronizaEntradas(); fitView();
  flash('Reparto ('+A+', '+B+') cargado');
}

  r=corre(9,4,10);
  ok('el reparto (9,4) da 2[1] + 2[1/10] + 5[1/10²]', r.rpd==='2[1] + 2[1/10] + 5[1/10²]', r.rpd);

  r=corre(65,32,10);

  ok('y por el camino hay una fase en la que no se da nada',

  r=corre(27,20,10);

     baseUnif()===null && notacionHTML().indexOf('no parten')>0, baseUnif());
  ok('ni división en caja', construyeCaja().sinBase===1, 'ok');
  ok('pero la tabla sigue estando', (pintaTabla(), document.querySelectorAll('#tabla tr').length===4),
     document.querySelectorAll('#tabla tr').length);
  /* con fases libres los tamaños se escriben con su denominador, no como potencia */
  A=3; B=4; nuevoReparto(); nuevaFase(2); darTodo(); nuevaFase(2); darTodo();
  ok('partir dos veces por la mitad son cuartos, no «medios al cuadrado»',
     rpdTexto()==='0[1] + 1[1/2] + 1[1/4]', rpdTexto());
  modo='fases';
  ok('y en cambio con fases iguales eso mismo se escribe como potencia',
     rpdTexto()==='0[1] + 1[1/2] + 1[1/2²]', rpdTexto());

  /* --- el fallo de partir dos veces seguidas --------------------------------------------------- */
  A=3; B=4; BASE=10; nuevoReparto();
  nuevaFase(10); nuevaFase(10);
  ok('partir dos veces sin repartir deja 300 trozos de 1/100',
     fases[2].tengo===300 && fases[2].den===100, fases[2].tengo+' de 1/'+fases[2].den);
  var g=geoMesa();
  ok('y se dibujan las 3 tortillas partidas en 100, no 30 tortillas partidas en 10',
     g.vista==='tortilla' && g.n===3 && g.cel===100, g.vista+' '+g.n+'×'+g.cel);
  nuevaFase(10);
  g=geoMesa();
  ok('a la tercera los trozos ya no se dibujan, pero se siguen viendo las 3 tortillas',
     g.vista==='tortilla' && g.n===3 && g.cel===1000 && g.minPx<1.2,
     g.vista+' '+g.n+'×'+g.cel+' a '+g.minPx.toFixed(2)+'px');
  opt.lupa=0;
  g=geoMesa();
  ok('y con la lupa apagada, igual', g.vista==='tortilla' && g.n===3, g.vista+' '+g.n);
  opt.lupa=1;
  /* la lupa entra cuando quedan pocos trozos y ya no caben en la tortilla */
  forma='redonda';
  A=1; B=7; BASE=10; nuevoReparto(); hastaElFinal();
  g=geoMesa();
  ok('en (1,7), ya muy adentro, se miran de cerca los pocos trozos que quedan',
     g.vista==='lupa' && g.n===sobraDe(fases.length-2) && g.n<=12, g.vista+' '+g.n+'×'+g.cel);
  ok('y lo que se dibuja es una porción, no una tortilla entera',
     Math.abs(g.ang-2*Math.PI/10)<1e-9 && !g.abierto,
     'ángulo '+(g.ang*180/Math.PI).toFixed(1)+'°');
  ok('la porción tiene la forma que le toca: viene de partir en 10, así que es un décimo',
     Math.abs(g.ang*10-2*Math.PI)<1e-9, (g.ang*180/Math.PI).toFixed(1)+'° × 10');
  ok('y sus diez tajadas se ven', g.minPx>=2.6, g.minPx.toFixed(1)+' px');
  /* partiendo en 100 la porción de verdad sería un pelo: se abre para que se vea */
  A=7; B=16; BASE=100; nuevoReparto(); hastaElFinal();
  g=geoMesa();
  ok('partiendo en 100 la porción se abre, y el material lo dice',
     g.vista==='lupa' && g.abierto && g.ang>2*Math.PI/100,
     (g.ang*180/Math.PI).toFixed(1)+'° en vez de '+(360/100)+'°');
  ok('abierta, sus cien tajadas se siguen viendo', g.minPx>=2.6, g.minPx.toFixed(1)+' px');
  ok('y se dibujan menos trozos, porque doce con cien tajadas cada uno no se ven',
     g.n<g.total && cuantosLupa(12,100)===4 && cuantosLupa(5,10)===5,
     g.n+' de '+g.total);
  /* en cuadrada no hace falta abrir nada: un trozo de la cuadrada es una celda */
  forma='cuadrada';
  g=geoMesa();
  ok('en la tortilla cuadrada la lupa no necesita abrir nada',
     g.vista==='lupa' && g.ang===undefined && g.minPx>=MINCEL, g.minPx.toFixed(1)+' px');
  forma='redonda';
  /* y cuando son muchos, más vale ver la tortilla aunque no se dibujen las rayas */
  A=700; B=333; BASE=10; nuevoReparto(); hastaElFinal();
  g=geoMesa();
  ok('en (700,333) se ve la tortilla que queda, no setenta trozos sueltos',
     g.vista==='tortilla' && g.n===1 && g.minPx<1.2, g.vista+' '+g.n+'×'+g.cel);
  /* muchas fases seguidas: el denominador se desborda y no debe romper nada */
  A=1; B=17; BASE=10; nuevoReparto(); hastaElFinal();
  g=geoMesa();
  ok('con dieciséis fases el tamaño del trozo ya no cabe en un entero, y aun así se dibuja',
     !!g && g.n>=1 && uni(fases.length-1)==='1/10'+sup(fases.length-1),
     'den='+fases[fases.length-1].den+' '+uni(fases.length-1));
  A=3; B=4; nuevoReparto(); nuevaFase(10); darTodo();
  g=geoMesa();
  ok('la mesa enseña las 3 tortillas en décimas, con las 28 entregadas en gris',
     g.n===3 && g.cel===10 && g.tengo===30 && fases[1].doy*B===28, g.n+'×'+g.cel+' con '+g.tengo);
  nuevaFase(10);
  g=geoMesa();
  ok('y al partirlo en 100 se dibuja una tortilla con solo 20 centésimas',
     g.vista==='tortilla' && g.n===1 && g.cel===100 && g.tengo===20, g.n+'×'+g.cel+' con '+g.tengo);

  /* --- otras bases ---------------------------------------------------------------------------- */
  r=corre(1,3,3);
  ok('partiendo en 3, el reparto (1,3) se acaba en dos fases y es 0,1',
     terminado() && fases.length===2 && r.dec==='0,1', r.dec);
  r=corre(3,4,2);
  ok('partiendo en 2, el reparto (3,4) da 0,11', r.dec==='0,11', r.dec);
  r=corre(1,3,2);
  ok('partiendo en 2, el reparto (1,3) no se acaba', !terminado(), r.dec);
  r=corre(7,16,100);
  ok('partiendo en 100, el reparto (7,16) se acaba en tres fases',
     terminado() && fases.length===3, fases.length);
  ok('y sus cifras son 0, 43 y 75',
     fases[0].doy===0 && fases[1].doy===43 && fases[2].doy===75, fases[1].doy+' '+fases[2].doy);
  ok('la notación en base 100 separa las cifras con un punto', r.dec==='0,43·75', r.dec);
  var g2=geoMesa();
  ok('y en base 100 la primera fase de trozos son cien celdas en la tortilla',
     (corre(7,16,100), fases.length>1), 'ok');
  A=7; B=16; BASE=100; nuevoReparto(); nuevaFase(100);
  g2=geoMesa();
  ok('con 7 tortillas partidas en 100 se dibujan las 7, no 700 trozos sueltos',
     g2.vista==='tortilla' && g2.n===7 && g2.cel===100, g2.vista+' '+g2.n+'×'+g2.cel);
  r=corre(11,16,16);
  ok('en base 16, (11,16) se escribe con la cifra B', r.dec==='0,B', r.dec);
  ok('y 45 en base 16 es 2D', textoBase(45,16)==='2D', textoBase(45,16));

  /* --- la finitud depende de la base, no del reparto ------------------------------------------- */
  function acaba(a,b,e){ corre(a,b,e); return terminado(); }
  ok('(1,3) no se acaba en base 10 pero sí en base 6', !acaba(1,3,10) && acaba(1,3,6), 'ok');
  ok('(1,5) se acaba en base 10 y no en base 3', acaba(1,5,10) && !acaba(1,5,3), 'ok');
  ok('(1,7) no se acaba en base 10 y sí en base 14', !acaba(1,7,10) && acaba(1,7,14), 'ok');
  ok('(3,6) se acaba, porque simplificado es (1,2)', acaba(3,6,10), 'ok');
  var r1=corre(14,11,10), r2=corre(56,44,10);
  ok('los repartos (14,11) y (56,44) tienen la misma R.P.D.', r1.rpd===r2.rpd, r1.rpd);
  var r3=corre(1,3,10), r4=corre(4,12,10);
  ok('y (1,3) y (4,12) también', r3.rpd===r4.rpd, r3.rpd);

  /* --- la caja de la división ------------------------------------------------------------------ */
  corre(27,20,10);
  var C=construyeCaja();
  ok('en la caja de 27:20 el cociente entero es 1 y las decimales son 3 y 5',
     C.cocInt==='1' && C.coc.map(function(x){return x.t;}).join('')==='35', C.cocInt);
  function restos(C){
    return C.cel.filter(function(q){ return q.tipo==='rest'; })
               .map(function(q){ return q.f+':'+q.c+':'+q.t; }).join(' ');
  }
  ok('los restos de la caja son 7, luego 10 —en dos columnas— y luego 0',
     restos(C)==='2:2:7 4:2:1 4:3:0 6:4:0', restos(C));
  ok('cada fase decimal baja un cero',
     C.cel.filter(function(q){ return q.tipo==='cero'; }).length===2, 'ok');
  ok('y todas las celdas saben de qué fase vienen',
     C.cel.every(function(q){ return q.fase>=0 && q.fase<fases.length; }), 'ok');
  A=250; B=3; BASE=10; nuevoReparto(); darTodo(); C=construyeCaja();
  ok('con cociente entero de dos cifras, la caja lo hace cifra a cifra', C.cocInt==='83', C.cocInt);
  ok('y esas dos cifras son la primera fila de la tabla', fases[0].doy===83, fases[0].doy);
  corre(3,8,10); C=construyeCaja();
  ok('cuando no hay parte entera, el cociente empieza por 0', C.cocInt==='0', C.cocInt);
  ok('y el primer cero se baja pegado al dividendo',
     C.cel.some(function(q){ return q.tipo==='cero' && q.f===0 && q.c===2; }), 'ok');
  corre(65,32,10); C=construyeCaja();
  ok('una fase en la que no se da nada pone un 0 en el cociente y no resta nada',
     C.coc[0].t==='0' && !C.cel.some(function(q){ return q.tipo==='prod' && q.fase===1; }), 'ok');
  A=27; B=20; BASE=10; nuevoReparto(); ponDoy(0,0); C=construyeCaja();
  ok('si no se dan todas las tortillas enteras que se puede, la caja lo avisa',
     C.nota.length>0 && C.cocInt==='0', C.cocInt);
  corre(700,333,10); C=construyeCaja();
  ok('la caja de 700:333 tiene cociente entero 2 y resto 34',
     C.cocInt==='2' && restos(C).indexOf('2:2:3 2:3:4')===0, C.cocInt+' '+restos(C).slice(0,12));
  corre(11,16,16); C=construyeCaja();
  ok('en base 16 el divisor 16 se escribe 10 y el cociente es 0,B',
     C.divisor==='10' && C.cocInt==='0' && C.coc[0].t==='B',
     C.divisor+' → '+C.cocInt+','+C.coc[0].t);
  corre(7,16,100); C=construyeCaja();
  ok('en base 100 el producto 43×16 son las cifras 6 y 88, en dos casillas',
     C.cel.filter(function(q){ return q.tipo==='prod' && q.fase===1; })
          .map(function(q){ return q.t; }).join('|')==='6|88',
     C.cel.filter(function(q){ return q.tipo==='prod'&&q.fase===1; }).map(function(q){return q.t;}).join('|'));
  pintaCaja();
  ok('y esas casillas se ensanchan y se rayan para que no se lean seguidas',
     /repeating-linear-gradient/.test(document.querySelector('#caja .cajagr').getAttribute('style')),
     'ok');

  /* --- copiar los papeles ---------------------------------------------------------------------- */
  corre(27,20,10);
  var cop=tablaParaPegar();
  ok('la tabla para pegar es una tabla de verdad, con su encabezado de fase',
     /^<table/.test(cop) && cop.indexOf('>Fase<')>0 && cop.indexOf('Lo que sobra')>0, 'ok');
  ok('y trae una fila por fase más la de los títulos',
     cop.split('<tr>').length-1===fases.length+1, (cop.split('<tr>').length-1)+' filas');
  ok('con los números y su tamaño', cop.indexOf('70 [1/10]')>0, 'ok');
  opt.tam=1; cop=tablaParaPegar(); opt.tam=0;
  ok('y con la columna de tamaño encendida, el tamaño va en su columna',
     cop.indexOf('Tamaño de los trozos')>0 && cop.indexOf('70 [1/10]')<0, 'ok');
  var cc=cajaParaPegar();
  ok('la caja para pegar lleva el divisor, el cociente y la letra de máquina',
     /^<table/.test(cc) && cc.indexOf('monospace')>0 && cc.indexOf('>20<')>0 && cc.indexOf('1,35')>0,
     'ok');
  ok('y las rayas de las restas van como bordes de celda',
     (cc.match(/border-bottom:1px solid #000/g)||[]).length>=3,
     (cc.match(/border-bottom:1px solid #000/g)||[]).length+' rayas');
  corre(2,7,10); cc=cajaParaPegar();
  ok('el arco del período viaja con el cociente', cc.indexOf('border-top:1px solid #000')>0, 'ok');
  A=5; B=3; BASE=10; modo='libre'; nuevoReparto(); darTodo(); empuja(2); darTodo(); empuja(3); darTodo();
  ok('con fases desiguales no hay caja que copiar, pero la tabla sí',
     cajaParaPegar()===null && tablaParaPegar().indexOf('[1/6]')>0, 'ok');
  modo='fases';

  /* --- lo que no debe pasar -------------------------------------------------------------------- */
  A=3; B=0; BASE=10; nuevoReparto();
  ok('con 0 personas no hay reparto', !hayReparto(), 'ok');
  ok('y la caja no se construye', construyeCaja()===null, 'ok');
  A=3; B=4; BASE=10; nuevoReparto();
  ok('un archivo con fases que no encajan se rechaza',
     limpiaFases([{tengo:3,doy:0,base:1},{tengo:99,doy:1,base:10}],4,3)===null, 'ok');
  ok('y uno en el que se da más de lo que hay, también',
     limpiaFases([{tengo:3,doy:2,base:1}],4,3)===null, 'ok');
  ok('y uno cuya primera fase dice partir en algo',
     limpiaFases([{tengo:3,doy:0,base:5}],4,3)===null, 'ok');
  ok('una cadena de fases correcta sí se acepta',
     limpiaFases([{tengo:3,doy:0,base:1},{tengo:30,doy:7,base:10}],4,3)!==null, 'ok');
  ok('una cadena con fases desiguales también, que para eso son libres',
     limpiaFases([{tengo:5,doy:1,base:1},{tengo:4,doy:1,base:2},{tengo:3,doy:1,base:3}],3,5)!==null, 'ok');
  ok('la rejilla de 100 celdas es de 10 por 10', rejilla(100).f===10 && rejilla(100).c===10,
     rejilla(100).f+'x'+rejilla(100).c);
  ok('la de 10 es de 2 por 5', rejilla(10).f===2 && rejilla(10).c===5, rejilla(10).f+'x'+rejilla(10).c);
  ok('y la de 7, que es primo, es una tira de 7', rejilla(7).f===1 && rejilla(7).c===7, 'ok');

  /* --- deshacer -------------------------------------------------------------------------------- */
  A=3; B=2; BASE=10; nuevoReparto(); undoStack=[];
  darTodo();
  ok('dar todo queda registrado', fases[0].doy===1, fases[0].doy);
  doUndo();
  ok('y deshacer lo devuelve a como estaba', fases[0].doy===0, fases[0].doy);
  nuevaFase(7);
  ok('partir en 7 abre una fase de séptimos', fases[1].den===7, fases[1].den);
  doUndo();
  ok('y deshacer se la lleva', fases.length===1, fases.length);

  }catch(errT){
    fails++;
    out.push('FALLO se ha cortado aquí: '+((errT&&errT.message)||errT));
    if(errT&&errT.stack) String(errT.stack).split('\n').slice(0,5).forEach(function(l){
      out.push('        '+l.trim()); });
  }

  A=antes.A; B=antes.B; BASE=antes.BASE; modo=antes.modo; forma=antes.forma;
  fases=antes.fases; view=antes.view; undoStack=antes.undo;
  opt.tabla=antes.opt.tabla; opt.tam=antes.opt.tam; opt.caja=antes.opt.caja;
  opt.cuentas=antes.opt.cuentas; opt.lupa=antes.opt.lupa;
  try{ sincronizaEntradas(); pinta(); }catch(e2){}

  /* --- informe --------------------------------------------------------------------------------- */
  var texto=out.join('\n')+'\n\n'+(fails? fails+' PRUEBAS FALLIDAS de '+out.length
                                         : 'LAS '+out.length+' PRUEBAS CORRECTAS');
  var box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;background:#fff;z-index:99;overflow:auto;padding:18px 22px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
  box.innerHTML='<div style="font:600 15px/1.3 -apple-system,Segoe UI,Roboto,sans-serif;margin-bottom:4px">'+
      'Autocomprobación de Reparto de tortillas</div>'+
    '<div style="font:13px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;color:'+(fails?'#c2410c':'#15803d')+';font-weight:600;margin-bottom:12px">'+
      (fails? fails+' pruebas fallidas de '+out.length : 'Las '+out.length+' pruebas correctas')+'</div>'+
    '<button id="cpTest" style="font:13px -apple-system,Segoe UI,Roboto,sans-serif;padding:6px 12px;margin-bottom:14px;'+
      'border:1px solid #d5d9e0;border-radius:7px;background:#fff;cursor:pointer">Copiar informe</button> '+
    '<button id="clTest" style="font:13px -apple-system,Segoe UI,Roboto,sans-serif;padding:6px 12px;margin-bottom:14px;'+
      'border:1px solid #d5d9e0;border-radius:7px;background:#fff;cursor:pointer">Cerrar y usar el manipulativo</button>'+
    '<pre style="white-space:pre-wrap;margin:0">'+
      out.map(function(l){ return l.indexOf('FALLO')===0
        ? '<span style="color:#c2410c;font-weight:700">'+l+'</span>' : l; }).join('\n')+'</pre>';
  document.body.appendChild(box);
  document.getElementById('cpTest').addEventListener('click',function(){
    var ta=document.createElement('textarea'); ta.value=texto; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); }catch(err){}
    document.body.removeChild(ta); this.textContent='Copiado ✓';
  });
  document.getElementById('clTest').addEventListener('click',function(){ box.remove(); });
}
var testLanzado=false;
function lanzarTest(){ if(testLanzado) return; testLanzado=true; runSelfTest(); }
if((location.hash||'').indexOf('test')>=0) setTimeout(lanzarTest,60);
window.addEventListener('hashchange',function(){
  if((location.hash||'').indexOf('test')>=0) lanzarTest();
});

window.__reparto={
  test:runSelfTest, opt:opt,
  set:function(a,b,e){ A=a; B=b; BASE=e; nuevoReparto(); sincronizaEntradas(); pinta(); },
  modo:function(m){ ponModo(m); }, forma:function(f){ forma=f; pinta(); },
  fases:function(){ return fases; }, geo:geoMesa,
  darUno:darUno, darTodo:darTodo, nuevaFase:nuevaFase, faseEntera:faseEntera,
  hastaElFinal:hastaElFinal, ponDoy:ponDoy, quitaFase:quitaFase,
  repeticion:repeticion, terminado:terminado, sobraDe:sobraDe, totalDe:totalDe, maxDoy:maxDoy,
  rpd:rpdTexto, notacion:notacionHTML, recibido:recibidoFrac, baseUnif:baseUnif,
  caja:construyeCaja, textoBase:textoBase, rejilla:rejilla,
  copiaTabla:tablaParaPegar, copiaCaja:cajaParaPegar,
  cargar:cargar, limpiaFases:limpiaFases,
  redraw:pinta, fit:fitView, undo:doUndo
};

})();
</script>
</body>
