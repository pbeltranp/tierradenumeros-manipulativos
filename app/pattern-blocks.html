<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pattern blocks</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       color:#2b2f36;background:#fff;display:flex;height:100%;overflow:hidden}
  #side{width:172px;flex:0 0 172px;border-right:1px solid #e6e8ec;padding:10px 9px;overflow:auto;
        background:#fafbfc}
  #side h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8a919c;margin:0 0 6px;
           font-weight:600}
  #side h2.sep{margin-top:14px}
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  #toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:7px 9px;
           border-bottom:1px solid #e6e8ec;background:#fafbfc}
  .btn{border:1px solid #d5d9e0;background:#fff;border-radius:7px;padding:5px 9px;font-size:12.5px;
       color:#3d4450;cursor:pointer;display:inline-flex;align-items:center;gap:5px;line-height:1.2}
  .btn:hover{background:#f0f2f5}
  .btn.on{background:#2f62a8;border-color:#2f62a8;color:#fff}
  .btn:disabled{opacity:.4;cursor:default}
  .sep{width:1px;height:20px;background:#dfe2e7;margin:0 3px}
  .chk{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#4a515c;cursor:pointer;
       padding:3px 6px;border-radius:6px}
  .chk:hover{background:#eff1f4}
  .chk input{margin:0;cursor:pointer}
  .act{display:block;width:100%;margin-top:5px;border:1px solid #d5d9e0;background:#fff;border-radius:7px;
       padding:5px 8px;font-size:12px;color:#3d4450;cursor:pointer;text-align:left}
  .act:hover{background:#f0f2f5}
  .act:disabled{opacity:.4;cursor:default}
  .act kbd{float:right;font:11px ui-monospace,Menlo,Consolas,monospace;color:#9aa1ab}
  #paleta{display:flex;flex-wrap:wrap;gap:6px}
  #paleta .pz{width:74px;height:60px;border:1px solid #e6e8ec;border-radius:9px;background:#fff;
              cursor:grab;display:block;touch-action:none}
  #paleta .pz:hover{border-color:#c7ccd4;background:#f7f8fa}
  #cajaeje{margin-top:5px;font-size:11.5px;color:#6b7280;background:#fff;border:1px solid #e6e8ec;
           border-radius:8px;padding:6px 8px;line-height:1.5}
  #cajaeje b{color:#2b2f36}
  #stage{position:relative;flex:1;min-height:0;background:#fff}
  canvas#cv{display:block;width:100%;height:100%;touch-action:none}
  #hint{position:absolute;left:10px;bottom:10px;background:rgba(28,32,38,.82);color:#fff;font-size:11.5px;
        padding:5px 10px;border-radius:14px;pointer-events:none;max-width:calc(100% - 20px)}
  #info{position:absolute;right:10px;top:10px;width:300px;background:#fff;border:1px solid #dfe2e7;
        border-radius:10px;padding:11px 13px;font-size:11.5px;line-height:1.55;color:#4a515c;
        box-shadow:0 6px 22px rgba(20,25,35,.12);display:none;max-height:calc(100% - 20px);overflow:auto}
  #info.show{display:block}
  #info b{color:#2b2f36}
  #info a{color:#2f62a8}
  #info .lic{margin-top:11px;padding-top:8px;border-top:1px solid #eef0f3;font-size:10.5px;
             line-height:1.5;color:#8a919c}
  #cuentas{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.96);border:1px solid #dfe2e7;
           border-radius:10px;padding:8px 11px;font-size:11.5px;line-height:1.6;color:#4a515c;
           box-shadow:0 6px 22px rgba(20,25,35,.10);display:none}
  #cuentas.show{display:block}
  #cuentas .fila{display:flex;align-items:center;gap:6px}
  #cuentas .sw{width:11px;height:11px;border-radius:3px;border:1px solid rgba(0,0,0,.25)}
  #cuentas .tot{margin-top:5px;padding-top:5px;border-top:1px solid #eef0f3;color:#2b2f36}
  #drop{position:absolute;inset:0;background:rgba(47,98,168,.08);border:2px dashed #2f62a8;
        display:none;align-items:center;justify-content:center;font-size:15px;color:#2f62a8;font-weight:600}
  #drop.show{display:flex}
  .note{font-size:11px;color:#8a919c;line-height:1.5;margin-top:8px}
  @media (max-width:640px){
    #side{width:120px;flex:0 0 120px;padding:8px 6px}
    #paleta .pz{width:100%;height:52px}
    .btn{padding:5px 7px;font-size:12px}
    #info{width:calc(100% - 20px)}
  }
</style>
</head>
<body>

  <aside id="side">
    <h2>Piezas</h2>
    <div id="paleta"></div>
    <div class="note">Arrastra una pieza al tablero. Hay todas las que quieras de cada tipo.</div>

    <h2 class="sep">Selección</h2>
    <button class="act" id="gIzq" disabled>Girar ↺<kbd>L</kbd></button>
    <button class="act" id="gDer" disabled>Girar ↻<kbd>R</kbd></button>
    <button class="act" id="duplicar" disabled>Duplicar<kbd>D</kbd></button>
    <button class="act" id="alFrente" disabled>Traer al frente<kbd>F</kbd></button>
    <button class="act" id="borrar" disabled>Quitar del tablero<kbd>Supr</kbd></button>

    <h2 class="sep">Grupos</h2>
    <button class="act" id="agrupar" disabled>Agrupar<kbd>G</kbd></button>
    <button class="act" id="desagrupar" disabled>Desagrupar<kbd>H</kbd></button>

    <h2 class="sep">Simetría</h2>
    <button class="act" id="simetria" disabled>Reflejar en el eje<kbd>S</kbd></button>
    <div id="cajaeje"></div>
  </aside>

  <main>
    <div id="toolbar">
      <button class="btn" id="undo" title="Deshacer (Ctrl+Z)">↶</button>
      <button class="btn" id="vaciar" title="Quitar todas las piezas">Vaciar</button>
      <span class="sep"></span>
      <label class="chk" title="Al soltar una pieza, sus vértices se enganchan a los de las demás"><input type="checkbox" id="iman" checked>Imán</label>
      <label class="chk" title="Los giros van de 30 en 30 grados, que es lo que piden los ángulos de estas piezas"><input type="checkbox" id="paso" checked>Giro de 30°</label>
      <label class="chk" title="Recuento de piezas y área"><input type="checkbox" id="comp">Comprobaciones</label>
      <span class="sep"></span>
      <button class="btn" id="mano" title="Mover el tablero en vez de seleccionar">✋</button>
      <button class="btn" id="zoomout">−</button>
      <button class="btn" id="zoomin">+</button>
      <button class="btn" id="fit">Ajustar</button>
      <span class="sep"></span>
      <button class="btn" id="save" title="Descargar la construcción">⤓ Guardar</button>
      <button class="btn" id="open" title="Abrir un archivo guardado">⤒ Abrir</button>
      <button class="btn" id="add" title="Añadir las piezas de un archivo a las que ya hay">＋</button>
      <button class="btn" id="png" title="Descargar imagen">⤓ PNG</button>
      <button class="btn" id="help">?</button>
      <input type="file" id="fileIn" accept=".json,application/json" style="display:none">
    </div>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="cuentas"></div>
      <div id="hint"></div>
      <div id="info"></div>
      <div id="drop">Suelta aquí el archivo</div>
    </div>
  </main>

<script>
"use strict";
(function(){

/* =========================================================================
   1. LAS SEIS PIEZAS
   Los pattern blocks son seis polígonos de lado 1, salvo la base larga del
   trapecio, que mide 2. Sus ángulos son 30°, 60°, 90°, 120° y 150°: todos
   múltiplos de 30, y por eso el giro va de 30 en 30. Los colores son los del
   material de siempre.
   ========================================================================= */
var U=52;                                  // el lado, en píxeles
var H=U*Math.sqrt(3)/2;                    // altura del triángulo de lado U

function regular(n,r,off){
  var v=[];
  for(var i=0;i<n;i++){
    var t=off+i*2*Math.PI/n;
    v.push({x:r*Math.cos(t), y:r*Math.sin(t)});
  }
  return v;
}
/* «sim» es la dirección de un eje de simetría de la pieza en sus coordenadas
   propias. Todas las piezas tienen alguno, y eso hace que reflejarlas no cree
   piezas nuevas: la reflejada es la misma pieza girada. */
var TIPOS=[
  {n:'Hexágono', col:'#f6c22d', sim:0, a0:0,
   v:regular(6,U,0)},
  {n:'Trapecio', col:'#e03a3e', sim:Math.PI/2, a0:0,
   v:[{x:-U,y:H/2},{x:U,y:H/2},{x:U/2,y:-H/2},{x:-U/2,y:-H/2}]},
  {n:'Rombo ancho', col:'#2b5fa8', sim:0, a0:0,
   v:[{x:-U*Math.sqrt(3)/2,y:0},{x:0,y:-U/2},{x:U*Math.sqrt(3)/2,y:0},{x:0,y:U/2}]},
  {n:'Cuadrado', col:'#f2871f', sim:0, a0:0,
   v:[{x:-U/2,y:-U/2},{x:U/2,y:-U/2},{x:U/2,y:U/2},{x:-U/2,y:U/2}]},
  {n:'Triángulo', col:'#4aab4a', sim:0, a0:-Math.PI/2,
   v:regular(3,U/Math.sqrt(3),0)},
  {n:'Rombo estrecho', col:'#e3c8a2', sim:0, a0:0,
   v:[{x:-U*Math.cos(Math.PI/12),y:0},{x:0,y:-U*Math.sin(Math.PI/12)},
      {x: U*Math.cos(Math.PI/12),y:0},{x:0,y: U*Math.sin(Math.PI/12)}]}
];
var PASO=Math.PI/6;                        // 30°

/* Puntos donde engancha el imán: los vértices y, en los lados que miden dos
   unidades, también el punto medio. Si no, el trapecio no casaría por su base
   larga con dos piezas pequeñas seguidas. */
function puntosIman(t){
  var v=TIPOS[t].v, out=[];
  for(var i=0;i<v.length;i++){
    var A=v[i], B=v[(i+1)%v.length];
    out.push({x:A.x,y:A.y});
    if(Math.hypot(B.x-A.x,B.y-A.y)>U*1.4) out.push({x:(A.x+B.x)/2, y:(A.y+B.y)/2});
  }
  return out;
}
var IMAN=TIPOS.map(function(T,t){ return puntosIman(t); });

function areaPoli(v){
  var s=0;
  for(var i=0;i<v.length;i++){
    var A=v[i], B=v[(i+1)%v.length];
    s+=A.x*B.y-B.x*A.y;
  }
  return Math.abs(s)/2;
}
var AREA_TRI=areaPoli(TIPOS[4].v);         // el triángulo verde, unidad de área
var AREAS=TIPOS.map(function(T){ return areaPoli(T.v); });

/* =========================================================================
   2. ESTADO
   ========================================================================= */
var piezas=[], sel=[], nid=1, ngrupo=1;
var view={x:0,y:0,z:1};
var drag=null, undoStack=[], importMode='replace';
var opt={iman:1, paso:1, comp:0, mano:0};
var eje=null;                              // {A,B} en coordenadas del tablero
var pidiendoEje=false, ejeDraft=null;

var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var stage=document.getElementById('stage');
var hintEl=document.getElementById('hint'), infoEl=document.getElementById('info');
var dropEl=document.getElementById('drop'), cuentasEl=document.getElementById('cuentas');
var flashMsg=null, flashT=0;

function w2s(p){ return {x:p.x*view.z+view.x, y:p.y*view.z+view.y}; }
function s2w(p){ return {x:(p.x-view.x)/view.z, y:(p.y-view.y)/view.z}; }
function flash(m){ flashMsg=m; flashT=Date.now(); draw(); setTimeout(draw,2200); }
function estado(){ return JSON.stringify({p:piezas, s:sel, n:nid, g:ngrupo}); }
function pushUndo(){ undoStack.push(estado()); if(undoStack.length>90) undoStack.shift(); }
function doUndo(){
  if(!undoStack.length){ flash('No hay nada que deshacer'); return; }
  var d=JSON.parse(undoStack.pop());
  piezas=d.p; sel=d.s||[]; nid=d.n||1; ngrupo=d.g||1;
  draw();
}

/* =========================================================================
   3. GEOMETRÍA DE LAS PIEZAS COLOCADAS
   ========================================================================= */
function verts(p){
  var co=Math.cos(p.a), si=Math.sin(p.a);
  return TIPOS[p.t].v.map(function(v){
    return {x:p.x+v.x*co-v.y*si, y:p.y+v.x*si+v.y*co};
  });
}
function imanDe(p){
  var co=Math.cos(p.a), si=Math.sin(p.a);
  return IMAN[p.t].map(function(v){
    return {x:p.x+v.x*co-v.y*si, y:p.y+v.x*si+v.y*co};
  });
}
function dentro(P,p){
  var v=verts(p), dentroP=false;
  for(var i=0,j=v.length-1;i<v.length;j=i++){
    if((v[i].y>P.y)!==(v[j].y>P.y) &&
       P.x < (v[j].x-v[i].x)*(P.y-v[i].y)/(v[j].y-v[i].y)+v[i].x) dentroP=!dentroP;
  }
  return dentroP;
}
function cajaDe(lista){
  if(!lista.length) return null;
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  lista.forEach(function(p){ verts(p).forEach(function(v){
    if(v.x<x0)x0=v.x; if(v.x>x1)x1=v.x; if(v.y<y0)y0=v.y; if(v.y>y1)y1=v.y; }); });
  return {x0:x0,y0:y0,x1:x1,y1:y1};
}
function porId(id){
  for(var i=0;i<piezas.length;i++) if(piezas[i].id===id) return piezas[i];
  return null;
}
function seleccionadas(){ return sel.map(porId).filter(Boolean); }
function centroDe(lista){
  var x=0,y=0,n=0;
  lista.forEach(function(p){ verts(p).forEach(function(v){ x+=v.x; y+=v.y; n++; }); });
  return n? {x:x/n, y:y/n} : {x:0,y:0};
}

/* =========================================================================
   4. SELECCIÓN Y GRUPOS
   Un grupo se mueve entero: al tocar una pieza agrupada se seleccionan todas
   las de su grupo. Es lo que permite armar una figura y luego llevársela.
   ========================================================================= */
function conGrupo(ids){
  var gs={}, out={};
  ids.forEach(function(id){
    var p=porId(id); if(!p) return;
    out[id]=1;
    if(p.g) gs[p.g]=1;
  });
  piezas.forEach(function(p){ if(p.g && gs[p.g]) out[p.id]=1; });
  return Object.keys(out).map(Number);
}
function selecciona(ids, anadir){
  var base = anadir? sel.slice() : [];
  ids.forEach(function(id){
    var i=base.indexOf(id);
    if(anadir && i>=0) base.splice(i,1); else if(i<0) base.push(id);
  });
  sel=conGrupo(base);
  updateUI();
}
function agrupar(){
  var s=seleccionadas();
  if(s.length<2){ flash('Selecciona al menos dos piezas'); return; }
  pushUndo();
  var g=ngrupo++;
  s.forEach(function(p){ p.g=g; });
  flash('Agrupadas: ahora se mueven juntas');
  draw();
}
function desagrupar(){
  var s=seleccionadas().filter(function(p){ return p.g; });
  if(!s.length){ flash('Esa selección no está agrupada'); return; }
  pushUndo();
  s.forEach(function(p){ p.g=0; });
  draw();
}

/* =========================================================================
   5. MOVER, GIRAR Y REFLEJAR
   ========================================================================= */
function mueve(lista,dx,dy){ lista.forEach(function(p){ p.x+=dx; p.y+=dy; }); }
function giraLista(lista,ang,C){
  var co=Math.cos(ang), si=Math.sin(ang);
  lista.forEach(function(p){
    var dx=p.x-C.x, dy=p.y-C.y;
    p.x=C.x+dx*co-dy*si; p.y=C.y+dx*si+dy*co;
    p.a+=ang;
  });
}
function gira(sentido){
  var s=seleccionadas();
  if(!s.length) return;
  pushUndo();
  var ang=sentido*(opt.paso? PASO : Math.PI/36);
  giraLista(s, ang, centroDe(s));
  if(opt.paso) s.forEach(function(p){ p.a=Math.round(p.a/PASO)*PASO; });
  draw();
}
/* Reflejar una pieza en una recta no da una pieza nueva, porque todas tienen
   eje de simetría: sale la misma pieza girada. Si la recta va a 15k grados y
   la pieza estaba en un múltiplo de 30°, la reflejada también lo está. */
function reflejaPieza(p, A, B){
  var th=Math.atan2(B.y-A.y, B.x-A.x);
  var co=Math.cos(2*th), si=Math.sin(2*th);
  var dx=p.x-A.x, dy=p.y-A.y;
  return {id:p.id, t:p.t, g:p.g,
          x:A.x+dx*co+dy*si,
          y:A.y+dx*si-dy*co,
          a:2*th-p.a-2*TIPOS[p.t].sim};
}
function reflejaSeleccion(){
  var s=seleccionadas();
  if(!s.length || !eje) return;
  pushUndo();
  s.forEach(function(p){
    var q=reflejaPieza(p, eje.A, eje.B);
    p.x=q.x; p.y=q.y; p.a=q.a;
  });
  draw();
}
function anguloEje(A,B){
  var th=Math.atan2(B.y-A.y,B.x-A.x);
  return Math.round(th/(Math.PI/12))*(Math.PI/12);   // de 15 en 15 grados
}
function ejeAjustado(A,B){
  var th=anguloEje(A,B), d=Math.hypot(B.x-A.x,B.y-A.y);
  return {A:{x:A.x,y:A.y}, B:{x:A.x+d*Math.cos(th), y:A.y+d*Math.sin(th)}};
}

/* --- el imán -------------------------------------------------------------- */
function enganche(lista){
  var moviles=[], quietos=[];
  var ids={}; lista.forEach(function(p){ ids[p.id]=1; });
  lista.forEach(function(p){ imanDe(p).forEach(function(q){ moviles.push(q); }); });
  piezas.forEach(function(p){ if(!ids[p.id]) imanDe(p).forEach(function(q){ quietos.push(q); }); });
  if(!moviles.length || !quietos.length) return null;
  var lim=14/view.z, mejor=null;
  moviles.forEach(function(a){
    quietos.forEach(function(b){
      var d=Math.hypot(b.x-a.x, b.y-a.y);
      if(d<lim && (!mejor || d<mejor.d)) mejor={d:d, dx:b.x-a.x, dy:b.y-a.y};
    });
  });
  return mejor;
}
function aplicaIman(lista){
  if(!opt.iman) return false;
  var e=enganche(lista);
  if(!e) return false;
  mueve(lista, e.dx, e.dy);
  return true;
}

/* =========================================================================
   6. DIBUJO
   ========================================================================= */
function tinta(hex,f,al){
  var h=hex.replace('#','');
  var r=parseInt(h.substr(0,2),16), g=parseInt(h.substr(2,2),16), b=parseInt(h.substr(4,2),16);
  r=Math.round(r+(f>0?(255-r)*f:r*f)); g=Math.round(g+(f>0?(255-g)*f:g*f)); b=Math.round(b+(f>0?(255-b)*f:b*f));
  return 'rgba('+r+','+g+','+b+','+(al===undefined?1:al)+')';
}
function camino(c,v){
  var a=w2s(v[0]); c.beginPath(); c.moveTo(a.x,a.y);
  for(var i=1;i<v.length;i++){ var q=w2s(v[i]); c.lineTo(q.x,q.y); }
  c.closePath();
}
function drawPieza(c,p,marcada){
  var v=verts(p), T=TIPOS[p.t];
  camino(c,v);
  c.fillStyle=T.col; c.fill();
  c.lineJoin='round';
  c.lineWidth=marcada?2.6:1.2;
  c.strokeStyle=marcada? '#1f4e8c' : tinta(T.col,-0.35);
  c.stroke();
}
function drawGrupo(c,g){
  var lista=piezas.filter(function(p){ return p.g===g; });
  var b=cajaDe(lista); if(!b) return;
  var a=w2s({x:b.x0,y:b.y0}), d=w2s({x:b.x1,y:b.y1});
  c.save();
  c.setLineDash([4,4]); c.lineWidth=1; c.strokeStyle='rgba(47,98,168,.45)';
  c.strokeRect(a.x-3, a.y-3, d.x-a.x+6, d.y-a.y+6);
  c.restore();
}
function tirador(){
  var s=seleccionadas(); if(!s.length) return null;
  var b=cajaDe(s);
  var m=w2s({x:(b.x0+b.x1)/2, y:b.y0});
  return {x:m.x, y:m.y-26, r:12};
}
function drawEje(c,E,tenue){
  var A=w2s(E.A), B=w2s(E.B);
  var dx=B.x-A.x, dy=B.y-A.y, d=Math.hypot(dx,dy);
  if(d<1e-6) return;
  var L=4000/d;
  c.save();
  c.setLineDash([7,5]); c.lineWidth=1.6;
  c.strokeStyle= tenue? 'rgba(47,98,168,.35)' : 'rgba(47,98,168,.85)';
  c.beginPath();
  c.moveTo(A.x-dx*L, A.y-dy*L); c.lineTo(A.x+dx*L, A.y+dy*L);
  c.stroke();
  c.setLineDash([]);
  [E.A,E.B].forEach(function(P){
    var q=w2s(P);
    c.beginPath(); c.arc(q.x,q.y,3.5,0,6.2832);
    c.fillStyle='#2f62a8'; c.fill();
  });
  c.restore();
}
function draw(){
  var W=cv.width/(window.devicePixelRatio||1), Hh=cv.height/(window.devicePixelRatio||1);
  ctx.clearRect(0,0,W,Hh);
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,Hh);

  var gs={};
  piezas.forEach(function(p){ if(p.g) gs[p.g]=1; });
  Object.keys(gs).forEach(function(g){ drawGrupo(ctx, Number(g)); });

  var marcadas={}; sel.forEach(function(id){ marcadas[id]=1; });
  piezas.forEach(function(p){ drawPieza(ctx,p,!!marcadas[p.id]); });

  if(eje) drawEje(ctx, eje, false);
  if(ejeDraft) drawEje(ctx, ejeDraft, true);

  if(drag && drag.modo==='marco'){
    var a=drag.p0s, b=drag.p1s;
    ctx.save();
    ctx.fillStyle='rgba(47,98,168,.10)';
    ctx.strokeStyle='rgba(47,98,168,.7)'; ctx.lineWidth=1;
    ctx.fillRect(Math.min(a.x,b.x), Math.min(a.y,b.y), Math.abs(b.x-a.x), Math.abs(b.y-a.y));
    ctx.strokeRect(Math.min(a.x,b.x), Math.min(a.y,b.y), Math.abs(b.x-a.x), Math.abs(b.y-a.y));
    ctx.restore();
  }
  var t=tirador();
  if(t && !(drag && drag.modo==='marco')){
    ctx.beginPath(); ctx.arc(t.x,t.y,t.r,0,6.2832);
    ctx.fillStyle='#fff'; ctx.fill();
    ctx.lineWidth=1.6; ctx.strokeStyle='#2f62a8'; ctx.stroke();
    ctx.fillStyle='#2f62a8'; ctx.font='13px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('⟳', t.x, t.y+1);
  }
  updateUI();
}

   7. INTERACCIÓN
   ========================================================================= */
function pos(e){
  var r=stage.getBoundingClientRect();
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}
function piezaEn(P){
  for(var i=piezas.length-1;i>=0;i--) if(dentro(P,piezas[i])) return piezas[i];
  return null;
}
function alFrenteIds(ids){
  var mueve=piezas.filter(function(p){ return ids.indexOf(p.id)>=0; });
  piezas=piezas.filter(function(p){ return ids.indexOf(p.id)<0; }).concat(mueve);
}

cv.addEventListener('pointerdown',function(e){
  cv.setPointerCapture(e.pointerId);
  var s=pos(e), w=s2w(s);

  if(pidiendoEje){
    if(!ejeDraft){ ejeDraft={A:w, B:w}; }
    else{
      eje=ejeAjustado(ejeDraft.A, w);
      ejeDraft=null; pidiendoEje=false;
      flash('Eje puesto. Ahora «Reflejar en el eje»');
    }
    draw(); return;
  }
  var t=tirador();
  if(t && Math.hypot(s.x-t.x, s.y-t.y)<=t.r+4){
    var lista=seleccionadas();
    pushUndo();
    drag={modo:'girar', C:centroDe(lista), a0:Math.atan2(w.y-centroDe(lista).y, w.x-centroDe(lista).x),
          orig:lista.map(function(p){ return {p:p, x:p.x, y:p.y, a:p.a}; })};
    return;
  }
  var p=piezaEn(w);
  if(p){
    if(sel.indexOf(p.id)<0 || e.shiftKey) selecciona([p.id], e.shiftKey);
    if(sel.indexOf(p.id)<0){ draw(); return; }
    pushUndo();
    drag={modo:'mover', w0:w, lista:seleccionadas(),
          orig:seleccionadas().map(function(q){ return {p:q, x:q.x, y:q.y}; }), movido:false};
    return;
  }
  if(opt.mano || e.button===1 || e.button===2){
    drag={modo:'pan', s0:s, v0:{x:view.x,y:view.y}};
    return;
  }
  drag={modo:'marco', p0s:s, p1s:s, shift:e.shiftKey};
  if(!e.shiftKey){ sel=[]; }
  draw();
});
cv.addEventListener('pointermove',function(e){
  var s=pos(e), w=s2w(s);
  if(pidiendoEje && ejeDraft){ ejeDraft={A:ejeDraft.A, B:ejeAjustado(ejeDraft.A,w).B}; draw(); return; }
  if(!drag) return;
  if(drag.modo==='pan'){
    view.x=drag.v0.x+(s.x-drag.s0.x); view.y=drag.v0.y+(s.y-drag.s0.y);
    draw(); return;
  }
  if(drag.modo==='marco'){ drag.p1s=s; draw(); return; }
  if(drag.modo==='mover'){
    var dx=w.x-drag.w0.x, dy=w.y-drag.w0.y;
    drag.orig.forEach(function(o){ o.p.x=o.x+dx; o.p.y=o.y+dy; });
    drag.movido=true;
    draw(); return;
  }
  if(drag.modo==='girar'){
    var a=Math.atan2(w.y-drag.C.y, w.x-drag.C.x);
    var d=a-drag.a0;
    if(opt.paso) d=Math.round(d/PASO)*PASO;
    var co=Math.cos(d), si=Math.sin(d);
    drag.orig.forEach(function(o){
      var vx=o.x-drag.C.x, vy=o.y-drag.C.y;
      o.p.x=drag.C.x+vx*co-vy*si; o.p.y=drag.C.y+vx*si+vy*co;
      o.p.a=o.a+d;
    });
    draw(); return;
  }
});
function suelta(){
  if(!drag) return;
  if(drag.modo==='marco'){
    var a=s2w({x:Math.min(drag.p0s.x,drag.p1s.x), y:Math.min(drag.p0s.y,drag.p1s.y)});
    var b=s2w({x:Math.max(drag.p0s.x,drag.p1s.x), y:Math.max(drag.p0s.y,drag.p1s.y)});
    var dentroMarco=[];
    piezas.forEach(function(p){
      if(p.x>=a.x && p.x<=b.x && p.y>=a.y && p.y<=b.y) dentroMarco.push(p.id);
    });
    if(dentroMarco.length) selecciona(dentroMarco, drag.shift);
  }
  if(drag.modo==='mover' && drag.movido) aplicaIman(drag.lista);
  if(drag.modo==='girar' && opt.paso) seleccionadas().forEach(function(p){
    p.a=Math.round(p.a/PASO)*PASO; });
  if(drag.modo==='girar') aplicaIman(seleccionadas());
  drag=null;
  draw();
}
cv.addEventListener('pointerup',suelta);
cv.addEventListener('pointercancel',suelta);
cv.addEventListener('contextmenu',function(e){ e.preventDefault(); });
cv.addEventListener('wheel',function(e){

  var s=pos(e), w=s2w(s);
  var z=Math.max(0.25, Math.min(3, view.z*(e.deltaY<0?1.12:1/1.12)));
  view.z=z; view.x=s.x-w.x*z; view.y=s.y-w.y*z;

},{passive:false});

/* --- la paleta: arrastrar piezas nuevas ---------------------------------- */
function nuevaPieza(t,P){
  return {id:nid++, t:t, x:P.x, y:P.y, a:TIPOS[t].a0, g:0};
}
function pintaPaleta(){
  var cont=document.getElementById('paleta');
  cont.innerHTML='';
  TIPOS.forEach(function(T,t){
    var an=74, al=60, c=document.createElement('canvas');
    c.className='pz'; c.width=an*2; c.height=al*2;
    c.title='Arrastra un '+T.n.toLowerCase();
    var o=c.getContext('2d'); o.scale(2,2);
    var esc=Math.min((an-14)/(2*U), (al-14)/(2*U))*1.35;
    o.translate(an/2, al/2); o.scale(esc,esc); o.rotate(T.a0);
    o.beginPath();
    T.v.forEach(function(v,i){ if(i===0) o.moveTo(v.x,v.y); else o.lineTo(v.x,v.y); });
    o.closePath();
    o.fillStyle=T.col; o.fill();
    o.lineWidth=1.2/esc; o.lineJoin='round'; o.strokeStyle=tinta(T.col,-0.35); o.stroke();
    c.addEventListener('pointerdown',function(e){
      e.preventDefault();
      pushUndo();
      var p=nuevaPieza(t, s2w(pos(e)));
      piezas.push(p); sel=[p.id];
      drag={modo:'mover', w0:s2w(pos(e)), lista:[p],
            orig:[{p:p, x:p.x, y:p.y}], movido:true};
      window.addEventListener('pointermove', paletaMove);
      window.addEventListener('pointerup', paletaUp);
      draw();
    });
    cont.appendChild(c);
  });
}
function paletaMove(e){
  if(!drag) return;
  var w=s2w(pos(e)), dx=w.x-drag.w0.x, dy=w.y-drag.w0.y;
  drag.orig.forEach(function(o){ o.p.x=o.x+dx; o.p.y=o.y+dy; });
  draw();
}
function paletaUp(){
  window.removeEventListener('pointermove', paletaMove);
  window.removeEventListener('pointerup', paletaUp);
  suelta();
}

function zoomAt(k){
  var r=stage.getBoundingClientRect(), c={x:r.width/2, y:r.height/2}, w=s2w(c);
  view.z=Math.max(0.25, Math.min(3, view.z*k));

document.getElementById('fit').addEventListener('click',fitView);
function fitView(){
  var r=stage.getBoundingClientRect(), m=60;
  var b=cajaDe(piezas);
  if(!b){ view={x:r.width/2, y:r.height/2, z:1}; draw(); return; }
  var z=Math.min((r.width-2*m)/((b.x1-b.x0)||1), (r.height-2*m)/((b.y1-b.y0)||1));
  view.z=Math.max(0.25, Math.min(2, z));
  view.x=r.width/2-((b.x0+b.x1)/2)*view.z;
  view.y=r.height/2-((b.y0+b.y1)/2)*view.z;

document.addEventListener('keydown',function(e){
  if(e.target && /input|textarea/i.test(e.target.tagName)) return;
  var k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey) && k==='z'){ e.preventDefault(); doUndo(); return; }
  if(k==='r' || e.key==='ArrowRight'){ gira(1); e.preventDefault(); }
  else if(k==='l' || e.key==='ArrowLeft'){ gira(-1); e.preventDefault(); }
  else if(k==='g'){ agrupar(); }
  else if(k==='h'){ desagrupar(); }
  else if(k==='s'){ document.getElementById('simetria').click(); }
  else if(k==='d'){ document.getElementById('duplicar').click(); }
  else if(k==='f'){ document.getElementById('alFrente').click(); }
  else if(e.key==='Delete' || e.key==='Backspace'){ document.getElementById('borrar').click(); e.preventDefault(); }
  else if(e.key==='Escape'){ sel=[]; pidiendoEje=false; ejeDraft=null; draw(); }
});

function leer(f){
  var r=new FileReader();
  r.onload=function(){ try{ loadData(JSON.parse(r.result)); }catch(err){ flash('No he podido leer ese archivo'); } };
  r.readAsText(f);
}
function limpiaPiezas(lista){
  if(!Array.isArray(lista)) return null;
  var out=[], mapaG={};
  for(var i=0;i<lista.length;i++){
    var q=lista[i], t=q.t|0;
    if(t<0 || t>=TIPOS.length) return null;
    var x=Number(q.x), y=Number(q.y), a=Number(q.a);
    if(!isFinite(x)||!isFinite(y)||!isFinite(a)) return null;
    var g=q.g|0;
    if(g){ if(!mapaG[g]) mapaG[g]=ngrupo++; g=mapaG[g]; }
    out.push({id:nid++, t:t, x:x, y:y, a:a, g:g});
  }
  return out;
}
function loadData(d){
  var nuevas=d && limpiaPiezas(d.piezas);
  if(!nuevas){ flash('Ese archivo no trae piezas que yo entienda'); return; }
  pushUndo();
  piezas = (importMode==='add') ? piezas.concat(nuevas) : nuevas;
  sel=[]; fitView();
  flash(nuevas.length+(nuevas.length===1?' pieza cargada':' piezas cargadas'));
}
['dragenter','dragover'].forEach(function(ev){

  else if(!piezas.length) t='Arrastra piezas desde la columna de la izquierda';
  else if(sel.length>1) t=sel.length+' piezas seleccionadas · G las agrupa · el tirador ⟳ las gira juntas';
  else if(sel.length===1) t='R y L giran 30° · D duplica · Supr quita · arrastra en el hueco para seleccionar varias';
  else t='Arrastra en el tablero vacío para seleccionar varias piezas · ✋ para mover el tablero';
  hintEl.textContent=t;
}

/* =========================================================================
  10. AUTOCOMPROBACIÓN  ·  añade #test al final de la URL
   ========================================================================= */
function runSelfTest(){
  var out=[], fails=0;
  function ok(n,c,extra){ out.push((c?'OK    ':'FALLO ')+n+(extra!==undefined?'   ['+extra+']':'')); if(!c) fails++; }
  function num(v){ return (Math.round(v*1000)/1000).toString().replace('.',','); }
  function grados(r){ return Math.round(r*180/Math.PI*100)/100; }

  try{

  /* --- las piezas ----------------------------------------------------------- */
  function ladosDe(v){
    return v.map(function(A,i){ var B=v[(i+1)%v.length]; return Math.hypot(B.x-A.x,B.y-A.y); });
  }
  function angulosDe(v){
    var n=v.length, out=[];
    for(var i=0;i<n;i++){
      var A=v[(i-1+n)%n], B=v[i], C=v[(i+1)%n];
      var a1=Math.atan2(A.y-B.y,A.x-B.x), a2=Math.atan2(C.y-B.y,C.x-B.x);
      var g=Math.abs(a1-a2); if(g>Math.PI) g=2*Math.PI-g;
      out.push(grados(g));
    }
    return out;
  }
  ok('hay las seis piezas del material', TIPOS.length===6,
     TIPOS.map(function(T){ return T.n; }).join(', '));
  ok('todos los lados miden 1, menos la base larga del trapecio, que mide 2', (function(){
      var mal=[];
      TIPOS.forEach(function(T,t){
        ladosDe(T.v).forEach(function(L){
          var r=L/U;
          if(Math.abs(r-1)>1e-9 && !(t===1 && Math.abs(r-2)<1e-9)) mal.push(T.n+' '+num(r));
        });
      });
      return mal.length===0; })());
  ok('el hexágono tiene seis ángulos de 120°',
     angulosDe(TIPOS[0].v).every(function(g){ return Math.abs(g-120)<1e-6; }));
  ok('el trapecio, dos de 60 y dos de 120', (function(){
      var g=angulosDe(TIPOS[1].v).slice().sort(function(a,b){return a-b;});
      return Math.abs(g[0]-60)<1e-6 && Math.abs(g[1]-60)<1e-6 &&
             Math.abs(g[2]-120)<1e-6 && Math.abs(g[3]-120)<1e-6; })(),
     angulosDe(TIPOS[1].v).join(' · '));
  ok('el rombo ancho, dos de 60 y dos de 120', (function(){
      var g=angulosDe(TIPOS[2].v).slice().sort(function(a,b){return a-b;});
      return Math.abs(g[0]-60)<1e-6 && Math.abs(g[3]-120)<1e-6; })(),
     angulosDe(TIPOS[2].v).join(' · '));
  ok('el cuadrado, cuatro de 90°',
     angulosDe(TIPOS[3].v).every(function(g){ return Math.abs(g-90)<1e-6; }));
  ok('el triángulo, tres de 60°',
     angulosDe(TIPOS[4].v).every(function(g){ return Math.abs(g-60)<1e-6; }));
  ok('el rombo estrecho, dos de 30 y dos de 150', (function(){
      var g=angulosDe(TIPOS[5].v).slice().sort(function(a,b){return a-b;});
      return Math.abs(g[0]-30)<1e-6 && Math.abs(g[3]-150)<1e-6; })(),
     angulosDe(TIPOS[5].v).join(' · '));
  ok('todos los ángulos son múltiplos de 30°, que es lo que justifica el paso de giro', (function(){
      return TIPOS.every(function(T){
        return angulosDe(T.v).every(function(g){ return Math.abs(g/30-Math.round(g/30))<1e-9; }); }); })());

  /* --- las áreas ------------------------------------------------------------ */
  ok('el hexágono son seis triángulos', Math.abs(AREAS[0]/AREA_TRI-6)<1e-9, num(AREAS[0]/AREA_TRI));
  ok('el trapecio, tres', Math.abs(AREAS[1]/AREA_TRI-3)<1e-9, num(AREAS[1]/AREA_TRI));
  ok('el rombo ancho, dos', Math.abs(AREAS[2]/AREA_TRI-2)<1e-9, num(AREAS[2]/AREA_TRI));
  ok('el cuadrado no es un número entero de triángulos',
     Math.abs(AREAS[3]/AREA_TRI-Math.round(AREAS[3]/AREA_TRI))>0.05, num(AREAS[3]/AREA_TRI));
  ok('y el rombo estrecho tampoco',
     Math.abs(AREAS[5]/AREA_TRI-Math.round(AREAS[5]/AREA_TRI))>0.05, num(AREAS[5]/AREA_TRI));

  /* --- el estado de partida -------------------------------------------------- */
  var antesP=piezas, antesS=sel, antesE=eje, antesOpt=opt.paso;
  piezas=[]; sel=[]; eje=null; opt.paso=1;

  /* --- giros ---------------------------------------------------------------- */
  var p1=nuevaPieza(4,{x:0,y:0});
  piezas=[p1]; sel=[p1.id];
  var a0=p1.a;
  gira(1);
  ok('girar una vez son 30°', Math.abs(grados(piezas[0].a-a0)-30)<1e-6, grados(piezas[0].a-a0)+'°');
  for(var i=0;i<11;i++) gira(1);
  ok('y doce giros dejan la pieza como estaba',
     Math.abs(((piezas[0].a-a0)%(2*Math.PI)))<1e-6 ||
     Math.abs(Math.abs((piezas[0].a-a0)%(2*Math.PI))-2*Math.PI)<1e-6,
     grados(piezas[0].a-a0)+'°');
  ok('el triángulo girado 120° vuelve a ocupar el mismo sitio', (function(){
      var q={t:4,x:0,y:0,a:0,g:0,id:99}, v0=verts(q);
      q.a=2*Math.PI/3; var v1=verts(q);
      return v0.every(function(A){
        return v1.some(function(B){ return Math.hypot(A.x-B.x,A.y-B.y)<1e-9; }); }); })());
  ok('pero girado 60° no, que para eso es un triángulo y no un hexágono', (function(){
      var q={t:4,x:0,y:0,a:0,g:0,id:99}, v0=verts(q);
      q.a=Math.PI/3; var v1=verts(q);
      return !v0.every(function(A){
        return v1.some(function(B){ return Math.hypot(A.x-B.x,A.y-B.y)<1e-9; }); }); })());

  /* --- el imán --------------------------------------------------------------- */
  piezas=[]; sel=[];
  var h=nuevaPieza(0,{x:0,y:0});                 // hexágono en el origen
  var tr=nuevaPieza(4,{x:U*4,y:U*0.3});          // triángulo lejos
  piezas=[h,tr];
  var antesD=Math.hypot(tr.x-h.x, tr.y-h.y);
  ok('lejos, el imán no engancha', enganche([tr])===null, num(antesD/U)+' lados de distancia');
  /* acerco un vértice del triángulo a un vértice del hexágono, no su centro:
     el imán mira vértices contra vértices */
  var vh=verts(h)[0], vt=verts(tr)[0];
  mueve([tr], vh.x-vt.x+3, vh.y-vt.y+2);
  var e1=enganche([tr]);
  ok('cerca de un vértice, sí', !!e1);
  ok('y al aplicarlo, dos vértices quedan pegados de verdad', (function(){
      if(!e1) return false;
      aplicaIman([tr]);
      var A=verts(tr), B=verts(h);
      return A.some(function(a){ return B.some(function(b){
        return Math.hypot(a.x-b.x,a.y-b.y)<1e-9; }); }); })());
  ok('el trapecio también engancha por el punto medio de su base larga', (function(){
      return IMAN[1].length===TIPOS[1].v.length+1; })(),
     IMAN[1].length+' puntos de enganche');
  ok('las demás piezas enganchan solo por sus vértices', (function(){
      return [0,2,3,4,5].every(function(t){ return IMAN[t].length===TIPOS[t].v.length; }); })());

  /* --- grupos ---------------------------------------------------------------- */
  piezas=[]; sel=[];
  var g1=nuevaPieza(0,{x:0,y:0}), g2=nuevaPieza(4,{x:U*2,y:0}), g3=nuevaPieza(3,{x:U*5,y:0});
  piezas=[g1,g2,g3];
  selecciona([g1.id,g2.id], false);
  agrupar();
  ok('agrupar marca las dos piezas con el mismo grupo', g1.g!==0 && g1.g===g2.g && g3.g===0);
  sel=[];
  selecciona([g1.id], false);
  ok('y al tocar una, se selecciona el grupo entero', sel.length===2 && sel.indexOf(g2.id)>=0);
  var x0=g2.x;
  mueve(seleccionadas(), 100, 0);
  ok('moviendo el grupo se mueven las dos', Math.abs(g2.x-x0-100)<1e-9 && Math.abs(g1.x-100)<1e-9);
  var y0=g3.y;
  ok('y la que no está en el grupo se queda quieta', Math.abs(g3.y-y0)<1e-9);
  desagrupar();
  ok('desagrupar las suelta', g1.g===0 && g2.g===0);

  /* --- simetría --------------------------------------------------------------- */
  piezas=[]; sel=[];
  var q1=nuevaPieza(1,{x:U*1.5,y:U*0.8});        // trapecio, el que tiene el eje a 90°
  piezas=[q1]; sel=[q1.id];
  var ejeX={A:{x:0,y:0}, B:{x:1,y:0}};           // el eje horizontal
  var r1=reflejaPieza(q1, ejeX.A, ejeX.B);
  ok('reflejar cambia el signo de la coordenada perpendicular al eje',
     Math.abs(r1.x-q1.x)<1e-9 && Math.abs(r1.y+q1.y)<1e-9);
  ok('la pieza reflejada es la misma pieza, no una nueva', (function(){
      /* los vértices de la reflejada tienen que coincidir uno a uno con los
         vértices espejados de la original */
      var A=verts(q1).map(function(v){ return {x:v.x, y:-v.y}; });
      var B=verts(r1);
      return A.every(function(a){ return B.some(function(b){
        return Math.hypot(a.x-b.x, a.y-b.y)<1e-6; }); }); })());
  ok('y eso vale para las seis piezas y para ejes en cualquier dirección', (function(){
      var malas=[];
      TIPOS.forEach(function(T,t){
        [0, 0.3, 1.1, -0.7].forEach(function(th){
          var p={id:1, t:t, x:37, y:-19, a:0.4, g:0};
          var E={A:{x:2,y:5}, B:{x:2+Math.cos(th), y:5+Math.sin(th)}};
          var r=reflejaPieza(p, E.A, E.B);
          var esp=verts(p).map(function(v){
            var dx=v.x-E.A.x, dy=v.y-E.A.y, c2=Math.cos(2*th), s2=Math.sin(2*th);
            return {x:E.A.x+dx*c2+dy*s2, y:E.A.y+dx*s2-dy*c2};
          });
          var vr=verts(r);
          var bien=esp.every(function(a){ return vr.some(function(b){
            return Math.hypot(a.x-b.x,a.y-b.y)<1e-6; }); });
          if(!bien) malas.push(T.n+' a '+grados(th)+'°');
        });
      });
      return malas.length===0; })());
  ok('el eje se ajusta a múltiplos de 15°', (function(){
      var E=ejeAjustado({x:0,y:0},{x:10,y:1.2});   // ~6,8°, se va a 0
      var g=grados(Math.atan2(E.B.y-E.A.y, E.B.x-E.A.x));
      return Math.abs(g/15-Math.round(g/15))<1e-9; })());
  ok('con el eje a 15k grados, una pieza en múltiplo de 30° sigue en múltiplo de 30°', (function(){
      var malas=0;
      TIPOS.forEach(function(T,t){
        for(var k=0;k<12;k++) for(var j=0;j<12;j++){
          var p={id:1,t:t,x:10,y:20,a:k*PASO,g:0};
          var th=j*Math.PI/12;
          var E={A:{x:0,y:0}, B:{x:Math.cos(th), y:Math.sin(th)}};
          var r=reflejaPieza(p,E.A,E.B);
          var v=r.a/PASO;
          if(Math.abs(v-Math.round(v))>1e-9) malas++;
        }
      });
      return malas===0; })());

  /* --- guardar y abrir --------------------------------------------------------- */
  piezas=[]; sel=[];
  var s1=nuevaPieza(0,{x:11,y:22}), s2=nuevaPieza(2,{x:-33,y:44});
  s1.a=PASO*5; s2.a=-PASO*2;
  piezas=[s1,s2];
  selecciona([s1.id,s2.id],false); agrupar();
  var firma=piezas.map(function(p){
    return p.t+':'+p.x.toFixed(2)+','+p.y.toFixed(2)+','+p.a.toFixed(4); }).join(' | ');
  var data={formato:'pattern-blocks', version:1,
    piezas:piezas.map(function(p){ return {t:p.t,x:p.x,y:p.y,a:p.a,g:p.g}; })};
  importMode='replace'; loadData(JSON.parse(JSON.stringify(data)));
  ok('guardar y volver a abrir conserva las piezas',
     piezas.map(function(p){
       return p.t+':'+p.x.toFixed(2)+','+p.y.toFixed(2)+','+p.a.toFixed(4); }).join(' | ')===firma);
  ok('y conserva los grupos', piezas.length===2 && piezas[0].g!==0 && piezas[0].g===piezas[1].g);
  var nA=piezas.length;
  importMode='add'; loadData(JSON.parse(JSON.stringify(data)));
  ok('el botón ＋ añade sin borrar lo que había', piezas.length===nA*2, piezas.length);
  ok('y los grupos añadidos no se mezclan con los de antes',
     piezas[0].g!==piezas[2].g, piezas.map(function(p){ return p.g; }).join(','));
  importMode='replace';
  ok('un archivo con una pieza inexistente se rechaza',
     limpiaPiezas([{t:9,x:0,y:0,a:0}])===null);
  ok('y uno con coordenadas que no son números, también',
     limpiaPiezas([{t:0,x:'ahí',y:0,a:0}])===null);

  /* --- deshacer ------------------------------------------------------------------ */
  piezas=[]; sel=[]; undoStack=[];
  var u1=nuevaPieza(0,{x:0,y:0}); piezas=[u1]; sel=[u1.id];
  pushUndo();
  mueve([u1], 200, 0);
  ok('mover cambia la posición', Math.abs(piezas[0].x-200)<1e-9);
  doUndo();
  ok('y deshacer la devuelve', Math.abs(piezas[0].x)<1e-9, num(piezas[0].x));

  piezas=antesP; sel=antesS; eje=antesE; opt.paso=antesOpt; undoStack=[]; draw();

  }catch(errT){
    fails++;
    out.push('FALLO se ha cortado aquí: '+((errT&&errT.message)||errT));
    if(errT&&errT.stack) String(errT.stack).split('\n').slice(0,5).forEach(function(l){
      out.push('        '+l.trim()); });
    try{ draw(); }catch(e2){}
  }

  /* --- informe --------------------------------------------------------------------- */
  var texto=out.join('\n')+'\n\n'+(fails? fails+' PRUEBAS FALLIDAS de '+out.length
                                         : 'LAS '+out.length+' PRUEBAS CORRECTAS');
  var box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;background:#fff;z-index:99;overflow:auto;padding:18px 22px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
  box.innerHTML='<div style="font:600 15px/1.3 -apple-system,Segoe UI,Roboto,sans-serif;margin-bottom:4px">'+
      'Autocomprobación de los pattern blocks</div>'+
    '<div style="font:13px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;color:'+(fails?'#c2410c':'#15803d')+';font-weight:600;margin-bottom:12px">'+
      (fails? fails+' pruebas fallidas de '+out.length : 'Las '+out.length+' pruebas correctas')+'</div>'+
    '<button id="cpTest" style="font:13px -apple-system,Segoe UI,Roboto,sans-serif;padding:6px 12px;margin-bottom:14px;'+
      'border:1px solid #d5d9e0;border-radius:7px;background:#fff;cursor:pointer">Copiar informe</button> '+
    '<button id="clTest" style="font:13px -apple-system,Segoe UI,Roboto,sans-serif;padding:6px 12px;margin-bottom:14px;'+
      'border:1px solid #d5d9e0;border-radius:7px;background:#fff;cursor:pointer">Cerrar y usar el manipulativo</button>'+
    '<pre style="white-space:pre-wrap;margin:0">'+
      out.map(function(l){ return l.indexOf('FALLO')===0
        ? '<span style="color:#c2410c;font-weight:700">'+l+'</span>' : l; }).join('\n')+'</pre>';
  document.body.appendChild(box);
  document.getElementById('cpTest').addEventListener('click',function(){
    var ta=document.createElement('textarea'); ta.value=texto; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); }catch(err){}
    document.body.removeChild(ta); this.textContent='Copiado ✓';
  });
  document.getElementById('clTest').addEventListener('click',function(){ box.remove(); });
}
var testLanzado=false;
function lanzarTest(){ if(testLanzado) return; testLanzado=true; runSelfTest(); }
if((location.hash||'').indexOf('test')>=0) setTimeout(lanzarTest,60);
window.addEventListener('hashchange',function(){
  if((location.hash||'').indexOf('test')>=0) lanzarTest();
});

window.__pattern={
  test:runSelfTest, TIPOS:TIPOS, U:U, PASO:PASO, AREAS:AREAS, AREA_TRI:AREA_TRI,
  piezas:function(){ return piezas; }, sel:function(){ return sel; },
  verts:verts, imanDe:imanDe, cajaDe:cajaDe, dentro:dentro,
  nuevaPieza:nuevaPieza, selecciona:selecciona, agrupar:agrupar, desagrupar:desagrupar,
  gira:gira, mueve:mueve, enganche:enganche, aplicaIman:aplicaIman,
  reflejaPieza:reflejaPieza, ejeAjustado:ejeAjustado, anguloEje:anguloEje,
  load:loadData, setMode:function(m){ importMode=m; }, redraw:draw, fit:fitView
};

})();
