<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Palotes numéricos · manipulativo virtual</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
       font-size:14px;color:#2b2f36;background:#fff;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #app{display:flex;height:100%;width:100%}

  #side{width:172px;flex:0 0 172px;background:#f4f5f7;border-right:1px solid #dfe2e7;
        overflow-y:auto;padding:10px 10px 24px}
  #side .brand{font-size:19px;font-weight:200;letter-spacing:.02em;color:#39404a;line-height:1.25;
               padding:2px 2px 10px;margin-bottom:11px;border-bottom:1px solid #e3e6eb}
  #side .brand b{font-weight:400;color:#2b2f36}
  #side .brand em{display:block;font-style:normal;font-size:10.5px;font-weight:400;letter-spacing:.07em;
                  text-transform:uppercase;color:#a2a9b4;margin-top:4px}
  #side h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8a919c;margin:14px 0 7px;font-weight:600}
  #palotes{display:flex;flex-direction:column;gap:4px}
  .pl{background:#fff;border:1px solid #e3e6eb;border-radius:7px;padding:3px 5px;cursor:grab;
      touch-action:none;display:flex;align-items:center;gap:6px;min-height:22px}
  .pl:hover{border-color:#b9c0ca;background:#fbfcfd}
  .pl:active{cursor:grabbing}
  .pl span{font-size:10.5px;font-weight:700;color:#6b7280;min-width:13px;text-align:right}
  .pl.mudo span{visibility:hidden}
  .pl svg{display:block}
  .act{display:block;width:100%;text-align:left;border:1px solid #e3e6eb;background:#fff;border-radius:7px;
       padding:6px 9px;margin-bottom:4px;font-size:12.5px;color:#3d4450;cursor:pointer}
  .act:hover:not(:disabled){background:#f0f2f5;border-color:#c8cdd6}
  .act:disabled{opacity:.42;cursor:default}
  .act kbd{float:right;font:inherit;font-size:10.5px;color:#9aa1ab}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:4px}
  .pair .act{margin:0;text-align:center;padding:6px 4px}
  select.sel{display:block;width:100%;border:1px solid #e3e6eb;background:#fff;border-radius:7px;
             padding:6px 7px;font:inherit;font-size:12.5px;color:#3d4450;cursor:pointer}
  select.sel:hover{border-color:#c8cdd6}
  #stats{font-size:11.5px;color:#6b7280;line-height:1.6;margin-top:12px;border-top:1px solid #e3e6eb;padding-top:9px}
  #stats b{color:#2b2f36}
  .note{font-size:10.5px;line-height:1.45;color:#8a919c;margin-top:12px}

  main{flex:1;display:flex;flex-direction:column;min-width:0}
  #toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:7px 9px;
           border-bottom:1px solid #dfe2e7;background:#fafbfc}
  .btn{border:1px solid #d5d9e0;background:#fff;border-radius:7px;padding:5px 9px;font-size:12.5px;
       color:#3d4450;cursor:pointer;display:inline-flex;align-items:center;gap:5px;line-height:1.2}
  .btn:hover:not(:disabled){background:#f0f2f5}
  .btn:disabled{opacity:.42;cursor:default}
  .btn.on{background:#2f62a8;border-color:#2f62a8;color:#fff}
  .btn.on:hover{background:#2a589a}
  .sep{width:1px;height:20px;background:#dfe2e7;margin:0 3px}
  .chk{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#4a515c;cursor:pointer;padding:3px 6px;border-radius:6px}
  .chk:hover{background:#eff1f4}
  .chk input{margin:0;cursor:pointer}
  select.btn{padding:5px 6px}
  #nliston{width:44px;height:26px;border:1px solid #d5d9e0;border-radius:7px;padding:2px 4px;font:inherit;font-size:12.5px;color:#3d4450}
  #avanzado{display:none;align-items:center;gap:5px}
  #avanzado.show{display:inline-flex}
  #stage{position:relative;flex:1;min-height:0;background:#fff}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #hint{position:absolute;left:10px;bottom:10px;background:rgba(28,32,38,.82);color:#fff;font-size:11.5px;
        padding:5px 10px;border-radius:14px;pointer-events:none;max-width:calc(100% - 20px)}
  #info{position:absolute;right:10px;top:10px;width:296px;max-height:calc(100% - 20px);overflow-y:auto;
        background:#fff;border:1px solid #dfe2e7;border-radius:10px;padding:11px 13px;font-size:11.5px;
        line-height:1.55;color:#4a515c;box-shadow:0 6px 22px rgba(20,25,35,.12);display:none}
  #info.show{display:block}
  #info b{color:#2b2f36}
  #info a{color:#2f62a8}
  #info .ref{margin-top:9px;padding-top:8px;border-top:1px solid #eef0f3;font-size:10.5px;line-height:1.5;color:#6b7280}
  #info .ref i{color:#4a515c}
  #info .lic{margin-top:9px;padding-top:8px;border-top:1px solid #eef0f3;font-size:10.5px;
             line-height:1.5;color:#8a919c}
  #drop{position:absolute;inset:0;background:rgba(47,98,168,.08);border:2px dashed #2f62a8;
        display:none;align-items:center;justify-content:center;font-size:15px;color:#2f62a8;font-weight:600}
  #drop.show{display:flex}
  @media (max-width:640px){
    #side{width:138px;flex:0 0 138px;padding:8px 6px}
    .btn{padding:5px 7px;font-size:12px}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand">Palotes <b>numéricos</b><em>Stick numbers</em></div>

    <h2>Palotes</h2>
    <div id="palotes"></div>

    <h2>Color</h2>
    <select class="sel" id="palsel" title="Con qué colores se pintan los palotes"></select>

    <h2>Palote seleccionado</h2>
    <button class="act" id="girar" disabled title="Ponerlo de pie, o volverlo a tumbar">⟲ Girar<kbd>R</kbd></button>
    <div class="pair">
      <button class="act" id="mas" disabled title="Encajarle un bloque más">＋ bloque</button>
      <button class="act" id="menos" disabled title="Quitarle un bloque">− bloque</button>
    </div>
    <button class="act" id="dup" disabled>Duplicar<kbd>D</kbd></button>
    <button class="act" id="borrar" disabled>Quitar<kbd>Supr</kbd></button>

    <h2>Colocación</h2>
    <button class="act" id="diez" title="Saca al tablero un palote de cada número, del 1 al 10">Sacar los diez</button>
    <button class="act" id="escalera" title="Ordena de menor a mayor, alineados por la salida">≡ Escalera</button>
    <button class="act" id="revolver" title="Los reparte por el tablero, sin orden">⁂ Desordenar</button>

    <div id="stats"></div>
    <div class="note">Arrastra un palote al tablero. Se encajan unos con otros: nunca se montan encima.</div>
  </aside>

  <main>
    <div id="toolbar">
      <button class="btn on" data-tool="move" title="Mover palotes (1)">✥ Mover</button>
      <button class="btn" data-tool="del" title="Quitar palotes (2)">✕ Quitar</button>
      <span class="sep"></span>
      <label class="chk" title="Dónde se escribe el número de cada palote">Nº
        <select class="btn" id="numsel" style="margin-left:2px">
          <option value="2">en el último bloque</option>
          <option value="1">en cada bloque</option>
          <option value="0">sin números</option>
        </select>
      </label>
      <span class="sep"></span>
      <label class="chk" title="Marca en el tablero la longitud que hay que alcanzar">Listón
        <input type="number" id="nliston" min="0" max="10" step="1" value="0">
      </label>
      <button class="btn" id="dadoListon" title="Poner el listón en un número al azar">🎲</button>
      <button class="btn" id="pegarListon" title="Pegar el listón a la salida de los palotes que hay">⇤ Pegar</button>
      <button class="btn on" data-ori="h" title="Trabajar en horizontal: los palotes tumbados, en filas, y el listón de pie (H)">↔</button>
      <button class="btn" data-ori="v" title="Trabajar en vertical: los palotes de pie, en columnas, y el listón tumbado (V)">↕</button>
      <span class="sep"></span>
      <button class="btn" id="undo" title="Deshacer (Ctrl+Z)">↶</button>
      <label class="chk" title="Muestra herramientas de comprobación"><input type="checkbox" id="avz">Comprobaciones</label>
      <span id="avanzado">
        <label class="chk" title="Escribe al final de cada fila o columna cuántos bloques hay en ella. Déjalo apagado mientras la cuenta sea lo que hay que averiguar."><input type="checkbox" id="chksumas">Σ Bloques de cada línea</label>
      </span>
      <span class="sep"></span>
      <label class="chk"><input type="checkbox" id="showgrid" checked>Retícula</label>
      <button class="btn" id="zoomout">−</button>
      <button class="btn" id="zoomin">+</button>
      <button class="btn" id="fit">Ajustar</button>
      <span class="sep"></span>
      <button class="btn" id="save" title="Descargar en un archivo">⤓ Guardar</button>
      <button class="btn" id="open" title="Abrir un archivo guardado">⤒ Abrir</button>
      <button class="btn" id="add" title="Añadir el contenido de un archivo a lo que ya hay">＋</button>
      <button class="btn" id="png" title="Descargar imagen">⤓ PNG</button>
      <button class="btn" id="clear">Limpiar</button>
      <button class="btn" id="help">?</button>
      <input type="file" id="fileIn" accept=".json,application/json" style="display:none">
    </div>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="hint"></div>
      <div id="info"></div>
      <div id="drop">Suelta aquí el archivo de palotes</div>
    </div>
  </main>
</div>

<script>
"use strict";
(function(){

/* =========================================================================
   1. LA IDEA / LAS PIEZAS
   Los number sticks de Baroody (1993) son barras SEGMENTADAS, coloreadas y
   numeradas, hechas con cubos encajables: el palote del 4 son cuatro bloques
   pegados con el numeral 4 escrito en el ÚLTIMO. Esa es toda la geometría del
   material y condiciona el archivo entero:

   · Es un modelo de cantidad DISCRETA, no continua. Cada palote se ve dividido
     en n bloques del tamaño de la unidad, así que se puede contar. Una regleta
     Cuisenaire es una barra lisa donde el número solo está codificado en la
     longitud y el color; aquí el número está a la vista.
   · El numeral va en el último bloque, no en el centro, porque es el principio
     de cardinalidad: la palabra que se dice al contar el último objeto es la
     que dice cuántos hay.
   · Por eso el palote del n ocupa exactamente n casillas CONSECUTIVAS de la
     retícula, y las casillas son enteras. Todo se hace con aritmética entera.
   · Los bloques son macizos: dos palotes nunca se montan uno encima de otro.
     Al soltar, el imán busca el hueco libre más cercano, lo que hace que los
     palotes se peguen de canto solos.

   ORIENTACIÓN. Un palote se puede tumbar (crece hacia la derecha) o poner de
   pie (crece hacia arriba). No es simétrico, y la asimetría es la del conteo:

   · Tumbado, se cuenta de izquierda a derecha y el numeral queda a la derecha.
   · De pie, se cuenta de abajo arriba —como se levanta una torre de cubos— y
     el numeral queda ARRIBA. Poner el número abajo sería decir que la cuenta
     acaba en el suelo.
   · (x,y) es siempre la casilla de arriba a la izquierda de la caja, así que el
     bloque donde empieza la cuenta es (x,y) tumbado y (x,y+n-1) de pie.
   · Girar mantiene quieto ese bloque de inicio: el palote se pone de pie sobre
     su propio extremo, como se levanta un palo del suelo. Así, girar dos veces
     lo deja exactamente donde estaba, y un palote apoyado en una línea de
     salida sigue apoyado en ella después de girarlo.

   PALETAS. El color no es parte de la matemática, y por eso se puede cambiar o
   quitar: es la variable didáctica del material. Las cuatro primeras dan diez
   colores distintos, uno por número, y solo se diferencian en el aire que
   tienen: se elige la que mejor se lea en la pantalla o el proyector de cada
   clase. Las de regletas van después de ellas porque tienen un efecto añadido:
   puestas así, al comparar los dos materiales lo único que queda a la vista es
   lo que importa (la segmentación y el numeral). Y las dos últimas ya no son
   decorativas: una codifica la paridad en el color y la otra lo apaga del todo
   para que solo quede contar.
   ========================================================================= */
var MAXN=10, CELL=36;
var PALETAS=[
  /* diez colores muy saturados y variados: la que mejor aguanta un proyector
     flojo, y por eso la de por defecto */
  {id:'vivos', nombre:'vivos', colores:
    ['#f0913a','#b7c4e2','#f2d33f','#a9d18e','#e03a30',
     '#35bcc9','#f2a7b8','#2e9e4b','#5b3f97','#1f5fb0']},
  /* los diez tonos del círculo repartidos de 36 en 36 grados, en suave */
  {id:'pastel', nombre:'pastel', colores:
    ['#f4a9a0','#f4c9a0','#eee6a0','#c9e6a0','#a0e6b0',
     '#a0e0e0','#a0c4ea','#b8a8e8','#e2a8e2','#f0a8c8']},
  /* los mismos diez tonos en oscuro, para fondo claro y mucha luz ambiente */
  {id:'intensos', nombre:'intensos', colores:
    ['#b02a25','#d2691e','#9a7d0a','#4f7f1f','#127a4b',
     '#0f6f7a','#1f5fb0','#4b3f9e','#7d2f9e','#a8265f']},
  /* la escala de grises: distingue los diez sin usar color, así que vale para
     imprimir en blanco y negro y para quien no distingue tonos */
  {id:'grises', nombre:'grises', colores:
    ['#f2f3f5','#dcdfe4','#c3c8d0','#a9b0bb','#8f97a5',
     '#757e8d','#5c6675','#454e5c','#2f3742','#1b2129']},
  /* los colores de las regletas Cuisenaire */
  {id:'regletas', nombre:'regletas', colores:
    ['#fdfdfb','#e0322a','#6cbf5a','#e88bb4','#f2ce2b',
     '#2e8b46','#26262a','#8a5b3a','#2f62c8','#ef8b25']},
  /* azul y naranja: el par que se sigue distinguiendo con cualquier tipo de
     daltonismo */
  {id:'paridad', nombre:'pares e impares', colores:
    ['#ef8b25','#2f62c8','#ef8b25','#2f62c8','#ef8b25',
     '#2f62c8','#ef8b25','#2f62c8','#ef8b25','#2f62c8']},
  {id:'lisa', nombre:'un solo color', colores:
    ['#d8dce3','#d8dce3','#d8dce3','#d8dce3','#d8dce3',
     '#d8dce3','#d8dce3','#d8dce3','#d8dce3','#d8dce3']}
];
function paleta(id){
  for(var i=0;i<PALETAS.length;i++) if(PALETAS[i].id===id) return PALETAS[i];
  return PALETAS[0];
}

/* =========================================================================
   2. ESTADO
   ========================================================================= */
var pieces=[], nid=1, sel=null;
var tool='move';
var view={x:0,y:0,z:1};
var drag=null, undoStack=[], importMode='replace';
/* El listón tiene coordenada PROPIA. La primera versión lo anclaba al palote
   más a la izquierda y se iba con él al moverlo: parecía que el listón se
   estropeaba solo. Ahora es un objeto más del tablero, se arrastra y solo se
   mueve si se le mueve. `s` es la línea de salida: la columna de la que arranca
   tumbado, o la fila sobre la que se apoya de pie. */
var liston={n:0, s:0};
/* num: 2 numeral al final · 1 numerar cada bloque · 0 sin numerales
   pal: nombre de la paleta · vert: se trabaja de pie
   sumas: escribe los bloques de cada línea. Empieza APAGADO: es la respuesta. */
var opt={grid:1, num:2, pal:PALETAS[0].id, vert:0, sumas:0};

var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var stage=document.getElementById('stage');
var hintEl=document.getElementById('hint'), infoEl=document.getElementById('info');
var dropEl=document.getElementById('drop'), statsEl=document.getElementById('stats');
var flashMsg=null, flashT=0;

function K(x,y){ return x+','+y; }
function byId(id){ for(var i=0;i<pieces.length;i++) if(pieces[i].id===id) return pieces[i]; return null; }
function pushUndo(){
  undoStack.push(JSON.stringify({p:pieces, n:nid, l:liston}));
  if(undoStack.length>80) undoStack.shift();
}
function doUndo(){
  if(!undoStack.length){ flash('No hay nada que deshacer'); return; }
  var st=JSON.parse(undoStack.pop());
  pieces=st.p; nid=st.n; if(st.l) liston=st.l;
  sel=null; sincronizaListon(); draw();
}
function flash(m){ flashMsg=m; flashT=Date.now(); draw(); setTimeout(draw,2100); }

/* =========================================================================
   3. GEOMETRÍA
   Todo en coordenadas de mundo (casillas enteras). Un palote es {n,x,y,v} y
   (x,y) es siempre su casilla de arriba a la izquierda.
   ========================================================================= */
function ancho(p){ return p.v ? 1 : p.n; }
function alto(p){ return p.v ? p.n : 1; }
function celdas(p){
  var cs=[], i;
  if(p.v){ for(i=0;i<p.n;i++) cs.push({x:p.x, y:p.y+i}); }
  else   { for(i=0;i<p.n;i++) cs.push({x:p.x+i, y:p.y}); }
  return cs;
}
/* el bloque k de la cuenta (k = 1…n): tumbado se cuenta hacia la derecha, de
   pie hacia arriba, que es como se levanta una torre de cubos */
function bloque(p,k){
  return p.v ? {x:p.x, y:p.y+p.n-k} : {x:p.x+k-1, y:p.y};
}
function celdaInicio(p){ return bloque(p,1); }
/* el numeral va en el último bloque de la cuenta: cardinalidad */
function celdaNumeral(p){ return bloque(p,p.n); }
/* girar deja quieto el bloque de inicio: el palote se levanta sobre su extremo */
function girado(p){
  var i=celdaInicio(p);
  return p.v ? {n:p.n, x:i.x, y:i.y, v:0}
             : {n:p.n, x:i.x, y:i.y-p.n+1, v:1};
}

function ocupadas(lista,excepto){
  var m={};
  for(var i=0;i<lista.length;i++){
    var p=lista[i]; if(p.id===excepto) continue;
    var cs=celdas(p);
    for(var j=0;j<cs.length;j++) m[K(cs[j].x,cs[j].y)]=p.id;
  }
  return m;
}
function libre(lista,q,excepto){
  var m=ocupadas(lista,excepto), cs=celdas(q);
  for(var i=0;i<cs.length;i++) if(m[K(cs[i].x,cs[i].y)]) return false;
  return true;
}
/* El imán. Los desplazamientos candidatos se recorren de menor a mayor coste,
   con el (0,0) el primero de todos, y se devuelve un OBJETO (o null): guardar
   el mejor desplazamiento en un número haría que un encaje perfecto valiese 0,
   que en JavaScript es falso, y cualquier candidato peor lo pisaría.
   Salirse de la línea cuesta once casillas. La línea es la unidad de trabajo
   —una fila es una suma, una descomposición, un piso de la torre—, así que un
   palote soltado encima de otro tiene que salir de canto por el lado y quedarse
   donde estaba. Y como la línea de un palote de pie es su columna, la tabla de
   un palote de pie es la del tumbado con los ejes cambiados. */
function tablaOffsets(alo,atr){
  var a=[], da, dt;
  for(dt=-atr;dt<=atr;dt++) for(da=-alo;da<=alo;da++)
    a.push({a:da, t:dt, coste:Math.abs(da)+11*Math.abs(dt)});
  a.sort(function(p,q){ return p.coste-q.coste || Math.abs(p.t)-Math.abs(q.t) || p.a-q.a; });
  return a;
}
var OFF_H=tablaOffsets(22,10), OFF_V=tablaOffsets(22,10);
function hueco(lista,q,excepto){
  var m=ocupadas(lista,excepto), tabla=q.v?OFF_V:OFF_H;
  for(var k=0;k<tabla.length;k++){
    var dc = q.v ? tabla[k].t : tabla[k].a;
    var dr = q.v ? tabla[k].a : tabla[k].t;
    var cand={n:q.n, x:q.x+dc, y:q.y+dr, v:q.v}, cs=celdas(cand), bien=true;
    for(var i=0;i<cs.length;i++) if(m[K(cs[i].x,cs[i].y)]){ bien=false; break; }
    if(bien) return {x:cand.x, y:cand.y};
  }
  return null;
}
function caja(){
  if(!pieces.length) return null;
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  pieces.forEach(function(p){
    x0=Math.min(x0,p.x); x1=Math.max(x1,p.x+ancho(p));
    y0=Math.min(y0,p.y); y1=Math.max(y1,p.y+alto(p));
  });
  return {x0:x0*CELL, y0:y0*CELL, x1:x1*CELL, y1:y1*CELL};
}
/* Cuántos bloques hay en cada línea de trabajo. Los tumbados se agrupan por
   fila y la cuenta se escribe al final de la fila; los de pie se agrupan por
   columna y se escribe encima. Un tablero mezclado da las dos cosas, cada una
   con su grupo, que es lo honesto: son dos cuentas distintas. */
function totalesH(lista){
  var m={};
  lista.forEach(function(p){
    if(p.v) return;
    if(!m[p.y]) m[p.y]={t:0, x1:-1e9};
    m[p.y].t+=p.n; m[p.y].x1=Math.max(m[p.y].x1, p.x+p.n);
  });
  return m;
}
function totalesV(lista){
  var m={};
  lista.forEach(function(p){
    if(!p.v) return;
    if(!m[p.x]) m[p.x]={t:0, y0:1e9};
    m[p.x].t+=p.n; m[p.x].y0=Math.min(m[p.x].y0, p.y);
  });
  return m;
}
/* la salida de lo que hay puesto: la columna de la que arrancan los tumbados,
   o la fila sobre la que se apoyan los de pie */
function salidaDe(lista,vert){
  if(!lista.length) return 0;
  var s;
  if(!vert){ s=1e9; lista.forEach(function(p){ s=Math.min(s,p.x); }); }
  else     { s=-1e9; lista.forEach(function(p){ s=Math.max(s,p.y+alto(p)); }); }
  return s;
}

/* =========================================================================
   4. ACCIONES
   ========================================================================= */
function nueva(n,x,y,v){
  var p={id:nid++, n:n, x:x, y:y, v:v?1:0}; pieces.push(p); return p;
}
function ponerEnHueco(n,x,y,v){
  var h=hueco(pieces,{n:n,x:x,y:y,v:v?1:0},null);
  if(!h){ flash('No hay hueco para ese palote'); return null; }
  return nueva(n,h.x,h.y,v);
}
function moverSel(dx,dy){
  if(sel==null){ flash('Selecciona antes un palote'); return false; }
  var p=byId(sel); if(!p) return false;
  if(!libre(pieces,{n:p.n,x:p.x+dx,y:p.y+dy,v:p.v},p.id)){ flash('Ahí ya hay otro palote'); return false; }
  pushUndo(); p.x+=dx; p.y+=dy; draw(); return true;
}
function girarSel(){
  if(sel==null){ flash('Selecciona antes un palote'); return false; }
  var p=byId(sel); if(!p) return false;
  var g=girado(p);
  if(!libre(pieces,g,p.id)){
    var h=hueco(pieces,g,p.id);
    if(!h){ flash('No hay sitio para girarlo'); return false; }
    g.x=h.x; g.y=h.y;
  }
  pushUndo(); p.x=g.x; p.y=g.y; p.v=g.v; draw(); return true;
}
/* Construir el palote encajando bloques, que es como se hace con los cubos de
   verdad. Crece hacia donde está el numeral —a la derecha tumbado, arriba de
   pie— y, si ese lado está tomado, por el otro. */
function cambiaBloques(d){
  if(sel==null){ flash('Selecciona antes un palote'); return false; }
  var p=byId(sel); if(!p) return false;
  var n=p.n+d;
  if(n<1){ flash('Un palote no puede tener menos de un bloque'); return false; }
  if(n>MAXN){ flash('Los palotes llegan hasta el '+MAXN); return false; }
  if(d<0){
    /* al encoger desaparece el bloque del numeral y el de inicio se queda */
    pushUndo(); p.n=n; if(p.v) p.y+=1; draw(); return true;
  }
  var haciaNumeral = p.v ? {n:n, x:p.x, y:p.y-1, v:1} : {n:n, x:p.x, y:p.y, v:0};
  var haciaInicio  = p.v ? {n:n, x:p.x, y:p.y,   v:1} : {n:n, x:p.x-1, y:p.y, v:0};
  if(libre(pieces,haciaNumeral,p.id)){ pushUndo(); p.n=n; p.x=haciaNumeral.x; p.y=haciaNumeral.y; draw(); return true; }
  if(libre(pieces,haciaInicio,p.id)){  pushUndo(); p.n=n; p.x=haciaInicio.x;  p.y=haciaInicio.y;  draw(); return true; }
  flash('No cabe otro bloque: está encajonado');
  return false;
}
function duplicar(){
  if(sel==null){ flash('Selecciona antes un palote'); return; }
  var p=byId(sel); if(!p) return;
  /* el duplicado sale a la línea de al lado: debajo si está tumbado, al lado
     si está de pie */
  var dx=p.v?1:0, dy=p.v?0:1;
  var h=hueco(pieces,{n:p.n,x:p.x+dx,y:p.y+dy,v:p.v},null);
  if(!h){ flash('No hay hueco para el duplicado'); return; }
  pushUndo();
  var q=nueva(p.n,h.x,h.y,p.v); sel=q.id; draw();
}
function quitarSel(){
  if(sel==null) return;
  pushUndo();
  pieces=pieces.filter(function(p){ return p.id!==sel; });
  sel=null; draw();
}
/* La escalera arranca del rincón de origen: tumbada, los palotes salen del
   x=0 hacia la derecha; de pie, se apoyan en y=0 y suben. Así la línea de
   salida es la misma en los dos casos y el listón vale para las dos. */
function colocaEscalera(lista,vert){
  lista.forEach(function(p,i){
    p.v=vert?1:0;
    if(vert){ p.x=i; p.y=-p.n; }
    else    { p.x=0; p.y=i; }
  });
}
function sacarLosDiez(){
  pushUndo();
  for(var n=1;n<=MAXN;n++){
    var q = opt.vert ? {n:n, x:n-1, y:-n, v:1} : {n:n, x:0, y:n-1, v:0};
    var h=hueco(pieces,q,null);
    if(h) nueva(n,h.x,h.y,opt.vert);
  }
  sel=null; fitView();
}
function escalera(){
  if(!pieces.length){ flash('No hay palotes que ordenar'); return; }
  pushUndo();
  var orden=pieces.slice().sort(function(a,b){ return a.n-b.n || a.id-b.id; });
  colocaEscalera(orden,opt.vert);
  pieces=orden; sel=null; fitView();
}
/* Repartirlos sin orden es lo que pide el juego de buscar un número concreto:
   con la escalera hecha, encontrarlo no tiene ninguna gracia. */
function desordenar(){
  if(!pieces.length){ flash('No hay palotes que desordenar'); return; }
  pushUndo();
  var lista=pieces.slice();
  for(var i=lista.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1)), t=lista[i]; lista[i]=lista[j]; lista[j]=t;
  }
  var puestos=[];
  lista.forEach(function(p){
    var x,y;
    if(p.v){ x=Math.floor(Math.random()*14); y=-(1+Math.floor(Math.random()*12))-p.n+1; }
    else   { x=Math.floor(Math.random()*14)-1; y=Math.floor(Math.random()*12); }
    var h=hueco(puestos,{n:p.n,x:x,y:y,v:p.v},null);
    if(!h) h={x:x, y:y};
    p.x=h.x; p.y=h.y; puestos.push(p);
  });
  pieces=puestos; sel=null; fitView();
}
function pegarListon(){
  if(!pieces.length){ flash('No hay palotes a los que pegar el listón'); return; }
  liston.s=salidaDe(pieces,opt.vert);
  flash('Listón pegado a la salida de los palotes'); draw();
}

/* =========================================================================
   5. DIBUJO
   ========================================================================= */
function w2s(p){ return {x:p.x*view.z+view.x, y:p.y*view.z+view.y}; }
function s2w(p){ return {x:(p.x-view.x)/view.z, y:(p.y-view.y)/view.z}; }
function celda(wp){ return {x:Math.floor(wp.x/CELL), y:Math.floor(wp.y/CELL)}; }
function resize(){
  var r=stage.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  cv.width=Math.max(1,Math.round(r.width*dpr)); cv.height=Math.max(1,Math.round(r.height*dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0);
  /* la bandeja solo se rehace si de verdad le ha cambiado la unidad: rehacerla
     en cada evento de resize tiraría los escuchadores de los diez botones */
  if(unidadBandeja()!==uBandeja) pintaBandeja();
  draw();
}
function shade(hex,f){
  var h=(hex||'#888888').replace('#',''); if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var r=parseInt(h.substr(0,2),16), g=parseInt(h.substr(2,2),16), b=parseInt(h.substr(4,2),16);
  r=Math.round(r+(f>0?(255-r)*f:r*f)); g=Math.round(g+(f>0?(255-g)*f:g*f)); b=Math.round(b+(f>0?(255-b)*f:b*f));
  return 'rgb('+r+','+g+','+b+')';
}
function lum(hex){
  var h=(hex||'#888888').replace('#','');
  return 0.299*parseInt(h.substr(0,2),16)+0.587*parseInt(h.substr(2,2),16)+0.114*parseInt(h.substr(4,2),16);
}
function colorDe(n){ return paleta(opt.pal).colores[n-1]; }
function tintaSobre(col){ return lum(col)>140 ? '#1f2329' : '#ffffff'; }

function roundRect(c,x,y,w,h,r){
  r=Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y);
  c.closePath();
}
function drawGrid(c,W,H){
  var s=CELL*view.z; if(s<10) return;
  var x0=((view.x%s)+s)%s, y0=((view.y%s)+s)%s;
  c.save(); c.strokeStyle='#e6e9ee'; c.lineWidth=1; c.beginPath();
  for(var x=x0;x<W;x+=s){ c.moveTo(Math.round(x)+.5,0); c.lineTo(Math.round(x)+.5,H); }
  for(var y=y0;y<H;y+=s){ c.moveTo(0,Math.round(y)+.5); c.lineTo(W,Math.round(y)+.5); }
  c.stroke(); c.restore();
}
function drawPalote(c,p,seleccionada){
  var col=colorDe(p.n);
  var x=p.x*CELL, y=p.y*CELL, an=ancho(p)*CELL, al=alto(p)*CELL, i;
  if(!isFinite(x)||!isFinite(y)||!isFinite(an)||!isFinite(al)) return;
  c.save();
  roundRect(c, x+1, y+1, an-2, al-2, 6);
  c.fillStyle=col; c.fill();
  /* las separaciones entre bloques: sin ellas esto sería una regleta */
  if(p.n>1){
    c.beginPath();
    for(i=1;i<p.n;i++){
      if(p.v){ c.moveTo(x+3, y+i*CELL); c.lineTo(x+an-3, y+i*CELL); }
      else   { c.moveTo(x+i*CELL, y+3); c.lineTo(x+i*CELL, y+al-3); }
    }
    c.lineWidth=1.7; c.strokeStyle=shade(col,-0.30); c.stroke();
  }
  roundRect(c, x+1, y+1, an-2, al-2, 6);
  c.lineWidth=2; c.strokeStyle=shade(col,-0.42); c.stroke();
  /* numerales */
  if(opt.num){
    c.fillStyle=tintaSobre(col);
    c.textAlign='center'; c.textBaseline='middle';
    if(opt.num===2){
      var cn=celdaNumeral(p);
      c.font='700 '+Math.round(CELL*0.56)+'px -apple-system,Segoe UI,Roboto,sans-serif';
      c.fillText(String(p.n), cn.x*CELL+CELL/2, cn.y*CELL+CELL/2+1);
    }else{
      c.font='700 '+Math.round(CELL*0.36)+'px -apple-system,Segoe UI,Roboto,sans-serif';
      for(i=1;i<=p.n;i++){
        var b=bloque(p,i);
        c.fillText(String(i), b.x*CELL+CELL/2, b.y*CELL+CELL/2+1);
      }
    }
  }
  c.restore();
  if(seleccionada){
    c.save(); c.setLineDash([6/view.z,4/view.z]); c.lineWidth=2/view.z; c.strokeStyle='#2f62a8';
    c.strokeRect(x-5, y-5, an+10, al+10); c.restore();
  }
}
/* El listón: la longitud que hay que alcanzar. Tumbado es una franja vertical
   que arranca de su línea de salida; de pie, una franja horizontal que se
   apoya en ella y sube. Se dibuja en coordenadas de pantalla para que ocupe
   todo el alto (o el ancho) del tablero por mucho que se desplace la vista. */
function bordesListon(){
  if(!(liston.n>0)) return null;
  if(!opt.vert) return [liston.s*CELL*view.z+view.x, (liston.s+liston.n)*CELL*view.z+view.x];
  return [liston.s*CELL*view.z+view.y, (liston.s-liston.n)*CELL*view.z+view.y];
}
function drawListon(c,W,H){
  var b=bordesListon(); if(!b) return;
  if(!isFinite(b[0])||!isFinite(b[1])) return;
  var lo=Math.min(b[0],b[1]), hi=Math.max(b[0],b[1]);
  c.save();
  c.fillStyle='rgba(239,139,37,.075)';
  if(!opt.vert) c.fillRect(lo,0,hi-lo,H); else c.fillRect(0,lo,W,hi-lo);
  c.setLineDash([7,5]); c.lineWidth=1.6; c.strokeStyle='rgba(206,112,20,.85)';
  c.beginPath();
  if(!opt.vert){
    c.moveTo(Math.round(b[0])+.5,0); c.lineTo(Math.round(b[0])+.5,H);
    c.moveTo(Math.round(b[1])-.5,0); c.lineTo(Math.round(b[1])-.5,H);
  }else{
    c.moveTo(0,Math.round(b[0])-.5); c.lineTo(W,Math.round(b[0])-.5);
    c.moveTo(0,Math.round(b[1])+.5); c.lineTo(W,Math.round(b[1])+.5);
  }
  c.stroke(); c.setLineDash([]);
  /* la etiqueta, junto al borde lejano: es el número que hay que alcanzar */
  var tw=28, th=22, tx, ty;
  if(!opt.vert){ tx=Math.min(W-tw-6, Math.max(6, b[1]-tw-6)); ty=6; }
  else         { tx=6; ty=Math.min(H-th-6, Math.max(6, b[1]+6)); }
  roundRect(c, tx, ty, tw, th, 5);
  c.fillStyle='rgba(206,112,20,.92)'; c.fill();
  c.fillStyle='#fff'; c.font='700 13px -apple-system,Segoe UI,Roboto,sans-serif';
  c.textAlign='center'; c.textBaseline='middle';
  c.fillText(String(liston.n), tx+tw/2, ty+th/2);
  c.restore();
}
function escena(c,W,H,paraExportar){
  c.save();
  if(opt.grid && !paraExportar) drawGrid(c,W,H);
  drawListon(c,W,H);
  c.translate(view.x,view.y); c.scale(view.z,view.z);
  pieces.forEach(function(p){ drawPalote(c,p,!paraExportar && p.id===sel); });
  /* el fantasma enseña dónde va a encajar el palote que se está arrastrando */
  if(drag && drag.mode==='move' && drag.landing && !paraExportar){
    var p2=byId(drag.id);
    if(p2 && (drag.landing.x!==p2.x || drag.landing.y!==p2.y)){
      c.save(); c.setLineDash([5,4]); c.lineWidth=2; c.strokeStyle='#2f62a8';
      c.strokeRect(drag.landing.x*CELL+1, drag.landing.y*CELL+1,
                   ancho(p2)*CELL-2, alto(p2)*CELL-2);
      c.restore();
    }
  }
  /* Los bloques de cada línea: es la respuesta a la suma que se esté montando,
     así que solo se pinta si está encendida la casilla de Comprobaciones. */
  if(opt.sumas){
    c.save();
    c.font='700 '+Math.round(CELL*0.42)+'px -apple-system,Segoe UI,Roboto,sans-serif';
    c.textBaseline='middle';
    function pastilla(tx,px,py,centrada){
      var an=c.measureText(tx).width+12;
      /* fondo opaco primero: si no, la raya del listón atraviesa la pastilla */
      roundRect(c, px-(centrada?an/2:5), py-12, an, 24, 6);
      c.fillStyle='#fff'; c.fill();
      c.fillStyle='rgba(47,98,168,.10)'; c.fill();
      c.fillStyle='#2f62a8'; c.textAlign=centrada?'center':'left';
      c.fillText(tx, centrada?px:px+1, py);
    }
    var mh=totalesH(pieces);
    Object.keys(mh).forEach(function(k){
      pastilla('= '+mh[k].t, mh[k].x1*CELL+11, (+k)*CELL+CELL/2+1, false);
    });
    var mv=totalesV(pieces);
    Object.keys(mv).forEach(function(k){
      pastilla('= '+mv[k].t, (+k)*CELL+CELL/2, mv[k].y0*CELL-16, true);
    });
    c.restore();
  }
  c.restore();
}
/* --- el tirador de giro, junto al palote seleccionado --------------------
   Se dibuja en coordenadas de pantalla y FUERA de escena(), así que no sale en
   el PNG que se descarga: es un mando, no parte del material. Aquí solo hay uno,
   porque un palote solo tiene dos posturas: girar es de 90 en 90 y no hay
   sentido horario ni antihorario que distinguir. */
function cajaPantalla(p){
  return {x0:p.x*CELL*view.z+view.x,
          y0:p.y*CELL*view.z+view.y,
          x1:(p.x+ancho(p))*CELL*view.z+view.x,
          y1:(p.y+alto(p))*CELL*view.z+view.y};
}
function tirador(){
  if(sel==null || tool!=='move') return null;
  var p=byId(sel); if(!p) return null;
  var W=cv.width/(window.devicePixelRatio||1);
  var c=cajaPantalla(p), R=14;
  var x=c.x1+R+12;
  if(x+R>W-6) x=c.x0-R-12;          // si no cabe a la derecha, al otro lado
  /* La flecha señala hacia dónde va a girar de verdad. El palote pivota sobre el
     bloque donde empieza la cuenta, así que uno tumbado se levanta llevando su
     punta de las 3 a las 12 —a la izquierda— y uno de pie se tumba al contrario. */
  return {x:x, y:(c.y0+c.y1)/2, r:R, s:(p.v?'↻':'↺')};
}
function dibujaTirador(c){
  var t=tirador(); if(!t) return;
  if(!isFinite(t.x)||!isFinite(t.y)) return;
  c.save();
  c.beginPath(); c.arc(t.x,t.y,t.r,0,6.2832);
  c.fillStyle='#fff'; c.fill();
  c.lineWidth=1.8; c.strokeStyle='#2f62a8'; c.stroke();
  c.fillStyle='#2f62a8'; c.font='700 17px -apple-system,Segoe UI,Roboto,sans-serif';
  c.textAlign='center'; c.textBaseline='middle';
  c.fillText(t.s, t.x, t.y+1);
  c.restore();
}
function enTirador(sp){
  var t=tirador(); if(!t) return false;
  return Math.hypot(sp.x-t.x, sp.y-t.y) <= t.r+3;
}
function draw(){
  var W=cv.width/(window.devicePixelRatio||1), H=cv.height/(window.devicePixelRatio||1);
  ctx.clearRect(0,0,W,H); ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  escena(ctx,W,H,false);
  dibujaTirador(ctx);
  updateUI();
}

/* =========================================================================
   6. INTERACCIÓN
   ========================================================================= */
function evPos(e){ var r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
function paloteEn(g){
  for(var i=pieces.length-1;i>=0;i--){
    var p=pieces[i];
    if(p.v){ if(p.x===g.x && g.y>=p.y && g.y<p.y+p.n) return p; }
    else   { if(p.y===g.y && g.x>=p.x && g.x<p.x+p.n) return p; }
  }
  return null;
}
/* ¿el puntero está sobre una de las rayas del listón? */
function enBordeListon(sp){
  var b=bordesListon(); if(!b) return false;
  var v = opt.vert ? sp.y : sp.x;
  return Math.abs(v-b[0])<=9 || Math.abs(v-b[1])<=9;
}
function alFrente(id){
  var i=-1; for(var k=0;k<pieces.length;k++) if(pieces[k].id===id){ i=k; break; }
  if(i>=0) pieces.push(pieces.splice(i,1)[0]);
}
function onDown(e){
  /* Capturar el puntero es una comodidad —que el arrastre siga funcionando si el
     ratón se sale del lienzo—, no un requisito. Y lanza NotFoundError si el
     pointerId no es de un puntero activo, que es justo lo que pasa con un evento
     sintético: sin el try, un clic simulado mataba onDown en su primera línea y
     el manipulativo se quedaba sin poder probarse con el ratón. */
  try { cv.setPointerCapture && cv.setPointerCapture(e.pointerId); } catch(err){}
  var sp=evPos(e), g=celda(s2w(sp)), p=paloteEn(g);
  /* el tirador se comprueba ANTES que los palotes: cae por fuera del palote
     seleccionado, pero puede quedar encima de otro y ese se llevaría el clic */
  if(tool==='move' && enTirador(sp)){ girarSel(); return; }
  if(tool==='del'){
    if(p){ pushUndo(); pieces=pieces.filter(function(q){ return q!==p; }); if(sel===p.id) sel=null; }
    draw(); return;
  }
  if(p){
    sel=p.id; alFrente(p.id);
    drag={mode:'move', id:p.id, from:g, base:{x:p.x,y:p.y}, movido:false, landing:{x:p.x,y:p.y}};
    draw(); return;
  }
  /* el listón se arrastra por cualquiera de sus dos rayas */
  if(enBordeListon(sp)){
    var w=s2w(sp);
    sel=null;
    drag={mode:'liston', s0:liston.s, w0:(opt.vert?w.y:w.x), movido:false};
    draw(); return;
  }
  sel=null;
  drag={mode:'pan', sp:sp, v0:{x:view.x,y:view.y}};
  draw();
}
function onMove(e){
  var sp=evPos(e);
  if(!drag){
    /* el cursor avisa de que la raya del listón se puede coger */
    if(tool==='move'){
      var g0=celda(s2w(sp));
      if(enTirador(sp)) cv.style.cursor='pointer';
      else cv.style.cursor = (!paloteEn(g0) && enBordeListon(sp))
        ? (opt.vert?'row-resize':'col-resize') : 'default';
    }
    return;
  }
  if(drag.mode==='pan'){ view.x=drag.v0.x+(sp.x-drag.sp.x); view.y=drag.v0.y+(sp.y-drag.sp.y); draw(); return; }
  if(drag.mode==='liston'){
    var w=s2w(sp), d=Math.round(((opt.vert?w.y:w.x)-drag.w0)/CELL);
    if(!drag.movido && d){ pushUndo(); drag.movido=true; }
    liston.s=drag.s0+d; draw(); return;
  }
  if(drag.mode==='move'){
    var p=byId(drag.id); if(!p) return;
    var g=celda(s2w(sp));
    var dx=g.x-drag.from.x, dy=g.y-drag.from.y;
    if(!drag.movido && (dx||dy)){ pushUndo(); drag.movido=true; }
    p.x=drag.base.x+dx; p.y=drag.base.y+dy;
    drag.landing=hueco(pieces,p,p.id)||{x:p.x,y:p.y};
    draw(); return;
  }
}

  if(drag && drag.mode==='move'){
    var p=byId(drag.id);
    if(p){

/* La bandeja tiene que caber en su columna sin barra de desplazamiento, y el
   palote del 10 es diez veces la unidad. Como todos se dibujan con la MISMA
   unidad, la escalera de la bandeja sigue siendo proporcional; encoger solo el
   del 10 con un max-width lo dejaría del mismo largo que el del 9. Los palotes
   de la bandeja van siempre tumbados, aunque se esté trabajando de pie: la
   bandeja es la caja del material, y una caja de diez palotes de pie sería una
   columna de medio metro. */
function unidadBandeja(){
  var w=document.getElementById('palotes').clientWidth||140;
  return Math.max(6, Math.min(11, Math.floor((w-34)/MAXN)));
}
var uBandeja=0;
function miniSVG(n,u){
  var col=colorDe(n), w=n*u+3, h=u+3;
  var s='<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">';
  s+='<rect x="1.5" y="1.5" width="'+(n*u)+'" height="'+u+'" rx="2.5" fill="'+col+
     '" stroke="'+shade(col,-0.42)+'" stroke-width="1.3"/>';
  for(var i=1;i<n;i++)
    s+='<line x1="'+(1.5+i*u)+'" y1="3" x2="'+(1.5+i*u)+'" y2="'+(u)+'" stroke="'+
       shade(col,-0.30)+'" stroke-width="1.1"/>';
  return s+'</svg>';
}
function pintaBandeja(){
  var cont=document.getElementById('palotes'), html='', u=unidadBandeja();
  uBandeja=u;
  for(var n=1;n<=MAXN;n++)
    html+='<div class="pl'+(opt.num?'':' mudo')+'" data-n="'+n+'" title="Palote del '+n+'">'+
          miniSVG(n,u)+'<span>'+n+'</span></div>';
  cont.innerHTML=html;
  cont.querySelectorAll('.pl').forEach(function(el){
    el.addEventListener('pointerdown',function(e){
      e.preventDefault();
      var n=parseInt(el.getAttribute('data-n'),10);
      var r=stage.getBoundingClientRect(), sp=evPos(e);
      var dentro = sp.x>0 && sp.y>0 && sp.x<r.width && sp.y<r.height;
      var g=celda(s2w(dentro ? sp : {x:r.width/2, y:r.height/2}));
      /* de pie, el palote se levanta desde la casilla donde se ha soltado:
         el bloque donde empieza la cuenta es el de abajo */
      var y0 = opt.vert ? g.y-n+1 : g.y;
      pushUndo();
      var p=ponerEnHueco(n,g.x,y0,opt.vert);
      if(!p){ undoStack.pop(); return; }
      sel=p.id; setTool('move');
      drag={mode:'move', id:p.id, from:{x:p.x,y:p.y}, base:{x:p.x,y:p.y}, movido:true, landing:{x:p.x,y:p.y}};
      draw();
    });
  });
}
function setTool(t){
  tool=t;
  document.querySelectorAll('[data-tool]').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-tool')===t); });
  cv.style.cursor=(t==='move')?'default':'crosshair';
  draw();
}

function datos(){

          liston:{n:liston.n, s:liston.s},

function leer(f){
  var r=new FileReader();
  r.onload=function(){ try{ loadData(JSON.parse(r.result)); }catch(err){ flash('No he podido leer ese archivo'); } };
  r.readAsText(f);
}
function entero(v){ return typeof v==='number' && isFinite(v) && v===Math.round(v); }
/* No fiarse del archivo: se valida palote a palote y se rechaza entero si algo
   no cuadra, en vez de dejar entrar un 0, un 11 o un 3,5. */
function limpiaPiezas(lista){
  if(!lista || !lista.length || typeof lista.length!=='number') return null;
  var res=[];
  for(var i=0;i<lista.length;i++){
    var q=lista[i]; if(!q || typeof q!=='object') return null;
    if(!entero(q.n) || !entero(q.x) || !entero(q.y)) return null;
    if(q.n<1 || q.n>MAXN) return null;
    if(q.v!==undefined && q.v!==0 && q.v!==1 && q.v!==true && q.v!==false) return null;
    res.push({n:q.n, x:q.x, y:q.y, v:(q.v===1||q.v===true)?1:0});
  }
  return res;
}
function limpiaListon(l){
  if(l===undefined || l===null) return {n:0, s:0};
  if(typeof l!=='object') return null;
  if(!entero(l.n) || !entero(l.s)) return null;
  if(l.n<0 || l.n>MAXN) return null;
  return {n:l.n, s:l.s};
}
function loadData(d){
  var limpias=limpiaPiezas(d && (d.piezas||d.pieces));
  if(!limpias){ flash('Ese archivo no tiene palotes que yo entienda'); return false; }
  var lst=limpiaListon(d && d.liston);
  if(!lst){ flash('Ese archivo tiene el listón mal puesto'); return false; }
  pushUndo();
  var base = (importMode==='add') ? pieces.slice() : [];
  if(importMode==='add' && base.length){
    /* lo añadido se aparta para no pisar lo que había: hacia abajo si está
       tumbado, hacia la derecha si está de pie */
    var vertNuevo = limpias.length && limpias[0].v;
    if(!vertNuevo){
      var maxy=-1e9; base.forEach(function(p){ maxy=Math.max(maxy,p.y+alto(p)); });
      var miny=1e9;  limpias.forEach(function(q){ miny=Math.min(miny,q.y); });
      var dy=maxy+1-miny;
      limpias.forEach(function(q){ q.y+=dy; });
    }else{
      var maxx=-1e9; base.forEach(function(p){ maxx=Math.max(maxx,p.x+ancho(p)); });
      var minx=1e9;  limpias.forEach(function(q){ minx=Math.min(minx,q.x); });
      var dx=maxx+1-minx;
      limpias.forEach(function(q){ q.x+=dx; });
    }
  }
  var res=base;
  limpias.forEach(function(q){
    var h = libre(res,q,null) ? {x:q.x,y:q.y} : hueco(res,q,null);
    if(!h) h={x:q.x, y:q.y};
    res.push({id:nid++, n:q.n, x:h.x, y:h.y, v:q.v});
  });
  pieces=res; sel=null;
  if(importMode==='replace'){
    liston=lst; sincronizaListon();
    if(d && (d.vertical===0 || d.vertical===1)) setOri(d.vertical);
  }
  fitView();
  flash(limpias.length+(limpias.length===1?' palote cargado':' palotes cargados'));
  return true;
}

   9. AUTOCOMPROBACIÓN  ·  añade #test al final de la URL
   ========================================================================= */
function runSelfTest(){
  var out=[], fails=0;
  function ok(n,c,extra){
    out.push((c?'OK    ':'FALLO ')+n+(extra!==undefined?'   ['+extra+']':''));
    if(!c) fails++;
  }
  function num(v){ return (Math.round(v*1000)/1000).toString().replace('.',','); }
  function key(lista){
    return lista.map(function(p){ return p.n+(p.v?'|':'-')+p.x+','+p.y; }).sort().join(' · ');
  }
  function kc(p){ return celdas(p).map(function(c){ return c.x+','+c.y; }).join(' '); }
  function solapan(lista){
    var v={}, mal=false;
    lista.forEach(function(p){ celdas(p).forEach(function(c){
      var k=c.x+','+c.y; if(v[k]) mal=true; v[k]=1; }); });
    return mal;
  }
  /* dibuja una escena aislada en un lienzo aparte y devuelve sus píxeles.
     Es lo único que caza un NaN en un path: no da error, simplemente no pinta. */
  function pinta(lista,W,H,ox,oy,idSel){
    var oc=document.createElement('canvas'); oc.width=W; oc.height=H;
    var o=oc.getContext('2d'); o.fillStyle='#fff'; o.fillRect(0,0,W,H);
    var gp=pieces, gv=view, gd=drag, gs=sel;
    pieces=lista; view={x:ox,y:oy,z:1}; drag=null;
    sel=(idSel===undefined)?null:idSel;
    escena(o,W,H,true);
    pieces=gp; view=gv; drag=gd; sel=gs;
    return o.getImageData(0,0,W,H);
  }
  /* un solo palote, con el lienzo del tamaño justo aunque esté en coordenadas
     negativas (los palotes de pie de la escalera lo están) */
  function pintaPieza(p,M){
    var an=ancho(p)*CELL, al=alto(p)*CELL;
    return pinta([p], an+2*M, al+2*M, M-p.x*CELL, M-p.y*CELL);
  }
  function cuenta(img,test){
    var d=img.data, n=0;
    for(var i=0;i<d.length;i+=4) if(test(d[i],d[i+1],d[i+2])) n++;
    return n;
  }
  function bbox(img,test){
    var d=img.data, x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
    for(var i=0;i<d.length;i+=4){
      if(!test(d[i],d[i+1],d[i+2])) continue;
      var px=(i/4)%img.width, py=Math.floor((i/4)/img.width);
      if(px<x0)x0=px; if(px>x1)x1=px; if(py<y0)y0=py; if(py>y1)y1=py;
    }
    return {x0:x0,x1:x1,y0:y0,y1:y1,an:x1-x0+1,al:y1-y0+1};
  }
  function noBlanco(r,g,b){ return r<246||g<246||b<246; }
  function oscuro(r,g,b){ return r<90&&g<90&&b<90; }
  function azul(r,g,b){ return b-r>60; }
  function naranja(r,g,b){ return r-b>60 && r>150; }
  /* franjas oscuras al recorrer el palote a lo largo: los dos bordes más las
     n-1 divisiones interiores. Es lo que distingue un palote de una regleta. */
  function franjas(n,vert){
    var p={id:0, n:n, x:0, y:0, v:vert?1:0}, M=14;
    var gn=opt.num; opt.num=0;
    var img=pintaPieza(p,M);
    opt.num=gn;
    var W=img.width, d=img.data, relleno=lum(colorDe(n));
    var fijo=M+Math.floor(CELL/2), gr=0, dentro=false, largo=n*CELL, t;
    for(t=M+1;t<M+largo-1;t++){
      var i = vert ? ((t*W+fijo)*4) : ((fijo*W+t)*4);
      var l=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
      var osc = l < relleno-22;
      if(osc && !dentro){ gr++; dentro=true; }
      else if(!osc) dentro=false;
    }
    return gr;
  }

  /* se guarda el tablero de quien esté trabajando y se le devuelve al final */
  var guardado={p:pieces.slice(), n:nid, s:sel, o:JSON.parse(JSON.stringify(opt)),

  try{

  pieces=[]; nid=1; sel=null; undoStack=[]; setTool('move');

     cuenta(pinta(escH, 12*CELL, 4*CELL, M, M), azul)===0);
  ok('ni cuántos hay en la columna',
     cuenta(pinta(escV, 6*CELL, 9*CELL, M, M+6*CELL), azul)===0);
  opt.sumas=1;
  ok('y encendiéndola, sí aparece la de la fila',
     cuenta(pinta(escH, 12*CELL, 4*CELL, M, M), azul)>0);
  ok('y la de la columna',
     cuenta(pinta(escV, 6*CELL, 9*CELL, M, M+6*CELL), azul)>0);
  opt.sumas=0;
  ok('la casilla manda también en el PNG que se descarga',
     cuenta(pinta(escH, 12*CELL, 4*CELL, M, M), azul)===0);
  pieces=escH.slice();
  ok('el archivo guardado tampoco lleva la cuenta de cada línea',
     JSON.stringify(datos()).indexOf('total')<0 && JSON.stringify(datos()).indexOf('suma')<0);

  /* --- 15. la bandeja ----------------------------------------------------- */
  opt.num=0; pintaBandeja();
  var mudos=document.querySelectorAll('#palotes .pl.mudo').length;
  ok('sin números en el tablero, la bandeja tampoco los enseña', mudos===10, mudos);
  opt.num=2; pintaBandeja();
  ok('y volviendo a ponerlos, la bandeja los recupera',
     document.querySelectorAll('#palotes .pl.mudo').length===0);
  opt.pal='paridad'; pintaBandeja();
  ok('la bandeja se repinta con la paleta elegida',
     document.querySelectorAll('#palotes .pl')[1].innerHTML.indexOf(paleta('paridad').colores[1])>=0);
  opt.pal='regletas'; pintaBandeja();
  ok('y vuelve a la de regletas',
     document.querySelectorAll('#palotes .pl')[6].innerHTML.indexOf(paleta('regletas').colores[6])>=0);
  opt.pal='vivos'; pintaBandeja();
  ok('y a la de por defecto',
     document.querySelectorAll('#palotes .pl')[0].innerHTML.indexOf(paleta('vivos').colores[0])>=0);

  /* el palote del 10 es el más ancho de la bandeja y es el que la desborda */
  var cont=document.getElementById('palotes'), wGuardado=cont.style.width;
  [126,152,300].forEach(function(w){
    cont.style.width=w+'px';
    var u=unidadBandeja();
    ok('con la columna a '+w+' px, el palote del 10 cabe en la bandeja',
       MAXN*u+3 <= w-20, 'unidad '+u+' px → '+(MAXN*u+3)+' px de '+(w-20));
    ok('y los diez se dibujan con la misma unidad, así que la escalera no miente',
       miniSVG(9,u).indexOf('width="'+(9*u+3)+'"')>=0 &&
       miniSVG(10,u).indexOf('width="'+(10*u+3)+'"')>=0);
  });
  ok('la unidad de la bandeja nunca baja de 6 px ni pasa de 11',
     (function(){ var bien=true;
       [40,60,90,126,152,300,900].forEach(function(w){
         cont.style.width=w+'px'; var u=unidadBandeja();
         if(u<6||u>11) bien=false; });
       return bien; })());
  cont.style.width=wGuardado;
  pintaBandeja();
  ok('y la bandeja se queda con sus diez palotes después de todo esto',
     document.querySelectorAll('#palotes .pl').length===10,
     document.querySelectorAll('#palotes .pl').length);

  }catch(errT){
    fails++;
    out.push('FALLO se ha cortado aquí: '+((errT&&errT.message)||errT));
    if(errT&&errT.stack) String(errT.stack).split('\n').slice(0,5).forEach(function(l){
      out.push('        '+l.trim()); });
  }

  /* --- se le devuelve el tablero a quien estuviera trabajando -------------- */
  pieces=guardado.p; nid=guardado.n; sel=guardado.s; undoStack=guardado.u;
  importMode=guardado.im; liston=guardado.l;
  view.x=guardado.v.x; view.y=guardado.v.y; view.z=guardado.v.z;
  var k; for(k in guardado.o) opt[k]=guardado.o[k];
  setOri(opt.vert); setTool(guardado.t); sincronizaListon();
  document.getElementById('palsel').value=opt.pal;
  pintaBandeja(); draw();

  /* --- informe ------------------------------------------------------------ */
  var texto=out.join('\n')+'\n\n'+(fails? fails+' PRUEBAS FALLIDAS de '+out.length
                                         : 'LAS '+out.length+' PRUEBAS CORRECTAS');
  var box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;background:#fff;z-index:99;overflow:auto;padding:18px 22px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
  box.innerHTML='<div style="font:600 15px/1.3 -apple-system,Segoe UI,Roboto,sans-serif;margin-bottom:4px">'+
      'Autocomprobación de Palotes numéricos</div>'+
    '<div style="font:13px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;color:'+(fails?'#c2410c':'#15803d')+';font-weight:600;margin-bottom:12px">'+
      (fails? fails+' pruebas fallidas de '+out.length : 'Las '+out.length+' pruebas correctas')+'</div>'+
    '<button id="cpTest" style="font:13px -apple-system,Segoe UI,Roboto,sans-serif;padding:6px 12px;margin-bottom:14px;'+
      'border:1px solid #d5d9e0;border-radius:7px;background:#fff;cursor:pointer">Copiar informe</button> '+
    '<button id="clTest" style="font:13px -apple-system,Segoe UI,Roboto,sans-serif;padding:6px 12px;margin-bottom:14px;'+
      'border:1px solid #d5d9e0;border-radius:7px;background:#fff;cursor:pointer">Cerrar y usar el manipulativo</button>'+
    '<pre style="white-space:pre-wrap;margin:0">'+
      out.map(function(l){ return l.indexOf('FALLO')===0
        ? '<span style="color:#c2410c;font-weight:700">'+l+'</span>' : l; }).join('\n')+'</pre>';
  document.body.appendChild(box);
  document.getElementById('cpTest').addEventListener('click',function(){
    var ta=document.createElement('textarea'); ta.value=texto; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); }catch(err){}
    document.body.removeChild(ta); this.textContent='Copiado ✓';
  });
  document.getElementById('clTest').addEventListener('click',function(){ box.remove(); });
}
var testLanzado=false;
function lanzarTest(){ if(testLanzado) return; testLanzado=true; runSelfTest(); }
if((location.hash||'').indexOf('test')>=0) setTimeout(lanzarTest,60);
window.addEventListener('hashchange',function(){
  if((location.hash||'').indexOf('test')>=0) lanzarTest();
});

window.__palotes={
  test:runSelfTest, celdas:celdas, bloque:bloque, celdaInicio:celdaInicio,
  celdaNumeral:celdaNumeral, girado:girado, ancho:ancho, alto:alto,
  colorDe:colorDe, tintaSobre:tintaSobre, paletas:PALETAS, paleta:paleta,
  tirador:tirador, enTirador:enTirador, cajaPantalla:cajaPantalla,
  libre:libre, hueco:hueco, totalesH:totalesH, totalesV:totalesV, salidaDe:salidaDe,
  pieces:function(){ return pieces; }, nueva:nueva, byId:byId, opt:opt,
  liston:function(){ return liston; }, setListon:function(n,s){ liston={n:n,s:s}; sincronizaListon(); },
  pegarListon:pegarListon, setOri:setOri, bordesListon:bordesListon,
  cambiaBloques:cambiaBloques, moverSel:moverSel, girarSel:girarSel, duplicar:duplicar,
  sacarLosDiez:sacarLosDiez, escalera:escalera, desordenar:desordenar,
  limpiaPiezas:limpiaPiezas, limpiaListon:limpiaListon, load:loadData, datos:datos,
  setMode:function(m){ importMode=m; }, sel:function(id){ sel=id; },
  redraw:draw, bandeja:pintaBandeja,
  reset:function(){ pieces=[]; sel=null; nid=1; undoStack=[]; }
};

})();
</script>
</body>
