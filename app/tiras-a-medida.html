<style>
  *{box-sizing:border-box}

  body{font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

           margin:0 0 6px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;

       padding:5px 6px;color:#2b2f36;background:#fff;width:100%}

  .cuenta{flex:1.6;display:flex;align-items:center;justify-content:center;gap:6px;
          font-weight:600;font-size:12.5px;color:#2b2f36}

  .lab{font-size:11px;color:#8a919c;margin-top:7px}
  .caja{margin-top:7px;font-size:11.5px;color:#4a515c;line-height:1.5;
        background:#fff;border:1px solid #e6e8ec;border-radius:8px;padding:7px 8px}
  .caja b{color:#2b2f36}
  .caja .gr{font-size:15px;font-weight:700;color:#31527d}
  .caja .mant{margin-top:6px;padding-top:6px;border-top:1px solid #eef0f3}
  .caja .mant:first-child{margin-top:0;padding-top:0;border-top:0}
  .nota{font-size:11px;color:#8a919c;line-height:1.5;margin-top:7px}
  #stage{position:relative;flex:1;min-height:0;background:#fbfbfa}
  canvas#cv{display:block;width:100%;height:100%;touch-action:none}
  #hint{position:absolute;left:10px;bottom:10px;background:rgba(28,32,38,.82);color:#fff;font-size:11.5px;
        padding:5px 10px;border-radius:14px;pointer-events:none;max-width:calc(100% - 20px)}
  #info{position:absolute;right:10px;top:10px;width:334px;background:#fff;border:1px solid #dfe2e7;
        border-radius:10px;padding:11px 13px;font-size:11.5px;line-height:1.55;color:#4a515c;
        box-shadow:0 6px 22px rgba(20,25,35,.12);display:none;max-height:calc(100% - 20px);overflow:auto}
  #info.show{display:block}
  #info b{color:#2b2f36}
  #info a{color:#2f62a8}
  #info .lic{margin-top:11px;padding-top:8px;border-top:1px solid #eef0f3;font-size:10.5px;
             line-height:1.5;color:#8a919c}
  #drop{position:absolute;inset:0;background:rgba(47,98,168,.08);border:2px dashed #2f62a8;
        display:none;align-items:center;justify-content:center;font-size:15px;color:#2f62a8;font-weight:600}
  #drop.show{display:flex}
  @media (max-width:640px){
    #side{width:160px;flex:0 0 160px;padding:8px 7px}
    .btn{padding:5px 7px;font-size:12px}
    #info{width:calc(100% - 20px)}
  }
</style>

<body>

  <main>
    <div id="toolbar">

<script>
"use strict";
(function(){

/* =========================================================================
   1. LA IDEA
   El hermano en longitud de «Manteles a medida». Allí se fabricaba un mantel
   de un área dada; aquí, una tira de una longitud dada. Llega un encargo
   —«una tira que mida 5/6 u»— y hay que construirla doblando y repitiendo.

   Dos modos, que son dos problemas distintos:

     · Desde la unidad. Está la tira unidad en el tablero. Todo sale de ella.

     · Desde otra tira. La unidad no aparece: lo que hay es una tira A de la
       que se sabe la medida, r/s u, y el encargo sigue escrito en unidades.

   LO QUE CAMBIA AL PASAR DEL ÁREA A LA LONGITUD, y condiciona todo el
   archivo: doblar vuelve a ser UNA SOLA COSA. En el mantel había que elegir
   columnas y filas, porque un cuarto de unidad podía ser una tira vertical,
   una horizontal o un cuadradito, con la misma área y comportamientos
   distintos. En una tira, un cuarto de unidad solo puede ser una cosa. Por
   eso aquí la pieza se dobla en n partes y se acabó, y por eso unir es más
   exigente: los trozos tienen que estar en la MISMA FILA y seguidos, sin
   huecos ni solapes, porque una tira es un segmento y no admite dos
   maneras de recomponerse.

   La aritmética, exacta: toda longitud es una fracción entera de la tira
   base, nunca un decimal. Dos longitudes son iguales o no lo son, sin
   márgenes de tolerancia.
   ========================================================================= */
var U=280;                 // longitud de la tira base, en píxeles
var ALTO=38;               // grosor de las tiras
var HUECO=12;              // separación entre filas
var MAXP=24;               // partes en las que se puede doblar una tira
var MAXCOPIAS=9;           // copias como mucho para rehacer la unidad

/* El amarillo de la unidad es el mismo de «Tiras de papel»: la unidad tiene
   que reconocerse de un vistazo y de un manipulativo a otro. */
var CUNI  ={f:'#f2c14e', b:'#c99a1e', t:'#6b4f00'};   // la tira unidad
var CREF  ={f:'#cfe0c6', b:'#6f9a5f', t:'#3f5c35'};   // la tira A de referencia
var CTUYA ={f:'#efdfea', b:'#a2649a', t:'#6b3d64'};   // tu tira, en el banco
var CTROZO={f:'#f4ead6', b:'#c2ab7d', t:'#7a6634'};   // trozo suelto

/* =========================================================================
   2. ESTADO
   ========================================================================= */
var piezas=[], sel=null, nid=1;
var encargo=null;          // {modo, p,q, rp,rq, lp,lq}
var banco=null;            // el rectángulo del panel de pruebas, en mundo
var view={x:0,y:0,z:1};
var drag=null, undoStack=[], importMode='replace';
/* la transparencia empieza encendida, al revés que en los manteles: una tira
   puesta encima de otra la tapa entera, y sin ver lo de debajo no se puede
   saber si se está cubriendo o pasando */
var opt={iman:1, etiq:0, mano:0, alfa:1, comp:0};

var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var stage=document.getElementById('stage');
var hintEl=document.getElementById('hint'), infoEl=document.getElementById('info');
var dropEl=document.getElementById('drop');
var flashMsg=null, flashT=0;

function w2s(p){ return {x:p.x*view.z+view.x, y:p.y*view.z+view.y}; }
function s2w(p){ return {x:(p.x-view.x)/view.z, y:(p.y-view.y)/view.z}; }
function flash(m){ flashMsg=m; flashT=Date.now(); draw(); setTimeout(draw,2400); }
function pushUndo(){
  undoStack.push(JSON.stringify({p:piezas, s:sel, n:nid, b:banco, e:encargo}));
  if(undoStack.length>90) undoStack.shift();
}
function doUndo(){
  if(!undoStack.length){ flash('No hay nada que deshacer'); return; }
  var d=JSON.parse(undoStack.pop());
  piezas=d.p; sel=d.s; nid=d.n||1; banco=d.b||null; encargo=d.e||null;
  cacheEnc='';
  draw();
}

/* =========================================================================
   3. FRACCIONES
   Aritmética exacta de enteros. Una longitud es siempre un par p/q reducido;
   comparar dos longitudes es multiplicar en cruz.
   ========================================================================= */
function mcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ var t=a%b; a=b; b=t; } return a; }
function reduce(p,q){ var d=mcd(p,q)||1; return {p:p/d, q:q/d}; }
function igualFrac(a,b){ return a.p*b.q===b.p*a.q; }
function sumaFrac(a,b){ return reduce(a.p*b.q+b.p*a.q, a.q*b.q); }
function divFrac(a,b){ return reduce(a.p*b.q, a.q*b.p); }
function multFrac(a,b){ return reduce(a.p*b.p, a.q*b.q); }
function textoFrac(f){ return f.q===1 ? (f.p+'') : (f.p+'/'+f.q); }
function leeFraccion(txt){
  if(txt===null || txt===undefined) return null;
  var s=String(txt).toLowerCase().replace(/\s+y\s+/g,' ').trim();
  if(!s) return null;
  var m;
  if((m=s.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/))){
    var e=+m[1], n=+m[2], d=+m[3];
    if(!d) return null;
    return reduce(e*d+n, d);
  }
  if((m=s.match(/^(\d+)\s*\/\s*(\d+)$/))){
    if(!+m[2] || !+m[1]) return null;
    return reduce(+m[1], +m[2]);
  }
  if((m=s.match(/^(\d+)$/))){ if(!+m[1]) return null; return {p:+m[1], q:1}; }
  return null;
}
/* «5/6» o «5/6 desde 3/4»: la segunda fracción es la medida de la tira de
   referencia, para poder preparar una sesión con un caso concreto */
function leeEncargoTexto(txt){
  if(txt===null || txt===undefined) return null;
  var s=String(txt).toLowerCase().trim();
  if(!s) return null;
  var partes=s.split(/\s+(?:desde|con|a\s+partir\s+de|de\s+una\s+tira\s+de)\s+/);
  var obj=leeFraccion(partes[0]);
  if(!obj) return null;
  if(partes.length===1) return {obj:obj, ref:null};
  if(partes.length>2) return null;
  var ref=leeFraccion(partes[1]);
  if(!ref) return null;
  return {obj:obj, ref:ref};
}

/* =========================================================================
   4. LOS ENCARGOS QUE PROPONE EL ENTORNO
   Un encargo son dos fracciones: lo que tiene que medir la tira (p/q de la
   unidad) y lo que mide la referencia que se da (r/s de la unidad; en el modo
   desde la unidad eso es 1/1, la propia unidad).

   Hay dos maneras de llegar, y de cuál esté disponible depende buena parte de
   lo que cuesta el encargo:

     · la RUTA DIRECTA, doblar la referencia de una vez en las n partes que
       pide (p·s)/(q·r) reducido, y juntar m. Solo existe si n no pasa de las
       partes en que se puede doblar una tira.

     · la RUTA POR LA UNIDAD, doblar la referencia en r partes —cada una es
       entonces 1/s de unidad—, juntar s para rehacer la unidad y volver a
       empezar desde ella.

   CÓMO SE REGULA LA DIFICULTAD. No con topes, sino con suelos: un nivel no
   es «hasta cuánto puede llegar» sino «de qué denominadores se sortea». Con
   solo máximos, el nivel difícil seguiría sacando mitades tan a menudo como
   el fácil, porque un tope no impide que salga un número pequeño.

   Los denominadores 13, 17 y 19 se quedan fuera a propósito, como en «Tiras
   de papel»: doblar una tira en trece partes no enseña nada que no enseñe
   doblarla en siete, y desespera.
   ========================================================================= */
var NIVELES=[
  {n:'Fácil',   qs:[2,3,4],           maxp:6,  maxm:8,  maxn:4,  rutaDirecta:1, maxs:4},
  {n:'Normal',  qs:[3,4,5,6,8,10,12], maxp:9,  maxm:12, maxn:10, rutaDirecta:1, maxs:6},
  {n:'Difícil', qs:[7,9,11],          maxp:14, maxm:16, maxn:MAXP, rutaDirecta:0, maxs:6}
];
/* longitudes agradables para la tira de referencia, en fracciones de la base */
var LARGOS=[
  {p:1,q:1}, {p:5,q:4}, {p:3,q:2}, {p:7,q:4}, {p:2,q:1},
  {p:3,q:4}, {p:5,q:6}, {p:4,q:3}, {p:9,q:8}
];
var ENTERA={p:1,q:1};
/* el paso directo: la tira pedida mide (p·s)/(q·r) de la referencia */
function pasoDirecto(p,q,r,s){ return reduce(p*s, q*r); }
function hayRutaDirecta(p,q,r,s){
  var m=pasoDirecto(p,q,r,s);
  return m.q<=MAXP && m.p<=20;
}
function hayRutaPorLaUnidad(p,q,r,s){ return r<=MAXP && q<=MAXP && s<=MAXCOPIAS; }
/* un encargo vale si al menos una de las dos rutas está al alcance, y si la
   referencia y la tira pedida no miden lo mismo */
function alcanzable(p,q,r,s){
  var m=pasoDirecto(p,q,r,s);
  if(m.p===m.q) return false;
  return hayRutaDirecta(p,q,r,s) || hayRutaPorLaUnidad(p,q,r,s);
}
function objetivoValido(p,q){
  if(p===q) return false;                 // el encargo sería la propia unidad
  if(mcd(p,q)!==1) return false;          // la fracción, ya irreducible
  if(q>MAXP) return false;                // hay que poder doblar la unidad en q
  var a=p/q;
  return a>=0.3 && a<=3;
}
function referenciaValida(r,s){
  if(r===s) return false;                 // entonces la referencia sería la unidad
  if(mcd(r,s)!==1) return false;
  if(r>MAXP) return false;                // doblarla en r partes da 1/s de unidad
  if(s>MAXCOPIAS) return false;           // y hacen falta s de esas para la unidad
  var a=r/s;
  return a>=0.3 && a<=2.6;
}
/* que quepan en pantalla la referencia, la unidad —que el alumno puede querer
   rehacer por el camino— y la tira pedida */
function largoValido(Lr,p,q,r,s){
  var ar=Lr.p/Lr.q;                       // lo que mide de largo la referencia
  if(ar<0.35 || ar>2.5) return false;
  var au=ar*s/r;                          // lo que mediría la unidad
  if(au<0.5 || au>2.4) return false;
  var ab=au*p/q;                          // lo que mide la tira encargada
  return ab>=0.28 && ab<=3.1;
}
function largosBuenos(p,q,r,s){
  var out=[];
  for(var k=0;k<LARGOS.length;k++) if(largoValido(LARGOS[k],p,q,r,s)) out.push(LARGOS[k]);
  return out;
}
function referenciasPosibles(){
  var out=[];
  for(var r=1;r<=MAXP;r++) for(var s=1;s<=MAXCOPIAS;s++)
    if(referenciaValida(r,s)) out.push({p:r,q:s});
  return out;
}
function elige(lista){ return lista[Math.floor(Math.random()*lista.length)]; }
/* la referencia cumple lo que pide el nivel: en fácil y normal, que la ruta
   directa exista y quepa en n dobleces; en difícil, que NO exista, y que
   quede sin embargo la de rehacer la unidad */
function referenciaDelNivel(p,q,r,s,N){
  if(!referenciaValida(r,s)) return false;
  var m=pasoDirecto(p,q,r,s);
  if(m.p===m.q) return false;                     // medirían lo mismo, no hay nada que hacer
  if(N.rutaDirecta) return m.q<=Math.min(MAXP,N.maxn) && m.p<=N.maxm;
  /* que el atajo no exista de verdad, no que salga largo: se exige que el
     doblez que pediría no quepa en una tira, no que pida muchos trozos */
  return m.q>MAXP && hayRutaPorLaUnidad(p,q,r,s) && s<=N.maxs;
}

function encargoAlAzar(modo,nv){
  var N=NIVELES[nv]||NIVELES[1];
  for(var i=0;i<8000;i++){
    /* el denominador se SORTEA de los del nivel, no se acota */
    var q=elige(N.qs), p=1+Math.floor(Math.random()*N.maxp);
    if(!objetivoValido(p,q)) continue;
    if(modo===1) return {modo:1, p:p,q:q, rp:1,rq:1, lp:ENTERA.p, lq:ENTERA.q};
    var r=1+Math.floor(Math.random()*MAXP), s=1+Math.floor(Math.random()*MAXCOPIAS);
    if(!referenciaDelNivel(p,q,r,s,N)) continue;
    var buenos=largosBuenos(p,q,r,s);
    if(!buenos.length) continue;
    var Lr=elige(buenos);
    return {modo:2, p:p,q:q, rp:r,rq:s, lp:Lr.p, lq:Lr.q};
  }
  return modo===2 ? {modo:2, p:5,q:11, rp:3,rq:4, lp:3,lq:2}
                  : {modo:1, p:5,q:6, rp:1,rq:1, lp:1,lq:1};
}
/* el encargo que se pide a mano; devuelve null si no se puede */
function encargoConcreto(modo,obj,ref){
  if(!obj) return null;
  var f=reduce(obj.p,obj.q), p=f.p, q=f.q;
  if(!objetivoValido(p,q)) return null;
  if(modo===1) return {modo:1, p:p,q:q, rp:1,rq:1, lp:ENTERA.p, lq:ENTERA.q};
  var lista = ref ? [reduce(ref.p,ref.q)] : referenciasPosibles();
  var cands=[];
  for(var i=0;i<lista.length;i++){
    var R=lista[i];
    if(!referenciaValida(R.p,R.q)) continue;
    if(!alcanzable(p,q,R.p,R.q)) continue;
    var buenos=largosBuenos(p,q,R.p,R.q);
    for(var k=0;k<buenos.length;k++) cands.push({R:R, L:buenos[k]});
  }
  if(!cands.length) return null;
  var c=elige(cands);
  return {modo:2, p:p,q:q, rp:c.R.p,rq:c.R.q, lp:c.L.p, lq:c.L.q};
}

/* =========================================================================
   5. LAS TIRAS
   Todas son segmentos con la longitud guardada como fracción de la tira base,
   para que doblar y repetir sea exacto. n son las partes en que está marcada;
   son solo marcas: la tira sigue entera.

   Tres clases de tira:
     'r'  la referencia, lo único que llega con la medida sabida. En el modo
          desde la unidad es la propia unidad (1/1); en el otro, la tira A.
          Hay la de trabajo, arriba, y la copia limpia del banco, que es la
          que hace de patrón para medir.
     'p'  un trozo suelto, de los que se corta y se repite.
     't'  tu tira, ya montada y llevada al banco. Es lo que se mide, y por eso
          nunca lleva escrito cuánto vale.
   ========================================================================= */
function largo(s){ return U*s.lp/s.lq; }
function largoDe(s){ return reduce(s.lp, s.lq); }
function celda(s){ return reduce(s.lp, s.lq*s.n); }
function centro(s){ return {x:s.x+largo(s)/2, y:s.y+ALTO/2}; }

function nuevaRef(E,P,esPatron){
  return {id:nid++, tipo:'r', lp:E.lp, lq:E.lq, n:1,
          pat:esPatron?1:0, fp:E.rp, fq:E.rq, x:P.x, y:P.y,
          nombre: E.rp===E.rq ? 'u' : 'A'};
}
function nuevoTrozo(lf,P){
  return {id:nid++, tipo:'p', lp:lf.p, lq:lf.q, n:1,
          pat:0, fp:0, fq:1, x:P.x, y:P.y, nombre:''};
}
function nuevaTuTira(lf,P){
  return {id:nid++, tipo:'t', lp:lf.p, lq:lf.q, n:1,
          pat:0, fp:0, fq:1, x:P.x, y:P.y, nombre:''};
}
function porId(id){
  for(var i=0;i<piezas.length;i++) if(piezas[i].id===id) return piezas[i];
  return null;
}
function seleccionada(){ return sel==null? null : porId(sel); }
/* posiciones absolutas de las marcas interiores del doblado */
function marcas(s){
  var out=[];
  if(s.n<2) return out;
  var L=largo(s);
  for(var k=1;k<s.n;k++) out.push(s.x+L*k/s.n);
  return out;
}
/* puntos por los que engancha el imán: los dos extremos y las marcas */
function puntosX(s){ return [s.x, s.x+largo(s)].concat(marcas(s)); }
function dentro(P,s){
  return P.x>=s.x && P.x<=s.x+largo(s) && P.y>=s.y && P.y<=s.y+ALTO;
}
function caja(lista){
  if(!lista.length) return null;
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  lista.forEach(function(s){
    x0=Math.min(x0,s.x); x1=Math.max(x1,s.x+largo(s));
    y0=Math.min(y0,s.y); y1=Math.max(y1,s.y+ALTO);
  });
  return {x0:x0,y0:y0,x1:x1,y1:y1};
}
/* la caja de todo lo que se ve, panel del banco incluido, para ajustar y para
   exportar la imagen */
function cajaTodo(){
  var b=caja(piezas);
  if(!banco) return b;
  if(!b) return {x0:banco.x, y0:banco.y, x1:banco.x+banco.w, y1:banco.y+banco.h};
  return {x0:Math.min(b.x0,banco.x), y0:Math.min(b.y0,banco.y),
          x1:Math.max(b.x1,banco.x+banco.w), y1:Math.max(b.y1,banco.y+banco.h)};
}

/* --- doblar, sacar, separar, repetir ---------------------------------------
   Las cuatro acciones con las que se construye todo. Ninguna inventa medidas:
   parten de lo que ya hay en el tablero. Doblar es una sola cosa, a
   diferencia del mantel: en una tira no hay columnas y filas que elegir. */
function dobla(s,n){
  if(!s) return false;
  n=Math.max(1, Math.min(MAXP, Math.round(n)));
  if(n===s.n) return false;
  pushUndo();
  s.n=n;
  draw();
  return true;
}
/* el trozo sale en la fila de debajo y alineado por la izquierda, que es
   donde se pone el papel recortado para seguir trabajando con él */
function sacarTrozo(s){
  if(!s) return null;
  pushUndo();
  var t=nuevoTrozo(celda(s), {x:s.x, y:s.y+ALTO+HUECO});
  piezas.push(t); sel=t.id;
  draw();
  return t;
}
function separar(s){
  if(!s || s.tipo!=='p') return null;
  if(s.n<2) return null;
  pushUndo();
  var lf=celda(s), an=U*lf.p/lf.q, hijos=[];
  for(var i=0;i<s.n;i++) hijos.push(nuevoTrozo(lf, {x:s.x+an*i, y:s.y}));
  var k=piezas.indexOf(s);
  if(k>=0) piezas.splice.apply(piezas, [k,1].concat(hijos));
  else piezas=piezas.concat(hijos);
  sel=hijos[0].id;
  draw();
  return hijos;
}
/* --- unir en una sola tira --------------------------------------------------
   Una tira repartida en trozos se puede contar, pero no es todavía una tira.
   Unir solo es posible si los trozos forman un SEGMENTO: misma fila, seguidos
   y sin huecos ni solapes. Aquí está la diferencia gorda con el mantel: allí
   los trozos podían embaldosar un rectángulo de muchas maneras, y aquí solo
   hay una manera de recomponer un segmento. */
function segmentoDe(lista){
  if(!lista.length) return null;
  var e=1e-6, b=caja(lista), i;
  for(i=0;i<lista.length;i++) if(Math.abs(lista[i].y-b.y0)>e) return null;  // misma fila
  var orden=lista.slice();
  orden.sort(function(a,c){ return a.x-c.x; });
  var cursor=b.x0, total={p:0,q:1};
  for(i=0;i<orden.length;i++){
    if(Math.abs(orden[i].x-cursor)>e) return null;      // hueco o solape
    cursor+=largo(orden[i]);
    total=sumaFrac(total, largoDe(orden[i]));
  }
  if(Math.abs(cursor-b.x1)>e) return null;
  return {len:total, x:b.x0, y:b.y0};
}
function unir(s){
  if(!s || s.tipo!=='p') return null;
  var g=grupoDe(s);
  if(g.length<2) return null;
  var R=segmentoDe(g);
  if(!R) return null;
  pushUndo();
  var t=nuevoTrozo(R.len, {x:R.x, y:R.y});
  piezas=piezas.filter(function(o){ return g.indexOf(o)<0; });
  piezas.push(t); sel=t.id;
  draw();
  return t;
}
function duplicaEn(s){
  if(!s || s.tipo!=='p') return null;
  pushUndo();
  var t={id:nid++, tipo:'p', lp:s.lp, lq:s.lq, n:s.n,
         pat:0, fp:0, fq:1, x:s.x+largo(s), y:s.y, nombre:''};
  piezas.push(t); sel=t.id;
  draw();
  return t;
}

/* --- el imán --------------------------------------------------------------
   En horizontal engancha por los extremos y por las marcas del doblado, que
   es lo que permite ir poniendo trozos uno detrás de otro. En vertical pone
   las tiras en la misma fila o justo encima o debajo.
   Ojo con el cero: un enganche perfecto vale 0, que es falso en JavaScript.
   La distancia se lleva aparte. */
function engancheX(s){
  var lim=10/view.z, mios=puntosX(s), mejor=null, dist=Infinity;
  piezas.forEach(function(o){
    if(o.id===s.id) return;
    puntosX(o).forEach(function(b){
      mios.forEach(function(a){
        var d=b-a;
        if(Math.abs(d)<lim && Math.abs(d)<dist){ mejor=d; dist=Math.abs(d); }
      });
    });
  });
  return mejor;
}
function engancheY(s){
  var lim=12/view.z, mejor=null, dist=Infinity;
  piezas.forEach(function(o){
    if(o.id===s.id) return;
    [o.y, o.y+ALTO+HUECO, o.y-ALTO-HUECO].forEach(function(b){
      var d=b-s.y;
      if(Math.abs(d)<lim && Math.abs(d)<dist){ mejor=d; dist=Math.abs(d); }
    });
  });
  return mejor;
}
function aplicaIman(s){
  if(!opt.iman || !s) return false;
  var dx=engancheX(s), dy=engancheY(s), algo=false;
  if(dx!==null){ s.x+=dx; algo=true; }
  if(dy!==null){ s.y+=dy; algo=true; }
  return algo;
}
/* --- el grupo pegado -------------------------------------------------------- */
function tocan(a,b){
  var e=0.6;
  return a.x < b.x+largo(b)+e && b.x < a.x+largo(a)+e &&
         a.y < b.y+ALTO+e     && b.y < a.y+ALTO+e;
}
function grupoDe(s){
  if(!s || s.tipo!=='p') return [];
  var dentroG={}, pila=[s], out=[];
  dentroG[s.id]=1;
  while(pila.length){
    var c=pila.pop(); out.push(c);
    piezas.forEach(function(o){
      if(o.tipo!=='p' || dentroG[o.id]) return;
      if(tocan(c,o)){ dentroG[o.id]=1; pila.push(o); }
    });
  }
  return out;
}

/* =========================================================================
   6. EL BANCO DE PRUEBAS
   El tablero tiene dos sitios. Arriba se construye: se dobla la referencia,
   se sacan trozos y se juntan hasta tener lo que uno cree que es la tira
   encargada. Debajo se prueba —y va DEBAJO, no a la derecha como en los
   manteles, porque las tiras son largas y el sitio que escasea es el
   horizontal—: «▶ Llevar al banco» coge el grupo pegado, exige que forme un
   segmento y monta el banco con dos copias limpias, sin ninguna de las
   divisiones que se hayan hecho para construir: tu tira fundida en una pieza
   y la referencia otra vez entera, que ahí hace de patrón.

   Medir es entonces lo de siempre: doblar el patrón, sacar una parte y
   cubrir con ella. Como del patrón se sabe cuánto mide en unidades, la cuenta
   se puede dar en unidades, que es como está escrito el encargo.

   El entorno sigue sin corregir: dice la fracción que sale de lo que hay
   puesto, no si está acertado. Que cubra sin huecos ni sobrantes lo mira el
   alumno.
   ========================================================================= */
function patron(){
  for(var i=0;i<piezas.length;i++) if(piezas[i].tipo==='r' && piezas[i].pat) return piezas[i];
  return null;
}
/* la referencia de trabajo: la que está fuera del banco */
function refTrabajo(){
  for(var i=piezas.length-1;i>=0;i--)
    if(piezas[i].tipo==='r' && !piezas[i].pat) return piezas[i];
  return null;
}
function refCualquiera(){ return refTrabajo() || patron(); }
function tuTira(){
  for(var i=0;i<piezas.length;i++) if(piezas[i].tipo==='t') return piezas[i];
  return null;
}
function dentroRect(P,r){
  return !!r && P.x>=r.x && P.x<=r.x+r.w && P.y>=r.y && P.y<=r.y+r.h;
}
function enBanco(s){ return dentroRect(centro(s), banco); }
/* cuánto vale una longitud en unidades, sabiendo lo que mide la referencia */
function enU(len){
  var R=refCualquiera();
  if(!R) return null;
  return multFrac(divFrac(len, largoDe(R)), reduce(R.fp,R.fq));
}
function valorCelda(s){ return enU(celda(s)); }
/* un trozo cuenta sobre tu tira si su centro cae dentro. El patrón también:
   iterar la referencia sobre lo que se mide es medir */
function trozosSobre(m){
  return piezas.filter(function(s){
    return (s.tipo==='p' || s.tipo==='r') && s.id!==m.id && dentro(centro(s), m);
  });
}
/* en cuántas partes está doblado el patrón y cuánto vale cada una en unidades */
function partePatron(){
  var P=patron();
  if(!P) return null;
  var mu=multFrac(divFrac(celda(P), largoDe(P)), reduce(P.fp,P.fq));
  return {len:celda(P), N:P.n, mu:mu};
}
function medidaDe(m){
  var P=patron();
  if(!P) return {estado:'sin-patron'};
  if(!m) return {estado:'sin-tira'};
  var T=trozosSobre(m);
  if(!T.length) return {estado:'sin-trozos'};
  var at={p:0,q:1};
  for(var i=0;i<T.length;i++) at=sumaFrac(at, largoDe(T[i]));
  var enPat=divFrac(at, largoDe(P));
  var r={estado:'ok', n:T.length, pat:enPat, frac:multFrac(enPat, reduce(P.fp,P.fq))};
  /* si lo que ha puesto son trozos todos iguales, la cuenta se da tal cual.
     Se mira que sean iguales ENTRE SÍ, no que sean partes del patrón: cuando
     el patrón no se deja doblar de una vez en lo que hace falta, se mide con
     partes de algo construido por el camino, y esa cuenta vale igual.
     El total va SIN reducir: arriba las partes que caben, abajo en las que se
     dobló la unidad. */
  var iguales=true;
  for(i=1;i<T.length;i++) if(!igualFrac(largoDe(T[i]), largoDe(T[0]))) iguales=false;
  if(iguales){
    var mu=enU(largoDe(T[0]));
    var Q=partePatron();
    if(mu) r.cuenta={n:T.length, mu:mu, total:{p:T.length*mu.p, q:mu.q},
                     delPatron: !!(Q && igualFrac(largoDe(T[0]), Q.len))};
  }
  return r;
}
/* --- montar el banco --------------------------------------------------------
   Devuelve el motivo por el que no se ha podido, para poder decirlo. */
function probar(s){
  if(!s || s.tipo!=='p') return {ok:false, por:'sin-trozo'};
  var g=grupoDe(s);
  var R = g.length>1 ? segmentoDe(g) : {len:largoDe(s)};
  if(!R) return {ok:false, por:'no-segmento', n:g.length};
  var Rf=refTrabajo();
  if(!Rf) return {ok:false, por:'sin-referencia'};
  var E={lp:Rf.lp, lq:Rf.lq, rp:Rf.fp, rq:Rf.fq};
  pushUndo();
  /* fuera el banco anterior entero, con lo que hubiera dentro */
  piezas=piezas.filter(function(o){ return !enBanco(o); });
  var lT=U*R.len.p/R.len.q, lP=U*E.lp/E.lq;
  var b=caja(piezas);
  /* el hueco entre las dos filas va holgado: las dos llevan cartel, y el
     cartel se dibuja en pantalla mientras el hueco se encoge con el zoom */
  var padX=U*0.09, padTop=ALTO*1.6, padBot=ALTO*0.6, entre=ALTO*1.8;
  var x0 = b? b.x0 : 0, y0 = b? b.y1+ALTO*1.4 : 0;
  var tt=nuevaTuTira(R.len, {x:x0+padX, y:y0+padTop});
  var cp=nuevaRef(E, {x:x0+padX, y:y0+padTop+ALTO+entre}, true);
  banco={x:x0, y:y0,
         w:padX*2+Math.max(lT,lP),
         h:padTop+ALTO+entre+ALTO+padBot};
  piezas.push(tt); piezas.push(cp);
  sel=cp.id;
  draw();
  return {ok:true, tira:tt, patron:cp, n:g.length};
}

/* --- poner un encargo en el tablero ------------------------------------------ */
function ponEncargo(E){
  if(!E) return null;
  pushUndo();
  encargo=E; banco=null;
  var R=nuevaRef(E, {x:-U*E.lp/E.lq/2, y:-ALTO*2}, false);
  piezas=[R]; sel=R.id; cacheEnc='';
  fitView();
  return R;
}
function reinicia(){
  if(!encargo) return;
  pushUndo();
  banco=null;
  var R=nuevaRef(encargo, {x:-U*encargo.lp/encargo.lq/2, y:-ALTO*2}, false);
  piezas=[R]; sel=R.id;
  fitView();
}

/* =========================================================================
   7. DIBUJO
   draw() repinta el tablero entero. Tu tira debajo del todo, que es sobre lo
   que se pone; encima la referencia y los trozos; y los carteles siempre lo
   último, en coordenadas de pantalla, para que ni el zoom ni un trozo puesto
   encima los tapen.
   ========================================================================= */
function colorDe(s){
  if(s.tipo==='r') return (s.fp===s.fq) ? CUNI : CREF;
  if(s.tipo==='t') return CTUYA;
  return CTROZO;
}
function rectRedondo(c,x,y,w,h,r){
  r=Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y);
  c.closePath();
}
function etiquetaCabe(c,txt,anchoCelda,altoCelda){
  if(!txt || altoCelda<13) return '';
  return (c.measureText(txt).width+6<anchoCelda) ? txt : '';
}
/* la etiqueta lleva la unidad detrás, «1/3 u», que si no parece un número
   suelto; si el trozo es estrecho se queda con la fracción y, si no cabe ni
   eso, no se escribe nada */
function etiquetaTrozo(c,v,anchoCelda,altoCelda){
  var f=textoFrac(v);
  return etiquetaCabe(c, f+' u', anchoCelda, altoCelda) ||
         etiquetaCabe(c, f, anchoCelda, altoCelda);
}
function drawTira(c,s,marcada){
  var p=w2s({x:s.x, y:s.y});
  var w=largo(s)*view.z, h=ALTO*view.z;
  if(!isFinite(p.x)||!isFinite(p.y)||!isFinite(w)||!isFinite(h)) return;
  var C=colorDe(s);
  c.save();
  if(opt.alfa && s.tipo==='p') c.globalAlpha=0.58;
  c.save();
  c.shadowColor='rgba(20,25,35,.13)'; c.shadowBlur=6; c.shadowOffsetY=2;
  rectRedondo(c,p.x,p.y,w,h,3.5*view.z);
  c.fillStyle=C.f; c.fill();
  c.restore();

  if(s.n>1){
    c.save();
    rectRedondo(c,p.x,p.y,w,h,3.5*view.z); c.clip();
    c.strokeStyle=C.b; c.lineWidth=Math.max(1.2, 1.6*view.z);
    for(var k=1;k<s.n;k++){
      var X=p.x+w*k/s.n;
      c.beginPath(); c.moveTo(X,p.y); c.lineTo(X,p.y+h); c.stroke();
    }
    c.restore();
  }
  /* las etiquetas dicen lo que vale cada parte EN UNIDADES. Tu tira no se
     etiqueta nunca: cuánto mide es justo lo que está en juego */
  if(opt.etiq && s.tipo!=='t'){
    var v=valorCelda(s);
    if(v){
      c.save();
      c.fillStyle=C.t;
      c.font=Math.max(8,Math.min(13,11*view.z))+'px -apple-system,Segoe UI,Roboto,sans-serif';
      c.textAlign='center'; c.textBaseline='middle';
      var txt=etiquetaTrozo(c, v, w/s.n, h);
      if(txt) for(var i=0;i<s.n;i++)
        c.fillText(txt, p.x+w*(i+0.5)/s.n, p.y+h/2);
      c.restore();
    }
  }

  rectRedondo(c,p.x,p.y,w,h,3.5*view.z);
  c.lineWidth=marcada? 2.6 : (s.pat? 2 : 1.3);
  c.strokeStyle=marcada? '#1f4e8c' : C.b;
  c.stroke();
  c.restore();
}
/* en el cartel de la referencia va lo que mide, que es el dato del problema;
   en el de tu tira no va ningún número, que es lo que se busca */
function textoCartel(s){
  if(s.tipo==='t') return 'tu tira';
  if(s.tipo!=='r') return '';
  return s.fp===s.fq ? 'u' : s.nombre+' · '+textoFrac(reduce(s.fp,s.fq))+' u';
}
/* el cartel se dibuja en coordenadas de pantalla y el último de todo, para que
   ni el zoom ni un trozo puesto encima lo tapen */
function drawCartel(c,s,txt){
  if(!txt) return;
  var p=w2s({x:s.x, y:s.y});
  c.save();
  c.font='600 12px -apple-system,Segoe UI,Roboto,sans-serif';
  var w=c.measureText(txt).width+15, h=21;
  var x=p.x, y=p.y-h-5;
  rectRedondo(c,x,y,w,h,7);
  c.fillStyle=colorDe(s).b; c.fill();
  c.fillStyle='#fff'; c.textAlign='left'; c.textBaseline='middle';
  c.fillText(txt, x+7.5, y+h/2+0.5);
  c.restore();
}
/* el banco: un panel rotulado que separa el sitio de construir del de probar */
function rotuloBanco(){
  return encargo ? 'PRUEBA TU TIRA · TE PEDÍAN '+textoFrac({p:encargo.p,q:encargo.q})+' U'
                 : 'PRUEBA TU TIRA';
}
function drawBanco(c){
  if(!banco) return;
  var p=w2s({x:banco.x, y:banco.y});
  var w=banco.w*view.z, h=banco.h*view.z;
  if(!isFinite(p.x)||!isFinite(w)) return;
  c.save();
  rectRedondo(c,p.x,p.y,w,h,12);
  c.fillStyle='#f3f5f8'; c.fill();
  c.setLineDash([6,5]); c.lineWidth=1.4; c.strokeStyle='#c8cfd9'; c.stroke();
  c.setLineDash([]);
  /* el rótulo va FUERA, encima de la esquina: dentro se lo comen los carteles,
     porque el hueco de arriba se encoge con el zoom y el cartel no */
  c.font='600 11.5px -apple-system,Segoe UI,Roboto,sans-serif';
  c.fillStyle='#8a919c'; c.textAlign='left'; c.textBaseline='bottom';
  c.fillText(rotuloBanco(), p.x+2, p.y-6);
  c.restore();
}
function drawTodo(c){
  drawBanco(c);
  piezas.forEach(function(s){ if(s.tipo==='t') drawTira(c,s,s.id===sel); });
  piezas.forEach(function(s){ if(s.tipo==='r') drawTira(c,s,s.id===sel); });
  piezas.forEach(function(s){ if(s.tipo==='p') drawTira(c,s,s.id===sel); });
  piezas.forEach(function(s){ if(s.tipo==='t' || s.tipo==='r') drawCartel(c,s,textoCartel(s)); });
}
function draw(){
  var W=cv.width/(window.devicePixelRatio||1), H=cv.height/(window.devicePixelRatio||1);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#fbfbfa'; ctx.fillRect(0,0,W,H);
  drawTodo(ctx);
  updateUI();
}

   ========================================================================= */
function pos(e){
  var r=stage.getBoundingClientRect();
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}
function tiraEn(P){
  var i;
  for(i=piezas.length-1;i>=0;i--) if(piezas[i].tipo==='p' && dentro(P,piezas[i])) return piezas[i];
  for(i=piezas.length-1;i>=0;i--) if(piezas[i].tipo==='r' && dentro(P,piezas[i])) return piezas[i];
  for(i=piezas.length-1;i>=0;i--) if(piezas[i].tipo==='t' && dentro(P,piezas[i])) return piezas[i];
  return null;
}
cv.addEventListener('pointerdown',function(e){
  cv.setPointerCapture(e.pointerId);
  var s=pos(e), w=s2w(s);
  var t=tiraEn(w);
  if(t && !opt.mano && e.button!==1 && e.button!==2){
    sel=t.id;
    piezas=piezas.filter(function(q){ return q.id!==t.id; }).concat([t]);
    pushUndo();
    drag={modo:'mover', w0:w, s:t, x0:t.x, y0:t.y};
    draw(); return;
  }
  if(!t && !opt.mano && e.button===0) sel=null;
  drag={modo:'pan', s0:s, v0:{x:view.x, y:view.y}};
  draw();
});
cv.addEventListener('pointermove',function(e){
  if(!drag) return;
  var s=pos(e), w=s2w(s);
  if(drag.modo==='pan'){
    view.x=drag.v0.x+(s.x-drag.s0.x); view.y=drag.v0.y+(s.y-drag.s0.y);
    draw(); return;
  }
  drag.s.x=drag.x0+(w.x-drag.w0.x);
  drag.s.y=drag.y0+(w.y-drag.w0.y);
  draw();
});
function suelta(){
  if(!drag) return;
  if(drag.modo==='mover') aplicaIman(drag.s);
  drag=null;
  draw();
}
cv.addEventListener('pointerup',suelta);
cv.addEventListener('pointercancel',suelta);
cv.addEventListener('contextmenu',function(e){ e.preventDefault(); });
cv.addEventListener('wheel',function(e){
  e.preventDefault();
  var s=pos(e), w=s2w(s);
  var z=Math.max(0.2, Math.min(3, view.z*(e.deltaY<0?1.12:1/1.12)));
  view.z=z; view.x=s.x-w.x*z; view.y=s.y-w.y*z;
  draw();
},{passive:false});

function avisoEncargo(E){
  if(E.modo===1)
    return 'Encargo: una tira de '+textoFrac({p:E.p,q:E.q})+' u, y ahí tienes la unidad';
  return 'Encargo: una tira de '+textoFrac({p:E.p,q:E.q})+' u, con una tira A que mide '+
         textoFrac(reduce(E.rp,E.rq))+' u';
}

document.getElementById('crear').addEventListener('click',function(){
  var caja0=document.getElementById('aMano');
  var lectura=leeEncargoTexto(caja0.value);
  if(!lectura){ flash('Escribe cuánto tiene que medir la tira, por ejemplo 5/6'); return; }
  var modo=modoActual();
  if(lectura.ref && modo===1){ flash('Para dar una tira de referencia, cambia antes el modo'); return; }
  var f=reduce(lectura.obj.p, lectura.obj.q);
  if(f.p===f.q){ flash('Entonces la tira sería la propia unidad, y no habría nada que fabricar'); return; }
  if(f.q>MAXP){ flash('El denominador no puede pasar de '+MAXP+', que es en cuántas partes se puede doblar'); return; }
  var E=encargoConcreto(modo, f, lectura.ref);
  if(!E){
    flash(modo===2 && lectura.ref
      ? 'Desde esa tira no se llega a ese encargo con los dobleces que hay'
      : 'Con esa medida la tira o la unidad se salen de la pantalla');
    return;
  }
  ponEncargo(E); caja0.value='';
  flash(avisoEncargo(E));
});

function zoomAt(k){

  view.z=Math.max(0.2, Math.min(3, view.z*k));

function fitView(){
  var r=stage.getBoundingClientRect(), m=58;   /* margen para carteles y rótulos */

  if(!b){ view={x:(r.width||600)/2, y:(r.height||400)/2, z:1}; draw(); return; }
  var z=Math.min((r.width-2*m)/((b.x1-b.x0)||1), (r.height-2*m)/((b.y1-b.y0)||1));

document.addEventListener('keydown',function(e){
  if(e.target && /input|textarea|select/i.test(e.target.tagName)) return;
  var k=(e.key||'').toLowerCase();
  if((e.ctrlKey||e.metaKey) && k==='z'){ e.preventDefault(); doUndo(); return; }
  if(k==='d'){ document.getElementById('dupD').click(); }
  else if(k==='p'){ document.getElementById('probar').click(); }
  else if(k==='s'){ document.getElementById('sacar').click(); }
  else if(k==='e'){ document.getElementById('separar').click(); }
  else if(k==='j'){ document.getElementById('unir').click(); }
  else if(e.key==='ArrowRight' || e.key==='ArrowUp'){ document.getElementById('mas').click(); e.preventDefault(); }
  else if(e.key==='ArrowLeft' || e.key==='ArrowDown'){ document.getElementById('menos').click(); e.preventDefault(); }
  else if(e.key==='Delete' || e.key==='Backspace'){ document.getElementById('borrar').click(); e.preventDefault(); }
  else if(e.key==='Escape'){ sel=null; draw(); }
});

function datosActuales(){
  return {formato:'tiras-a-medida', version:1, encargo:encargo, banco:banco,
    piezas:piezas.map(function(s){
      return {tipo:s.tipo, lp:s.lp, lq:s.lq, n:s.n, pat:s.pat||0,
              fp:s.fp||0, fq:s.fq||1,
              x:+s.x.toFixed(2), y:+s.y.toFixed(2)}; })};
}

fileIn.addEventListener('change',function(e){ var f=e.target.files&&e.target.files[0]; if(f) leer(f); });
function leer(f){
  var r=new FileReader();
  r.onload=function(){ try{ loadData(JSON.parse(r.result)); }catch(err){ flash('No he podido leer ese archivo'); } };
  r.readAsText(f);
}
function entero(v){ var n=Number(v); return isFinite(n) && Math.round(n)===n ? n : null; }
function limpiaPiezas(lista){
  if(!Array.isArray(lista)) return null;
  var out=[];
  for(var i=0;i<lista.length;i++){
    var s=lista[i];
    var tipo = s.tipo==='r' ? 'r' : s.tipo==='p' ? 'p' : s.tipo==='t' ? 't' : null;
    if(!tipo) return null;
    var lp=entero(s.lp), lq=entero(s.lq);
    if(lp===null||lq===null) return null;
    if(!(lp>0 && lq>0)) return null;
    if(lp>1e6 || lq>1e6) return null;
    var x=Number(s.x), y=Number(s.y);
    if(!isFinite(x) || !isFinite(y)) return null;
    var n=Math.max(1, Math.min(MAXP, Math.round(Number(s.n)||1)));
    var fp=0, fq=1;
    if(tipo==='r'){
      fp=entero(s.fp); fq=entero(s.fq);
      if(fp===null||fq===null||fp<1||fq<1) return null;   // la referencia trae su medida
    }
    var yaHayPatron=out.some(function(o){ return o.pat; });
    var yaHayTira=out.some(function(o){ return o.tipo==='t'; });
    if(tipo==='t' && yaHayTira) return null;              // tu tira es una
    out.push({id:nid++, tipo:tipo, lp:lp, lq:lq, n:n,
              pat: tipo==='r' && s.pat && !yaHayPatron ? 1 : 0,   /* patrón hay uno */
              fp:fp, fq:fq, x:x, y:y,
              nombre: tipo==='r' ? (fp===fq ? 'u' : 'A') : ''});
  }
  return out;
}
function limpiaBanco(b){
  if(!b) return null;
  var x=Number(b.x), y=Number(b.y), w=Number(b.w), h=Number(b.h);
  if(![x,y,w,h].every(isFinite) || !(w>0 && h>0)) return null;
  return {x:x, y:y, w:w, h:h};
}
function limpiaEncargo(e){
  if(!e) return null;
  var v=[entero(e.p),entero(e.q),entero(e.rp),entero(e.rq),entero(e.lp),entero(e.lq)];
  for(var i=0;i<v.length;i++) if(v[i]===null || v[i]<1) return null;
  return {modo: Number(e.modo)===2?2:1, p:v[0],q:v[1], rp:v[2],rq:v[3], lp:v[4],lq:v[5]};
}
function loadData(d){
  var nuevas=d && limpiaPiezas(d.piezas);
  if(!nuevas){ flash('Ese archivo no trae nada que yo entienda'); return; }
  pushUndo();
  if(importMode==='add'){
    /* al añadir no se trae ni el banco ni el encargo del archivo: el que manda
       es el de aquí, y ni dos patrones ni dos tiras tuyas pueden convivir */
    var yaP=!!patron(), yaT=!!tuTira(), sobran=[];
    nuevas.forEach(function(s){
      if(s.pat){ if(yaP) s.pat=0; else yaP=true; }
      if(s.tipo==='t'){ if(yaT) sobran.push(s.id); else yaT=true; }
    });
    nuevas=nuevas.filter(function(s){ return sobran.indexOf(s.id)<0; });
    piezas=piezas.concat(nuevas);
  } else {
    piezas=nuevas; banco=limpiaBanco(d.banco); encargo=limpiaEncargo(d.encargo);
  }
  sel=null; cacheEnc=''; fitView();
  flash(nuevas.length+(nuevas.length===1?' tira cargada':' tiras cargadas'));
}
['dragenter','dragover'].forEach(function(ev){

 'doblar la referencia y se pueden doblar tus trozos. A diferencia de los manteles, aquí no hay que '+

/* el icono del doblez es una tira, no una cuadrícula: en longitud doblar es
   una sola cosa */
function iconoDoblez(n,ancho,altoIc,C){
  ancho=ancho||34; altoIc=altoIc||13; C=C||CTROZO;
  var s='<svg width="'+ancho+'" height="'+altoIc+'" viewBox="0 0 '+ancho+' '+altoIc+'">'+
    '<rect x="0.7" y="0.7" width="'+(ancho-1.4)+'" height="'+(altoIc-1.4)+'" rx="2" fill="'+C.f+
    '" stroke="'+C.b+'" stroke-width="1"/>';
  /* con muchos dobleces las rayas se comen el icono: a partir de 12 se
     insinúan solo unas cuantas */
  var paso = n>12 ? Math.ceil(n/12) : 1;
  for(var k=paso;k<n;k+=paso){
    var X=(0.7+(ancho-1.4)*k/n).toFixed(2);
    s+='<line x1="'+X+'" y1="1" x2="'+X+'" y2="'+(altoIc-1)+'" stroke="'+C.b+'" stroke-width="1"/>';
  }
  return s+'</svg>';
}

/* =========================================================================
  11. AUTOCOMPROBACIÓN  ·  añade #test al final de la dirección

function runSelfTest(){
  var out=[], fails=0;
  function ok(n,c,extra){ out.push((c?'OK    ':'FALLO ')+n+(extra!==undefined?'   ['+extra+']':'')); if(!c) fails++; }

  try{

  /* --- fracciones ------------------------------------------------------------ */
  ok('reducir simplifica', (function(){ var f=reduce(18,12); return f.p===3 && f.q===2; })());
  ok('5/6 y 10/12 son la misma fracción', igualFrac(reduce(5,6), reduce(10,12)));
  ok('sumar fracciones da el total reducido', (function(){
      var f=sumaFrac({p:1,q:6},{p:1,q:3}); return f.p===1 && f.q===2; })());
  ok('dividir fracciones compara dos longitudes', (function(){
      var f=divFrac({p:5,q:3},{p:3,q:2}); return f.p===10 && f.q===9; })(),
     textoFrac(divFrac({p:5,q:3},{p:3,q:2})));
  ok('multiplicar fracciones pasa de patrones a unidades', (function(){
      var f=multFrac({p:10,q:9},{p:3,q:4}); return f.p===5 && f.q===6; })(),
     textoFrac(multFrac({p:10,q:9},{p:3,q:4})));
  ok('«5/6» se lee bien', (function(){ var f=leeFraccion('5/6'); return f && f.p===5 && f.q===6; })());
  ok('lo que no es una fracción se rechaza',
     leeFraccion('tira')===null && leeFraccion('3/0')===null && leeFraccion('0/5')===null);
  ok('«5/6 desde 3/4» da las dos fracciones del encargo', (function(){
      var e=leeEncargoTexto('5/6 desde 3/4');
      return e && e.obj.p===5 && e.obj.q===6 && e.ref.p===3 && e.ref.q===4; })());
  ok('y también «5/6 de una tira de 3/4»', (function(){
      var e=leeEncargoTexto('5/6 de una tira de 3/4');
      return e && e.obj.p===5 && e.obj.q===6 && e.ref.p===3 && e.ref.q===4; })());
  ok('«5/6» a secas deja la referencia sin decidir', (function(){
      var e=leeEncargoTexto('5/6'); return e && e.obj.p===5 && e.obj.q===6 && e.ref===null; })());

  /* --- guardo lo que hubiera en el tablero ------------------------------------ */
  var antesP=piezas, antesS=sel, antesV=view, antesI=opt.iman, antesE=opt.etiq,
      antesC=opt.comp, antesA=opt.alfa, antesU=undoStack, antesB=banco, antesEnc=encargo;
  piezas=[]; sel=null; view={x:0,y:0,z:1}; opt.iman=1; opt.etiq=0; opt.comp=1;
  undoStack=[]; banco=null; encargo=null;

  /* --- lo que propone el entorno ------------------------------------------------ */
  ok('un encargo igual a la unidad no vale: no habría nada que fabricar', !objetivoValido(3,3));
  ok('ni una fracción que se pueda simplificar, porque el doblez que pide sería otro',
     !objetivoValido(4,6));
  ok('ni un denominador mayor que las partes en que se puede doblar una tira',
     !objetivoValido(5,MAXP+1));
  ok('una referencia que midiera lo mismo que la unidad tampoco vale', !referenciaValida(2,2));
  ok('el paso directo de A a la tira pedida es (p·s)/(q·r)', (function(){
      var m=pasoDirecto(5,6,3,4); return m.p===10 && m.q===9; })(), textoFrac(pasoDirecto(5,6,3,4)));
  ok('si ese paso pide doblar A en más de '+MAXP+', no hay ruta directa', !hayRutaDirecta(5,11,3,4));
  ok('y si A y la tira pedida midieran lo mismo, no hay encargo', !alcanzable(3,4,3,4));
  ok('hay encargos a los que no se llega doblando A una sola vez y sí rehaciendo la unidad',
     !hayRutaDirecta(5,11,3,4) && hayRutaPorLaUnidad(5,11,3,4) && alcanzable(5,11,3,4),
     'el paso directo pediría doblar A en '+pasoDirecto(5,11,3,4).q+' partes');
  ok('y otros a los que no se llega de ninguna manera',
     !alcanzable(5,6,7,11), 'ni doblando A ni rehaciendo la unidad con 11 copias');

  ok('los tres niveles proponen encargos desde la unidad que se pueden fabricar', (function(){
      var malos=[];

        for(var i=0;i<300;i++){
          var E=encargoAlAzar(1,nv);
          if(E.modo!==1) malos.push('modo '+E.modo);
          else if(!objetivoValido(E.p,E.q)) malos.push('objetivo '+E.p+'/'+E.q);
          else if(N.qs.indexOf(E.q)<0) malos.push('denominador '+E.q+' fuera del nivel '+nv);
          else if(E.p>N.maxp) malos.push('se pasa del nivel '+nv);
          else if(E.rp!==1 || E.rq!==1) malos.push('la referencia no es la unidad');
        }
      });

  ok('y los del modo desde otra tira están al alcance y caben en la pantalla', (function(){
      var malos=[];
      [0,1,2].forEach(function(nv){
        var N=NIVELES[nv];
        for(var i=0;i<300;i++){
          var E=encargoAlAzar(2,nv);
          if(E.modo!==2) malos.push('modo '+E.modo);
          else if(!objetivoValido(E.p,E.q)) malos.push('objetivo '+E.p+'/'+E.q);
          else if(N.qs.indexOf(E.q)<0) malos.push('denominador '+E.q+' fuera del nivel '+nv);
          else if(!referenciaValida(E.rp,E.rq)) malos.push('referencia '+E.rp+'/'+E.rq);
          else if(!alcanzable(E.p,E.q,E.rp,E.rq)) malos.push('no se llega');
          else if(!largoValido({p:E.lp,q:E.lq},E.p,E.q,E.rp,E.rq)) malos.push('largo fuera de pantalla');
        }

  ok('y el fácil no saca séptimos ni onceavos', (function(){

      return true; })(), 'denominadores de fácil: '+NIVELES[0].qs.join(', '));
  ok('en fácil y en normal siempre se llega doblando la referencia una sola vez', (function(){

  ok('pedir «5/6 desde 3/4» da justo ese encargo', (function(){
      var E=encargoConcreto(2,{p:5,q:6},{p:3,q:4});

  ok('pedir «5/6» sin referencia se la inventa, pero alcanzable', (function(){

        var E=encargoConcreto(2,{p:5,q:6},null);

      }
      return true; })());
  ok('y un encargo imposible avisa en vez de inventárselo',
     encargoConcreto(2,{p:5,q:6},{p:7,q:11})===null, 'ni 66 dobleces ni 11 copias');
  ok('desde la unidad, la referencia que se pone mide 1 y es la tira base', (function(){
      var E=encargoConcreto(1,{p:5,q:6},null);
      return E && E.rp===1 && E.rq===1 && E.lp===1 && E.lq===1; })());

  /* --- las tiras ----------------------------------------------------------------- */
  var E1={modo:1,p:5,q:6,rp:1,rq:1,lp:1,lq:1};
  var Uu=ponEncargo(E1);
  ok('el tablero del encargo empieza con una sola tira, la referencia',

  ok('la unidad mide lo que la tira base', Math.abs(largo(Uu)-U)<1e-9, largo(Uu)+' px');

  ok('con cuatro se quedaría corta y con seis se pasaría', (function(){
      var cuatro={p:0,q:1}, seis={p:0,q:1};
      for(var k=0;k<4;k++) cuatro=sumaFrac(cuatro, largoDe(T0));
      for(k=0;k<6;k++) seis=sumaFrac(seis, largoDe(T0));
      return cuatro.p*largoCinco.q < largoCinco.p*cuatro.q &&
             seis.p*largoCinco.q > largoCinco.p*seis.q; })());
  var M1=unir(T0);
  ok('los cinco se unen en una tira de una pieza', !!M1);
  ok('que mide 5/6 de la tira base', M1 && M1.lp===5 && M1.lq===6,
     M1? M1.lp+'/'+M1.lq : '—');
  ok('y sigue midiendo 5/6 de unidad después de unirla',
     igualFrac(enU(largoDe(M1)), {p:5,q:6}), textoFrac(enU(largoDe(M1))));
  ok('doblando la unidad en 12 y juntando 10 sale la misma tira', (function(){
      var guardaP=piezas, guardaS=sel;
      var E=ponEncargo({modo:1,p:5,q:6,rp:1,rq:1,lp:1,lq:1});
      dobla(E,12);
      var t=sacarTrozo(E);
      var suma={p:0,q:1};
      for(var k=0;k<10;k++) suma=sumaFrac(suma, largoDe(t));
      var bien = igualFrac(enU(suma), {p:5,q:6}) && !igualFrac(largoDe(t), {p:1,q:6});
      piezas=guardaP; sel=guardaS;
      return bien; })(), 'diez doceavos, con trozos de otro tamaño');

  /* --- UNA TIRA ES UN SEGMENTO ----------------------------------------------------------
     Aquí está la diferencia gorda con el mantel: allí los trozos podían
     embaldosar un rectángulo de muchas maneras; aquí solo hay una manera de
     recomponer un segmento, y hace falta que estén en la misma fila. */
  piezas=[]; sel=null; banco=null;
  function pon(lf,x,y){ var t=nuevoTrozo(lf,{x:x,y:y}); piezas.push(t); return t; }
  var med={p:1,q:2};
  ok('dos trozos seguidos en la misma fila forman un segmento', (function(){
      var a=pon(med,0,0), b=pon(med,U/2,0);
      var R=segmentoDe([a,b]);
      piezas=[]; sel=null;
      return !!R && R.len.p===1 && R.len.q===1; })());
  ok('con un hueco en medio, no', (function(){
      var a=pon(med,0,0), b=pon(med,U/2+9,0);
      var R=segmentoDe([a,b]);
      piezas=[]; sel=null;
      return R===null; })(), 'nueve píxeles de aire');
  ok('montados uno encima de otro, tampoco', (function(){
      var a=pon(med,0,0), b=pon(med,U/4,0);
      var R=segmentoDe([a,b]);
      piezas=[]; sel=null;
      return R===null; })(), 'se solapan medio trozo');
  ok('y en filas distintas, tampoco, aunque uno acabe donde empieza el otro', (function(){
      var a=pon(med,0,0), b=pon(med,U/2,ALTO+HUECO);
      var R=segmentoDe([a,b]);
      piezas=[]; sel=null;
      return R===null; })(), 'es lo que en el mantel sí valdría');
  ok('unir dos trozos seguidos da una tira sin marcas por dentro', (function(){
      var a=pon(med,0,0), b=pon(med,U/2,0);
      var t=unir(a);
      var bien = !!t && t.n===1 && igualFrac(largoDe(t),{p:1,q:1}) && piezas.length===1;
      piezas=[]; sel=null;
      return bien; })());
  ok('una tira suelta no se une consigo misma', (function(){
      var a=pon(med,0,0);
      var r=unir(a);
      piezas=[]; sel=null;
      return r===null; })());
  /* con un hueco los trozos ni siquiera se tocan, así que el grupo es de uno y
     al banco se va ese solo: lo que hay que provocar para que salte el aviso
     es un grupo pegado que NO sea un segmento, y en una fila eso es un solape */
  ok('llevar al banco dos trozos montados uno encima de otro no se admite', (function(){
      piezas=[]; sel=null; banco=null;
      ponEncargo(E1);
      var a=pon(med,0,4*ALTO), b=pon(med,U/4,4*ALTO);
      var r=probar(a);
      return r.ok===false && r.por==='no-segmento' && r.n===2; })());
  ok('pero un trozo separado de los demás se lleva él solo, sin protestar', (function(){
      piezas=[]; sel=null; banco=null;
      ponEncargo(E1);
      var a=pon(med,0,4*ALTO), b=pon(med,U/2+9,4*ALTO);
      var r=probar(a);
      return r.ok===true && r.n===1; })(), 'nueve píxeles de aire ya lo dejan suelto');

  /* --- separar ---------------------------------------------------------------------- */
  piezas=[]; sel=null;
  var g0=nuevoTrozo({p:1,q:1},{x:0,y:0});
  piezas=[g0];
  dobla(g0,4);
  var hijos=separar(g0);
  ok('separar una tira doblada en 4 da cuatro trozos', hijos && hijos.length===4, hijos&&hijos.length);
  ok('y entre todos miden lo mismo que la tira de partida', (function(){
      var s={p:0,q:1};
      hijos.forEach(function(h){ s=sumaFrac(s, largoDe(h)); });
      return s.p===1 && s.q===1; })());
  ok('los cuatro quedan seguidos donde estaba la original, sin huecos',
     !!segmentoDe(hijos) && Math.abs(segmentoDe(hijos).x-0)<1e-9);
  ok('el grupo pegado son los cuatro', grupoDe(hijos[0]).length===4, grupoDe(hijos[0]).length);
  ok('y uno apartado no entra en el grupo', (function(){
      var lejos=nuevoTrozo({p:1,q:1},{x:5*U,y:5*ALTO});
      piezas.push(lejos);
      var n=grupoDe(hijos[0]).length;
      piezas=piezas.filter(function(s){ return s.id!==lejos.id; });
      return n===4; })());

  /* --- el imán ------------------------------------------------------------------------------ */
  piezas=[]; sel=null; banco=null;
  var W=ponEncargo(E1);
  dobla(W,4);
  ok('un trozo casi pegado a otro se engancha por el extremo', (function(){
      var b1=nuevoTrozo({p:1,q:4},{x:0,y:5*ALTO});
      var b2=nuevoTrozo({p:1,q:4},{x:U/4+5, y:5*ALTO+4});
      piezas.push(b1); piezas.push(b2);
      aplicaIman(b2);
      var bien=Math.abs(b2.x-(b1.x+U/4))<1e-9 && Math.abs(b2.y-b1.y)<1e-9;
      piezas=piezas.filter(function(s){ return s.id!==b1.id && s.id!==b2.id; });
      return bien; })());
  ok('y uno que está lejos se queda donde lo sueltes', (function(){
      var b3=nuevoTrozo({p:1,q:2},{x:9*U, y:9*ALTO});
      piezas.push(b3);
      var x0=b3.x, y0=b3.y;
      aplicaIman(b3);
      var quieto=Math.abs(b3.x-x0)<1e-9 && Math.abs(b3.y-y0)<1e-9;
      piezas=piezas.filter(function(s){ return s.id!==b3.id; });
      return quieto; })());
  /* el trozo de prueba mide 1/5 a propósito: con 1/8 su extremo derecho caía
     a un pelo de la marca siguiente y el imán enganchaba por ahí, que es lo
     correcto, pero entonces la prueba no probaba lo que dice */
  ok('el imán engancha también con las marcas de doblar la referencia', (function(){
      var b4=nuevoTrozo({p:1,q:5},{x:W.x+largo(W)*2/4+6, y:W.y-3});
      piezas.push(b4);
      aplicaIman(b4);
      var bien=Math.abs(b4.x-(W.x+largo(W)*2/4))<1e-9 && Math.abs(b4.y-W.y)<1e-9;
      piezas=piezas.filter(function(s){ return s.id!==b4.id; });
      return bien; })());
  ok('y en vertical deja las tiras en la fila de al lado, no a medio camino', (function(){
      var b5=nuevoTrozo({p:1,q:5},{x:W.x, y:W.y+ALTO+HUECO+5});
      piezas.push(b5);
      aplicaIman(b5);
      var bien=Math.abs(b5.y-(W.y+ALTO+HUECO))<1e-9;
      piezas=piezas.filter(function(s){ return s.id!==b5.id; });
      return bien; })());

  /* --- EL RECORRIDO ENTERO, MODO DESDE LA UNIDAD ----------------------------------------------
     Doblar la unidad en 6, sacar una parte, juntar cinco, unirlas, llevarlas
     al banco y medir allí la tira con una copia limpia de la unidad. */
  piezas=[]; sel=null; banco=null;
  var A1=ponEncargo(E1);
  dobla(A1,6);
  var p1=sacarTrozo(A1), q1=p1;
  for(i=1;i<5;i++) q1=duplicaEn(q1);
  var man1=unir(p1);
  var r1=probar(man1);
  ok('llevar la tira montada al banco lo monta', r1.ok===true, r1.por||'ok');
  var P1=patron(), TT1=tuTira();
  ok('en el banco hay un patrón y tu tira', !!P1 && !!TT1);
  ok('el patrón es la referencia otra vez entera, sin los dobleces de construir',
     P1.n===1 && P1.fp===1 && P1.fq===1, 'la de construir sigue doblada en '+A1.n);
  ok('y lleva su cartel de siempre', textoCartel(P1)==='u', textoCartel(P1));
  ok('tu tira llega en una pieza lisa y sin ningún número escrito',
     TT1.n===1 && textoCartel(TT1)==='tu tira', textoCartel(TT1));
  ok('el banco cae debajo de lo construido, que es donde sobra sitio con tiras',
     banco.y > caja(piezas.filter(function(s){ return !enBanco(s); })).y1);
  ok('y el patrón va en la fila de debajo de tu tira, no al lado',
     P1.y>TT1.y && Math.abs(P1.x-TT1.x)<1e-9, 'las dos alineadas por la izquierda');
  ok('las dos caben enteras dentro del panel del banco',
     enBanco(TT1) && enBanco(P1) &&
     TT1.x>=banco.x-1e-6 && TT1.x+largo(TT1)<=banco.x+banco.w+1e-6 &&
     P1.x+largo(P1)<=banco.x+banco.w+1e-6 &&
     TT1.y>=banco.y-1e-6 && P1.y+ALTO<=banco.y+banco.h+1e-6,
     'panel de '+Math.round(banco.w)+'x'+Math.round(banco.h));
  /* el cartel se dibuja en pantalla y el hueco entre filas se encoge con el
     zoom: si no se comprueba, con el tablero grande el cartel del patrón se
     sube encima de tu tira. 26 px son los 21 del cartel más los 5 de aire */
  ok('y entre las dos filas cabe el cartel del patrón aun con el zoom al 40%',
     (P1.y-(TT1.y+ALTO))*0.4 > 26,
     'hueco de '+Math.round(P1.y-(TT1.y+ALTO))+' de mundo, '+
     Math.round((P1.y-(TT1.y+ALTO))*0.4)+' px al 40%');
  ok('la zona de construir se queda como estaba: la referencia y la tira montada',
     piezas.filter(function(s){ return !enBanco(s); }).length===2,
     piezas.filter(function(s){ return !enBanco(s); }).length);
  ok('volver a llevar rehace el banco en vez de acumular otro', (function(){
      var r2=probar(man1);
      return r2.ok && piezas.filter(function(s){ return s.pat; }).length===1 &&
             piezas.filter(function(s){ return s.tipo==='t'; }).length===1; })(),
     piezas.length+' tiras en total');
  P1=patron(); TT1=tuTira();

  dobla(P1,6);
  ok('doblado en 6, cada parte del patrón vale 1/6 de unidad',
     textoFrac(partePatron().mu)==='1/6', textoFrac(partePatron().mu));
  var m1=sacarTrozo(P1);
  m1.x=TT1.x; m1.y=TT1.y;
  var cubren1=[m1];
  for(i=1;i<5;i++) cubren1.push(duplicaEn(cubren1[i-1]));
  ok('cinco de esas partes llegan justo al final de tu tira',
     Math.abs((cubren1[4].x+largo(cubren1[4]))-(TT1.x+largo(TT1)))<1e-9);
  var med1=medidaDe(TT1);
  ok('midiendo así, a tu tira le salen los 5/6 del encargo',
     med1.estado==='ok' && med1.n===5 && igualFrac(med1.frac,{p:5,q:6}),
     med1.frac? med1.n+' partes → '+textoFrac(med1.frac)+' u' : '—');
  ok('la cuenta se da sin simplificar: arriba las partes que caben, abajo en las que se dobló',
     med1.cuenta && textoFrac(med1.cuenta.total)==='5/6' && med1.cuenta.delPatron &&
     partePatron().N===6,
     med1.cuenta? textoFrac(med1.cuenta.total) : 'sin cuenta');
  ok('y una parte más se saldría de la tira',
     Math.abs((cubren1[4].x+2*largo(m1))-(TT1.x+largo(TT1)))>1e-6);
  ok('quitando una parte, la cuenta baja a 4/6 aunque la fracción sea 2/3', (function(){
      var guarda=cubren1[4].x;
      cubren1[4].x=TT1.x-3*largo(TT1);
      var r=medidaDe(TT1);
      cubren1[4].x=guarda;
      return r.cuenta && textoFrac(r.cuenta.total)==='4/6' &&
             r.frac.p===2 && r.frac.q===3; })());
  ok('un trozo puesto en la fila de debajo NO cuenta: se mide lo que está encima', (function(){
      var suelto=nuevoTrozo({p:1,q:6},{x:TT1.x, y:TT1.y+ALTO+HUECO});
      piezas.push(suelto);
      var r=medidaDe(TT1);
      piezas=piezas.filter(function(s){ return s.id!==suelto.id; });
      return r.n===5; })(), 'sigue habiendo 5 encima');
  ok('una tira mal fabricada se mide igual, y sale la fracción que sea', (function(){
      var extra=duplicaEn(cubren1[4]);
      extra.x=TT1.x+largo(TT1)/2; extra.y=TT1.y;   /* dentro, aunque solape */
      var r=medidaDe(TT1);
      piezas=piezas.filter(function(s){ return s.id!==extra.id; });
      return r.n===6 && textoFrac(r.cuenta.total)==='6/6' && textoFrac(r.frac)==='1'; })(),
     'seis sextos: la cuenta sale, el juicio no');

  /* --- EL RECORRIDO ENTERO, MODO DESDE OTRA TIRA ----------------------------------------------
     A mide 3/4 u y el encargo es 5/6 u. El paso directo es (5·4)/(6·3)=10/9:
     doblar A en 9 y juntar 10 de esas partes. */
  piezas=[]; sel=null; banco=null;
  var E2={modo:2,p:5,q:6,rp:3,rq:4,lp:3,lq:2};
  var A2=ponEncargo(E2);
  ok('la referencia del segundo modo lleva su nombre y su medida en el cartel',
     textoCartel(A2)==='A · 3/4 u', textoCartel(A2));
  ok('y no es la unidad: la unidad no está en el tablero',
     A2.fp!==A2.fq && !piezas.some(function(s){ return s.tipo==='r' && s.fp===s.fq; }));
  ok('A mide 3/4 de unidad, así que la unidad sería 4/3 de A',
     igualFrac(enU(largoDe(A2)), {p:3,q:4}), textoFrac(enU(largoDe(A2))));
  dobla(A2,9);
  ok('doblada A en 9, cada parte vale 1/12 de unidad',
     textoFrac(valorCelda(A2))==='1/12', textoFrac(valorCelda(A2)));
  var p2=sacarTrozo(A2), q2=p2;
  for(i=1;i<10;i++) q2=duplicaEn(q2);
  ok('diez de esas partes son un grupo de diez', grupoDe(p2).length===10, grupoDe(p2).length);
  var man2=unir(p2);
  ok('las diez se unen en una tira de una pieza', !!man2);
  ok('y esa tira mide los 5/6 de unidad del encargo',
     igualFrac(enU(largoDe(man2)), {p:5,q:6}), textoFrac(enU(largoDe(man2))));
  ok('nueve se habrían quedado en 3/4 y once se habrían pasado a 11/12', (function(){
      var nueve={p:0,q:1}, once={p:0,q:1};
      for(var k=0;k<9;k++) nueve=sumaFrac(nueve,{p:1,q:6});
      for(k=0;k<11;k++) once=sumaFrac(once,{p:1,q:6});
      return textoFrac(enU(nueve))==='3/4' && textoFrac(enU(once))==='11/12'; })(),
     'nueve partes vuelven a dar A');
  var r2=probar(man2);
  ok('llevar al banco monta el patrón A y tu tira', r2.ok===true, r2.por||'ok');
  var P2=patron(), TT2=tuTira();
  ok('el patrón del banco es A, limpio y con su medida',
     P2.n===1 && P2.fp===3 && P2.fq===4 && textoCartel(P2)==='A · 3/4 u', textoCartel(P2));
  dobla(P2,9);
  var m2=sacarTrozo(P2);
  m2.x=TT2.x; m2.y=TT2.y;
  var cubren2=[m2];
  for(i=1;i<10;i++) cubren2.push(duplicaEn(cubren2[i-1]));
  ok('diez partes llegan justo al final de tu tira',
     Math.abs((cubren2[9].x+largo(cubren2[9]))-(TT2.x+largo(TT2)))<1e-9);
  var med2=medidaDe(TT2);
  ok('en patrones tu tira mide 10/9 de A', igualFrac(med2.pat,{p:10,q:9}), textoFrac(med2.pat));
  ok('y en unidades, los 5/6 del encargo',
     med2.estado==='ok' && med2.n===10 && igualFrac(med2.frac,{p:5,q:6}),
     med2.n+' partes → '+textoFrac(med2.frac)+' u');
  ok('la cuenta se enseña sin simplificar: 10/12 de unidad',
     med2.cuenta && textoFrac(med2.cuenta.total)==='10/12' && med2.cuenta.delPatron &&
     partePatron().N===9,
     med2.cuenta? textoFrac(med2.cuenta.total)+' con el patrón doblado en '+partePatron().N : 'sin cuenta');
  ok('el patrón A puesto encima de tu tira cuenta 3/4 de unidad', (function(){
      var fuera=cubren2.map(function(t){ return t.x; });
      cubren2.forEach(function(t){ t.x=TT2.x-6*largo(TT2); });
      var gx=P2.x, gy=P2.y, gn=P2.n;
      P2.n=1;
      P2.x=TT2.x+largo(TT2)/2-largo(P2)/2; P2.y=TT2.y;
      var r=medidaDe(TT2);
      P2.x=gx; P2.y=gy; P2.n=gn;
      cubren2.forEach(function(t,k){ t.x=fuera[k]; });
      return r.estado==='ok' && r.n===1 && igualFrac(r.frac,{p:3,q:4}); })(),
     'un patrón entero → 3/4 u');
  ok('y si lo puesto no son todos trozos iguales, no hay cuenta que dar, solo la fracción',
     (function(){
      var raro=nuevoTrozo({p:1,q:7},{x:TT2.x+largo(TT2)/2, y:TT2.y});
      piezas.push(raro);
      var r=medidaDe(TT2);
      piezas=piezas.filter(function(s){ return s.id!==raro.id; });
      return !r.cuenta && !!r.frac; })());
  ok('sin patrón no hay medida', (function(){
      P2.pat=0;
      var e=medidaDe(TT2).estado;
      P2.pat=1;
      return e==='sin-patron'; })());
  ok('lo de la zona de construir no cuenta: se mide la tira del banco',
     medidaDe(man2).estado==='sin-trozos' && medidaDe(TT2).estado==='ok');

  /* --- la cuenta solo sale si se pide ----------------------------------------------------------- */
  sel=null;
  opt.comp=0; cacheMedir=''; cacheBanco=''; draw();
  ok('con las comprobaciones apagadas, el panel de la cuenta no se ve',
     document.getElementById('panelMedir').style.display==='none' &&
     document.getElementById('h2Medir').style.display==='none');
  ok('y el del banco dice lo que hay sin sacar cuentas',
     document.getElementById('panelBanco').textContent.indexOf('1/12')<0 &&
     document.getElementById('panelBanco').textContent.indexOf('10/12')<0,
     document.getElementById('panelBanco').textContent.replace(/\s+/g,' ').slice(0,52));
  opt.comp=1; cacheMedir=''; draw();
  var txtMed=document.getElementById('panelMedir').textContent.replace(/\s+/g,' ');
  ok('encendidas, aparece con la fracción que ha medido el alumno',
     document.getElementById('panelMedir').style.display!=='none' && txtMed.indexOf('10/12')>=0,
     txtMed.slice(0,86));
  ok('el panel no juzga: en ningún sitio dice si está acertado o no',
     !/\b(bien|mal|correct|incorrect|acierto|error|fallo)/i.test(txtMed), txtMed.slice(0,60));
  ok('y el encargo se recuerda al lado, para que lo compare quien mide',
     txtMed.indexOf('5/6')>=0);

  /* --- EL RECORRIDO ENTERO CUANDO NO HAY ATAJO ------------------------------------------------
     A mide 3/4 u y se piden 5/11 u, o sea 20/33 de A, y en 33 partes no se
     puede doblar nada. Hay que construir por etapas. Y lo mismo pasa DENTRO
     del banco, así que se mide con partes de lo construido por el camino y la
     cuenta tiene que seguir saliendo. */
  piezas=[]; sel=null; banco=null;
  var E3={modo:2,p:5,q:11,rp:3,rq:4,lp:3,lq:2};
  var A6=ponEncargo(E3);
  ok('con este encargo el paso directo pediría 33 dobleces, que no caben',
     !hayRutaDirecta(5,11,3,4), textoFrac(pasoDirecto(5,11,3,4))+' de A');
  dobla(A6,3);
  var c6=sacarTrozo(A6);
  ok('doblada A en 3, cada parte vale 1/4 de unidad',
     textoFrac(enU(largoDe(c6)))==='1/4', textoFrac(enU(largoDe(c6))));
  var d6=c6;
  for(i=1;i<4;i++) d6=duplicaEn(d6);
  var uni6=unir(c6);
  ok('cuatro de esas partes rehacen la unidad entera',
     !!uni6 && textoFrac(enU(largoDe(uni6)))==='1', uni6? textoFrac(enU(largoDe(uni6))) : '—');
  dobla(uni6,11);
  var e6=sacarTrozo(uni6);
  ok('y doblando esa unidad en 11, cada parte vale 1/11 de unidad',
     textoFrac(enU(largoDe(e6)))==='1/11', textoFrac(enU(largoDe(e6))));
  var f6=e6;
  for(i=1;i<5;i++) f6=duplicaEn(f6);
  var man6=unir(e6);
  ok('cinco de ellas son la tira encargada, 5/11 de unidad',
     !!man6 && textoFrac(enU(largoDe(man6)))==='5/11', man6? textoFrac(enU(largoDe(man6))) : '—');
  var r6=probar(man6);
  ok('y se lleva al banco como cualquier otra', r6.ok===true, r6.por||'ok');
  var P6=patron(), TT6=tuTira();
  ok('el patrón del banco sigue siendo A, que tampoco se deja doblar en 33',
     P6.fp===3 && P6.fq===4 && pasoDirecto(5,11,3,4).q>MAXP, textoCartel(P6));
  dobla(P6,3);
  var g6=sacarTrozo(P6), h6=g6;
  for(i=1;i<4;i++) h6=duplicaEn(h6);
  var u6=unir(g6);
  ok('en el banco la unidad se rehace igual, con cuatro partes del patrón',
     !!u6 && textoFrac(enU(largoDe(u6)))==='1', u6? textoFrac(enU(largoDe(u6))) : '—');
  dobla(u6,11);
  var j6=sacarTrozo(u6);
  j6.x=TT6.x; j6.y=TT6.y;
  var cubren6=[j6];
  for(i=1;i<5;i++) cubren6.push(duplicaEn(cubren6[i-1]));
  ok('cinco onceavos de esa unidad llegan justo al final de tu tira',
     Math.abs((cubren6[4].x+largo(cubren6[4]))-(TT6.x+largo(TT6)))<1e-9);
  var med6=medidaDe(TT6);
  ok('y midiendo así salen los 5/11 del encargo',
     med6.estado==='ok' && med6.n===5 && igualFrac(med6.frac,{p:5,q:11}),
     med6.n+' partes → '+textoFrac(med6.frac)+' u');
  ok('la cuenta sale aunque lo puesto NO sean partes del patrón',
     !!med6.cuenta && med6.cuenta.delPatron===false &&
     textoFrac(med6.cuenta.mu)==='1/11' && textoFrac(med6.cuenta.total)==='5/11',
     med6.cuenta? '5 trozos de '+textoFrac(med6.cuenta.mu)+' → '+textoFrac(med6.cuenta.total)
                : 'sin cuenta');
  opt.comp=1; cacheMedir=''; sel=null; draw();
  var txt6=document.getElementById('panelMedir').textContent.replace(/\s+/g,' ');
  ok('y el panel dice de cuánto es cada trozo, que si no la fracción saldría de la nada',
     txt6.indexOf('1/11 u cada uno')>=0, txt6.slice(0,96));

  /* --- las etiquetas van en unidades, y tu tira no lleva ninguna ------------------------------ */
  piezas=[]; sel=null; banco=null;
  var A3=ponEncargo(E2);
  var e3=nuevoTrozo({p:1,q:2},{x:0,y:6*ALTO});
  piezas.push(e3);
  ok('con A de 3/4 u, un trozo de medio largo base vale 1/4 de unidad',
     textoFrac(valorCelda(e3))==='1/4', textoFrac(valorCelda(e3)));
  dobla(e3,3);
  ok('y si ese trozo se dobla en 3, cada parte vale 1/12',
     textoFrac(valorCelda(e3))==='1/12', textoFrac(valorCelda(e3)));
  ok('sin referencia en el tablero no se etiqueta nada', (function(){
      var g=piezas;
      piezas=[e3];
      var v=valorCelda(e3);
      piezas=g;
      return v===null; })());
  ctx.save();
  ctx.font='11px -apple-system,Segoe UI,Roboto,sans-serif';
  var anLargo=ctx.measureText('1/6 u').width, anCorto=ctx.measureText('1/6').width;
  var etL=etiquetaTrozo(ctx,{p:1,q:6},anLargo+8,ALTO);
  var etC=etiquetaTrozo(ctx,{p:1,q:6},anCorto+8,ALTO);
  var etN=etiquetaTrozo(ctx,{p:1,q:6},anCorto,ALTO);
  var etBaja=etiquetaTrozo(ctx,{p:1,q:6},anLargo+8,9);
  ctx.restore();
  ok('la etiqueta lleva la unidad detrás: 1/6 u', etL==='1/6 u', etL);
  ok('si el trozo es estrecho se queda con la fracción sola', etC==='1/6', etC);
  ok('si no cabe ni eso, no se escribe nada', etN==='', '«'+etN+'»');
  ok('y si la tira se ve muy baja por el zoom, tampoco', etBaja==='', '«'+etBaja+'»');

  /* --- guardar y abrir ------------------------------------------------------------------------ */
  piezas=[]; sel=null; encargo=E2;
  banco={x:-40, y:-15, w:2*U, h:4*ALTO};
  var s1=nuevoTrozo({p:3,q:10},{x:11,y:22}); s1.n=5;
  var s2=nuevaRef(E2,{x:-30,y:80},true);
  var s3=nuevaTuTira({p:5,q:3},{x:120,y:-5});
  piezas=[s1,s2,s3];
  function firmaDe(){
    return piezas.map(function(s){
      return s.tipo+':'+s.lp+'/'+s.lq+':n'+s.n+':u'+(s.pat||0)+
             ':'+(s.fp||0)+'/'+(s.fq||1)+':'+s.x.toFixed(2)+','+s.y.toFixed(2); }).join(' | ');
  }
  var firma=firmaDe();
  var data=datosActuales();
  banco=null; encargo=null;
  importMode='replace'; loadData(JSON.parse(JSON.stringify(data)));
  ok('guardar y volver a abrir conserva las tiras, los dobleces y el patrón',
     firmaDe()===firma, firmaDe());
  ok('y también el banco', !!banco && Math.abs(banco.w-2*U)<1e-9, banco? banco.w : 'sin banco');
  ok('y el encargo, que si no no se sabría qué se estaba fabricando',
     !!encargo && encargo.p===5 && encargo.q===6 && encargo.rp===3 && encargo.rq===4 &&
     encargo.modo===2, encargo? encargo.p+'/'+encargo.q+' desde '+encargo.rp+'/'+encargo.rq : '—');
  var n0=piezas.length;
  importMode='add'; loadData(JSON.parse(JSON.stringify(data)));
  ok('el botón ＋ añade sin borrar lo que había, y deja fuera la segunda tira tuya',
     piezas.length===n0+2, piezas.length);
  ok('no aparece un segundo patrón, que patrón hay uno',
     piezas.filter(function(s){ return s.pat; }).length===1,
     piezas.filter(function(s){ return s.pat; }).length);
  ok('ni una segunda tira tuya',
     piezas.filter(function(s){ return s.tipo==='t'; }).length===1,
     piezas.filter(function(s){ return s.tipo==='t'; }).length);
  importMode='replace';
  ok('un archivo con dos patrones deja solo el primero', (function(){
      var l=limpiaPiezas([{tipo:'r',lp:1,lq:1,n:1,pat:1,fp:3,fq:4,x:0,y:0},
                          {tipo:'r',lp:1,lq:1,n:1,pat:1,fp:3,fq:4,x:0,y:0}]);
      return l && l.filter(function(s){ return s.pat; }).length===1; })());
  ok('un archivo con una referencia sin medida se rechaza',
     limpiaPiezas([{tipo:'r',lp:1,lq:1,n:1,x:0,y:0}])===null);
  ok('y uno con dos tiras tuyas',
     limpiaPiezas([{tipo:'t',lp:1,lq:1,n:1,x:0,y:0},
                   {tipo:'t',lp:1,lq:1,n:1,x:0,y:0}])===null);
  ok('y uno con longitudes de cero o negativas',
     limpiaPiezas([{tipo:'p',lp:0,lq:1,n:1,x:0,y:0}])===null &&
     limpiaPiezas([{tipo:'p',lp:1,lq:-2,n:1,x:0,y:0}])===null);
  ok('y uno con coordenadas que no son números',
     limpiaPiezas([{tipo:'p',lp:1,lq:1,n:1,x:'ahí',y:0}])===null);
  ok('y uno con una tira de un tipo que no existe',
     limpiaPiezas([{tipo:'servilleta',lp:1,lq:1,n:1,x:0,y:0}])===null);
  ok('un encargo con números raros se descarta en vez de romper el tablero',
     limpiaEncargo({modo:2,p:5,q:0,rp:3,rq:4,lp:1,lq:1})===null &&
     limpiaEncargo({modo:1,p:'x',q:6,rp:1,rq:1,lp:1,lq:1})===null);

  /* --- reiniciar y deshacer ------------------------------------------------------------------- */
  piezas=[]; sel=null; undoStack=[]; banco=null;
  var A4=ponEncargo(E1);
  dobla(A4,4);
  var t4=sacarTrozo(A4);
  duplicaEn(t4);
  ok('en el tablero hay ya la unidad y dos trozos', piezas.length===3, piezas.length);
  reinicia();
  ok('reiniciar deja el mismo encargo con la referencia sola',
     piezas.length===1 && piezas[0].tipo==='r' && piezas[0].n===1 &&
     encargo.p===5 && encargo.q===6, piezas.length+' tira(s)');
  doUndo();
  ok('y deshacer devuelve lo que había', piezas.length===3, piezas.length);
  undoStack=[];
  piezas=[]; sel=null; banco=null;
  var A5=ponEncargo(E1);
  dobla(A5,2);
  var t5=sacarTrozo(A5);
  probar(t5);
  ok('llevar al banco deja un patrón y una tira tuya',
     !!patron() && !!tuTira() && !!banco);
  doUndo();
  ok('y deshacer se lo lleva entero, banco incluido',
     !patron() && !tuTira() && !banco, piezas.length+' tiras');

  piezas=antesP; sel=antesS; view=antesV; opt.iman=antesI; opt.etiq=antesE;
  opt.comp=antesC; opt.alfa=antesA; undoStack=antesU; banco=antesB; encargo=antesEnc;
  cacheDoblez=''; cacheBanco=''; cacheMedir=''; cacheEnc='';
  draw();

  }catch(errT){
    fails++;
    out.push('FALLO se ha cortado aquí: '+((errT&&errT.message)||errT));
    if(errT&&errT.stack) String(errT.stack).split('\n').slice(0,5).forEach(function(l){
      out.push('        '+l.trim()); });
    try{ draw(); }catch(e2){}
  }

  /* --- informe ------------------------------------------------------------------------------- */
  var texto=out.join('\n')+'\n\n'+(fails? fails+' PRUEBAS FALLIDAS de '+out.length
                                         : 'LAS '+out.length+' PRUEBAS CORRECTAS');
  var box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;background:#fff;z-index:99;overflow:auto;padding:18px 22px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
  box.innerHTML='<div style="font:600 15px/1.3 -apple-system,Segoe UI,Roboto,sans-serif;margin-bottom:4px">'+
      'Autocomprobación de Tiras a medida</div>'+
    '<div style="font:13px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;color:'+(fails?'#c2410c':'#15803d')+';font-weight:600;margin-bottom:12px">'+
      (fails? fails+' pruebas fallidas de '+out.length : 'Las '+out.length+' pruebas correctas')+'</div>'+
    '<button id="cpTest" style="font:13px -apple-system,Segoe UI,Roboto,sans-serif;padding:6px 12px;margin-bottom:14px;'+
      'border:1px solid #d5d9e0;border-radius:7px;background:#fff;cursor:pointer">Copiar informe</button> '+
    '<button id="clTest" style="font:13px -apple-system,Segoe UI,Roboto,sans-serif;padding:6px 12px;margin-bottom:14px;'+
      'border:1px solid #d5d9e0;border-radius:7px;background:#fff;cursor:pointer">Cerrar y usar el manipulativo</button>'+
    '<pre style="white-space:pre-wrap;margin:0">'+
      out.map(function(l){ return l.indexOf('FALLO')===0
        ? '<span style="color:#c2410c;font-weight:700">'+l+'</span>' : l; }).join('\n')+'</pre>';
  document.body.appendChild(box);
  document.getElementById('cpTest').addEventListener('click',function(){
    var ta=document.createElement('textarea'); ta.value=texto; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); }catch(err){}
    document.body.removeChild(ta); this.textContent='Copiado ✓';
  });
  document.getElementById('clTest').addEventListener('click',function(){ box.remove(); });
}
var testLanzado=false;
function lanzarTest(){ if(testLanzado) return; testLanzado=true; runSelfTest(); }
if((location.hash||'').indexOf('test')>=0) setTimeout(lanzarTest,60);
window.addEventListener('hashchange',function(){
  if((location.hash||'').indexOf('test')>=0) lanzarTest();
});

window.__tirasAMedida={
  test:runSelfTest, U:U, ALTO:ALTO, HUECO:HUECO, MAXP:MAXP, NIVELES:NIVELES, opt:opt,
  piezas:function(){ return piezas; }, sel:function(){ return sel; },
  encargo:function(){ return encargo; }, banco:function(){ return banco; },
  largo:largo, largoDe:largoDe, celda:celda, marcas:marcas,
  dobla:dobla, sacarTrozo:sacarTrozo, separar:separar, duplicaEn:duplicaEn,
  grupoDe:grupoDe, unir:unir, segmentoDe:segmentoDe,
  probar:probar, patron:patron, tuTira:tuTira, refTrabajo:refTrabajo, enBanco:enBanco,
  enU:enU, valorCelda:valorCelda, medidaDe:medidaDe, partePatron:partePatron,
  trozosSobre:trozosSobre, textoCartel:textoCartel, textoFrac:textoFrac,
  ponEncargo:ponEncargo, reinicia:reinicia, cajaTodo:cajaTodo,
  encargoAlAzar:encargoAlAzar, encargoConcreto:encargoConcreto,
  objetivoValido:objetivoValido, referenciaValida:referenciaValida, pasoDirecto:pasoDirecto,
  hayRutaDirecta:hayRutaDirecta, hayRutaPorLaUnidad:hayRutaPorLaUnidad, alcanzable:alcanzable,
  leeFraccion:leeFraccion, leeEncargoTexto:leeEncargoTexto,
  reduce:reduce, divFrac:divFrac, sumaFrac:sumaFrac, multFrac:multFrac,
  aplicaIman:aplicaIman, load:loadData, setMode:function(m){ importMode=m; },
  view:function(){ return view; }, w2s:w2s, s2w:s2w,
  redraw:draw, fit:fitView
};

})();
