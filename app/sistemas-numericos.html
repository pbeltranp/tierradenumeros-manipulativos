<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sistemas numéricos · manipulativo virtual</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
       font-size:14px;color:#2b2f36;background:#fff;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #app{display:flex;height:100%;width:100%}

  #side{width:196px;flex:0 0 196px;background:#f4f5f7;border-right:1px solid #dfe2e7;
        overflow-y:auto;padding:10px 10px 24px}
  #side .brand{font-size:19px;font-weight:200;letter-spacing:.02em;color:#39404a;line-height:1.25;
               padding:2px 2px 10px;margin-bottom:11px;border-bottom:1px solid #e3e6eb}
  #side .brand b{font-weight:400;color:#2b2f36}
  #side h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8a919c;margin:14px 0 7px;font-weight:600}
  .act{display:block;width:100%;text-align:left;border:1px solid #e3e6eb;background:#fff;border-radius:7px;
       padding:6px 9px;margin-bottom:4px;font-size:12.5px;color:#3d4450;cursor:pointer}
  .act:hover:not(:disabled){background:#f0f2f5;border-color:#c8cdd6}
  .act:disabled{opacity:.42;cursor:default}
  select.sel{display:block;width:100%;border:1px solid #e3e6eb;background:#fff;border-radius:7px;
             padding:6px 7px;font:inherit;font-size:12.5px;color:#3d4450;cursor:pointer;margin-bottom:4px}
  select.sel:hover{border-color:#c8cdd6}
  .fila{display:flex;gap:4px;margin-bottom:4px;align-items:center}
  .fila input{flex:1;min-width:0;border:1px solid #e3e6eb;border-radius:7px;padding:6px 7px;
              font:inherit;font-size:12.5px;color:#3d4450}
  .fila .act{width:auto;flex:0 0 auto;margin:0}
  .fila label{font-size:11.5px;color:#8a919c;flex:0 0 auto}
  #marcador{font-size:11.5px;color:#6b7280;line-height:1.6;margin-top:6px}
  #marcador b{color:#2b2f36}
  #ficha{font-size:11.5px;color:#6b7280;line-height:1.55;margin-top:12px;border-top:1px solid #e3e6eb;padding-top:9px}
  #ficha b{color:#2b2f36}
  #ficha .s{display:block;margin-bottom:7px}
  .note{font-size:10.5px;line-height:1.45;color:#8a919c;margin-top:12px}

  main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
  #toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:7px 9px;
           border-bottom:1px solid #dfe2e7;background:#fafbfc}
  .btn{border:1px solid #d5d9e0;background:#fff;border-radius:7px;padding:5px 9px;font-size:12.5px;
       color:#3d4450;cursor:pointer;display:inline-flex;align-items:center;gap:5px;line-height:1.2}
  .btn:hover:not(:disabled){background:#f0f2f5}
  .btn:disabled{opacity:.42;cursor:default}
  .btn.on{background:#2f62a8;border-color:#2f62a8;color:#fff}
  .btn.on:hover{background:#2a589a}
  .btn.prim{background:#2f62a8;border-color:#2f62a8;color:#fff;font-weight:600}
  .btn.prim:hover:not(:disabled){background:#2a589a}
  .sep{width:1px;height:20px;background:#dfe2e7;margin:0 3px}
  .chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#4a515c;cursor:pointer;
       padding:3px 6px;border-radius:6px;margin-bottom:2px}
  .chk:hover{background:#eff1f4}
  .chk input{margin:0;cursor:pointer}
  #side .chk{display:flex;font-size:12px}

  #stage{position:relative;flex:1;min-height:0;overflow-y:auto;padding:14px 16px 46px;background:#fff}

  .caja{border:1px solid #e0e3e8;border-radius:11px;background:#fff;margin-bottom:4px}
  .caja.foco{border-color:#b9c8de;box-shadow:0 0 0 3px rgba(47,98,168,.07)}
  .cab{display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:8px 11px;border-bottom:1px solid #eef0f3}
  .cab .rot{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#8a919c;font-weight:600}
  select.selc{border:1px solid #d5d9e0;background:#fff;border-radius:7px;padding:4px 6px;
              font:inherit;font-size:13px;color:#2b2f36;cursor:pointer}
  .cab input.num{width:118px;border:1px solid #d5d9e0;border-radius:7px;padding:4px 7px;font:inherit;font-size:13px}
  .cab .tipo{font-size:11.5px;color:#8a919c;margin-left:auto;text-align:right}

  .lienzo{min-height:104px;padding:12px 11px;display:flex;align-items:center;
          overflow-x:auto;overflow-y:hidden}
  .lienzo svg{display:block;flex:0 0 auto}
  .lienzo .vacio{color:#b3b9c2;font-size:12.5px;font-style:italic}
  .lienzo g.tk{cursor:pointer}
  .lienzo g.tk:hover{opacity:.45}

  .valor{padding:0 11px 9px;font-size:12.5px;color:#6b7280}
  .valor b{color:#2b2f36;font-size:14px}
  .solu{padding:0 11px 10px}
  .solu .rot{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#a2a9b4;
             font-weight:600;display:block;margin-bottom:3px}
  .solu .cont{border:1px dashed #dfe2e7;border-radius:8px;padding:7px 9px;overflow-x:auto;background:#fbfcfd}

  .paleta{display:flex;flex-wrap:wrap;gap:5px;padding:9px 11px;border-top:1px solid #eef0f3;align-items:flex-end}
  .sim{border:1px solid #d5d9e0;background:#fff;border-radius:7px;padding:4px 6px;cursor:pointer;
       display:inline-flex;flex-direction:column;align-items:center;gap:2px;min-width:38px}
  .sim:hover{background:#f0f2f5;border-color:#c8cdd6}
  .sim svg{display:block}
  .sim .et{font-size:9.5px;color:#8a919c;line-height:1}
  .sim.esp{min-width:auto;padding:6px 9px;font-size:12px;color:#3d4450}
  .paleta .hueco{flex:1 1 6px}

  .pie{display:flex;flex-wrap:wrap;align-items:center;gap:9px;padding:9px 11px;border-top:1px solid #eef0f3}
  .msg{font-size:12.5px;line-height:1.4}
  .msg.bien{color:#15803d}
  .msg.mal{color:#c2410c}
  .msg.neutro{color:#6b7280}

  .entre{display:flex;align-items:center;gap:10px;margin:9px 0 9px;padding:0 2px}
  .entre #enun{font-size:12.5px;color:#4a515c;line-height:1.4}
  .entre #enun b{color:#2b2f36}

  #hint{position:absolute;left:12px;bottom:10px;background:rgba(28,32,38,.82);color:#fff;font-size:11.5px;
        padding:5px 10px;border-radius:14px;pointer-events:none;max-width:calc(100% - 24px)}
  #info,#inv{position:absolute;right:12px;top:52px;width:328px;max-height:calc(100% - 74px);overflow-y:auto;
        background:#fff;border:1px solid #dfe2e7;border-radius:10px;padding:12px 14px;font-size:11.5px;
        line-height:1.55;color:#4a515c;box-shadow:0 6px 22px rgba(20,25,35,.12);display:none;z-index:5}
  #info.show,#inv.show{display:block}
  #info b,#inv b{color:#2b2f36}
  #info a{color:#2f62a8}
  #info .lic{margin-top:9px;padding-top:8px;border-top:1px solid #eef0f3;font-size:10.5px;
             line-height:1.5;color:#8a919c}
  #inv h3{font-size:13px;margin:0 0 9px;color:#2b2f36}
  #inv h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#8a919c;margin:13px 0 6px;font-weight:600}
  #inv label.lin{display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:11.5px}
  #inv label.lin span{flex:0 0 76px;color:#6b7280}
  #inv input[type=text],#inv input[type=number],#inv select{flex:1;min-width:0;border:1px solid #d5d9e0;
      border-radius:7px;padding:5px 7px;font:inherit;font-size:12.5px;color:#2b2f36;background:#fff}
  #inv .rej{display:flex;flex-wrap:wrap;gap:4px}
  #inv .rej .cel{display:flex;flex-direction:column;align-items:center;gap:2px}
  #inv .rej .cel input{width:40px;text-align:center;border:1px solid #d5d9e0;border-radius:6px;
      padding:4px 2px;font:inherit;font-size:15px}
  #inv .rej .cel span{font-size:9.5px;color:#a2a9b4}
  #inv .bar{display:flex;gap:5px;margin-top:12px;padding-top:10px;border-top:1px solid #eef0f3}
  #inv .aviso{font-size:11px;color:#c2410c;margin-top:7px;min-height:14px}

  @media (max-width:720px){
    #side{width:150px;flex:0 0 150px;padding:8px 6px}
    .btn{padding:5px 7px;font-size:12px}
    #info,#inv{width:auto;left:12px}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand">Sistemas <b>numéricos</b></div>

    <h2>Qué se hace</h2>
    <select class="sel" id="modosel" title="En libre se escribe lo que se quiera; en retos, el programa propone el número">
      <option value="libre">Escribir y traducir</option>
      <option value="reto">Retos</option>
    </select>

    <div id="retobox" style="display:none">
      <div class="fila">
        <label>Serie</label>
        <input type="number" id="semilla" min="1" max="99999" step="1" value="1386"
               title="Con la misma serie salen los mismos retos: toda la clase puede trabajar los mismos">
        <button class="act" id="otraserie" title="Otra serie al azar">↺</button>
      </div>
      <select class="sel" id="rangosel" title="Hasta qué número llegan los retos">
        <option value="20">Números hasta 20</option>
        <option value="100" selected>Números hasta 100</option>
        <option value="1000">Números hasta 1000</option>
        <option value="10000">Números hasta 10 000</option>
        <option value="0">Lo que admita el sistema</option>
      </select>
      <button class="act" id="nuevoreto">▸ Otro reto</button>
      <div id="marcador"></div>
    </div>

    <h2>Presentación</h2>
    <label class="chk" title="Escribe debajo de cada caja el número que vale lo escrito. Déjalo apagado mientras eso sea lo que hay que averiguar."><input type="checkbox" id="chkval">Cuánto vale</label>
    <label class="chk" title="Enseña la escritura correcta debajo de la caja de abajo. Déjalo apagado mientras sea lo que hay que encontrar."><input type="checkbox" id="chksol">La escritura correcta</label>

    <h2>Sistemas</h2>
    <button class="act" id="invbtn">✎ Inventar un sistema…</button>

    <div id="ficha"></div>
    <div class="note">Pincha en un símbolo de la caja para quitarlo. Con el teclado también se escribe: las cifras y las letras van directas.</div>
  </aside>

  <main>
    <div id="toolbar">
      <button class="btn" id="swap" title="Cambiar el de arriba por el de abajo">⇅ Intercambiar</button>
      <span class="sep"></span>
      <span style="font-size:12px;color:#8a919c">Tamaño</span>
      <button class="btn" id="zoomout" title="Símbolos más pequeños">−</button>
      <button class="btn" id="zoomin" title="Símbolos más grandes">+</button>
      <span class="sep"></span>
      <button class="btn" id="undo" title="Deshacer (Ctrl+Z)">↶</button>
      <button class="btn" id="borraA" title="Vaciar la caja de arriba">Vaciar arriba</button>
      <button class="btn" id="borraB" title="Vaciar la caja de abajo">Vaciar abajo</button>
      <span class="sep"></span>
      <button class="btn" id="save" title="Descargar en un archivo">⤓ Guardar</button>
      <button class="btn" id="open" title="Abrir un archivo guardado">⤒ Abrir</button>
      <button class="btn" id="png" title="Descargar imagen de las dos cajas">⤓ PNG</button>
      <button class="btn" id="help">?</button>
      <input type="file" id="fileIn" accept=".json,application/json" style="display:none">
    </div>

    <div id="stage">
      <section class="caja" id="cajaA">
        <div class="cab">
          <span class="rot" id="rotA">El número</span>
          <select class="selc" id="sisA"></select>
          <span id="extraA"></span>
          <span class="tipo" id="tipoA"></span>
        </div>
        <div class="lienzo" id="lienzoA"></div>
        <div class="valor" id="valorA" style="display:none"></div>
        <div class="paleta" id="palA"></div>
      </section>

      <div class="entre">
        <span id="enun"></span>
      </div>

      <section class="caja" id="cajaB">
        <div class="cab">
          <span class="rot" id="rotB">Escríbelo en</span>
          <select class="selc" id="sisB"></select>
          <span id="extraB"></span>
          <span class="tipo" id="tipoB"></span>
        </div>
        <div class="lienzo" id="lienzoB"></div>
        <div class="valor" id="valorB" style="display:none"></div>
        <div class="solu" id="soluB" style="display:none"></div>
        <div class="paleta" id="palB"></div>
        <div class="pie">
          <button class="btn prim" id="comprobar">Comprobar</button>
          <span class="msg neutro" id="msg"></span>
        </div>
      </section>
    </div>

    <div id="hint"></div>
    <div id="info"></div>
    <div id="inv"></div>
  </main>
</div>

<script>
"use strict";
(function(){

/* =========================================================================
   1. LA IDEA / LOS SISTEMAS

   La restricción que lo condiciona todo: un sistema de numeración no es una
   colección de dibujos bonitos, son TRES DATOS —el tipo, la base y los
   símbolos— y de ellos salen mecánicamente la escritura y la lectura. Por eso
   aquí no hay un traductor por cada cultura: hay UN motor con tres reglas
   (aditiva, híbrida y posicional) y cada sistema histórico es solo una tabla
   de datos que lo alimenta. Inventar un sistema es, exactamente, rellenar esa
   tabla; y por eso el sistema inventado se maneja igual que el egipcio.

     · ADITIVO      símbolos para 1, b, b², b³… El número se escribe repitiendo
                    cada símbolo tantas veces como haga falta, y vale la SUMA.
                    Con base auxiliar (romano: 5, 50, 500) y, si se quiere, con
                    principio sustractivo (IV = 5 − 1).
     · HÍBRIDO      además hay símbolos para 1, 2, …, b−1, que multiplican a la
                    potencia que llevan detrás. 79564 = 7·10⁴ 9·10³ 5·10² 6·10 4.
                    Puede tener base auxiliar de agrupación (chino y japonés
                    agrupan de cuatro en cuatro cifras: 万, 億, 兆).
     · POSICIONAL   símbolos SOLO para 0, 1, …, b−1, y ninguno para la base ni
                    para sus potencias: eso lo dice el LUGAR. Las cifras pueden
                    ser un símbolo suelto (nosotros) o a su vez una escritura
                    aditiva (babilonio: base 60 con cifras en base 10; maya:
                    base 20 con cifras de puntos y barras).

   Todos los glifos se dibujan aquí dentro, con trazos propios, salvo los que
   son texto (cifras, letras romanas, caracteres chinos y japoneses). Así el
   archivo no depende de que el ordenador del aula tenga una fuente de
   jeroglíficos o de cuneiforme instalada, que es justo lo que no va a tener.
   ========================================================================= */

/* --- Los glifos dibujados ------------------------------------------------
   Cada glifo vive en un sistema de coordenadas donde 100 es la altura
   nominal de una línea de escritura. Declara su caja (w × h) y sus trazos, y
   la maquetación los coloca alineados por abajo, que es como se apoyan en el
   renglón los símbolos de todos estos sistemas. */
var DIB = {
  /* egipcios */
  eg1:   {w:20, h:88, t:[{p:'M10 6 L10 82', s:9}]},
  eg10:  {w:54, h:74, t:[{p:'M7 70 C7 6 47 6 47 70', s:9}]},
  eg100: {w:54, h:76, t:[{p:'M6 72 C6 14 48 8 48 38 C48 62 20 66 20 46 C20 34 32 30 38 38', s:8}]},
  eg1000:{w:54, h:96, t:[{p:'M27 92 L27 48', s:7},
                         {p:'M14 92 C20 85 34 85 40 92', s:6},
                         {p:'M27 48 L27 5', s:7},
                         {p:'M27 48 C13 39 7 20 11 5', s:6},
                         {p:'M27 48 C41 39 47 20 43 5', s:6}]},
  eg10000:{w:42,h:90, t:[{p:'M12 86 L12 32 C12 12 22 4 29 9 C34 13 33 24 30 32 L30 86', s:8},
                         {p:'M15 27 C19 20 27 20 30 26', s:5}]},
  eg1e5: {w:58, h:86, t:[{p:'M18 26 m -13 0 a 13 13 0 1 0 26 0 a 13 13 0 1 0 -26 0', s:7},
                         {p:'M30 32 C44 38 46 54 40 64 C34 74 42 82 52 80', s:7}]},
  eg1e6: {w:60, h:92, t:[{p:'M30 20 m -9 0 a 9 9 0 1 0 18 0 a 9 9 0 1 0 -18 0', s:7},
                         {p:'M8 10 L18 34 L30 39 L42 34 L52 10', s:7},
                         {p:'M30 39 L30 62', s:7},
                         {p:'M30 62 L14 76 L14 88 L48 88', s:7}]},
  /* cuneiformes: el clavo (1) y la espiga (10) */
  clavo: {w:24, h:88, t:[{p:'M3 6 L21 6 L12 84 Z', f:1}]},
  espiga:{w:52, h:52, t:[{p:'M4 5 L48 5 L6 48 Z', f:1}]},
  /* fichas de arcilla sumerias */
  conoP: {w:30, h:34, t:[{p:'M15 2 L28 32 L2 32 Z', s:6}]},
  bolaP: {w:28, h:28, t:[{p:'M14 14 m -11 0 a 11 11 0 1 0 22 0 a 11 11 0 1 0 -22 0', s:6}]},
  conoG: {w:52, h:60, t:[{p:'M26 3 L49 57 L3 57 Z', s:6}]},
  conoGP:{w:52, h:60, t:[{p:'M26 3 L49 57 L3 57 Z', s:6},
                         {p:'M26 42 m -6 0 a 6 6 0 1 0 12 0 a 6 6 0 1 0 -12 0', f:1}]},
  bolaG: {w:52, h:52, t:[{p:'M26 26 m -22 0 a 22 22 0 1 0 44 0 a 22 22 0 1 0 -44 0', s:6}]},
  bolaGP:{w:52, h:52, t:[{p:'M26 26 m -22 0 a 22 22 0 1 0 44 0 a 22 22 0 1 0 -44 0', s:6},
                         {p:'M26 26 m -6 0 a 6 6 0 1 0 12 0 a 6 6 0 1 0 -12 0', f:1}]},
  /* mayas */
  punto: {w:24, h:24, t:[{p:'M12 12 m -9 0 a 9 9 0 1 0 18 0 a 9 9 0 1 0 -18 0', f:1}]},
  barra: {w:80, h:20, t:[{p:'M4 4 L76 4 L76 16 L4 16 Z', f:1}]},
  concha:{w:80, h:38, t:[{p:'M6 19 C6 6 22 3 40 3 C58 3 74 6 74 19 C74 30 58 35 40 35 C22 35 6 30 6 19 Z', s:6},
                         {p:'M24 6 C22 16 22 24 26 33', s:4},
                         {p:'M40 4 C39 16 39 24 40 34', s:4},
                         {p:'M56 6 C58 16 58 24 54 33', s:4}]}
};

/* Un símbolo es o un dibujo de la tabla de arriba, o texto. El texto lleva su
   familia porque un carácter chino y una letra latina no ocupan lo mismo: la
   caja de un ideograma es cuadrada y la de una letra, estrecha. */
function gD(id){ return {k:'d', d:id}; }
function gT(c){  return {k:'t', c:c, cjk:(c.charCodeAt(0)>0x2000)}; }

var LAT='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function cifrasLatinas(b){ var a=[],i; for(i=0;i<b;i++) a.push(gT(LAT.charAt(i))); return a; }

/* --- La tabla de sistemas ------------------------------------------------ */
var SIS={}, ORDEN=[];
function defSis(o){ SIS[o.id]=o; ORDEN.push(o.id); return o; }

defSis({id:'dec', nom:'Nuestro sistema (decimal)', tipo:'pos', base:10, max:999999999,
  cifras:cifrasLatinas(10),
  nota:'Posicional de base 10. Hay símbolos para el cero y para los nueve primeros números, y ninguno para diez ni para sus potencias: eso lo dice el LUGAR que ocupa cada cifra.'});

defSis({id:'egi', nom:'Egipcio (jeroglífico)', tipo:'adi', base:10, apila:4, max:9999999,
  piezas:[{v:1000000,g:gD('eg1e6')},{v:100000,g:gD('eg1e5')},{v:10000,g:gD('eg10000')},
          {v:1000,g:gD('eg1000')},{v:100,g:gD('eg100')},{v:10,g:gD('eg10')},{v:1,g:gD('eg1')}],
  nota:'Aditivo de base 10: un símbolo para el uno y otro para cada potencia de diez, y se repiten tantas veces como haga falta. El número vale la suma, así que el orden en que se escriben no cambia nada.'});

defSis({id:'rom', nom:'Romano', tipo:'adi', base:10, apila:0, max:3999, sustractivo:true,
  piezas:[{v:1000,g:gT('M')},{v:500,g:gT('D')},{v:100,g:gT('C')},{v:50,g:gT('L')},
          {v:10,g:gT('X')},{v:5,g:gT('V')},{v:1,g:gT('I')}],
  escalera:[[1000,[1000]],[900,[100,1000]],[500,[500]],[400,[100,500]],[100,[100]],[90,[10,100]],
            [50,[50]],[40,[10,50]],[10,[10]],[9,[1,10]],[5,[5]],[4,[1,5]],[1,[1]]],
  nota:'Aditivo de base 10 con base auxiliar 5 (V, L, D) y una irregularidad: un símbolo colocado delante de otro mayor se RESTA, y por eso aquí el orden sí importa.'});

defSis({id:'chi', nom:'Chino', tipo:'hib', base:10, unoDesde:1, ceroInterno:true, max:999999999,
  mult:[null,gT('一'),gT('二'),gT('三'),gT('四'),gT('五'),gT('六'),gT('七'),gT('八'),gT('九')],
  pot:[{e:1,g:gT('十')},{e:2,g:gT('百')},{e:3,g:gT('千')}],
  grupo:{tam:4, marcas:[{e:4,g:gT('萬')},{e:8,g:gT('億')}]},
  cero:gT('零'),

/* Los sistemas inventados se guardan aquí y se añaden a los desplegables. */
var INVENTADOS=[];

function sisDe(id){ return SIS[id]; }
function esInventado(s){ return s && s.id.indexOf('inv')===0; }

/* =========================================================================
   2. ESTADO

   Una sola fuente de verdad: lo que hay escrito en la caja de ARRIBA es el
   número. Tanto en modo libre como en retos —donde el programa se limita a
   rellenarla y a bloquear su paleta—, el número al que hay que llegar sale
   siempre de leer la caja de arriba con las reglas de su sistema. Así no hay
   dos números que se puedan desincronizar.
   ========================================================================= */
var est={
  modo:'libre',
  A:{sis:'dec', toks:[]},
  B:{sis:'egi', toks:[]},
  esc:0.40,                 /* píxeles por unidad de glifo (100 = alto de línea) */
  serie:1386, tiro:0, aciertos:0, intentos:0, resuelto:false,
  verVal:false, verSol:false, rango:100
};
var undoStack=[], MAXU=60;

function copiaEst(){ return {A:{sis:est.A.sis,toks:est.A.toks.slice()},
                             B:{sis:est.B.sis,toks:est.B.toks.slice()},
                             baseBas:SIS.bas.base}; }
function pushUndo(){ undoStack.push(JSON.stringify(copiaEst())); if(undoStack.length>MAXU) undoStack.shift(); }
function doUndo(){
  if(!undoStack.length) return false;
  var d=JSON.parse(undoStack.pop());
  est.A.sis=d.A.sis; est.A.toks=d.A.toks; est.B.sis=d.B.sis; est.B.toks=d.B.toks;
  if(d.baseBas) SIS.bas.base=d.baseBas;
  sincronizaCabeceras(); pinta(); return true;
}

/* =========================================================================
   3. ESCRITURA Y LECTURA

   El corazón del material. Dos funciones por sistema:
     escribe(sis,n)  -> la lista de símbolos de la escritura canónica
     valor(sis,toks) -> lo que vale una escritura CUALQUIERA, sea canónica o no
   La segunda es la importante: es la que permite que el alumnado escriba lo
   que quiera y el material le diga cuánto ha escrito, en vez de limitarse a
   comparar con la respuesta buena. Escribir 20 con veinte trazos egipcios no
   es un error de valor, es un error de escritura, y son cosas distintas.
   ========================================================================= */

/* --- el alfabeto: la lista de símbolos manejables de un sistema ---------- */
var cacheAlf={};
function claveAlf(s){ return s.id+'|'+s.base+'|'+(s.rev||0); }
function alf(s){
  var k=claveAlf(s);
  if(cacheAlf[k]) return cacheAlf[k];
  var a=[], i, b=s.base;
  if(s.tipo==='adi'){
    for(i=0;i<s.piezas.length;i++) a.push({id:'a'+i, rol:'p', v:s.piezas[i].v, g:s.piezas[i].g});
  }else if(s.tipo==='hib'){
    for(i=1;i<b;i++) if(s.mult[i]) a.push({id:'m'+i, rol:'m', v:i, g:s.mult[i]});
    for(i=0;i<s.pot.length;i++) a.push({id:'p'+s.pot[i].e, rol:'p', e:s.pot[i].e,
                                        v:Math.pow(b,s.pot[i].e), g:s.pot[i].g});
    if(s.grupo) for(i=0;i<s.grupo.marcas.length;i++)
      a.push({id:'g'+s.grupo.marcas[i].e, rol:'g', e:s.grupo.marcas[i].e,
              v:Math.pow(b,s.grupo.marcas[i].e), g:s.grupo.marcas[i].g});
    if(s.cero) a.push({id:'z', rol:'z', v:0, g:s.cero});
  }else if(s.cifraAdit){
    var ca=s.cifraAdit;
    for(i=0;i<ca.piezas.length;i++) a.push({id:'s'+i, rol:'s', v:ca.piezas[i].v, g:ca.piezas[i].g,
                                            ap:ca.piezas[i].ap||3, ord:i});
    if(ca.cero) a.push({id:'z', rol:'s', v:0, g:ca.cero, ap:1, ord:ca.piezas.length});
    a.push({id:'|', rol:'sep'});
  }else{
    var cf=s.cifras || cifrasLatinas(b);
    for(i=0;i<b;i++) a.push({id:'c'+i, rol:'c', v:i, g:cf[i]});
  }
  cacheAlf[k]=a; return a;
}
var cacheMapa={};
function mapa(s){
  var k=claveAlf(s);
  if(cacheMapa[k]) return cacheMapa[k];
  var m={}, a=alf(s), i;
  for(i=0;i<a.length;i++) m[a[i].id]=a[i];
  cacheMapa[k]=m; return m;
}
function olvidaCache(){ cacheAlf={}; cacheMapa={}; cacheTxt={}; }

function maxDe(s){
  if(s.max) return s.max;
  if(s.tipo==='adi') return s.piezas[0].v*10-1;
  if(s.tipo==='hib') return Math.pow(s.base, s.pot.length+1)-1;
  return 999999999;
}

/* --- escribir ----------------------------------------------------------- */
function idPorValor(s,v){
  var i; for(i=0;i<s.piezas.length;i++) if(s.piezas[i].v===v) return 'a'+i;
  return null;
}
function escAdi(s,n){
  var out=[], i, j, vs, c;
  if(s.escalera){
    for(i=0;i<s.escalera.length;i++){
      while(n>=s.escalera[i][0]){
        vs=s.escalera[i][1];
        for(j=0;j<vs.length;j++) out.push(idPorValor(s,vs[j]));
        n-=s.escalera[i][0];
      }
    }
    return n===0?out:null;
  }
  for(i=0;i<s.piezas.length;i++){
    c=Math.floor(n/s.piezas[i].v);
    while(c-->0) out.push('a'+i);
    n=n%s.piezas[i].v;
  }
  return n===0?out:null;
}
function trozoHib(s,m){
  var b=s.base, out=[], K=s.pot.length, i, d, p, hueco=false, esc=false;
  for(i=K;i>=0;i--){
    p=Math.pow(b,i); d=Math.floor(m/p)%b;
    if(d===0){ if(esc) hueco=true; continue; }
    if(hueco && s.ceroInterno && s.cero) out.push('z');
    hueco=false;
    if(!(d===1 && i>0 && i<=(s.unoDesde||0))) out.push('m'+d);
    if(i>0) out.push('p'+i);
    esc=true;
  }
  return out;
}
function escHib(s,n){
  var b=s.base, out=[], i;
  if(n===0) return s.cero?['z']:[];
  if(s.grupo){
    var T=s.grupo.tam, G=Math.pow(b,T), gs=[], m=n, esc=false, tope=T-1;
    while(m>0){ gs.push(m%G); m=Math.floor(m/G); }
    if((gs.length-1)*T > s.grupo.marcas[s.grupo.marcas.length-1].e) return null;
    for(i=gs.length-1;i>=0;i--){
      if(gs[i]===0) continue;
      if(esc && s.ceroInterno && s.cero && gs[i]<Math.pow(b,tope)) out.push('z');
      out=out.concat(trozoHib(s,gs[i]));
      if(i>0) out.push('g'+(i*T));
      esc=true;
    }
    return out;
  }
  return trozoHib(s,n);
}
function cifraToks(s,d){
  var ca=s.cifraAdit, out=[], ord, i, c, m=d;
  if(d===0) return ca.cero?['z']:[];
  ord=[]; for(i=0;i<ca.piezas.length;i++) ord.push(i);
  ord.sort(function(x,y){ return ca.piezas[y].v-ca.piezas[x].v; });
  for(i=0;i<ord.length;i++){
    c=Math.floor(m/ca.piezas[ord[i]].v);
    while(c-->0) out.push('s'+ord[i]);
    m=m%ca.piezas[ord[i]].v;
  }
  out.sort(function(x,y){ return (+x.slice(1))-(+y.slice(1)); });
  return out;
}
function cifrasDe(s,n){
  var b=s.base, ds=[], m=n;
  if(n===0) return [0];
  while(m>0){ ds.unshift(m%b); m=Math.floor(m/b); }
  return ds;
}
function escPos(s,n){
  var ds=cifrasDe(s,n), out=[], i;
  if(!s.cifraAdit){ for(i=0;i<ds.length;i++) out.push('c'+ds[i]); return out; }
  for(i=0;i<ds.length;i++){ if(i>0) out.push('|'); out=out.concat(cifraToks(s,ds[i])); }
  return out;
}
function escribe(s,n){
  if(!isFinite(n) || n<0 || n!==Math.round(n) || n>maxDe(s)) return null;
  if(s.tipo==='adi') return escAdi(s,n);
  if(s.tipo==='hib') return escHib(s,n);
  return escPos(s,n);
}

/* --- leer --------------------------------------------------------------- */
var AJENO='hay algún símbolo que no es de este sistema';
function valAdi(s,toks){
  var m=mapa(s), vs=[], i, e, tot=0;
  for(i=0;i<toks.length;i++){ e=m[toks[i]]; if(!e) return {ok:false,motivo:AJENO}; vs.push(e.v); }
  if(s.sustractivo){
    for(i=0;i<vs.length;i++) tot += (i<vs.length-1 && vs[i]<vs[i+1]) ? -vs[i] : vs[i];
  }else{
    for(i=0;i<vs.length;i++) tot+=vs[i];
  }
  if(tot<0) return {ok:false, motivo:'así, restando, no sale ningún número'};
  return {ok:true, n:tot};
}
function valHib(s,toks){
  var m=mapa(s), b=s.base, tot=0, gr=0, act=null, prev=false, i, e;
  for(i=0;i<toks.length;i++){
    e=m[toks[i]]; if(!e) return {ok:false,motivo:AJENO};
    if(e.rol==='m'){
      if(prev) return {ok:false, motivo:'hay dos cifras seguidas sin potencia en medio, y eso aquí no dice nada'};
      act=e.v; prev=true; continue;
    }
    prev=false;
    if(e.rol==='p'){ gr += (act===null?1:act)*Math.pow(b,e.e); act=null; }
    else if(e.rol==='g'){ gr += (act===null?0:act); tot += gr*Math.pow(b,e.e); gr=0; act=null; }
  }
  tot += gr + (act===null?0:act);
  return {ok:true, n:tot};
}
function valPos(s,toks){
  var m=mapa(s), b=s.base, i, j, e, n=0;
  if(!s.cifraAdit){
    for(i=0;i<toks.length;i++){
      e=m[toks[i]]; if(!e||e.rol!=='c') return {ok:false,motivo:AJENO};
      n=n*b+e.v;
      if(n>1e14) return {ok:false, motivo:'ese número se sale de lo que este material maneja'};
    }
    return {ok:true, n:n};
  }
  var celdas=[[]], cur=0, s2;
  for(i=0;i<toks.length;i++){
    if(toks[i]==='|'){ celdas.push([]); cur++; continue; }
    e=m[toks[i]]; if(!e) return {ok:false,motivo:AJENO};
    celdas[cur].push(e.v);
  }
  for(i=0;i<celdas.length;i++){
    s2=0; for(j=0;j<celdas[i].length;j++) s2+=celdas[i][j];
    if(s2>=b) return {ok:false, motivo:'una posición suma '+s2+', y en base '+b+' ninguna puede llegar a '+b};
    n=n*b+s2;
    if(n>1e14) return {ok:false, motivo:'ese número se sale de lo que este material maneja'};
  }
  return {ok:true, n:n};
}
function valor(s,toks){
  if(!toks || !toks.length) return {ok:false, vacio:true, motivo:'no hay nada escrito'};
  if(s.tipo==='adi') return valAdi(s,toks);
  if(s.tipo==='hib') return valHib(s,toks);
  return valPos(s,toks);
}

/* ¿Está escrito como se escribe en ese sistema? En los aditivos sin principio
   sustractivo el orden es libre —el número vale la suma—, así que se comparan
   los MONTONES de símbolos; en los demás, la secuencia entera. Distinguir esto
   de «vale otra cosa» es media gracia del material: veinte trazos egipcios
   valen veinte, pero no es así como se escribe veinte. */
function multiset(a){ var m={},i; for(i=0;i<a.length;i++) m[a[i]]=(m[a[i]]||0)+1; return m; }
function mismoMultiset(a,b){
  var x=multiset(a), y=multiset(b), k;
  for(k in x) if(x[k]!==y[k]) return false;
  for(k in y) if(x[k]!==y[k]) return false;
  return true;
}
function mismaLista(a,b){
  var i; if(a.length!==b.length) return false;
  for(i=0;i<a.length;i++) if(a[i]!==b[i]) return false;
  return true;
}
function esCanonica(s,toks,n){
  var c=escribe(s,n);
  if(!c) return false;
  if(s.tipo==='adi' && !s.sustractivo) return mismoMultiset(toks,c);
  return mismaLista(toks,c);
}

/* =========================================================================
   4. MAQUETACIÓN Y DIBUJO

   Todo lo que se ve —las cajas, los botones de la paleta y el PNG que se
   descarga— sale de UNA sola función de maquetación y UNA sola de pintado en
   SVG. Si hubiera un dibujante para la pantalla y otro para la imagen, tarde o
   temprano dirían cosas distintas.

   Las coordenadas son «unidades de glifo», donde 100 es el alto de una línea
   de escritura, y los símbolos se alinean POR ABAJO: es como se apoyan en el
   renglón el trazo egipcio, el clavo babilonio y la letra romana. La escala a
   píxeles se aplica al final, en un solo sitio.
   ========================================================================= */
var FCJK="'Yu Mincho','MS Mincho','Songti SC','SimSun','Noto Serif CJK SC','Microsoft YaHei',serif";
var FLAT="Georgia,'Segoe UI Symbol','Apple Symbols','Times New Roman',serif";
var GX=13, GY=9, GBLQ=22, GSEP=44, GVSEP=16;

function medida(g){
  if(g.k==='d'){ var d=DIB[g.d]; return {w:d.w, h:d.h}; }
  if(g.k==='sep') return {w:6, h:76};
  if(g.k==='vsep') return {w:84, h:6};
  if(g.k==='hueco') return {w:30, h:44};
  return {w:(g.cjk?96:62), h:100};
}
/* Los sistemas cuyos símbolos son todos texto —el romano, el chino, el nuestro,
   los inventados— se escriben apretados: una caja de letra ya trae su propio
   aire alrededor, y separarlas como se separan los trazos egipcios hace que
   MCCCLXXXVI parezca una lista y no un número. */
var cacheTxt={};
function esTexto(s){
  var k=claveAlf(s);
  if(cacheTxt[k]!==undefined) return cacheTxt[k];
  var a=alf(s), i, r=true;
  for(i=0;i<a.length;i++) if(a[i].g && a[i].g.k!=='t'){ r=false; break; }
  cacheTxt[k]=r; return r;
}
function gapX(s){ return esTexto(s)?6:GX; }
function gapB(s){ return esTexto(s)?8:GBLQ; }
function esc2(v){ v=Math.round(v*100)/100; return isFinite(v)?String(v):'0'; }
function escXML(t){
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
/* Pinta un glifo apoyado en la línea yb (su borde inferior) y con el izquierdo en x. */
function pintaGlifo(g,x,yb,out){
  var m=medida(g), i, t, d;
  if(g.k==='d'){
    d=DIB[g.d];
    out.push('<g transform="translate('+esc2(x)+','+esc2(yb-m.h)+')">');
    for(i=0;i<d.t.length;i++){
      t=d.t[i];
      out.push('<path d="'+t.p+'" '+(t.f
        ? 'fill="currentColor" stroke="none"'
        : 'fill="none" stroke="currentColor" stroke-width="'+t.s+'" stroke-linecap="round" stroke-linejoin="round"')+'/>');
    }
    out.push('</g>');
  }else if(g.k==='t'){
    out.push('<text x="'+esc2(x+m.w/2)+'" y="'+esc2(yb-13)+'" text-anchor="middle" '+
      'font-family="'+(g.cjk?FCJK:FLAT)+'" font-size="78" fill="currentColor">'+escXML(g.c)+'</text>');
  }else if(g.k==='sep'){
    out.push('<line x1="'+esc2(x+3)+'" y1="'+esc2(yb-m.h)+'" x2="'+esc2(x+3)+'" y2="'+esc2(yb)+
      '" stroke="#c3c9d2" stroke-width="4" stroke-dasharray="6 7" stroke-linecap="round"/>');
  }else if(g.k==='vsep'){
    out.push('<line x1="'+esc2(x)+'" y1="'+esc2(yb-3)+'" x2="'+esc2(x+m.w)+'" y2="'+esc2(yb-3)+
      '" stroke="#c3c9d2" stroke-width="4" stroke-dasharray="6 7" stroke-linecap="round"/>');
  }else if(g.k==='hueco'){
    out.push('<rect x="'+esc2(x)+'" y="'+esc2(yb-m.h)+'" width="'+esc2(m.w)+'" height="'+esc2(m.h)+
      '" rx="5" fill="none" stroke="#dfe2e7" stroke-width="3" stroke-dasharray="6 7"/>');
  }
}

/* --- montar cajas ------------------------------------------------------- */
/* Cuántos símbolos iguales caben por fila. Con nueve trazos egipcios salen
   tres filas de tres, que es como los escribían; con siete, cuatro y tres. */
function repartoFilas(n,ap){
  if(ap<=0 || n<=ap) return [n];
  var f=Math.ceil(n/ap), b=Math.floor(n/f), r=n%f, out=[], i;
  for(i=0;i<f;i++) out.push(b+(i<r?1:0));
  return out;
}
function despl(b,dx,dy,out){
  var i,it;
  for(i=0;i<b.items.length;i++){
    it=b.items[i];
    out.push({g:it.g, ti:it.ti, x:it.x+dx, y:it.y+dy, w:it.w, h:it.h});
  }
}
function bloque(g,idxs,ap,gx){
  var m=medida(g), fs=repartoFilas(idxs.length,ap), i, j, y=0, w=0, x, an, items=[], k=0;
  for(i=0;i<fs.length;i++){ an=fs[i]*m.w+(fs[i]-1)*gx; if(an>w) w=an; }
  for(i=0;i<fs.length;i++){
    an=fs[i]*m.w+(fs[i]-1)*gx; x=(w-an)/2;
    for(j=0;j<fs[i];j++){ items.push({g:g, ti:idxs[k++], x:x, y:y, w:m.w, h:m.h}); x+=m.w+gx; }
    y+=m.h+GY;
  }
  return {w:w, h:y-GY, items:items};
}
function unBloque(g,ti){
  var m=medida(g);
  return {w:m.w, h:m.h, items:[{g:g, ti:ti, x:0, y:0, w:m.w, h:m.h}]};
}
function enFila(bs,gap){
  var i, h=0, x=0, items=[];
  for(i=0;i<bs.length;i++) if(bs[i].h>h) h=bs[i].h;
  for(i=0;i<bs.length;i++){ despl(bs[i],x,h-bs[i].h,items); x+=bs[i].w+gap; }
  return {w:Math.max(0,x-gap), h:h, items:items};
}
function enColumna(bs,gap){
  var i, w=0, y=0, items=[];
  for(i=0;i<bs.length;i++) if(bs[i].w>w) w=bs[i].w;
  for(i=0;i<bs.length;i++){ despl(bs[i],(w-bs[i].w)/2,y,items); y+=bs[i].h+gap; }
  return {w:w, h:Math.max(0,y-gap), items:items};
}
/* Agrupa los tokens iguales que van seguidos: son los que se apilan. */
function porRachas(s,toks,desde,hasta){
  var m=mapa(s), bs=[], i=desde, j, e;
  while(i<hasta){
    j=i; while(j<hasta && toks[j]===toks[i]) j++;
    e=m[toks[i]];
    if(!e){ bs.push(unBloque({k:'hueco'},i)); i++; continue; }
    var idxs=[], q; for(q=i;q<j;q++) idxs.push(q);
    bs.push(bloque(e.g, idxs, e.ap!==undefined?e.ap:(s.apila!==undefined?s.apila:0), gapX(s)));
    i=j;
  }
  return bs;
}
function maqueta(s,toks){
  if(!toks || !toks.length) return {w:0,h:0,items:[]};
  var m=mapa(s), i, bs;
  if(s.cifraAdit){
    /* posicional de cifras compuestas: se parte por los separadores */
    var celdas=[], seps=[], ini=0;
    for(i=0;i<toks.length;i++) if(toks[i]==='|'){ celdas.push([ini,i]); seps.push(i); ini=i+1; }
    celdas.push([ini,toks.length]);
    var piezas=[], c, sub;
    for(i=0;i<celdas.length;i++){
      c=celdas[i];
      if(c[1]<=c[0]) sub=unBloque({k:'hueco'},-1);
      else{
        var bl=porRachas(s,toks,c[0],c[1]);
        sub=(s.cifraAdit.dir==='v') ? enColumna(bl,GY+3) : enFila(bl,gapB(s));
      }
      piezas.push(sub);
      if(i<seps.length) piezas.push(unBloque({k:s.vertical?'vsep':'sep'}, seps[i]));
    }
    return s.vertical ? enColumna(piezas,GVSEP) : enFila(piezas,GSEP*0.5);
  }
  if(s.tipo==='adi'){
    bs=porRachas(s,toks,0,toks.length);
    return enFila(bs,gapB(s));
  }
  bs=[];
  for(i=0;i<toks.length;i++){
    var e=m[toks[i]];
    bs.push(e?unBloque(e.g,i):unBloque({k:'hueco'},i));
  }
  return enFila(bs,gapX(s));
}

/* --- SVG ---------------------------------------------------------------- */
function svgNumeral(s,toks,op){
  op=op||{};
  var mq=maqueta(s,toks), e=op.esc||est.esc, pad=op.pad===undefined?7:op.pad;
  var W=mq.w*e+2*pad, H=Math.max(mq.h*e,26)+2*pad;
  if(!isFinite(W)||!isFinite(H)) return '';
  var cuerpo='<g transform="translate('+esc2(pad)+','+esc2(pad+Math.max(0,(H-2*pad-mq.h*e)/2))+
             ') scale('+esc2(e)+')">'+itemsSVG(mq)+'</g>';
  var attr='width="'+esc2(Math.max(W,10))+'" height="'+esc2(Math.max(H,26))+'" viewBox="0 0 '+
           esc2(Math.max(W,10))+' '+esc2(Math.max(H,26))+'"';
  if(op.suelto) return '<svg xmlns="http://www.w3.org/2000/svg" '+attr+
      ' style="color:#2b2f36"><rect width="100%" height="100%" fill="#fff"/>'+cuerpo+'</svg>';
  return '<svg '+attr+' style="color:#2b2f36">'+cuerpo+'</svg>';
}
function svgUno(g,hpx){
  var m=medida(g), out=[];
  pintaGlifo(g,0,m.h,out);
  return '<svg width="'+esc2(m.w*hpx/m.h)+'" height="'+esc2(hpx)+'" viewBox="0 0 '+
         esc2(m.w)+' '+esc2(m.h)+'" style="color:#2b2f36">'+out.join('')+'</svg>';
}

/* --- etiquetas ---------------------------------------------------------- */
var SUPS='⁰¹²³⁴⁵⁶⁷⁸⁹';
function sup(n){ var s=String(n), o='', i; for(i=0;i<s.length;i++) o+=SUPS.charAt(+s.charAt(i)); return o; }
function numTxt(v){
  var s=String(v), o='', i, c=0;
  for(i=s.length-1;i>=0;i--){ o=s.charAt(i)+o; if(++c%3===0 && i>0) o=' '+o; }
  return o;
}
function etiqueta(v,base){
  if(v>=1000){
    var e=Math.round(Math.log(v)/Math.log(base));
    if(e>=2 && Math.pow(base,e)===v) return base+sup(e);
  }
  return numTxt(v);
}
function rotuloTipo(s){
  var t = s.tipo==='adi' ? 'aditivo' : (s.tipo==='hib' ? 'híbrido multiplicativo' : 'posicional');
  if(s.tipo==='adi' && s.sustractivo) t+=' con resta';
  if(s.cifraAdit) t+=', cifras aditivas';
  return t+' · base '+s.base;
}

    if(acierto) est.resuelto=true;

    else if(cn && cn.length<est.B.toks.length)

                 'el mismo número se puede escribir con menos símbolos.');

/* =========================================================================
   7. RETOS

   Con la misma serie salen los mismos números: toda la clase puede trabajar
   exactamente los mismos retos aunque cada cual esté en su ordenador, y la
   autocomprobación puede probar el generador. El generador es un xorshift de
   32 bits escrito a mano, sin Math.imul, que en los navegadores viejos de aula
   no siempre está.
   ========================================================================= */
function xs(st){ var x=st.s; x^=(x<<13); x>>>=0; x^=(x>>>17); x^=(x<<5); x>>>=0; st.s=x||0x9e3779b9; return st.s; }
function semillaDe(serie,k){
  var st={s:((serie|0)*2654435761 + (k|0)*40503 + 0x2545f491)>>>0 || 1}, i;
  for(i=0;i<6;i++) xs(st);
  return st;
}
function topeReto(){
  var mA=maxDe(sisLado('A')), mB=maxDe(sisLado('B')), t=Math.min(mA,mB);
  if(est.rango>0) t=Math.min(t,est.rango);
  return Math.max(1,t);
}
function numeroReto(serie,k){
  var st=semillaDe(serie,k), t=topeReto();
  /* Se sortea también la «longitud» para que no salgan casi siempre números
     grandes: con tope 1000, uno de cada tres estará por debajo de 100. */
  var ordenes=1+(xs(st)% (String(t).length)), tope=Math.min(t,Math.pow(10,ordenes)-1);
  var n=1+(xs(st)%tope);
  return Math.min(n,t);
}
function nuevoReto(){
  est.tiro++; est.resuelto=false;
  var sA=sisLado('A'), n=numeroReto(est.serie,est.tiro), c=escribe(sA,n), g=0;
  while((!c||!c.length) && g<40){ est.tiro++; n=numeroReto(est.serie,est.tiro); c=escribe(sA,n); g++; }
  est.A.toks=c||[]; est.B.toks=[];
  undoStack=[]; msgVacio(); sincronizaCabeceras(); pinta();
}

  var v=Math.round(+this.value)||1; est.serie=Math.max(1,Math.min(99999,v)); this.value=est.serie;
  est.tiro=0; est.aciertos=0; est.intentos=0; nuevoReto();
});

   usan el egipcio o el maya. Por eso el sistema inventado aparece en el mismo
   desplegable que los históricos y se maneja igual; no es una función aparte.
   ========================================================================= */
var POOL='▲●■◆★✚⬟⬢◐◑△□◇☆✖⬠⬡◒◓αβγδεζηθλμπρστφψωЖЛФЦЩЭЮ';

function construyeInv(d){
  var b=d.base, i, s={id:d.id, nom:d.nom, tipo:d.tipo, base:b, def:d, rev:(SIS[d.id]?(SIS[d.id].rev||0)+1:1)};
  if(d.tipo==='adi'){
    s.piezas=[]; s.apila=4;
    for(i=d.pots.length;i>=1;i--) s.piezas.push({v:Math.pow(b,i), g:gT(d.pots[i-1])});
    s.piezas.push({v:1, g:gT(d.cifras[0])});
    s.max=Math.pow(b,d.pots.length+1)-1;
    s.nota='Sistema inventado. Aditivo de base '+b+': el número vale la suma de los símbolos y el orden no cambia nada.';
  }else if(d.tipo==='hib'){
    s.mult=[null]; for(i=0;i<d.cifras.length;i++) s.mult.push(gT(d.cifras[i]));
    s.pot=[]; for(i=1;i<=d.pots.length;i++) s.pot.push({e:i, g:gT(d.pots[i-1])});
    s.unoDesde=0; s.ceroInterno=false; s.cero=null;
    s.max=Math.pow(b,d.pots.length+1)-1;
    s.nota='Sistema inventado. Híbrido multiplicativo de base '+b+': la cifra que va delante de una potencia dice cuántas veces se toma.';
  }else{
    s.cifras=[]; for(i=0;i<d.cifras.length;i++) s.cifras.push(gT(d.cifras[i]));
    s.max=999999999;
    s.nota='Sistema inventado. Posicional de base '+b+': solo hay símbolos para el cero y los '+(b-1)+' primeros números; lo demás lo dice el lugar.';
  }

function ajusta(){

function sortea(){
  var d=invEstado.d, us={}, pool=POOL.split(''), i, j;
  for(i=pool.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); var t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
  var k=0;
  for(i=0;i<d.cifras.length;i++) d.cifras[i]=pool[k++%pool.length];
  for(i=0;i<d.pots.length;i++) d.pots[i]=pool[k++%pool.length];

function validaInv(d){
  var vistos={}, todos=d.cifras.concat(d.pots), i;
  if(!d.nom || !d.nom.replace(/\s/g,'')) return 'Ponle un nombre.';
  if(!(d.base>=2 && d.base<=20)) return 'La base tiene que estar entre 2 y 20.';
  for(i=0;i<todos.length;i++){
    if(!todos[i]) return 'Falta algún símbolo.';
    if(vistos[todos[i]]) return 'El símbolo «'+todos[i]+'» está repetido, y entonces no se sabría qué dice.';
    vistos[todos[i]]=1;
  }
  if(d.tipo!=='pos' && Math.pow(d.base,d.pots.length+1)>1e12) return 'Con esa base son demasiadas potencias.';
  return null;
}

function itemsSVG(mq){
  var out=[], i, it;

    it=mq.items[i];
    out.push('<g class="tk" data-i="'+it.ti+'">');

    out.push('</g>');
  }
  return out.join('');
}
/* La imagen lleva las DOS cajas con el nombre y el tipo de cada sistema: lo
   que solo dice la interfaz no sale en el PNG, y sin saber de qué sistema es
   cada escritura la imagen no dice nada. */
function svgConjunto(){
  var sA=sisLado('A'), sB=sisLado('B'), e=0.46, pad=24, LH=30, gap=26;
  var mA=maqueta(sA,est.A.toks), mB=maqueta(sB,est.B.toks);
  var hA=Math.max(mA.h*e,34), hB=Math.max(mB.h*e,34);
  var W=Math.max(mA.w*e, mB.w*e, 320)+2*pad;
  var H=pad+LH+hA+gap+LH+hB+pad;
  if(!isFinite(W)||!isFinite(H)) return null;
  function rot(x,y,t){ return '<text x="'+esc2(x)+'" y="'+esc2(y)+'" font-family="'+FLAT+
    '" font-size="15" fill="#8a919c">'+escXML(t)+'</text>'; }
  function cuerpo(mq,x,y){ return '<g transform="translate('+esc2(x)+','+esc2(y)+') scale('+esc2(e)+
    ')" style="color:#2b2f36">'+itemsSVG(mq)+'</g>'; }
  var y=pad, out=[];
  out.push('<svg xmlns="http://www.w3.org/2000/svg" width="'+esc2(W)+'" height="'+esc2(H)+
           '" viewBox="0 0 '+esc2(W)+' '+esc2(H)+'">');
  out.push('<rect width="100%" height="100%" fill="#ffffff"/>');
  out.push(rot(pad, y+16, sA.nom+' — '+rotuloTipo(sA)));
  y+=LH; out.push(cuerpo(mA,pad,y)); y+=hA+gap*0.4;
  out.push('<line x1="'+esc2(pad)+'" y1="'+esc2(y)+'" x2="'+esc2(W-pad)+'" y2="'+esc2(y)+
           '" stroke="#e3e6eb" stroke-width="1"/>');
  y+=gap*0.6;
  out.push(rot(pad, y+16, sB.nom+' — '+rotuloTipo(sB)));
  y+=LH; out.push(cuerpo(mB,pad,y));
  out.push('</svg>');
  return out.join('');
}

   dice, o se rechaza entero. Con un token inventado el numeral se dibujaría
   con huecos y la lectura diría cosas raras sin que nadie supiera por qué. */
function limpiaToks(lista,s){
  if(!lista || typeof lista.length!=='number') return null;
  var m=mapa(s), out=[], i;
  if(lista.length>400) return null;
  for(i=0;i<lista.length;i++){
    if(typeof lista[i]!=='string') return null;
    if(lista[i]==='|'){ if(!s.cifraAdit) return null; out.push('|'); continue; }
    if(!m[lista[i]]) return null;
    out.push(lista[i]);
  }
  return out;
}
function limpiaDef(d){
  if(!d || typeof d!=='object') return null;
  if(typeof d.id!=='string' || !/^inv[0-9]+$/.test(d.id)) return null;
  if(['adi','hib','pos'].indexOf(d.tipo)<0) return null;
  var b=Math.round(d.base);
  if(!(b>=2 && b<=20)) return null;
  if(!d.cifras || typeof d.cifras.length!=='number') return null;
  var cif=[], pot=[], i;
  for(i=0;i<d.cifras.length;i++){ if(typeof d.cifras[i]!=='string' || !d.cifras[i]) return null; cif.push(d.cifras[i].charAt(0)); }
  if(d.tipo!=='pos'){
    if(!d.pots || typeof d.pots.length!=='number' || d.pots.length<1 || d.pots.length>6) return null;
    for(i=0;i<d.pots.length;i++){ if(typeof d.pots[i]!=='string' || !d.pots[i]) return null; pot.push(d.pots[i].charAt(0)); }
  }
  if(cif.length!==cuantasCifras(d.tipo,b)) return null;
  var lim={id:d.id, nom:String(d.nom||'Sistema').slice(0,28), tipo:d.tipo, base:b, cifras:cif, pots:pot};
  if(validaInv(lim)) return null;
  return lim;
}
function loadData(d){
  if(!d || d.formato!=='sistemas-numericos'){ flash('Ese archivo no es de este material.'); return false; }
  var defs=[], i, lim;
  if(d.inventados && typeof d.inventados.length==='number'){
    if(d.inventados.length>30){ flash('Ese archivo trae demasiados sistemas inventados.'); return false; }
    for(i=0;i<d.inventados.length;i++){
      lim=limpiaDef(d.inventados[i]);
      if(!lim){ flash('Ese archivo trae un sistema inventado que no entiendo.'); return false; }

  if(d.baseOtra>=2 && d.baseOtra<=20){ SIS.bas.base=Math.round(d.baseOtra); olvidaCache(); }
  var idA=(d.A&&SIS[d.A.sis])?d.A.sis:est.A.sis, idB=(d.B&&SIS[d.B.sis])?d.B.sis:est.B.sis;
  var tA=limpiaToks(d.A&&d.A.toks, SIS[idA]), tB=limpiaToks(d.B&&d.B.toks, SIS[idB]);
  if(tA===null || tB===null){ flash('Ese archivo trae símbolos que no son de esos sistemas.'); return false; }
  pushUndo();
  est.A.sis=idA; est.A.toks=tA; est.B.sis=idB; est.B.toks=tB;
  if(d.modo==='reto'||d.modo==='libre'){ est.modo=d.modo; $('modosel').value=d.modo;
    $('retobox').style.display = est.modo==='reto'?'':'none'; }
  if(d.serie>=1 && d.serie<=99999){ est.serie=Math.round(d.serie); $('semilla').value=est.serie; }

}

                baseBas:SIS.bas.base, undo:undoStack.slice(),
                nInv:INVENTADOS.length, nOrden:ORDEN.length, invN:invN};

  try{
    var eg=SIS.egi, ro=SIS.rom, ch=SIS.chi, ja=SIS.jap, ba=SIS.bab, su=SIS.sum, ma=SIS.may, de=SIS.dec;

    /* --- egipcio: aditivo puro ------------------------------------------ */
    (function(){

      ok('y son un mil, tres cienes, ocho dieces y seis unos',

  est.modo=guardado.modo; est.verVal=guardado.verVal; est.verSol=guardado.verSol;
  est.rango=guardado.rango; est.serie=guardado.serie; est.tiro=guardado.tiro;
  est.aciertos=guardado.ac; est.intentos=guardado.it; est.resuelto=false;
  SIS.bas.base=guardado.baseBas; undoStack=guardado.undo;
  olvidaCache();
  $('modosel').value=est.modo;
  $('retobox').style.display = est.modo==='reto'?'':'none';
  $('chkval').checked=est.verVal; $('chksol').checked=est.verSol;
  $('semilla').value=est.serie; $('rangosel').value=String(est.rango);
  msgVacio(); sincronizaCabeceras(); pinta();

  var texto=out.join('\n');
  var box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;background:#fff;z-index:9999;overflow:auto;padding:22px 26px;'+
    'font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#2b2f36';
  box.innerHTML=
    '<div style="font:13px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;color:'+(fails?'#c2410c':'#15803d')+';font-weight:600;margin-bottom:12px">'+
      (fails? fails+' pruebas fallidas de '+out.length : 'Las '+out.length+' pruebas correctas')+'</div>'+
    '<button id="cpTest" style="font:13px -apple-system,Segoe UI,Roboto,sans-serif;padding:6px 12px;margin-bottom:14px;'+
      'border:1px solid #d5d9e0;border-radius:7px;background:#fff;cursor:pointer">Copiar informe</button> '+
    '<button id="clTest" style="font:13px -apple-system,Segoe UI,Roboto,sans-serif;padding:6px 12px;margin-bottom:14px;'+
      'border:1px solid #d5d9e0;border-radius:7px;background:#fff;cursor:pointer">Cerrar y usar el manipulativo</button>'+
    '<pre style="white-space:pre-wrap;margin:0">'+
      out.map(function(l){ return l.indexOf('FALLO')===0
        ? '<span style="color:#c2410c;font-weight:700">'+l+'</span>' : l; }).join('\n')+'</pre>';
  document.body.appendChild(box);
  document.getElementById('cpTest').addEventListener('click',function(){
    var ta=document.createElement('textarea'); ta.value=texto; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); }catch(err){}
    document.body.removeChild(ta); this.textContent='Copiado ✓';
  });
  document.getElementById('clTest').addEventListener('click',function(){ box.remove(); });
}
var testLanzado=false;
function lanzarTest(){ if(testLanzado) return; testLanzado=true; runSelfTest(); }
if((location.hash||'').indexOf('test')>=0) setTimeout(lanzarTest,60);
window.addEventListener('hashchange',function(){
  if((location.hash||'').indexOf('test')>=0) lanzarTest();
});

window.__sistemas={
  test:runSelfTest,
  SIS:SIS, ORDEN:ORDEN, est:est, alf:alf, mapa:mapa, maxDe:maxDe,
  escribe:escribe, valor:valor, esCanonica:esCanonica, cifraToks:cifraToks, cifrasDe:cifrasDe,
  maqueta:maqueta, svgNumeral:svgNumeral, svgConjunto:svgConjunto, repartoFilas:repartoFilas,
  numeroReto:numeroReto, topeReto:topeReto, nuevoReto:nuevoReto, comprueba:comprueba,
  registraInv:registraInv, validaInv:validaInv, datos:datos, load:loadData, limpiaToks:limpiaToks,
  pon:pon, quita:quita, vacia:vacia, doUndo:doUndo, pinta:pinta, cambiaSis:cambiaSis
};
